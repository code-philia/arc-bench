id: ROOT
name: PrestaShop B2C storefront
description:
  text: |-
    A B2C storefront for browsing products, selecting variants, managing a cart, completing checkout, and managing customer accounts.

    Displayed dates use UTC. The store date and time is 2026-10-06T12:00:00Z; elapsed time drives carousel behavior.

    The store provides existing verified customer accounts; account verification is outside scope. Address books start empty. Users create addresses such as Home through the address form. The historical-order account has a completed delivered order. New customer email and profile-next email are initially unused. No initial account cart contains products.

    Session, filters, selected combination, cart, checkout and recently viewed state reflect the corresponding user interactions.

    User-entered values such as registration details, address aliases, and new wishlist names are examples. The results reflect the actual values entered. Published products and existing account, order and wishlist records retain the specified values.

    The following existing verified accounts are named Store User, use password ShopPass123! and have birthdate 1995-08-21:
    - checkout_user: prestashop_checkout_user@example.com
    - checkout_address_user: prestashop_checkout_address_user@example.com
    - checkout_new_address_user: prestashop_checkout_new_address_user@example.com
    - checkout_invoice_user: prestashop_checkout_invoice_user@example.com
    - checkout_6_6_user: prestashop_checkout_6_6_user@example.com
    - checkout_6_7_user: prestashop_checkout_6_7_user@example.com
    - user: prestashop_user@example.com
    - profile_user: prestashop_profile_user@example.com
    - address_view_user: prestashop_address_view_user@example.com
    - address_create_user: prestashop_address_create_user@example.com
    - address_edit_user: prestashop_address_edit_user@example.com
    - address_delete_user: prestashop_address_delete_user@example.com
    - order_history_user: prestashop_order_history_user@example.com
    - wishlist_view_user: prestashop_wishlist_view_user@example.com
    - wishlist_create_user: prestashop_wishlist_create_user@example.com
    - wishlist_rename_user: prestashop_wishlist_rename_user@example.com
    - wishlist_delete_user: prestashop_wishlist_delete_user@example.com
    - wishlist_remove_user: prestashop_wishlist_remove_user@example.com
    - wishlist_cart_user: prestashop_wishlist_cart_user@example.com
scenarios: []
children:
- id: REQ-1
  name: Storefront discovery
  description:
    text: |-
      Visitors discover the homepage and navigate through persistent global controls. Homepage content includes carousel promotions, popular product cards with quick view and wishlist controls, promotion area, newsletter and footer. Visual presentation follows homepage.png and navigation.png.

      English action names are case-insensitive. Global navigation remains available across pages. Carousel active content is an image named for the current promotion; exactly one such image is visible.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Discover storefront content
    description:
      text: |-
        Opening the storefront while logged out displays "Global navigation", "Carousel", "Popular Products" containing Hummingbird detail t-shirt, "Promotions", "Newsletter", and the footer. Users navigate through "Logo", "CLOTHES", "Sign in", and "Cart", search with "Search", and access language selection through "Language". Cart count starts at 0. All controls are keyboard-accessible, and mobile navigation collapses behind "Menu".

        English action names are case-insensitive. Global navigation remains available across pages.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Discover homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          An anonymous visitor has an empty cart and the existing catalog is available.
        When: Open the storefront homepage.
        Then: Global navigation, Carousel, Popular Products containing Hummingbird detail t-shirt, Promotions, Newsletter
          and footer are visible; Logo, CLOTHES, Sign in, Cart, Search and Language are available and Cart reports
          0.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.1-02
      name: Use responsive keyboard navigation
      steps:
      - id: STEP-REQ-1.1-02-01
        Given: The anonymous homepage is open with its desktop navigation visible.
        When: Use Tab to reach each global navigation control; resize the viewport to 390×844, focus Menu and press
          Enter, then reach CLOTHES with Tab.
        Then: Desktop controls are keyboard reachable; mobile Menu opens navigation and CLOTHES receives keyboard
          focus.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.2
    name: Navigate categories and return home
    description:
      text: |-
        Hovering or keyboard-focusing and activating "CLOTHES" reveals "Men" and "Women". Men opens its product listing with Hummingbird detail t-shirt and Sort by; activating CLOTHES itself opens the parent category. From any catalog page, "Logo" returns home to Popular Products.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-NAVIGATION
        reference: reference/navigation.png
        page: home
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Browse Men and return with logo
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: |-
          The anonymous homepage is open and the existing catalog contains Hummingbird detail t-shirt.
        When: Hover CLOTHES, activate Men, then activate Logo.
        Then: Men initially shows its heading, Sort by and Hummingbird detail t-shirt; Logo returns to the homepage
          with Popular Products.
        references:
        - \ref[image](IMG-NAVIGATION)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-1.2-02
      name: Open subcategory by keyboard
      steps:
      - id: STEP-REQ-1.2-02-01
        Given: The anonymous homepage is open.
        When: Focus CLOTHES using the keyboard, press Enter to reveal its submenu, then focus Men and press Enter.
        Then: Men opens with its heading and Hummingbird detail t-shirt in Product list.
        references:
        - \ref[image](IMG-NAVIGATION)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-1.3
    name: Search products
    description:
      text: |-
        Focusing "Search" and entering shirt displays "Search suggestions" with Hummingbird detail t-shirt. Pressing Enter submits the search and displays a "Product list" containing that product.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-SEARCH
        reference: reference/search.png
        page: home
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Suggest and search shirt
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          The anonymous homepage is open and the catalog includes Hummingbird detail t-shirt.
        When: Fill Search (searchbox) with shirt, inspect Search suggestions, then press Enter in Search.
        Then: Suggestions include Hummingbird detail t-shirt; the submitted Product list includes that same product.
        references:
        - \ref[image](IMG-SEARCH)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-1.4
    name: Browse carousel promotions
    description:
      text: |-
        "Carousel" contains at least two visually distinct promotion slides. Its visible promotion changes automatically within five seconds; clicking "Next" changes the slide immediately. "Shop now" opens a product or category containing Hummingbird detail t-shirt.

        The active carousel promotion is an image named for that promotion; exactly one promotion image is visible.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.

        Displayed dates use UTC and the store date and time 2026-10-06T12:00:00Z; carousel transitions use elapsed time.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.4-01
      name: Advance automatically
      steps:
      - id: STEP-REQ-1.4-01-01
        Given: The homepage Carousel is visible with an identifiable current promotion image.
        When: Observe the carousel without activating a control for up to five seconds.
        Then: The visible promotion changes to a different slide.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.4-02
      name: Advance with Next
      steps:
      - id: STEP-REQ-1.4-02-01
        Given: The homepage Carousel is visible and its current promotion is recorded.
        When: Click Next (button) within Carousel.
        Then: The visible promotion changes to a different slide.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.4-03
      name: Shop from promotion
      steps:
      - id: STEP-REQ-1.4-03-01
        Given: |-
          The homepage Carousel offers Shop now (link).
        When: Activate Shop now.
        Then: A product detail for Hummingbird detail t-shirt or a category containing that product opens.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.5
    name: Open popular product
    description:
      text: |-
        Within "Popular Products", "Hummingbird detail t-shirt" is keyboard-accessible. Activating it opens that same product's detail with its heading and Add to cart action.

        Popular product cards include quick-view and wishlist controls.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-1.5-01
      name: Open popular t-shirt
      steps:
      - id: STEP-REQ-1.5-01-01
        Given: |-
          The homepage Popular Products contains Hummingbird detail t-shirt.
        When: Reach its named product link using the keyboard and activate it.
        Then: The product detail heading identifies Hummingbird detail t-shirt and Add to cart is visible.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-1.6
    name: Open empty cart
    description:
      text: |-
        With an empty visitor cart, clicking "Cart" opens Shopping cart with an empty-cart message and no cart t-shirt row.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-1.6-01
      name: Inspect empty cart
      steps:
      - id: STEP-REQ-1.6-01-01
        Given: |-
          An anonymous visitor has added no products and Cart shows 0.
        When: Activate Cart (link) in Global navigation.
        Then: Shopping cart displays an empty-cart message and no Hummingbird cart t-shirt row.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-1.7
    name: Preview popular product without leaving home
    description:
      text: |-
        Hovering "Product Hummingbird detail t-shirt" within Popular Products reveals "Quick view". Clicking it opens "Quick view Hummingbird detail t-shirt" with that exact product and its current price 24. "Close" dismisses the preview and restores the homepage's Popular Products without adding anything to the cart.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.7-01
      name: Preview popular product without leaving home
      steps:
      - id: STEP-REQ-1.7-01-01
        Given: |-
          The anonymous homepage contains the popular Hummingbird detail t-shirt and an empty cart.
        When: Hover its Product region, click Quick view (button), inspect the preview, then click Close within
          the dialog.
        Then: Quick view Hummingbird detail t-shirt displays that product and price 24; Close dismisses it, Popular
          Products remains visible, and Cart still reports 0.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-HOMEPAGE)
    children: []
- id: REQ-2
  name: Catalog exploration
  description:
    text: |-
      Visitors browse category, search and comparable listing contexts. Men provides breadcrumb, description, filters, product grid, count, sorting and pagination. Sidebar filters support availability, sale, category, size, color, composition, price and brand.

      Product list identifies each product by name and shows it once. Sale price contains just the current monetary amount and discounted cards also expose Regular price. The product count, breadcrumb and subcategory choices are identifiable. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

      The published catalog is available when the store opens. All 13 products belong to Men, including Black mug. The Hummingbird products and White t-shirt are on the first unfiltered page; order of other entries is unrestricted. Detail t-shirt has 20% discount (30 to 24), tax-inclusive price 24, tax-exclusive price 20, regular-fit description, reference HB-DETAIL, cotton data sheet, regular-fit features, at least two images, existing review Good fit with average rating 4, and related Men products. Women listing is available. The price and available stock vary by selection: default M/White costs 24 with stock 50; L/Black costs 36 with stock 2. Front and Back image assets must be visually distinct. The extra size/color combination does not change listing default prices or the 13-product Men listing.

      CLOTHES has Men and Women subcategories; ACCESSORIES and ART have no subcategories. Men shows 12 products per page. Its initial products use the following default values (prices in USD):
      - Hummingbird detail t-shirt: 24 (regular price 30); stock 50; M/White; Cotton; Hummingbird; available to buy.
      - Hummingbird cart t-shirt: 25; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - Hummingbird checkout-step t-shirt: 26; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - Hummingbird order-confirmation t-shirt: 27; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - Hummingbird order-complete t-shirt: 28; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - Hummingbird order-history t-shirt: 29; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - Hummingbird wishlist t-shirt: 23; stock 50; M/White; Polyester; Hummingbird; available to buy.
      - White t-shirt: 22; stock 50; M/White; Cotton; Benchmark Basics; available to buy.
      - Black mug: 12; stock 0; One size/Black; Ceramic; Benchmark Basics; unavailable to buy.
      - Catalog item 1: 11; stock 50; One size/Black; Ceramic; Benchmark Basics; available to buy.
      - Catalog item 2: 12; stock 50; One size/Black; Ceramic; Benchmark Basics; available to buy.
      - Catalog item 3: 13; stock 50; One size/Black; Ceramic; Benchmark Basics; available to buy.
      - Catalog item 4: 14; stock 50; One size/Black; Ceramic; Benchmark Basics; available to buy.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Browse category hierarchy
    description:
      text: |-
        The Men category displays its heading, "Category description", numeric "Product count", "Sort by", and product grid. "Breadcrumb" presents Home, CLOTHES, and Men in order; its "CLOTHES" returns to the parent category with CLOTHES heading and a Men entry. Parent-category Men and "Women" entries are keyboard-accessible, and Women opens its own listing with Sort by.

        The category sidebar provides availability, sale, category, size, color, composition, price, and brand filters. Subcategory choices are identifiable.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Inspect category and breadcrumb
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          The existing catalog is available to an anonymous visitor.
        When: Open CLOTHES then Men through Global navigation.
        Then: Men heading, Category description, numeric Product count, Sort by and Product list are visible; Breadcrumb
          presents Home, CLOTHES and Men in that order.
        references:
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.1-02
      name: Return to parent category
      steps:
      - id: STEP-REQ-2.1-02-01
        Given: |-
          The visitor is viewing the Men category.
        When: Activate CLOTHES in Breadcrumb.
        Then: The parent CLOTHES category opens with its heading and a keyboard-accessible Men entry.
        references:
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.1-03
      name: Browse Women from parent
      steps:
      - id: STEP-REQ-2.1-03-01
        Given: The visitor has returned from Men to the parent CLOTHES category using Breadcrumb.
        When: Focus Women using the keyboard and activate it.
        Then: Women opens with its heading and Sort by control.
        references:
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.2
    name: Inspect and open product cards
    description:
      text: |-
        "Product Hummingbird detail t-shirt" contains the product image, name, sale and regular prices, and Sale label. Hover reveals "Quick view", "Wishlist", and "White" as the color preview. The keyboard-accessible "Hummingbird detail t-shirt" opens that same product's detail with Add to cart.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Inspect card and hover actions
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: |-
          The visitor is viewing Men with Hummingbird detail t-shirt in Product list.
        When: Inspect Product Hummingbird detail t-shirt and hover that region.
        Then: The card shows its image, name, sale price 24, regular price 30 and Sale label; hover reveals Quick
          view, Wishlist and White color-preview controls.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-2.2-02
      name: Open card using keyboard
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          Men Product list includes Hummingbird detail t-shirt.
        When: Use keyboard focus to reach its product link and activate it.
        Then: The exact product detail opens with its named heading and Add to cart.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-2.3
    name: Filter catalog results
    description:
      text: |-
        Selecting "In stock" retains the White t-shirt and excludes the out-of-stock Black mug. Selecting "White" as the color filter also retains that t-shirt and excludes the Black mug. Entering a number in "Minimum price" retains only products at or above that amount and updates "Product count"; entering 20 includes the White t-shirt and excludes the Black mug. "Clear all" removes applied filters and restores the original results and count.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Filter in-stock products
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          The unfiltered Men catalog includes in-stock White t-shirt and out-of-stock Black mug.
        When: Check In stock (checkbox) in Filters.
        Then: White t-shirt remains in Product list and Black mug is excluded.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-02
      name: Filter White color
      steps:
      - id: STEP-REQ-2.3-02-01
        Given: |-
          The unfiltered Men catalog includes White t-shirt and Black mug.
        When: Check White (checkbox) in Filters.
        Then: White t-shirt remains in Product list and Black mug is excluded.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-03
      name: Filter minimum price
      steps:
      - id: STEP-REQ-2.3-03-01
        Given: |-
          The unfiltered Men catalog includes White t-shirt priced 22 and Black mug priced 12.
        When: Fill Minimum price (spinbutton) with 20 and commit the input.
        Then: White t-shirt remains, Black mug is excluded, and Product count reports the filtered result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-04
      name: Clear applied filters
      steps:
      - id: STEP-REQ-2.3-04-01
        Given: |-
          The visitor has opened Men and recorded the original Product count, then applied In stock.
        When: Click Clear all (button).
        Then: In stock is unchecked and the original Product count and previously excluded Black mug return.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.4
    name: Sort products by ascending price
    description:
      text: |-
        Selecting Price, low to high in "Sort by" orders the current prices in "Product list" ascending while retaining the White t-shirt. Equal-price products have no prescribed tie order.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-SORT
        reference: reference/sort.png
        page: category
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Sort current prices ascending
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: |-
          The unfiltered Men Product list includes White t-shirt.
        When: Select Price, low to high in Sort by (combobox).
        Then: The displayed current prices are nondecreasing, White t-shirt remains, and the selected sort label
          is shown; equal-price products have no required tie order.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-SORT)
    children: []
  - id: REQ-2.5
    name: Browse additional result pages
    description:
      text: |-
        The unfiltered Men listing initially shows 12 of 13 products. "Product count" displays Showing <start>-<end> of <total> item(s). Clicking "Next" within "Pagination" opens the remaining product slice and updates the range to 13-13 of 13 without changing the total.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Inspect first page and browse second
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: |-
          The unfiltered Men catalog contains 13 products.
        When: Record the first-page product identities, then click Next in Pagination (navigation).
        Then: Initially 12 products and Showing 1-12 of 13 are displayed; the second page shows one different product
          and Showing 13-13 of 13, preserving total 13.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.6
    name: Filter products on sale
    description:
      text: |-
        Selecting "On sale" within "Filters" includes discounted products and excludes undiscounted products according to published catalog. The visible results and "Product count" update to the filtered set.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Filter products on sale
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: |-
          The unfiltered Men catalog contains Hummingbird detail t-shirt and White t-shirt with their published catalog attributes; its original Product count is recorded.
        When: Check On sale (checkbox) in Filters.
        Then: Hummingbird detail t-shirt remains in Product list, White t-shirt is excluded, and Product count changes
          to the filtered result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.7
    name: Filter product size
    description:
      text: |-
        Choosing "M" within "Filters" includes products offering size M and excludes One size products, using published catalog attributes. The displayed results and "Product count" update accordingly.

        Product list identifies each product by name and shows it once. Sale price contains only the current monetary amount; discounted cards also expose Regular price. Monetary amounts use USD and a decimal point, with one numeric value per amount and an optional currency marker.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-CATEGORY
