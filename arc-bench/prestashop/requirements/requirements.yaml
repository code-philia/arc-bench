        The signed-in Store User clicks "Sign out" from My account and returns home, which shows "Sign in", Cart, and Hummingbird detail t-shirt. Sign out is no longer available.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-LOGOUT
        reference: reference/logout.png
        page: home
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Sign out from account
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: |-
          Store User has signed in through the sign-in UI and opened My account.
        When: Activate Sign out in Global navigation.
        Then: The homepage displays Sign in, Cart and Hummingbird detail t-shirt, and Sign out is unavailable.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-LOGOUT)
    children: []
- id: REQ-7
  name: Account management
  description:
    text: |-
      Signed-in customers inspect account overview, edit credentials, manage addresses, view history/invoices, reorder and manage wishlists. Mutations affect the corresponding business identity, not a neighboring entry.

      Account overview and Order history are identifiable. "Profile update" identifies the update message.
  scenarios: []
  children:
  - id: REQ-7.1
    name: Inspect account overview
    description:
      text: |-
        Clicking "My account" after signing in displays My account heading, Store User, and "Information", "Addresses", "Order history and details", and "Wishlist" entry points.

        The account overview is identifiable.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Inspect account overview
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          Verified Store User has signed in through Email and Password.
        When: Activate My account (link).
        Then: My account heading and Store User appear with Information, Addresses, Order history and details and
          Wishlist entry links.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-MY-ACCOUNT)
    children: []
  - id: REQ-7.2
    name: Change customer email and password
    description:
      text: |-
        The profile_user opens "Information" with "Email", "Current password", and "New password". Entering ShopPass123! as the current password, changing Email to prestashop_profile_user_next@example.com, and clicking "Save" displays "Profile update" confirmation and the new email while retaining the old password. A subsequent save with current password ShopPass123! and new password ShopPass456! confirms the password change. The resulting credentials permit sign-in.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.

        Profile update identifies the result of the update. Existing account verification is outside scope; the new profile email is initially unused.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-INFO
        reference: reference/my_account_info.png
        page: account_information
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-7.2-01
      name: Save email then password
      steps:
      - id: STEP-REQ-7.2-01-01
        Given: |-
          Verified profile_user has signed in using ShopPass123! and opened Information.
        When: Enter Current password ShopPass123!, replace Email with prestashop_profile_user_next@example.com and
          click Save; then enter Current password ShopPass123! and New password ShopPass456! and click Save again;
          sign out and sign in with the new credentials.
        Then: Each save reports Profile update success; the new email remains displayed after the first save and
          the new email/password pair successfully signs in after the second.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-INFO)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-7.3
    name: Create and view addresses
    description:
      text: |-
        Clicking "Addresses" displays each saved address as "{alias}", containing its values and Update and Delete actions. "Create new address" opens "Alias", "First name", "Last name", "Address", "Postal code", "City", "Country", and "Phone", displaying entered values before submission. "Save" with Office and shared examples address values creates one Office address; Home setup uses the same creation behavior and values.

        Customers can create addresses here or during checkout. Home/Office: Store User, 1 Commerce Road, 200000, Shanghai, China, 13800000020. A user can save Home before selecting, editing or deleting it. Updated street: 88 Market Street.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.

        The existing customer address books start empty. Home is created through the address UI before address selection, editing or deletion; it is not initially in their address book.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.3-01
      name: View Home address
      steps:
      - id: STEP-REQ-7.3-01-01
        Given: |-
          Signed-in address_view_user has created Home through the normal address UI using Store User, 1 Commerce Road, 200000 Shanghai, China and 13800000020.
        When: Open Addresses from Account overview.
        Then: Home (article) shows those saved values and its Update and Delete actions.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    - id: SCN-REQ-7.3-02
      name: Create Office address
      steps:
      - id: STEP-REQ-7.3-02-01
        Given: |-
          Signed-in address_create_user has opened Addresses and has no saved addresses.
        When: Click Create new address; enter Alias Office, First name Store, Last name User, Address 1 Commerce
          Road, Postal code 200000, City Shanghai, Country China and Phone 13800000020; inspect entered values,
          then click Save.
        Then: Exactly one Office address displays the saved address values with Update and Delete controls.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.4
    name: Edit or delete named address
    description:
      text: |-
        The address_edit_user or address_delete_user first creates Home through UI. In "Home", "Update" opens its current Alias and street values. Editing the street to 88 Market Street and clicking "Save" updates that same article. Alternatively, "Delete" within Home removes only that address and returns to the address list.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.4-01
      name: Update Home street
      steps:
      - id: STEP-REQ-7.4-01-01
        Given: |-
          Signed-in address_edit_user has created Home at 1 Commerce Road through UI and opened Addresses.
        When: Click Update within Home, verify Alias Home and the existing street, replace Address with 88 Market
          Street and click Save.
        Then: The same Home address shows 88 Market Street instead of the original street.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    - id: SCN-REQ-7.4-02
      name: Delete Home address
      steps:
      - id: STEP-REQ-7.4-02-01
        Given: |-
          Signed-in address_delete_user has created Home through UI and opened Addresses.
        When: Click Delete within Home and confirm the deletion prompt.
        Then: Home is removed and the address list is displayed.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.5
    name: Read historical orders and details
    description:
      text: |-
        Clicking "Order history and details" shows the historical "PS-HISTORY-001", with the order-history t-shirt, reference, date 2026-07-18, Delivered status, and Total 34. "Details" opens "Order details" for that order, containing its product, shared examples shipping information, and Bank wire payment.

        The order history is identifiable.

        The order history of order_history_user initially contains exactly one order: PS-HISTORY-001, dated 2026-07-18 and marked Delivered. It contains one Hummingbird order-history t-shirt at USD 29 plus USD 5 shipping (USD 34 total), delivered to 1 Commerce Road, Shanghai 200000, China, paid by Bank wire, with a downloadable PDF invoice.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.

        Displayed dates use UTC and the store date and time 2026-10-06T12:00:00Z; carousel transitions use elapsed time.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-ORDER
        reference: reference/my_account_order.png
        page: account_orders
    scenarios:
    - id: SCN-REQ-7.5-01
      name: Inspect historical order list
      steps:
      - id: STEP-REQ-7.5-01-01
        Given: |-
          Verified order_history_user has the existing historical order PS-HISTORY-001.
        When: Sign in and open Order history and details from My account.
        Then: The PS-HISTORY-001 row shows Hummingbird order-history t-shirt, 2026-07-18, Delivered and total 34,
          with Details, Reorder and PDF entries.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
    - id: SCN-REQ-7.5-02
      name: Inspect selected order details
      steps:
      - id: STEP-REQ-7.5-02-01
        Given: |-
          Signed-in order_history_user is viewing Order history and details with existing PS-HISTORY-001.
        When: Activate Details within PS-HISTORY-001.
        Then: Order details identifies that reference and Hummingbird order-history t-shirt with its historical
          shipping address and Bank wire payment.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
    children: []
  - id: REQ-7.6
    name: Reorder or download invoice
    description:
      text: |-
        Within historical "PS-HISTORY-001", "Reorder" adds the available order-history t-shirt to Shopping cart with subtotal 29. "PDF" downloads a valid invoice PDF for that reference, identified by its filename.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-ORDER
        reference: reference/my_account_order.png
        page: account_orders
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-7.6-01
      name: Reorder historical product
      steps:
      - id: STEP-REQ-7.6-01-01
        Given: |-
          Signed-in order_history_user is viewing existing PS-HISTORY-001 and its historical product remains available; the cart is empty.
        When: Activate Reorder within that named order row.
        Then: Shopping cart contains Hummingbird order-history t-shirt and subtotal 29.
        references:
        - \ref[requirement](REQ-7.5)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-7.6-02
      name: Download historical invoice
      steps:
      - id: STEP-REQ-7.6-02-01
        Given: |-
          Signed-in order_history_user is viewing existing PS-HISTORY-001.
        When: Activate PDF within that order row and receive the browser download.
        Then: The download succeeds, its filename identifies PS-HISTORY-001 and ends in .pdf, and the downloaded file
          is a PDF invoice.
        references:
        - \ref[requirement](REQ-7.5)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-7.7
    name: Create or inspect wishlists
    description:
      text: |-
        "Wishlist" opens saved collections, each represented by "{wishlist title}" with a named opening entry and Edit and Delete actions. Clicking "Create new wishlist" opens "Create new wishlist", where "Name" and "Save" create exactly one Holiday Picks collection. Users can also create an empty Favorites collection. Opening existing "Favorites" shows its membership-bearing "Hummingbird wishlist t-shirt" with Remove and Add to cart actions.

        The existing Favorites collections for wishlist_view_user, wishlist_remove_user and wishlist_cart_user each start with Hummingbird wishlist t-shirt.

        A customer can create an empty wishlist in their own account, using names such as Favorites or Holiday Picks.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.7-01
      name: Inspect seeded wishlist and products
      steps:
      - id: STEP-REQ-7.7-01-01
        Given: |-
          Verified wishlist_view_user has existing Favorites containing Hummingbird wishlist t-shirt.
        When: Sign in, open Wishlist from My account, then activate Favorites.
        Then: Favorites is visible in the collection list; opening it shows the named product and its Add to cart
          action.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    - id: SCN-REQ-7.7-02
      name: Create Holiday Picks wishlist
      steps:
      - id: STEP-REQ-7.7-02-01
        Given: |-
          Signed-in wishlist_create_user has opened Wishlist.
        When: Click Create new wishlist; enter Holiday Picks in Name within its dialog and click Save.
        Then: Exactly one Holiday Picks collection appears with Edit and Delete actions.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
  - id: REQ-7.8
    name: Rename or delete a wishlist
    description:
      text: |-
        For wishlist_rename_user or wishlist_delete_user, the UI-created "Favorites" offers scoped "Edit" and "Delete". Edit displays Favorites in "Name"; replacing it with Holiday Picks and clicking "Save" leaves one Holiday Picks and no Favorites. Delete instead removes Favorites from the collection list.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.8-01
      name: Rename Favorites wishlist
      steps:
      - id: STEP-REQ-7.8-01-01
        Given: |-
          Signed-in wishlist_rename_user has created an empty Favorites collection through Create new wishlist.
        When: Click Edit within Favorites, verify Name contains Favorites, replace it with Holiday Picks and click
          Save.
        Then: Favorites disappears and exactly one Holiday Picks collection remains.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    - id: SCN-REQ-7.8-02
      name: Delete Favorites wishlist
      steps:
      - id: STEP-REQ-7.8-02-01
        Given: |-
          Signed-in wishlist_delete_user has created an empty Favorites collection through Create new wishlist.
        When: Click Delete within Favorites and confirm deletion.
        Then: Favorites is removed from the collection list.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
  - id: REQ-7.9
    name: Remove wishlist product or move it to cart
    description:
      text: |-
        existing Favorites for wishlist_remove_user or wishlist_cart_user contains "Hummingbird wishlist t-shirt". "Remove" deletes that product's wishlist membership; "Add to cart" instead adds that exact default available product to the cart. If the wishlist remains visible after addition, "Cart" opens the cart to inspect the selected product.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-7.9-01
      name: Remove Favorites product
      steps:
      - id: STEP-REQ-7.9-01-01
        Given: |-
          Signed-in wishlist_remove_user has opened existing Favorites containing Hummingbird wishlist t-shirt.
        When: Click Remove for that product.
        Then: Hummingbird wishlist t-shirt is removed from Favorites.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-7.9-02
      name: Add Favorites product to cart
      steps:
      - id: STEP-REQ-7.9-02-01
        Given: |-
          Signed-in wishlist_cart_user has opened existing Favorites containing Hummingbird wishlist t-shirt and has an empty cart.
        When: Click Add to cart within that product; wait for Cart to report one unit, dismiss an optional success
          dialog through Continue shopping, then activate Cart.
        Then: Shopping cart contains the exact Hummingbird wishlist t-shirt product.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-7.10
    name: Delete only the selected address
    description:
      text: |-
        After creating "Home" and "Office" through UI under the same account, clicking "Delete" within Home removes only Home and preserves Office with its original values. Business identity, rather than row position, determines the target.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.10-01
      name: Delete only the selected address
      steps:
      - id: STEP-REQ-7.10-01-01
        Given: |-
          Signed-in address_delete_user has created Home and Office through UI with 1 Commerce Road and 13800000020 and is viewing Addresses.
        When: Click Delete within Home and confirm deletion.
        Then: Home disappears; exactly one Office address remains with its original street and phone.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[requirement](REQ-7.4)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.11
    name: Delete only the selected wishlist
    description:
      text: |-
        For UI-created "Favorites" and "Holiday Picks" under wishlist_delete_user, "Delete" scoped to Favorites removes only that collection. Holiday Picks remains exactly once and its "Holiday Picks" still opens the surviving wishlist with a Holiday Picks heading, independent of list ordering.

        English action names are case-insensitive. Global navigation remains available across pages; each mutation affects the selected business identity.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.11-01
      name: Delete only the selected wishlist
      steps:
      - id: STEP-REQ-7.11-01-01
        Given: |-
          Signed-in wishlist_delete_user has created empty Favorites and Holiday Picks collections through UI.
        When: Click Delete within Favorites, confirm deletion, then activate the surviving Holiday Picks link.
        Then: Favorites disappears, Holiday Picks remains exactly once, and its opening link displays the surviving
          wishlist.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[requirement](REQ-7.8)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
