id: ROOT
name: PrestaShop B2C storefront
description:
  text: |-
    Visitors browse the storefront, select products and variants, manage their cart, and check out. Signed-in customers can manage their profile, addresses, orders, and wishlists.

    The storefront uses English. Action labels may differ in capitalization. Navigation stays available across pages, and each action affects the selected product, address, order, or wishlist. Controls, feedback, and selected states are identifiable visually and with assistive technology.

    Dates use UTC. The store date is October 6, 2026 at 12:00 UTC; promotions advance with elapsed time.

    Customers register with their own valid name and unused email, then sign in with their saved credentials. New customers have empty carts and address books. Account verification is unspecified. The published catalog, historical order, and existing populated wishlists described below are available when the store opens.
scenarios: []
children:
- id: REQ-1
  name: Storefront discovery
  description:
    text: |-
      Visitors discover promotions, popular products, a newsletter, and the footer through the homepage. They can preview products and navigate from the persistent global navigation. The carousel shows exactly one active promotion image at a time, and visitors can identify the current promotion.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Discover storefront content
    description:
      text: |-
        Opening the storefront while logged out displays "Global navigation", "Carousel", "Popular Products" containing Hummingbird detail t-shirt, "Promotions", "Newsletter", and the footer. Users navigate through "Logo", "CLOTHES", "Sign in", and "Cart", search with "Search", and access language selection through "Language". Cart count starts at 0. All controls are keyboard-accessible, and mobile navigation collapses behind "Menu".
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Discover homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          An anonymous visitor has an empty cart and the existing catalog is available.
        When: Open the storefront homepage.
        Then: Global navigation, Carousel, Popular Products containing Hummingbird detail t-shirt, Promotions, Newsletter
          and footer are visible; Logo, CLOTHES, Sign in, Cart, Search and Language are available and Cart reports
          0.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.1-02
      name: Use responsive keyboard navigation
      steps:
      - id: STEP-REQ-1.1-02-01
        Given: The anonymous homepage is open with its desktop navigation visible.
        When: Use Tab to reach each global navigation control; resize the viewport to 390×844, focus Menu and press
          Enter, then reach CLOTHES with Tab.
        Then: Desktop controls are keyboard reachable; mobile Menu opens navigation and CLOTHES receives keyboard
          focus.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.2
    name: Navigate categories and return home
    description:
      text: |-
        Hovering or keyboard-focusing and activating "CLOTHES" reveals "Men" and "Women". Men opens its product listing with Hummingbird detail t-shirt and Sort by; activating CLOTHES itself opens the parent category. From any catalog page, "Logo" returns home to Popular Products.
      image:
      - id: IMG-NAVIGATION
        reference: reference/navigation.png
        page: home
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Browse Men and return with logo
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: |-
          The anonymous homepage is open and the existing catalog contains Hummingbird detail t-shirt.
        When: Hover CLOTHES, activate Men, then activate Logo.
        Then: Men initially shows its heading, Sort by and Hummingbird detail t-shirt; Logo returns to the homepage
          with Popular Products.
        references:
        - \ref[image](IMG-NAVIGATION)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-1.2-02
      name: Open subcategory by keyboard
      steps:
      - id: STEP-REQ-1.2-02-01
        Given: The anonymous homepage is open.
        When: Focus CLOTHES using the keyboard, press Enter to reveal its submenu, then focus Men and press Enter.
        Then: Men opens with its heading and Hummingbird detail t-shirt in Product list.
        references:
        - \ref[image](IMG-NAVIGATION)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-1.3
    name: Search products
    description:
      text: |-
        Entering a matching product keyword in Search shows matching suggestions. Pressing Enter submits the search and displays matching products. For example, shirt finds Hummingbird detail t-shirt in both suggestions and submitted results.
      image:
      - id: IMG-SEARCH
        reference: reference/search.png
        page: home
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Suggest and search shirt
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          The anonymous homepage is open and the catalog includes Hummingbird detail t-shirt.
        When: |-
          Enter a keyword matching Hummingbird detail t-shirt, such as shirt. Inspect suggestions, then press Enter in Search.
        Then: |-
          The suggestions and the submitted search results both include Hummingbird detail t-shirt.
        references:
        - \ref[image](IMG-SEARCH)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-1.4
    name: Browse carousel promotions
    description:
      text: |-
        The carousel has at least two visually distinct promotion images. The current promotion changes automatically within five seconds. Next changes it immediately. Each promotion is identifiable with assistive technology. Shop now opens Hummingbird detail t-shirt or a category containing it.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.4-01
      name: Advance automatically
      steps:
      - id: STEP-REQ-1.4-01-01
        Given: The homepage Carousel is visible with an identifiable current promotion image.
        When: Observe the carousel without activating a control for up to five seconds.
        Then: |-
          A visibly different promotion replaces the first while only one promotion image remains visible.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.4-02
      name: Advance with Next
      steps:
      - id: STEP-REQ-1.4-02-01
        Given: The homepage Carousel is visible and its current promotion is recorded.
        When: Click Next (button) within Carousel.
        Then: The visible promotion changes to a different slide.
        references:
        - \ref[image](IMG-HOMEPAGE)
    - id: SCN-REQ-1.4-03
      name: Shop from promotion
      steps:
      - id: STEP-REQ-1.4-03-01
        Given: |-
          The homepage Carousel offers Shop now.
        When: Activate Shop now.
        Then: A product detail for Hummingbird detail t-shirt or a category containing that product opens.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.5
    name: Open popular product
    description:
      text: |-
        Within "Popular Products", "Hummingbird detail t-shirt" is keyboard-accessible. Activating it opens that same product's detail with its heading and Add to cart action.

        Popular product cards include quick-view and wishlist controls.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-1.5-01
      name: Open popular t-shirt
      steps:
      - id: STEP-REQ-1.5-01-01
        Given: |-
          The homepage Popular Products contains Hummingbird detail t-shirt.
        When: Reach its named product link using the keyboard and activate it.
        Then: The product detail heading identifies Hummingbird detail t-shirt and Add to cart is visible.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-1.6
    name: Open empty cart
    description:
      text: |-
        With an empty visitor cart, clicking "Cart" opens Shopping cart with an empty-cart message and no cart t-shirt row.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-1.6-01
      name: Inspect empty cart
      steps:
      - id: STEP-REQ-1.6-01-01
        Given: |-
          An anonymous visitor has added no products and Cart shows 0.
        When: |-
          Activate Cart in Global navigation.
        Then: Shopping cart displays an empty-cart message and no Hummingbird cart t-shirt row.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-1.7
    name: Preview popular product without leaving home
    description:
      text: |-
        Hovering over Hummingbird detail t-shirt in Popular Products reveals Quick view. It opens a preview of that product with its price of USD 24. Close dismisses the preview and returns to Popular Products without adding anything to the cart.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.7-01
      name: Preview popular product without leaving home
      steps:
      - id: STEP-REQ-1.7-01-01
        Given: |-
          The anonymous homepage contains the popular Hummingbird detail t-shirt and an empty cart.
        When: Hover its Product region, click Quick view (button), inspect the preview, then click Close within
          the dialog.
        Then: Quick view Hummingbird detail t-shirt displays that product and price 24; Close dismisses it, Popular
          Products remains visible, and Cart still reports 0.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-HOMEPAGE)
    children: []
- id: REQ-2
  name: Catalog exploration
  description:
    text: |-
      Men displays the category description, breadcrumb, subcategory choices, filters, sorting, pagination and result count. Products appear once with their name and a clear USD price. Discounted products distinguish their sale and regular prices.

      The store opens with CLOTHES, whose subcategories are Men and Women, plus ACCESSORIES and ART. Women has an available listing. Men initially has 13 products and shows 12 per page. Every Hummingbird product and White t-shirt appears on the first unfiltered page; other product positions are not fixed.

      Hummingbird detail t-shirt has a 20% discount from USD 30 to USD 24. Its tax-exclusive price is USD 20 at a 20% tax rate. It has a regular-fit description and features, reference HB-DETAIL, a cotton data sheet, distinct Front and Back images, the Good fit review at average rating 4, and related Men products. Its default M/White variant costs USD 24 with 50 available. L/Black costs USD 36 (regular price USD 45) with 2 available. This variant does not change the published listing prices or count.

      Men starts with these published products and their default selections:
      - Hummingbird detail t-shirt: USD 24 (regular price USD 30), 50 in stock, M/White, Cotton, brand Hummingbird, available to buy.
      - Hummingbird cart t-shirt: USD 25, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - Hummingbird checkout-step t-shirt: USD 26, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - Hummingbird order-confirmation t-shirt: USD 27, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - Hummingbird order-complete t-shirt: USD 28, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - Hummingbird order-history t-shirt: USD 29, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - Hummingbird wishlist t-shirt: USD 23, 50 in stock, M/White, Polyester, brand Hummingbird, available to buy.
      - White t-shirt: USD 22, 50 in stock, M/White, Cotton, brand Benchmark Basics, available to buy.
      - Black mug: USD 12, 0 in stock, One size/Black, Ceramic, brand Benchmark Basics, unavailable to buy.
      - Catalog item 1: USD 11, 50 in stock, One size/Black, Ceramic, brand Benchmark Basics, available to buy.
      - Catalog item 2: USD 12, 50 in stock, One size/Black, Ceramic, brand Benchmark Basics, available to buy.
      - Catalog item 3: USD 13, 50 in stock, One size/Black, Ceramic, brand Benchmark Basics, available to buy.
      - Catalog item 4: USD 14, 50 in stock, One size/Black, Ceramic, brand Benchmark Basics, available to buy.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Browse category hierarchy
    description:
      text: |-
        The Men category displays its heading, "Category description", numeric "Product count", "Sort by", and product grid. "Breadcrumb" presents Home, CLOTHES, and Men in order; its "CLOTHES" returns to the parent category with CLOTHES heading and a Men entry. Parent-category Men and "Women" entries are keyboard-accessible, and Women opens its own listing with Sort by.

        The category sidebar provides availability, sale, category, size, color, composition, price, and brand filters. Subcategory choices are identifiable.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Inspect category and breadcrumb
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          The existing catalog is available to an anonymous visitor.
        When: Open CLOTHES then Men through Global navigation.
        Then: Men heading, Category description, numeric Product count, Sort by and Product list are visible; Breadcrumb
          presents Home, CLOTHES and Men in that order.
        references:
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.1-02
      name: Return to parent category
      steps:
      - id: STEP-REQ-2.1-02-01
        Given: |-
          The visitor is viewing the Men category.
        When: Activate CLOTHES in Breadcrumb.
        Then: The parent CLOTHES category opens with its heading and a keyboard-accessible Men entry.
        references:
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.1-03
      name: Browse Women from parent
      steps:
      - id: STEP-REQ-2.1-03-01
        Given: The visitor has returned from Men to the parent CLOTHES category using Breadcrumb.
        When: |-
          Focus Women using the keyboard and activate it.
        Then: Women opens with its heading and Sort by control.
        references:
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.2
    name: Inspect and open product cards
    description:
      text: |-
        The card for Hummingbird detail t-shirt shows its image, exact name, sale price of USD 24, regular price of USD 30, and Sale label. Hovering reveals Quick view, Wishlist, and the White color preview. Users can reach the product by keyboard and open its detail with Add to cart available.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Inspect card and hover actions
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: |-
          The visitor is viewing Men with Hummingbird detail t-shirt in Product list.
        When: Inspect Product Hummingbird detail t-shirt and hover that region.
        Then: The card shows its image, name, sale price 24, regular price 30 and Sale label; hover reveals Quick
          view, Wishlist and White color-preview controls.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-2.2-02
      name: Open card using keyboard
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          Men Product list includes Hummingbird detail t-shirt.
        When: Use keyboard focus to reach its product link and activate it.
        Then: The exact product detail opens with its named heading and Add to cart.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-2.3
    name: Filter catalog results
    description:
      text: |-
        In stock shows only available products. White shows products available in that color. Minimum price includes products at or above the entered amount. For example, entering USD 20 retains the USD 22 White t-shirt but not the USD 12 Black mug. The result count updates and Clear all restores the unfiltered listing and count.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Filter in-stock products
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          The unfiltered Men catalog includes in-stock White t-shirt and out-of-stock Black mug.
        When: |-
          Check In stock in Filters.
        Then: White t-shirt remains in Product list and Black mug is excluded.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-02
      name: Filter White color
      steps:
      - id: STEP-REQ-2.3-02-01
        Given: |-
          The unfiltered Men catalog includes White t-shirt and Black mug.
        When: |-
          Check White in Filters.
        Then: White t-shirt remains in Product list and Black mug is excluded.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-03
      name: Filter minimum price
      steps:
      - id: STEP-REQ-2.3-03-01
        Given: |-
          The unfiltered Men catalog includes White t-shirt priced 22 and Black mug priced 12.
        When: |-
          Enter a Minimum price above USD 12 and at most USD 22, such as USD 20, and apply it.
        Then: White t-shirt remains, Black mug is excluded, and Product count reports the filtered result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    - id: SCN-REQ-2.3-04
      name: Clear applied filters
      steps:
      - id: STEP-REQ-2.3-04-01
        Given: |-
          The visitor has recorded the unfiltered Men listing and applied In stock.
        When: Click Clear all (button).
        Then: |-
          In stock is cleared and the original result count and first-page products are restored.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.4
    name: Sort products by ascending price
    description:
      text: |-
        Selecting Price, low to high in "Sort by" orders the current prices in "Product list" ascending while retaining the White t-shirt. Equal-price products have no prescribed tie order.
      image:
      - id: IMG-SORT
        reference: reference/sort.png
        page: category
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Sort current prices ascending
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: |-
          The unfiltered Men Product list includes White t-shirt.
        When: Select Price, low to high in Sort by (combobox).
        Then: The displayed current prices are nondecreasing, White t-shirt remains, and the selected sort label
          is shown; equal-price products have no required tie order.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-SORT)
    children: []
  - id: REQ-2.5
    name: Browse additional result pages
    description:
      text: |-
        The first unfiltered page of Men displays 12 of 13 products. The range reads Showing 1-12 of 13. Next in pagination displays the remaining product and the range Showing 13-13 of 13; the total stays 13.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Inspect first page and browse second
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: |-
          The unfiltered Men catalog contains 13 products.
        When: Record the first-page product identities, then click Next in Pagination (navigation).
        Then: Initially 12 products and Showing 1-12 of 13 are displayed; the second page shows one different product
          and Showing 13-13 of 13, preserving total 13.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.6
    name: Filter products on sale
    description:
      text: |-
        Selecting "On sale" within "Filters" includes discounted products and excludes undiscounted products according to published catalog. The visible results and "Product count" update to the filtered set.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Filter products on sale
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: |-
          The unfiltered Men catalog contains Hummingbird detail t-shirt and White t-shirt with their published catalog attributes; its original Product count is recorded.
        When: |-
          Check On sale in Filters.
        Then: Hummingbird detail t-shirt remains in Product list, White t-shirt is excluded, and Product count changes
          to the filtered result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.7
    name: Filter product size
    description:
      text: |-
        Choosing "M" within "Filters" includes products offering size M and excludes One size products, using published catalog attributes. The displayed results and "Product count" update accordingly.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.7-01
      name: Filter product size
      steps:
      - id: STEP-REQ-2.7-01-01
        Given: |-
          The unfiltered Men catalog contains White t-shirt and Black mug with their published catalog attributes; its original Product count is recorded.
        When: |-
          Check M in Filters.
        Then: White t-shirt remains in Product list, Black mug is excluded, and Product count changes to the filtered
          result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.8
    name: Filter product composition
    description:
      text: |-
        Choosing "Cotton" within "Filters" includes cotton products and excludes ceramic and polyester products according to published catalog. The result set and "Product count" update together.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.8-01
      name: Filter product composition
      steps:
      - id: STEP-REQ-2.8-01-01
        Given: |-
          The unfiltered Men catalog contains White t-shirt and Black mug with their published catalog attributes; its original Product count is recorded.
        When: |-
          Check Cotton in Filters.
        Then: White t-shirt remains in Product list, Black mug is excluded, and Product count changes to the filtered
          result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.9
    name: Filter product brand
    description:
      text: |-
        Choosing "Hummingbird" within "Filters" retains that brand and excludes Benchmark Basics using published catalog. The displayed results and "Product count" reflect the selected brand.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.9-01
      name: Filter product brand
      steps:
      - id: STEP-REQ-2.9-01-01
        Given: |-
          The unfiltered Men catalog contains Hummingbird detail t-shirt and White t-shirt with their published catalog attributes; its original Product count is recorded.
        When: |-
          Check Hummingbird in Filters.
        Then: Hummingbird detail t-shirt remains in Product list, White t-shirt is excluded, and Product count changes
          to the filtered result set.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-CATEGORY)
    children: []
  - id: REQ-2.10
    name: Combine filters and clear them
    description:
      text: |-
        When In stock and Minimum price are both active, only available products at or above the entered amount appear. For example, at USD 12, the available Catalog item 2 qualifies but the out-of-stock Black mug and the USD 11 Catalog item 1 do not. At USD 25, Hummingbird cart t-shirt qualifies but White t-shirt does not. Clear all restores the original first-page products and count, clears In stock, and resets Minimum price to empty or zero.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
    scenarios:
    - id: SCN-REQ-2.10-01
      name: Combine filters and clear them
      steps:
      - id: STEP-REQ-2.10-01-01
        Given: |-
          The visitor has recorded the original first page and count in Men. Catalog item 1 costs USD 11; Catalog item 2 and the out-of-stock Black mug each cost USD 12.
        When: |-
          Set Minimum price to USD 12, inspect those results, then select In stock. Raise Minimum price above USD 22 and at most USD 25. Inspect the results and choose Clear all.
        Then: |-
          The USD 12 minimum alone shows Black mug and Catalog item 2 but not Catalog item 1. With In stock also selected, Black mug disappears and Catalog item 2 remains. At the higher minimum, Hummingbird cart t-shirt remains and White t-shirt is excluded. Clear all restores the first page and total and resets both filters.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-CATEGORY)
    children: []
- id: REQ-3
  name: Product selection
  description:
    text: |-
      Users inspect product images and enlargement, prices and tax, variants, quantity, descriptions, and reviews. Recently viewed and related products make further browsing available. The current prices and stock match the selected variant.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Inspect product details
    description:
      text: |-
        Opening Hummingbird detail t-shirt displays its heading and "Add to cart". "Product images" contains exactly one main image named Hummingbird detail t-shirt, thumbnail choices, and "Zoom". "Product information" shows its name, sale and regular prices, 20% discount, tax information, and regular-fit description.

        Product information exposes named Sale price and Regular price amounts. Stock status displays "Available stock: <number>". Selected product and variant remain consistent across navigation within a flow.

        For Hummingbird detail t-shirt, the tax-inclusive sale price is USD 24, tax-exclusive price is USD 20, regular price is USD 30 and discount is 20%. The reference is HB-DETAIL, the description and features are regular-fit, the data sheet is cotton, the average rating is 4 with the existing Good fit review, and related products are from Men.
      image:
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Inspect selected product
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          The existing Hummingbird detail t-shirt is available in Men.
        When: Open its named product link and inspect Product images and Product information.
        Then: The detail heading and Add to cart identify the product; exactly one main image has its product name,
          thumbnails and Zoom are available, and information shows sale price 24, regular price 30, 20% discount,
          tax and regular-fit description.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.2
    name: Select product combination and quantity
    description:
      text: |-
        Selecting M and White displays the price and stock for that variant. Quantity starts at one. Increase quantity raises it; Decrease quantity lowers it without going below one. Users can enter another available quantity directly, for example three. An attempt to add more than the available stock shows a warning and leaves the cart unchanged.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Choose M and White
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: |-
          Hummingbird detail t-shirt detail is open with its available variants.
        When: |-
          Select M in Size (combobox) and White.
        Then: Size visibly selects M and White is checked for the selected combination.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-3.2-02
      name: Adjust and directly enter quantity
      steps:
      - id: STEP-REQ-3.2-02-01
        Given: |-
          Hummingbird detail t-shirt detail is open and Quantity starts at 1.
        When: |-
          Increase and decrease Quantity, attempt to decrease below one, and directly enter a valid quantity, for example three.
        Then: |-
          Quantity changes to two, returns to one, stays at one on the extra decrease, and shows the directly entered quantity.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-3.2-03
      name: Reject quantity exceeding stock
      steps:
      - id: STEP-REQ-3.2-03-01
        Given: |-
          The anonymous visitor is viewing Hummingbird detail t-shirt with an empty cart and stock less than 999.
        When: |-
          Enter a quantity greater than the available stock and choose Add to cart.
        Then: An insufficient-stock alert appears and Cart remains 0; no success dialog is shown.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.3
    name: Add product to cart and choose next destination
    description:
      text: |-
        Clicking "Add to cart" for one default available Hummingbird cart t-shirt opens "Product successfully added to your shopping cart" with that product and increases cart count. "Continue shopping" closes the dialog and returns to the same detail; "Proceed to checkout" opens Shopping cart with that product and its correct subtotal.
      image:
      - id: IMG-ADD-TO-CART
        reference: reference/add_to_cart.png
        page: product
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-3.3-01
      name: Add default product
      steps:
      - id: STEP-REQ-3.3-01-01
        Given: |-
          Hummingbird cart t-shirt detail is open with default M/White variant, Quantity 1 and an empty cart.
        When: Click Add to cart (button).
        Then: Product successfully added to your shopping cart (dialog) identifies Hummingbird cart t-shirt and
          Cart reports one unit.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ADD-TO-CART)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-3.3-02
      name: Continue on same product
      steps:
      - id: STEP-REQ-3.3-02-01
        Given: |-
          One default Hummingbird cart t-shirt has been added through Add to cart and its success dialog is open.
        When: Activate Continue shopping in the success dialog.
        Then: The dialog closes and the same product detail remains visible.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ADD-TO-CART)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-3.3-03
      name: Proceed from confirmation to cart
      steps:
      - id: STEP-REQ-3.3-03-01
        Given: |-
          One default Hummingbird cart t-shirt has been added through Add to cart and its success dialog is open.
        When: Activate Proceed to checkout in the success dialog.
        Then: Shopping cart opens with the named product row and subtotal 25.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ADD-TO-CART)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-3.4
    name: Read description and product details
    description:
      text: |-
        Description shows the regular-fit product description. Product Details shows Reference HB-DETAIL, a cotton Data sheet, and regular-fit Features. The selected view and its corresponding content are identifiable.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.4-01
      name: Read description tab
      steps:
      - id: STEP-REQ-3.4-01-01
        Given: |-
          Hummingbird detail t-shirt detail is open.
        When: Select Description (tab).
        Then: |-
          Description is selected and its named content area displays the regular-fit product description.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-3.4-02
      name: Read details tab
      steps:
      - id: STEP-REQ-3.4-02-01
        Given: |-
          Hummingbird detail t-shirt detail is open.
        When: Select Product Details (tab).
        Then: |-
          Product Details is selected and its content area shows Reference HB-DETAIL, a cotton Data sheet and regular-fit Features.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.5
    name: Inspect reviews and enforce visitor sign-in prompts
    description:
      text: |-
        Reviews shows the existing Good fit review and an Average rating of 4, with equivalent decimal formatting permitted. For a signed-out visitor, Write your review and Wishlist each show Sign in required for Hummingbird detail t-shirt, without submitting a review or saving wishlist membership.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.5-01
      name: Read existing review
      steps:
      - id: STEP-REQ-3.5-01-01
        Given: |-
          Hummingbird detail t-shirt has a existing Good fit review and average rating 4.
        When: Open the product detail and inspect Reviews.
        Then: Reviews displays Good fit and average rating 4.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-3.5-02
      name: Require sign-in before review
      steps:
      - id: STEP-REQ-3.5-02-01
        Given: |-
          An anonymous visitor is viewing Hummingbird detail t-shirt and its existing Reviews.
        When: Click Write your review (button).
        Then: Sign in required (dialog) identifies the product, and existing Reviews remains unchanged without a
          newly submitted review.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    - id: SCN-REQ-3.5-03
      name: Require sign-in before wishlist
      steps:
      - id: STEP-REQ-3.5-03-01
        Given: |-
          An anonymous visitor is viewing Hummingbird detail t-shirt.
        When: |-
          Activate Wishlist.
        Then: Sign in required (dialog) identifies the product and the visitor remains anonymous; the wishlist action
          does not report successful membership.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.6
    name: Discover recently viewed and related products
    description:
      text: |-
        After visiting Hummingbird detail t-shirt, "Recently viewed" includes that product. "Related products" contains a different Men product with a keyboard-accessible opening entry.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.6-01
      name: Inspect recommendations and viewing history
      steps:
      - id: STEP-REQ-3.6-01-01
        Given: |-
          The visitor has opened Hummingbird detail t-shirt from Men.
        When: Inspect Related products and Recently viewed.
        Then: |-
          Recently viewed contains Hummingbird detail t-shirt; Related products contains a different existing Men product with a keyboard-accessible opening entry.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.7
    name: Switch product thumbnail image
    description:
      text: |-
        Users can reach Front and Back thumbnails by keyboard. Back changes the single main image to the distinct back view. Front restores the front view. Both views identify the same product, and switching images never changes the selected product.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.7-01
      name: Switch product thumbnail image
      steps:
      - id: STEP-REQ-3.7-01-01
        Given: |-
          The product detail shows the Front view.
        When: |-
          Select Back, then select Front again.
        Then: |-
          Back shows a different recognizable view of the same product. Front restores the original view; the product heading remains unchanged.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.8
    name: Open and close enlarged product image
    description:
      text: |-
        Clicking "Zoom" in Product images opens "Product image" with the currently selected product image and a visible Front view or Back view caption. "Close" dismisses the enlargement without changing the product or selected image.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.8-01
      name: Open and close enlarged product image
      steps:
      - id: STEP-REQ-3.8-01-01
        Given: |-
          Hummingbird detail t-shirt detail is open and Back has been selected in Product images.
        When: Click Zoom, inspect Product image (dialog), then click its Close button.
        Then: The dialog displays one enlarged product image and Back view caption; closing it preserves the product
          heading and selected back image.
        references:
        - \ref[requirement](REQ-3.7)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
  - id: REQ-3.9
    name: Update price and stock for selected variant
    description:
      text: |-
        Choosing L in "Size" and "Black" updates "Product information" to the published catalog variant's sale price 36, regular price 45, and "Stock" displaying Available stock: 2. Selecting M and "White" restores sale price 24, regular price 30, and Available stock: 50. Both monetary values and stock must follow the actual selected combination rather than only changing the selection controls.

        Product information exposes named Sale price and Regular price amounts. Stock status displays "Available stock: <number>". Selected product and variant remain consistent across navigation within a flow.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
    scenarios:
    - id: SCN-REQ-3.9-01
      name: Update price and stock for selected variant
      steps:
      - id: STEP-REQ-3.9-01-01
        Given: |-
          Hummingbird detail t-shirt detail is open with the catalog variant data.
        When: |-
          Select L in Size and Black, inspect information, then select M and White.
        Then: 'L/Black shows sale price 36, regular price 45 and Available stock: 2; M/White restores price 24,
          regular price 30 and Available stock: 50.'
        references:
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-PRODUCT-DETAIL)
    children: []
- id: REQ-4
  name: Cart management
  description:
    text: |-
      Cart rows identify the product and selected combination, image, unit price, quantity and subtotal. Cart summary reconciles monetary totals. Visitors can continue browsing or start checkout.

      Cart rows expose Unit price and Subtotal; Cart summary exposes Items subtotal, Shipping, Total and Discount when applicable. Variant text identifies Size: <size> and Color: <color>. Cart count counts units. Cart state remains consistent across navigation within a flow.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Inspect cart contents and summary
    description:
      text: |-
        After UI addition, Shopping cart contains exactly one "Hummingbird cart t-shirt" with image, M/White combination, Unit price 25, "Quantity" set to 1, Subtotal 25, and "Delete". "Cart summary" reconciles Items subtotal 25, Shipping 5, and Total 30 including tax. Discount appears only when applicable and is absent for this undiscounted product.

        Cart rows expose named Unit price and Subtotal amounts. Cart summary exposes Items subtotal, Shipping, Total, and Discount when applicable. Variant text identifies "Size: <size>" and "Color: <color>". Cart count counts units, and cart state remains consistent across navigation within a flow.
      image:
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Inspect cart row and totals
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          The visitor has added one default M/White Hummingbird cart t-shirt through the storefront and opened Shopping cart from the success dialog.
        When: Inspect its named row and Cart summary.
        Then: Exactly one row shows image, M/White, Unit price 25, Quantity 1, Subtotal 25 and Delete; summary shows
          Items subtotal 25, Shipping 5 and Total 30 including tax, with no Discount.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-4.2
    name: Change or remove cart items
    description:
      text: |-
        Clicking "Increase quantity" within "Hummingbird cart t-shirt" changes quantity from 1 to 2, row Subtotal to 50, and Total in "Cart summary" to 55. "Delete" on that row removes it, displays the empty-cart message, and recalculates Items subtotal and Total to 0.

        Cart rows expose named Unit price and Subtotal amounts. Cart summary exposes Items subtotal, Shipping, Total, and Discount when applicable. Variant text identifies "Size: <size>" and "Color: <color>". Cart count counts units, and cart state remains consistent across navigation within a flow.
      image:
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-4.2-01
      name: Increase cart quantity
      steps:
      - id: STEP-REQ-4.2-01-01
        Given: |-
          Shopping cart contains one M/White Hummingbird cart t-shirt priced 25 and quantity 1, added through the storefront.
        When: Click Increase quantity within that product row.
        Then: Quantity becomes 2, row Subtotal becomes 50 and Cart summary Total becomes 55.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-4.2-02
      name: Delete cart product
      steps:
      - id: STEP-REQ-4.2-02-01
        Given: |-
          Shopping cart contains one Hummingbird cart t-shirt added through the storefront.
        When: Click Delete within its named row.
        Then: The product row disappears, an empty-cart message appears, and Items subtotal and Total both become
          0.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-4.3
    name: Continue browsing or begin checkout
    description:
      text: |-
        From Shopping cart, "Continue shopping" opens Men with the cart t-shirt available. "Proceed to checkout" opens "Personal Information" and "Order summary" containing the selected product. Both transitions retain the cart.

        Cart rows expose named Unit price and Subtotal amounts. Cart summary exposes Items subtotal, Shipping, Total, and Discount when applicable. Variant text identifies "Size: <size>" and "Color: <color>". Cart count counts units, and cart state remains consistent across navigation within a flow.
      image:
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
      - id: IMG-CATEGORY
        reference: reference/category.png
        page: category
      - id: IMG-CHECKOUT
        reference: reference/checkout.png
        page: checkout
    scenarios:
    - id: SCN-REQ-4.3-01
      name: Return to browsing
      steps:
      - id: STEP-REQ-4.3-01-01
        Given: |-
          Shopping cart contains one Hummingbird cart t-shirt added through the storefront.
        When: |-
          Activate Continue shopping.
        Then: Men opens with Hummingbird cart t-shirt available and the header Cart still reports one unit.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-CART)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-CHECKOUT)
    - id: SCN-REQ-4.3-02
      name: Enter checkout with selected cart
      steps:
      - id: STEP-REQ-4.3-02-01
        Given: |-
          Shopping cart contains one Hummingbird cart t-shirt added through the storefront.
        When: |-
          Activate Proceed to checkout.
        Then: Personal Information and Order summary open; the summary still contains the selected Hummingbird cart
          t-shirt.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-CART)
        - \ref[image](IMG-CATEGORY)
        - \ref[image](IMG-CHECKOUT)
    children: []
  - id: REQ-4.4
    name: Edit cart quantity directly
    description:
      text: |-
        Entering an available quantity for Hummingbird cart t-shirt and moving focus away updates its subtotal and the items subtotal to USD 25 times the entered quantity. Total adds USD 5 shipping, and Cart reports the number of units. For example, three units give an items subtotal of USD 75 and a total of USD 80.
      image:
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-4.4-01
      name: Edit cart quantity directly
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: |-
          Shopping cart contains one Hummingbird cart t-shirt priced 25, quantity 1 and shipping 5.
        When: |-
          Enter a valid quantity and move focus away to apply it.
        Then: |-
          Subtotal and Items subtotal equal USD 25 times the entered quantity, Total adds USD 5 shipping, and Cart reports the entered number of units.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-4.5
    name: Carry selected variant into cart
    description:
      text: |-
        Users choose L in "Size", select "Black", enter 2 in "Quantity", and click "Add to cart". Shopping cart displays "Hummingbird detail t-shirt" with that exact variant, quantity, and sale unit price 36. "Cart summary" shows Items subtotal 72, Shipping 5, Total 77, and informational Discount 18, calculated as 2×(45−36). The already-discounted subtotal is not discounted a second time.

        Cart rows expose named Unit price and Subtotal amounts. Cart summary exposes Items subtotal, Shipping, Total, and Discount when applicable. Variant text identifies "Size: <size>" and "Color: <color>". Cart count counts units, and cart state remains consistent across navigation within a flow.
      image:
      - id: IMG-PRODUCT-DETAIL
        reference: reference/product_detail.png
        page: product
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-4.5-01
      name: Carry selected variant into cart
      steps:
      - id: STEP-REQ-4.5-01-01
        Given: |-
          Hummingbird detail t-shirt detail is open with an empty cart; L/Black has stock 2 and sale/regular prices 36/45.
        When: Select L and Black, enter Quantity 2, click Add to cart and use Proceed to checkout in the success
          dialog.
        Then: The cart row retains L/Black and quantity 2 at unit price 36; Items subtotal is 72, Shipping 5, informational
          Discount 18 and Total 77, without deducting the discount again.
        references:
        - \ref[requirement](REQ-3.9)
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-PRODUCT-DETAIL)
        - \ref[image](IMG-CART)
    children: []
- id: REQ-5
  name: Checkout completion
  description:
    text: |-
      Checkout proceeds through Personal Information, Addresses, Shipping Method and Payment to Order confirmation. Continue advances the current step. Completed steps hide their editable fields and show summaries with editing actions. Reopening a step retains its data and the order products. Anonymous visitors can access sign-in, registration, or guest information; completing an order as a guest is unspecified.

      The store offers China as an address country, Delivery for USD 5, Bank wire payment, and a separate link to Terms and conditions. New orders receive an assigned reference.
  scenarios: []
  children:
  - id: REQ-5.1
    name: Start checkout and inspect customer information
    description:
      text: |-
        An anonymous customer checking out with Hummingbird checkout-step t-shirt sees Personal Information and Order summary with that product. A signed-in customer sees their saved email. Continue in Personal Information opens Addresses if needed, offering the customer's saved address without losing the order product.
      image:
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
      - id: IMG-CHECKOUT
        reference: reference/checkout.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Start anonymous checkout
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: |-
          An anonymous visitor has added one Hummingbird checkout-step t-shirt and opened Shopping cart through the storefront.
        When: Activate Proceed to checkout.
        Then: Personal Information opens for the anonymous customer, and Order summary contains Hummingbird checkout-step
          t-shirt.
        references:
        - \ref[requirement](REQ-4.3)
        - \ref[image](IMG-CART)
        - \ref[image](IMG-CHECKOUT)
    - id: SCN-REQ-5.1-02
      name: Inspect signed-in customer
      steps:
      - id: STEP-REQ-5.1-02-01
        Given: |-
          A customer has registered, signed in, created a shipping address and added Hummingbird checkout-step t-shirt.
        When: Proceed from Shopping cart into checkout; inspect Personal Information and click its Continue if Addresses
          is not already active.
        Then: |-
          Personal Information shows the customer's saved email. Addresses offers their saved shipping address and Order summary retains the product.
        references:
        - \ref[requirement](REQ-4.3)
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-CART)
        - \ref[image](IMG-CHECKOUT)
    children: []
  - id: REQ-5.2
    name: Select shipping address
    description:
      text: |-
        Addresses offers the customer's saved shipping address and shows its street and whether it is selected. Selecting it and choosing Continue opens Shipping Method without changing the selected product.
      image:
      - id: IMG-CHECKOUT-ADDRESS
        reference: reference/checkout_address.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Select Home address
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: |-
          A signed-in customer has created a shipping address and reached Addresses with one Hummingbird checkout-step t-shirt.
        When: |-
          Select the saved address, inspect the selection and street, and choose Continue in Addresses.
        Then: |-
          The saved address is selected with its recorded street. Shipping Method opens and Order summary retains the product.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-CHECKOUT-ADDRESS)
    children: []
  - id: REQ-5.3
    name: Create checkout shipping address
    description:
      text: |-
        Add new address in Addresses lets customers enter their chosen Alias, First name, Last name, Address, Postal code, City, Country, and Phone. Save makes the address available for selection with its entered alias and street and preserves the order product.
      image:
      - id: IMG-CHECKOUT-ADDRESS
        reference: reference/checkout_address.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.3-01
      name: Save new checkout address
      steps:
      - id: STEP-REQ-5.3-01-01
        Given: |-
          A signed-in customer has no saved address and has reached Addresses with Hummingbird checkout-step t-shirt.
        When: |-
          Choose Add new address, enter a chosen alias and valid recipient, street, postal code, city, country, and phone, and choose Save.
        Then: |-
          The saved address shows its entered alias and street and is available for selection. The order product is retained.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-CHECKOUT-ADDRESS)
    children: []
  - id: REQ-5.4
    name: Separate invoice address and choose carrier
    description:
      text: |-
        Clearing Use same address reveals Invoice address with the saved address available for billing. After the customer selects their shipping address and continues, Shipping Method offers Delivery at USD 5 and shows its selection state. For the USD 26 Hummingbird checkout-step t-shirt, the summary total is USD 31.
      image:
      - id: IMG-CHECKOUT-SHIPPING
        reference: reference/checkout_shipping.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.4-01
      name: Use separate invoice address
      steps:
      - id: STEP-REQ-5.4-01-01
        Given: |-
          A signed-in customer created a shipping address and reached Addresses with Hummingbird checkout-step t-shirt.
        When: |-
          Clear Use same address.
        Then: |-
          Invoice address opens and offers the saved address for billing.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-CHECKOUT-SHIPPING)
    - id: SCN-REQ-5.4-02
      name: Choose Delivery
      steps:
      - id: STEP-REQ-5.4-02-01
        Given: |-
          A signed-in customer has saved a shipping address and is checking out with Hummingbird checkout-step t-shirt at USD 26.
        When: |-
          Select the saved address, choose Continue in Addresses and choose Delivery in Shipping Method.
        Then: |-
          Delivery is selected at USD 5. Order summary retains the product and shows USD 31 total.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-CHECKOUT-SHIPPING)
    children: []
  - id: REQ-5.5
    name: Choose payment and read terms
    description:
      text: |-
        At Payment, customers select Bank wire and agree to Terms and conditions. The separate Terms and conditions link opens the agreement text. Place order completes the order only after agreement. Without agreement, the order does not complete and the summary retains the selected product.
      image:
      - id: IMG-CHECKOUT-PAYMENT
        reference: reference/checkout_payment.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.5-01
      name: Choose bank wire and read terms
      steps:
      - id: STEP-REQ-5.5-01-01
        Given: |-
          A signed-in customer has selected their saved address and Delivery and reached Payment with Hummingbird checkout-step t-shirt.
        When: |-
          Select Bank wire and the Terms and conditions agreement, and activate the separate Terms and conditions link.
        Then: |-
          Bank wire and agreement are selected and the link opens the agreement content.
        references:
        - \ref[requirement](REQ-5.4)
        - \ref[image](IMG-CHECKOUT-PAYMENT)
    - id: SCN-REQ-5.5-02
      name: Require terms before completion
      steps:
      - id: STEP-REQ-5.5-02-01
        Given: |-
          A signed-in customer has reached Payment with their address and Delivery selected and Hummingbird checkout-step t-shirt in the summary.
        When: Select Bank wire, leave Terms and conditions unchecked, and attempt Place order if the action is enabled.
        Then: Order confirmation is not displayed; the product remains in Order summary and agreement is still required,
          whether Place order is disabled or the attempt is rejected.
        references:
        - \ref[requirement](REQ-5.4)
        - \ref[image](IMG-CHECKOUT-PAYMENT)
    children: []
  - id: REQ-5.6
    name: Place order and inspect completion
    description:
      text: |-
        After selecting the shipping address, Delivery, Bank wire, and Terms and conditions, Place order shows confirmation for the selected product. The new Order reference is assigned at purchase. Order details shows the product, quantity, amounts, shipping address, delivery and payment. Continue shopping returns home with Search, My account and Cart available.
      image:
      - id: IMG-CHECKOUT
        reference: reference/checkout.png
        page: checkout
      - id: IMG-CHECKOUT-SUMMARY
        reference: reference/checkout_summary.png
        page: order_confirmation
    scenarios:
    - id: SCN-REQ-5.6-01
      name: Place order for selected product
      steps:
      - id: STEP-REQ-5.6-01-01
        Given: |-
          A signed-in customer has created a shipping address and added Hummingbird order-confirmation t-shirt.
        When: |-
          Select the saved address and Delivery, choose Bank wire and agree to Terms and conditions, then select Place order.
        Then: Order confirmation opens and identifies Hummingbird order-confirmation t-shirt.
        references:
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-CHECKOUT)
        - \ref[image](IMG-CHECKOUT-SUMMARY)
    - id: SCN-REQ-5.6-02
      name: Inspect completed order and continue shopping
      steps:
      - id: STEP-REQ-5.6-02-01
        Given: |-
          A signed-in customer has created a shipping address and added Hummingbird order-complete t-shirt.
        When: |-
          Complete checkout with the saved address, Delivery, Bank wire, and agreement. Inspect confirmation and choose Continue shopping.
        Then: |-
          Confirmation shows an assigned Order reference. Order details shows the product, quantity one, total USD 33, the saved shipping address, Delivery, and Bank wire. Continue shopping returns home with Search, My account and Cart available.
        references:
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-CHECKOUT)
        - \ref[image](IMG-CHECKOUT-SUMMARY)
    children: []
  - id: REQ-5.7
    name: Edit shipping address during checkout
    description:
      text: |-
        In Addresses, the edit action for a saved shipping address opens that address with its current alias and street. The customer can change the street and Save. The same address remains selectable under its alias, the summary retains the selected product, and Continue opens Shipping Method.
      image:
      - id: IMG-CHECKOUT-ADDRESS
        reference: reference/checkout_address.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.7-01
      name: Edit shipping address during checkout
      steps:
      - id: STEP-REQ-5.7-01-01
        Given: |-
          A signed-in customer has created a shipping address and reached Addresses with Hummingbird checkout-step t-shirt.
        When: |-
          Edit the selected address, check its current values, replace the street and choose Save. Select the same address and choose Continue.
        Then: |-
          The same alias is selectable with the replacement street. Shipping Method opens and the summary retains the product.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-CHECKOUT-ADDRESS)
    children: []
  - id: REQ-5.8
    name: Reopen completed shipping step
    description:
      text: |-
        At Payment, Edit Shipping Method reopens Shipping Method with Delivery still selected. Continue returns to Payment with the same product and USD 31 total, without placing an order.
      image:
      - id: IMG-CHECKOUT-SHIPPING
        reference: reference/checkout_shipping.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.8-01
      name: Reopen completed shipping step
      steps:
      - id: STEP-REQ-5.8-01-01
        Given: |-
          A signed-in customer has selected the saved address and Delivery and reached Payment with Hummingbird checkout-step t-shirt and total USD 31.
        When: Click Edit Shipping Method, inspect Delivery, then click Continue within Shipping Method.
        Then: Shipping Method reopens with Delivery checked; Payment returns with the same product and total 31,
          and no Order confirmation is created.
        references:
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-CHECKOUT-SHIPPING)
    children: []
  - id: REQ-5.9
    name: Collapse completed address step and reopen it
    description:
      text: |-
        After a customer completes Addresses, that step hides its selection controls, shows the saved address summary and offers Edit Addresses. Shipping Method becomes active. Reopening Addresses restores the same selection and preserves the order product.
      image:
      - id: IMG-CHECKOUT
        reference: reference/checkout.png
        page: checkout
    scenarios:
    - id: SCN-REQ-5.9-01
      name: Collapse completed address step and reopen it
      steps:
      - id: STEP-REQ-5.9-01-01
        Given: |-
          A signed-in customer has created a shipping address and reached Addresses with Hummingbird checkout-step t-shirt.
        When: |-
          Select the saved address, choose Continue, inspect the completed step, and choose Edit Addresses.
        Then: |-
          The selection controls are hidden in the completed step, the address summary and Edit Addresses remain, and Delivery is available. Reopening shows the same selected address and order product.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-CHECKOUT)
    children: []
- id: REQ-6
  name: Customer access
  description:
    text: |-
      Visitors sign in, register, request password reset, and sign out. Remember me duration and actual mailbox delivery are unspecified.
  scenarios: []
  children:
  - id: REQ-6.1
    name: Sign in with password visibility and remember option
    description:
      text: |-
        Sign in opens Email, a masked Password field, a Sign in submission action, and No account? Create one here. SHOW reveals the entered password, and Remember me is selectable. Signing in with the credentials saved at registration shows the customer's name, My account, and Sign out.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Open sign-in entry
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: An anonymous visitor is on the homepage.
        When: Activate Sign in in Global navigation.
        Then: Email and masked Password fields, the Sign in submit button and No account? Create one here link are
          visible.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-MY-ACCOUNT)
    - id: SCN-REQ-6.1-02
      name: Reveal password and sign in
      steps:
      - id: STEP-REQ-6.1-02-01
        Given: |-
          A customer has registered, signed out, and reopened Sign in.
        When: Enter those credentials, click SHOW, check Remember me, then click the Sign in submit button.
        Then: |-
          Email retains its value. Password becomes visible with the entered value and Remember me is selected. Successful sign-in shows the customer's name, My account and Sign out.
        references:
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-MY-ACCOUNT)
    children: []
  - id: REQ-6.2
    name: Register customer
    description:
      text: |-
        No account? Create one here opens registration with Mr., First name, Last name, Email, Password, Birthdate, Receive offers, Newsletter, and Terms. The visitor supplies their own valid values, an unused email, and the corresponding choices. Save creates a signed-in account displaying the new customer's name.
      image:
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-REGISTER
        reference: reference/register.png
        page: register
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Create new customer
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: |-
          A signed-out visitor opens Sign in with an unused email available.
        When: |-
          Choose No account? Create one here. Select Mr., enter chosen first name, last name, unused email, password, and birthdate, select Receive offers, Newsletter, and Terms, then choose Save.
        Then: |-
          A signed-in account opens and identifies the customer by their chosen name.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-REGISTER)
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-6.3
    name: Request password reset
    description:
      text: |-
        Forgot your password? opens Email and Send. Entering an existing customer's saved email produces a confirmation that a reset email was sent and identifies the submitted address. Mailbox delivery is unspecified.
      image:
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-FORGOT-PASSWORD
        reference: reference/forgot_password.png
        page: password_recovery
    scenarios:
    - id: SCN-REQ-6.3-01
      name: Request existing-account reset
      steps:
      - id: STEP-REQ-6.3-01-01
        Given: |-
          A customer has registered, signed out, and opened Sign in.
        When: |-
          Choose Forgot your password?, enter the saved email in Email, and select Send.
        Then: |-
          The confirmation says a reset email was sent and identifies the submitted address.
        references:
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    children: []
  - id: REQ-6.4
    name: Sign out to storefront
    description:
      text: |-
        Selecting Sign out from My account returns the customer home. Sign in, Cart, and Hummingbird detail t-shirt are visible, and Sign out is no longer offered.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-LOGOUT
        reference: reference/logout.png
        page: home
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Sign out from account
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: |-
          A registered customer has signed in and opened My account.
        When: Activate Sign out in Global navigation.
        Then: The homepage displays Sign in, Cart and Hummingbird detail t-shirt, and Sign out is unavailable.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-LOGOUT)
    children: []
- id: REQ-7
  name: Account management
  description:
    text: |-
      Signed-in customers can review their account, change credentials, manage addresses, inspect historical orders and invoices, reorder, and manage wishlists. Each command acts on its selected address, order, or collection.
  scenarios: []
  children:
  - id: REQ-7.1
    name: Inspect account overview
    description:
      text: |-
        My account shows the signed-in customer's name under the My account heading and offers Information, Addresses, Order history and details, and Wishlist.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Inspect account overview
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          A registered customer has signed in.
        When: |-
          Choose My account.
        Then: |-
          My account shows its heading, the signed-in customer's name, and Information, Addresses, Order history and details, and Wishlist.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-MY-ACCOUNT)
    children: []
  - id: REQ-7.2
    name: Change customer email and password
    description:
      text: |-
        In Information, customers can change Email and confirm with Current password. Save confirms the change, displays the new email, and retains the current password. To change the password, enter Current password and New password and Save. The final email and password permit sign-in to the same account.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-INFO
        reference: reference/my_account_info.png
        page: account_information
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-7.2-01
      name: Save email then password
      steps:
      - id: STEP-REQ-7.2-01-01
        Given: |-
          A registered customer has signed in and opened Information.
        When: |-
          Enter the saved password, replace Email with another unused valid email, and Save. Enter the current password and a chosen New password and Save again. Sign out and sign in with the new credentials.
        Then: Each save reports Profile update success; the new email remains displayed after the first save and
          the new email/password pair successfully signs in after the second.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-INFO)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-7.3
    name: Create and view addresses
    description:
      text: |-
        Addresses displays each saved address and its Update and Delete actions. Create new address opens Alias, First name, Last name, Address, Postal code, City, Country, and Phone. Users can review their chosen values before saving, and Save adds one entry with those values. For example, Office could be an address for Store User at 1 Commerce Road, 200000 Shanghai, China, phone 13800000020.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.3-01
      name: View Home address
      steps:
      - id: STEP-REQ-7.3-01-01
        Given: |-
          A signed-in customer created a shipping address with chosen values.
        When: |-
          Open Addresses from My account.
        Then: |-
          The saved address shows its values and offers Update and Delete.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    - id: SCN-REQ-7.3-02
      name: Create Office address
      steps:
      - id: STEP-REQ-7.3-02-01
        Given: |-
          A signed-in customer has opened an empty address book.
        When: |-
          Select Create new address and enter a valid alias, recipient, street, postal code, city, country, and phone. Review the entered values and choose Save.
        Then: |-
          Exactly one entry displays the saved values and offers Update and Delete.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.4
    name: Edit or delete named address
    description:
      text: |-
        A customer who has created an address can use its Update action to see the current alias and street, enter a different street, and Save changes to that same address. Using its Delete action and confirming removes only the selected address.
      image:
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.4-01
      name: Update Home street
      steps:
      - id: STEP-REQ-7.4-01-01
        Given: |-
          A signed-in customer has created an address and opened Addresses.
        When: |-
          Select Update for that address, inspect its saved alias and street, replace the street, and choose Save.
        Then: |-
          The same address shows its original alias and the replacement street, not the old street.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    - id: SCN-REQ-7.4-02
      name: Delete Home address
      steps:
      - id: STEP-REQ-7.4-02-01
        Given: |-
          A signed-in customer has created an address and opened Addresses.
        When: |-
          Select Delete for that address and confirm removal.
        Then: |-
          The address is removed and the list remains available.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.5
    name: Read historical orders and details
    description:
      text: |-
        Order history and details shows the order reference, product, date, status and total. Details, Reorder, and PDF apply to the selected order. Details shows the order's product, shipping address and payment method.

        The store opens with customer prestashop_order_history_user@example.com (Store User, password ShopPass123!, birthdate 1995-08-21) and one delivered order, PS-HISTORY-001, dated 2026-07-18 in UTC. It contains one Hummingbird order-history t-shirt at USD 29 plus USD 5 shipping, for a USD 34 total. It was paid by Bank wire and delivered to 1 Commerce Road, Shanghai 200000, China. The order has a downloadable PDF invoice.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-ORDER
        reference: reference/my_account_order.png
        page: account_orders
    scenarios:
    - id: SCN-REQ-7.5-01
      name: Inspect historical order list
      steps:
      - id: STEP-REQ-7.5-01-01
        Given: |-
          The store's existing history customer owns delivered order PS-HISTORY-001.
        When: Sign in and open Order history and details from My account.
        Then: The PS-HISTORY-001 row shows Hummingbird order-history t-shirt, 2026-07-18, Delivered and total 34,
          with Details, Reorder and PDF entries.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
    - id: SCN-REQ-7.5-02
      name: Inspect selected order details
      steps:
      - id: STEP-REQ-7.5-02-01
        Given: |-
          The history customer has signed in and opened Order history and details with PS-HISTORY-001.
        When: Activate Details within PS-HISTORY-001.
        Then: Order details identifies that reference and Hummingbird order-history t-shirt with its historical
          shipping address and Bank wire payment.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
    children: []
  - id: REQ-7.6
    name: Reorder or download invoice
    description:
      text: |-
        Reorder for PS-HISTORY-001 adds its available Hummingbird order-history t-shirt to Shopping cart at subtotal USD 29. PDF downloads a readable invoice whose filename identifies PS-HISTORY-001 and ends in .pdf.
      image:
      - id: IMG-MY-ACCOUNT-ORDER
        reference: reference/my_account_order.png
        page: account_orders
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-7.6-01
      name: Reorder historical product
      steps:
      - id: STEP-REQ-7.6-01-01
        Given: |-
          The history customer is viewing PS-HISTORY-001. Its historical product remains available and the cart is empty.
        When: |-
          Select Reorder for PS-HISTORY-001.
        Then: Shopping cart contains Hummingbird order-history t-shirt and subtotal 29.
        references:
        - \ref[requirement](REQ-7.5)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-7.6-02
      name: Download historical invoice
      steps:
      - id: STEP-REQ-7.6-02-01
        Given: |-
          The history customer is viewing PS-HISTORY-001.
        When: |-
          Choose PDF for that order.
        Then: |-
          A readable invoice downloads with a .pdf filename identifying PS-HISTORY-001.
        references:
        - \ref[requirement](REQ-7.5)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-ORDER)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-7.7
    name: Create or inspect wishlists
    description:
      text: |-
        Wishlist shows the customer's collections with opening, Edit and Delete actions for each. Create new wishlist opens a Name field. Save adds exactly one collection with the chosen name, such as Holiday Picks. Customers can create empty collections under their own account.

        The store opens with three existing customers, prestashop_wishlist_view_user@example.com, prestashop_wishlist_remove_user@example.com, and prestashop_wishlist_cart_user@example.com. Each is named Store User, uses password ShopPass123!, has birthdate 1995-08-21, and separately owns a Favorites collection containing Hummingbird wishlist t-shirt. Opening Favorites offers Remove and Add to cart for that product. Adding a product to a wishlist is outside these workflows.
      image:
      - id: IMG-MY-ACCOUNT
        reference: reference/my_account.png
        page: account
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.7-01
      name: Inspect seeded wishlist and products
      steps:
      - id: STEP-REQ-7.7-01-01
        Given: |-
          The existing viewing customer has Favorites containing Hummingbird wishlist t-shirt.
        When: Sign in, open Wishlist from My account, then activate Favorites.
        Then: |-
          Favorites is visible in the collections. Opening it shows Hummingbird wishlist t-shirt and its Add to cart action.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    - id: SCN-REQ-7.7-02
      name: Create Holiday Picks wishlist
      steps:
      - id: STEP-REQ-7.7-02-01
        Given: |-
          A registered customer has signed in and opened Wishlist.
        When: |-
          Choose Create new wishlist, enter a chosen Name, such as Holiday Picks, and choose Save.
        Then: |-
          One collection displays that name with its opening, Edit and Delete actions.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-MY-ACCOUNT)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
  - id: REQ-7.8
    name: Rename or delete a wishlist
    description:
      text: |-
        A customer who creates an empty collection can select its Edit action, see its current Name, replace it with another chosen name, and Save. The collection appears once under its new name and not under the old name. Delete removes the selected collection after confirmation.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.8-01
      name: Rename Favorites wishlist
      steps:
      - id: STEP-REQ-7.8-01-01
        Given: |-
          A signed-in customer has created an empty collection with a chosen name.
        When: |-
          Select Edit for that collection, check the current Name, enter a new name and choose Save.
        Then: |-
          The original name disappears and exactly one collection displays the chosen replacement.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    - id: SCN-REQ-7.8-02
      name: Delete Favorites wishlist
      steps:
      - id: STEP-REQ-7.8-02-01
        Given: |-
          A signed-in customer has created an empty collection with a chosen name.
        When: |-
          Select Delete for that collection and confirm removal.
        Then: |-
          The selected collection disappears.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
  - id: REQ-7.9
    name: Remove wishlist product or move it to cart
    description:
      text: |-
        In an existing Favorites collection, Remove for Hummingbird wishlist t-shirt removes that membership. Add to cart for the same item instead puts that exact product in the cart. If the wishlist remains open, the customer can use Cart to inspect the added product.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
      - id: IMG-CART
        reference: reference/cart.png
        page: cart
    scenarios:
    - id: SCN-REQ-7.9-01
      name: Remove Favorites product
      steps:
      - id: STEP-REQ-7.9-01-01
        Given: |-
          The existing removal customer has opened Favorites containing Hummingbird wishlist t-shirt.
        When: |-
          Choose Remove for that product.
        Then: Hummingbird wishlist t-shirt is removed from Favorites.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
        - \ref[image](IMG-CART)
    - id: SCN-REQ-7.9-02
      name: Add Favorites product to cart
      steps:
      - id: STEP-REQ-7.9-02-01
        Given: |-
          The existing shopping customer has opened Favorites containing Hummingbird wishlist t-shirt and has an empty cart.
        When: |-
          Select Add to cart for that product. Confirm Cart shows one unit and open the cart if it is not already open.
        Then: Shopping cart contains the exact Hummingbird wishlist t-shirt product.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
        - \ref[image](IMG-CART)
    children: []
  - id: REQ-7.10
    name: Delete only the selected address
    description:
      text: |-
        When the customer has created two addresses, confirming Delete for one removes only that address. The other remains once with its original alias, street, and phone.
      image:
      - id: IMG-MY-ACCOUNT-ADDRESS
        reference: reference/my_account_address.png
        page: account_addresses
    scenarios:
    - id: SCN-REQ-7.10-01
      name: Delete only the selected address
      steps:
      - id: STEP-REQ-7.10-01-01
        Given: |-
          A customer has created two addresses with distinct aliases and is viewing Addresses.
        When: |-
          Select Delete for one address and confirm removal.
        Then: |-
          Only that address disappears; the other remains exactly once with its original details.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[requirement](REQ-7.4)
        - \ref[image](IMG-MY-ACCOUNT-ADDRESS)
    children: []
  - id: REQ-7.11
    name: Delete only the selected wishlist
    description:
      text: |-
        When the customer has created two collections, confirming Delete for one removes only that collection. The other remains once under its original name and can still be opened.
      image:
      - id: IMG-MY-ACCOUNT-WISHLIST
        reference: reference/my_account_wishlist.png
        page: account_wishlists
    scenarios:
    - id: SCN-REQ-7.11-01
      name: Delete only the selected wishlist
      steps:
      - id: STEP-REQ-7.11-01-01
        Given: |-
          A signed-in customer has created two named empty collections.
        When: |-
          Select Delete for one collection, confirm removal, and open the other collection.
        Then: |-
          The selected collection disappears. The other remains exactly once and opens under its own name.
        references:
        - \ref[requirement](REQ-7.7)
        - \ref[requirement](REQ-7.8)
        - \ref[image](IMG-MY-ACCOUNT-WISHLIST)
    children: []
