id: ROOT
name: Keep personal note management
description:
  text: |-
    A personal note management application for creating, editing, organizing, searching, archiving, and deleting notes.

    The interface uses en-US. Note states are established through normal user actions. The titles, content and user-created label names in the examples illustrate values users can enter.
scenarios: []
children:
- id: REQ-1
  name: Workspace navigation
  description:
    text: |-
      Entry workspace and sidebar navigation.

      The personal workspace requires no authentication or reminder scheduler. Sidebar navigation actions expose current state when selected.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open and navigate the personal workspace
    description:
      text: |-
        Opening the application displays a personal notes workspace with the "Sidebar" expanded and "Notes" selected. The sidebar provides "Reminders", user-label actions, "Edit Labels", "Archived", and "Trash", each with an identifiable icon; Reminders is a default label with its own icon. Users can find notes through "Search", begin creation with "Take a note", open settings through "Settings menu", and switch the initial layout through "List view". The Toggle sidebar control collapses the sidebar to icons and expands it again, exposing the current state while preserving accessible navigation names. Text labels disappear when collapsed and return when expanded. Alignment, hover feedback, selected-item highlighting, and appearance follow the visual references.

        The Archived destination may display Archive, as shown in the sidebar reference. It remains identifiable when the sidebar text is hidden.

        The personal workspace requires no authentication or reminder scheduler. Sidebar navigation actions expose current state when selected.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-SIDEBAR
        reference: reference/sidebar.png
        page: notes
      - id: IMG-SIDEBAR-COLLAPSED
        reference: reference/sidebar_collapsed.png
        page: notes
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Open the workspace
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          A fresh browser opens the personal workspace without authentication; default label exists, the default layout is grid, and the sidebar starts expanded with Notes selected.
        When: Open the application entry and inspect "Sidebar", its Notes, Reminders, Archived, Trash and Edit Labels
          buttons, and the Search field, Settings menu, List view and Take a note buttons.
        Then: The sidebar is expanded and Notes is identifiable as selected. Each named sidebar action and each
          workspace control is visible, including the default Reminders action.
        references:
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-SIDEBAR)
        - \ref[image](IMG-SIDEBAR-COLLAPSED)
    - id: SCN-REQ-1.1-02
      name: Collapse and expand the sidebar
      steps:
      - id: STEP-REQ-1.1-02-01
        Given: |-
          The entry workspace is open with the sidebar expanded and Notes selected.
        When: Use Toggle sidebar, inspect sidebar text and accessible actions, then use the same control again.
        Then: After collapse, the visible Notes text is hidden while Notes, Reminders, Archived and Trash remain
          accessible and visible as actions. After expansion, the Notes text is visible again. The toggle makes
          both its expanded and collapsed states identifiable.
        references:
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-SIDEBAR)
        - \ref[image](IMG-SIDEBAR-COLLAPSED)
    children: []
- id: REQ-2
  name: Manage the note lifecycle
  description:
    text: |-
      All note states are created and changed through the personal workspace UI.

      Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

      Personal notes are created through Take a note, using their chosen title and content. Mutable note states and action notifications are produced by note actions, including delete, archive and Undo.
  scenarios: []
  children:
  - id: REQ-2.1
    name: List pinned and regular notes separately
    description:
      text: |-
        The active Notes view separates pinned notes into exactly one "Pinned notes" and regular notes into exactly one "Other notes". Every active note appears once in the appropriate section and is identifiable by its visible title, including with assistive technology. Archived and trashed notes do not appear in either section. Business identity identifies each note regardless of whether the presentation uses cards, a table, or another layout.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Separate pinned and regular notes
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: Notes is open. Through Take a note, Title, Content and Close, create a Sprint goals note with Finish the
          sprint and Pin note selected, and a regular Groceries note with Milk and bread.
        When: Inspect the "Pinned notes" and "Other notes" collections using each note's full title.
        Then: Each collection exists once. Sprint goals appears exactly once only in Pinned notes and Groceries
          exactly once only in Other notes; neither note is duplicated across sections and each remains visible
          with its saved content.
        references:
        - \ref[requirement](REQ-2.9)
        - \ref[image](IMG-HOME-PAGE)
    children: []
  - id: REQ-2.2
    name: Create and autosave a personal note
    description:
      text: |-
        Clicking "Take a note" opens "Note editor", where users enter "Title" and "Content". Clicking "Close" closes the editor and automatically saves one active note with the entered title and content; the note survives reload without an explicit save action. Creation accepts the nonempty titles and multiline content used in the scenarios; empty-input rules are unspecified. The editor also provides Pin note, Background color, and Change labels for their corresponding behaviors.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-CREATE-NOTE-HOME-PAGE
        reference: reference/create_note_home_page.png
        page: notes
      - id: IMG-CREATE-NOTE-FORM
        reference: reference/create_note_form.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Autosave on closing the editor
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: The personal Notes workspace is open and the New note title does not yet exist.
        When: Click "Take a note"; in "Note editor", fill Title with the New note name and Content with First line
          followed by a newline and Second line, then click Close without using any Save action.
        Then: Note editor closes and exactly one visible note with that title displays the entered title and both
          content lines.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CREATE-NOTE-HOME-PAGE)
        - \ref[image](IMG-CREATE-NOTE-FORM)
    - id: SCN-REQ-2.2-02
      name: Keep a created note after reload
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: Notes is open and no note uses the Persistent note title.
        When: Open Note editor through Take a note, enter the Persistent note title and Saved personal content, click
          Close, and reload the page.
        Then: The editor closes on save; after reload exactly one visible note retains that title and Saved personal
          content.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CREATE-NOTE-HOME-PAGE)
        - \ref[image](IMG-CREATE-NOTE-FORM)
    children: []
  - id: REQ-2.3
    name: Edit and persist note content
    description:
      text: |-
        Opening a particular note opens Note editor with that note's existing title and content. Changing Content and closing the editor saves the replacement content on the same note without changing its title or creating a duplicate. The updated content remains visible after reload.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-NOTE-EDITING
        reference: reference/note_editing.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Save an edited note
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: Notes contains a UI-created Project ideas note with Initial editable content, created through Take a
          note, Title, Content and Close.
        When: Open that note; verify Title and Content are prefilled, replace Content with Updated editable content,
          click Close, and reload.
        Then: The editor initially contains the saved title and content, then closes. After reload exactly one note
          retains the original title and replacement content, with no Initial editable content in that note.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-EDITING)
    children: []
  - id: REQ-2.4
    name: Delete notes and recover through notification Undo
    description:
      text: |-
        Users reveal a note's actions by hovering if necessary, then click "More options" and choose "Delete Note". Deletion immediately removes that note from active Notes, moves it to Trash without an additional confirmation, and displays "Note deleted" with "Undo" and "Dismiss notification". Undo restores the same title and content to active Notes, removes the note from Trash, and displays "Action undone". Dismiss notification closes the notification without reversing deletion; the same deleted note and its content remain in Trash after reload. Automatic notification dismissal and its timing are outside the acceptance scope.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-NOTE-MORE-OPTIONS-DROPDOWN
        reference: reference/note_more_options_dropdown.png
        page: notes
      - id: IMG-NOTE-DELETE-NOTIFICATION
        reference: reference/note_delete_notification.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Move a deleted note to Trash
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: Notes contains the UI-created Delete me 2.3.1 note with Deletion preserves this content.
        When: Hover that note if necessary, click More options, choose Delete Note from the menu, then click Trash in
          Sidebar.
        Then: Deletion opens no confirmation dialog and removes the note from Notes immediately. Note deleted status
          exposes Undo, and Trash contains exactly one note with the same title and content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    - id: SCN-REQ-2.4-02
      name: Undo deletion
      steps:
      - id: STEP-REQ-2.4-02-01
        Given: Notes contains the UI-created Delete me 2.3.2 note with Undo restores this content.
        When: Use More options and Delete Note, click Undo within Note deleted status, then open Trash.
        Then: Action undone status appears and Notes again contains exactly one note with the same title and content.
          The restored note is absent from Trash.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    - id: SCN-REQ-2.4-03
      name: Dismiss deletion notifications
      steps:
      - id: STEP-REQ-2.4-03-01
        Given: Notes contains the UI-created Manual dismissal note with Dismissal preserves deleted content.
        When: Delete the note through its menu, click Dismiss notification in Note deleted status, then open Trash
          and reload.
        Then: The notification closes without Undo. The note stays absent from active Notes, while Trash retains
          exactly one note with the same title and content before and after reload.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    children: []
  - id: REQ-2.5
    name: Inspect and empty Trash with persistent deleted notes
    description:
      text: |-
        Clicking "Trash" displays deleted notes in "Deleted notes", excluding active and archived notes. Deleted notes retain their titles and contents across navigation and reload until a user action restores or permanently removes them. "Empty Trash" permanently removes all currently deleted notes while preserving active notes. If confirmation is offered, it appears as "Empty Trash" with an "Empty Trash" confirmation action. Automatic age-based deletion is outside the acceptance scope.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        Users create and delete their own notes; Trash does not require pre-existing deleted notes.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-TRASH-LIST
        reference: reference/trash_list.png
        page: trash
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Keep a deleted note in Trash after reload
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: Through Take a note, Title, Content and Close, create the Trash persistence note with Deleted content
          survives reload, then delete it through its More options menu.
        When: Open Trash in Sidebar, reload the page, then select Notes.
        Then: Deleted notes contains exactly one note with the saved title and content after reload. The same
          deleted note remains absent from active Notes.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    - id: SCN-REQ-2.5-02
      name: Show deleted notes separately
      steps:
      - id: STEP-REQ-2.5-02-01
        Given: Through normal note creation, create Delete me 2.3.3 with Recently deleted content and Movie list with
          Active control content; delete only Delete me 2.3.3 through its menu.
        When: Click Trash in Sidebar and inspect Deleted notes.
        Then: The deleted note appears exactly once with its saved content; the active Movie list note is absent
          from Trash.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    - id: SCN-REQ-2.5-03
      name: Empty Trash without deleting active notes
      steps:
      - id: STEP-REQ-2.5-03-01
        Given: Create Empty trash A with Discard A, Empty trash B with Discard B and Active control with Keep active
          content. Delete A and B through UI and open Trash, confirming both deleted notes are present.
        When: Click Empty Trash. If an Empty Trash dialog is offered, click its Empty Trash confirmation button.
          Reload Trash, then click Notes.
        Then: Deleted notes contains no notes before and after reload. Active control remains exactly once with its
          content, while deleted A and B remain absent from Notes.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    children: []
  - id: REQ-2.6
    name: Archive notes and restore them to active Notes
    description:
      text: |-
        Clicking "Archive" moves the selected active note out of Notes into "Archived notes" and displays "Note archived" with "Undo". Undo restores the same note and content to Notes, removes it from the archive, and shows Action undone. Clicking "Archived" displays archived notes separately from active notes; "Unarchive" returns the chosen note to Notes. Every transition addresses that note's business identity and remains observable after reload.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-ARCHIVE-BUTTON
        reference: reference/archive_button.png
        page: notes
      - id: IMG-ARCHIVED-NOTES-PAGE
        reference: reference/archived_notes_page.png
        page: archived_notes
      - id: IMG-UNARCHIVE-BUTTON
        reference: reference/unarchive_button.png
        page: archived_notes
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Archive a note into its separate list
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: Notes contains UI-created Travel plans 2.5.1 with Trip itinerary and Active archive control with Stay
          active.
        When: Hover Travel plans, click Archive, open Archived in Sidebar, then return to Notes and reload.
        Then: Note archived status exposes Undo; Archived notes contains exactly one Travel plans note with Trip
          itinerary and excludes the active control. After reload Notes excludes Travel plans and retains the active
          control with Stay active.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    - id: SCN-REQ-2.6-02
      name: Undo archiving
      steps:
      - id: STEP-REQ-2.6-02-01
        Given: Notes contains Travel plans 2.5.2 with Return this itinerary.
        When: Click Archive, then Undo in Note archived status, and inspect Archived.
        Then: Action undone appears, Notes restores the same title and content exactly once, and Archived excludes
          the restored note.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    - id: SCN-REQ-2.6-03
      name: Unarchive the selected note
      steps:
      - id: STEP-REQ-2.6-03-01
        Given: Create Travel plans 2.5.4 with Selected itinerary and Other archived note with Other itinerary, archive
          both through UI, and open Archived where both are visible.
        When: Hover only Travel plans, click its Unarchive, then open Notes and reload.
        Then: Archived removes only Travel plans and retains Other archived note with its content. Notes displays
          Travel plans exactly once with Selected itinerary after reload and excludes the other archived note.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    children: []
  - id: REQ-2.7
    name: Apply note background colors
    description:
      text: |-
        Clicking "Background color" on an existing note, or "Background color" in Note editor, opens a palette where "Light green" applies a visibly light-green background to the note itself. The existing-note control then identifies Light green as the selected background. Notes created with this selection autosave with the same background, and selected colors persist after reload. Changing only a palette or badge is insufficient; the reference guides the appearance without requiring an exact shade.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-NOTE-COLORING
        reference: reference/note_coloring.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.7-01
      name: Color an existing note
      steps:
      - id: STEP-REQ-2.7-01-01
        Given: Notes contains Garden tasks existing with Water the herbs, created through the normal editor.
        When: Hover that note, click Background color, choose Light green, then reload and inspect the note and its
          color action.
        Then: The same note and content persist. Its surface has a light-green background and its color control
          identifies Light green as selected; a changed action name alone is insufficient.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-COLORING)
    - id: SCN-REQ-2.7-02
      name: Create a colored note
      steps:
      - id: STEP-REQ-2.7-02-01
        Given: Notes is open and no note uses the Garden tasks created title.
        When: Click Take a note, enter that title and Plant spring herbs, click Background color in Note editor
          and choose Light green, then Close and reload.
        Then: Exactly one note retains the entered content after reload with a light-green surface and Light green
          identified as the selected color.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-COLORING)
    children: []
  - id: REQ-2.8
    name: Assign and remove note labels
    description:
      text: |-
        Users open a note's More options menu and choose "Change labels", or click "Change labels" in Note editor, to open "Note labels". Each available label is selectable through "{label}". Users may assign one or more labels, or clear a checked label to remove its assignment; "Done" closes the chooser and retains the selections. Assigned labels appear visibly on the note, drive sidebar filtering consistently, and persist after closing and reload. The default Reminders label is available when creating a note.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-ASSIGN-LABEL-TO-NOTE
        reference: reference/assign_label_to_note.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.8-01
      name: Assign multiple labels and filter by either
      steps:
      - id: STEP-REQ-2.8-01-01
        Given: Through Edit Labels, New label and Create label, create Work and Personal labels. Create Team retro add
          label with Retro decisions and no assigned labels.
        When: On that note choose More options then Change labels; check Work and Personal in Note labels, click Done,
          reload, and select each label in Sidebar in turn.
        Then: Both labels are visible on the note after reload. Either sidebar selection displays exactly one matching
          note with the same title and Retro decisions.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    - id: SCN-REQ-2.8-02
      name: Remove an assigned label
      steps:
      - id: STEP-REQ-2.8-02-01
        Given: Create Work and two notes through UI, Team retro remove label with Remove membership and Other Work note
          with Keep membership; assign Work to both through the editor's Change labels chooser.
        When: Open Change labels for Team retro, clear its Work checkbox and click Done; reload, then select Work
          in Sidebar.
        Then: Work no longer appears on Team retro. The Work-filtered list excludes that note and retains Other
          Work note exactly once with Keep membership.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    - id: SCN-REQ-2.8-03
      name: Create a note with Reminders
      steps:
      - id: STEP-REQ-2.8-03-01
        Given: |-
          The default Reminders label exists and Notes is open; the Call dentist created title is unused.
        When: Open Note editor, enter that title and Arrange the appointment, choose Change labels, check Reminders,
          click Done and Close, then select Reminders in Sidebar.
        Then: The saved note visibly carries Reminders and appears exactly once with Arrange the appointment in
          the Reminders-filtered list.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    children: []
  - id: REQ-2.9
    name: Pin and unpin notes
    description:
      text: |-
        Clicking "Pin" moves that regular active note into Pinned notes exactly once and changes its pin action to "Unpin" to indicate that it is pinned. Unpin moves it back to Other notes and restores Pin to indicate that it is not pinned. In Note editor, "Pin note" toggles the pin state so closing the editor creates the note with the chosen pin state. These transitions preserve content, never duplicate the note, and survive reload.

        Note actions revealed on hover remain keyboard-accessible. Users can identify the note actions and fields, including with assistive technology. Note actions are scoped to the note identified by its visible title.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        Notes and their mutable action states are produced by the described note interactions.
      image:
      - id: IMG-PIN-BUTTON
        reference: reference/pin_button.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.9-01
      name: Pin an existing note
      steps:
      - id: STEP-REQ-2.9-01-01
        Given: Notes contains Meeting agenda 2.8.1 with Discuss the launch as a regular unpinned note.
        When: Hover it, click Pin, reload, and inspect its section and pin action.
        Then: The same note and content appear exactly once in Pinned notes and not Other notes. Unpin identifies that
          the note is pinned.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    - id: SCN-REQ-2.9-02
      name: Unpin an existing note
      steps:
      - id: STEP-REQ-2.9-02-01
        Given: Create Meeting agenda 2.8.2 with Keep meeting content through Note editor with Pin note selected.
        When: Hover the saved pinned note, click Unpin, reload, and inspect its section and action.
        Then: The note appears exactly once only in Other notes with unchanged content; Pin identifies that the note
          is not pinned.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    - id: SCN-REQ-2.9-03
      name: Create a pinned note
      steps:
      - id: STEP-REQ-2.9-03-01
        Given: Notes is open and the Pinned at creation title is unused.
        When: Open Note editor, enter that title and Pinned creation content, click Pin note, click Close, and reload.
        Then: The note and content persist exactly once only in Pinned notes, and its Unpin action identifies that it
          is pinned.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    children: []
- id: REQ-3
  name: Organize with labels
  description:
    text: |-
      User-created labels and the default Reminders label organize active notes.

      User labels are created through Edit Labels.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Create user labels
    description:
      text: |-
        Clicking "Edit Labels" opens "Edit Labels". Users enter a nonempty name in "New label" and click "Create label", adding that label exactly once to management and the sidebar. Its editable name appears in "Label name", and the sidebar exposes "{label}" for filtering. "Done" closes management, and the created label persists after reload. Empty-name and duplicate-name validation are unspecified.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        User labels are created through Edit Labels, while the default Reminders label already exists.
      image:
      - id: IMG-MANAGE-LABELS
        reference: reference/manage_labels.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Create a user label
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          Notes is open with the default Reminders label; the New user label name does not exist.
        When: Click Edit Labels, enter the name in New label, click Create label and Done; reload, reopen Edit Labels
          and inspect Label name.
        Then: Sidebar exposes exactly one visible action with the new label name, and management exposes exactly one
          Label name field containing that name. Done closes management.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-MANAGE-LABELS)
    children: []
  - id: REQ-3.2
    name: Filter Notes through sidebar labels
    description:
      text: |-
        Clicking "{label}" within "Sidebar" displays only active notes assigned that label, each exactly once, and makes the selected navigation action identifiable. "Notes" clears the label filter and restores the complete active list. The always-present "Reminders", with its own icon, filters by the default label in the same way. Both sidebar actions and labels on notes are identified by business identity rather than position.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        User labels are created through Edit Labels, while the default Reminders label already exists.
      image:
      - id: IMG-SIDEBAR
        reference: reference/sidebar.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Filter by a user label
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: Create Work and two notes through UI, Design review with Work design decisions assigned Work and
          unlabeled Movie list with An unlabeled movie note.
        When: Select the Work button in Sidebar.
        Then: Exactly one Design review note displays its saved content; Movie list is hidden and the selected Work
          action is identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-SIDEBAR)
    - id: SCN-REQ-3.2-02
      name: Return to the complete notes list
      steps:
      - id: STEP-REQ-3.2-02-01
        Given: Create Work, Design review with Design details assigned Work, and Movie list with Movie details. Select
          Work and verify Movie list is hidden.
        When: Click Notes in Sidebar.
        Then: Both notes reappear exactly once with their saved contents, and Notes is identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-SIDEBAR)
    - id: SCN-REQ-3.2-03
      name: Filter by the default Reminders label
      steps:
      - id: STEP-REQ-3.2-03-01
        Given: |-
          Create Call dentist existing with Dentist details assigned Reminders and unlabeled Movie list with Movie details through the editor.
        When: Click Reminders in Sidebar.
        Then: The reminder note appears exactly once with Dentist details, Movie list is hidden, and Reminders is
          identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-SIDEBAR)
    children: []
  - id: REQ-3.3
    name: Rename and delete user labels
    description:
      text: |-
        Clicking "Edit Labels" opens "Edit Labels", where each user label is identified by its business name. Users change "Label name" and click "Save label". Rename updates the sidebar's "{label}" and labels on notes without losing membership. Clicking "Delete label" removes the label from the sidebar and assigned notes while preserving their content. "Done" closes management; renames and deletions persist after reload. Modifying Reminders is outside scope.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.

        User labels are created through Edit Labels, while the default Reminders label already exists.
      image:
      - id: IMG-MANAGE-LABELS
        reference: reference/manage_labels.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.3-01
      name: Rename a label and retain membership
      steps:
      - id: STEP-REQ-3.3-01-01
        Given: Create Work editable and a Label rename control note with Retain label membership assigned to it through
          UI.
        When: Open Edit Labels, replace Label name with Work renamed, click Save label and Done; reload and select the
          renamed sidebar label.
        Then: Sidebar contains the renamed label once and no original label. The note displays the new label without
          the old one, and filtering by the new name still finds the same note and content.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-MANAGE-LABELS)
    - id: SCN-REQ-3.3-02
      name: Delete a label without deleting its note
      steps:
      - id: STEP-REQ-3.3-02-01
        Given: Create Disposable label and Label delete control with Keep this labeled note assigned to that label.
        When: Open Edit Labels, click Delete label, click Done, and reload.
        Then: The deleted label is absent from Sidebar and the note, while the note remains exactly once with unchanged
          title and Keep this labeled note.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-MANAGE-LABELS)
    children: []
- id: REQ-4
  name: Find personal notes
  description:
    text: Search results follow keyword and suggested-filter criteria.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Search keywords and suggested filters
    description:
      text: |-
        Entering a keyword in "Search" filters active notes by case-insensitive title or content matches. Each matching fragment is visibly distinguished from surrounding text within its note, and the highlighting covers only the matching text. Searching st includes Study schedule by title and a separate note containing st only in its content, while excluding notes with neither match. Focusing Search displays "Suggested filters"; choosing "Reminders" there filters active notes by the default label. Clearing Search and selecting Notes restores the full active list.

        The current search follows Search input or the Suggested filters selection.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.
      image:
      - id: IMG-SEARCH-SUGGESTED-FILTERS
        reference: reference/search_suggested_filters.png
        page: notes
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Search title and content with highlights
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: Through UI create Study schedule with Math on Monday, Reading plan with Read a story, and Ocean memo
          with Calm blue waves.
        When: Enter st in Search; inspect the highlighted text in each matching note. Clear Search and click Notes.
        Then: Study schedule and Reading plan appear once while Ocean memo is hidden; each match has a visible
          highlight on only the matching st, case-insensitively. Clearing restores all three notes with their
          contents.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-SEARCH-SUGGESTED-FILTERS)
    - id: SCN-REQ-4.1-02
      name: Choose a suggested label filter
      steps:
      - id: STEP-REQ-4.1-02-01
        Given: |-
          Create Call dentist existing with Reminder content assigned Reminders and unlabeled Movie list with Unlabeled content.
        When: Focus Search, click Reminders within Suggested filters, then clear Search and select Notes.
        Then: Suggested filters is visible on focus; its Reminders choice includes only the reminder note. Clearing
          restores both notes exactly once with their saved contents.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-SEARCH-SUGGESTED-FILTERS)
    children: []
- id: REQ-5
  name: Configure the workspace
  description:
    text: Settings and note layouts are user observable configuration behaviors.
  scenarios: []
  children:
  - id: REQ-5.1
    name: Open and save or cancel application settings
    description:
      text: |-
        Clicking "Settings menu" opens a menu; choosing "Settings" opens "Settings". Users configure "Add new items to the bottom" and "Move checked items to bottom", then click "Save" to commit the options and close, or "Cancel" to close without applying pending changes. Reopening reflects saved selections and discards canceled edits, and saved selections survive reload. Additional checklist or list-item behavior is unspecified.

        Saved setting selections are produced through Settings and Save. Initial setting values are not fixed by the requirements.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.
      image:
      - id: IMG-SETTINGS-DROPDOWN
        reference: reference/settings_dropdown.png
        page: notes
      - id: IMG-SETTINGS-SETTINGS
        reference: reference/settings_settings.png
        page: notes
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Save settings and discard canceled changes
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: Notes is open. Open Settings menu, choose Settings and record the current Add new items to the bottom
          checkbox value; Move checked items to bottom, Save and Cancel are available.
        When: Toggle Add new items to the bottom to the opposite value and click Save. Reload and reopen Settings,
          toggle it back but click Cancel, then reopen once more.
        Then: Save closes the dialog and the saved value survives reload. Cancel closes the dialog without committing
          its pending toggle; reopening still shows the previously saved value.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SETTINGS-DROPDOWN)
        - \ref[image](IMG-SETTINGS-SETTINGS)
    children: []
  - id: REQ-5.2
    name: Switch between default grid and list layouts
    description:
      text: |-
        A fresh workspace displays a grid in "Notes" and makes Grid view identifiable, including with assistive technology. Clicking "List view" changes the same notes to a single-column list, makes List view identifiable, and offers "Grid view". Grid view restores the grid and List view action. At a desktop width, populated grid cards occupy multiple columns while list surfaces align in one column; switching preserves titles, content, and note count. Appearance follows the visual references.

        This is a personal workspace without authentication or a reminder scheduler; Reminders is a label, not a scheduled notification feature. The interface uses en-US.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-LIST-VIEW
        reference: reference/list_view.png
        page: notes
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Switch grid to list and back
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: At a desktop width, Notes starts in Grid view with the List view action available. Create View alpha,
          View beta and View gamma notes, each with Layout content.
        When: Click List view and inspect the three note surfaces, then click Grid view and inspect them again.
        Then: List mode reports List view, offers Grid view, and aligns nonoverlapping notes in one column; grid
          mode reports Grid view, offers List view and arranges populated cards across multiple columns. Both modes
          retain exactly one of each note and its content without prescribing exact pixel widths.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-LIST-VIEW)
    children: []
