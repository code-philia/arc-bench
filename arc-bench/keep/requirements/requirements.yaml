id: ROOT
name: Keep personal note management
type: FOLDER
dependencies: []
description: A personal note management application for creating, editing, organizing, searching, archiving, and deleting notes.
environment:
  benchmark_now: '2026-07-21T12:00:00.000Z'
  timezone: UTC
  locale: en-US
  clock: Client and server use benchmark_now for time-dependent note retention; historical retention fixtures use the dates declared in the data registry.
data:
- id: DATA-REMINDERS
  lifecycle: SEED
  entity: default label
  properties:
    name: Reminders
    icon: distinct reminder icon
- id: DATA-EXPIRED
  lifecycle: SEED
  entity: historical deleted note
  properties:
    title: Expired seven-day note
    content: Historical expired content
    deleted_at: '2026-07-14T12:00:00.000Z'
    target: historical
- id: DATA-RECENT
  lifecycle: SEED
  entity: historical deleted note
  properties:
    title: Recent six-day note
    content: Historical retained content
    deleted_at: '2026-07-15T12:00:00.000Z'
    target: historical
- id: DATA-NOTES
  lifecycle: CREATED
  entity: personal note
  properties:
    identity: source example title plus run/worker/case suffix
    content: scenario-supplied content
    creation: Take a note UI; mutable states generated by note actions
- id: DATA-LABELS
  lifecycle: CREATED
  entity: user label
  properties:
    identity: source example label plus run/worker/case suffix
    creation: Edit Labels UI
- id: DATA-NOTIFICATION
  lifecycle: DERIVED
  entity: action notification
  properties:
    creation: delete/archive/Undo UI behavior
- id: DATA-SEARCH
  lifecycle: DERIVED
  entity: current search
  properties:
    creation: Search input or Suggested filters selection
- id: DATA-SETTINGS
  lifecycle: DERIVED
  entity: saved setting selection
  properties:
    creation: Settings UI Save; initial values are not fixed
- id: DATA-VIEW
  lifecycle: DERIVED
  entity: current note layout
  properties:
    initial: grid
    creation: List view / Grid view UI
children:
- id: REQ-1
  name: Workspace navigation
  type: FOLDER
  dependencies: []
  description: |-
    Entry workspace and sidebar navigation.

    The personal workspace requires no authentication or reminder scheduler. Sidebar navigation actions expose current state when selected.
  children:
  - id: REQ-1.1
    name: Open and navigate the personal workspace
    type: ATOMIC
    dependencies: []
    description: |-
      Opening the application displays a personal notes workspace with the "Sidebar"(role=navigation) expanded and "Notes"(role=button) selected. The sidebar provides "Reminders"(role=button), user-label actions, "Edit Labels"(role=button), "Archived"(role=button), and "Trash"(role=button), each with an identifiable icon; Reminders is a default label with its own icon. Users can find notes through "Search"(role=searchbox), begin creation with "Take a note"(role=button), open settings through "Settings menu"(role=button), and switch the initial layout through "List view"(role=button). "Toggle sidebar"(role=button) collapses the sidebar to icons and expands it again, exposing its expanded state while preserving accessible navigation names. Text labels disappear when collapsed and return when expanded. Alignment, hover feedback, selected-item highlighting, and appearance follow the visual references; screenshot similarity is not a functional oracle.

      ![image](./reference/home_page.png)
      ![image](./reference/sidebar.png)
      ![image](./reference/sidebar_collapsed.png)
    data:
      requires:
      - DATA-REMINDERS
      - DATA-VIEW
    scenarios:
    - name: Open the workspace
      steps:
      - keyword: GIVEN
        content: A fresh browser opens the personal workspace without authentication; DATA-REMINDERS exists, the default
          layout is grid, and the sidebar starts expanded with Notes selected.
      - keyword: WHEN
        content: Open the application entry and inspect "Sidebar"(role=navigation), its Notes, Reminders, Archived,
          Trash and Edit Labels buttons, and the Search searchbox, Settings menu, List view and Take a note buttons.
      - keyword: THEN
        content: Sidebar is visible; Toggle sidebar reports expanded=true and Notes reports current=true. Each named
          sidebar action and each workspace control is visible, including the default Reminders action.
    - name: Collapse and expand the sidebar
      steps:
      - keyword: GIVEN
        content: The entry workspace is open with Sidebar expanded, Notes selected, and Toggle sidebar reporting expanded=true.
      - keyword: WHEN
        content: Click "Toggle sidebar"(role=button), inspect sidebar text and accessible actions, then click the same
          button again.
      - keyword: THEN
        content: After collapse, expanded=false and the visible Notes text is hidden while Notes, Reminders, Archived
          and Trash remain accessible and visible as actions. After expansion, expanded=true and the Notes text is visible
          again.
- id: REQ-2
  name: Manage the note lifecycle
  type: FOLDER
  dependencies: []
  description: |-
    All note states are created and changed through the personal workspace UI.

    Note actions revealed on hover remain keyboard-accessible. Actions are buttons except menu choices, which are menuitems; fields have associated accessible names. Note actions are scoped to the note region identified by its visible title.
  children:
  - id: REQ-2.1
    name: List pinned and regular notes separately
    type: ATOMIC
    dependencies:
    - REQ-2.2
    - REQ-2.9
    description: |-
      The active Notes view separates pinned notes into exactly one "Pinned notes"(role=region) and regular notes into exactly one "Other notes"(role=region). Every active note appears once in the appropriate section as "{title}"(role=region), whose accessible name equals that note's visible title. Archived and trashed notes do not appear in either section. Business identity identifies each note regardless of whether the presentation uses cards, a table, or another layout.

      ![image](./reference/home_page.png)
    data:
      requires:
      - DATA-NOTES
    scenarios:
    - name: Separate pinned and regular notes
      steps:
      - keyword: GIVEN
        content: Notes is open. Through Take a note, Title, Content and Close, create a case-isolated Sprint goals note
          with Finish the sprint and Pin note selected, and a regular Groceries note with Milk and bread.
      - keyword: WHEN
        content: Inspect the "Pinned notes"(role=region) and "Other notes"(role=region) collections using each note's
          full isolated title.
      - keyword: THEN
        content: Each collection exists once. Sprint goals appears exactly once only in Pinned notes and Groceries exactly
          once only in Other notes; neither note is duplicated across sections and each remains visible with its saved
          content.
  - id: REQ-2.2
    name: Create and autosave a personal note
    type: ATOMIC
    dependencies: []
    description: |-
      Clicking "Take a note"(role=button) opens "Note editor"(role=dialog), where users enter "Title"(role=textbox) and "Content"(role=textbox). Clicking "Close"(role=button) closes the editor and automatically saves one active note with the entered title and content; the note survives reload without an explicit save action. Creation accepts the nonempty titles and multiline content used in the scenarios; empty-input rules are unspecified. The editor also provides Pin note, Background color, and Change labels for their corresponding behaviors.

      ![image](./reference/create_note_home_page.png)
      ![image](./reference/create_note_form.png)
    data:
      requires:
      - DATA-NOTES
    scenarios:
    - name: Autosave on closing the editor
      steps:
      - keyword: GIVEN
        content: The personal Notes workspace is open and the case-isolated New note title does not yet exist.
      - keyword: WHEN
        content: Click "Take a note"(role=button); in "Note editor"(role=dialog), fill Title with the isolated New note
          name and Content with First line followed by a newline and Second line, then click Close without using any
          Save action.
      - keyword: THEN
        content: Note editor closes and exactly one visible note region with that title displays the entered title and
          both content lines.
    - name: Keep a created note after reload
      steps:
      - keyword: GIVEN
        content: Notes is open and no note uses the case-isolated Persistent note title.
      - keyword: WHEN
        content: Open Note editor through Take a note, enter the isolated Persistent note title and Saved personal content,
          click Close, and reload the page.
      - keyword: THEN
        content: The editor closes on save; after reload exactly one visible note region retains that title and Saved
          personal content.
  - id: REQ-2.3
    name: Edit and persist note content
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      Clicking "Open {title}"(role=button) on a particular note opens Note editor with that note's existing title and content. Changing Content and closing the editor saves the replacement content on the same note without changing its title or creating a duplicate. The updated content remains visible after reload.

      ![image](./reference/note_editing.png)
    data:
      requires:
      - DATA-NOTES
    scenarios:
    - name: Save an edited note
      steps:
      - keyword: GIVEN
        content: Notes contains a UI-created case-isolated Project ideas note with Initial editable content, created
          through Take a note, Title, Content and Close.
      - keyword: WHEN
        content: Click "Open {title}"(role=button) within that note; verify Title and Content are prefilled, replace
          Content with Updated editable content, click Close, and reload.
      - keyword: THEN
        content: The editor initially contains the saved title and content, then closes. After reload exactly one note
          retains the original title and replacement content, with no Initial editable content in that note.
  - id: REQ-2.4
    name: Delete notes and recover through notification Undo
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      Users reveal a note's actions by hovering if necessary, then click "More options {title}"(role=button) and choose "Delete Note"(role=menuitem). Deletion immediately removes that note from active Notes, moves it to Trash without an additional confirmation, and displays "Note deleted"(role=status) with "Undo"(role=button) and "Dismiss notification"(role=button). Undo restores the same title and content to active Notes, removes the note from Trash, and displays "Action undone"(role=status). Dismiss notification closes the notification without reversing deletion. The notification also disappears automatically after an implementation-selected lifetime; the evaluator's 60-second waiting budget does not prescribe an exact product timer.

      ![image](./reference/note_more_options_dropdown.png)
      ![image](./reference/note_delete_notification.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-NOTIFICATION
    scenarios:
    - name: Move a deleted note to Trash
      steps:
      - keyword: GIVEN
        content: Notes contains the UI-created isolated Delete me 2.3.1 note with Deletion preserves this content.
      - keyword: WHEN
        content: Hover that note if necessary, click More options {title}, choose Delete Note from the menu, then click
          Trash in Sidebar.
      - keyword: THEN
        content: Deletion opens no confirmation dialog and removes the note from Notes immediately. Note deleted status
          exposes Undo, and Trash contains exactly one note with the same title and content.
    - name: Undo deletion
      steps:
      - keyword: GIVEN
        content: Notes contains the UI-created isolated Delete me 2.3.2 note with Undo restores this content.
      - keyword: WHEN
        content: Use More options {title} and Delete Note, click Undo within Note deleted status, then open Trash.
      - keyword: THEN
        content: Action undone status appears and Notes again contains exactly one note with the same title and content.
          The restored note is absent from Trash.
    - name: Dismiss deletion notifications
      steps:
      - keyword: GIVEN
        content: Notes contains two UI-created isolated notes, Manual dismissal with Manual content and Automatic dismissal
          with Automatic content.
      - keyword: WHEN
        content: Delete Manual dismissal through its menu and click Dismiss notification in Note deleted status. Delete
          Automatic dismissal and allow its notification to disappear without Undo; then open Trash.
      - keyword: THEN
        content: Manual dismissal hides its notification immediately and the automatic notification becomes hidden within
          the evaluator's 60-second budget. Neither note is restored to Notes; Trash retains both titles and their original
          contents exactly once.
  - id: REQ-2.5
    name: Inspect and empty Trash with seven-day retention
    type: ATOMIC
    dependencies:
    - REQ-2.4
    description: |-
      Clicking "Trash"(role=button) displays deleted notes in "Deleted notes"(role=region), excluding active and archived notes. "Empty Trash"(role=button) permanently removes all currently deleted notes while preserving active notes. If confirmation is offered, it appears as "Empty Trash"(role=dialog) with an "Empty Trash"(role=button) confirmation action. Notes deleted at least seven elapsed 24-hour days ago disappear from user-visible Trash by the next visit or refresh, using UTC benchmark time rather than the real date. Historical deletions are seeded because users cannot backdate them. The retention scenario uses an independently initialized historical world; the destructive emptying scenario uses the normal world without sharing mutable history with the retention scenario.

      ![image](./reference/trash_list.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-EXPIRED
      - DATA-RECENT
    scenarios:
    - name: Apply the seven-day retention boundary
      steps:
      - keyword: GIVEN
        content: An independent historical world uses UTC clock 2026-07-21T12:00:00Z and seeds DATA-EXPIRED, deleted
          at 2026-07-14T12:00:00Z, and DATA-RECENT, deleted at 2026-07-15T12:00:00Z. It is separate from the normal
          mutable workspace.
      - keyword: WHEN
        content: Open the historical application entry, click Trash in Sidebar and reload; then select Notes.
      - keyword: THEN
        content: Deleted notes is visible. Expired seven-day note is absent and Recent six-day note appears exactly
          once with Historical retained content. Neither historical deleted note appears in active Notes.
    - name: Show deleted notes separately
      steps:
      - keyword: GIVEN
        content: Through normal note creation, create isolated Delete me 2.3.3 with Recently deleted content and Movie
          list with Active control content; delete only Delete me 2.3.3 through its menu.
      - keyword: WHEN
        content: Click Trash in Sidebar and inspect Deleted notes.
      - keyword: THEN
        content: The deleted note appears exactly once with its saved content; the active Movie list note is absent
          from Trash.
    - name: Empty Trash without deleting active notes
      steps:
      - keyword: GIVEN
        content: Create isolated Empty trash A with Discard A, Empty trash B with Discard B and Active control with
          Keep active content. Delete A and B through UI and open Trash, confirming both deleted notes are present.
      - keyword: WHEN
        content: Click Empty Trash. If an Empty Trash dialog is offered, click its Empty Trash confirmation button.
          Reload Trash, then click Notes.
      - keyword: THEN
        content: Deleted notes contains no note regions before and after reload. Active control remains exactly once
          with its content, while deleted A and B remain absent from Notes.
  - id: REQ-2.6
    name: Archive notes and restore them to active Notes
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      Clicking "Archive {title}"(role=button) moves the selected active note out of Notes into "Archived notes"(role=region) and displays "Note archived"(role=status) with "Undo"(role=button). Undo restores the same note and content to Notes, removes it from the archive, and shows Action undone. Clicking "Archived"(role=button) displays archived notes separately from active notes; "Unarchive {title}"(role=button) returns the chosen note to Notes. Every transition addresses that note's business identity and remains observable after reload.

      ![image](./reference/archive_button.png)
      ![image](./reference/archived_notes_page.png)
      ![image](./reference/unarchive_button.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-NOTIFICATION
    scenarios:
    - name: Archive a note into its separate list
      steps:
      - keyword: GIVEN
        content: Notes contains UI-created isolated Travel plans 2.5.1 with Trip itinerary and Active archive control
          with Stay active.
      - keyword: WHEN
        content: Hover Travel plans, click Archive {title}, open Archived in Sidebar, then return to Notes and reload.
      - keyword: THEN
        content: Note archived status exposes Undo; Archived notes contains exactly one Travel plans note with Trip
          itinerary and excludes the active control. After reload Notes excludes Travel plans and retains the active
          control with Stay active.
    - name: Undo archiving
      steps:
      - keyword: GIVEN
        content: Notes contains isolated Travel plans 2.5.2 with Return this itinerary.
      - keyword: WHEN
        content: Click Archive {title}, then Undo in Note archived status, and inspect Archived.
      - keyword: THEN
        content: Action undone appears, Notes restores the same title and content exactly once, and Archived excludes
          the restored note.
    - name: Unarchive the selected note
      steps:
      - keyword: GIVEN
        content: Create isolated Travel plans 2.5.4 with Selected itinerary and Other archived note with Other itinerary,
          archive both through UI, and open Archived where both are visible.
      - keyword: WHEN
        content: Hover only Travel plans, click its Unarchive {title}, then open Notes and reload.
      - keyword: THEN
        content: Archived removes only Travel plans and retains Other archived note with its content. Notes displays
          Travel plans exactly once with Selected itinerary after reload and excludes the other archived note.
  - id: REQ-2.7
    name: Apply note background colors
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      Clicking "Background color {title}"(role=button) on an existing note, or "Background color"(role=button) in Note editor, opens a palette where "Light green"(role=button) applies a visibly light-green background to the note itself. The existing-note control then identifies the selection as "Background color {title}: Light green"(role=button). Notes created with this selection autosave with the same background, and selected colors persist after reload. Changing only a palette or badge is insufficient; the reference guides the appearance without prescribing a CSS token or exact RGB value.

      ![image](./reference/note_coloring.png)
    data:
      requires:
      - DATA-NOTES
    scenarios:
    - name: Color an existing note
      steps:
      - keyword: GIVEN
        content: Notes contains isolated Garden tasks existing with Water the herbs, created through the normal editor.
      - keyword: WHEN
        content: Hover that note, click Background color {title}, choose Light green, then reload and inspect the note
          and its color action.
      - keyword: THEN
        content: 'The same note and content persist. Its surface has a light-green background and its action reads Background
          color {title}: Light green; a changed action name alone is insufficient.'
    - name: Create a colored note
      steps:
      - keyword: GIVEN
        content: Notes is open and no note uses the isolated Garden tasks created title.
      - keyword: WHEN
        content: Click Take a note, enter that title and Plant spring herbs, click Background color in Note editor and
          choose Light green, then Close and reload.
      - keyword: THEN
        content: 'Exactly one note retains the entered content with a light-green surface and Background color {title}:
          Light green action after reload.'
  - id: REQ-2.8
    name: Assign and remove note labels
    type: ATOMIC
    dependencies:
    - REQ-2.2
    - REQ-3.1
    description: |-
      Users open a note's More options menu and choose "Change labels"(role=menuitem), or click "Change labels"(role=button) in Note editor, to open "Note labels"(role=dialog). Each available label is selectable through "{label}"(role=checkbox). Users may assign one or more labels, or clear a checked label to remove its assignment; "Done"(role=button) closes the chooser and retains the selections. Assigned labels appear visibly on the note, drive sidebar filtering consistently, and persist after closing and reload. The default Reminders label is available when creating a note.

      ![image](./reference/assign_label_to_note.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-LABELS
      - DATA-REMINDERS
    scenarios:
    - name: Assign multiple labels and filter by either
      steps:
      - keyword: GIVEN
        content: Through Edit Labels, New label and Create label, create isolated Work and Personal labels. Create isolated
          Team retro add label with Retro decisions and no assigned labels.
      - keyword: WHEN
        content: On that note choose More options {title} then Change labels; check Work and Personal in Note labels,
          click Done, reload, and select each label in Sidebar in turn.
      - keyword: THEN
        content: Both labels are visible on the note after reload. Either sidebar selection displays exactly one matching
          note with the same title and Retro decisions.
    - name: Remove an assigned label
      steps:
      - keyword: GIVEN
        content: Create isolated Work and two notes through UI, Team retro remove label with Remove membership and Other
          Work note with Keep membership; assign Work to both through the editor's Change labels chooser.
      - keyword: WHEN
        content: Open Change labels for Team retro, clear its Work checkbox and click Done; reload, then select Work
          in Sidebar.
      - keyword: THEN
        content: Work no longer appears on Team retro. The Work-filtered list excludes that note and retains Other Work
          note exactly once with Keep membership.
    - name: Create a note with Reminders
      steps:
      - keyword: GIVEN
        content: The default Reminders label exists and Notes is open; the isolated Call dentist created title is unused.
      - keyword: WHEN
        content: Open Note editor, enter that title and Arrange the appointment, choose Change labels, check Reminders,
          click Done and Close, then select Reminders in Sidebar.
      - keyword: THEN
        content: The saved note visibly carries Reminders and appears exactly once with Arrange the appointment in the
          Reminders-filtered list.
  - id: REQ-2.9
    name: Pin and unpin notes
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      Clicking "Pin {title}"(role=button) moves that regular active note into Pinned notes exactly once and changes its pin action to "Unpin {title}"(role=button) with pressed=true. Unpin moves it back to Other notes and restores Pin with pressed=false. In Note editor, "Pin note"(role=button) toggles pressed state so closing the editor creates the note with the chosen pin state. These transitions preserve content, never duplicate the note, and survive reload.

      ![image](./reference/pin_button.png)
    data:
      requires:
      - DATA-NOTES
    scenarios:
    - name: Pin an existing note
      steps:
      - keyword: GIVEN
        content: Notes contains isolated Meeting agenda 2.8.1 with Discuss the launch as a regular unpinned note.
      - keyword: WHEN
        content: Hover it, click Pin {title}, reload, and inspect its section and pin action.
      - keyword: THEN
        content: The same note and content appear exactly once in Pinned notes and not Other notes. Unpin {title} exposes
          pressed=true.
    - name: Unpin an existing note
      steps:
      - keyword: GIVEN
        content: Create isolated Meeting agenda 2.8.2 with Keep meeting content through Note editor with Pin note selected.
      - keyword: WHEN
        content: Hover the saved pinned note, click Unpin {title}, reload, and inspect its section and action.
      - keyword: THEN
        content: The note appears exactly once only in Other notes with unchanged content; Pin {title} exposes pressed=false.
    - name: Create a pinned note
      steps:
      - keyword: GIVEN
        content: Notes is open and the isolated Pinned at creation title is unused.
      - keyword: WHEN
        content: Open Note editor, enter that title and Pinned creation content, click Pin note, click Close, and reload.
      - keyword: THEN
        content: The note and content persist exactly once only in Pinned notes, and its Unpin {title} action exposes
          pressed=true.
- id: REQ-3
  name: Organize with labels
  type: FOLDER
  dependencies: []
  description: User-created labels and the default Reminders label organize active notes.
  children:
  - id: REQ-3.1
    name: Create user labels
    type: ATOMIC
    dependencies: []
    description: |-
      Clicking "Edit Labels"(role=button) opens "Edit Labels"(role=dialog). Users enter a nonempty name in "New label"(role=textbox) and click "Create label"(role=button), adding that label exactly once to management and the sidebar. Its editable name appears in "Label name {label}"(role=textbox), and the sidebar exposes "{label}"(role=button) for filtering. "Done"(role=button) closes management, and the created label persists after reload. Each scenario creates its own business identity; empty-name and duplicate-name validation are unspecified.

      ![image](./reference/manage_labels.png)
    data:
      requires:
      - DATA-LABELS
    scenarios:
    - name: Create a user label
      steps:
      - keyword: GIVEN
        content: Notes is open with the default Reminders label; the isolated New user label name does not exist.
      - keyword: WHEN
        content: Click Edit Labels, enter the isolated name in New label, click Create label and Done; reload, reopen
          Edit Labels and inspect Label name {label}.
      - keyword: THEN
        content: Sidebar exposes exactly one visible action with the new label name, and management exposes exactly
          one Label name {label} field containing that name. Done closes management.
  - id: REQ-3.2
    name: Filter Notes through sidebar labels
    type: ATOMIC
    dependencies:
    - REQ-2.8
    description: |-
      Clicking "{label}"(role=button) within "Sidebar"(role=navigation) displays only active notes assigned that label, each exactly once, and exposes current=true on the selected navigation action. "Notes"(role=button) clears the label filter and restores the complete active list. The always-present "Reminders"(role=button), with its own icon, filters by the default label in the same way. Both sidebar actions and labels on notes are identified by business identity rather than position.

      ![image](./reference/sidebar.png)
    data:
      requires:
      - DATA-LABELS
      - DATA-NOTES
      - DATA-REMINDERS
    scenarios:
    - name: Filter by a user label
      steps:
      - keyword: GIVEN
        content: Create isolated Work and two notes through UI, Design review with Work design decisions assigned Work
          and unlabeled Movie list with An unlabeled movie note.
      - keyword: WHEN
        content: Select the Work button in Sidebar.
      - keyword: THEN
        content: Exactly one Design review note displays its saved content; Movie list is hidden and the selected Work
          action exposes current=true.
    - name: Return to the complete notes list
      steps:
      - keyword: GIVEN
        content: Create isolated Work, Design review with Design details assigned Work, and Movie list with Movie details.
          Select Work and verify Movie list is hidden.
      - keyword: WHEN
        content: Click Notes in Sidebar.
      - keyword: THEN
        content: Both notes reappear exactly once with their saved contents, and Notes exposes current=true.
    - name: Filter by the default Reminders label
      steps:
      - keyword: GIVEN
        content: Create isolated Call dentist existing with Dentist details assigned Reminders and unlabeled Movie list
          with Movie details through the editor.
      - keyword: WHEN
        content: Click Reminders in Sidebar.
      - keyword: THEN
        content: The reminder note appears exactly once with Dentist details, Movie list is hidden, and Reminders exposes
          current=true.
  - id: REQ-3.3
    name: Rename and delete user labels
    type: ATOMIC
    dependencies:
    - REQ-3.1
    - REQ-2.8
    description: |-
      Clicking "Edit Labels"(role=button) opens "Edit Labels"(role=dialog), where each user label is identified by its business name. Users change "Label name {label}"(role=textbox) and click "Save label {label}"(role=button), whose original action identity remains available until saving. Rename updates the sidebar's "{label}"(role=button) and labels on notes without losing membership. Clicking "Delete label {label}"(role=button) removes the label from the sidebar and assigned notes while preserving their content. "Done"(role=button) closes management; renames and deletions persist after reload. Modifying Reminders is outside scope.

      ![image](./reference/manage_labels.png)
    data:
      requires:
      - DATA-LABELS
      - DATA-NOTES
    scenarios:
    - name: Rename a label and retain membership
      steps:
      - keyword: GIVEN
        content: Create isolated Work editable and a Label rename control note with Retain label membership assigned
          to it through UI.
      - keyword: WHEN
        content: Open Edit Labels, replace Label name {original} with isolated Work renamed, click Save label {original}
          and Done; reload and select the renamed sidebar label.
      - keyword: THEN
        content: Sidebar contains the renamed label once and no original label. The note displays the new label without
          the old one, and filtering by the new name still finds the same note and content.
    - name: Delete a label without deleting its note
      steps:
      - keyword: GIVEN
        content: Create isolated Disposable label and Label delete control with Keep this labeled note assigned to that
          label.
      - keyword: WHEN
        content: Open Edit Labels, click Delete label {label}, click Done, and reload.
      - keyword: THEN
        content: The deleted label is absent from Sidebar and the note, while the note remains exactly once with unchanged
          title and Keep this labeled note.
- id: REQ-4
  name: Find personal notes
  type: FOLDER
  dependencies: []
  description: Search results follow keyword and suggested-filter criteria.
  children:
  - id: REQ-4.1
    name: Search keywords and suggested filters
    type: ATOMIC
    dependencies:
    - REQ-2.8
    description: |-
      Entering a keyword in "Search"(role=searchbox) filters active notes by case-insensitive title or content matches. Each matching fragment appears as "Highlight {keyword}"(role=region) within its note, displays only the matching text, and is visibly distinguished from surrounding text without requiring a particular element or CSS class. Searching st includes Study schedule by title and a separate note containing st only in its content, while excluding notes with neither match. Focusing Search displays "Suggested filters"(role=region); choosing "Reminders"(role=button) there filters active notes by the default label. Clearing Search and selecting Notes restores the full active list.

      ![image](./reference/search_suggested_filters.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-REMINDERS
      - DATA-SEARCH
    scenarios:
    - name: Search title and content with highlights
      steps:
      - keyword: GIVEN
        content: Through UI create isolated Study schedule with Math on Monday, Reading plan with Read a story, and
          Ocean memo with Calm blue waves. Isolation suffixes cannot introduce the keyword st.
      - keyword: WHEN
        content: Enter st in Search; inspect each matching note's Highlight st region. Clear Search and click Notes.
      - keyword: THEN
        content: Study schedule and Reading plan appear once while Ocean memo is hidden; each match has a visible highlight
          region whose text is only st, case-insensitively. Clearing restores all three notes with their contents.
    - name: Choose a suggested label filter
      steps:
      - keyword: GIVEN
        content: Create isolated Call dentist existing with Reminder content assigned Reminders and unlabeled Movie
          list with Unlabeled content.
      - keyword: WHEN
        content: Focus Search, click Reminders within Suggested filters, then clear Search and select Notes.
      - keyword: THEN
        content: Suggested filters is visible on focus; its Reminders choice includes only the reminder note. Clearing
          restores both notes exactly once with their saved contents.
- id: REQ-5
  name: Configure the workspace
  type: FOLDER
  dependencies: []
  description: Settings and note layouts are user observable configuration behaviors.
  children:
  - id: REQ-5.1
    name: Open and save or cancel application settings
    type: ATOMIC
    dependencies: []
    description: |-
      Clicking "Settings menu"(role=button) opens a menu; choosing "Settings"(role=menuitem) opens "Settings"(role=dialog). Users configure "Add new items to the bottom"(role=checkbox) and "Move checked items to bottom"(role=checkbox), then click "Save"(role=button) to commit the options and close, or "Cancel"(role=button) to close without applying pending changes. Reopening reflects saved selections and discards canceled edits, and saved selections survive reload. These options do not introduce additional checklist or list-item behavior beyond the source.

      ![image](./reference/settings_dropdown.png)
      ![image](./reference/settings_settings.png)
    data:
      requires:
      - DATA-SETTINGS
    scenarios:
    - name: Save settings and discard canceled changes
      steps:
      - keyword: GIVEN
        content: Notes is open. Open Settings menu, choose Settings and record the current Add new items to the bottom
          checkbox value; Move checked items to bottom, Save and Cancel are available.
      - keyword: WHEN
        content: Toggle Add new items to the bottom to the opposite value and click Save. Reload and reopen Settings,
          toggle it back but click Cancel, then reopen once more.
      - keyword: THEN
        content: Save closes the dialog and the saved value survives reload. Cancel closes the dialog without committing
          its pending toggle; reopening still shows the previously saved value.
  - id: REQ-5.2
    name: Switch between default grid and list layouts
    type: ATOMIC
    dependencies:
    - REQ-2.2
    description: |-
      A fresh workspace displays a grid in "Notes"(role=region) with an accessible description identifying Grid view. Clicking "List view"(role=button) changes the same notes to a single-column list, updates that description to List view, and offers "Grid view"(role=button). Grid view restores the grid and List view action. At the evaluator desktop viewport, populated grid cards occupy multiple columns while list surfaces align in one column; switching preserves titles, content, and note count. Appearance follows the visual references.

      ![image](./reference/home_page.png)
      ![image](./reference/list_view.png)
    data:
      requires:
      - DATA-NOTES
      - DATA-VIEW
    scenarios:
    - name: Switch grid to list and back
      steps:
      - keyword: GIVEN
        content: At the evaluator desktop viewport, Notes starts with Grid view accessible description and List view
          action. Create isolated View alpha, View beta and View gamma notes, each with Layout content.
      - keyword: WHEN
        content: Click List view and inspect the three note surfaces, then click Grid view and inspect them again.
      - keyword: THEN
        content: List mode reports List view, offers Grid view, and aligns nonoverlapping notes in one column; grid
          mode reports Grid view, offers List view and arranges populated cards across multiple columns. Both modes
          retain exactly one of each note and its content without prescribing exact pixel widths.
