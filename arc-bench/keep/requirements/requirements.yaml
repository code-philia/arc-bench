id: ROOT
name: Keep personal note management
description:
  text: |-
    A workspace in US English for creating, editing, organizing, searching, archiving, and deleting personal notes without signing in. Reminders comes with the workspace as a label, not a scheduler. Users create their own notes and additional labels.
scenarios: []
children:
- id: REQ-1
  name: Workspace navigation
  description:
    text: |-
      The sidebar lets users navigate between Notes, Reminders, their own labels, Archived, and Trash. Users can identify the current destination visually and with assistive technology.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open and navigate the personal workspace
    description:
      text: |-
        The workspace initially opens in grid view with Notes selected and the sidebar expanded. The sidebar shows Notes, Reminders, Edit Labels, Archived, Trash, and any user labels; Reminders has its own icon. Search finds notes, Take a note starts a new note, Settings menu opens settings, and List view switches the layout. Toggle sidebar hides and restores navigation text while keeping the actions identifiable and making the expanded or collapsed state clear. Alignment, hover feedback, selection highlighting, and appearance follow the visual references.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-SIDEBAR
        reference: reference/sidebar.png
        page: notes
      - id: IMG-SIDEBAR-COLLAPSED
        reference: reference/sidebar_collapsed.png
        page: notes
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Open the workspace
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          The workspace is ready to open without signing in.
        When: |-
          Open the workspace and inspect the navigation, Search, Settings menu, List view, and Take a note.
        Then: |-
          Notes is selected, the layout is a grid, and the expanded sidebar shows Notes, Reminders, Archived, Trash, and Edit Labels. The workspace controls are available.
        references:
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-SIDEBAR)
        - \ref[image](IMG-SIDEBAR-COLLAPSED)
    - id: SCN-REQ-1.1-02
      name: Collapse and expand the sidebar
      steps:
      - id: STEP-REQ-1.1-02-01
        Given: |-
          Notes is selected and the sidebar is expanded.
        When: |-
          Use Toggle sidebar to collapse it, inspect the remaining actions, and use Toggle sidebar again.
        Then: |-
          Collapsing hides the navigation text but leaves the Notes, Reminders, Archived, and Trash actions identifiable. Expanding restores the text. Both states are understandable with assistive technology.
        references:
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-SIDEBAR)
        - \ref[image](IMG-SIDEBAR-COLLAPSED)
    children: []
- id: REQ-2
  name: Manage the note lifecycle
  description:
    text: |-
      Users create notes with their own nonempty titles and content. Each operation acts on the intended note, identified by its title in the current collection. Note actions that appear on hover are also available by keyboard.
  scenarios: []
  children:
  - id: REQ-2.1
    name: List pinned and regular notes separately
    description:
      text: |-
        Notes has one Pinned notes section and one Other notes section. Each active note appears exactly once, with its title and content, in the section that matches its pin state. Neither section contains archived or deleted notes.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Separate pinned and regular notes
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          Create two notes with distinct titles and content, using Pin note for one and leaving the other unpinned.
        When: |-
          Inspect Pinned notes and Other notes.
        Then: |-
          There is one section of each kind. The pinned note appears once only in Pinned notes and the regular note once only in Other notes, both with their saved content.
        references:
        - \ref[requirement](REQ-2.9)
        - \ref[image](IMG-HOME-PAGE)
    children: []
  - id: REQ-2.2
    name: Create and autosave a personal note
    description:
      text: |-
        Take a note opens an editor with Title and Content, accepting a nonempty title and multiline content. Close ends editing and saves exactly one active note without a separate Save action. The title, content, and line breaks persist after reload. Pin note, Background color, and Change labels are available while editing. Empty-input behavior is unspecified.
      image:
      - id: IMG-CREATE-NOTE-HOME-PAGE
        reference: reference/create_note_home_page.png
        page: notes
      - id: IMG-CREATE-NOTE-FORM
        reference: reference/create_note_form.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Autosave on closing the editor
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: |-
          Notes is ready for a new note.
        When: |-
          Select Take a note, enter a chosen title and multiline content, then choose Close.
        Then: |-
          The editor closes without a separate Save action. One note displays the entered title and both content lines, preserving the line break.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CREATE-NOTE-HOME-PAGE)
        - \ref[image](IMG-CREATE-NOTE-FORM)
    - id: SCN-REQ-2.2-02
      name: Keep a created note after reload
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          Notes is ready for a new note.
        When: |-
          Use Take a note to enter a chosen title and content, choose Close, and reload.
        Then: |-
          The editor closes and exactly one note retains the title and content after reload.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CREATE-NOTE-HOME-PAGE)
        - \ref[image](IMG-CREATE-NOTE-FORM)
    children: []
  - id: REQ-2.3
    name: Edit and persist note content
    description:
      text: |-
        Opening a saved note shows its current Title and Content. Replacing Content and choosing Close saves the replacement on the same note, keeps its title, and creates no duplicate. The new content remains after reload.
      image:
      - id: IMG-NOTE-EDITING
        reference: reference/note_editing.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Save an edited note
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          Create a note with a chosen title and initial content.
        When: |-
          Open that note, inspect its Title and Content, replace Content, choose Close, and reload.
        Then: |-
          The editor initially shows the saved values and closes after saving. The original title and replacement content appear on exactly one note, with the old content gone.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-EDITING)
    children: []
  - id: REQ-2.4
    name: Delete notes and recover through notification Undo
    description:
      text: |-
        Choose More options for the intended note and select Delete Note. The note leaves Notes immediately and goes to Trash without a confirmation step. Note deleted offers Undo and Dismiss notification. Undo restores the same note and displays Action undone. Dismiss notification closes the message without restoring the note, which remains in Trash after reload. Automatic dismissal timing is unspecified.
      image:
      - id: IMG-NOTE-MORE-OPTIONS-DROPDOWN
        reference: reference/note_more_options_dropdown.png
        page: notes
      - id: IMG-NOTE-DELETE-NOTIFICATION
        reference: reference/note_delete_notification.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Move a deleted note to Trash
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: |-
          Create a note with a chosen title and content in Notes.
        When: |-
          From its More options menu, select Delete Note and then open Trash.
        Then: |-
          Deletion needs no confirmation. The note leaves Notes immediately, Note deleted offers Undo, and Trash contains that note once with its title and content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    - id: SCN-REQ-2.4-02
      name: Undo deletion
      steps:
      - id: STEP-REQ-2.4-02-01
        Given: |-
          Create a note with a chosen title and content in Notes.
        When: |-
          Choose Delete Note for it, select Undo in Note deleted, and inspect Notes and Trash.
        Then: |-
          Action undone appears. The note returns once to Notes with its original content and is absent from Trash.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    - id: SCN-REQ-2.4-03
      name: Dismiss deletion notifications
      steps:
      - id: STEP-REQ-2.4-03-01
        Given: |-
          Create a note with a chosen title and content in Notes.
        When: |-
          Delete it, select Dismiss notification, open Trash, and reload.
        Then: |-
          The message closes and deletion is not reversed. The note stays absent from Notes and appears once in Trash with its original title and content before and after reload.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-MORE-OPTIONS-DROPDOWN)
        - \ref[image](IMG-NOTE-DELETE-NOTIFICATION)
    children: []
  - id: REQ-2.5
    name: Inspect and empty Trash with persistent deleted notes
    description:
      text: |-
        The Deleted notes collection in Trash shows deleted notes separately from active and archived notes. They keep their titles and content across navigation and reload. Empty Trash permanently removes all deleted notes without changing active notes. If confirmation is offered, its Empty Trash action confirms the removal. Automatic age-based deletion is unspecified.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-TRASH-LIST
        reference: reference/trash_list.png
        page: trash
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Keep a deleted note in Trash after reload
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: |-
          Create a note through Take a note and Close, then delete it through More options.
        When: |-
          Open Trash, reload, then return to Notes.
        Then: |-
          Trash keeps one copy with its saved title and content after reload; Notes does not contain it.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    - id: SCN-REQ-2.5-02
      name: Show deleted notes separately
      steps:
      - id: STEP-REQ-2.5-02-01
        Given: |-
          Create two distinct notes and delete only one.
        When: |-
          Open Trash.
        Then: |-
          The deleted note is listed once with its content; the still-active note is absent.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    - id: SCN-REQ-2.5-03
      name: Empty Trash without deleting active notes
      steps:
      - id: STEP-REQ-2.5-03-01
        Given: |-
          Create three distinct notes. Delete two and leave the third active. Open Trash with both deleted notes present.
        When: |-
          Select Empty Trash and confirm if asked. Reload Trash, then open Notes.
        Then: |-
          No deleted notes remain before or after reload. Notes retains the active note once with its original content and neither permanently removed note reappears.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-TRASH-LIST)
    children: []
  - id: REQ-2.6
    name: Archive notes and restore them to active Notes
    description:
      text: |-
        Archive moves the selected note from Notes into Archived and shows Note archived with Undo. Undo returns the same note to Notes and shows Action undone. Unarchive returns the selected note to Notes without changing other archived notes. The note keeps its title and content, and these changes persist after reload.
      image:
      - id: IMG-ARCHIVE-BUTTON
        reference: reference/archive_button.png
        page: notes
      - id: IMG-ARCHIVED-NOTES-PAGE
        reference: reference/archived_notes_page.png
        page: archived_notes
      - id: IMG-UNARCHIVE-BUTTON
        reference: reference/unarchive_button.png
        page: archived_notes
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Archive a note into its separate list
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: |-
          Create two distinct notes in Notes.
        When: |-
          Archive one, inspect Archived, then return to Notes and reload.
        Then: |-
          Note archived offers Undo. Archived contains the selected note once with its content and excludes the active note. After reload Notes still contains only the active one of these two, with unchanged content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    - id: SCN-REQ-2.6-02
      name: Undo archiving
      steps:
      - id: STEP-REQ-2.6-02-01
        Given: |-
          Create a note with a chosen title and content.
        When: |-
          Archive the note and select Undo in Note archived. Inspect Notes and Archived.
        Then: |-
          Action undone appears, the note returns once with its unchanged content, and Archived no longer contains it.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    - id: SCN-REQ-2.6-03
      name: Unarchive the selected note
      steps:
      - id: STEP-REQ-2.6-03-01
        Given: |-
          Create and archive two distinct notes, then open Archived.
        When: |-
          Unarchive one note, return to Notes, and reload.
        Then: |-
          Archived loses only the selected note. Notes retains that note once after reload with unchanged title and content and excludes the still-archived note.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ARCHIVE-BUTTON)
        - \ref[image](IMG-ARCHIVED-NOTES-PAGE)
        - \ref[image](IMG-UNARCHIVE-BUTTON)
    children: []
  - id: REQ-2.7
    name: Apply note background colors
    description:
      text: |-
        Background color opens a palette on an existing note or in the editor. Choosing Light green recolors the note's surface, not only a palette or badge. The selected color is identifiable with assistive technology. Closing a new note saves it with that background; the color, title, and content remain after reload. The reference illustrates the shade.
      image:
      - id: IMG-NOTE-COLORING
        reference: reference/note_coloring.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.7-01
      name: Color an existing note
      steps:
      - id: STEP-REQ-2.7-01-01
        Given: |-
          Create a note with a chosen title and content.
        When: |-
          Select Background color for it, choose Light green, and reload.
        Then: |-
          The note itself is light green; the selected color is identifiable, and the title and content are unchanged.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-COLORING)
    - id: SCN-REQ-2.7-02
      name: Create a colored note
      steps:
      - id: STEP-REQ-2.7-02-01
        Given: |-
          Notes is ready for a new note.
        When: |-
          Enter a title and content, choose Light green through Background color, then choose Close and reload.
        Then: |-
          One note keeps its title and content on a light-green surface, and the selected color remains identifiable.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-NOTE-COLORING)
    children: []
  - id: REQ-2.8
    name: Assign and remove note labels
    description:
      text: |-
        Change labels, in a note's More options or in the editor, opens Note labels. Users select one or more named labels or clear a selection. Done closes the chooser and retains the changes. Selected labels appear on the note, determine which sidebar filters include it, and persist after reload. Reminders is available when creating a note.
      image:
      - id: IMG-ASSIGN-LABEL-TO-NOTE
        reference: reference/assign_label_to_note.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.8-01
      name: Assign multiple labels and filter by either
      steps:
      - id: STEP-REQ-2.8-01-01
        Given: |-
          Create two distinct labels through Edit Labels and a note without labels.
        When: |-
          Choose Change labels for that note, select both labels, select Done, and reload. Select each sidebar label in turn.
        Then: |-
          Both labels appear on the note after reload. Either filter includes the same note once with its saved title and content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    - id: SCN-REQ-2.8-02
      name: Remove an assigned label
      steps:
      - id: STEP-REQ-2.8-02-01
        Given: |-
          Create one label and two notes. Assign that label to both notes.
        When: |-
          Clear the label from one note, choose Done, reload, and select that label in the sidebar.
        Then: |-
          The changed note no longer shows the label and is absent from the filtered list. The other note still appears once with unchanged content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    - id: SCN-REQ-2.8-03
      name: Create a note with Reminders
      steps:
      - id: STEP-REQ-2.8-03-01
        Given: |-
          Notes is ready for a new note and Reminders is available.
        When: |-
          Enter a title and content, use Change labels to choose Reminders, then select Done and Close. Select Reminders in the sidebar.
        Then: |-
          The new note shows Reminders and is listed once with its saved title and content.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-ASSIGN-LABEL-TO-NOTE)
    children: []
  - id: REQ-2.9
    name: Pin and unpin notes
    description:
      text: |-
        Pin moves the selected note into Pinned notes exactly once and offers Unpin. Unpin returns it to Other notes and offers Pin. Pin note lets users choose the pin state before closing a new note. The current state is identifiable with assistive technology. Changes preserve the title and content, never duplicate the note, and persist after reload.
      image:
      - id: IMG-PIN-BUTTON
        reference: reference/pin_button.png
        page: notes
    scenarios:
    - id: SCN-REQ-2.9-01
      name: Pin an existing note
      steps:
      - id: STEP-REQ-2.9-01-01
        Given: |-
          Create a regular unpinned note.
        When: |-
          Select Pin for that note and reload.
        Then: |-
          It appears once only in Pinned notes, keeps its title and content, and offers Unpin.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    - id: SCN-REQ-2.9-02
      name: Unpin an existing note
      steps:
      - id: STEP-REQ-2.9-02-01
        Given: |-
          Create a note with Pin note selected in the editor.
        When: |-
          Select Unpin for that note and reload.
        Then: |-
          It appears once only in Other notes, keeps its title and content, and offers Pin.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    - id: SCN-REQ-2.9-03
      name: Create a pinned note
      steps:
      - id: STEP-REQ-2.9-03-01
        Given: |-
          Notes is ready for a new note.
        When: |-
          Enter a title and content, choose Pin note and Close, then reload.
        Then: |-
          The note appears once only in Pinned notes with its title and content and offers Unpin.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-PIN-BUTTON)
    children: []
- id: REQ-3
  name: Organize with labels
  description:
    text: |-
      Users create their own labels with Edit Labels and organize active notes with those labels or the built-in Reminders label.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Create user labels
    description:
      text: |-
        In Edit Labels, users enter a chosen nonempty name in New label and select Create label. The new label appears in exactly one editable entry and exactly once in the sidebar as a filter. Done closes management. The label persists after reload. Empty-name and duplicate-name behavior are unspecified.
      image:
      - id: IMG-MANAGE-LABELS
        reference: reference/manage_labels.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Create a user label
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          Notes is open and a new nonempty label name has been chosen.
        When: |-
          Open Edit Labels, enter the name in New label, choose Create label and Done, then reload and reopen Edit Labels.
        Then: |-
          The same name appears once in the sidebar and in one editable entry. Done closes management.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-MANAGE-LABELS)
    children: []
  - id: REQ-3.2
    name: Filter Notes through sidebar labels
    description:
      text: |-
        Selecting a sidebar label shows only active notes assigned that label, each exactly once. The selected destination is identifiable visually and with assistive technology. Notes clears the filter. Reminders, identified by its own icon, filters notes like other labels.
      image:
      - id: IMG-SIDEBAR
        reference: reference/sidebar.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Filter by a user label
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: |-
          Create a label and two distinct notes. Assign the label to one and leave the other unlabeled.
        When: |-
          Select the new label from the sidebar.
        Then: |-
          The labeled note appears once with its saved content, the unlabeled note is hidden, and the label is identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-SIDEBAR)
    - id: SCN-REQ-3.2-02
      name: Return to the complete notes list
      steps:
      - id: STEP-REQ-3.2-02-01
        Given: |-
          Create two notes with different content, assign a new label to one, and select that label so the other note is hidden.
        When: |-
          Select Notes from the sidebar.
        Then: |-
          Both notes return once each with their saved content and Notes is identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[requirement](REQ-3.1)
        - \ref[image](IMG-SIDEBAR)
    - id: SCN-REQ-3.2-03
      name: Filter by the default Reminders label
      steps:
      - id: STEP-REQ-3.2-03-01
        Given: |-
          Create two notes and assign Reminders to one but not the other.
        When: |-
          Select Reminders from the sidebar.
        Then: |-
          The note with Reminders appears once with its content, the unlabeled note is hidden, and Reminders is identifiable as selected.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-SIDEBAR)
    children: []
  - id: REQ-3.3
    name: Rename and delete user labels
    description:
      text: |-
        In Edit Labels, users can rename a label by editing its current name and selecting its Save label action, or remove it with its Delete label action. Renaming updates the sidebar and assigned notes without losing membership. Deleting removes the label but preserves its notes and their content. Done closes management and changes persist after reload. Modifying Reminders is unspecified.
      image:
      - id: IMG-MANAGE-LABELS
        reference: reference/manage_labels.png
        page: notes
    scenarios:
    - id: SCN-REQ-3.3-01
      name: Rename a label and retain membership
      steps:
      - id: STEP-REQ-3.3-01-01
        Given: |-
          Create a label and assign it to a note with its own title and content.
        When: |-
          Open Edit Labels, change that label's name, select its Save label action and Done, then reload and select the renamed label.
        Then: |-
          The sidebar and note show the new label, not the old one. Filtering by the new name still finds the same note and content.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-MANAGE-LABELS)
    - id: SCN-REQ-3.3-02
      name: Delete a label without deleting its note
      steps:
      - id: STEP-REQ-3.3-02-01
        Given: |-
          Create a label and assign it to a note with its own title and content.
        When: |-
          Delete that label through Edit Labels, select Done, and reload.
        Then: |-
          The sidebar and note no longer show the label. The note remains once with its original title and content.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-MANAGE-LABELS)
    children: []
- id: REQ-4
  name: Find personal notes
  description:
    text: |-
      Users find active notes by keyword or suggested label and can return to the complete active list.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Search keywords and suggested filters
    description:
      text: |-
        Search finds active notes whose title or content includes the entered keyword, ignoring case. Every matching fragment is visibly highlighted without highlighting the surrounding text. For example, st matches Study schedule and Read a story. Focusing Search shows Suggested filters; selecting Reminders shows notes with that label. Clearing Search and choosing Notes restores all active notes.
      image:
      - id: IMG-SEARCH-SUGGESTED-FILTERS
        reference: reference/search_suggested_filters.png
        page: notes
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Search title and content with highlights
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          Create three notes: one with the keyword only in its title, one with it only in its content, and one with it in neither. The matching text may differ in capitalization.
        When: |-
          Enter the keyword, inspect matching notes, clear Search, and select Notes.
        Then: |-
          Both matching notes appear once, the other is hidden, and only the matching fragments are highlighted, ignoring case. All three notes return with unchanged content after clearing.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-SEARCH-SUGGESTED-FILTERS)
    - id: SCN-REQ-4.1-02
      name: Choose a suggested label filter
      steps:
      - id: STEP-REQ-4.1-02-01
        Given: |-
          Create two notes and assign Reminders to only one.
        When: |-
          Focus Search, select Reminders from Suggested filters, then clear Search and select Notes.
        Then: |-
          Suggested filters appears on focus. Its Reminders choice shows only the labeled note. Clearing restores both once with their saved content.
        references:
        - \ref[requirement](REQ-2.8)
        - \ref[image](IMG-SEARCH-SUGGESTED-FILTERS)
    children: []
- id: REQ-5
  name: Configure the workspace
  description:
    text: |-
      Users can save or discard workspace settings and change how their notes are arranged.
  scenarios: []
  children:
  - id: REQ-5.1
    name: Open and save or cancel application settings
    description:
      text: |-
        Settings menu offers Settings, where Add new items to the bottom and Move checked items to bottom expose their selected states. Save applies the choices and closes settings. Cancel closes without applying pending changes. Reopening shows saved choices, including after reload. Initial values and additional checklist behavior are unspecified.
      image:
      - id: IMG-SETTINGS-DROPDOWN
        reference: reference/settings_dropdown.png
        page: notes
      - id: IMG-SETTINGS-SETTINGS
        reference: reference/settings_settings.png
        page: notes
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Save settings and discard canceled changes
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: |-
          Open Settings and note the current Add new items to the bottom setting. Move checked items to bottom, Save, and Cancel are available.
        When: |-
          Change the first setting and select Save. Reload, reopen Settings, change it back but select Cancel, then reopen Settings.
        Then: |-
          Save and Cancel close settings. The saved choice persists after reload and the canceled change is not applied.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SETTINGS-DROPDOWN)
        - \ref[image](IMG-SETTINGS-SETTINGS)
    children: []
  - id: REQ-5.2
    name: Switch between default grid and list layouts
    description:
      text: |-
        Notes starts in grid view. List view presents the same notes in a single nonoverlapping column and offers Grid view to switch back. Grid view restores multiple columns when the desktop has enough room. Users can identify the current layout with assistive technology. Both layouts preserve each note's title, content, and occurrence count.
      image:
      - id: IMG-HOME-PAGE
        reference: reference/home_page.png
        page: notes
      - id: IMG-LIST-VIEW
        reference: reference/list_view.png
        page: notes
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Switch grid to list and back
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: |-
          Notes starts in grid view on a desktop wide enough for multiple columns. Create three notes with distinct titles and saved content.
        When: |-
          Choose List view, inspect the notes, then choose Grid view and inspect them again.
        Then: |-
          List view shows one nonoverlapping column and offers Grid view. Grid view restores multiple columns and offers List view. Both show the current layout and retain one unchanged copy of each note.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-HOME-PAGE)
        - \ref[image](IMG-LIST-VIEW)
    children: []
