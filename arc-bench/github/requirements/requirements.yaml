  - id: REQ-4.3
    name: Branch Management
    description:
      text: The branch selector is the control at the top of the Code page that lists and switches branches; the
        system stores a unique name and current pointed-to commit for each branch. Creating a branch creates a new
        named reference at a specified base commit; it does not copy files or rewrite base history. The default
        branch is the branch read by default when opening the repository overview or a repository entry without
        a specified branch; it is not the only existing or writable branch. A branch name is 1 to 255 characters
        and may contain only ASCII letters, digits, `-`, `_`, `.`, and `/`; it must not end with `/` or `.`, and
        must not contain consecutive `..` or `//`; duplicate names, invalid names, or lack of permission must prevent
        branch creation. Changing the default branch must not alter existing branches, commits, or source/target
        references of already-open PRs. This feature builds on the persisted objects, opened pages, or authenticated-session
        context provided by REQ-4.1 (Browse Repository Files and Directories); it must reuse that context and keep
        pages and data consistent after the context changes.
    scenarios: []
    children:
    - id: REQ-4.3.1
      name: List and Switch Repository Branches
      description:
        text: |-
          This feature builds on the repository Code page provided by REQ-4.1 (Browse Repository Files and Directories). Any user with repository-view permission can use the branch selector to list and switch the branches available to the current repository. The current branch is reflected consistently by the selector, page entry, and file list; selecting a branch changes the browsing snapshot without creating a commit or rewriting branch history. The selector is a unique button named “Branch <current branch name>”; it opens a textbox named “Find branch” and selectable options whose exact accessible names are branch names. As the user types, matching options or a “No matching branch” state update without requiring Enter or a separate search action. Seed data provides public repository `branch-switch-demo`, active branch `main`, target branch `feature-search`, target-only file `main-only.md`, and unknown query `missing-branch`. Selecting `feature-search` immediately updates the selector and exposes the target-only file. Escape closes the selector; an unmatched query leaves the active branch unchanged, including after reload.

          A branch is a named reference pointing to a commit, and switching branches only changes the file snapshot read by the current page.

          Every file, commit, comparison, and branch page displays the repository and current branch or revision.

          Seed data for read-only scenarios consists of public repositories and directly openable repository, file, and commit pages; visitors need not sign in to browse files, history, diffs, code search, or existing branches.

          Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

          The branch selector is the control at the top of the Code page that lists and switches branches; the system stores a unique name and current pointed-to commit for each branch.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-BRANCH-SELECTOR
          reference: reference/github-branch-selector.png
          page: repository_code
      scenarios:
      - id: SCN-REQ-4.3.1-01
        name: 'REQ-4.3.1: List and Switch Repository Branches - Scenario 1'
        steps:
        - id: STEP-REQ-4.3.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `branch-switch-demo` with active branch `main`, target branch
            `feature-search`, and file `main-only.md` available only on the target branch; the visitor can open
            the repository without signing in.
          When: The visitor opens the branch selector, enters `feature-search` in the `Find branch` textbox, and
            clicks the exact `feature-search` option.
          Then: The branch selector displays `feature-search` and the page exposes the exact `main-only.md` file
            link.
          references:
          - \ref[requirement](REQ-4.1)
          - \ref[image](IMG-GITHUB-BRANCH-SELECTOR)
      - id: SCN-REQ-4.3.1-02
        name: 'REQ-4.3.1: List and Switch Repository Branches - Scenario 2'
        steps:
        - id: STEP-REQ-4.3.1-02-01
          Given: The system pre-provisions public repository `branch-switch-demo` with active branch `main` and
            an available `feature-search` branch. The visitor starts at the application home page in a fresh unauthenticated
            browser session and can open the repository without signing in.
          When: The visitor opens the branch selector, enters `missing-branch` in the `Find branch` textbox, observes
            the no-matching-branch state, and presses Escape.
          Then: The selector remains on `main`; after reload, the active branch button still displays `main`.
          references:
          - \ref[requirement](REQ-4.1)
          - \ref[image](IMG-GITHUB-BRANCH-SELECTOR)
      children: []
    - id: REQ-4.3.2
      name: Create a Branch from an Existing Revision
      description:
        text: |-
          A signed-in user with Write, Maintain, Admin, or organization Owner permission can create a named branch from the current branch head through the branch selector. As the user types, a valid unused name exposes an option named “Create branch: <name>”; selecting it creates the reference and switches the browsing context to the new branch without a second mandatory confirmation. The new branch points to the selected base commit and does not copy files or rewrite the base branch history. Read and Triage users may browse but cannot create branches. Branch names are 1–255 characters and may contain ASCII letters, digits, `-`, `_`, `.`, and `/`; names ending in `/` or `.`, containing `..` or `//`, duplicating an existing name, or submitted by an unauthorized user must be rejected. The selector and `Find branch` textbox use the controls defined by REQ-4.3.1. Reloading a successfully created branch preserves it as the selected branch.

          For new branches: Created through the branch creation UI from an existing repository revision; invalid branch names are not materialized.

          Every file, commit, comparison, and branch page displays the repository and current branch or revision.

          Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

          Creating a branch creates a new named reference at a specified base commit; it does not copy files or rewrite base history.

          A branch name is 1 to 255 characters and may contain only ASCII letters, digits, `-`, `_`, `.`, and `/`; it must not end with `/` or `.`, and must not contain consecutive `..` or `//`; duplicate names, invalid names, or lack of permission must prevent branch creation.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-CREATE-BRANCH
          reference: reference/github-create-branch.png
          page: repository_code
      scenarios:
      - id: SCN-REQ-4.3.2-01
        name: 'REQ-4.3.2: Create a Branch from an Existing Revision - Scenario 1'
        steps:
        - id: STEP-REQ-4.3.2-01-01
          Given: The system pre-provisions public repository `branch-switch-demo` with branch `main` and account
            `branch-contributor` with email `branch-contributor@example.test`, password `Valid-password-123!`, and
            Write permission. The generated branch name `pw-branch-<unique suffix>` is unused.
          When: 'The contributor signs in, opens `branch-switch-demo`, opens the branch selector, enters the generated
            `pw-branch-<unique suffix>` name, and selects the matching “Create branch: <name>” option.'
          Then: The selector switches to the generated branch name; after reload, the same branch remains selected.
          references:
          - \ref[requirement](REQ-4.3.1)
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-BRANCH)
      - id: SCN-REQ-4.3.2-02
        name: 'REQ-4.3.2: Create a Branch from an Existing Revision - Scenario 2'
        steps:
        - id: STEP-REQ-4.3.2-02-01
          Given: The system pre-provisions public repository `branch-switch-demo` with branch `main` and account
            `branch-contributor` with email `branch-contributor@example.test`, password `Valid-password-123!`, and
            Write permission. The invalid name `invalid..branch` does not identify an existing branch.
          When: The contributor signs in, opens `branch-switch-demo`, opens the branch selector, and enters `invalid..branch`
            in the `Find branch` textbox.
          Then: The selector displays an “Invalid branch” validation message.
          references:
          - \ref[requirement](REQ-4.3.1)
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-BRANCH)
      children: []
    - id: REQ-4.3.3
      name: Change the Repository Default Branch
      description:
        text: |-
          A repository Admin or organization Owner can change the default branch from Settings → Branches. The “Default branch” native select exposes existing branch names as options; selecting a different branch and activating “Update” opens a confirmation flow, and “Confirm” saves the choice. The default branch is the branch shown when the repository is opened without an explicit branch; changing it does not delete or rewrite the previous branch, its commits, or its files. Read, Triage, and other non-administrator users may view repository content but must not receive an actionable default-branch combobox or update button. The saved setting is associated with the repository and remains effective after reopening.

          Every file, commit, comparison, and branch page displays the repository and current branch or revision.

          Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

          The default branch is the branch read by default when opening the repository overview or a repository entry without a specified branch; it is not the only existing or writable branch.

          Changing the default branch must not alter existing branches, commits, or source/target references of already-open PRs.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-DEFAULT-BRANCH-SETTINGS
          reference: reference/github-default-branch-settings.png
          page: repository_branch_settings
      scenarios:
      - id: SCN-REQ-4.3.3-01
        name: 'REQ-4.3.3: Change the Repository Default Branch - Scenario 1'
        steps:
        - id: STEP-REQ-4.3.3-01-01
          Given: The system pre-provisions public repository `default-branch-demo` with branches `main` and `release`,
            current default branch `main`, and account `default-branch-admin` with email `default-branch-admin@example.test`,
            password `Valid-password-123!`, and repository-administrator permission.
          When: The administrator signs in, opens `default-branch-demo`, opens “Settings” and “Branches”, selects
            `release` in the “Default branch” combobox, clicks “Update”, and clicks “Confirm”.
          Then: After reopening `default-branch-demo`, the branch button displays `release`, and the branch selector
            still offers the existing `main` option.
          references:
          - \ref[requirement](REQ-4.3.1)
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-DEFAULT-BRANCH-SETTINGS)
      - id: SCN-REQ-4.3.3-02
        name: 'REQ-4.3.3: Change the Repository Default Branch - Scenario 2'
        steps:
        - id: STEP-REQ-4.3.3-02-01
          Given: The system pre-provisions public repository `default-branch-demo` with branches `main` and `release`,
            and account `default-branch-viewer` with email `default-branch-viewer@example.test`, password `Valid-password-123!`,
            and no repository-administration permission. The viewer starts from the application home page.
          When: The viewer signs in, opens `default-branch-demo`, and, when available, opens “Settings” and “Branches”.
          Then: The page has no “Default branch” combobox and no actionable “Update default branch” button.
          references:
          - \ref[requirement](REQ-4.3.1)
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-DEFAULT-BRANCH-SETTINGS)
      children: []
  - id: REQ-4.4
    name: Manage Repository Files Through the Web Interface
    description:
      text: |-
        This feature builds on repository browsing and sign-in provided by REQ-4.1 (Browse Repository Files and Directories) and REQ-1.1.2 (Sign In with an Existing Account). From a writable Code page, a contributor can use “Add file” → “Create new file” to add a file on the current branch. Only Write, Maintain, Admin, or organization Owner may submit file changes; Read and Triage may browse but may not write. A successful submission creates one commit containing the path, content, commit message, author, parent commit, and target branch, then advances that branch head. The editor exposes a “File name” field, a “File contents” textbox, a “Commit message” field, and a “Commit changes” button. New file paths cannot be empty, start with `/`, contain a `..` path segment, or conflict with an existing file or directory. Commit messages must contain 1–72 non-empty characters after trimming whitespace. Invalid submissions must leave file data, branch head, and commit history unchanged; an invalid path is reported as “Invalid file path”, while a missing message is reported as “Commit message is required”. Seed data provides public repository `file-management-demo` and Write contributor `file-contributor`. A valid unique file such as `pw-file-<unique suffix>.md`, nonempty content, and message `Add <file name>` produce a file view containing the saved content; the file's “Commits” link exposes the submitted message.

        A commit is an immutable change record that stores the parent commit, author, message, time, and changed files; users with Write, Maintain, Admin, or organization Owner permission can create new commits from a file page through Edit or Add file.

        Editing a file must create a new commit and must not rewrite historical content.

        These accounts sign in through the home-page “Sign in” link, the “Username or email” and “Password” fields, and the “Sign in” button; the signed-in username is visible before opening the target repository entry.

        The file-write scenario uses an existing contributor with Write or higher permission on the target repository and an unprotected writable branch.

        Every file, commit, comparison, and branch page displays the repository and current branch or revision.

        Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

        When the compare branch receives a new commit, the system updates the current compare commit, marks all existing review decisions as stale while preserving them in the timeline, recalculates merge eligibility, and retains inline comments at their original commit and line position marked Outdated.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      image:
      - id: IMG-GITHUB-WEB-FILE-EDITOR
        reference: reference/github-web-file-editor.png
        page: repository_file_editor
    scenarios:
    - id: SCN-REQ-4.4-01
      name: 'REQ-4.4: Manage Repository Files Through the Web Interface - Scenario 1'
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: The system pre-provisions public repository `file-management-demo` and account `file-contributor`
          with email `file-contributor@example.test`, password `Valid-password-123!`, and Write permission on that
          repository. The contributor starts from the application home page; the generated `pw-file-<unique suffix>.md`
          path is unused.
        When: The contributor signs in, opens `file-management-demo`, clicks “Add file” and “Create new file”, enters
          the generated filename, nonempty content, and commit message `Add <file name>`, then clicks “Commit changes”.
        Then: The created file view displays the exact submitted content. Its “Commits” link opens history containing
          the exact commit message `Add <file name>`.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-WEB-FILE-EDITOR)
    - id: SCN-REQ-4.4-02
      name: 'REQ-4.4: Manage Repository Files Through the Web Interface - Scenario 2'
      steps:
      - id: STEP-REQ-4.4-02-01
        Given: The system pre-provisions public repository `file-management-demo` and account `file-contributor`
          with email `file-contributor@example.test`, password `Valid-password-123!`, and Write permission on that
          repository. The contributor starts from the application home page.
        When: The contributor signs in, opens `file-management-demo`, clicks “Add file” and “Create new file”, enters
          path `../invalid.md`, enters content `must not be saved`, leaves the commit message empty, and clicks
          “Commit changes”.
        Then: The page displays an invalid-path message or a required-commit-message message; the invalid submission
          is not accepted.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-WEB-FILE-EDITOR)
    children: []
- id: REQ-5
  name: Work Planning and Issue Management
  description:
    text: |-
      An issue is a persistent work item within a repository used to record pending work, a defect, or a discussion topic; it is not a code file or PR. The Issues page is the list page in repository navigation; each row displays the issue number, title, Open/Closed status, author, and labels, and clicking the number or title opens the issue detail page. At the top of the detail page are the title and status; the right side displays Assignees, Labels, and Milestone metadata in order; the main area displays the description, comments, and activity timeline. The “activity timeline” is an append-only history that records creation, edits, comments, assignment, labels, milestone, and status changes in chronological order. A label is a pre-existing colored classification name in the current repository; a milestone is a pre-existing goal-classification item in the current repository that may be associated with multiple issues or PRs but does not change their content or status. Write, Maintain, and Admin may create issues, edit titles/descriptions, and comment; Triage, Maintain, and Admin may assign participants, apply labels, set milestones, and close or reopen issues; Read may only view. Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read. For issue operations, the explicit role lists in this module define eligibility per operation rather than an implicit cumulative grant from a role's name; Write can create, edit, and comment but cannot assign, label, set milestones, or change status. Organization Owners act with Admin permission. Read-only seed scenarios provide a public repository's visible Issues entry, distinct Open and Closed issues with known titles, and an issue entry with known title, description, metadata, and discussion. Mutation scenarios provide isolated issues for successful editing, invalid-title editing with a known original title, commenting, comment validation, assignment, labels, milestone, and closing; their initial states must not be changed by another scenario. The author and commenter accounts have Write or higher permission; the editor used for both content and metadata operations has Maintain or Admin permission. A separate viewer has Read permission on a protected issue. All authenticated scenarios use the home-page “Sign in” link, fields labeled “Username or email” and “Password”, and the “Sign in” button, after which the signed-in username is visible. Named controls below are unique on the active page unless a narrower scope is stated; detail pages and reloads must work independently of earlier list navigation.

      For existing issues, labels and milestones: Existing issue identities and metadata catalogs; comments and newly submitted issues are created through UI.

      For new issues and issue comments: Created by submitting the issue or discussion-comment UI. Runtime-generated titles, bodies and comments remain supplied by each caller.
  scenarios: []
  children:
  - id: REQ-5.1
    name: Issue Discovery and Details
    description:
      text: 'The Issues list page displays the persisted work items for the current repository. Status and keyword
        filters change only the rows displayed in the browser and do not create, update, or delete issues. Each
        issue row identifies a repository-scoped issue and may display its number, title, Open/Closed status, author,
        labels, and update time. The issue detail page is the complete read view of one issue: it displays the issue
        number, title, status, saved description, metadata such as assignees, labels, and milestone, and discussion
        or activity records. Users with repository-view permission may read this information; editing and other
        mutation controls are governed by the corresponding role requirements. This feature builds on the public
        repository overview provided by REQ-3.3 (View a Public Repository Overview) and keeps list and detail views
        consistent after navigation or reload.'
    scenarios: []
    children:
    - id: REQ-5.1.1
      name: List and Filter Repository Issues
      description:
        text: |-
          This feature builds on the public repository overview provided by REQ-3.3 (View a Public Repository Overview). Users with repository-view permission can read issue rows for the current repository on the Issues list page. “Open” and “Closed” are links that select status views, and the unique searchbox named “Search issues” filters matching rows as the user types without requiring Enter or a separate search button. Each result title is a link whose exact accessible name is the title. Filtering is read-only and does not modify issue data. Seed data provides public repository `acme-docs`, an Open issue titled `Improve onboarding`, and a Closed issue titled `Legacy welcome text`. The Open filter plus the known open title continues to show the matching issue after reload; the Closed filter plus the known closed title shows the closed issue and excludes the open issue.

          The Issues page is the list page in repository navigation; each row displays the issue number, title, Open/Closed status, author, and labels, and clicking the number or title opens the issue detail page.

          Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read.

          Named controls below are unique on the active page unless a narrower scope is stated; detail pages and reloads must work independently of earlier list navigation.

          Repository viewers may read issue lists and details. Read permission alone does not authorize issue mutations.

          Status and keyword filters change only the rows displayed in the browser and do not create, update, or delete issues.

          Each issue row identifies a repository-scoped issue and may display its number, title, Open/Closed status, author, labels, and update time.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-ISSUES-LIST
          reference: reference/github-issues-list.png
          page: issues
      scenarios:
      - id: SCN-REQ-5.1.1-01
        name: 'REQ-5.1.1: List and Filter Repository Issues - Scenario 1'
        steps:
        - id: STEP-REQ-5.1.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` with an Open issue titled `Improve onboarding`;
            the visitor can open its Issues page without signing in.
          When: The visitor opens the Issues page, clicks the “Open” link, and enters `Improve onboarding` in the
            `Search issues` searchbox.
          Then: The exact `Improve onboarding` issue link is visible; after reload, the same exact issue link remains
            visible.
          references:
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-ISSUES-LIST)
      - id: SCN-REQ-5.1.1-02
        name: 'REQ-5.1.1: List and Filter Repository Issues - Scenario 2'
        steps:
        - id: STEP-REQ-5.1.1-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` with a Closed issue titled `Legacy welcome text`
            and an Open issue titled `Improve onboarding`; the visitor can open its Issues page without signing
            in.
          When: The visitor opens the Issues page, clicks the “Closed” link, and enters `Legacy welcome text` in
            the `Search issues` searchbox.
          Then: The exact `Legacy welcome text` issue link is visible and the exact `Improve onboarding` issue link
