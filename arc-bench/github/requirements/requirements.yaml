        name: 'REQ-5.2.1: Create a Repository Issue - Scenario 1'
        steps:
        - id: STEP-REQ-5.2.1-01-01
          Given: The visitor starts at the application home page in a fresh browser session. The system pre-provisions
            public repository `acme-docs` and a signed-in issue-author account with username `issue-author`, email
            `issue-author@example.test`, password `Valid-password-123!`, and permission to create issues. The visitor
            signs in as this account and can open the repository `Issues` page.
          When: The user clicks the `New issue` link, fills `Title` with a unique non-empty title and `Description`
            with a non-empty body, then clicks the `Submit new issue` button.
          Then: The new issue detail page displays a heading with the exact title and exact description. After returning
            to the repository Issues page, an issue link with the same exact title is visible.
          references:
          - \ref[requirement](REQ-5.1.1)
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-NEW-ISSUE)
      - id: SCN-REQ-5.2.1-02
        name: 'REQ-5.2.1: Create a Repository Issue - Scenario 2'
        steps:
        - id: STEP-REQ-5.2.1-02-01
          Given: The visitor starts at the application home page in a fresh browser session. The system pre-provisions
            public repository `acme-docs` and the issue-author account (`issue-author`, `issue-author@example.test`,
            `Valid-password-123!`) with permission to create issues. The visitor signs in, opens the repository
            `Issues` page, and can see the `New issue` link.
