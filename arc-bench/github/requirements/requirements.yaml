  - id: REQ-6.5
    name: Merge an Eligible Pull Request
    description:
      text: |-
        On an eligible PR, Merge pull request and then Confirm merge are buttons; confirming displays Merged, and that state remains after reload. A blocked PR keeps a visible disabled Merge pull request button and explains its unmet review or protection condition before any click. Seed data supplies a Maintain account and separate Open PRs for success and refusal. The eligible PR targets protected main, has a current non-author approval and test: success, and has no conflicts. The blocked PR targets a protected branch and lacks the required valid approval; its disabled button is accompanied by Review required by branch protection. The success and refusal states are separate PR records, so neither test relies on restoring a mutation from the other. “Merge” is the only write operation that writes the current compare commit's changes from an Open PR into the base branch; it is not simply marking the PR as complete. Only Maintain, Admin, or organization Owner may merge from the PR detail page using the sole supported “Create a merge commit” method; the merge confirmation area should display satisfied and unsatisfied conditions. Before confirmation, the system rereads the target branch head, current compare commit, merge-conflict state, and protection rules — there must be no valid Request changes; if the target is protected, each enabled rule requirement is enforced independently, requiring 1 valid non-author Approve for the current compare commit when Require 1 approval is enabled and requiring `test` success when Require status check test is enabled. An unprotected target has no additional approval-count or check-success requirement, but merging still requires no merge conflicts and no valid Request changes review. After validation succeeds, the system atomically creates a merge commit whose parents are the target-branch head at merge time and the current compare commit, updates the target-branch head, sets the PR to Merged, and stores the merger, time, and resulting commit identifier. If any condition is unsatisfied or persistence fails, the page explains the applicable reason and neither the target branch nor PR changes; a missing required approval displays “Review required by branch protection”. Merged is terminal. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6.3.4 (Submit a Pull Request Review) and REQ-6.1 (Protect Branches with Review and Status-Check Requirements); it must reuse that context and keep pages and data consistent after the context changes.

        Write, Maintain, and Admin may add inline comments and submit reviews, the author or Maintain/Admin may request reviewers, and only Maintain, Admin, or organization Owner may merge.

        When the compare branch receives a new commit, the system updates the current compare commit, marks all existing review decisions as stale while preserving them in the timeline, recalculates merge eligibility, and retains inline comments at their original commit and line position marked Outdated.

        Failure does not change branches or PR state.

        Each named action, field, and navigation link is unique on its active page unless explicitly repeated per changed line or reviewer.

        PR titles are headings whose accessible name is exactly the persisted title; list titles are links with that same exact name.

        Conversation, Commits, Files changed, and Checks are navigation links, even when visually styled as tabs.

        The current PR status is visible text.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
    scenarios:
    - id: SCN-REQ-6.5-01
      name: 'REQ-6.5: Merge an Eligible Pull Request - Scenario 1'
      steps:
      - id: STEP-REQ-6.5-01-01
        Given: The system pre-provisions the separate Open PR `Mergeable onboarding PR` targeting protected `main`,
          with one valid non-author approval for the current compare commit, successful `test` status, and no merge
          conflict. It also pre-provisions Maintain account `pr-maintainer` with email `pr-maintainer@example.test`,
          password `Valid-password-123!`, and permission to merge this PR. The visitor starts at the application
          home page.
        When: 'The maintainer confirms that the only selectable method on the page is “Create a merge commit”, clicks
          “Merge pull request”, and clicks “Confirm merge” in the confirmation box. Seed values: pull requests `Mergeable
          onboarding PR` and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`, check
          `test`.'
        Then: 'The PR displays Merged, the merger, time, and resulting commit identifier; the `main` branch head
          is updated to the merge result, and the PR''s source- and target-branch content is integrated according
          to the selected merge method. Seed values: pull requests `Mergeable onboarding PR` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        references:
        - \ref[requirement](REQ-6.3.4)
        - \ref[requirement](REQ-6.1)
      - id: STEP-REQ-6.5-01-02
        Then: 'After refreshing the PR and `main` branch, the merged status and resulting commit remain; if the
          PR is a draft, lacks approval, has a failed check, is unmergeable, or the user lacks permission, the merge
          entry is disabled or rejected and the target branch and PR state remain unchanged. Seed values: pull requests
          `Mergeable onboarding PR` and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
        references:
        - \ref[requirement](REQ-6.3.4)
        - \ref[requirement](REQ-6.1)
    - id: SCN-REQ-6.5-02
      name: 'REQ-6.5: Merge an Eligible Pull Request - Scenario 2'
      steps:
      - id: STEP-REQ-6.5-02-01
        Given: The system pre-provisions the separate Open PR `Blocked onboarding PR` targeting protected `main`,
          with no valid current approval, and the Maintain account `pr-maintainer` with email `pr-maintainer@example.test`,
          password `Valid-password-123!`, and merge permission. The PR has no merge conflict and remains blocked
          by its unmet review or protection requirement.
        When: The maintainer signs in with `pr-maintainer` and opens `Blocked onboarding PR`; the `Merge pull request`
          button is visible but disabled.
        Then: The page displays a review, required, or protection explanation, and the disabled merge control remains
          unchanged.
        references:
        - \ref[requirement](REQ-6.3.4)
        - \ref[requirement](REQ-6.1)
      - id: STEP-REQ-6.5-02-02
        Then: The maintainer does not activate the disabled control; the blocked PR and its target branch remain
          unchanged.
        references:
        - \ref[requirement](REQ-6.3.4)
        - \ref[requirement](REQ-6.1)
    children: []
  - id: REQ-6.6
    name: Close or Reopen a Pull Request Without Merging
    description:
      text: |-
        The PR page provides Close pull request and Reopen pull request as buttons for authorized users. Close pull request immediately sets Closed without an extra confirmation dialog, then Reopen pull request immediately restores Open. After reload, Close pull request is available again. For a viewer who is neither author nor Maintain/Admin/Owner, both controls are absent, rather than merely disabled or rejected after activation. Seed data supplies the author and a separate Read viewer, an authored Open PR for the close/reopen cycle, and a separate Open PR readable by that viewer for permission validation. When the proposed change should not proceed, the PR author, Maintain, Admin, or organization Owner may close an unmerged Open or Draft PR without merging; the same roles may reopen a Closed PR as Open. The system stores the status, operator, and time and records the transition, while keeping the PR discussion, reviews, diff, and branch references viewable; closing or reopening must not update any branch. Merged is terminal, the page does not display close or reopen operations, and the server rejects status changes. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6.2.3 (Create a Pull Request from Comparison Results) and REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.

        A PR's persisted status may only be Draft, Open, Closed, or Merged — normal creation produces Open, draft creation produces Draft, and the author or Maintain/Admin may mark a Draft as Ready for review to transition it to Open; the author or Maintain/Admin may transition an unmerged Open or Draft PR to Closed and may transition Closed back to Open; Merged is terminal and cannot be closed or reopened.

        Failure does not change branches or PR state.

        Each named action, field, and navigation link is unique on its active page unless explicitly repeated per changed line or reviewer.

        PR titles are headings whose accessible name is exactly the persisted title; list titles are links with that same exact name.

        Conversation, Commits, Files changed, and Checks are navigation links, even when visually styled as tabs.

        The current PR status is visible text.

