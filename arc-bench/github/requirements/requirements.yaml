          Given: The visitor starts at the application home page in a fresh browser session. The system pre-provisions
            public repository `acme-docs`, the Open issue `Editable onboarding issue`, and a signed-in issue-editor
            account with username `issue-editor`, email `issue-editor@example.test`, password `Valid-password-123!`,
            and permission to edit issues. The visitor signs in and opens that issue detail page.
          When: The user clicks `Edit issue title`, fills `Issue title` with a unique valid title, and clicks `Save
            issue title`; then clicks `Edit issue description`, fills `Issue description` with a unique valid body,
            and clicks `Save issue description`.
          Then: After reload, the issue detail displays the exact new title as its heading and the exact new description.
          references:
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-1.1.2)
      - id: SCN-REQ-5.2.2-02
        name: 'REQ-5.2.2: Edit an Issue Title and Description - Scenario 2'
        steps:
        - id: STEP-REQ-5.2.2-02-01
          Given: The visitor starts at the application home page in a fresh browser session. The system pre-provisions
            public repository `acme-docs`, a separate issue titled `Original issue title`, and the issue-editor
            account (`issue-editor`, `issue-editor@example.test`, `Valid-password-123!`) with permission to edit
            issues. The visitor signs in and opens that issue detail page.
          When: The user clicks `Edit issue title`, fills the `Issue title` field with three spaces, and clicks
            `Save issue title`.
          Then: The page displays a title-required or title-empty validation message; after reload, the exact original
