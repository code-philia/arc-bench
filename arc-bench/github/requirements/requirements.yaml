      name: View Repository Commit History
      description:
        text: |-
          This feature builds on the repository and file browsing context provided by REQ-4.1 (Browse Repository Files and Directories). A user with repository-view permission can open the repository's commit history from its repository page and inspect the records for the readable branch. Each record represents an immutable change and may expose its commit identifier, author, time, parent, and changed files. The repository page exposes a history link named “Commits”; a commit count may accompany the label without creating another matching link. Seed history includes the message `Document search flow`, author `alice-dev`, and a relative timestamp containing “ago”. Opening branch history directly displays these values without requiring file editing or other write actions.

          Every file, commit, comparison, and branch page displays the repository and current branch or revision.

          Seed data for read-only scenarios consists of public repositories and directly openable repository, file, and commit pages; visitors need not sign in to browse files, history, diffs, code search, or existing branches.

          Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

          All three are read-only views that do not create commits or modify files or branches and follow repository visibility and access permissions.

          Commit history lists the current branch or file-path commits in reverse chronological order.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
