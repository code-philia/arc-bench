id: ROOT
name: GitHub Collaboration Platform Core Requirements
description:
  text: |-
    This product is a simplified GitHub collaboration platform. Unless an atomic requirement explicitly allows more than one role, every quoted user-interface name is the exact English accessible name of the control; the role, scope, and observable-state rules stated by each atomic requirement are authoritative. Values described as existing accounts, organizations, teams, repositories, branches, files, commits, issues, milestones, pull requests, reviews, and permission relationships are predefined seed data. Generated names may contain a unique suffix, but their role, ownership, visibility, and relationships are exactly those stated in the atomic requirement. Organization Owner, repository Admin, Read, Triage, Write, Maintain, and Admin permissions follow the operation-specific rules in the requirements below; these roles are not an automatic cumulative ladder. Real-time collaboration, Actions, Packages, Wiki, project boards, notification delivery, and external Git remote protocols are outside the scope of this product.

    For existing access relationships: Existing access grants and account capabilities required for the named public operations. Capabilities describe permitted operations without assigning an unspecified cumulative permission level.

    For current search, selection, comparison, editor draft and clipboard state: Produced through public search, branch selection, comparison, file-editor draft and clone-copy interactions. No search result, file draft or clipboard snapshot is preloaded.

    For changes to existing collaboration objects: Produced through member, team, access, branch, issue, check and pull-request management UI. Changed values and post-action review or merge results are not initial data.
scenarios: []
children:
- id: REQ-1
  name: Identity and Access
  description:
    text: |-
      This module defines the “account” and “session” required to access the system. An account is a persistent individual identity storing a username, verified email, and credential status; a session is a record created after successful account sign-in that represents only the current browser login state. Visitors enter the account-access page from “Sign up”, “Sign in”, or “Forgot password” on the home page; signed-in users enter security settings or sign out from the account menu. The account menu is the control in the upper-right corner of the page that displays the current signed-in account, organization list, and sign-out entry. No page, error message, or recovery flow may display a full password. After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.

      For existing login accounts and referenced users: Existing login credentials are supplied by the account helper. Referenced users without supplied credentials have only their stated username.

      For authentication and account-access state: Established through registration, sign-in, sign-out and password/recovery UI; never injected into cookies or storage.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Account Registration and Recovery
    description:
      text: The account-access page is the shared page used by unauthenticated users to register, sign in, and recover
        a password, with the frontend showing the appropriate form and submit button for each operation. The local
        product does not implement an email-verification page, email delivery, or an external verification-code
        service — successful registration directly stores a sign-in-capable account and marks its email as verified;
        successful sign-in only stores a new session and does not create a duplicate account; after submitting an
        email for password recovery, the page directly displays the fixed verification code `123456` and the password-reset
        form, and only the correct code together with a compliant new password updates the password of the same
        account. Registration, sign-in, and recovery pages must use visible labels to identify fields and submit
        actions; after failure, non-sensitive input is retained, while password and password-confirmation fields
        must not redisplay submitted values.
    scenarios: []
    children:
    - id: REQ-1.1.1
      name: Register a New GitHub Account
      description:
        text: |-
          The registration page is the form opened by the unique link named “Create an account” from the sign-in page. The form contains exactly one textbox labeled “Username”, one textbox labeled “Email”, one password input labeled “Password”, one password input labeled “Confirm password”, one initially unchecked checkbox named “Agree to the terms”, and one enabled button named “Create account”. The username and email identify the account, while passwords must not be echoed on the page. This product directly marks the email of a successfully registered account as verified and does not provide a subsequent email-verification page. The visitor enters a unique username, email, password, and matching confirmation, checks “Agree to the terms”, and activates “Create account”. The username must consist of 1 to 39 lowercase ASCII letters, digits, or single hyphens (`-`) and must not begin or end with a hyphen; after trimming leading and trailing whitespace, the email must contain exactly one `@`, be no longer than 254 characters, and have at least one dot and non-empty domain labels after the `@`; the password must contain 12 to 128 characters, include at least one uppercase letter, one lowercase letter, one digit, and one non-alphanumeric special character, and contain no whitespace characters. The system stores a sign-in-capable account together with its verified-email status and enters the sign-in page; if the username or email conflicts, any field is missing, the email format is invalid, the terms are not accepted, the password is noncompliant, or the confirmation does not match, the system retains the username and email input, displays an itemized message beside the corresponding field, and does not create an account. The corresponding visible field message contains “Username already exists”, “Username format is invalid”, “Email format is invalid”, “Password requirements are not satisfied”, or “Agree to terms is required”, as applicable. Visitors can use this capability on the account-access page. The system validates input rules, displays field errors, and prevents duplicate accounts; on success, it directly creates an available account. Submitting several invalid fields together must show the username, email, password, and missing-terms messages together, rather than revealing only one error per submission; the submit button remains actionable so these messages can be read. For example, a username beginning with a hyphen, email “not-an-email”, password “short”, confirmation “different”, and unchecked terms produce these field errors and preserve the attempted username. A duplicate username paired with a different unused email displays “Username already exists” and retains both attempted values. A successful registration accepts a unique username, its email, and password; the sign-in form is immediately available, accepts that email, and the resulting signed-in username remains visible after reload.

          For accounts created by registration: Created through the registration UI. The duplicate-username case first registers its existing account through that same UI; rejected submissions create no account.

          No page, error message, or recovery flow may display a full password.

          The account-access page is the shared page used by unauthenticated users to register, sign in, and recover a password, with the frontend showing the appropriate form and submit button for each operation.

          Registration, sign-in, and recovery pages must use visible labels to identify fields and submit actions; after failure, non-sensitive input is retained, while password and password-confirmation fields must not redisplay submitted values.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-SIGN-UP
          reference: reference/github-sign-up.png
          page: sign_up
      scenarios:
      - id: SCN-REQ-1.1.1-01
        name: 'REQ-1.1.1: Register a New GitHub Account - Scenario 1'
        steps:
        - id: STEP-REQ-1.1.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session and
            opens the account-access page. The visitor clicks the visible link “Sign in” and then the visible link
            “Create an account”. The registration page displays visibly labeled Username, Email, Password, and Confirm
            password fields, a checkbox named “Agree to the terms”, and a button named “Create account”. The username
            `nora-demo` and email `nora.demo@example.test` are not registered.
          When: The visitor enters `nora-demo` in Username, `nora.demo@example.test` in Email, `Valid-password-123!`
            in Password and Confirm password, checks “Agree to the terms”, and clicks “Create account”.
          Then: The system opens the sign-in page and visibly displays the labeled “Username or email” and “Password”
            fields and the “Sign in” button. The visitor enters `nora.demo@example.test` in “Username or email”,
            enters `Valid-password-123!` in “Password”, and clicks “Sign in”. The workspace visibly displays the
            username `nora-demo`.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-SIGN-UP)
        - id: STEP-REQ-1.1.1-01-02
          Then: After the visitor reloads the page, the workspace still visibly displays the username `nora-demo`.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-SIGN-UP)
      - id: SCN-REQ-1.1.1-02
        name: 'REQ-1.1.1: Register a New GitHub Account - Scenario 2'
        steps:
        - id: STEP-REQ-1.1.1-02-01
          Given: The visitor starts in a fresh unauthenticated browser session. duplicate-demo, duplicate.demo@example.test
            and unused.demo@example.test are initially unused. Open registration through Sign in and Create an account;
            first register duplicate-demo with duplicate.demo@example.test, password Valid-password-123!, matching
            confirmation and accepted terms through that UI.
          When: Reopen registration and submit Username duplicate-demo with Email unused.demo@example.test, Password
            and Confirm password both Valid-password-123!, and Agree to the terms checked.
          Then: The registration page displays Username already exists. Username retains duplicate-demo and Email
            retains unused.demo@example.test; the second submission creates no account.
          references:
          - \ref[image](IMG-GITHUB-SIGN-UP)
        - id: STEP-REQ-1.1.1-02-02
          Then: The original UI-created account remains unchanged and the rejected submission does not authenticate
            the visitor.
          references:
          - \ref[image](IMG-GITHUB-SIGN-UP)
      - id: SCN-REQ-1.1.1-03
        name: 'REQ-1.1.1: Register a New GitHub Account - Scenario 3'
        steps:
        - id: STEP-REQ-1.1.1-03-01
          Given: The visitor starts in a fresh unauthenticated browser session and opens registration through Sign
            in and Create an account. invalid-demo and invalid.demo@example.test are example unused identity values;
            no invalid account has been pre-created.
          When: Enter -invalid-demo in Username, not-an-email in Email, short in Password and different in Confirm
            password; leave Agree to the terms unchecked and click Create account.
          Then: Username format is invalid, Email format is invalid, Password requirements are not satisfied and
            Agree to terms is required are all visible after the same submission. Username retains -invalid-demo.
          references:
          - \ref[image](IMG-GITHUB-SIGN-UP)
        - id: STEP-REQ-1.1.1-03-02
          Then: The registration form remains available for correction, no account is created and no authenticated
            session is established.
          references:
          - \ref[image](IMG-GITHUB-SIGN-UP)
      children: []
    - id: REQ-1.1.2
      name: Sign In with an Existing Account
      description:
        text: |-
          This feature builds on the persisted objects. The sign-in page is the form on the account-access page containing “Username or email”, “Password”, and “Sign in”. A “session” is the current-browser login record saved after successful account authentication, represented in the frontend by the upper-right account menu and access to protected pages. The visitor enters a username or email and a password and submits the form. The system looks up the account and validates its credentials and availability status; if authentication fails due to an unknown username/email, incorrect password, or unavailable account, the system displays exactly the same generic failure message “Invalid credentials”, does not disclose whether the account exists or which credential was wrong, and does not create a session. After successful authentication, the system stores a session with a unique session identifier, account identifier, and active status, then redirects to the workspace accessible to that user; the session remains valid after refreshing or reopening the workspace, and subsequent protected organization, repository, and work-item requests must use this session to determine the current user.

          An account is a persistent individual identity storing a username, verified email, and credential status; a session is a record created after successful account sign-in that represents only the current browser login state.

          The account menu is the control in the upper-right corner of the page that displays the current signed-in account, organization list, and sign-out entry.

          No page, error message, or recovery flow may display a full password.

          After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.

          The account-access page is the shared page used by unauthenticated users to register, sign in, and recover a password, with the frontend showing the appropriate form and submit button for each operation.

          Registration, sign-in, and recovery pages must use visible labels to identify fields and submit actions; after failure, non-sensitive input is retained, while password and password-confirmation fields must not redisplay submitted values.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-SIGN-IN
          reference: reference/github-sign-in.png
          page: sign_in
      scenarios:
      - id: SCN-REQ-1.1.2-01
        name: 'REQ-1.1.2: Sign In with an Existing Account - Scenario 1'
        steps:
        - id: STEP-REQ-1.1.2-01-01
          Given: The visitor starts in a fresh unauthenticated browser session. The system has pre-provisioned a
            verified and available account with username `alice-dev`, email `alice.dev@example.test`, and password
            `Valid-password-123!`.
          When: The visitor opens the application home page, verifies that exactly one visible link named “Sign
            in” is available, and clicks it. On the sign-in page, the visitor enters `alice-dev` in the visibly
            labeled “Username or email” field, enters `Valid-password-123!` in the visibly labeled “Password” field,
            and clicks the button named “Sign in”.
          Then: The system enters the workspace and visibly displays the exact username `alice-dev`.
          references:
          - \ref[image](IMG-GITHUB-SIGN-IN)
        - id: STEP-REQ-1.1.2-01-02
          Then: After the visitor reloads the page, the exact username `alice-dev` remains visible.
          references:
          - \ref[image](IMG-GITHUB-SIGN-IN)
      - id: SCN-REQ-1.1.2-02
        name: 'REQ-1.1.2: Sign In with an Existing Account - Scenario 2'
        steps:
        - id: STEP-REQ-1.1.2-02-01
          Given: The visitor starts in a fresh unauthenticated browser session. The system has pre-provisioned a
            verified and available account with username `alice-dev`, email `alice.dev@example.test`, and password
            `Valid-password-123!`.
          When: The visitor opens the application home page, clicks the visible link named “Sign in”, enters `alice.dev@example.test`
            in the visibly labeled “Username or email” field, enters the incorrect password `Valid-password-123!-incorrect`
            in the visibly labeled “Password” field, and clicks the button named “Sign in”.
          Then: The sign-in page visibly displays the generic message “Invalid credentials”.
          references:
          - \ref[image](IMG-GITHUB-SIGN-IN)
      - id: SCN-REQ-1.1.2-03
        name: 'REQ-1.1.2: Sign In with an Existing Account - Scenario 3'
        steps:
        - id: STEP-REQ-1.1.2-03-01
          Given: The visitor starts in a fresh unauthenticated browser session. The system has pre-provisioned a
            verified and available account with username `alice-dev`, email `alice.dev@example.test`, and password
            `Valid-password-123!`.
          When: The visitor opens the application home page, clicks the visible link named “Sign in”, enters `alice.dev@example.test`
            in the visibly labeled “Username or email” field, enters `Valid-password-123!` in the visibly labeled
            “Password” field, and clicks the button named “Sign in”.
          Then: The system enters the workspace and visibly displays the username `alice-dev`.
          references:
          - \ref[image](IMG-GITHUB-SIGN-IN)
      - id: SCN-REQ-1.1.2-04
        name: 'REQ-1.1.2: Sign In with an Existing Account - Scenario 4'
        steps:
        - id: STEP-REQ-1.1.2-04-01
          Given: The visitor starts in a fresh unauthenticated browser session. The system has pre-provisioned a
            verified and available account with username `alice-dev`, email `alice.dev@example.test`, and password
            `Valid-password-123!`.
          When: The visitor opens the application home page, clicks the visible link named “Sign in”, enters the
            unknown address `unknown@example.test` in the visibly labeled “Username or email” field, enters `Valid-password-123!`
            in “Password”, and clicks “Sign in”. The visitor then reopens the application home page, clicks “Sign
            in” again, enters `alice-dev` in “Username or email”, enters the incorrect password `Valid-password-123!-wrong`
            in “Password”, and clicks “Sign in” again.
          Then: The first sign-in attempt displays the generic message “Invalid credentials”, and the second sign-in
            attempt displays the same generic message.
          references:
          - \ref[image](IMG-GITHUB-SIGN-IN)
      children: []
    - id: REQ-1.1.3
      name: Recover Account Access Through a Verified Email
      description:
        text: |-
          The sign-in page exposes a visible “Forgot password” link. The recovery step displays visibly labeled Email, Verification code, New password, and Confirm password fields and a “Send reset link” or “Reset password” button. A registered verified email and an unknown email both reach the same recovery step and display the fixed verification code `123456` without requiring email delivery. A wrong code leaves the original password usable and displays “Verification code is invalid”. A correct code with matching compliant passwords updates the account and displays “Password updated”.

          For simulated recovery-code delivery configuration: The simulated reset flow supplies this code after Send reset link. Issuance and validation are produced through the public recovery UI; no reset token or authenticated session is preloaded.

          No page, error message, or recovery flow may display a full password.

          After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.

          The account-access page is the shared page used by unauthenticated users to register, sign in, and recover a password, with the frontend showing the appropriate form and submit button for each operation.

          Registration, sign-in, and recovery pages must use visible labels to identify fields and submit actions; after failure, non-sensitive input is retained, while password and password-confirmation fields must not redisplay submitted values.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
      - id: SCN-REQ-1.1.3-01
        name: 'REQ-1.1.3: Recover Account Access Through a Verified Email - Scenario 1'
        steps:
        - id: STEP-REQ-1.1.3-01-01
          Given: The visitor starts in a fresh unauthenticated browser session. Test setup pre-provisions the verified
            account `recovery-visibility` with email `recovery-visibility@example.test` and password `Valid-password-123!`;
            the address `unknown@example.test` does not belong to an account.
          When: The visitor opens “Sign in”, clicks “Forgot password”, submits `recovery-visibility@example.test`,
            and then repeats the reset-step flow for `unknown@example.test`.
          Then: Both reset-step pages display the fixed text `123456`, the visibly labeled “Verification code” field,
            and the visibly labeled “New password” field.
          references:
          - \ref[requirement](REQ-1.1.2)
      - id: SCN-REQ-1.1.3-02
        name: 'REQ-1.1.3: Recover Account Access Through a Verified Email - Scenario 2'
        steps:
        - id: STEP-REQ-1.1.3-02-01
          Given: The visitor starts in a fresh unauthenticated browser session. Test setup pre-provisions the verified
            account `recovery-invalid-code` with email `recovery-invalid-code@example.test` and password `Valid-password-123!`.
          When: The visitor opens the reset step for `recovery-invalid-code@example.test`, enters `000000` in “Verification
            code”, enters `Replacement-password-456!` in both “New password” and “Confirm password”, and clicks
            “Reset password”. The visitor then signs in with the same email and original password `Valid-password-123!`.
          Then: The reset displays “Verification code is invalid”, and the original password login succeeds with
            workspace username `recovery-invalid-code`.
          references:
          - \ref[requirement](REQ-1.1.2)
      - id: SCN-REQ-1.1.3-03
        name: 'REQ-1.1.3: Recover Account Access Through a Verified Email - Scenario 3'
        steps:
        - id: STEP-REQ-1.1.3-03-01
          Given: The visitor starts in a fresh unauthenticated browser session. Test setup pre-provisions the verified
            account `recovery-success` with email `recovery-success@example.test` and password `Valid-password-123!`.
          When: The visitor opens the reset step for `recovery-success@example.test`, enters `123456` in “Verification
            code”, enters `Replacement-password-456!` in both “New password” and “Confirm password”, and clicks
            “Reset password”. The visitor then signs in with the same email and the new password `Replacement-password-456!`.
          Then: The system displays “Password updated”, and the new password login succeeds with workspace username
            `recovery-success`.
          references:
          - \ref[requirement](REQ-1.1.2)
      children: []
  - id: REQ-1.2
    name: Sign Out and End the Current Web Session
    description:
      text: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. The page contains exactly one button named “Account menu”; its menu contains exactly one link named “Sign out”. Activating it displays a dialog named “Sign out” with buttons named “Confirm sign out” and “Cancel”. The dialog explains that sign-out affects only the current browser session. Only “Confirm sign out” invalidates the session, while “Cancel” or closing the dialog retains the current session and page. After confirming, refresh, browser back navigation, or directly reopening a previously accessible protected account, repository, or organization page restores an unauthenticated state and displays the “Sign in” link.

        No page, error message, or recovery flow may display a full password.

        After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      image:
      - id: IMG-GITHUB-ACCOUNT-MENU-SIGN-OUT
        reference: reference/github-account-menu-sign-out.png
        page: account_menu
    scenarios:
    - id: SCN-REQ-1.2-01
      name: 'REQ-1.2: Sign Out and End the Current Web Session - Scenario 1'
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: 'The visitor starts at the application home page in a fresh unauthenticated browser session. The
          seeded data is account `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`. A
          signed-in user has entered an organization, repository, or account-settings page they are authorized to
          access from the account menu and has recorded that protected page heading. Seed values: account `alice-dev`,
          email `alice.dev@example.test`, password `Valid-password-123!`.'
        When: 'The user opens the account menu and clicks “Sign out”; if a confirmation dialog appears, the user
          confirms instead of canceling or closing it. Seed values: account `alice-dev`, email `alice.dev@example.test`,
          password `Valid-password-123!`.'
        Then: 'The system returns to an unauthenticated access state, displays the “Sign in” entry, and no longer
          displays that user''s account menu; if the user cancels the confirmation dialog, the session remains valid
          and the original page remains accessible. Seed values: account `alice-dev`, email `alice.dev@example.test`,
          password `Valid-password-123!`.'
        references:
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-ACCOUNT-MENU-SIGN-OUT)
      - id: STEP-REQ-1.2-01-02
        Then: 'When the user refreshes, navigates back in the browser, or directly returns to the recorded protected
          page, the system requires re-authentication and cannot restore the signed-out session. Seed values: account
          `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`.'
        references:
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-ACCOUNT-MENU-SIGN-OUT)
    - id: SCN-REQ-1.2-02
      name: 'REQ-1.2: Sign Out and End the Current Web Session - Scenario 2'
      steps:
      - id: STEP-REQ-1.2-02-01
        Given: 'The visitor starts at the application home page in a fresh unauthenticated browser session. The
          seeded data is account `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`. The
          visitor starts at the application home page in a fresh unauthenticated browser session. Seed values: account
          `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`.'
        When: 'The user signs in as `alice-dev` with `Valid-password-123!` and follows the visible controls for
          the sign out and end the current web session workflow. Seed values: account `alice-dev`, email `alice.dev@example.test`,
          password `Valid-password-123!`.'
        Then: 'The page displays the required headings, controls, values, and status for the sign out and end the
          current web session workflow. Seed values: account `alice-dev`, email `alice.dev@example.test`, password
          `Valid-password-123!`.'
        references:
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-ACCOUNT-MENU-SIGN-OUT)
      - id: STEP-REQ-1.2-02-02
        Then: 'After refreshing or reopening the visible destination, the successful result remains persisted; a
          rejected action leaves the original state unchanged. Seed values: account `alice-dev`, email `alice.dev@example.test`,
          password `Valid-password-123!`.'
        references:
        - \ref[requirement](REQ-1.1.2)
        - \ref[image](IMG-GITHUB-ACCOUNT-MENU-SIGN-OUT)
    children: []
  - id: REQ-1.3
    name: Change Account Password
    description:
      text: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. The security form has uniquely labeled password inputs “Current password”, “New password”, and “Confirm password”, and a button “Update password”; submitting an empty current-password field must display the visible application message “Current password is required”. A failure with an incorrect current password and confirmation “does-not-match” must display the corresponding current-password or confirmation error and leave the old credentials usable. Each password-change scenario starts with its own verified account in the stated credential state and a different compliant candidate password. “Password and authentication” is the security page in account Settings used to change the current account credentials; the change affects only the current account's password record and does not alter any other accounts or resources outside the session. The user must provide the current password, a new password compliant with the REQ-1 password rules, and a character-for-character identical confirmation password; all three fields are required. The system validates the change, prevents unauthorized updates, and applies the new password to subsequent sign-in attempts. If the current password is incorrect, the new password is noncompliant, the confirmation does not match, or any field is missing, the system displays the reason in the corresponding field and does not modify the credentials; the applicable visible message is “Current password is incorrect”, “Password confirmation does not match”, or “Current password is required”. The old password remains valid and the new password must not work for sign-in. After a successful update, the page displays “Password updated”, the new password is immediately used for subsequent password-based sign-ins, and the old password must no longer work for new sign-ins.

        Seed password-change values are `New-password-456!` for the successful update and
        `Required-password-789!` for the missing-current-password scenario.

        No page, error message, or recovery flow may display a full password.

        After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      image:
      - id: IMG-GITHUB-PASSWORD-SETTINGS
        reference: reference/github-password-settings.png
        page: password_settings
    scenarios:
    - id: SCN-REQ-1.3-01
      name: 'REQ-1.3: Change Account Password - Scenario 1'
