- id: REQ-2
  name: Organization and Governance
  description:
    text: |-
      Signed-in users enter the organization list through “Your organizations” in the account menu and can create or open an organization; visitors can only view public repositories through public organization pages. The organization overview provides Repositories, People, and Teams entries. An organization Owner directly adds or removes members on People, creates teams and maintains hierarchy on Teams, and grants roles to members or teams in Manage access under repository Settings. Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository. Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository. All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

      For existing organizations and teams: Existing organization identities, teams and organization membership used by public navigation and management actions.

      For organizations, teams and memberships created through UI: Created through organization, team and member management UI. Existing organizations used as parents remain seed records.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Organization Identity and Discovery
    description:
      text: The organization overview page uses the organization name as a heading; its “Repositories”, “People”,
        and “Teams” navigation entries have link roles even when visually styled as tabs. The Repositories tab lists
        repositories owned by the organization, the People tab lists members and their Member/Owner roles, and the
        Teams tab lists teams. This module supports visitors discovering an organization's public repositories and
        signed-in accounts creating organizations from the “Your organizations” page. The unique organization name
        uses the same globally unique 1–39-character lowercase ASCII format as the REQ-1 username; the display name
        must contain 1–100 non-empty characters after trimming leading and trailing whitespace. After successful
        creation, the system stores the organization object and the creating account's Owner membership relationship,
        and the user enters the new organization overview page; subsequent team, member, and organization-repository
        authorization is scoped by this organization identifier. This feature builds on the persisted objects, opened
        pages, or authenticated-session context provided by REQ-1.1.2 (Sign In with an Existing Account); it must
        reuse that context and keep pages and data consistent after the context changes.
    scenarios: []
    children:
    - id: REQ-2.1.1
      name: Browse Organization Repositories
      description:
        text: |-
          The organization page presents “Repositories” as a navigation link, visually usable as a tab, and a textbox labeled “Find a repository”. Filtering updates the visible results as the user types, without a separate submit action. Each result has a link named exactly with the repository name, and opens a heading displaying “organization name/repository name”. Returning with browser Back keeps the public result available; filtering by the exact private repository name never exposes its link to a visitor. The seed organization has a public repository and a distinct private repository inaccessible to visitors. From the organization page, the user clicks the “Repositories” link, can enter a repository name in the filter box, select a public/private filter, and click a repository name in the list to open its overview. The system displays only the names, descriptions, visibility, and update times of repositories visible to the current user; clicking a result opens that repository's overview. Visitors can view public repositories on a public organization overview page; signed-in accounts can see only repositories for which they have read permission on the Repositories tab of the organization overview. The list reads repository name, description, visibility, and update time and provides no write operations; private repositories must first be validated under the already defined repository-access rules.

          Signed-in users enter the organization list through “Your organizations” in the account menu and can create or open an organization; visitors can only view public repositories through public organization pages.

          The organization overview provides Repositories, People, and Teams entries.

          The organization overview page uses the organization name as a heading; its “Repositories”, “People”, and “Teams” navigation entries have link roles even when visually styled as tabs.

          The Repositories tab lists repositories owned by the organization, the People tab lists members and their Member/Owner roles, and the Teams tab lists teams.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-ORGANIZATION-REPOSITORIES
          reference: reference/github-organization-repositories.png
          page: organization_repositories
      scenarios:
      - id: SCN-REQ-2.1.1-01
        name: 'REQ-2.1.1: Browse Organization Repositories - Scenario 1'
        steps:
        - id: STEP-REQ-2.1.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the organization `Acme Demo` with public repository `acme-docs` and private repository
            `secret-research`. The organization overview exposes a visible link named “Repositories”.
          When: The visitor opens the visible organization `Acme Demo`, clicks the “Repositories” link, enters `acme-docs`
            in the visibly labeled textbox “Find a repository”, and clicks the exact link named `acme-docs`.
          Then: The repository overview page displays a visible heading containing `acme-docs`.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-ORGANIZATION-REPOSITORIES)
        - id: STEP-REQ-2.1.1-01-02
          Then: After the visitor clicks the exact organization link `Acme Demo` and clicks “Repositories” again,
            the exact link `acme-docs` remains visible.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-ORGANIZATION-REPOSITORIES)
      - id: SCN-REQ-2.1.1-02
        name: 'REQ-2.1.1: Browse Organization Repositories - Scenario 2'
        steps:
        - id: STEP-REQ-2.1.1-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the organization `Acme Demo` with public repository `acme-docs` and private repository
            `secret-research`. The organization overview exposes a visible link named “Repositories”.
          When: The visitor opens the visible organization `Acme Demo`, clicks the “Repositories” link, and enters
            `secret-research` in the visibly labeled textbox “Find a repository”.
          Then: The exact link named `secret-research` is not visible in the organization repository results.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-ORGANIZATION-REPOSITORIES)
      children: []
    - id: REQ-2.1.2
      name: Create an Organization After Authentication
      description:
        text: |-
          The authenticated account menu exposes a visible “Your organizations” link, whose page exposes a visible “New organization” link. The organization creation page displays visibly labeled “Organization name” and “Display name” fields and a button named “Create organization”. A signed-in verified account can submit a unique organization identifier and display name; successful creation opens the new organization overview and persists it across reload. Organization identifiers must be 1–39 lowercase ASCII characters and globally unique. The display name must contain 1–100 non-whitespace characters after trimming. A duplicate identifier displays “Organization name already exists” without opening the existing organization. An invalid identifier displays “Organization name format is invalid”, and a whitespace-only display name displays “Display name is required”; rejected submissions do not create an organization.

          Signed-in users enter the organization list through “Your organizations” in the account menu and can create or open an organization; visitors can only view public repositories through public organization pages.

          The organization overview provides Repositories, People, and Teams entries.

          The organization overview page uses the organization name as a heading; its “Repositories”, “People”, and “Teams” navigation entries have link roles even when visually styled as tabs.

          The Repositories tab lists repositories owned by the organization, the People tab lists members and their Member/Owner roles, and the Teams tab lists teams.

          After successful creation, the system stores the organization object and the creating account's Owner membership relationship, and the user enters the new organization overview page; subsequent team, member, and organization-repository authorization is scoped by this organization identifier.

          The organization identifier is globally unique, contains 1–39 lowercase ASCII letters, digits or single hyphens, and does not begin or end with a hyphen. The display name contains 1–100 non-empty characters after trimming whitespace.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
      - id: SCN-REQ-2.1.2-01
        name: 'REQ-2.1.2: Create an Organization After Authentication - Scenario 1'
        steps:
        - id: STEP-REQ-2.1.2-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!`; the account can create organizations.
          When: The visitor signs in as `org-owner`, opens the “Account menu”, clicks “Your organizations”, clicks
            “New organization”, enters `mobile-guild` in the visibly labeled “Organization name” field, enters `Mobile
            Guild` in “Display name”, and clicks “Create organization”.
          Then: The system opens an organization overview whose heading visibly contains `mobile-guild`.
          references:
          - \ref[requirement](REQ-1.1.2)
        - id: STEP-REQ-2.1.2-01-02
          Then: After the visitor reloads the page, the heading containing `mobile-guild` remains visible.
          references:
          - \ref[requirement](REQ-1.1.2)
      - id: SCN-REQ-2.1.2-02
        name: 'REQ-2.1.2: Create an Organization After Authentication - Scenario 2'
        steps:
        - id: STEP-REQ-2.1.2-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!`; the account can create organizations. Organization identifier `acme-demo` already
            exists with display name `Acme Demo`.
          When: The visitor signs in as `org-owner`, opens the “Account menu”, clicks “Your organizations”, clicks
            “New organization”, enters the existing identifier `acme-demo` in the visibly labeled “Organization
            name” field, leaves the display name empty, and clicks “Create organization”.
          Then: The page displays the exact message “Organization name already exists” and does not display an organization
            heading for the attempted existing organization creation.
          references:
          - \ref[requirement](REQ-1.1.2)
      - id: SCN-REQ-2.1.2-03
        name: 'REQ-2.1.2: Create an Organization After Authentication - Scenario 3'
        steps:
        - id: STEP-REQ-2.1.2-03-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!`; the account can create organizations.
          When: The visitor signs in as `org-owner`, opens the “Account menu”, clicks “Your organizations”, clicks
            “New organization”, enters `-invalid-organization` in the visibly labeled “Organization name” field,
            enters three spaces in “Display name”, and clicks “Create organization”.
          Then: The page displays both exact messages “Organization name format is invalid” and “Display name is
            required”, and no organization is created.
          references:
          - \ref[requirement](REQ-1.1.2)
      children: []
  - id: REQ-2.2
    name: Team and Member Management
    description:
      text: On the current organization's member- and team-management pages, users create teams, maintain team hierarchy
        and membership relationships, and directly add or remove organization members. A team name contains 1–50
        lowercase ASCII letters, digits, or hyphens, may not begin or end with a hyphen, and must be unique within
        the same organization; a team must belong to an organization, and a parent team must belong to the same
        organization and may not create a direct or indirect cycle. Organization membership and team membership
        are independent persisted relationships; team hierarchy is used only for display and management and does
        not implicitly add members of a parent or child team to the other team. On the People page, an Owner enters
        the username or verified email of an existing account and confirms, after which the system immediately saves
        that account's Member or Owner membership relationship; there is no invitation, Pending, or acceptance step.
        When removing a member, the system atomically deletes that organization-membership relationship, all of
        that account's team memberships in the organization, and all direct grants to that account on repositories
        of the organization; team grants themselves are not deleted. If removal would leave the organization with
        no Owner, the system rejects the operation and keeps all relationships unchanged; the person's account,
        personal repositories, and relationships with other organizations must not be deleted. This feature builds
        on the persisted objects, opened pages, or authenticated-session context provided by REQ-2.1.2 (Create an
        Organization After Authentication); it must reuse that context and keep pages and data consistent after
        the context changes.
    scenarios: []
    children:
    - id: REQ-2.2.1
      name: Create an Organization Team
      description:
        text: |-
          The organization overview exposes a visible “Teams” link. The Teams page exposes a visible “New team” link, which opens a form with a visibly labeled “Team name” field and a “Create team” button. An organization Owner can submit a unique team name containing 1–50 lowercase ASCII letters, digits, or hyphens, with no leading or trailing hyphen. A successful submission opens the new team overview and the team heading remains visible after reload. A malformed team name displays “Team name is invalid” and does not create a team.

          Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository.

          Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository.

          All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

          A team name contains 1–50 lowercase ASCII letters, digits, or hyphens, may not begin or end with a hyphen, and must be unique within the same organization; a team must belong to an organization, and a parent team must belong to the same organization and may not create a direct or indirect cycle.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
      - id: SCN-REQ-2.2.1-01
        name: 'REQ-2.2.1: Create an Organization Team - Scenario 1'
        steps:
        - id: STEP-REQ-2.2.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!`; the account is Owner of the existing organization `Acme Demo`. The team name
            `mobile-team` is not yet used in that organization.
          When: The visitor signs in as `org-owner`, opens “Account menu”, clicks “Your organizations”, opens the
            organization `Acme Demo`, clicks “Teams”, clicks “New team”, enters `mobile-team` in the visibly labeled
            “Team name” field, and clicks “Create team”.
          Then: The system opens a team overview whose heading visibly contains `mobile-team`.
          references:
          - \ref[requirement](REQ-2.1.1)
        - id: STEP-REQ-2.2.1-01-02
          Then: After the visitor reloads the page, the heading containing `mobile-team` remains visible.
          references:
          - \ref[requirement](REQ-2.1.1)
      - id: SCN-REQ-2.2.1-02
        name: 'REQ-2.2.1: Create an Organization Team - Scenario 2'
        steps:
        - id: STEP-REQ-2.2.1-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!`; the account is Owner of the existing organization `Acme Demo`.
          When: The visitor signs in as `org-owner`, opens “Account menu”, clicks “Your organizations”, opens the
            organization `Acme Demo`, clicks “Teams”, clicks “New team”, enters `-invalid-team` in the visibly labeled
            “Team name” field, and clicks “Create team”.
          Then: The page displays the exact message “Team name is invalid”.
          references:
          - \ref[requirement](REQ-2.1.1)
      children: []
    - id: REQ-2.2.2
      name: Manage Organization Team Members and Hierarchy
      description:
        text: |-
          An organization Owner can open a team in the organization’s “Teams” page. The team page exposes “Members” and “Settings”. On Members, “Add member” opens a visibly labeled “Username” textbox and an “Add member” button; after a valid organization member is added, the member appears in the list with a “Remove <username>” button. Removing the member updates the list immediately and remains effective after reload. On Settings, “Parent team” is a combobox and “Save” persists a parent-team change. A change that would make a team its own ancestor is rejected with “Cyclic team hierarchy is not allowed”, and the previously saved parent remains selected after reload.

          Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository.

          Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository.

          All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

          A team name contains 1–50 lowercase ASCII letters, digits, or hyphens, may not begin or end with a hyphen, and must be unique within the same organization; a team must belong to an organization, and a parent team must belong to the same organization and may not create a direct or indirect cycle.

          Organization membership and team membership are independent persisted relationships; team hierarchy is used only for display and management and does not implicitly add members of a parent or child team to the other team.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
      - id: SCN-REQ-2.2.2-01
        name: 'REQ-2.2.2: Manage Organization Team Members and Hierarchy - Scenario 1'
        steps:
        - id: STEP-REQ-2.2.2-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions `team-maintainer` with email `team-maintainer@example.test` and password `Valid-password-123!`;
            this account is an organization Owner authorized to manage `frontend-team` in `Acme Demo`. The registered
            organization member `bob-reviewer` (email `bob-reviewer@example.test`) is not currently a member of
            `frontend-team`.
          When: The visitor signs in as `team-maintainer`, opens “Account menu”, clicks “Your organizations”, opens
            `Acme Demo`, clicks “Teams”, opens the team `frontend-team`, and clicks “Members”. The visitor clicks
            “Add member”, enters `bob-reviewer` in the visibly labeled “Username” textbox, and clicks the “Add member”
            button. The visitor then clicks “Remove bob-reviewer”.
          Then: After adding, `bob-reviewer` is visible in the member list; after removal, `bob-reviewer` is not
            visible.
          references:
          - \ref[requirement](REQ-2.1.1)
        - id: STEP-REQ-2.2.2-01-02
          Then: After reloading the Members page, `bob-reviewer` remains absent.
          references:
          - \ref[requirement](REQ-2.1.1)
      - id: SCN-REQ-2.2.2-02
        name: 'REQ-2.2.2: Manage Organization Team Members and Hierarchy - Scenario 2'
        steps:
        - id: STEP-REQ-2.2.2-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions `team-maintainer` with email `team-maintainer@example.test` and password `Valid-password-123!`;
            this account is an organization Owner authorized to manage `frontend-team` in `Acme Demo`. `frontend-team`
            has saved parent value `platform-team`, and its descendant team `frontend-child` is available as a selectable
            team option.
          When: The visitor signs in as `team-maintainer`, opens “Account menu”, clicks “Your organizations”, opens
            `Acme Demo`, clicks “Teams”, opens the team `frontend-team`, and clicks “Settings”. The visitor selects
            `frontend-child` in the combobox named “Parent team” and clicks “Save”.
          Then: The page displays the exact message “Cyclic team hierarchy is not allowed”.
          references:
          - \ref[requirement](REQ-2.1.1)
        - id: STEP-REQ-2.2.2-02-02
          Then: After reloading, the “Parent team” combobox still has value `platform-team`.
          references:
          - \ref[requirement](REQ-2.1.1)
      children: []
    - id: REQ-2.2.3
      name: Directly Add a User as an Organization Member
      description:
        text: |-
          An organization Owner can open the organization’s “People” page and click “Add member”. The form displays a visibly labeled “Username or email” field, a “Role” combobox with a “Member” option, and an “Add member” button. Adding a registered non-member directly creates the organization membership with Member role, displays the account in People without a pending-invitation state, and persists after reload. After the member signs in, the organization appears in “Your organizations”, but membership alone does not grant access to an otherwise unauthorized private repository. Adding an existing member displays “Account is already a member” without duplicating the relationship; an unknown username displays “Account not found”.

          Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository.

          Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository.

          All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

          On the People page, an Owner enters the username or verified email of an existing account and confirms, after which the system immediately saves that account's Member or Owner membership relationship; there is no invitation, Pending, or acceptance step.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
      - id: SCN-REQ-2.2.3-01
        name: 'REQ-2.2.3: Directly Add a User as an Organization Member - Scenario 1'
        steps:
        - id: STEP-REQ-2.2.3-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the Owner account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!` for organization `Acme Demo`. The registered account `new-member` with email `new-member@example.test`
            is not currently an organization member. The organization has an ungranted private repository `secret-research`.
          When: The visitor signs in as `org-owner`, opens “Account menu”, clicks “Your organizations”, opens `Acme
            Demo`, and clicks “People”. The visitor clicks “Add member”, enters `new-member` in “Username or email”,
            selects “Member” in the “Role” combobox, and clicks the “Add member” button.
          Then: The People page displays `new-member` with the “Member” role and no “Pending invitation” text. After
            reloading, `new-member` remains visible.
          references:
          - \ref[requirement](REQ-2.1.1)
        - id: STEP-REQ-2.2.3-01-02
          Then: In a separate browser session, `new-member` can sign in with email `new-member@example.test` and
            password `Valid-password-123!`, sees `Acme Demo` in “Your organizations”, and receives “Access denied”
            when opening the organization’s ungranted private repository.
          references:
          - \ref[requirement](REQ-2.1.1)
      - id: SCN-REQ-2.2.3-02
        name: 'REQ-2.2.3: Directly Add a User as an Organization Member - Scenario 2'
        steps:
        - id: STEP-REQ-2.2.3-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the Owner account `org-owner` with email `org-owner@example.test` and password
            `Valid-password-123!` for organization `Acme Demo`. The account `existing-member` with email `existing-member@example.test`
            is already a member, while the username `unknown-reviewer` does not belong to any account.
          When: The visitor signs in as `org-owner`, opens “Account menu”, clicks “Your organizations”, opens `Acme
            Demo`, and clicks “People”. The visitor clicks “Add member”, enters `existing-member`, and clicks the
            “Add member” button. The visitor then enters `unknown-reviewer` in the same field and clicks “Add member”
            again.
          Then: The first submission displays the exact message “Account is already a member”, and the second submission
            displays “Account not found”.
          references:
          - \ref[requirement](REQ-2.1.1)
        - id: STEP-REQ-2.2.3-02-02
          Then: The People page contains exactly one visible occurrence of `existing-member`; neither rejected submission
            creates a duplicate membership.
          references:
          - \ref[requirement](REQ-2.1.1)
      children: []
    - id: REQ-2.2.4
      name: Remove a Member from an Organization
      description:
        text: |-
          The organization overview exposes a “People” link listing member usernames. For an Owner, a member row exposes a button named “Member menu <username>”; the menu contains “Remove from organization”, followed by a confirmation button named “Remove”. Confirmed removal removes the member from People immediately and after reload. A non-Owner can view the member but has no “Member menu <username>” button and no “Remove from organization” menu item.

          Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository.

          Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository.

          All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

          When removing a member, the system atomically deletes that organization-membership relationship, all of that account's team memberships in the organization, and all direct grants to that account on repositories of the organization; team grants themselves are not deleted.

          If removal would leave the organization with no Owner, the system rejects the operation and keeps all relationships unchanged; the person's account, personal repositories, and relationships with other organizations must not be deleted.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
