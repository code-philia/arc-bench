          reference: reference/github-commit-diff.png
          page: commit_diff
      scenarios:
      - id: SCN-REQ-4.2.2-01
        name: 'REQ-4.2.2: Inspect Commit and Revision Differences - Scenario 1'
        steps:
        - id: STEP-REQ-4.2.2-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` with an accessible commit entry and changed file
            `src/search.ts`; the visitor can open the commit entry without signing in.
          When: The visitor opens the seeded commit entry.
          Then: The commit detail displays `src/search.ts`, a “Changed files” summary, and numeric additions and
