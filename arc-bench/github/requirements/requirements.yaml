  - id: REQ-3.2
    name: Repository Creation and Distribution
    description:
      text: |-
        The repository-creation page is the form opened by “New repository”, where the user selects an owner, name, visibility, and initialization options. A “fork” is an independent repository copied from a readable source repository — the frontend displays the source link on the fork overview page, and the system stores the source-repository identifier; branches and commits in the fork may evolve independently and never write back to the source repository. A “clone page entry” is a read-only address displayed in the repository Code popover and can be copied to the clipboard; it does not mean this product implements an external Git protocol. Both new repositories and forks must enter a browsable repository overview page. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.

        For new repositories and forks: Created through repository creation and fork UI using the signed-in namespace. New names use runtime uniqueness; rejected submissions create no repository.
    scenarios: []
    children:
    - id: REQ-3.2.1
      name: Create a Repository with Owner, Visibility, and Initialization Options
      description:
        text: |-
          This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. The signed-in workspace provides a “New repository” link. The form labels are “Owner”, “Repository name”, and “Description”; the signed-in user's personal namespace is selected by default, so it is possible to submit without changing the owner. Visibility choices are radio controls “Public” and “Private”; initialization is a checkbox “Add a README file”; submission uses the button “Create repository”. Other defaults must allow duplicate-name and empty-name validation without further input. A successful initialized private repository shows a heading containing the new name, a visible Private marker, and a README file link; the overview persists after reload. The optional description “Repository created by Playwright” is saved when entered. An existing repository in this same default personal namespace is supplied for duplicate validation, which stays on the form and does not open the existing repository heading. On the repository-creation page, a signed-in user selects a personal or organization owner, enters a repository name and description, selects public or private visibility, and chooses whether to create an initial commit with a README. The system verifies that the user may create a repository in that owner's namespace, that the name is unique, and that the options are valid; on success, it stores the repository identifier, owner, visibility, default branch, and creator. If initialization is selected, it must also atomically create the initial branch, README file, and initial commit; failure at any step must leave no partially created repository. On success, the new repository overview page is opened.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-CREATE-REPOSITORY
          reference: reference/github-create-repository.png
          page: repository_creation
      scenarios:
      - id: SCN-REQ-3.2.1-01
        name: 'REQ-3.2.1: Create a Repository with Owner, Visibility, and Initialization Options - Scenario 1'
        steps:
        - id: STEP-REQ-3.2.1-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            pre-provisioned `repo-owner` (`repo-owner@example.test`, password `Valid-password-123!`) owns the personal
            namespace and may create repositories there. The existing repository `acme-docs` is available for duplicate-name
            validation, while the candidate repository name is unused. the creation page from “New repository”;
            the personal namespace is selectable. If an organization namespace is selected, the user has permission
            to create repositories for that organization, and the candidate repository name is unused in the target
            namespace.
          When: 'The user selects the target owner, enters a valid and unique repository name and optional description,
            selects “Private”, checks “Add a README file”, and clicks “Create repository”. Seed values: public repository
            `acme-docs`, private repository `secret-research`.'
          Then: 'The system enters the “owner/repository name” overview page, marked Private; the default branch
            contains a README file, and the commit history contains one initialization commit; the repository also
            appears in the target owner''s repository list. Seed values: public repository `acme-docs`, private
            repository `secret-research`.'
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-REPOSITORY)
        - id: STEP-REQ-3.2.1-01-02
          Then: 'After refreshing the overview page, the owner, visibility, README, and initialization commit remain;
            if the name is empty or duplicated, the user lacks organization-creation permission, or any step fails
            during creation, the system displays the reason and leaves no partially created repository. Seed values:
            public repository `acme-docs`, private repository `secret-research`.'
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-REPOSITORY)
      - id: SCN-REQ-3.2.1-02
        name: 'REQ-3.2.1: Create a Repository with Owner, Visibility, and Initialization Options - Scenario 2'
        steps:
        - id: STEP-REQ-3.2.1-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            pre-provisioned `repo-owner` (`repo-owner@example.test`, password `Valid-password-123!`) owns the personal
            namespace. The repository `acme-docs` already exists in that namespace.
          When: The visitor signs in as `repo-owner`, opens “New repository”, enters the existing repository name
            `acme-docs`, and clicks “Create repository”.
          Then: The page displays the repository-name conflict message and does not display the existing repository
            overview heading.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-REPOSITORY)
      - id: SCN-REQ-3.2.1-03
        name: 'REQ-3.2.1: Create a Repository with Owner, Visibility, and Initialization Options - Scenario 3'
        steps:
        - id: STEP-REQ-3.2.1-03-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            pre-provisioned `repo-owner` (`repo-owner@example.test`, password `Valid-password-123!`) owns the personal
            namespace.
          When: The visitor signs in as `repo-owner`, opens “New repository”, leaves “Repository name” empty, and
            clicks “Create repository”.
          Then: The page displays a repository-name-required validation message.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-CREATE-REPOSITORY)
      children: []
    - id: REQ-3.2.2
      name: Fork a Repository into Another Namespace
      description:
        text: |-
          The source overview has a button “Fork”. The fork form contains a field labeled “Repository name” and button “Create fork”; it defaults to the signed-in user's personal namespace and an allowed visibility, permitting submission after editing only the name. Seed data supplies a readable source, a user allowed to create personal repositories, and an existing fork name in that namespace for the conflict case. Success opens a heading containing the new fork name and visible text “Forked from <source repository name>” with a source link; the heading and source relationship survive reload. On the source repository page, the user clicks “Fork”, selects a target personal or organization namespace, enters an optional new name and visibility, and clicks “Create fork”. The system creates an independent fork, copies the accessible default-branch history, records the source-repository link, and then opens the new fork overview page. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3.3 (View a Public Repository Overview) and REQ-1.1.2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. A signed-in user can fork only when they have Read or higher permission on the source repository and permission to create repositories in the target personal or organization namespace; when the source repository is private, the fork must remain Private, while a public source repository may be forked as Public or Private. The system validates permissions on both ends and stores the new fork's owner, visibility, source-repository identifier, default branch, and copied accessible history; if any check fails, no fork is created.

          The fork conflict seed uses the existing name `acme-docs-fork` in the target
          personal namespace.

          A “fork” is an independent repository copied from a readable source repository — the frontend displays the source link on the fork overview page, and the system stores the source-repository identifier; branches and commits in the fork may evolve independently and never write back to the source repository.

          Both new repositories and forks must enter a browsable repository overview page.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-FORK-REPOSITORY
          reference: reference/github-fork-repository.png
          page: repository_fork
      scenarios:
      - id: SCN-REQ-3.2.2-01
        name: 'REQ-3.2.2: Fork a Repository into Another Namespace - Scenario 1'
        steps:
        - id: STEP-REQ-3.2.2-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `fork-user` (`fork-user@example.test`, password `Valid-password-123!`)
            with permission to read public repository `acme-docs` and create repositories in its personal namespace.
            No fork with the generated test name exists in that namespace.
          When: 'The user clicks “Fork”, selects the target namespace, keeps or enters a valid new repository name
            and optional visibility, then clicks “Create fork”. Seed values: public repository `acme-docs`, private
            repository `secret-research`.'
          Then: 'The system opens the target “owner/fork name” overview page, which displays the source repository
            of the fork; the default branch contains the accessible history and files from the source repository,
            and subsequent commits to the fork do not modify the source repository. Seed values: public repository
            `acme-docs`, private repository `secret-research`.'
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-FORK-REPOSITORY)
        - id: STEP-REQ-3.2.2-01-02
          Then: After refreshing the fork page and target owner's repository list, the fork and source link still
            exist; if the target name conflicts, the user lacks permission in the target namespace, or the source
            repository is inaccessible, no fork is created.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-FORK-REPOSITORY)
      - id: SCN-REQ-3.2.2-02
        name: 'REQ-3.2.2: Fork a Repository into Another Namespace - Scenario 2'
        steps:
        - id: STEP-REQ-3.2.2-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions the verified account `fork-user` (`fork-user@example.test`, password `Valid-password-123!`)
            with permission to read public repository `acme-docs` and create repositories in its personal namespace.
            The personal namespace already contains fork `acme-docs-fork`.
          When: The visitor signs in as `fork-user`, opens public repository `acme-docs`, clicks “Fork”, enters
            the existing fork name `acme-docs-fork`, and clicks “Create fork”.
          Then: The page displays a repository-name conflict message.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-FORK-REPOSITORY)
      children: []
    - id: REQ-3.2.3
      name: Copy a Repository Clone Value
      description:
        text: |-
          On a public repository overview, the “Code” button opens a clone popover with “HTTPS” and “SSH” tabs. Each tab provides a button for copying the selected clone value. With browser clipboard permission, the visitor can copy the selected value, receives brief “Copied” feedback, and continues to see the repository heading. This read-only operation does not modify the repository. The capability builds on the public repository overview provided by REQ-3.3 (View a Public Repository Overview) and is available to a visitor who can view that repository.

          A “clone page entry” is a read-only address displayed in the repository Code popover and can be copied to the clipboard; it does not mean this product implements an external Git protocol.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-CODE-CLONE-MENU
          reference: reference/github-code-clone-menu.png
          page: repository_code
      scenarios:
      - id: SCN-REQ-3.2.3-01
        name: 'REQ-3.2.3: Copy a Repository Clone Value - Scenario 1'
        steps:
        - id: STEP-REQ-3.2.3-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` in organization `Acme Demo`; the visitor can open
            its overview without signing in. The browser grants clipboard read and write permission.
          When: The visitor clicks “Code”, selects the “HTTPS” tab, and clicks the button for copying the selected
            clone value.
          Then: The page displays brief “Copied” feedback for the selected protocol and keeps the `acme-docs` repository
            heading visible.
          references:
          - \ref[requirement](REQ-1.1.2)
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-CODE-CLONE-MENU)
      - id: SCN-REQ-3.2.3-02
        name: 'REQ-3.2.3: Copy a Repository Clone Value - Scenario 2'
        steps:
        - id: STEP-REQ-3.2.3-02-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` in organization `Acme Demo`; the visitor can open
            its overview without signing in. The browser grants clipboard read and write permission.
          When: The visitor clicks “Code”, selects the “SSH” tab, and clicks the button for copying the selected
            clone value.
          Then: The page displays brief “Copied” feedback for the selected protocol and keeps the `acme-docs` repository
            heading visible.
          references:
