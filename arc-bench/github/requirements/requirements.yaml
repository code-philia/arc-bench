        - \ref[requirement](REQ-1.1.2)
    children: []
- id: REQ-3
  name: Repository Asset Management
  description:
    text: |-
      A repository is a container for code, branches, commits, files, and collaborative work items. The repository overview page is titled “owner/repository name”, displays the owner, name, Public/Private marker, description, and default branch, and provides Code, Issues, Pull requests, and Settings entries; the “owner” is an individual account or organization, and a repository belonging to an organization is an organization repository. Users open a repository overview from global search results, a personal/organization Repositories list, or a direct link; signed-in users with creation permission create a personal or organization repository from “New repository”. Public repositories allow visitor Read access; private personal repositories allow access only to their owner and explicitly authorized subjects; private organization repositories allow access only to organization Owners, members with direct repository roles, or direct members of teams with repository roles, and ordinary organization Members do not automatically gain access merely through membership. After visibility or access grants change, search, lists, direct links, and repository pages must all use the same access rule.

      For existing repositories: Repositories opened or searched without first being created. Ownership and organization relationships are included only where the tests establish them. Same-name variants retain distinct namespace or visibility contexts; they do not require extra simultaneous global records or combine their attributes.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Search for and Locate Repositories
    description:
      text: |-
        The top global search control has searchbox role and accessible name “Search”; entering a repository name and pressing Enter displays repository results directly, without requiring an additional type-filter click. Each repository result has a link whose accessible name is exactly its repository name, while the result also displays its owner/name metadata. Clicking it opens a heading containing the repository name; reloading preserves that overview. A query with no matching repository displays “No results”, including when the visitor returns home and repeats the same query. Seed data provides a named public repository and a private repository inaccessible to visitors; searching the private name exposes no result link for it. Visitors or signed-in users can search repositories they are authorized to view. The system accepts a search query, applies repository-oriented filters or scope constraints, and displays matching repositories with sufficient metadata for the user to open the target repository.

        The repository overview page is titled “owner/repository name”, displays the owner, name, Public/Private marker, description, and default branch, and provides Code, Issues, Pull requests, and Settings entries; the “owner” is an individual account or organization, and a repository belonging to an organization is an organization repository.

        Public repositories allow visitor Read access; private personal repositories allow access only to their owner and explicitly authorized subjects; private organization repositories allow access only to organization Owners, members with direct repository roles, or direct members of teams with repository roles, and ordinary organization Members do not automatically gain access merely through membership.

        After visibility or access grants change, search, lists, direct links, and repository pages must all use the same access rule.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      image:
      - id: IMG-GITHUB-REPOSITORY-SEARCH-RESULTS
        reference: reference/github-repository-search-results.png
        page: repository_search
    scenarios:
    - id: SCN-REQ-3.1-01
      name: 'REQ-3.1: Search for and Locate Repositories - Scenario 1'
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The system
          pre-provisions public repository `acme-docs` in organization `Acme Demo` and private repository `secret-research`
          in the same organization. The visitor is not authenticated.
        When: The visitor fills the top searchbox named “Search” with `acme-docs` and presses Enter, then clicks
          the exact result link named `acme-docs`.
        Then: The repository overview displays a visible heading containing `acme-docs`.
        references:
        - \ref[image](IMG-GITHUB-REPOSITORY-SEARCH-RESULTS)
    - id: SCN-REQ-3.1-02
      name: 'REQ-3.1: Search for and Locate Repositories - Scenario 2'
      steps:
      - id: STEP-REQ-3.1-02-01
        Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The system
          pre-provisions public repository `acme-docs` in organization `Acme Demo` and private repository `secret-research`
          in the same organization. The visitor is not authenticated.
        When: The visitor fills the top searchbox named “Search” with `secret-research` and presses Enter.
