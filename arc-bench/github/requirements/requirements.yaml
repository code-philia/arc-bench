          references:
          - \ref[requirement](REQ-3.3)
          - \ref[image](IMG-GITHUB-ISSUES-LIST)
      children: []
    - id: REQ-5.1.2
      name: View an Issue and Its Discussion
      description:
        text: |-
          The issue detail page is the read view for one uniquely numbered work item within a repository. Its heading exposes the complete issue title without the issue number, and the page displays the current Open or Closed status, the complete saved description, and discussion or activity content. Repository-view permission is sufficient to read this saved data; editable controls are available only to roles authorized for the corresponding operation. The seeded public repository `acme-docs` contains the Open issue `Improve onboarding` with description `Describe the onboarding improvement.` and discussion or activity text. Opening the issue from a visible issue entry, reloading its detail page, or reopening it from the application home page preserves the same title, description, and status.

          At the top of the detail page are the title and status; the right side displays Assignees, Labels, and Milestone metadata in order; the main area displays the description, comments, and activity timeline.

          The “activity timeline” is an append-only history that records creation, edits, comments, assignment, labels, milestone, and status changes in chronological order.

          A label is a pre-existing colored classification name in the current repository; a milestone is a pre-existing goal-classification item in the current repository that may be associated with multiple issues or PRs but does not change their content or status.

          Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read.

          Named controls below are unique on the active page unless a narrower scope is stated; detail pages and reloads must work independently of earlier list navigation.

          Repository viewers may read issue lists and details. Read permission alone does not authorize issue mutations.

          The issue detail page is the complete read view of one issue: it displays the issue number, title, status, saved description, metadata such as assignees, labels, and milestone, and discussion or activity records.

          Users with repository-view permission may read this information; editing and other mutation controls are governed by the corresponding role requirements.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-ISSUES-LIST
          reference: reference/github-issues-list.png
          page: issues
      scenarios:
      - id: SCN-REQ-5.1.2-01
        name: 'REQ-5.1.2: View an Issue and Its Discussion - Scenario 1'
        steps:
        - id: STEP-REQ-5.1.2-01-01
          Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The
            system pre-provisions public repository `acme-docs` with Open issue `Improve onboarding` and description
            `Describe the onboarding improvement.`; the visitor can open the issue without signing in.
          When: The visitor opens the visible `Improve onboarding` issue entry.
          Then: The issue detail displays the exact `Improve onboarding` heading, the exact description `Describe
            the onboarding improvement.`, an exact `Open` status, and visible Comment or Activity content.
          references:
          - \ref[requirement](REQ-5.1.1)
          - \ref[image](IMG-GITHUB-ISSUES-LIST)
      - id: SCN-REQ-5.1.2-02
        name: 'REQ-5.1.2: View an Issue and Its Discussion - Scenario 2'
        steps:
        - id: STEP-REQ-5.1.2-02-01
          Given: The system pre-provisions public repository `acme-docs` with Open issue `Improve onboarding` and
            description `Describe the onboarding improvement.`. The visitor starts from the application home page
            in a fresh unauthenticated browser session and can open the issue without signing in.
          When: The visitor opens the `Improve onboarding` issue entry and reloads the issue detail page.
          Then: After reload, the exact `Improve onboarding` heading and exact description `Describe the onboarding
            improvement.` remain visible.
          references:
          - \ref[requirement](REQ-5.1.1)
          - \ref[image](IMG-GITHUB-ISSUES-LIST)
      - id: SCN-REQ-5.1.2-03
        name: 'REQ-5.1.2: View an Issue and Its Discussion - Scenario 3'
        steps:
        - id: STEP-REQ-5.1.2-03-01
          Given: The system pre-provisions public repository `acme-docs` with Open issue `Improve onboarding`. The
            visitor starts from the application home page in a fresh unauthenticated browser session and can open
            the issue without signing in.
          When: The visitor opens the `Improve onboarding` issue entry, returns to the application home page, and
            opens the same issue entry again.
          Then: The reopened issue detail displays the exact `Improve onboarding` heading and an exact `Open` status.
          references:
          - \ref[requirement](REQ-5.1.1)
          - \ref[image](IMG-GITHUB-ISSUES-LIST)
      children: []
  - id: REQ-5.2
    name: Issue Creation and Discussion
    description:
      text: Supports creating issues in the current repository, editing titles and descriptions, and appending discussion
        comments. An issue title contains 1-256 non-empty characters after trimming leading and trailing whitespace;
        the description may be empty and is at most 65536 characters; a comment contains 1-65536 non-empty characters
        after trimming leading and trailing whitespace. A successful creation receives a unique repository-scoped
        number and Open status; editing changes only the selected field of the target issue; comments are appended
        as independent discussion records with their author and timestamp. Required-field validation and persistence
        failures must leave the affected issue or discussion unchanged. Each scenario supplies its own authenticated
        account and issue context, so it does not require a previous scenario to run.
    scenarios: []
    children:
    - id: REQ-5.2.1
      name: Create a Repository Issue
      description:
        text: |-
          A signed-in user with issue-write permission opens the current repository's
          Issues page and follows the `New issue` link. The form has fields labeled
          `Title` and `Description` and a `Submit new issue` button. A valid submission
          stores the repository, title, optional description, author, creation time, and
          Open status, assigns a unique repository-scoped number, and opens the new issue
          detail page. The exact entered title is used as the detail heading and issue-list
          link, and the exact description is visible. A title containing only whitespace
          is rejected with a title-required message and creates no issue.

          Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read.

          Named controls below are unique on the active page unless a narrower scope is stated; detail pages and reloads must work independently of earlier list navigation.

          Write, Maintain and Admin may create issues, edit issue titles/descriptions and comment. Organization Owners act as Admin. These role names do not grant metadata or status operations through an implicit cumulative permission ladder.

          The “activity timeline” is an append-only history that records creation, edits, comments, assignment, labels, milestone, and status changes in chronological order.

          Required-field validation and persistence failures must leave the affected issue or discussion unchanged.

          Each scenario supplies its own authenticated account and issue context, so it does not require a previous scenario to run.

          Issue titles contain 1–256 non-empty characters after trimming whitespace. The description may be empty and is at most 65536 characters. A new issue receives a unique number within its repository and starts Open; editing changes only the selected issue fields.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
        image:
        - id: IMG-GITHUB-NEW-ISSUE
