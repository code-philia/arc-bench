    - id: REQ-4.2.2
      name: Inspect Commit and Revision Differences
      description:
        text: |-
          This feature builds on the read-only history context provided by REQ-4.2.1 (View Repository Commit History). A user with repository-view permission can inspect the difference represented by a readable commit and its parent revision. The comparison is read-only: it displays changed files and numeric additions and deletions without creating a review, comment, commit, or branch change. Seed data provides an accessible commit entry in public repository `acme-docs` and changed file `src/search.ts`; opening that entry displays the changed-file path, a “Changed files” summary, and numeric additions and deletions.

          The pre-existing commit opened in this scenario is named Document search flow in repository acme-docs, authored by alice-dev, and includes the changed file src/search.ts. It is the same commit exposed by the commit-history requirement, not a separate generated commit.

          Every file, commit, comparison, and branch page displays the repository and current branch or revision.

          Seed data for read-only scenarios consists of public repositories and directly openable repository, file, and commit pages; visitors need not sign in to browse files, history, diffs, code search, or existing branches.

          Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

          All three are read-only views that do not create commits or modify files or branches and follow repository visibility and access permissions.

          Diff compares two commits or revisions line by line; base is the earlier or target revision, and compare is the newer or proposed revision.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
