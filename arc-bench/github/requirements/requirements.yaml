- id: REQ-4
  name: Code and Version Control
  description:
    text: |-
      The Code page is the main page for browsing code in a repository — the top of the page displays the current branch selector, the main area displays files and directories at the current path on the current branch, clicking a file opens a read-only file page, and clicking Commits opens commit history. A file is content at a path on a branch; a directory is only a path hierarchy used for organization and is not an independent collaboration object. A branch is a named reference pointing to a commit, and switching branches only changes the file snapshot read by the current page. A commit is an immutable change record that stores the parent commit, author, message, time, and changed files; users with Write, Maintain, Admin, or organization Owner permission can create new commits from a file page through Edit or Add file. Every file, commit, comparison, and branch page displays the repository and current branch or revision. Editing a file must create a new commit and must not rewrite historical content. Seed data for read-only scenarios consists of public repositories and directly openable repository, file, and commit pages; visitors need not sign in to browse files, history, diffs, code search, or existing branches. Write scenarios provide separate existing contributor accounts with Write or higher permission on their target repositories and an unprotected writable branch; default-branch scenarios provide an Admin and a separate readable non-Admin account. These accounts sign in through the home-page “Sign in” link, the “Username or email” and “Password” fields, and the “Sign in” button; the signed-in username is visible before opening the target repository entry. Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

      For existing branches, files, commits and comparison data: Existing code resources used before any create or update action. Unspecified file contents, revisions and parent repositories are not invented.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Browse Repository Files and Directories
    description:
      text: |-
        This feature builds on the public repository overview provided by REQ-3.3 (View a Public Repository Overview). A visitor with repository-view permission can use the Code page to browse the selected branch's directory hierarchy and open files without changing repository data. Directory and file entries are links with their exact accessible names; a directory identifies the current path and a file page displays the stored file name, path, branch context, and readable content. Seed data provides public repository `acme-docs`, directory `src`, text file `README.md`, and expected content `Document search flow`. Opening the directory and then the file displays that content, and reloading the file page preserves the same read-only content.

        The Code page is the main page for browsing code in a repository — the top of the page displays the current branch selector, the main area displays files and directories at the current path on the current branch, clicking a file opens a read-only file page, and clicking Commits opens commit history.

        A file is content at a path on a branch; a directory is only a path hierarchy used for organization and is not an independent collaboration object.

        Every file, commit, comparison, and branch page displays the repository and current branch or revision.

        Seed data for read-only scenarios consists of public repositories and directly openable repository, file, and commit pages; visitors need not sign in to browse files, history, diffs, code search, or existing branches.

        Unless a narrower scope is explicitly given below, each named control is unique on the active page, and field and option names refer to accessible names.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      image:
      - id: IMG-GITHUB-CODE-FILE-BROWSER
        reference: reference/github-code-file-browser.png
        page: repository_code
    scenarios:
    - id: SCN-REQ-4.1-01
      name: 'REQ-4.1: Browse Repository Files and Directories - Scenario 1'
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The system
          pre-provisions public repository `acme-docs` with directory `src` containing text file `README.md`; the
          visitor can open its Code page without signing in.
        When: The visitor clicks the `src` directory link and then clicks the `README.md` file link.
        Then: The file page displays the seeded `README.md` content `Document search flow`.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-GITHUB-CODE-FILE-BROWSER)
      - id: STEP-REQ-4.1-01-02
        Then: After the visitor reloads the file page, the content `Document search flow` remains visible.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-GITHUB-CODE-FILE-BROWSER)
    children: []
  - id: REQ-4.2
    name: Commit History and Code Search
    description:
      text: The “commit history” page displays commit records for a branch or file path in reverse chronological
        order; the “diff” page compares the file contents of two commits or revisions line by line, where base is
        the earlier or target revision and compare is the newer or to-be-compared revision; the “code search” page
        searches for keywords only within readable file content in the current repository. All three are read-only
        views that do not create commits or modify files or branches and follow repository visibility and access
        permissions. This feature builds on the persisted objects, opened pages, or authenticated-session context
        provided by REQ-4.1 (Browse Repository Files and Directories); it must reuse that context and keep pages
        and data consistent after the context changes.
