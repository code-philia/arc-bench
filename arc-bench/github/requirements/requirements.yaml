            `Valid-password-123!` for organization `Acme Demo`. The member `existing-member` with email `existing-member@example.test`
            is present in the organization People list.
          When: The visitor signs in as `org-owner`, opens “Account menu”, clicks “Your organizations”, opens `Acme
            Demo`, and clicks “People”. The visitor verifies `existing-member` is visible, clicks “Member menu existing-member”,
            clicks “Remove from organization”, and clicks “Remove” in the confirmation dialog.
          Then: The People page no longer displays `existing-member`.
          references:
