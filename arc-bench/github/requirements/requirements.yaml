          status onboarding PR` targeting `main`, and Admin account `protection-admin` (`protection-admin@example.test`,
          `Valid-password-123!`). Its Checks area contains `test` with pending status.
        When: The Admin signs in, opens the PR, selects `success` in the `test` status combobox, and clicks Save
