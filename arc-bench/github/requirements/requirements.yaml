  - id: REQ-2.3
    name: Grant Repository Access to People and Teams
    type: ATOMIC
    dependencies:
    - REQ-2.1.2
    - REQ-2.2.1
    pages: []
    description: A repository Admin can open “Settings” and “Manage access”. “Add people
      or teams” opens a picker with a visibly labeled “Search” textbox, selectable team
      options, a “Role” combobox, and an “Add” button. Adding a team with Write access
      displays the exact team name and Write role, and the grant remains visible after
