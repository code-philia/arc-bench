  - id: REQ-2.3
    name: Grant Repository Access to People and Teams
    description:
      text: |-
        A repository Admin can open “Settings” and “Manage access”. “Add people or teams” opens a picker with a visibly labeled “Search” textbox, selectable team options, a “Role” combobox, and an “Add” button. Adding a team with Write access displays the exact team name and Write role, and the grant remains visible after reload. An existing access row exposes a “Role” combobox and “Save” button; changing its role from Write to Read updates the existing record rather than creating a duplicate, and exactly one Read row remains after reload.

        Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository.

        Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository.

        All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.

        Organization membership and team membership are independent persisted relationships; team hierarchy is used only for display and management and does not implicitly add members of a parent or child team to the other team.

        Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
    scenarios:
    - id: SCN-REQ-2.3-01
      name: 'REQ-2.3: Grant Repository Access to People and Teams - Scenario 1'
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The system
          pre-provisions `repo-admin` with email `repo-admin@example.test` and password `Valid-password-123!` and
          Admin permission on repository `acme-docs`. Organization team `frontend-team` exists and initially has
          no direct access grant on `acme-docs`.
        When: The visitor signs in as `repo-admin`, opens repository `acme-docs`, clicks “Settings”, clicks “Manage
          access”, and clicks “Add people or teams”. The visitor enters `frontend-team` in “Search”, selects the
          matching team option, selects “Write” in the “Role” combobox, and clicks “Add”.
        Then: The access list visibly displays the exact team name `frontend-team` and the exact role “Write”.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-1.1.2)
      - id: STEP-REQ-2.3-01-02
        Then: After reloading the Manage access page, `frontend-team` remains visible.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-1.1.2)
    - id: SCN-REQ-2.3-02
      name: 'REQ-2.3: Grant Repository Access to People and Teams - Scenario 2'
      steps:
      - id: STEP-REQ-2.3-02-01
        Given: The visitor starts at the application home page in a fresh unauthenticated browser session. The system
          pre-provisions `repo-admin` with email `repo-admin@example.test` and password `Valid-password-123!` and
          Admin permission on repository `acme-docs`. The separate organization team `access-role-team` already
          has exactly one direct Write access grant on `acme-docs`.
        When: The visitor signs in as `repo-admin`, opens repository `acme-docs`, clicks “Settings”, and clicks
          “Manage access”. In the row whose accessible name contains `access-role-team`, the visitor verifies the
