    - name: 'REQ-2.3: Grant Repository Access to People and Teams - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The system pre-provisions `repo-admin` with email
          `repo-admin@example.test` and password `Valid-password-123!` and Admin permission
          on repository `acme-docs`. The separate organization team `access-role-team`
          already has exactly one direct Write access grant on `acme-docs`.'
      - keyword: WHEN
        content: 'The visitor signs in as `repo-admin`, opens repository `acme-docs`, clicks
          “Settings”, and clicks “Manage access”. In the row whose accessible name contains
          `access-role-team`, the visitor verifies the current role is Write, selects “Read”
