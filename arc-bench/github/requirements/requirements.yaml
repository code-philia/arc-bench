          - \ref[requirement](REQ-1.1.2)
          - \ref[image](IMG-GITHUB-NEW-ISSUE)
      children: []
    - id: REQ-5.2.2
      name: Edit an Issue Title and Description
      description:
        text: |-
          Only a signed-in user with Write, Maintain, or Admin may use the unique `Edit issue title` and `Edit issue description` buttons. The title form has `Issue title` and `Save issue title`; the description form has `Issue description` and `Save issue description`. Each save updates only its selected field and persists the new value. Empty titles are rejected, the original value is retained, and reload shows the unchanged original title. The separate invalid edit seed is an issue titled `Original issue title`.

          Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read.

          Named controls below are unique on the active page unless a narrower scope is stated; detail pages and reloads must work independently of earlier list navigation.

          Write, Maintain and Admin may create issues, edit issue titles/descriptions and comment. Organization Owners act as Admin. These role names do not grant metadata or status operations through an implicit cumulative permission ladder.

          The “activity timeline” is an append-only history that records creation, edits, comments, assignment, labels, milestone, and status changes in chronological order.

          Required-field validation and persistence failures must leave the affected issue or discussion unchanged.

          Each scenario supplies its own authenticated account and issue context, so it does not require a previous scenario to run.

          Issue titles contain 1–256 non-empty characters after trimming whitespace. The description may be empty and is at most 65536 characters. A new issue receives a unique number within its repository and starts Open; editing changes only the selected issue fields.

          Quoted interface names are exact English accessible names unless this leaf explicitly allows alternatives. Permission eligibility follows the stated operation-specific role list; role names do not imply an extra cumulative permission ladder.
      scenarios:
