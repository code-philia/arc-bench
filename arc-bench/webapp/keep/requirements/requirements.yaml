    items:
      - 'The system contains a pinned note titled "Sprint goals".'
      - 'The system contains a regular note titled "Groceries".'
      - 'The system contains a deletable regular note titled "Delete me 2.3.1".'
      - 'The system contains a deletable regular note titled "Delete me 2.3.2".'
      - 'The system contains a deletable regular note titled "Delete me 2.3.3".'
      - 'The system contains a note titled "Project ideas" with the initial content "Initial editable content".'
      - 'The system contains an active note titled "Travel plans 2.5.1".'
      - 'The system contains an active note titled "Travel plans 2.5.2".'
      - 'The system contains an active note titled "Travel plans 2.5.3".'
      - 'The system contains an active note titled "Travel plans 2.5.4".'
      - 'The system contains a regular note titled "Garden tasks existing".'
