id: ROOT
name: Ctrip Travel System
type: FOLDER
description: 'A one-stop travel service platform that provides booking services for hotels, flights, tour packages, and related travel services. This requirement set focuses on user authentication and account management. Reference: Homepage ![image](./reference/index.jpg)'
dependencies: []
children:
- id: REQ-0
  name: Open System
  type: ATOMIC
  description: Open the application and display the homepage.
  dependencies: []
  scenarios:
  - name: Open System
    steps:
    - keyword: GIVEN
      content: System is accessible.
    - keyword: WHEN
      content: Open the system
    - keyword: THEN
      content: The homepage opens by default.
- id: REQ-1
  name: Ctrip Homepage Navigation and Entry
  type: FOLDER
  description: The system’s default entry. The top navigation bar includes login/registration entry points, a search box, and a flight quick-search form. Reference:Homepage ![image](./reference/index.png)
  dependencies: []
  children:
  - id: REQ-1.1
    name: Open Homepage
    type: ATOMIC
    description: Open the homepage from the application URL.
    dependencies: []
    scenarios:
    - name: Open Homepage
      steps:
      - keyword: GIVEN
        content: User has a browser with network access.
      - keyword: WHEN
        content: Enter the website URL in the browser
      - keyword: THEN
        content: The homepage opens by default.
- id: REQ-2
  name: User Authentication Module
  type: FOLDER
  description: Includes multiple submodules such as account/password login, verification-code login, and the registration flow.
  dependencies:
  - REQ-1
  children:
  - id: REQ-2.1
    name: Open Registration Entry
    type: ATOMIC
    description: Open the registration page from the homepage.
    dependencies:
    - REQ-1.1
    scenarios:
    - name: Open Registration Entry
      steps:
      - keyword: GIVEN
        content: User is on the homepage.
      - keyword: WHEN
        content: Click “注册” in the top-right corner of the homepage
      - keyword: THEN
        content: Navigate to the registration page.
  - id: REQ-2.2
    name: Open Login Entry
    type: ATOMIC
    description: Open the login page from the homepage.
    dependencies:
    - REQ-1.1
    scenarios:
    - name: Open Login Entry
      steps:
      - keyword: GIVEN
        content: User is on the homepage.
      - keyword: WHEN
        content: Click “登录” in the top-right corner of the homepage
      - keyword: THEN
        content: Navigate to the login page.
  - id: REQ-2.3
    name: Login Page Entry and Switching
    type: FOLDER
    description: 'Provide entry points to freely switch between account/password login and SMS verification-code login.

      Reference: Password login ![image](./reference/login1.png)

      Reference: Verification-code login ![image](./reference/login2.png)'
    dependencies: []
    children:
    - id: REQ-2.3.1
      name: Enter Login Page
      type: ATOMIC
      description: Open the account/password login page from the homepage.
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Enter Login Page
        steps:
        - keyword: GIVEN
          content: User is on the homepage.
        - keyword: WHEN
          content: Click the “登录” icon in the top-right corner of the homepage
        - keyword: THEN
          content: Navigate to the account/password login page.
    - id: REQ-2.3.2
      name: Switch to Verification-Code Login
      type: ATOMIC
      description: Switch from account/password login to verification-code login.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: Switch to Verification-Code Login
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Click the “验证码登录” link
        - keyword: THEN
          content: Switch to the verification-code login form.
    - id: REQ-2.3.3
      name: Switch to Password Login
      type: ATOMIC
      description: Switch from verification-code login to account/password login.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: Switch to Password Login
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: Click the “账号登录” link
        - keyword: THEN
          content: Switch to the account/password login form.
  - id: REQ-2.4
    name: Account/Password Login
    type: FOLDER
    description: Users authenticate using a mobile number, username, or email together with a password.
    dependencies:
    - REQ-2.3
    children:
    - id: REQ-2.4.1
      name: Password Login Flow
      type: ATOMIC
      description: Log in with a valid mobile number, username, or email and a password.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: Password Login Flow
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Enter a mainland China mobile number / username / email
        - keyword: WHEN
          content: Enter the login password
        - keyword: WHEN
          content: Check “阅读并同意服务协议和个人信息保护政策”
        - keyword: GIVEN
          content: Account identifier and password have been entered, and the agreement has been accepted.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: After verification, redirect to the homepage and update the status to logged in.
    - id: REQ-2.4.2
      name: 'Exception: Username Missing'
      type: ATOMIC
      description: Reject password login when the account identifier is missing.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: 'Exception: Username Missing'
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Do not enter a username
        - keyword: WHEN
          content: Enter the login password
        - keyword: WHEN
          content: Check “阅读并同意服务协议和个人信息保护政策”
        - keyword: GIVEN
          content: Username is empty.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “请输入用户名”.'
    - id: REQ-2.4.3
      name: 'Exception: Password Missing'
      type: ATOMIC
      description: Reject password login when the password is missing.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: 'Exception: Password Missing'
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Enter a mainland China mobile number / username / email
        - keyword: WHEN
          content: Do not enter the login password
        - keyword: WHEN
          content: Check “阅读并同意服务协议和个人信息保护政策”
        - keyword: GIVEN
          content: Password is empty.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “请输入登录密码”.'
    - id: REQ-2.4.4
      name: 'Exception: Incorrect Username or Password'
      type: ATOMIC
      description: Reject password login when the account identifier or password is incorrect.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: 'Exception: Incorrect Username or Password'
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Enter an incorrect username/password combination
        - keyword: WHEN
          content: Check “阅读并同意服务协议和个人信息保护政策”
        - keyword: GIVEN
          content: Entered credentials are incorrect.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “用户名或密码错误”.'
    - id: REQ-2.4.5
      name: 'Exception: Agreement Not Accepted'
      type: ATOMIC
      description: Reject submission when the required agreement is not accepted.
      dependencies:
      - REQ-2.3.1
      scenarios:
      - name: 'Exception: Agreement Not Accepted'
        steps:
        - keyword: GIVEN
          content: User is on the password login page.
        - keyword: WHEN
          content: Enter a mainland China mobile number / username / email
        - keyword: WHEN
          content: Enter the login password
        - keyword: WHEN
          content: Do not accept the agreement
        - keyword: GIVEN
          content: Agreement is not accepted.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “请先阅读并勾选协议”.'
  - id: REQ-2.5
    name: Verification-Code Login
    type: FOLDER
    description: Log in via an SMS verification code after a six-digit code is sent to the entered mobile number.
    dependencies:
    - REQ-2.3
    children:
    - id: REQ-2.5.1
      name: Verification-Code Login Flow
      type: ATOMIC
      description: Log in with a valid mobile number and verification code.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: Verification-Code Login Flow
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: 'Select the country/region code (default: mainland China +86) and enter the mobile number'
        - keyword: WHEN
          content: Click “发送验证码”
        - keyword: THEN
          content: The system sends an SMS, and the button enters a countdown state.
        - keyword: GIVEN
          content: Verification code has been sent.
        - keyword: WHEN
          content: Enter the 6-digit SMS verification code and accept the agreement
        - keyword: GIVEN
          content: Valid verification code has been entered, and the agreement has been accepted.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: After verification, redirect to the homepage.
    - id: REQ-2.5.2
      name: 'Exception: Mobile Number Missing'
      type: ATOMIC
      description: Reject verification-code login when the mobile number is missing.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: 'Exception: Mobile Number Missing'
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: Do not enter a mobile number
        - keyword: GIVEN
          content: Mobile number is empty.
        - keyword: WHEN
          content: Click “发送验证码” or “登录”
        - keyword: THEN
          content: 'Show a message: “请输入手机号”.'
    - id: REQ-2.5.3
      name: 'Exception: Verification Code Missing'
      type: ATOMIC
      description: Reject verification-code login when the verification code is missing.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: 'Exception: Verification Code Missing'
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: Enter the mobile number and send the verification code
        - keyword: WHEN
          content: Do not enter the verification code
        - keyword: WHEN
          content: Accept the agreement
        - keyword: GIVEN
          content: Verification code is empty.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “请输入验证码”.'
    - id: REQ-2.5.4
      name: 'Exception: Incorrect Verification Code'
      type: ATOMIC
      description: Reject verification-code login when the verification code is incorrect.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: 'Exception: Incorrect Verification Code'
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: Enter the mobile number and send the verification code
        - keyword: WHEN
          content: Enter an incorrect verification code
        - keyword: WHEN
          content: Accept the agreement
        - keyword: GIVEN
          content: Entered verification code is incorrect.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “验证码错误”.'
    - id: REQ-2.5.5
      name: 'Exception: Agreement Not Accepted'
      type: ATOMIC
      description: Reject submission when the required agreement is not accepted.
      dependencies:
      - REQ-2.3.2
      scenarios:
      - name: 'Exception: Agreement Not Accepted'
        steps:
        - keyword: GIVEN
          content: User is on the verification-code login page.
        - keyword: WHEN
          content: Enter the mobile number and send the verification code
        - keyword: WHEN
          content: Enter the correct verification code
        - keyword: WHEN
          content: Do not accept the agreement
        - keyword: GIVEN
          content: Agreement is not accepted.
        - keyword: WHEN
          content: Click the “登录” button
        - keyword: THEN
          content: 'Show a message: “请先阅读并勾选协议”.'
  - id: REQ-2.6
    name: User Registration Flow
    type: FOLDER
    description: Guide new users to complete mobile-number verification and password setup. Users must accept the legal agreements before registration. Includes registration agreement confirmation and mobile-number verification (see sub-requirements).
    dependencies:
    - REQ-2.3
    - REQ-1
    children:
    - id: REQ-2.6.1
      name: Enter Registration Page
      type: ATOMIC
      description: Enter Registration Page
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Enter Registration Page
        steps:
        - keyword: GIVEN
          content: User is on the homepage.
        - keyword: WHEN
          content: Click “注册” in the top-right corner of the homepage
    - id: REQ-2.6.2
      name: Registration Agreement Confirmation
      type: FOLDER
      description: 'Show an agreement modal that requires the user to read it. Reference: ![image](./reference/register1.png)'
      dependencies:
      - REQ-1
      - REQ-2
      children:
      - id: REQ-2.6.2.1
        name: Trigger Registration Agreement
        type: ATOMIC
        description: Trigger Registration Agreement
        dependencies:
        - REQ-2.3.1
        scenarios:
        - name: Trigger Registration Agreement
          steps:
          - keyword: GIVEN
            content: User is on the login page.
          - keyword: WHEN
            content: Click “免费注册”
          - keyword: THEN
            content: A dialog titled “携程用户注册协议和隐私政策” appears.
          - keyword: GIVEN
            content: The registration agreement dialog is visible.
          - keyword: WHEN
            content: Click “同意并继续”
          - keyword: THEN
            content: Enter the mobile-number verification page.
      - id: REQ-2.6.2.2
        name: Decline Registration Agreement
        type: ATOMIC
        description: Decline Registration Agreement
        dependencies:
        - REQ-1.1
        - REQ-2.6.2.1
        scenarios:
        - name: Decline Registration Agreement
          steps:
          - keyword: GIVEN
            content: The registration agreement dialog is visible.
          - keyword: WHEN
            content: Click “不同意”
          - keyword: THEN
            content: Return to the Ctrip homepage.
    - id: REQ-2.6.3
      name: Mobile Number Verification
      type: FOLDER
      description: 'The first step of registration, to verify that the phone number is real. Reference: ![image](./reference/register2.png)'
      dependencies:
      - REQ-2.6.2
      children:
      - id: REQ-2.6.3.1
        name: Enter Verification Information
        type: ATOMIC
        description: Enter Verification Information
        dependencies:
        - REQ-2.6.2.1
        scenarios:
        - name: Enter Verification Information
          steps:
          - keyword: GIVEN
            content: User is on the mobile-number verification page.
          - keyword: WHEN
            content: Enter a valid mobile number and click “发送验证码”
          - keyword: THEN
            content: Receive an SMS verification code.
          - keyword: GIVEN
            content: SMS verification code has been received.
          - keyword: WHEN
            content: Enter the verification code and click “下一步，设置密码”
          - keyword: THEN
            content: 'Move to the second stage of the progress bar: “设置密码”.'
    - id: REQ-2.6.4
      name: Set Password and Complete Registration
      type: FOLDER
      description: 'The second step of registration: set the login password and complete registration.'
      dependencies:
      - REQ-2.6.3
      children:
      - id: REQ-2.6.4.1
        name: Set Password and Complete Registration
        type: ATOMIC
        description: Set Password and Complete Registration
        dependencies:
        - REQ-2.6.3.1
        scenarios:
        - name: Set Password and Complete Registration
          steps:
          - keyword: GIVEN
            content: User is on the set-password step.
          - keyword: WHEN
            content: Enter the login password
          - keyword: WHEN
            content: Re-enter the password to confirm
          - keyword: GIVEN
            content: Password and confirmation password match.
          - keyword: WHEN
            content: Click “完成注册”
          - keyword: THEN
            content: Registration succeeds, show “注册成功”, and navigate to the account/password login page.
      - id: REQ-2.6.4.2
        name: 'Exception: Passwords Do Not Match'
        type: ATOMIC
        description: Exception Passwords Do Not Match
        dependencies:
        - REQ-2.6.3.1
        scenarios:
        - name: 'Exception: Passwords Do Not Match'
          steps:
          - keyword: GIVEN
            content: User is on the set-password step.
          - keyword: WHEN
            content: Enter the login password
          - keyword: WHEN
            content: Enter a different confirmation password
          - keyword: GIVEN
            content: Password and confirmation password do not match.
          - keyword: WHEN
            content: Click “完成注册”
          - keyword: THEN
            content: 'Show a message: “两次输入的密码不一致”.'
      - id: REQ-2.6.4.3
        name: 'Exception: Password Too Weak'
        type: ATOMIC
        description: Exception Password Too Weak
        dependencies:
        - REQ-2.6.3.1
        scenarios:
        - name: 'Exception: Password Too Weak'
          steps:
          - keyword: GIVEN
            content: User is on the set-password step.
          - keyword: WHEN
            content: Enter an overly simple password
          - keyword: GIVEN
            content: Password strength requirements are not met.
          - keyword: WHEN
            content: Click “完成注册”
          - keyword: THEN
            content: 'Show a message: “密码需包含字母和数字，且长度不小于8位”.'
  - id: REQ-2.7
    name: Log Out
    type: FOLDER
    description: 'Log out and remove the current login state from the session.

      Logout entry: ![image](./reference/enter_self.png)'
    children:
    - id: REQ-2.7.1
      name: Log Out
      type: ATOMIC
      description: Log Out
      dependencies: []
      scenarios:
      - name: Log Out
        steps:
        - keyword: GIVEN
          content: User is logged in and is on the homepage.
        - keyword: WHEN
          content: Hover the mouse over “尊敬的...” in the top-right corner of the homepage
        - keyword: WHEN
          content: Click “退出登录”
        - keyword: THEN
          content: Clear the login state; on the homepage, “尊敬的...” changes to the “登录” button.
    dependencies: []
- id: REQ-3
  name: Flight Search Module
  type: FOLDER
  description: Provide search for domestic and international routes. Support multiple trip types, parameter configuration, and result display.
  dependencies:
  - REQ-1
  children:
  - id: REQ-3.1
    name: Homepage Quick Flight Search
    type: FOLDER
    description: 'The homepage shows a quick flight search form by default. Reference: ![image](./reference/search.png)'
    dependencies: []
    children: []
  - id: REQ-3.2
    name: Basic Trip Parameter Configuration
    type: FOLDER
    description: The core search input area, including trip type, origin/destination, dates, and passenger types.
    dependencies: []
    children:
    - id: REQ-3.2.1
      name: Trip Type Selection
      type: ATOMIC
      description: Trip Type Selection
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Trip Type Selection
        steps:
        - keyword: GIVEN
          content: User can see the flight search form on the homepage.
        - keyword: WHEN
          content: Switch the radio button among “单程”, “往返”, and “多程”
        - keyword: THEN
          content: The “出发日期” area dynamically adds or removes the “返回日期” input.
    - id: REQ-3.2.2
      name: Swap Origin and Destination
      type: ATOMIC
      description: Swap Origin and Destination
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Swap Origin and Destination
        steps:
        - keyword: GIVEN
          content: User can see the flight search form on the homepage.
        - keyword: WHEN
          content: Click the “双向箭头” icon between the origin and destination
        - keyword: THEN
          content: The text values of origin and destination are swapped immediately.
    - id: REQ-3.2.3
      name: 'Exception: Same-City Validation'
      type: ATOMIC
      description: Exception Same-City Validation
      dependencies:
      - REQ-1.1
      scenarios:
      - name: 'Exception: Same-City Validation'
        steps:
        - keyword: GIVEN
          content: User can see the flight search form on the homepage.
        - keyword: WHEN
          content: In the destination input, enter the same city as the origin (e.g., 成都)
        - keyword: GIVEN
          content: Origin and destination are the same.
        - keyword: WHEN
          content: Click “搜索”
        - keyword: THEN
          content: 'The system shows a message: “出发城市和到达城市不能相同”, and navigation is blocked.'
    - id: REQ-3.2.4
      name: 'Exception: Past-Date Validation'
      type: ATOMIC
      description: Exception Past-Date Validation
      dependencies:
      - REQ-1.1
      scenarios:
      - name: 'Exception: Past-Date Validation'
        steps:
        - keyword: GIVEN
          content: User can see the date picker in the flight search form.
        - keyword: WHEN
          content: Manually try selecting a date earlier than today
        - keyword: THEN
          content: Past dates are disabled in the calendar and cannot be selected.
    - id: REQ-3.2.5
      name: City Selector
      type: FOLDER
      description: 'Provide a city selection panel for origin and destination. Support hot-city recommendations and pinyin-initial search. Reference: ![image](./reference/city_selection.png)'
      dependencies: []
      children:
      - id: REQ-3.2.5.1
        name: Select a Hot City
        type: ATOMIC
        description: Select a Hot City
        dependencies:
        - REQ-3.2.1
        scenarios:
        - name: Select a Hot City
          steps:
          - keyword: GIVEN
            content: User can see the origin input in the flight search form.
          - keyword: WHEN
            content: Click the origin input field
          - keyword: THEN
            content: The city selection panel pops up, with the “热门” tab shown by default.
          - keyword: GIVEN
            content: The city selection panel is open.
          - keyword: WHEN
            content: Click “成都”
          - keyword: THEN
            content: The origin input is filled with “成都(CTU)”, and the panel closes automatically.
      - id: REQ-3.2.5.2
        name: Find Cities by Pinyin Group
        type: ATOMIC
        description: Find Cities by Pinyin Group
        dependencies:
        - REQ-3.2.1
        scenarios:
        - name: Find Cities by Pinyin Group
          steps:
          - keyword: GIVEN
            content: User can see the destination input in the flight search form.
          - keyword: WHEN
            content: Click the destination input field
          - keyword: THEN
            content: The city selection panel pops up.
          - keyword: GIVEN
            content: The city selection panel is open.
          - keyword: WHEN
            content: Click the “GHIJ” tab
          - keyword: THEN
            content: The list switches to the city section starting with G/H/I/J.
          - keyword: WHEN
            content: Select “广州”
          - keyword: THEN
            content: The destination input is filled with “广州(CAN)”, and the panel closes automatically.
    - id: REQ-3.2.6
      name: Date Picker
      type: FOLDER
      description: Provide a calendar control for users to select departure and return dates. ![image](./reference/date_selection.png)
      dependencies: []
      children:
      - id: REQ-3.2.6.1
        name: Select Departure Date
        type: ATOMIC
        description: Select Departure Date
        dependencies:
        - REQ-3.2.5.1
        scenarios:
        - name: Select Departure Date
          steps:
          - keyword: GIVEN
            content: User can see the departure date input in the flight search form.
          - keyword: WHEN
            content: Click the departure date input field
          - keyword: THEN
            content: The calendar opens, showing the current month and daily flight prices (e.g., ￥460).
          - keyword: GIVEN
            content: The calendar is open.
          - keyword: WHEN
            content: Click a future date (e.g., 2026-01-08)
          - keyword: THEN
            content: The input shows “2026-01-08 明天”, and the calendar closes.
      - id: REQ-3.2.6.2
        name: Select a Past Date
        type: ATOMIC
        description: Select a Past Date
        dependencies: []
        scenarios:
        - name: Select a Past Date
          steps:
          - keyword: GIVEN
            content: User can see the departure date input in the flight search form.
          - keyword: WHEN
            content: Click the departure date input field
          - keyword: GIVEN
            content: The calendar is open.
          - keyword: WHEN
            content: Click a past date
          - keyword: THEN
            content: It cannot be clicked; past dates are disabled.
    - id: REQ-3.2.7
      name: Add Return Trip
      type: FOLDER
      description: In one-way search mode, use the “添加返程” entry to quickly switch to round-trip mode and set a return date. ![image](./reference/date_selection_2.png)
      dependencies:
      - REQ-3.2.6
      children:
      - id: REQ-3.2.7.1
        name: Enable Return Trip
        type: ATOMIC
        description: Enable Return Trip
        dependencies:
        - REQ-3.2.6.1
