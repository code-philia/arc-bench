  - category: Flight Search Seed Data
    items:
      - 'The homepage contains a usable flight quick-search form with one-way, round-trip, multi-city, city, date, passenger-type, and cabin-class controls.'
      - 'The city directory contains Chengdu (CTU), Guangzhou (CAN), Shanghai, and Beijing; the hot-city list includes Chengdu; and the GHIJ pinyin group includes Guangzhou.'
      - 'The date picker displays daily fare information, permits the future dates used by the search scenarios, disables dates earlier than today, and prevents a return date earlier than the departure date.'
      - 'The system contains a reusable search-history item labeled "成都 - 广州" that restores a valid Chengdu-to-Guangzhou search.'
      - 'The Chengdu-to-Guangzhou flight result dataset contains multiple flights with prices, cabin classes, departure times, airlines, nonstop/stopover attributes, on-time rates, baggage information, and refund/change rules.'
      - 'The Chengdu-to-Guangzhou result dataset contains nearby-date and next-week fare data, including a low-price date labeled "¥320", and supports the more-dates calendar view.'
      - 'The Chengdu-to-Guangzhou result dataset contains at least one China Southern nonstop flight and other flights that can be excluded by the combined filter.'
      - 'At least one flight in the result dataset has multiple fare rows, including economy class, and can be expanded, collapsed, and booked.'
      - 'The route from Beihai to the test destination "火星城" has no matching flight results for the no-result search scenario.'
  - category: Booking and Payment Seed Data
    items:
      - 'The standard bookable flight exposes a booking page with Civil Aviation Administration reminders about power banks and baggage, frequent passengers including "张三" and "李四", manual passenger and contact forms, adult fare and tax breakdowns, and a visible order total.'
      - 'The standard booking page contains selectable combo insurance with coverage and claim terms, free baggage allowance, extra baggage options, airport transfer options with estimated prices, and airport lounge services.'
      - 'The standard booking page contains at least one supported payment method such as Alipay, WeChat Pay, or bank-card payment, and supports simulated payment success.'
      - 'The payment-pending flow uses an independent purchasable flight and sufficient inventory so that submitting the booking creates a pending-payment order.'
      - 'The payment-success flow uses a different independent purchasable flight and sufficient inventory so that submitting the booking can be paid successfully.'
  - category: Order Center Seed Data
    items:
      - 'The read-only order-center account has a stable order dataset with an all-orders view, a pending-payment order showing a "去支付" action, a pending-review order or equivalent pending-review state, order dates, order numbers, itineraries, flight numbers, totals, and statuses.'
      - 'The read-only order dataset contains the order number "CTRIP20260721001" for exact order-number search.'
      - 'The read-only order dataset contains an order detail view with flight itinerary information and refund/change rules.'
      - 'The cancellation account has a separate pending-payment order with a countdown, a "取消订单" action, and a state that can transition to closed after confirmation.'
  - category: Personal Center Seed Data
    items:
      - 'The read-only personal-center account exposes the common-information entries for travelers, addresses, contacts, and reimbursement receipts.'
      - 'The read-only traveler dataset contains a record named "李四" and supports name search; searching for a nonexistent name returns an empty result.'
      - 'The single-delete traveler account has at least one removable traveler record.'
      - 'The batch-delete traveler account has at least two removable traveler records.'
      - 'The read-only address dataset contains an address in Shanghai with recipient, region, and detailed address fields.'
      - 'The single-delete address account has at least one removable address.'
      - 'The batch-delete address account has at least two removable addresses.'
      - 'The contact-search account contains a contact named "张三" that can be found by name.'
      - 'The REQ-5.5.1.2 batch-delete account has at least two removable contact records.'
      - 'The single-delete contact account has at least one removable contact record.'
