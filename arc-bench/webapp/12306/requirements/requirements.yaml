                steps:
                  - keyword: GIVEN
                    content: 'The user is not logged in and is on a populated ticket search results page.'
                  - keyword: WHEN
                    content: 'Click one "Book" button.'
                  - keyword: THEN
                    content: 'The page shows the quick login form with the icon "assets/logo-icon.png", the text "Login", the account input, the password input, and the "LOGIN" button.'
          - id: REQ-5.1.2
            name: Open forgot password page from quick login form
            type: ATOMIC
            description: 'Provide a link with the text "Forgot your password" in the quick login form and navigate to the forgot password page after it is clicked.'
            dependencies:
              - REQ-5.1.1
              - REQ-2.4.1
            scenarios:
              - name: Open the forgot password page from the quick login form
                steps:
                  - keyword: GIVEN
                    content: 'The user is viewing the quick login form.'
                  - keyword: WHEN
                    content: 'Click the link "Forgot your password".'
                  - keyword: THEN
                    content: 'Navigate to the forgot password page.'
          - id: REQ-5.1.3
            name: Open registration page from quick login form
            type: ATOMIC
            description: 'Provide a link with the text "No account yet? Register now." in the quick login form and navigate to the registration page after it is clicked.'
            dependencies:
              - REQ-5.1.1
              - REQ-2.1.1
            scenarios:
              - name: Open the registration page from the quick login form
                steps:
                  - keyword: GIVEN
                    content: 'The user is viewing the quick login form.'
                  - keyword: WHEN
                    content: 'Click the link "No account yet? Register now.".'
                  - keyword: THEN
                    content: 'Navigate to the registration page.'
      - id: REQ-5.2
        name: Booking Form
        type: FOLDER
        description: 'Provide a booking form after the user clicks one "Book" button on the search results page. ![image](./reference/booking-1.png)'
        dependencies:
          - REQ-3.2.2
        children:
          - id: REQ-5.2.1
            name: Open booking form from search results
            type: ATOMIC
            description: 'After the user clicks one "Book" button for a valid train result, open the booking form page with a visible "Train Information" section heading. ![image](./reference/booking-1.png)'
            dependencies:
              - REQ-3.2.2
            scenarios:
              - name: Open the booking form from one search result row
                steps:
                  - keyword: GIVEN
                    content: 'The user is logged in and is on a populated ticket search results page.'
                  - keyword: WHEN
                    content: 'Click one "Book" button in the result list.'
                  - keyword: THEN
                    content: 'Navigate to the booking form page and show the "Train Information" section.'
          - id: REQ-5.2.2
            name: View booking information
            type: ATOMIC
            description: 'Display the booking information section with the title "Train Information:" and the selected train details, including departure place, destination, departure date, train number, seat type, price, current remaining ticket information such as "business-class seat ( ￥1870.0 ) 32% off 1 left", "first-class seat ( ￥967.0 ) 24% off None left", "second-class seat ( ￥576.0 ) 27% off None left", and "standing ticket ( ￥576.0 ) 27% off Enough left", and a visible "Place order" button on the booking form page.'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Display the booking information section for the selected train
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page.'
                  - keyword: WHEN
                    content: 'Review the "Train Information:" section and the visible "Place order" button.'
                  - keyword: THEN
                    content: 'The section shows the selected train details, the seat types, the prices, and the current remaining ticket information.'
          - id: REQ-5.2.3
            name: Select passengers for booking
            type: ATOMIC
            description: 'Display the passenger section with the title "Passenger Information:" and the user''s frequent passengers. When the user selects one or more passengers, add one booking row per selected passenger and keep the "Place order" action available for submission. The table columns are "Ticket class", "Ticket type", "Name", "ID type", "ID number", "Nationality", and "Operation". The "Ticket class" dropdown contains "Business-class seat", "First-class seat", "Second-class seat", and "Standing ticket". The "Ticket type" dropdown contains "Adult" and "Child". The "Operation" column contains a "Delete" button.'
            dependencies:
              - REQ-5.2.1
              - REQ-4.4.1
            scenarios:
              - name: Add selected passengers to the booking table
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page and has at least one frequent passenger available.'
                  - keyword: WHEN
                    content: 'Select one or more passengers from the frequent passenger list.'
                  - keyword: THEN
                    content: 'The passenger table shows one row for each selected passenger with the columns "Ticket class", "Ticket type", "Name", "ID type", "ID number", "Nationality", and "Operation", and the page keeps the "Place order" button visible.'
          - id: REQ-5.2.4
            name: Open terms of service page from booking form
            type: ATOMIC
            description: 'Provide a link with the text "I have read and agree to the Terms of Service" on the booking form page and navigate to the terms page that contains the title "Terms of Service" after it is clicked.'
            dependencies:
              - REQ-5.2.1
              - REQ-2.5.1
            scenarios:
              - name: Open the terms of service page from the booking form
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page.'
                  - keyword: WHEN
                    content: 'Click the link "I have read and agree to the Terms of Service".'
                  - keyword: THEN
                    content: 'Navigate to the terms page and show the title "Terms of Service".'
          - id: REQ-5.2.5
            name: Submit valid booking information
            type: ATOMIC
            description: 'Provide the buttons "Previous step" and "Place order" on the booking form page. When the user clicks "Place order" with at least one selected passenger and all selected ticket classes still having available tickets, persist the booking information and show a successful booking message.'
            dependencies:
              - REQ-5.2.3
            scenarios:
              - name: Submit a valid booking request
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page with at least one passenger selected and each selected ticket class still having available tickets.'
                  - keyword: WHEN
                    content: 'Click the "Place order" button.'
                  - keyword: THEN
                    content: 'The system persists the booking information and shows a successful booking message.'
          - id: REQ-5.2.6
            name: Block booking submission without selected passengers
            type: ATOMIC
            description: 'Reject booking submission when no passenger is selected and show the message "Please select at least one passenger.".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Submit the booking form without selecting any passenger
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page with no passenger selected.'
                  - keyword: WHEN
                    content: 'Click the "Place order" button.'
                  - keyword: THEN
                    content: 'The page shows "Please select at least one passenger." and does not continue to the confirmation step.'
          - id: REQ-5.2.7
            name: Block booking submission without ticket availability
            type: ATOMIC
            description: 'Reject booking submission when one selected passenger has a ticket class with no remaining tickets and show the message "Sorry, there are no tickets available for the selected ticket class.".'
            dependencies:
              - REQ-5.2.3
            scenarios:
              - name: Submit the booking form with an unavailable ticket class
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the booking form page with at least one passenger selected and one selected ticket class having no remaining tickets.'
                  - keyword: WHEN
                    content: 'Click the "Place order" button.'
                  - keyword: THEN
                    content: 'The page shows "Sorry, there are no tickets available for the selected ticket class." and does not continue to the confirmation step.'
      - id: REQ-5.3
        name: Order Confirmation and Payment
        type: FOLDER
        description: 'Provide order confirmation, order payment, order status transitions, and order-center payment and cancellation entry points.'
        dependencies:
          - REQ-5.2.5
        children:
          - id: REQ-5.3.1
            name: Confirm submitted booking information
            type: ATOMIC
            description: 'After the user submits booking information, open a confirmation dialog with the title "Please confirm the following information.", show the train information and passenger information, and provide the buttons "Confirm" and "Edit". Clicking "Confirm" confirms the order information and shows a successful submission message. Clicking "Edit" returns to the booking information page. ![image](./reference/booking-confirm.png)'
            dependencies:
              - REQ-5.2.5
            scenarios:
              - name: Confirm the order information and continue
                steps:
                  - keyword: GIVEN
                    content: 'The user has successfully submitted valid booking information.'
                  - keyword: WHEN
                    content: 'Click the "Confirm" button in the confirmation dialog.'
                  - keyword: THEN
                    content: 'The order information is confirmed and the system shows a successful order submission message.'
              - name: Return to edit from the confirmation dialog
                steps:
                  - keyword: GIVEN
                    content: 'The user is viewing the confirmation dialog after a valid booking submission.'
                  - keyword: WHEN
                    content: 'Click the "Edit" button.'
                  - keyword: THEN
                    content: 'Return to the booking information page.'
          - id: REQ-5.3.2
            name: View payment page
            type: ATOMIC
            description: 'After the user confirms the order information, open the payment page. The top of the page shows "Seats are locked, Time remained to complete your payment:" with a live 20-minute countdown in the format "MM:SS". The page also shows "Order details" with the same order information as the confirmation page, and the total price in the format "Total: ￥xxxx.xx". ![image](./reference/payment.png)'
            dependencies:
              - REQ-5.3.1
            scenarios:
              - name: Open the payment page after confirming the order
                steps:
                  - keyword: GIVEN
                    content: 'The user has confirmed the order information.'
                  - keyword: WHEN
                    content: 'The payment step opens.'
                  - keyword: THEN
                    content: 'The page shows "Seats are locked, Time remained to complete your payment:", a live countdown in the format "MM:SS", "Order details", and the total price in the format "Total: ￥xxxx.xx".'
          - id: REQ-5.3.3
            name: Cancel order from payment page
            type: ATOMIC
            description: 'Provide a "Cancel" button on the payment page. Clicking it cancels the order, releases the locked seats, and shows a successful cancellation message.'
            dependencies:
              - REQ-5.3.2
            scenarios:
              - name: Cancel the order from the payment page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the payment page for an unpaid order.'
                  - keyword: WHEN
                    content: 'Click the "Cancel" button.'
                  - keyword: THEN
                    content: 'The order is cancelled, the locked seats are released, and the page shows a successful cancellation message.'
          - id: REQ-5.3.4
            name: Pay for order from payment page
            type: ATOMIC
            description: 'Provide a "Pay" button on the payment page. Clicking it simulates a successful payment.'
            dependencies:
              - REQ-5.3.2
            scenarios:
              - name: Complete payment from the payment page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the payment page for an unpaid order.'
                  - keyword: WHEN
                    content: 'Click the "Pay" button.'
                  - keyword: THEN
                    content: 'The system simulates a successful payment.'
          - id: REQ-5.3.5
            name: Show unpaid order in uncompleted orders tab
            type: ATOMIC
            description: 'When the user reaches the payment page after confirming the order but does not complete payment, set the order status as unpaid and show the order in the "Uncompleted orders" tab of the order center.'
            dependencies:
              - REQ-5.3.2
            scenarios:
              - name: Show an unpaid order in the uncompleted orders tab
                steps:
                  - keyword: GIVEN
                    content: 'The user has confirmed the order information and is on the payment page without completing payment.'
                  - keyword: WHEN
                    content: 'Leave the order unpaid.'
                  - keyword: THEN
                    content: 'The order status is set as unpaid and the order appears in the "Uncompleted orders" tab.'
          - id: REQ-5.3.6
            name: Show paid order in upcoming trips tab
            type: ATOMIC
            description: 'When the user completes payment and the travel time has not yet arrived, set the order status as paid and upcoming, and show the order in the "Upcoming trips" tab of the order center.'
            dependencies:
              - REQ-5.3.4
            scenarios:
              - name: Show a paid upcoming order in the upcoming trips tab
                steps:
                  - keyword: GIVEN
                    content: 'The user has an unpaid order on the payment page and the travel time has not yet arrived.'
                  - keyword: WHEN
                    content: 'Click the "Pay" button and complete the simulated payment.'
                  - keyword: THEN
                    content: 'The order status is set as paid and upcoming, and the order appears in the "Upcoming trips" tab.'
          - id: REQ-5.3.7
            name: Show cancelled order in uncompleted orders tab
            type: ATOMIC
            description: 'When the user cancels the order from the payment page, set the order status as cancelled and show the order in the "Uncompleted orders" tab of the order center.'
            dependencies:
              - REQ-5.3.3
            scenarios:
              - name: Show a cancelled order in the uncompleted orders tab
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the payment page for an unpaid order.'
                  - keyword: WHEN
                    content: 'Click the "Cancel" button and complete the cancellation.'
                  - keyword: THEN
                    content: 'The order status is set as cancelled and the order appears in the "Uncompleted orders" tab.'
          - id: REQ-5.3.8
            name: Continue payment from order center
            type: ATOMIC
            description: 'Allow the user to click the "Pay" button for one unpaid order in the "Uncompleted orders" tab and open the order payment page with a visible "Order details" area.'
            dependencies:
              - REQ-4.2.4
              - REQ-5.3.2
            scenarios:
              - name: Open the payment page from the uncompleted orders tab
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab with at least one unpaid order.'
                  - keyword: WHEN
                    content: 'Click the "Pay" button for one unpaid order.'
                  - keyword: THEN
                    content: 'Navigate to the order payment page and show the "Order details" area.'
          - id: REQ-5.3.9
            name: Cancel order from order center
            type: ATOMIC
            description: 'Allow the user to click the "Cancel" button for one unpaid order in the "Uncompleted orders" tab, open a confirmation dialog with the text "Are you sure you want to cancel this order?" and the buttons "Cancel" and "Confirm", cancel the order and release the locked seats after clicking "Confirm", or close the dialog without cancelling after clicking "Cancel".'
            dependencies:
              - REQ-4.2.4
            scenarios:
              - name: Confirm cancellation of an unpaid order from the order center
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab with at least one unpaid order.'
                  - keyword: WHEN
                    content: 'Click the "Cancel" button for one order and then click the "Confirm" button in the dialog.'
                  - keyword: THEN
                    content: 'The order is cancelled, the locked seats are released, and the page shows a successful cancellation message.'
              - name: Cancel the cancellation action from the order center dialog
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab with the cancellation confirmation dialog open.'
                  - keyword: WHEN
                    content: 'Click the "Cancel" button in the dialog.'
                  - keyword: THEN
                    content: 'The dialog closes and the order remains unchanged.'
  - id: REQ-6
    name: Travel Guide
    type: FOLDER
    description: 'Provide one unified travel guide page with the content categories "Ticketing", "Endorsement and refund", and "Miscellaneous", along with multiple quick-entry routes from the navigation dropdown and the home page "Quick Guide" section.'
    dependencies:
      - REQ-1
    children:
      - id: REQ-6.1
        name: Travel Guide Page
        type: FOLDER
        description: 'Allow the user to open the travel guide page from the home page navigation bar. The page shows three tabs: "Ticketing", "Endorsement and refund", and "Miscellaneous". Each tab shows the corresponding travel guidance content. ![image](./reference/travel-guide.png)'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-6.1.1
            name: Open travel guide page from navigation bar
            type: ATOMIC
            description: 'Open the travel guide page from the "Travel guide" link in the home page navigation bar and display the three guide tabs and their corresponding content. ![image](./reference/travel-guide.png)'
            dependencies:
              - REQ-1.1
            scenarios:
              - name: Open the travel guide page from the navigation bar
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Click the "Travel guide" link in the navigation bar.'
                  - keyword: THEN
                    content: 'Navigate to the travel guide page and show the tabs "Ticketing", "Endorsement and refund", and "Miscellaneous".'
      - id: REQ-6.2
        name: Travel Guide Dropdown Navigation
        type: FOLDER
        description: 'Allow the user to hover over the "Travel guide" navigation item, open a dropdown that contains the three guide categories and direct links to category tabs and question anchors. ![image](./reference/travel-guide-dropdown.png)'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-6.2.1
            name: Open travel guide tab from dropdown more link
            type: ATOMIC
            description: 'When the user hovers over "Travel guide" in the navigation bar, show a dropdown containing the categories "Ticketing", "Endorsement and refund", and "Miscellaneous". Under each category, provide one "More" link that navigates to the travel guide page and positions the page on the corresponding category tab. ![image](./reference/travel-guide-dropdown.png)'
            dependencies:
              - REQ-1.1
              - REQ-6.1.1
            scenarios:
              - name: Open one guide category tab from the dropdown more link
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Hover over "Travel guide" in the navigation bar and click one "More" link in the dropdown.'
                  - keyword: THEN
                    content: 'Navigate to the travel guide page and position the page on the corresponding category tab.'
          - id: REQ-6.2.2
            name: Open travel guide question from dropdown question link
            type: ATOMIC
            description: 'When the user hovers over "Travel guide" in the navigation bar, show a dropdown containing four question links under each of the categories "Ticketing", "Endorsement and refund", and "Miscellaneous". Clicking one question link navigates to the travel guide page, positions the page on the corresponding category tab, and positions the page on the corresponding question.'
            dependencies:
              - REQ-1.1
              - REQ-6.1.1
            scenarios:
              - name: Open one guide question from the navigation dropdown
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Hover over "Travel guide" in the navigation bar and click one question link in the dropdown.'
                  - keyword: THEN
                    content: 'Navigate to the travel guide page, position the page on the correct category tab, and position the page on the selected question.'
      - id: REQ-6.3
        name: Home Quick Guide Navigation
        type: FOLDER
        description: 'Use the home page "Quick Guide" section to navigate directly to common questions or to the travel guide page.'
        dependencies:
          - REQ-1.2
          - REQ-6.1.1
        children:
          - id: REQ-6.3.1
            name: Open common question from quick guide
            type: ATOMIC
            description: 'Display four common-question links in the home page "Quick Guide" section: "How to book tickets online?", "How to change or refund tickets?", "How to check train status?", and "How to use 12306 mobile app?". Clicking one link navigates to the travel guide page, shows the related topic heading such as "Ticketing", and positions the page on the corresponding question.'
            dependencies:
              - REQ-1.2
              - REQ-6.1.1
            scenarios:
              - name: Open one common question from the home page quick guide section
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Click one common-question link in the "Quick Guide" section.'
                  - keyword: THEN
                    content: 'Navigate to the travel guide page, show the related topic heading such as "Ticketing", and position the page on the corresponding question.'
          - id: REQ-6.3.2
            name: Open travel guide page from quick guide more link
            type: ATOMIC
            description: 'Display a link with the text "More" in the home page "Quick Guide" section and navigate to the travel guide page positioned on the "Ticketing" tab after it is clicked.'
            dependencies:
              - REQ-1.2
              - REQ-6.1.1
            scenarios:
              - name: Open the travel guide page from the quick guide more link
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Click the "More" link in the "Quick Guide" section.'
                  - keyword: THEN
                    content: 'Navigate to the travel guide page and position the page on the "Ticketing" tab.'
