  - id: REQ-4
    name: Personal Center and Frequent Information Management
    type: FOLDER
    description: 'Provide the personal center home page, order center, personal information pages, account security pages, mobile verification page, passenger management, and quick-entry dropdown navigation.'
    dependencies:
      - REQ-2.2.3
    children:
      - id: REQ-4.1
        name: Personal Center Entry
        type: FOLDER
        description: 'Control access to the personal center from the top "My 12306" entry and route the user either to the login page or to the personal center home page.'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-4.1.1
            name: Redirect unauthenticated user to login page
            type: ATOMIC
            description: 'When the user clicks the top "My 12306" entry without being logged in, check the login state and navigate to the login page.'
            dependencies:
              - REQ-1.1
            scenarios:
              - name: Block personal center access for an unauthenticated user
                steps:
                  - keyword: GIVEN
                    content: 'The user is not logged in and is on the home page.'
                  - keyword: WHEN
                    content: 'Click the top "My 12306" entry.'
                  - keyword: THEN
                    content: 'Navigate to the login page.'
          - id: REQ-4.1.2
            name: Open personal center home page
            type: ATOMIC
            description: 'After login, open the personal center home page from the top "My 12306" entry. The page shows the left-side menu items "Personal Center", "Order center", "Personal", and "Information management", and a default notice panel containing the icon "assets/noticepic.png", the user name, and the notice text shown in the reference. ![image](./reference/user-center.png)'
            dependencies:
              - REQ-2.2.3
            scenarios:
              - name: Open the personal center home page after login
                steps:
                  - keyword: GIVEN
                    content: 'The user is logged in and is on the home page.'
                  - keyword: WHEN
                    content: 'Click the top "My 12306" entry.'
                  - keyword: THEN
                    content: 'Navigate to the personal center home page and show the left menu items "Personal Center", "Order center", "Personal", and "Information management", the icon "assets/noticepic.png", the user name, and the notice box text.'
          - id: REQ-4.1.3
            name: Open default ticket search from personal center home page
            type: ATOMIC
            description: 'Provide a link with the text "ticket booking" on the personal center home page and navigate to the ticket search results page with the default search conditions of departure place Beijing, arrival place Shanghai, and the current date after it is clicked.'
            dependencies:
              - REQ-4.1.2
              - REQ-3.2.14
            scenarios:
              - name: Open the default ticket search from the personal center notice link
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the personal center home page.'
                  - keyword: WHEN
                    content: 'Click the link "ticket booking" in the notice box.'
                  - keyword: THEN
                    content: 'Navigate to the ticket search results page and show the default results for departure place Beijing, arrival place Shanghai, and the current date.'
      - id: REQ-4.2
        name: Order Center
        type: FOLDER
        description: 'Provide a "Ticket orders" page under "Order center" with the tabs "Uncompleted orders", "Upcoming trips", and "History orders". ![image](./reference/ticket-orders.png)'
        dependencies:
          - REQ-4.1.2
        children:
          - id: REQ-4.2.1
            name: Open ticket orders page
            type: ATOMIC
            description: 'Allow the user to click "Order center", expand the submenu, click "Ticket orders", and show the order page with the tabs "Uncompleted orders", "Upcoming trips", and "History orders". ![image](./reference/ticket-orders.png)'
            dependencies:
              - REQ-4.1.2
            scenarios:
              - name: Open the ticket orders page from the order center menu
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the personal center home page.'
                  - keyword: WHEN
                    content: 'Click "Order center" and then click "Ticket orders".'
                  - keyword: THEN
                    content: 'The page shows the ticket orders view with the tabs "Uncompleted orders", "Upcoming trips", and "History orders".'
          - id: REQ-4.2.2
            name: Show empty uncompleted orders state
            type: ATOMIC
            description: 'When the "Uncompleted orders" tab has no order, show "assets/empty.png" and the text "You don''t have uncompleted orders.". ![image](./reference/ticket-orders.png)'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Display the empty state in uncompleted orders
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab and there is no uncompleted order.'
                  - keyword: WHEN
                    content: 'Review the tab content.'
                  - keyword: THEN
                    content: 'The page shows "assets/empty.png" and the text "You don''t have uncompleted orders.".'
          - id: REQ-4.2.3
            name: Open default ticket search from empty uncompleted orders state
            type: ATOMIC
            description: 'When the "Uncompleted orders" tab is empty, provide the link "You can book your tickets and plan your trips." and navigate to the default ticket search results page after it is clicked.'
            dependencies:
              - REQ-4.2.2
              - REQ-3.2.14
            scenarios:
              - name: Open the default ticket search from the empty uncompleted orders state
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the empty "Uncompleted orders" tab.'
                  - keyword: WHEN
                    content: 'Click the link "You can book your tickets and plan your trips.".'
                  - keyword: THEN
                    content: 'Navigate to the ticket search results page and show the default results for departure place Beijing, arrival place Shanghai, and the current date.'
          - id: REQ-4.2.4
            name: View uncompleted orders table
            type: ATOMIC
            description: 'Display a table in "Uncompleted orders" where each row represents one passenger order, and transfer tickets are grouped together. The table visibly exposes train-detail columns such as "Train No.", "Departure date", "Departure station", and "Arrival station", together with an "Operation" column and the payment action; it may also show passenger, seat, price, status, and total-price details. Each order group is followed by a "Pay" button. ![image](./reference/uncompleted-orders.png)'
