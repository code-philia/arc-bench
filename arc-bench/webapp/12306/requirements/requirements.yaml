            name: View upcoming trips table
            type: ATOMIC
            description: 'Display the "Upcoming trips" orders in a table with visible train-detail columns such as "Train No.", "Departure date", "Departure station", and "Arrival station", together with an "Operation" column; passenger, seat, price, status, and total-price details may also be shown. Transfer tickets are grouped together. ![image](./reference/uncompleted-orders.png)'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Display upcoming trips in a table
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab and there is at least one upcoming order.'
                  - keyword: WHEN
                    content: 'Review the order table.'
                  - keyword: THEN
                    content: 'The page shows the columns "Train No.", "Departure date", "Departure station", "Arrival station", and "Operation" for the upcoming trips.'
          - id: REQ-4.2.11
            name: Refund an upcoming trip
            type: ATOMIC
            description: 'Allow the user to click the "Refund" button for one upcoming order, submit a refund request before the refund deadline, open the refund page that shows the order and refund information, update the order status to "refunded", and add the refunded order to the history orders.'
            dependencies:
              - REQ-4.2.10
            scenarios:
              - name: Refund one eligible upcoming trip
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab with at least one order that is still within the refund deadline.'
                  - keyword: WHEN
                    content: 'Click the "Refund" button for one order.'
