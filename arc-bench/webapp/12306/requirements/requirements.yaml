            description: 'Provide the filter condition "Departure time" in the "Filter" sidebar with a dropdown containing "00:00-24:00", "00:00-06:00", "06:00-12:00", "12:00-18:00", and "18:00-24:00", and filter the ticket list according to the selected time range.'
