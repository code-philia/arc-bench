id: ROOT
name: Train Ticket Booking System
type: FOLDER
description: 'A train ticket booking system that provides user authentication, ticket search and booking, order management, and travel information services. This workspace includes seeded travel-booking records used by the scenarios, including public home-page content, registration candidates, existing traveler accounts, SMS-login accounts, route-search examples, bookable routes, booking-page records, order-center states, traveler/address/contact/invoice records, profile binding states, flight-status records, reimbursement records, and airport-guide content. These are ordinary product records used by the requirements, not a separate fixture DSL.'
dependencies: []
children:
  - id: REQ-1
    name: System Home
    type: FOLDER
    description: 'The default landing page after the system starts. The top area shows "assets/logo.png" on the left, and "Login", "Register", and a "My 12306" dropdown entry on the right. The navigation bar contains "Home", a "Booking" dropdown entry, and a "Travel guides" dropdown entry. The page also displays a banner carousel with "assets/banner1.jpg", "assets/banner2.jpg", and "assets/banner3.jpg", a ticket search area, and a "Quick Guide" section. ![image](./reference/homepage.png)'
    dependencies: []
    children:
      - id: REQ-1.1
        name: Open system home page
        type: ATOMIC
        description: 'Display the home page with the top logo, authentication links, navigation bar, three banner images, the search area, and the "Quick Guide" area.'
        dependencies: []
        scenarios:
          - name: Display the default home page
            steps:
              - keyword: GIVEN
                content: 'The system is accessible.'
              - keyword: WHEN
                content: 'Open the application entry URL.'
              - keyword: THEN
                content: 'The page shows "assets/logo.png" at the top-left, the "Login" link and the "Register" link at the top-right, the "My 12306" dropdown entry, the navigation items "Home", "Booking", and "Travel guides", the three banner images, the search area, and the "Quick Guide" area.'
      - id: REQ-1.2
        name: Show quick guide links
        type: ATOMIC
        description: 'Display the "Quick Guide" area on the home page as a dedicated section for quick links.'
        dependencies:
          - REQ-1.1
        scenarios:
          - name: Show the quick guide section on the home page
            steps:
              - keyword: GIVEN
                content: 'The user is on the home page.'
              - keyword: WHEN
                content: 'Review the content below the banner area.'
              - keyword: THEN
                content: 'The page shows a visible "Quick Guide" section reserved for quick links.'
  - id: REQ-2
    name: User Authentication
    type: FOLDER
    description: 'Provide user registration, login, logout, password reset, and agreement browsing. User data is persisted after successful registration, login, and password reset.'
    dependencies:
      - REQ-1
    children:
      - id: REQ-2.1
        name: User Registration
        type: FOLDER
        description: 'Allow a user to create an account by filling in identity and contact information, agreeing to the service terms, and submitting the registration form.'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-2.1.1
            name: Open registration page
            type: ATOMIC
            description: 'Open the registration page from the "Register" link in the top-right area of the home page.'
            dependencies:
              - REQ-1.1
            scenarios:
              - name: Open the registration page from the home page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page and is not logged in.'
                  - keyword: WHEN
                    content: 'Click the "Register" link in the top-right area.'
                  - keyword: THEN
                    content: 'Navigate to the registration page.'
          - id: REQ-2.1.2
            name: View registration form
            type: ATOMIC
            description: 'Display the registration form with a dropdown labeled "Nationality" showing the default value "Please select" and country options, input fields labeled "Name", "Passport number", "Username", and "Email address", date pickers labeled "Passport expiration date" and "Date of birth", a radio group labeled "Gender" with "Male" and "Female", password fields labeled "Password" and "Confirm Password", a checkbox followed by "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and a "Register" button. ![image](./reference/register.png)'
            dependencies:
              - REQ-2.1.1
            scenarios:
              - name: Display the registration form layout
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page.'
                  - keyword: WHEN
                    content: 'Review the registration form content.'
                  - keyword: THEN
                    content: 'The page shows the labeled fields "Nationality", "Name", "Passport number", "Passport expiration date", "Date of birth", "Gender", "Username", "Password", "Confirm Password", and "Email address", the agreement checkbox text, and the "Register" button.'
          - id: REQ-2.1.3
            name: Submit valid registration information
            type: ATOMIC
            description: 'Allow a new user to submit complete and valid registration information, persist the user data, and show a successful registration message.'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit a valid registration form
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with all required fields filled with valid values, a unique passport number, a unique username, matching passwords, and a valid email address, and the agreement checkbox is selected.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The system persists the user information and shows a successful registration message.'
          - id: REQ-2.1.4
            name: Block registration with missing required fields
            type: ATOMIC
            description: 'Reject registration when any required field is missing and show the message "Please fill in all required fields.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form with missing required information
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with one or more required fields left empty.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Please fill in all required fields." and does not complete registration.'
          - id: REQ-2.1.5
            name: Block registration with duplicate passport number
            type: ATOMIC
            description: 'Reject registration when the passport number already exists and show the message "Passport number already exists.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form with an existing passport number
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with a passport number that already exists in the system and all other required fields are valid.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Passport number already exists." and does not complete registration.'
          - id: REQ-2.1.6
            name: Block registration with duplicate username
            type: ATOMIC
            description: 'Reject registration when the username already exists and show the message "Username already exists.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form with an existing username
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with a username that already exists in the system and all other required fields are valid.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Username already exists." and does not complete registration.'
          - id: REQ-2.1.7
            name: Block registration with mismatched passwords
            type: ATOMIC
            description: 'Reject registration when the values in "Password" and "Confirm Password" do not match and show the message "Passwords do not match.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form with mismatched passwords
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with different values entered in the "Password" and "Confirm Password" fields.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Passwords do not match." and does not complete registration.'
          - id: REQ-2.1.8
            name: Block registration with invalid email format
            type: ATOMIC
            description: 'Reject registration when the email address format is invalid and show the message "Invalid email address format.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form with an invalid email address
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with an invalid value entered in the "Email address" field and all other required fields are valid.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Invalid email address format." and does not complete registration.'
          - id: REQ-2.1.9
            name: Block registration without agreement acceptance
            type: ATOMIC
            description: 'Reject registration when the agreement checkbox is not selected and show the message "Please agree to the Terms of Service and Privacy Policy.".'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Submit the form without accepting the agreement
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page with all required fields valid and the agreement checkbox not selected.'
                  - keyword: WHEN
                    content: 'Click the "Register" button.'
                  - keyword: THEN
                    content: 'The page shows "Please agree to the Terms of Service and Privacy Policy." and does not complete registration.'
      - id: REQ-2.2
        name: User Login
        type: FOLDER
        description: 'Allow a user to log in with a username, email address, or mobile number and a password.'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-2.2.1
            name: Open login page
            type: ATOMIC
            description: 'Open the login page from the "Login" link in the top-right area of the home page.'
            dependencies:
              - REQ-1.1
            scenarios:
              - name: Open the login page from the home page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page and is not logged in.'
                  - keyword: WHEN
                    content: 'Click the "Login" link in the top-right area.'
                  - keyword: THEN
                    content: 'Navigate to the login page.'
          - id: REQ-2.2.2
            name: View login form
            type: ATOMIC
            description: 'Display the login form with an input field whose placeholder is "Email/Username/Mobile number", a password input whose placeholder is "Password", and a "LOGIN" button. ![image](./reference/login.png)'
            dependencies:
              - REQ-2.2.1
            scenarios:
              - name: Display the login form layout
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page.'
                  - keyword: WHEN
                    content: 'Review the login form.'
                  - keyword: THEN
                    content: 'The page shows the "Email/Username/Mobile number" input, the password input with the placeholder "Password", and the "LOGIN" button.'
          - id: REQ-2.2.3
            name: Submit valid login credentials
            type: ATOMIC
            description: 'Allow the user to log in with a valid username, email address, or mobile number and the correct password, persist the login state, and show a successful login message.'
            dependencies:
              - REQ-2.2.2
            scenarios:
              - name: Log in with valid credentials
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page with a valid username, email address, or mobile number entered and the correct password entered.'
                  - keyword: WHEN
                    content: 'Click the "LOGIN" button.'
                  - keyword: THEN
                    content: 'The system persists the login state and shows a successful login message.'
          - id: REQ-2.2.4
            name: Block login with missing credentials
            type: ATOMIC
            description: 'Reject login when the account field or password field is empty and show the message "Please enter your username/email/phone number and password.".'
            dependencies:
              - REQ-2.2.2
            scenarios:
              - name: Submit the login form with missing account information or password
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page with the account field empty, the password field empty, or both.'
                  - keyword: WHEN
                    content: 'Click the "LOGIN" button.'
                  - keyword: THEN
                    content: 'The page shows "Please enter your username/email/phone number and password." and does not complete login.'
          - id: REQ-2.2.5
            name: Block login for unknown account
            type: ATOMIC
            description: 'Reject login when the entered username, email address, or mobile number does not exist and show the message "User not found.".'
            dependencies:
              - REQ-2.2.2
            scenarios:
              - name: Submit the login form with an unknown account
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page with a username, email address, or mobile number that does not exist and a password entered.'
                  - keyword: WHEN
                    content: 'Click the "LOGIN" button.'
                  - keyword: THEN
                    content: 'The page shows "User not found." and does not complete login.'
          - id: REQ-2.2.6
            name: Block login with incorrect password
            type: ATOMIC
            description: 'Reject login when the password is incorrect and show the message "Incorrect password.".'
            dependencies:
              - REQ-2.2.2
            scenarios:
              - name: Submit the login form with an incorrect password
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page with an existing username, email address, or mobile number entered and an incorrect password entered.'
                  - keyword: WHEN
                    content: 'Click the "LOGIN" button.'
                  - keyword: THEN
                    content: 'The page shows "Incorrect password." and does not complete login.'
          - id: REQ-2.2.7
            name: Open registration page from login page
            type: ATOMIC
            description: 'Provide a link with the text "No account yet? Register now." on the login page and navigate to the registration page after it is clicked.'
            dependencies:
              - REQ-2.2.2
              - REQ-2.1.1
            scenarios:
              - name: Open the registration page from the login page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page.'
                  - keyword: WHEN
                    content: 'Click the link "No account yet? Register now.".'
                  - keyword: THEN
                    content: 'Navigate to the registration page.'
      - id: REQ-2.3
        name: User Logout
        type: FOLDER
        description: 'Allow a logged-in user to sign out from the home page and clear the persisted login state.'
        dependencies:
          - REQ-2.2.3
        children:
          - id: REQ-2.3.1
            name: Sign out from home page
            type: ATOMIC
            description: 'After login, replace the top "Register" link with "Sign Out". When the user clicks "Sign Out", clear the login state, show a successful logout message, change "Sign Out" back to "Register", and show "Login" instead of the user name.'
            dependencies:
              - REQ-2.2.3
            scenarios:
              - name: Sign out from the home page
                steps:
                  - keyword: GIVEN
                    content: 'The user is logged in and is on the home page.'
                  - keyword: WHEN
                    content: 'Click the "Sign Out" link in the top-right area.'
                  - keyword: THEN
                    content: 'The system clears the login state, shows a successful logout message, changes the top-right link from "Sign Out" to "Register", and shows "Login" instead of the user name.'
      - id: REQ-2.4
        name: Forgot Password
        type: FOLDER
        description: 'Allow a user to reset the password by entering the registered email address and ID number, then entering a new password.'
        dependencies:
          - REQ-2.2.2
        children:
          - id: REQ-2.4.1
            name: Open forgot password page
            type: ATOMIC
            description: 'Provide a link with the text "Forgot password?" on the login page and navigate to the forgot password page after it is clicked.'
            dependencies:
              - REQ-2.2.2
            scenarios:
              - name: Open the forgot password page from the login page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the login page.'
                  - keyword: WHEN
                    content: 'Click the link "Forgot password?".'
                  - keyword: THEN
                    content: 'Navigate to the forgot password page.'
          - id: REQ-2.4.2
            name: View forgot password flow
            type: ATOMIC
            description: 'Display a two-step forgot password flow. The first step shows a form with an input labeled "Email: ", an input labeled "ID number: ", and a "submit" button. The second step shows a form with password inputs labeled "New password: " and "Confirm new password: ", and a "submit" button. When the entered email and ID number do not match a registration record, the page shows the exact error message "Email address and ID number do not match." ![image](./reference/forgot-password.png)'
            dependencies:
              - REQ-2.4.1
            scenarios:
              - name: Display the forgot password forms
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the forgot password page.'
                  - keyword: WHEN
                    content: 'Review the first-step identity form and continue to the second step after the identity check.'
                  - keyword: THEN
                    content: 'The first step shows the "Email: " field, the "ID number: " field, and the "submit" button, and the second step shows the "New password: " field, the "Confirm new password: " field, and the "submit" button.'
          - id: REQ-2.4.3
            name: Submit valid password reset information
            type: ATOMIC
            description: 'Allow the user to reset the password when the email address and ID number match the registration record and the new passwords match, persist the new password, and show a successful password reset message.'
            dependencies:
              - REQ-2.4.2
            scenarios:
              - name: Complete a valid password reset
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the forgot password flow with a matching email address and ID number entered, and matching values entered in "New password: " and "Confirm new password: ".'
                  - keyword: WHEN
                    content: 'Click the "submit" button in the final step.'
                  - keyword: THEN
                    content: 'The system persists the new password and shows a successful password reset message.'
          - id: REQ-2.4.4
            name: Block password reset with missing identity fields
            type: ATOMIC
            description: 'Reject the identity verification step when the email address or ID number is missing and show the message "Please enter your email and ID number.".'
            dependencies:
              - REQ-2.4.2
            scenarios:
              - name: Submit the identity verification step with missing information
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the first step of the forgot password flow with the email field empty, the ID number field empty, or both.'
                  - keyword: WHEN
                    content: 'Click the "submit" button.'
                  - keyword: THEN
                    content: 'The page shows "Please enter your email and ID number." and does not continue to the next step.'
          - id: REQ-2.4.5
            name: Block password reset for unmatched email and ID number
            type: ATOMIC
            description: 'Reject the identity verification step when the email address and ID number do not match the registration record and show the message "Email and ID number do not match our records.".'
            dependencies:
              - REQ-2.4.2
            scenarios:
              - name: Submit the identity verification step with unmatched records
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the first step of the forgot password flow with an email address and ID number that do not match the registration record.'
                  - keyword: WHEN
                    content: 'Click the "submit" button.'
                  - keyword: THEN
                    content: 'The page shows "Email address and ID number do not match." and does not continue to the next step.'
          - id: REQ-2.4.6
            name: Block password reset with mismatched new passwords
            type: ATOMIC
            description: 'Reject the new password step when the values in "New password: " and "Confirm new password: " do not match and show the message "Passwords do not match.".'
            dependencies:
              - REQ-2.4.2
            scenarios:
              - name: Submit the new password step with mismatched passwords
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the new password step with different values entered in "New password: " and "Confirm new password: ".'
                  - keyword: WHEN
                    content: 'Click the "submit" button.'
                  - keyword: THEN
                    content: 'The page shows "Passwords do not match." and does not reset the password.'
      - id: REQ-2.5
        name: Terms of Service and Privacy Policy
        type: FOLDER
        description: 'Provide access to the agreement content from the registration page and require acceptance before registration can be completed.'
        dependencies:
          - REQ-2.1.2
        children:
          - id: REQ-2.5.1
            name: Open terms of service page
            type: ATOMIC
            description: 'Open the terms page from the "Terms of Service" link in the agreement text and display a page containing the title "Terms of Service". ![image](./reference/rule.png)'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Open the terms of service page from the registration page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page.'
                  - keyword: WHEN
                    content: 'Click the "Terms of Service" link in the agreement text.'
                  - keyword: THEN
                    content: 'Navigate to the terms page and show the title "Terms of Service".'
          - id: REQ-2.5.2
            name: Open privacy policy page
            type: ATOMIC
            description: 'Open the privacy policy page from the "Privacy Policy" link in the agreement text and display a page containing the title "Privacy Policy". ![image](./reference/policy.png)'
            dependencies:
              - REQ-2.1.2
            scenarios:
              - name: Open the privacy policy page from the registration page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the registration page.'
                  - keyword: WHEN
                    content: 'Click the "Privacy Policy" link in the agreement text.'
                  - keyword: THEN
                    content: 'Navigate to the privacy policy page and show the title "Privacy Policy".'
  - id: REQ-3
    name: Ticket Search and Display
    type: FOLDER
    description: 'Provide train ticket search from the home page, display search results, support sorting and filtering, and provide entry points from both the search box and the navigation bar.'
    dependencies:
      - REQ-1
    children:
      - id: REQ-3.1
        name: Home Quick Search
        type: FOLDER
        description: 'Provide a ticket search module on the home page with input placeholders "From", "To", and "Date", and a "Search" button.'
        dependencies:
          - REQ-1.1
        children:
          - id: REQ-3.1.1
            name: View home quick search module
            type: ATOMIC
            description: 'Display a ticket search module on the home page with input placeholders "From", "To", and "Date", and a "Search" button.'
            dependencies:
              - REQ-1.1
            scenarios:
              - name: Display the quick search module on the home page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page.'
                  - keyword: WHEN
                    content: 'Review the search area.'
                  - keyword: THEN
                    content: 'The page shows inputs with the placeholders "From", "To", and "Date", and a "Search" button.'
          - id: REQ-3.1.2
            name: Choose location by typing
            type: ATOMIC
            description: 'Allow the user to type pinyin or Chinese characters in the departure field labeled "From" or the arrival field labeled "To", show a fuzzy-matched list with the title "Top destinations" and matching cities and stations with both pinyin and Chinese names, and fill the input with the selected location after selection. ![image](./reference/location-selector-list.png)'
            dependencies:
              - REQ-3.1.1
            scenarios:
              - name: Select a location from the fuzzy-matched list
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page search module and the departure field or arrival field is focused.'
                  - keyword: WHEN
                    content: 'Type pinyin or Chinese characters in the input field and click one location in the matched list.'
                  - keyword: THEN
                    content: 'The page shows a matched list with the title "Top destinations" and matching city and station items with pinyin and Chinese names, and the input field is filled with the selected location name.'
          - id: REQ-3.1.3
            name: Choose location by tab list
            type: ATOMIC
            description: 'Allow the user to click the departure field labeled "From" or the arrival field labeled "To", open a tabbed location selector with the tabs "Popular", "ABCDE", "FGHIJ", "KLMNO", "PQRST", and "UVWXYZ", show city and station names with both pinyin and Chinese names, and fill the input with the selected location after selection. ![image](./reference/location-selector-form.png)'
            dependencies:
              - REQ-3.1.1
            scenarios:
              - name: Select a location from the tabbed selector
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page search module.'
                  - keyword: WHEN
                    content: 'Click the departure input field or arrival input field, switch to one tab in the location selector, and click one location item.'
                  - keyword: THEN
                    content: 'The page shows the tabs "Popular", "ABCDE", "FGHIJ", "KLMNO", "PQRST", and "UVWXYZ", shows matching city and station names with pinyin and Chinese names, and fills the input field with the selected location name.'
          - id: REQ-3.1.4
            name: Choose departure date
            type: ATOMIC
            description: 'Allow the user to click the departure date input labeled "Date", open a date picker, choose one departure date, and fill the input with the selected date. The date picker only allows dates from the current day through the next two weeks. Expired dates cannot be selected. ![image](./reference/date-selector.png)'
            dependencies:
              - REQ-3.1.1
            scenarios:
              - name: Select a valid departure date in the allowed range
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page search module.'
                  - keyword: WHEN
                    content: 'Click the date input field and click a valid date from the current day through the next two weeks.'
                  - keyword: THEN
                    content: 'The date picker opens, the selected date is accepted, and the date input field shows the selected date.'
              - name: Prevent selection of an expired date
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page search module with the date picker open.'
                  - keyword: WHEN
                    content: 'Try to click a date earlier than the current day or outside the next two weeks.'
                  - keyword: THEN
                    content: 'The expired date cannot be selected.'
          - id: REQ-3.1.5
            name: Search tickets with valid quick search conditions
            type: ATOMIC
            description: 'Allow the user to search by departure place, arrival place, and departure date from the home page and navigate to the ticket search results page after clicking "Search".'
            dependencies:
              - REQ-3.1.2
              - REQ-3.1.3
              - REQ-3.1.4
            scenarios:
              - name: Search tickets from the home page
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page with a valid departure place, arrival place, and departure date selected.'
                  - keyword: WHEN
                    content: 'Click the "Search" button.'
                  - keyword: THEN
                    content: 'Navigate to the ticket search results page and show results that match the search conditions.'
          - id: REQ-3.1.6
            name: Block search without valid departure place
            type: ATOMIC
            description: 'Reject ticket search when the departure place is not selected or the input is invalid and show the message "Please enter a valid departure place.".'
            dependencies:
              - REQ-3.1.1
            scenarios:
              - name: Search without a valid departure place
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the home page search module with the arrival place and departure date filled, and the departure place missing or invalid.'
                  - keyword: WHEN
                    content: 'Click the "Search" button.'
                  - keyword: THEN
                    content: 'The page shows "Please enter a valid departure place." and does not navigate to the search results page.'
          - id: REQ-3.1.7
            name: Block search without valid arrival place
            type: ATOMIC
            description: 'Reject ticket search when the arrival place is not selected or the input is invalid and show the message "Please enter a valid arrival place.".'
            dependencies:
