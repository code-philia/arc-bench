            scenarios:
              - name: Search upcoming trips with a valid keyword
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab with valid date filter settings.'
                  - keyword: WHEN
                    content: 'Enter a valid value in the input with the placeholder "Order number/train number/name" and click the "Search" button.'
                  - keyword: THEN
                    content: 'The page shows the upcoming orders that match both the date filter and the keyword.'
              - name: Reject an invalid upcoming trips search condition
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab.'
                  - keyword: WHEN
                    content: 'Enter an invalid search condition and click the "Search" button.'
                  - keyword: THEN
                    content: 'The page shows "Please enter a valid search condition.".'
