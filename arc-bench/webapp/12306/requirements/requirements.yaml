              - REQ-4.2.1
            scenarios:
              - name: Display uncompleted orders in a table
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab and there is at least one uncompleted order.'
                  - keyword: WHEN
                    content: 'Review the order table.'
                  - keyword: THEN
                    content: 'The page shows the columns "Train No.", "Departure date", "Departure station", "Arrival station", and "Operation", and each order group is followed by a "Pay" button.'
          - id: REQ-4.2.5
            name: Open payment page from uncompleted orders
            type: ATOMIC
            description: 'Allow the user to click the "Pay" button for one uncompleted order and enter the order payment page that shows the order information, a visible "Order details" area, and payment information.'
            dependencies:
              - REQ-4.2.4
              - REQ-5.3.5
            scenarios:
              - name: Continue payment from the uncompleted orders tab
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Uncompleted orders" tab with at least one displayed order group.'
                  - keyword: WHEN
                    content: 'Click the "Pay" button for one order group.'
                  - keyword: THEN
                    content: 'Navigate to the order payment page and show the order information, the "Order details" area, and payment information.'
          - id: REQ-4.2.6
            name: Show empty upcoming trips state
            type: ATOMIC
            description: 'When the "Upcoming trips" tab has no order, show "assets/empty.png" and the text "You don''t have any bookings or we can''t access your bookings at this time.".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Display the empty state in upcoming trips
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab and there is no upcoming trip.'
                  - keyword: WHEN
                    content: 'Review the tab content.'
                  - keyword: THEN
                    content: 'The page shows "assets/empty.png" and the text "You don''t have any bookings or we can''t access your bookings at this time.".'
          - id: REQ-4.2.7
            name: Open default ticket search from empty upcoming trips state
            type: ATOMIC
            description: 'When the "Upcoming trips" tab is empty, provide the link "You can make travel plans through the ticket reservation function." and navigate to the default ticket search results page after it is clicked.'
            dependencies:
              - REQ-4.2.6
              - REQ-3.2.14
            scenarios:
              - name: Open the default ticket search from the empty upcoming trips state
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the empty "Upcoming trips" tab.'
                  - keyword: WHEN
                    content: 'Click the link "You can make travel plans through the ticket reservation function.".'
                  - keyword: THEN
                    content: 'Navigate to the ticket search results page and show the default results for departure place Beijing, arrival place Shanghai, and the current date.'
          - id: REQ-4.2.8
            name: Filter upcoming trips by date range
            type: ATOMIC
            description: 'Provide a filter in the "Upcoming trips" tab with a dropdown containing "Search by booking date" and "Search by departure date", two date pickers for the range, and a "Search" button that shows the matching upcoming orders.'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Filter upcoming trips by a selected date type and range
                steps:
                  - keyword: GIVEN
                    content: 'The user is on the "Upcoming trips" tab.'
                  - keyword: WHEN
                    content: 'Choose one option from the date type dropdown, choose a start date and end date, and click the "Search" button.'
                  - keyword: THEN
                    content: 'The page shows the upcoming orders that match the selected date type and date range.'
          - id: REQ-4.2.9
            name: Search upcoming trips by keyword
            type: ATOMIC
            description: 'Provide a search input in the "Upcoming trips" tab with the placeholder "Order number/train number/name" and a "Search" button. The search uses both the date filter and the fuzzy search keyword. If the input is invalid, show the message "Please enter a valid search condition.".'
