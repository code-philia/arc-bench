      - 'The system contains a shelf named "Shelf 4.2.1".'
      - 'The system contains a shelf named "Shelf 4.3.1".'
      - 'The system contains a shelf named "Shelf 4.3.2".'
      - 'The system contains a deletable shelf named "Shelf 4.4.1".'
      - 'The system contains a deletable shelf named "Shelf 4.4.2".'
