id: ROOT
name: BookStack Knowledge Base System
type: FOLDER
description: >
  Web-based knowledge base system for browsing, organizing, and reading
  shelves, books, chapters, and pages.
dependencies: []
children:
  - id: REQ-1
    name: Homepage
    type: FOLDER
    description: Default landing page of the system. It presents the global navigation bar, search input, and visible entry points to core areas of the product. Reference image ![image](./reference/index.png)
    dependencies: []
    children:
      - id: REQ-1.1
        name: Open Homepage
        type: ATOMIC
        description: >
          Open the application and display the homepage. The page contains
          exactly one visible heading with accessible name `BookStack`.
        dependencies: []
        scenarios:
          - name: Open Homepage
            steps:
              - keyword: GIVEN
                content: The system is accessible.
              - keyword: WHEN
                content: The user opens the application URL.
              - keyword: THEN
                content: The homepage is displayed as the default page with exactly one visible heading named `BookStack`.
      - id: REQ-1.2
        name: Back to Homepage from Other Pages
        type: ATOMIC
        description: >
          Return to the homepage by activating exactly one button with
          accessible name `BookStack` in the global navigation. The button is
          keyboard accessible and is present on every non-homepage page used
          by this benchmark.
        dependencies:
          - REQ-1.1
        scenarios:
          - name: Back to Homepage from Other Pages
            steps:
              - keyword: GIVEN
                content: The user is on a non-homepage page and the global navigation bar is visible.
              - keyword: WHEN
                content: The user activates the unique button named `BookStack` in the global navigation.
              - keyword: THEN
                content: The system navigates to the homepage, where exactly one visible heading named `BookStack` is present.
  - id: REQ-2
    name: User Authentication and Session
    type: FOLDER
    description: Provides login entry and authenticated session state. The login page and the authenticated homepage state follow the referenced layouts. Login page ![image](./reference/login.png) Homepage after login ![image](./reference/index_after_login.png)
    dependencies:
      - REQ-1
    children:
      - id: REQ-2.1
        name: Enter Login Page
        type: ATOMIC
        description: >
          Open the login form from the homepage navigation bar. The login page
          contains exactly one visible heading named `Login` and exactly one
          form with role `form` and accessible name `Login form`.
        dependencies:
          - REQ-1.1
        scenarios:
          - name: Enter Login Page
            steps:
              - keyword: GIVEN
                content: The user is on the homepage and is not logged in.
              - keyword: WHEN
                content: The user activates the unique link or button named `Login` in the homepage navigation bar.
              - keyword: THEN
                content: The system displays the login form page with exactly one visible heading named `Login` and a form named `Login form`.
      - id: REQ-2.2
        name: Log In Successfully
        type: ATOMIC
        description: 'Authenticate with valid credentials and enter the authenticated homepage state. Seed data: verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
        dependencies:
          - REQ-2.1
        scenarios:
          - name: Log In Successfully
            steps:
              - keyword: GIVEN
                content: The user is on the login form page.
              - keyword: WHEN
                content: The user enters `bookstack_user@example.com` in the uniquely labelled email textbox `Email address`, enters `Password123!` in the uniquely labelled password textbox `Password`, checks the checkbox named `Remember Me`, and activates the `Login` button inside the `Login form`.
              - keyword: THEN
                content: The system logs the user in, returns to the homepage, and displays the nickname `BookStack User` in the authenticated navigation area.
  - id: REQ-3
    name: Authenticated Homepage Dashboard
    type: FOLDER
    description: Authenticated homepage dashboard that shows recent drafts, recently viewed items, most viewed favorites, recently updated pages, recent activity, and the dashboard controls shown in the reference image. Reference image ![image](./reference/index_after_login.png)
    dependencies:
      - REQ-2
    children:
      - id: REQ-3.1
        name: Enter Authenticated Homepage
        type: ATOMIC
        description: 'Display the dashboard layout after a successful login, including four visible named regions or headings: "My Recent Drafts", "My Recently Viewed", "My Most Viewed Favorites", and "Recently Updated Pages". Seed data: verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
        dependencies:
          - REQ-2.2
        scenarios:
          - name: Enter Authenticated Homepage
            steps:
              - keyword: GIVEN
                content: The user has logged in successfully.
              - keyword: WHEN
                content: The system finishes the post-login navigation.
              - keyword: THEN
                content: The authenticated homepage dashboard is displayed with visible headings or named regions exactly matching "My Recent Drafts", "My Recently Viewed", "My Most Viewed Favorites", and "Recently Updated Pages".
  - id: REQ-4
    name: Shelves Module
    type: FOLDER
    description: Shelves are top-level content containers with name, description, related books, and tags. This module covers listing shelves, opening shelf details, creating shelves, editing shelves, and deleting shelves. Shelf list page ![image](./reference/shelves.png)
    dependencies:
      - REQ-1
    children:
      - id: REQ-4.1
        name: View Shelf List
        type: ATOMIC
        description: 'Open the shelf list page from the global navigation bar. The navigation control may be a link or button named exactly "Shelves". The page exposes a visible heading "Shelves" and a named region "Shelf list" containing the seeded shelf "Shelf 4.1" as a unique link or button with that accessible name.'
        dependencies:
          - REQ-1.1
        scenarios:
          - name: View Shelf List
            steps:
              - keyword: GIVEN
                content: The user is on a page where the global navigation bar is visible.
              - keyword: WHEN
                content: The user activates the unique link or button named `Shelves` in the top navigation bar.
              - keyword: THEN
                content: The system displays the shelf list page with heading `Shelves` and a unique shelf entry named `Shelf 4.1` in the `Shelf list` region.
      - id: REQ-4.2
        name: Shelf Details Page
        type: FOLDER
        description: Shelf details page that shows shelf information, included books, and the related action panel. Reference image ![image](./reference/shelf.png)
        dependencies:
          - REQ-4.1
        children:
          - id: REQ-4.2.1
            name: Enter Shelf Details Page
            type: ATOMIC
            description: 'Open the details page of a shelf from the shelf list. The shelf list contains the shelf as a unique link or button named exactly "Shelf 4.2.1". The destination displays a visible heading named "Shelf 4.2.1" and a shelf action region.'
            dependencies:
              - REQ-4.1
            scenarios:
              - name: Enter Shelf Details Page
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf list page and at least one shelf is visible.
                  - keyword: WHEN
                    content: The user activates the unique link or button named `Shelf 4.2.1` in the shelf list.
                  - keyword: THEN
                    content: The system displays the shelf details page with a visible heading named `Shelf 4.2.1`.
      - id: REQ-4.3
        name: Create New Shelf
        type: FOLDER
        description: Provide a shelf creation flow with fields for shelf name, description, and tags. Reference image ![image](./reference/create_shelf.png)
        dependencies:
          - REQ-4.2
        children:
          - id: REQ-4.3.1
            name: Create Shelf
            type: ATOMIC
            description: 'Create a shelf from the shelf creation form. The form is exposed as role `form` named `Create shelf form` and contains uniquely labelled textboxes `Name` and `Description`, a control named `Shelf Tags` that reveals a textbox with exact placeholder `tag1, tag2`, a button named `Save Shelf`, and a button named `Cancel`. Seed data: shelf "Shelf 4.3.1".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Create Shelf
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates the unique button named `New Shelf`, fills `Name` with `Shelf Created 4.3.1`, fills `Description` with `Shelf created by REQ-4.3.1.`, activates `Shelf Tags`, fills the revealed `tag1, tag2` textbox with `created, shelf`, and activates the `Save Shelf` button.
                  - keyword: THEN
                    content: The system persists the shelf and displays the shelf list with exactly one entry named `Shelf Created 4.3.1`.
          - id: REQ-4.3.2
            name: Cancel Creation
            type: ATOMIC
            description: 'Exit the shelf creation flow without saving a new shelf. The creation form has a unique button named `Cancel`. Seed data: shelf "Shelf 4.3.2".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Cancel Creation
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf creation page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the shelf list and does not persist any shelf entered in the cancelled form.
      - id: REQ-4.4
        name: Delete Shelf
        type: FOLDER
        description: Delete the current shelf from the shelf details flow with confirmation. Confirmation page ![image](./reference/delete_shelves.png)
        dependencies:
          - REQ-4.2
        children:
          - id: REQ-4.4.1
            name: Confirm Delete Shelf
            type: ATOMIC
            description: 'Delete a shelf after the user confirms the action. The details action area contains a unique button named `Delete`. Confirmation displays a dialog or confirmation page containing a unique button named `Confirm Delete` and a unique button named `Cancel`. Seed data: deletable shelf "Shelf 4.4.1".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Confirm Delete Shelf
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `Delete`, then activates the unique `Confirm Delete` control on the confirmation view.
                  - keyword: THEN
                    content: The system deletes the shelf, returns to the shelf list page, and the entry named `Shelf 4.4.1` is absent.
          - id: REQ-4.4.2
            name: Cancel Delete Shelf
            type: ATOMIC
            description: 'Exit the delete flow without deleting the shelf. The confirmation view contains a unique button named `Cancel`. Seed data: deletable shelf "Shelf 4.4.2".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Cancel Delete Shelf
                steps:
                  - keyword: GIVEN
                    content: The user is on the delete shelf confirmation page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the shelf details page and keeps the shelf named `Shelf 4.4.2` unchanged.
      - id: REQ-4.5
        name: Edit Shelf
        type: FOLDER
        description: Provide a shelf editing flow for changing shelf information, related books, and tags. Shelf edit page ![image](./reference/edit_shelve.png)
        dependencies:
          - REQ-4.2
        children:
          - id: REQ-4.5.1
            name: Save Shelf Edits
            type: ATOMIC
            description: 'Save changes made in the shelf edit form. The form is exposed as role `form` named `Edit shelf form` and contains uniquely labelled textboxes `Name` and `Description`, a `Shelf Tags` control with a `tag1, tag2` textbox, and a button named `Save Shelf`. Seed data: editable shelf "Shelf 4.5.1" with valid initial description and tags.'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Save Shelf Edits
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `Edit`, fills `Name` with `Shelf Updated 4.5.1`, fills `Description` with `Shelf updated by REQ-4.5.1.`, activates `Shelf Tags`, fills `tag1, tag2` with `knowledge-base, docs`, and activates `Save Shelf`.
                  - keyword: THEN
                    content: The system saves the changes and returns to a shelf details page displaying `Shelf Updated 4.5.1`.
          - id: REQ-4.5.2
            name: Cancel Shelf Edits
            type: ATOMIC
            description: 'Exit the shelf editing flow without saving changes. The edit form has a unique button named `Cancel`. Seed data: editable shelf "Shelf 4.5.2" with valid initial description and tags.'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Cancel Shelf Edits
                steps:
                  - keyword: GIVEN
                    content: The user is on the shelf edit page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the shelf details page without applying the edits; `Shelf 4.5.2` remains unchanged.
  - id: REQ-5
    name: Books Module
    type: FOLDER
    description: Books contain a name, description, chapters, and pages. This module covers viewing books, opening book details, creating books, editing books, deleting books, and creating books from a shelf context. Book list page ![image](./reference/books.png)
    dependencies:
      - REQ-1
    children:
      - id: REQ-5.1
        name: View Books List
        type: ATOMIC
        description: 'Open the books list page from the global navigation bar. The navigation control may be a link or button named exactly "Books". The page exposes a visible heading "Books" and a named region "Book list" containing the seeded book "Book 5.1" as a unique link or button.'
        dependencies:
          - REQ-1.1
        scenarios:
          - name: View Books List
            steps:
              - keyword: GIVEN
                content: The user is on a page where the global navigation bar is visible.
              - keyword: WHEN
                content: The user activates the unique link or button named `Books` in the top navigation bar.
              - keyword: THEN
                content: The system displays the books list page with heading `Books`, a `Book list` region, and the seeded book `Book 5.1` as a unique link or button.
      - id: REQ-5.2
        name: Book Details Page
        type: FOLDER
        description: Book details page that can be opened from supported book entry points and displays the selected book information. Book details page ![image](./reference/book.png)
        dependencies:
          - REQ-5.1
        children:
          - id: REQ-5.2.1
            name: Enter Book Details Page through Book List Page
            type: ATOMIC
            description: 'Open a book details page from the books list. The book list contains a unique link or button named exactly "Book 5.2.1". The destination displays a visible heading named "Book 5.2.1".'
            dependencies:
              - REQ-5.1
            scenarios:
              - name: Enter Book Details Page through Book List Page
                steps:
                  - keyword: GIVEN
                    content: The user is on the books list page and at least one book card is visible.
                  - keyword: WHEN
                    content: The user activates the unique link or button named `Book 5.2.1` in the book list.
                  - keyword: THEN
                    content: The system displays the book details page with a visible heading named `Book 5.2.1`.
          - id: REQ-5.2.2
            name: Enter Book Details Page through Shelf Details Page
            type: ATOMIC
            description: 'Open a book details page from a shelf details page. The shelf contains a unique link or button named exactly "Book 5.2.2". The destination displays a visible heading named "Book 5.2.2". Seed data: shelf "Shelf 5.2.2" containing book "Book 5.2.2" with valid initial metadata.'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Enter Book Details Page through Shelf Details Page
                steps:
                  - keyword: GIVEN
                    content: The user is on a shelf details page and at least one book is listed on the shelf.
                  - keyword: WHEN
                    content: The user activates the unique link or button named `Book 5.2.2` in the shelf details page.
                  - keyword: THEN
                    content: The system displays the book details page with a visible heading named `Book 5.2.2`.
      - id: REQ-5.3
        name: Create Book in Book List Page
        type: FOLDER
        description: Provide a book creation flow from the books list page with fields for name, rich-text description, optional cover image, book tags, and default page template. Reference image ![image](./reference/create_book.png)
        dependencies:
          - REQ-5.1
        children:
          - id: REQ-5.3.1
            name: Fill out and Save Book
            type: ATOMIC
            description: 'Create a new book from the books list page. The form is exposed as role `form` named `Create book form` and contains uniquely labelled textboxes `Name` and `Description`, a `Book Tags` control that reveals a `tag1, tag2` textbox, and a button named `Save Book`.'
            dependencies:
              - REQ-5.1
            scenarios:
              - name: Fill out and Save Book
                steps:
                  - keyword: GIVEN
                    content: The user is on the books list page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `Create New Book`, fills `Name` with `Book Created 5.3.1`, fills `Description` with `Book created by REQ-5.3.1.`, activates `Book Tags`, fills `tag1, tag2` with `created, book`, and activates `Save Book`.
                  - keyword: THEN
                    content: The system creates the book and opens its details page, displaying `Book Created 5.3.1` as a visible heading.
          - id: REQ-5.3.2
            name: Cancel Creating Book
            type: ATOMIC
            description: 'Exit the book creation flow without creating a book. The creation form contains a unique button named `Cancel`.'
            dependencies:
              - REQ-5.1
            scenarios:
              - name: Cancel Creating Book
                steps:
                  - keyword: GIVEN
                    content: The user is on the create new book page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the books list and does not persist a book entered in the cancelled form.
      - id: REQ-5.4
        name: Edit Book
        type: FOLDER
        description: Provide a book editing flow for changing book metadata on the book details page. Reference image ![image](./reference/edit_book.png)
        dependencies:
          - REQ-5.2
        children:
          - id: REQ-5.4.1
            name: Save Book Edits
            type: ATOMIC
            description: 'Save changes made in the book edit form. The form is exposed as role `form` named `Edit book form` and contains uniquely labelled textboxes `Name` and `Description`, a `Book Tags` control with a `tag1, tag2` textbox, and a button named `Save Book`. Seed data: editable book "Book 5.4.1" with valid initial description and tags.'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Save Book Edits
                steps:
                  - keyword: GIVEN
                    content: The user is on the book details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `Edit`, fills `Name` with `Book Updated 5.4.1`, fills `Description` with `Book updated by REQ-5.4.1.`, activates `Book Tags`, fills `tag1, tag2` with `manual, handbook`, and activates `Save Book`.
                  - keyword: THEN
                    content: The system saves the changes and returns to a book details page displaying `Book Updated 5.4.1`.
          - id: REQ-5.4.2
            name: Cancel Book Edits
            type: ATOMIC
            description: 'Exit the book editing flow without saving changes. The edit form has a unique button named `Cancel`. Seed data: editable book "Book 5.4.2" with valid initial description and tags.'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Cancel Book Edits
                steps:
                  - keyword: GIVEN
                    content: The user is on the book edit page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the book details page without applying the edits; `Book 5.4.2` remains unchanged.
      - id: REQ-5.5
        name: Delete Book
        type: FOLDER
        description: Delete the current book from the book details flow with confirmation. Confirmation page ![image](./reference/delete_book.png)
        dependencies:
          - REQ-5.2
        children:
          - id: REQ-5.5.1
            name: Confirm Delete Book
            type: ATOMIC
            description: 'Delete a book after the user confirms the action. The details action area contains a unique button named `Delete`; the confirmation view contains a unique button named `Confirm Delete` and a unique button named `Cancel`. Seed data: deletable book "Book 5.5.1".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Confirm Delete Book
                steps:
                  - keyword: GIVEN
                    content: The user is on the book details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `Delete`, then activates the unique `Confirm Delete` control.
                  - keyword: THEN
                    content: The system deletes the book, returns to the books list page, and the entry named `Book 5.5.1` is absent.
          - id: REQ-5.5.2
            name: Cancel Delete Book
            type: ATOMIC
            description: 'Exit the delete flow without deleting the book. The confirmation view contains a unique button named `Cancel`. Seed data: deletable book "Book 5.5.2".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Cancel Delete Book
                steps:
                  - keyword: GIVEN
                    content: The user is on the delete book confirmation page.
                  - keyword: WHEN
                    content: The user activates the unique `Cancel` button.
                  - keyword: THEN
                    content: The system returns to the book details page and keeps `Book 5.5.2` unchanged.
      - id: REQ-5.6
        name: Create Book from Shelf Details Page
        type: FOLDER
        description: Provide a book creation flow from a shelf details page so the created book is associated with the current shelf.
        dependencies:
          - REQ-4.2
        children:
          - id: REQ-5.6.1
            name: Fill out and Save Book with Shelf
            type: ATOMIC
            description: 'Create a new book from the current shelf context. The form has uniquely labelled textboxes `Name` and `Description`, a `Book Tags` control with a `tag1, tag2` textbox, and a button named `Save Book`. The created book remains associated with the current shelf. Seed data: shelf "Shelf 5.6.1".'
            dependencies:
              - REQ-4.2.1
            scenarios:
              - name: Fill out and Save Book with Shelf
                steps:
                  - keyword: GIVEN
                    content: The user is on a shelf details page and can access the action panel.
                  - keyword: WHEN
                    content: The user activates `New Book`, fills `Name` with `Book Created 5.6.1`, fills `Description` with `Book created by REQ-5.6.1.`, activates `Book Tags`, fills `tag1, tag2` with `created, shelf-book`, and activates `Save Book`.
                  - keyword: THEN
                    content: The system creates the book, associates it with `Shelf 5.6.1`, and displays both names on the resulting page.
  - id: REQ-6
    name: Pages and Chapters Module
    type: FOLDER
    description: Pages are the basic reading units of a book, and chapters organize groups of pages. This module covers page editing, draft handling, chapter creation, and page reading.
    dependencies:
      - REQ-5
    children:
      - id: REQ-6.1
        name: Page Edit Page
        type: FOLDER
        description: Provide the page editing flow for creating pages, saving drafts, and deleting drafts. Page edit page ![image](./reference/page_draft.png) Delete draft confirmation page ![image](./reference/delete_draft.png)
        dependencies:
          - REQ-5.2
        children:
          - id: REQ-6.1.1
            name: Save Page
            type: ATOMIC
            description: 'Create and save a new page in a book. The editor contains exactly one textbox with placeholder `Page title`, exactly one multiline textbox with placeholder `Write your page content here...`, and a button named `Save Page`. Seed data: book "Book 6.1.1".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Save Page
                steps:
                  - keyword: GIVEN
                    content: The user is on a book details page.
                  - keyword: WHEN
                    content: The user activates `New Page`, fills `Page title` with `Page Created 6.1.1`, fills `Write your page content here...` with `Page content created by REQ-6.1.1.`, and activates `Save Page`.
                  - keyword: THEN
                    content: The system saves the page, adds exactly one entry named `Page Created 6.1.1` to the book, and returns to the book details page.
          - id: REQ-6.1.2
            name: Save Draft
            type: ATOMIC
            description: 'Save the current page content as a draft. The editor contains a textbox with placeholder `Page title`, a multiline textbox with placeholder `Write your page content here...`, and a button named `Save Draft`. Seed data: book "Book 6.1.2"; verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Save Draft
                steps:
                  - keyword: GIVEN
                    content: The authenticated user is on the page edit page.
                  - keyword: WHEN
                    content: The user fills `Page title` with `Page Draft 6.1.2`, fills `Write your page content here...` with `Draft content created by REQ-6.1.2.`, and activates `Save Draft`.
                  - keyword: THEN
                    content: The system stores the draft and shows exactly one entry named `Page Draft 6.1.2` in the `My Recent Drafts` list on the homepage.
          - id: REQ-6.1.3
            name: Delete Draft
            type: ATOMIC
            description: 'Delete an existing page draft. The draft editor exposes a unique control named `Delete Draft`; the confirmation view exposes a unique control named `Confirm Delete`. Seed data: book "Book 6.1.3" with existing draft page "Draft 6.1.3".'
            dependencies:
              - REQ-6.1.2
            scenarios:
              - name: Delete Draft
                steps:
                  - keyword: GIVEN
                    content: The user is on the page edit page and a draft already exists.
                  - keyword: WHEN
                    content: The user opens the draft actions, activates `Delete Draft`, and activates the unique `Confirm Delete` control.
                  - keyword: THEN
                    content: The system deletes the draft, returns to the related book details page, and the draft named `Draft 6.1.3` is absent.
      - id: REQ-6.2
        name: Create New Chapter
        type: FOLDER
        description: Provide a chapter creation flow from the book details page and support entering the chapter view after a chapter is available. Add chapter page ![image](./reference/create_chapter.png) Inside chapter page ![image](./reference/chapter.png)
        dependencies:
          - REQ-5.2
        children:
          - id: REQ-6.2.1
            name: Create Chapter
            type: ATOMIC
            description: 'Create a new chapter within a book. The chapter form contains uniquely labelled textboxes `Name` and `Description` and a button named `Save Chapter`. Seed data: book "Book 6.2.1".'
            dependencies:
              - REQ-5.2.1
            scenarios:
              - name: Create Chapter
                steps:
                  - keyword: GIVEN
                    content: The user is on the book details page.
                  - keyword: WHEN
                    content: The user activates `New Chapter`, fills `Name` with `Chapter Created 6.2.1`, fills `Description` with `Chapter created by REQ-6.2.1.`, and activates `Save Chapter`.
                  - keyword: THEN
                    content: The system creates the chapter and displays exactly one entry named `Chapter Created 6.2.1` in the current book.
      - id: REQ-6.3
        name: Page Reading Page
        type: FOLDER
        description: Page reading page that opens from a book or chapter page list and shows the selected page content. Reference image ![image](./reference/page.png)
        dependencies:
          - REQ-6.1
          - REQ-6.2
        children:
          - id: REQ-6.3.1
            name: Enter Page Reading Page
            type: ATOMIC
            description: 'Open the reading page for a selected page. The page entry is a unique link or button named exactly "Page 6.3.1"; activating it displays a visible heading named "Page 6.3.1" and the page content. Seed data: book "Book 6.3.1" with readable page "Page 6.3.1" and page content.'
            dependencies:
              - REQ-6.1.1
            scenarios:
              - name: Enter Page Reading Page
                steps:
                  - keyword: GIVEN
                    content: The user is viewing a list of pages within a book or chapter.
                  - keyword: WHEN
                    content: The user activates the unique link or button named `Page 6.3.1`.
                  - keyword: THEN
                    content: The system displays the page reading page with a visible heading named `Page 6.3.1`.
          - id: REQ-6.3.2
            name: Redirect to Page Edit Page
            type: ATOMIC
            description: 'Open the page edit flow from the page reading page. The action area contains a unique button named `Edit`. The editor contains a button named `Save Page`. Seed data: book "Book 6.3.2" with editable page "Page 6.3.2" and page content.'
            dependencies:
              - REQ-6.3.1
            scenarios:
              - name: Redirect to Page Edit Page
                steps:
                  - keyword: GIVEN
                    content: The user is on the page reading page and can access the action area.
                  - keyword: WHEN
                    content: The user activates the unique `Edit` button.
                  - keyword: THEN
                    content: The system opens the edit page for the current page, where the `Save Page` button is visible.
  - id: REQ-7
    name: Recently Viewed
    type: FOLDER
    description: Display recently viewed shelves, books, chapters, and pages in the `My Recently Viewed` list on the homepage, with up to ten records.
    dependencies:
      - REQ-4
      - REQ-5
      - REQ-6
    children:
      - id: REQ-7.1
        name: Add to Recently Viewed
        type: ATOMIC
        description: 'Add supported content to the recently viewed list after it is opened. Seed data: shelf "Shelf 7.1"; verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
        dependencies:
          - REQ-4.2.1
          - REQ-5.2.1
          - REQ-6.3.1
        scenarios:
          - name: Add to Recently Viewed
            steps:
              - keyword: GIVEN
                content: The user is browsing supported content pages in the system.
              - keyword: WHEN
                content: The user opens a shelf details page, book details page, page reading page, or chapter view.
              - keyword: THEN
                content: The system adds the item to `My Recently Viewed` on the homepage.
      - id: REQ-7.2
        name: Quick Navigation from Recently Viewed
        type: ATOMIC
        description: 'Open a content page from the recently viewed list. Seed data: shelf "Shelf 7.2"; verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
        dependencies:
          - REQ-7.1
        scenarios:
          - name: Quick Navigation from Recently Viewed
            steps:
              - keyword: GIVEN
                content: The authenticated homepage shows `My Recently Viewed` with at least one item.
              - keyword: WHEN
                content: The user activates the unique link or button named after the target item in `My Recently Viewed`.
              - keyword: THEN
                content: The system opens the corresponding content page.
  - id: REQ-8
    name: Favorites
    type: FOLDER
    description: Allow shelves, books, chapters, and pages to be favorited and displayed in the `My Most Viewed Favorites` list on the homepage, with up to four items. A dedicated favorites page is available for viewing the complete list. Favorites page ![image](./reference/favourites.png)
    dependencies:
      - REQ-4
      - REQ-5
      - REQ-6
    children:
      - id: REQ-8.1
        name: Favorite Items
        type: ATOMIC
        description: 'Add supported content items to the favorites list. The current content page contains exactly one button named `Favorite` with aria-pressed=false. Activating it changes the same control to name `Unfavorite` with aria-pressed=true. Seed data: book "Book 8.1".'
        dependencies:
          - REQ-4.2.1
          - REQ-5.2.1
          - REQ-6.3.1
          - REQ-6.2.1
        scenarios:
          - name: Favorite Items
            steps:
              - keyword: GIVEN
                content: The user is on a supported shelf, book, chapter, or page view.
              - keyword: WHEN
                content: The user activates the unique button named `Favorite` for the current content item.
              - keyword: THEN
                content: The system adds the item to the favorites list and changes the control to `Unfavorite` with aria-pressed=true.
      - id: REQ-8.2
        name: Quick Navigation from Favorites
        type: ATOMIC
        description: 'Open a content page from a favorites list entry. Seed data: book "Book 8.2"; verified account with nickname "BookStack User", email "bookstack_user@example.com", and password "Password123!".'
        dependencies:
          - REQ-8.1
        scenarios:
          - name: Quick Navigation from Favorites
            steps:
              - keyword: GIVEN
                content: The authenticated homepage or favorites page shows at least one favorite item.
              - keyword: WHEN
                content: The user activates the unique link or button named after the target item in `My Most Viewed Favorites`.
              - keyword: THEN
                content: The system opens the corresponding content page.
