version: 1
baseline:
  description: Shared Stack Overflow homepage, navigation, feed, and primary post data needed for core
    discovery and participation flows.
  fixtures:
  - public_homepage
  - homepage_questions
  - question_detail
  - tags_catalog
fixtures:
  public_homepage:
    description: Anonymous homepage shell with global header, left navigation, right sidebar widgets,
      and central question feed.
    scope: global
    mutable: false
    providedState:
      auth: anonymous
    entities:
      pages:
      - key: home
        title: Stack Overflow home
        sections:
        - header
        - left-nav
        - feed
        - right-sidebar
  homepage_questions:
    description: Question feed containing several visible question summaries with titles, tags, votes,
      answers, and views.
    scope: global
    mutable: false
    providedState:
      feed: populated
    entities:
      questions:
      - key: q_css_center
        title: How to center a div in CSS without flexbox?
        tags:
        - css
        - html
        votes: 12
        answers: 3
        views: 128
      - key: q_react_state
        title: Why is my React state update asynchronous?
        tags:
        - reactjs
        - javascript
        votes: 9
        answers: 2
        views: 84
  registered_user:
    description: Standard authenticated account that can sign in, post content, vote, and access personal
      account areas.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      role: standard-user
    entities:
      users:
      - key: user_standard
        email: stack_user@example.com
        password: Password123!
        displayName: Stack User
  elevated_user:
    description: A user with elevated privileges such as moderator or owner access for protected profile
      and reputation views.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      role: elevated-user
    entities:
      users:
      - key: user_moderator
        email: mod_user@example.com
        password: Password123!
        displayName: Moderator User
  registration_candidate:
    description: Fresh account identity that can register successfully with a unique email and valid password.
    scope: per_test
    mutable: true
    providedState:
      registration: available
    entities:
      users:
      - key: new_user
        email: new_stack_user@example.com
        password: Password123!
  profile_summary:
    description: Profile summary data with visible user statistics, recent activity, and profile-navigation
      tabs.
    scope: global
    mutable: false
    providedState:
      profile: summary-visible
    entities:
      profiles:
      - key: profile_standard
        displayName: Stack User
        reputation: 1420
        badges:
          gold: 1
          silver: 3
          bronze: 12
  editable_profile:
    description: Editable profile fields including public bio, title, location, social links, and full
      name.
    scope: per_test
    mutable: true
    providedState:
      profile: editable
    entities:
      profiles:
      - key: editable_profile
        displayName: Stack User
        location: Shanghai
        title: Backend Engineer
        aboutMe: I enjoy building APIs and developer tooling.
  ask_question_state:
    description: Question creation state with writable title, markdown body, and tag inputs, plus preview
      and validation guidance.
    scope: per_test
    mutable: true
    providedState:
      askQuestion: enabled
    entities:
      drafts:
      - key: draft_question
        title: How can I safely retry an idempotent HTTP request in Node.js?
        body: I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests.
          I have already tried a simple timeout wrapper, but I need guidance on backoff, duplicate suppression,
          and observable error handling across network failures. What patterns should I use and how should
          I structure retries so the client remains correct and debuggable?
        tags:
        - node.js
        - http
        - retry
  question_detail:
    description: A question detail page with title, formatted body, tags, metadata, voting controls, author
      card, and visible comments section.
    scope: global
    mutable: false
    providedState:
      question: detail-visible
    entities:
      questions:
      - key: question_main
        title: How can I safely retry an idempotent HTTP request in Node.js?
        tags:
        - node.js
        - http
        - retry
        views: 321
        votes: 7
  owned_question:
    description: A question owned by the signed-in user that can be edited, summarized, revision-tracked,
      and deleted.
    scope: per_test
    mutable: true
    providedState:
      question: owned-by-user
    entities:
      questions:
      - key: owned_question
        title: How can I cache npm metadata requests efficiently?
        tags:
        - node.js
        - npm
        - caching
  votable_question:
    description: A question with visible vote arrows and an initial score that can be upvoted and downvoted
      by the current user.
    scope: per_test
    mutable: true
    providedState:
      questionVotes: enabled
    entities:
      questions:
      - key: votable_question
        votes: 7
        authorReputation: 1520
  question_owner:
    description: Question owner context that can accept an answer on their own question.
    scope: per_test
    mutable: true
    providedState:
      questionOwner: authenticated
    entities:
      questions:
      - key: owned_question_for_accept
        title: How to parse multipart uploads in Go?
  answer_thread:
    description: A question page with multiple answers, sorting controls, votes, and one editable answer
      owned by the signed-in user.
    scope: global
    mutable: false
    providedState:
      answers: present
    entities:
      answers:
      - key: answer_owned
        score: 5
        accepted: false
        author: Stack User
      - key: answer_other
        score: 8
        accepted: true
        author: Helpful User
  own_answer:
    description: An answer owned by the signed-in user that can be edited, cancelled, validated, or deleted.
    scope: per_test
    mutable: true
    providedState:
      answer: owned-by-user
    entities:
      answers:
      - key: editable_answer
        body: Use exponential backoff and idempotency keys.
  comment_thread:
    description: Question and answer comments with one expandable thread, at least one upvotable comment,
      and one parent comment that supports replies.
    scope: global
    mutable: false
    providedState:
      comments: present
    entities:
      comments:
      - key: comment_parent
        body: Can you share what you tried so far?
        author: Helpful User
        votes: 2
      - key: comment_extra
        body: This helped me too.
        author: Another User
        votes: 1
  own_comment:
    description: A comment owned by the current user and still within the edit window so it can be edited
      or deleted.
    scope: per_test
    mutable: true
    providedState:
      comment: owned-by-user
    entities:
      comments:
      - key: own_comment
        body: I can reproduce this behavior locally.
  tags_catalog:
    description: Tag list containing popular tags with descriptions, counts, and detail pages that can
      be watched by a user.
    scope: global
    mutable: false
    providedState:
      tags: catalog-visible
    entities:
      tags:
      - key: python
        name: python
        description: Questions about Python
        questionCount: 1000
      - key: javascript
        name: javascript
        description: Questions about JavaScript
        questionCount: 1200
  tagged_questions:
    description: Questions associated with a specific tag so the tag detail page can filter the feed correctly.
    scope: global
    mutable: false
    providedState:
      tagFilter: ready
    entities:
      questions:
      - key: tagged_python
        title: Why does Python close over loop variables?
        tags:
        - python
      - key: tagged_js
        title: How do closures work in JavaScript?
        tags:
        - javascript
  search_index:
    description: Indexed questions that can appear in header search suggestions and search results ranked
      by relevance.
    scope: global
    mutable: false
    providedState:
      search: indexed
    entities:
      questions:
      - key: search_css
        title: How to center a div in CSS without flexbox?
      - key: search_state
        title: Why is my React state update asynchronous?
  custom_filter_state:
    description: Question list page with filter panel, sort options, tag criteria, and a custom filter
      save dialog available.
    scope: per_test
    mutable: true
    providedState:
      customFilter: available
    entities:
      filters:
      - key: unanswered_python
        title: Python unanswered
  reputation_history:
    description: Chronological reputation log with linked posts, reasons, and point changes visible to
      authorized viewers.
    scope: global
    mutable: false
    providedState:
      reputation: visible
    entities:
      reputationEvents:
      - key: rep_answer_upvote
        reason: Answer upvoted
        change: 10
      - key: rep_question_upvote
        reason: Question upvoted
        change: 5
  badge_progress:
    description: A user state close to or meeting badge rules so badge notifications and earned badges
      can be displayed.
    scope: per_test
    mutable: true
    providedState:
      badges: awardable
    entities:
      badges:
      - key: teacher
        name: Teacher
        trigger: 10 upvotes on answer
  badge_catalog:
    description: Full site badge catalog organized by tier with descriptions and earn counts.
    scope: global
    mutable: false
    providedState:
      badges: catalog-visible
    entities:
      badges:
      - key: teacher
        tier: bronze
        name: Teacher
      - key: great_answer
        tier: gold
        name: Great Answer
  activity_profile:
    description: Profile activity area with summary, answers, questions, reputation, votes, and responses
      views available from the activity sidebar.
    scope: global
    mutable: false
    providedState:
      activity: visible
    entities:
      activityItems:
      - key: activity_answer
        type: answer
      - key: activity_question
        type: question
      - key: activity_response
        type: response
