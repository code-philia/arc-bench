version: 1
baseline:
  description: Shared BookStack homepage and navigation data required for core browsing flows.
  fixtures:
  - public_homepage
  - sample_shelf
  - sample_book
fixtures:
  public_homepage:
    description: Anonymous homepage with global navigation, logo, and search input.
    scope: global
    mutable: false
    providedState:
      auth: anonymous
    entities:
      pages:
      - key: home
        sections:
        - navigation
        - search
  authenticated_user:
    description: User account that can sign in and reach the authenticated BookStack dashboard.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
    entities:
      users:
      - key: bookstack_user
        nickname: BookStack User
        email: bookstack_user@example.com
        password: Password123!
  authenticated_dashboard:
    description: Authenticated homepage state with dashboard cards and activity sections populated.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      dashboard: visible
    entities:
      users:
      - key: dashboard_user
        nickname: Dashboard User
  sample_shelf:
    description: At least one visible shelf that can be opened from the shelf list.
    scope: global
    mutable: false
    providedState:
      shelf: visible
    entities:
      shelves:
      - key: shelf_alpha
        name: Shelf Alpha
        description: Reference shelf
  editable_shelf:
    description: Shelf data and permissions needed for create, edit, and delete shelf flows.
    scope: per_test
    mutable: true
    providedState:
      shelf: editable
    entities:
      shelves:
      - key: editable_shelf
        name: Editable Shelf
  sample_book:
    description: At least one visible book card and a book details page with action panel access.
    scope: global
    mutable: false
    providedState:
      book: visible
    entities:
      books:
      - key: book_alpha
        name: Book Alpha
        description: Reference book
  editable_book:
    description: Book data and permissions needed for create, edit, and delete book flows.
    scope: per_test
    mutable: true
    providedState:
      book: editable
    entities:
      books:
      - key: editable_book
        name: Editable Book
  sample_page:
    description: At least one page available from a book or chapter page list.
    scope: global
    mutable: false
    providedState:
      page: visible
    entities:
      pages:
      - key: page_alpha
        name: Page Alpha
  sample_chapter:
    description: At least one chapter available within a book.
    scope: global
    mutable: false
    providedState:
      chapter: visible
    entities:
      chapters:
      - key: chapter_alpha
        name: Chapter Alpha
  draft_page:
    description: Page editing state with a draft that can be saved and deleted.
    scope: per_test
    mutable: true
    providedState:
      draft: present
    entities:
      pages:
      - key: draft_page
        name: Draft Page
  recently_viewed_content:
    description: Supported shelf, book, chapter, and page records that can appear in My Recently Viewed.
    scope: per_test
    mutable: true
    providedState:
      recentlyViewed: populated
    entities:
      entries:
      - key: recent_entry
        type: page
        name: Recent Page
  favorite_content:
    description: Supported content items that can be favorited and shown in favorites lists.
    scope: per_test
    mutable: true
    providedState:
      favorites: populated
    entities:
      entries:
      - key: favorite_entry
        type: book
        name: Favorite Book
  recently_updated_page:
    description: A recently created or edited page visible in Recently Updated Pages.
    scope: per_test
    mutable: true
    providedState:
      recentlyUpdated: visible
    entities:
      pages:
      - key: updated_page
        name: Updated Page
