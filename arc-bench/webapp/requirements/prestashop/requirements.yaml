id: ROOT
name: PrestaShop E-commerce Website
type: FOLDER
description: PrestaShop B2C e-commerce website requirements covering storefront browsing, shopping cart, checkout, user authentication, and account management.
dependencies: []
children:
- id: REQ-0
  name: Visit Homepage
  type: ATOMIC
  description: Visit the homepage of the website.
  dependencies: []
  scenarios:
  - name: Visit Homepage
    steps:
    - keyword: GIVEN
      content: User is in a web browser.
    - keyword: WHEN
      content: Enter the website URL
    - keyword: THEN
      content: Display homepage with navigation bar, carousel, and product display area
- id: REQ-1
  name: Global Navigation
  type: FOLDER
  description: 'Global navigation bar component at the top of the website, fixed display on all pages.

    Layout structure (left to right): Logo | Category Menu | Search Box | Language Selector | User Entry | Cart Icon.

    Navigation bar uses responsive design, collapses to hamburger menu on mobile.

    ![image](./reference/navigation.png)'
  dependencies: []
  children:
  - id: REQ-1.1
    name: View Global Navigation
    type: ATOMIC
    description: View the global navigation bar.
    dependencies:
    - REQ-0
    scenarios:
    - name: View Global Navigation
      steps:
      - keyword: GIVEN
        content: User is on a store page and can see the website header.
      - keyword: WHEN
        content: Review the navigation area
      - keyword: THEN
        content: Display Logo, category menu, search box, language selector, user entry, cart icon
  - id: REQ-1.2
    name: Logo Click Returns Home
    type: ATOMIC
    description: Click website Logo to return to homepage.
    dependencies: []
    scenarios:
    - name: Logo Click Returns Home
      steps:
      - keyword: GIVEN
        content: User is on any page and can see the website Logo in the header.
      - keyword: WHEN
        content: Click the website Logo
      - keyword: THEN
        content: Navigate back to homepage
  - id: REQ-1.3
    name: Category Menu
    type: FOLDER
    description: 'Horizontally arranged top-level category menu (e.g., CLOTHES, ACCESSORIES, ART).

      Hover to expand dropdown menu showing subcategories, supports multi-level nesting.'
    dependencies: []
    children:
    - id: REQ-1.3.1
      name: Expand Category Menu
      type: ATOMIC
      description: Expand the category menu to see subcategories.
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Expand Category Menu
        steps:
        - keyword: GIVEN
          content: User can see the category menu in the header.
        - keyword: WHEN
          content: Hover over a category (e.g., CLOTHES)
        - keyword: THEN
          content: Expand dropdown menu showing subcategories (e.g., Men, Women)
    - id: REQ-1.3.2
      name: Enter Subcategory
      type: ATOMIC
      description: Click a subcategory to navigate to its product list.
      dependencies:
      - REQ-1.3.1
      scenarios:
      - name: Enter Subcategory
        steps:
        - keyword: GIVEN
          content: The category dropdown menu is expanded.
        - keyword: WHEN
          content: Click a subcategory link in the dropdown
        - keyword: THEN
          content: Navigate to the corresponding subcategory product list page
  - id: REQ-1.4
    name: Search Function
    type: ATOMIC
    description: 'Top global search box, supports product keyword search.

      Real-time search suggestion dropdown displays while typing.

      Press Enter or click search button to navigate to search results page.

      ![image](./reference/search.png)'
    dependencies: []
    scenarios:
    - name: Search Function
      steps:
      - keyword: GIVEN
        content: User can see the global search box in the header.
      - keyword: WHEN
        content: Click the search box
      - keyword: THEN
        content: Search box gains focus
      - keyword: WHEN
        content: Enter a search keyword (e.g., shirt)
      - keyword: THEN
        content: Auto-expand search suggestion dropdown
      - keyword: WHEN
        content: Press Enter or click the search button
      - keyword: THEN
        content: Navigate to search results page showing matching products
  - id: REQ-1.5
    name: User Entry
    type: ATOMIC
    description: User login/register/my account entry link.
    dependencies: []
    scenarios:
    - name: User Entry
      steps:
      - keyword: GIVEN
        content: User can see the user entry link in the header.
      - keyword: WHEN
        content: Click "Sign in" link
      - keyword: THEN
        content: Navigate to login page
  - id: REQ-1.6
    name: Cart Icon
    type: FOLDER
    description: Display number of items in cart, click to enter cart page.
    dependencies: []
    children:
    - id: REQ-1.6.1
      name: View Cart Count
      type: ATOMIC
      description: View the number of items in the cart.
      dependencies:
      - REQ-1.1
      scenarios:
      - name: View Cart Count
        steps:
        - keyword: GIVEN
          content: User can see the cart icon in the header.
        - keyword: WHEN
          content: Review the cart icon
        - keyword: THEN
          content: Display number of items in cart
    - id: REQ-1.6.2
      name: Click to Enter Cart
      type: ATOMIC
      description: Click the cart icon to navigate to the cart page.
      dependencies:
      - REQ-1.6.1
      scenarios:
      - name: Click to Enter Cart
        steps:
        - keyword: GIVEN
          content: User can see the cart icon in the header.
        - keyword: WHEN
          content: Click the cart icon
        - keyword: THEN
          content: Navigate to cart page
- id: REQ-2
  name: Homepage
  type: FOLDER
  description: 'Homepage content display, including carousel ads, popular products, promotions, Newsletter subscription, and footer.

    ![image](./reference/homepage.png)'
  dependencies:
  - REQ-1
  children:
  - id: REQ-2.1
    name: Browse Homepage
    type: ATOMIC
    description: Browse the homepage.
    dependencies:
    - REQ-0
    scenarios:
    - name: Browse Homepage
      steps:
      - keyword: GIVEN
        content: User is on the homepage.
      - keyword: WHEN
        content: View each area of the homepage
      - keyword: THEN
        content: Display carousel, Popular Products, promotion area, Newsletter subscription, footer
  - id: REQ-2.2
    name: Carousel Banner
    type: FOLDER
    description: Top carousel area on homepage, displaying promotional information and marketing content.
    dependencies: []
    children:
    - id: REQ-2.2.1
      name: Carousel Auto Switch
      type: ATOMIC
      description: Carousel automatically switches to next slide.
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Carousel Auto Switch
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Wait a few seconds
        - keyword: THEN
          content: Carousel automatically switches to next slide
    - id: REQ-2.2.2
      name: Manual Carousel Switch
      type: ATOMIC
      description: Manually switch carousel slide.
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Manual Carousel Switch
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Click left/right arrow buttons
        - keyword: THEN
          content: Manually switch carousel slide
    - id: REQ-2.2.3
      name: Click Carousel to Navigate
      type: ATOMIC
      description: Click carousel content to navigate to corresponding marketing page.
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Click Carousel to Navigate
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Click carousel content
        - keyword: THEN
          content: Navigate to corresponding marketing page
  - id: REQ-2.3
    name: Popular Products Section
    type: ATOMIC
    description: Popular products grid on homepage, containing product cards, quick view, and wishlist functionality.
    dependencies: []
    scenarios:
    - name: Popular Products Section
      steps:
      - keyword: GIVEN
        content: User can see the Popular Products section on the homepage.
      - keyword: WHEN
        content: Click a popular product
      - keyword: THEN
        content: Navigate to the product detail page.
- id: REQ-3
  name: Category Page
  type: FOLDER
  description: 'Product listing page for displaying category products, search results, brand products, and comparable listing contexts.

    Page layout: Left sidebar filters + Right product grid.

    Top shows breadcrumb navigation, category title, product count, and sort dropdown.

    Products displayed in card grid format, supports pagination.

    ![image](./reference/category.png)'
  dependencies:
  - REQ-1
  children:
  - id: REQ-3.1
    name: Enter Category Page
    type: ATOMIC
    description: Enter a category page.
    dependencies:
    - REQ-1.3.1
    scenarios:
    - name: Enter Category Page
      steps:
      - keyword: GIVEN
        content: User can see the category menu in the header.
      - keyword: WHEN
        content: Click a product category in navigation menu
      - keyword: THEN
        content: Navigate to that category's product list page
  - id: REQ-3.2
    name: Breadcrumb Navigation
    type: FOLDER
    description: Display current page hierarchy path, supports returning to parent page.
    dependencies: []
    children:
    - id: REQ-3.2.1
      name: View Breadcrumb Navigation
      type: ATOMIC
      description: View the breadcrumb navigation on a category page.
      dependencies:
      - REQ-3.1
      scenarios:
      - name: View Breadcrumb Navigation
        steps:
        - keyword: GIVEN
          content: User is on a category page.
        - keyword: WHEN
          content: View breadcrumb navigation
        - keyword: THEN
          content: Display current page path (e.g., Home > Clothes > Men)
    - id: REQ-3.2.2
      name: Navigate Back via Breadcrumb
      type: ATOMIC
      description: Navigate back to parent category via breadcrumb.
      dependencies:
      - REQ-3.2.1
      scenarios:
      - name: Navigate Back via Breadcrumb
        steps:
        - keyword: GIVEN
          content: Breadcrumb navigation is visible.
        - keyword: WHEN
          content: Click parent category name in breadcrumb
        - keyword: THEN
          content: Navigate to parent category page
  - id: REQ-3.3
    name: Category Description
    type: ATOMIC
    description: Category description text displayed on category page.
    dependencies: []
    scenarios:
    - name: Category Description
      steps:
      - keyword: GIVEN
        content: User is on a category page.
      - keyword: WHEN
        content: View top of page
      - keyword: THEN
        content: Display category name and description text
  - id: REQ-3.4
    name: Subcategory Navigation
    type: ATOMIC
    description: Quick entry links to subcategories under current category.
    dependencies: []
    scenarios:
    - name: Subcategory Navigation
      steps:
      - keyword: GIVEN
        content: User is on a category page and can see subcategory links.
      - keyword: WHEN
        content: Click a subcategory link
      - keyword: THEN
        content: Navigate to subcategory product list
  - id: REQ-3.5
    name: Product Grid Display
    type: FOLDER
    description: Display product cards in grid format, including image, name, price, discount label, quick view, wishlist control, and related card actions.
    dependencies: []
    children:
    - id: REQ-3.5.1
      name: View Product Cards
      type: ATOMIC
      description: View product cards in the product grid.
      dependencies:
      - REQ-3.1
      scenarios:
      - name: View Product Cards
        steps:
        - keyword: GIVEN
          content: User is on a category page and can see the product grid.
        - keyword: WHEN
          content: Review product list area
        - keyword: THEN
          content: Each product card displays product image, name, price (regular/sale), discount label
    - id: REQ-3.5.2
      name: Hover to Show Action Buttons
      type: ATOMIC
      description: Hover over a product card to show action buttons.
      dependencies:
      - REQ-3.5.1
      scenarios:
      - name: Hover to Show Action Buttons
        steps:
        - keyword: GIVEN
          content: User can see product cards in the product grid.
        - keyword: WHEN
          content: Hover mouse over a product card
        - keyword: THEN
          content: Display Quick view button and wishlist button, show color preview if multiple colors available
    - id: REQ-3.5.3
      name: Click to Enter Detail Page
      type: ATOMIC
      description: Click a product card to enter detail page.
      dependencies:
      - REQ-3.5.1
      scenarios:
      - name: Click to Enter Detail Page
        steps:
        - keyword: GIVEN
          content: User can see product cards in the product grid.
        - keyword: WHEN
          content: Click a product card
        - keyword: THEN
          content: Navigate to product detail page
  - id: REQ-3.6
    name: Filters
    type: FOLDER
    description: Sidebar filters, supports filtering by availability, on sale, categories, size, color, composition, price, brand, and related product attributes.
    dependencies: []
    children:
    - id: REQ-3.6.1
      name: Filter by Availability
      type: ATOMIC
      description: Filter products by availability.
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Availability
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page.
        - keyword: WHEN
          content: Check "In stock" filter option
        - keyword: THEN
          content: Product list only shows in-stock products, URL parameters update
    - id: REQ-3.6.2
      name: Filter by Color
      type: ATOMIC
      description: Filter products by color.
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Color
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page.
        - keyword: WHEN
          content: Click a color filter option (e.g., White)
        - keyword: THEN
          content: Product list only shows products in that color
    - id: REQ-3.6.3
      name: Filter by Price Range
      type: ATOMIC
      description: Filter products by price range.
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Price Range
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page.
        - keyword: WHEN
          content: Drag price slider to set price range
        - keyword: THEN
          content: Product list only shows products within price range
    - id: REQ-3.6.4
      name: Clear All Filters
      type: ATOMIC
      description: Clear all applied filters.
      dependencies:
      - REQ-3.6.1
      scenarios:
      - name: Clear All Filters
        steps:
        - keyword: GIVEN
          content: At least one filter is applied on the category page.
        - keyword: WHEN
          content: Click "Clear all" button
        - keyword: THEN
          content: Reset all filter conditions, show all products
  - id: REQ-3.7
    name: Sort Function
    type: ATOMIC
    description: Product list sort dropdown menu, supports sorting by relevance, sales, name, price, reference. ![image](./reference/sort.png)
    dependencies: []
    scenarios:
    - name: Sort Function
      steps:
      - keyword: GIVEN
        content: User can see the sort dropdown on a category page.
      - keyword: WHEN
        content: Click "Sort by" dropdown menu
      - keyword: THEN
        content: Display sort options list
      - keyword: WHEN
        content: Select "Price, low to high"
      - keyword: THEN
        content: Product list re-sorts by price from low to high
  - id: REQ-3.8
    name: Product Count Display
    type: ATOMIC
    description: Display total product count under current filter conditions.
    dependencies: []
    scenarios:
    - name: Product Count Display
      steps:
      - keyword: GIVEN
        content: User is on a category page and can see the product list header.
      - keyword: WHEN
        content: Review product list area
      - keyword: THEN
        content: Display total product count (e.g., "Showing 1-12 of 18 item(s)")
  - id: REQ-3.9
    name: Pagination
    type: ATOMIC
    description: Product list pagination navigation, supports browsing more products by page.
    dependencies: []
    scenarios:
    - name: Pagination
      steps:
      - keyword: GIVEN
        content: User is on a category page with multiple pages of products.
      - keyword: WHEN
        content: Click next page button or a page number
      - keyword: THEN
        content: Display next page of products
- id: REQ-4
  name: Product Detail Page
  type: FOLDER
  description: 'Single product detailed information page.

    Page layout: Left image area (main image + thumbnails) + Right info area (name, price, variant selection, add to cart button).

    Bottom shows product description tabs, review section, related product recommendations.

    Price and stock dynamically update when selecting different variants.

    ![image](./reference/product_detail.png)'
  dependencies:
  - REQ-3
  children:
  - id: REQ-4.1
    name: Enter Product Detail Page
    type: ATOMIC
    description: Enter a product detail page.
    dependencies:
    - REQ-3.5.1
    scenarios:
    - name: Enter Product Detail Page
      steps:
      - keyword: GIVEN
        content: User can see product cards in a category page product grid.
      - keyword: WHEN
        content: Click any product in product list
      - keyword: THEN
        content: Navigate to that product's detail page
  - id: REQ-4.2
    name: Product Image Area
    type: ATOMIC
    description: Product image display area, including main image, thumbnail switching, and large image viewer.
    dependencies: []
    scenarios:
    - name: Product Image Area
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: View main image area
      - keyword: THEN
        content: Display product main image
  - id: REQ-4.3
    name: Product Basic Info
    type: ATOMIC
    description: Product basic information display, including name, price (tax incl./excl.), regular price and discount, discount percentage, description.
    dependencies: []
    scenarios:
    - name: Product Basic Info
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: Review product info area
      - keyword: THEN
        content: Display product name, current price, regular price (if discounted), discount percentage, tax info, product description
  - id: REQ-4.4
    name: Variant Selection
    type: ATOMIC
    description: Product variant selector, including size, color, and other attribute selection.
    dependencies: []
    scenarios:
    - name: Variant Selection
      steps:
      - keyword: GIVEN
        content: User is on a product detail page and can see the variant selectors.
      - keyword: WHEN
        content: Click Size dropdown menu to select size
      - keyword: THEN
        content: Selected size displays in dropdown
      - keyword: WHEN
        content: Click color swatch to select color
      - keyword: THEN
        content: Selected color highlights, product image may switch to corresponding color
  - id: REQ-4.5
    name: Quantity Selection
    type: FOLDER
    description: Product quantity selector, supports plus/minus buttons, direct input, and stock warning.
    dependencies: []
    children:
    - id: REQ-4.5.1
      name: Increase Quantity
      type: ATOMIC
      description: Increase product quantity.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Increase Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Click "+" button
        - keyword: THEN
          content: Quantity increases by 1
    - id: REQ-4.5.2
      name: Decrease Quantity
      type: ATOMIC
      description: Decrease product quantity.
      dependencies:
      - REQ-4.5.1
      scenarios:
      - name: Decrease Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Click "-" button
        - keyword: THEN
          content: Quantity decreases by 1, minimum is 1
    - id: REQ-4.5.3
      name: Direct Input Quantity
      type: ATOMIC
      description: Directly enter product quantity.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Direct Input Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Directly enter number in quantity input box
        - keyword: THEN
          content: Quantity updates to entered value
    - id: REQ-4.5.4
      name: Stock Insufficient Warning
      type: ATOMIC
      description: Display warning when entered quantity exceeds stock.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Stock Insufficient Warning
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Enter quantity exceeding stock
        - keyword: THEN
          content: Display stock insufficient warning message
  - id: REQ-4.6
    name: Add to Cart
    type: FOLDER
    description: 'Add product to cart functionality, includes success modal, continue shopping, and proceed to checkout options.

      ![image](./reference/add_to_cart.png)'
    dependencies:
    - REQ-4.4
    - REQ-4.5
    children:
    - id: REQ-4.6.1
      name: Add Product to Cart
      type: ATOMIC
      description: Add a product to the cart.
      dependencies:
      - REQ-4.4
      scenarios:
      - name: Add Product to Cart
        steps:
        - keyword: GIVEN
          content: User is on a product detail page with a selected variant and quantity.
        - keyword: WHEN
          content: Click "ADD TO CART" button
        - keyword: THEN
          content: Pop up success modal showing "Product successfully added to your shopping cart"
    - id: REQ-4.6.2
      name: Continue Shopping After Add
      type: ATOMIC
      description: Continue shopping after adding product to cart.
      dependencies:
      - REQ-4.6.1
      scenarios:
      - name: Continue Shopping After Add
        steps:
        - keyword: GIVEN
          content: The add-to-cart success modal is visible.
        - keyword: WHEN
          content: Click "Continue shopping" button
        - keyword: THEN
          content: Close modal, return to current product page to continue browsing
    - id: REQ-4.6.3
      name: Proceed to Checkout After Add
      type: ATOMIC
      description: Proceed to checkout after adding product to cart.
      dependencies:
      - REQ-4.6.1
      scenarios:
      - name: Proceed to Checkout After Add
        steps:
        - keyword: GIVEN
          content: The add-to-cart success modal is visible.
        - keyword: WHEN
          content: Click "Proceed to checkout" button
        - keyword: THEN
          content: Navigate to cart page
  - id: REQ-4.7
    name: Add to Wishlist
    type: ATOMIC
    description: Add product to user wishlist (requires login).
    dependencies: []
    scenarios:
    - name: Add to Wishlist
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: Click wishlist button
      - keyword: THEN
        content: If logged in, product added to wishlist with confirmation; if not logged in, prompt to login
  - id: REQ-4.8
    name: Product Description Tabs
    type: FOLDER
    description: Tabs at bottom of product detail, including Description and Product Details (reference, data sheet, features).
    dependencies: []
    children:
    - id: REQ-4.8.1
      name: View Description Tab
      type: ATOMIC
      description: View the product description tab.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: View Description Tab
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the product tabs.
        - keyword: WHEN
          content: Click "Description" tab
        - keyword: THEN
          content: Display detailed product description text
    - id: REQ-4.8.2
      name: View Product Details Tab
      type: ATOMIC
      description: View the product details tab.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: View Product Details Tab
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the product tabs.
        - keyword: WHEN
          content: Click "Product Details" tab
        - keyword: THEN
          content: Display product specifications table (reference, data sheet, specific features)
  - id: REQ-4.9
    name: Product Reviews
    type: FOLDER
    description: Product review functionality, including review list, rating display, and add review (requires login).
    dependencies: []
    children:
    - id: REQ-4.9.1
      name: View Review List
      type: ATOMIC
      description: View the product review list.
      dependencies:
      - REQ-4.1
      scenarios:
      - name: View Review List
        steps:
        - keyword: GIVEN
          content: User is on a product detail page.
        - keyword: WHEN
          content: Scroll to review area
        - keyword: THEN
          content: Display review list and average rating
    - id: REQ-4.9.2
      name: Add Review
      type: ATOMIC
      description: Add a review for the product.
      dependencies:
      - REQ-4.9.1
      scenarios:
      - name: Add Review
        steps:
        - keyword: GIVEN
          content: User can see the review section on a product detail page.
        - keyword: WHEN
          content: Click add review button
        - keyword: THEN
          content: If logged in, display review form; if not logged in, prompt to login
  - id: REQ-4.10
    name: Recently Viewed
    type: ATOMIC
    description: Display user's recently viewed products.
    dependencies: []
    scenarios:
    - name: Recently Viewed
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: Scroll to page bottom
      - keyword: THEN
        content: Display recently viewed products list
  - id: REQ-4.11
    name: Related Products
    type: ATOMIC
    description: Recommend other products in the same category.
    dependencies: []
    scenarios:
    - name: Related Products
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: Scroll to recommendations area
      - keyword: THEN
        content: Display related products from same category
- id: REQ-5
  name: Shopping Cart
  type: FOLDER
  description: 'Shopping cart page, displaying products user has added.

    List includes: product image, name, variant, unit price, quantity (editable), subtotal, delete button.

    Right side shows summary: items subtotal, shipping fee, discount, total (tax incl.).

