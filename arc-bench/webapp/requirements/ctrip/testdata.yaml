version: 1
baseline:
  description: Shared Ctrip homepage, navigation, and entry data needed for core travel-service flows.
  fixtures:
  - public_homepage
  - flight_search_home
  - airport_guide_catalog
fixtures:
  public_homepage:
    description: Anonymous homepage state with top navigation, login and registration entries, and travel-service
      navigation visible.
    scope: global
    mutable: false
    providedState:
      auth: anonymous
    entities:
      pages:
      - key: homepage
        title: Ctrip home
        sections:
        - header
        - account-entry
        - search-entry
        - travel-navigation
  registered_account:
    description: Standard existing account that can sign in by account and password and reach authenticated
      home state.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
    entities:
      users:
      - key: registered_user
        username: ctrip_user
        email: ctrip_user@example.com
        mobile: '13800000010'
        password: Travel1234
  sms_login_account:
    description: Existing account that can complete SMS-code login with a valid mobile number and a six-digit
      verification code.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      loginMethod: sms
    entities:
      users:
      - key: sms_user
        mobile: '13800000011'
        verificationCode: '123456'
  registration_candidate:
    description: Fresh mobile-number identity that can complete a normal registration flow and also be
      used for validation exceptions.
    scope: per_test
    mutable: true
    providedState:
      auth: anonymous
      registration: available
    entities:
      users:
      - key: new_user
        mobile: '13800000012'
        verificationCode: '123456'
        password: Travel1234
        weakPassword: '1234567'
  flight_search_home:
    description: Homepage state with the flight quick-search form available, including trip type, city
      pickers, date pickers, and search history entry points.
    scope: global
    mutable: false
    providedState:
      flightSearch: ready
    entities:
      routes:
      - key: route_ctu_can
        from: 成都
        to: 广州
        departureDate: '2026-07-21'
        returnDate: '2026-07-25'
  flight_search_history:
    description: Recent flight search history items that can be reused from the homepage or flight-status
      form.
    scope: per_test
    mutable: true
    providedState:
      searchHistory: present
    entities:
      history:
      - key: history_ctu_can
        label: 成都 - 广州
      - key: history_jd5162
        label: JD5162
  flight_result_dataset:
    description: Search results with multiple carriers, dates, fares, nonstop and transfer options, and
      fare-detail expansion states.
    scope: global
    mutable: false
    providedState:
      flightResults: multi-row
    entities:
      flights:
      - key: mu1234
        airline: 东方航空
        from: 成都
        to: 广州
        departureTime: 08:00
        arrivalTime: '10:45'
        price: ¥460
        nonstop: true
      - key: cz3201
        airline: 南方航空
        from: 成都
        to: 广州
        departureTime: '12:20'
        arrivalTime: '15:05'
        price: ¥520
        nonstop: true
      - key: 3u8801
        airline: 四川航空
        from: 成都
        to: 广州
        departureTime: '19:30'
        arrivalTime: '23:10'
        price: ¥399
        nonstop: false
  flight_no_result_route:
    description: A route and date combination that legitimately produces an empty flight-results state.
    scope: global
    mutable: false
    providedState:
      flightResults: empty
    entities:
      routes:
      - key: route_empty
        from: 北海
        to: 火星城
        departureDate: '2026-07-23'
  booking_user:
    description: Authenticated traveler who can enter the flight booking page and submit an order.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      booking: enabled
    entities:
      users:
      - key: booking_user
        username: booking_user
        email: booking_user@example.com
        mobile: '13800000013'
        password: Travel1234
  booking_page_dataset:
    description: Booking-page state with selectable passengers, valid ID input rules, ancillary services,
      and price breakdown widgets.
    scope: global
    mutable: false
    providedState:
      bookingPage: loaded
    entities:
      travelers:
      - key: traveler_primary
        name: 张三
        idNumber: '110101199001011234'
        mobile: '13800000014'
      services:
      - key: combo_insurance
        name: 保险套餐
      - key: extra_baggage
        name: 额外行李额
      - key: airport_dropoff
        name: 接送机
      - key: lounge
        name: 贵宾休息室
  order_center_user:
    description: Authenticated user who can access the order center and open order details, payment, and
      cancellation actions.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      orders: available
    entities:
      users:
      - key: order_user
        username: order_user
        email: order_user@example.com
        mobile: '13800000015'
        password: Travel1234
  order_center_dataset:
    description: Order center data containing pending-payment, not-traveled, pending-review, and historical
      orders with searchable order numbers.
    scope: global
    mutable: false
    providedState:
      orderCenter: populated
    entities:
      orders:
      - key: order_pending
        orderNumber: CTRIP20260721001
        status: 待支付
      - key: order_future
        orderNumber: CTRIP20260721002
        status: 未出行
      - key: order_review
        orderNumber: CTRIP20260721003
        status: 待点评
  personal_center_user:
    description: Authenticated user who can open the personal center and all common-information sections.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      personalCenter: enabled
    entities:
      users:
      - key: personal_user
        username: personal_user
        email: personal_user@example.com
        mobile: '13800000016'
        password: Travel1234
  traveler_records:
    description: Reusable traveler records for search, add, single delete, and batch delete flows.
    scope: per_test
    mutable: true
    providedState:
      travelerRecords: present
    entities:
      travelers:
      - key: traveler_existing
        name: 李四
        idNumber: '110101199202022222'
      - key: traveler_second
        name: 王五
        idNumber: '110101199303033333'
  address_records:
    description: Address book entries that can be listed, created, and deleted from the personal center.
    scope: per_test
    mutable: true
    providedState:
      addresses: present
    entities:
      addresses:
      - key: addr_home
        consignee: 张三
        city: 上海
        detail: 浦东新区世纪大道100号
  contact_records:
    description: Contact records that can be searched, marked as default, and batch deleted.
    scope: per_test
    mutable: true
    providedState:
      contacts: present
    entities:
      contacts:
      - key: contact_a
        name: 张三
        mobile: '13800000017'
      - key: contact_b
        name: 李四
        mobile: '13800000018'
  invoice_title_records:
    description: Invoice-title records supporting search, company-title creation, VAT-special fields,
      and delete operations.
    scope: per_test
    mutable: true
    providedState:
      invoiceTitles: present
    entities:
      invoiceTitles:
      - key: invoice_company
        title: 上海示例科技有限公司
        taxId: 91310000123456789A
  profile_user:
    description: Authenticated account with editable profile fields plus masked mobile and email information.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      profile: editable
    entities:
      users:
      - key: profile_user
        username: profile_user
        email: profile_user@example.com
        mobile: '13800000019'
        password: Travel1234
  security_profile:
    description: Security-center state with password-change, phone-change, and email-change entries enabled.
    scope: per_test
    mutable: true
    providedState:
      securityCenter: enabled
    entities:
      securityIndicators:
      - key: password
        label: 登录密码
      - key: phone
        label: 手机号
      - key: email
        label: 邮箱
  phone_binding_state:
    description: A currently bound phone number plus identity-verification material for changing the bound
      phone.
    scope: per_test
    mutable: true
    providedState:
      boundPhone: present
    entities:
      phones:
      - key: bound_phone
        masked: 138****0019
        newPhone: '13800000020'
  email_binding_state:
    description: A currently bound email plus verification requirements for switching to a new email address.
    scope: per_test
    mutable: true
    providedState:
      boundEmail: present
    entities:
      emails:
      - key: bound_email
        masked: pro***@example.com
        newEmail: profile_user_next@example.com
  flight_status_dataset:
    description: Flight-status data that supports search by flight number and by route, with list and
      detail views.
    scope: global
    mutable: false
    providedState:
      flightStatus: available
    entities:
      flights:
      - key: jd5162
        flightNumber: JD5162
        from: 上海
        to: 北京
        status: 计划起飞
        gate: H18
  flight_status_history:
    description: Recent flight-status queries that can be reused or cleared from the history list.
    scope: per_test
    mutable: true
    providedState:
      flightStatusHistory: present
    entities:
      history:
      - key: status_jd5162
        label: JD5162
  reimbursement_user:
    description: Authenticated user who can open the reimbursement-voucher service hub.
    scope: per_test
    mutable: true
    providedState:
      auth: authenticated
      reimbursement: enabled
    entities:
      users:
      - key: voucher_user
        username: voucher_user
        email: voucher_user@example.com
        mobile: '13800000021'
        password: Travel1234
  reimbursement_orders:
    description: Orders that are eligible for voucher issuance plus historical issuances for the completed
      tab.
    scope: global
    mutable: false
    providedState:
      reimbursementOrders: mixed
    entities:
      orders:
      - key: voucher_pending
        status: 待开具
      - key: voucher_completed
        status: 已完成
  airport_guide_catalog:
    description: Airport-guide home data with popular airports, alphabetical indexes, and weather-card
      content.
    scope: global
    mutable: false
    providedState:
      airportGuide: catalog-ready
    entities:
      airports:
      - key: pek
        name: 北京首都
      - key: pvg
        name: 上海浦东
      - key: can
        name: 广州白云
      - key: ctu
        name: 成都
  airport_detail_dataset:
    description: Airport detail content including overview text, transportation timetable, service phone
      numbers, and weather details.
    scope: global
    mutable: false
    providedState:
      airportDetail: loaded
    entities:
      airportDetails:
      - key: pek_detail
        name: 北京首都
        checkInCounters: H14-H25
        medicalPhone: 010-6454XXXX
