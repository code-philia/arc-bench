id: ROOT
name: PrestaShop E-commerce Website
type: FOLDER
description: 'PrestaShop B2C e-commerce website requirements covering storefront browsing, shopping cart, checkout, user authentication, and account management.'
dependencies: []
children:
- id: REQ-0
  name: Visit Homepage
  type: ATOMIC
  description: 'Visit the homepage and expose the navigation bar, the textbox with accessible name "Search", the region with accessible name "Carousel", and the visible "Popular products" area.'
  dependencies: []
  scenarios:
  - name: Visit Homepage
    steps:
    - keyword: GIVEN
      content: User is in a web browser.
    - keyword: WHEN
      content: Enter the website URL
    - keyword: THEN
      content: Display the homepage with the navigation bar, a search box, the Carousel, and the Popular products area
- id: REQ-1
  name: Global Navigation
  type: FOLDER
  description: 'Global navigation bar component at the top of the website, fixed display on all pages. Layout structure (left to right): Logo | Category Menu | Search Box | Language Selector | User Entry | Cart Icon. Navigation bar uses responsive design, collapses to hamburger menu on mobile. ![image](./reference/navigation.png)'
  dependencies: []
  children:
  - id: REQ-1.1
    name: View Global Navigation
    type: ATOMIC
    description: 'View the global navigation bar. Its navigation landmark has accessible name "Main navigation"; it contains the link with accessible name "Logo", visible button "Clothes", textbox with accessible name "Search", combobox with accessible name "Language", link with accessible name "Sign in", and link with accessible name "Shopping cart".'
    dependencies:
    - REQ-0
    scenarios:
    - name: View Global Navigation
      steps:
      - keyword: GIVEN
        content: User is on a store page and can see the website header.
      - keyword: WHEN
        content: Review the navigation area
      - keyword: THEN
        content: Display Logo, category menu, search box, language selector, user entry, cart icon
  - id: REQ-1.2
    name: Logo Click Returns Home
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to leave the homepage, then click the link with accessible name "Logo" to return to the region with accessible name "Carousel".'
    dependencies: []
    scenarios:
    - name: Logo Click Returns Home
      steps:
      - keyword: GIVEN
        content: User is on any page and can see the website Logo in the header.
      - keyword: WHEN
        content: Click the website Logo
      - keyword: THEN
        content: Navigate back to homepage
  - id: REQ-1.3
    name: Category Menu
    type: FOLDER
    description: 'Horizontally arranged top-level category menu (e.g., CLOTHES, ACCESSORIES, ART). Hover to expand dropdown menu showing subcategories, supports multi-level nesting. The catalog contains the top-level category "CLOTHES" with the subcategories "Men" and "Women".'
    dependencies: []
    children:
    - id: REQ-1.3.1
      name: Expand Category Menu
      type: ATOMIC
      description: 'Hover the visible button "Clothes" to expose visible links "Men" and "Women".'
      dependencies:
      - REQ-1.1
      scenarios:
      - name: Expand Category Menu
        steps:
        - keyword: GIVEN
          content: User can see the category menu in the header.
        - keyword: WHEN
          content: Hover over a category (e.g., CLOTHES)
        - keyword: THEN
          content: Expand dropdown menu showing subcategories (e.g., Men, Women)
    - id: REQ-1.3.2
      name: Enter Subcategory
      type: ATOMIC
      description: 'From the expanded visible button "Clothes", follow the visible link "Men" to the heading "Men" and combobox "Sort by".'
      dependencies:
      - REQ-1.3.1
      scenarios:
      - name: Enter Subcategory
        steps:
        - keyword: GIVEN
          content: The category dropdown menu is expanded.
        - keyword: WHEN
          content: Click a subcategory link in the dropdown
        - keyword: THEN
          content: Navigate to the corresponding subcategory product list page
  - id: REQ-1.4
    name: Search Function
    type: ATOMIC
    description: 'The textbox with accessible name "Search" supports product keyword search. Typing "skirt" displays a button named "Printed summer skirt €35.00"; pressing Enter opens heading "Search results for “skirt”" and link "Printed summer skirt". ![image](./reference/search.png)'
    dependencies: []
    scenarios:
    - name: Search Function
      steps:
      - keyword: GIVEN
        content: User can see the global search box in the header.
      - keyword: WHEN
        content: Click the search box
      - keyword: THEN
        content: Search box gains focus
      - keyword: WHEN
        content: Enter the search keyword "skirt"
      - keyword: THEN
        content: Auto-expand search suggestion dropdown
      - keyword: WHEN
        content: Press Enter or click the search button
      - keyword: THEN
        content: Navigate to search results page showing matching products
  - id: REQ-1.5
    name: User Entry
    type: ATOMIC
    description: 'The signed-out user entry is a link with accessible name "Sign in"; it opens heading "Sign in" with fields named "Email address *" and "Password *". The signed-in account entry is a link with accessible name "My account".'
    dependencies: []
    scenarios:
    - name: User Entry
      steps:
      - keyword: GIVEN
        content: User can see the user entry link in the header.
      - keyword: WHEN
        content: Click "Sign in" link
      - keyword: THEN
        content: Navigate to login page
  - id: REQ-1.6
    name: Cart Icon
    type: FOLDER
    description: Display number of items in cart, click to enter cart page.
    dependencies: []
    children:
    - id: REQ-1.6.1
      name: View Cart Count
      type: ATOMIC
      description: 'The header link with accessible name "Shopping cart" displays a numeric item count.'
      dependencies:
      - REQ-1.1
      scenarios:
      - name: View Cart Count
        steps:
        - keyword: GIVEN
          content: User can see the cart icon in the header.
        - keyword: WHEN
          content: Review the cart icon
        - keyword: THEN
          content: Display number of items in cart
    - id: REQ-1.6.2
      name: Click to Enter Cart
      type: ATOMIC
      description: 'Follow the header link with accessible name "Shopping cart" to heading "Shopping cart".'
      dependencies:
      - REQ-1.6.1
      scenarios:
      - name: Click to Enter Cart
        steps:
        - keyword: GIVEN
          content: User can see the cart icon in the header.
        - keyword: WHEN
          content: Click the cart icon
        - keyword: THEN
          content: Navigate to cart page
- id: REQ-2
  name: Homepage
  type: FOLDER
  description: 'Homepage content includes region with accessible name "Carousel", heading "Popular products", textbox with accessible name "Newsletter email", and the footer contentinfo landmark. ![image](./reference/homepage.png)'
  dependencies:
  - REQ-1
  children:
  - id: REQ-2.1
    name: Browse Homepage
    type: ATOMIC
    description: 'Browse the homepage and verify region "Carousel", heading "Popular products", textbox "Newsletter email", and footer contentinfo landmark.'
    dependencies:
    - REQ-0
    scenarios:
    - name: Browse Homepage
      steps:
      - keyword: GIVEN
        content: User is on the homepage.
      - keyword: WHEN
        content: View each area of the homepage
      - keyword: THEN
        content: Display the Carousel, Popular products, promotion area, Newsletter email field, and footer
  - id: REQ-2.2
    name: Carousel Banner
    type: FOLDER
    description: Top carousel area on homepage, displaying promotional information and marketing content.
    dependencies: []
    children:
    - id: REQ-2.2.1
      name: Carousel Auto Switch
      type: ATOMIC
      description: 'The homepage exposes a region with accessible name "Carousel". It contains at least two visually different slides and automatically switches within five seconds.'
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Carousel Auto Switch
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Wait up to five seconds.
        - keyword: THEN
          content: The visible carousel content changes to the next visually different slide.
    - id: REQ-2.2.2
      name: Manual Carousel Switch
      type: ATOMIC
      description: 'In the region with accessible name "Carousel", activate visible button "Next slide" to display the next visually different slide.'
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Manual Carousel Switch
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Click left/right arrow buttons
        - keyword: THEN
          content: Manually switch carousel slide
    - id: REQ-2.2.3
      name: Click Carousel to Navigate
      type: ATOMIC
      description: 'Activate the first carousel link with accessible name "Shop new arrivals" to navigate to heading "Men".'
      dependencies:
      - REQ-2.1
      scenarios:
      - name: Click Carousel to Navigate
        steps:
        - keyword: GIVEN
          content: The homepage carousel is visible.
        - keyword: WHEN
          content: Click carousel content
        - keyword: THEN
          content: Navigate to corresponding marketing page
  - id: REQ-2.3
    name: Popular Products Section
    type: ATOMIC
    description: 'The visible "Popular products" grid includes link "Hummingbird detail t-shirt"; following it opens heading "Hummingbird detail t-shirt".'
    dependencies: []
    scenarios:
    - name: Popular Products Section
      steps:
      - keyword: GIVEN
        content: User can see the Popular Products section on the homepage.
      - keyword: WHEN
        content: Click a popular product
      - keyword: THEN
        content: Navigate to the product detail page.
- id: REQ-3
  name: Category Page
  type: FOLDER
  description: 'Product listing page for displaying category products, search results, brand products, and comparable listing contexts. Page layout: Left sidebar filters + Right product grid. Top shows breadcrumb navigation, category title, product count, and sort dropdown. Products displayed in card grid format, supports pagination. ![image](./reference/category.png) The Men category has at least 14 products across multiple pages, including "Hummingbird detail t-shirt", "Hummingbird cart t-shirt", "Hummingbird checkout-step t-shirt", "Hummingbird order-confirmation t-shirt", "Hummingbird order-complete t-shirt", "Hummingbird order-history t-shirt", "Hummingbird wishlist t-shirt", "White t-shirt", "Black mug", and "Printed summer skirt"; these products have stock, color, price, sale, and category attributes suitable for filtering, sorting, pagination, and keyword search.'
  dependencies:
  - REQ-1
  children:
  - id: REQ-3.1
    name: Enter Category Page
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter heading "Men"; the page exposes combobox "Sort by" and visible text beginning "Showing".'
    dependencies:
    - REQ-1.3.1
    scenarios:
    - name: Enter Category Page
      steps:
      - keyword: GIVEN
        content: User can see the category menu in the header.
      - keyword: WHEN
        content: Click a product category in navigation menu
      - keyword: THEN
        content: Navigate to that category's product list page
  - id: REQ-3.2
    name: Breadcrumb Navigation
    type: FOLDER
    description: Display current page hierarchy path, supports returning to parent page.
    dependencies: []
    children:
    - id: REQ-3.2.1
      name: View Breadcrumb Navigation
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men", then view navigation landmark with accessible name "Breadcrumb" containing links "Home" and "Clothes" and visible text "Men".'
      dependencies:
      - REQ-3.1
      scenarios:
      - name: View Breadcrumb Navigation
        steps:
        - keyword: GIVEN
          content: User is on a category page.
        - keyword: WHEN
          content: View breadcrumb navigation
        - keyword: THEN
          content: Display current page path (e.g., Home > Clothes > Men)
    - id: REQ-3.2.2
      name: Navigate Back via Breadcrumb
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men", then follow link "Clothes" inside navigation landmark with accessible name "Breadcrumb" to heading "Clothes".'
      dependencies:
      - REQ-3.2.1
      scenarios:
      - name: Navigate Back via Breadcrumb
        steps:
        - keyword: GIVEN
          content: Breadcrumb navigation is visible.
        - keyword: WHEN
          content: Click parent category name in breadcrumb
        - keyword: THEN
          content: Navigate to parent category page
  - id: REQ-3.3
    name: Category Description
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter heading "Men"; the page displays visible text beginning "Description:".'
    dependencies: []
    scenarios:
    - name: Category Description
      steps:
      - keyword: GIVEN
        content: User is on a category page.
      - keyword: WHEN
        content: View top of page
      - keyword: THEN
        content: Display category name and description text
  - id: REQ-3.4
    name: Subcategory Navigation
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter the category. A region with accessible name "Subcategories" contains link "Women"; following it opens heading "Women" and combobox "Sort by".'
    dependencies: []
    scenarios:
    - name: Subcategory Navigation
      steps:
      - keyword: GIVEN
        content: User is on a category page and can see subcategory links.
      - keyword: WHEN
        content: Click a subcategory link
      - keyword: THEN
        content: Navigate to subcategory product list
  - id: REQ-3.5
    name: Product Grid Display
    type: FOLDER
    description: Display product cards in grid format, including image, name, price, discount label, quick view, wishlist control, and related card actions.
    dependencies: []
    children:
    - id: REQ-3.5.1
      name: View Product Cards
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category. The article containing "Hummingbird detail t-shirt" displays visible "€19.99", "€24.99", and "Sale".'
      dependencies:
      - REQ-3.1
      scenarios:
      - name: View Product Cards
        steps:
        - keyword: GIVEN
          content: User is on a category page and can see the product grid.
        - keyword: WHEN
          content: Review product list area
        - keyword: THEN
          content: Each product card displays product image, name, price (regular/sale), discount label
    - id: REQ-3.5.2
      name: Hover to Show Action Buttons
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category, then hover the article containing "Hummingbird detail t-shirt" to expose buttons "Quick view" and "Add to wishlist".'
      dependencies:
      - REQ-3.5.1
      scenarios:
      - name: Hover to Show Action Buttons
        steps:
        - keyword: GIVEN
          content: User can see product cards in the product grid.
        - keyword: WHEN
          content: Hover mouse over a product card
        - keyword: THEN
          content: Display Quick view button and wishlist button, show color preview if multiple colors available
    - id: REQ-3.5.3
      name: Click to Enter Detail Page
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category, then follow link "Hummingbird detail t-shirt" to heading "Hummingbird detail t-shirt" and button "ADD TO CART".'
      dependencies:
      - REQ-3.5.1
      scenarios:
      - name: Click to Enter Detail Page
        steps:
        - keyword: GIVEN
          content: User can see product cards in the product grid.
        - keyword: WHEN
          content: Click a product card
        - keyword: THEN
          content: Navigate to product detail page
  - id: REQ-3.6
    name: Filters
    type: FOLDER
    description: Sidebar filters, supports filtering by availability, on sale, categories, size, color, composition, price, brand, and related product attributes.
    dependencies: []
    children:
    - id: REQ-3.6.1
      name: Filter by Availability
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category, then select checkbox "In stock". The article containing "White t-shirt" remains and the article containing "Black mug" is omitted.'
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Availability
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page.
        - keyword: WHEN
          content: Check "In stock" filter option
        - keyword: THEN
          content: The product list shows the in-stock "White t-shirt" and does not show the out-of-stock "Black mug".
    - id: REQ-3.6.2
      name: Filter by Color
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category, then select radio "White". White product articles remain and the article containing "Black mug" is omitted.'
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Color
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page.
        - keyword: WHEN
          content: Click a color filter option (e.g., White)
        - keyword: THEN
          content: Product list only shows products in that color
    - id: REQ-3.6.3
      name: Filter by Price Range
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category, then set slider "Maximum price" to 20. The article containing "White t-shirt" remains and the article containing "Printed summer shirt" is omitted.'
      dependencies:
      - REQ-3.1
      scenarios:
      - name: Filter by Price Range
        steps:
        - keyword: GIVEN
          content: User can see the sidebar filters on a category page, and the category includes products priced within and outside the chosen range.
        - keyword: WHEN
          content: Drag price slider to set price range
        - keyword: THEN
          content: Product list only shows products within price range
    - id: REQ-3.6.4
      name: Clear All Filters
      type: ATOMIC
      description: 'Use visible button "Clothes" and link "Men" to enter the category. After selecting checkbox "In stock", activate button "Clear all"; articles containing "White t-shirt" and "Black mug" display again.'
      dependencies:
      - REQ-3.6.1
      scenarios:
      - name: Clear All Filters
        steps:
        - keyword: GIVEN
          content: At least one filter is applied on the category page.
        - keyword: WHEN
          content: Click "Clear all" button
        - keyword: THEN
          content: Reset all filter conditions, show all products
  - id: REQ-3.7
    name: Sort Function
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter the category. The combobox "Sort by" includes option "Price, low to high"; selecting it places the article containing "Black mug" at visible "€11.90" first. ![image](./reference/sort.png)'
    dependencies: []
    scenarios:
    - name: Sort Function
      steps:
      - keyword: GIVEN
        content: User can see the sort dropdown on a category page.
      - keyword: WHEN
        content: Click "Sort by" dropdown menu
      - keyword: THEN
        content: Display sort options list
      - keyword: WHEN
        content: Select "Price, low to high"
      - keyword: THEN
        content: Product list re-sorts by price from low to high
  - id: REQ-3.8
    name: Product Count Display
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter the category and display visible text matching "Showing <start>-<end> of <total> item(s)".'
    dependencies: []
    scenarios:
    - name: Product Count Display
      steps:
      - keyword: GIVEN
        content: User is on a category page and can see the product list header.
      - keyword: WHEN
        content: Review product list area
      - keyword: THEN
        content: Display total product count (e.g., "Showing 1-12 of 18 item(s)")
  - id: REQ-3.9
    name: Pagination
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter the category. Pagination includes button "2"; activating it displays the second page with visible text beginning "Showing 13-".'
    dependencies: []
    scenarios:
    - name: Pagination
      steps:
      - keyword: GIVEN
        content: User is on a category page with multiple pages of products.
      - keyword: WHEN
        content: Click next page button or a page number
      - keyword: THEN
        content: Display next page of products
- id: REQ-4
  name: Product Detail Page
  type: FOLDER
  description: 'Single product detailed information page. Page layout: Left image area (main image + thumbnails) + Right info area (name, price, variant selection, add to cart button). Bottom shows product description tabs, review section, related product recommendations. Price and stock dynamically update when selecting different variants. ![image](./reference/product_detail.png) The product "Hummingbird detail t-shirt" has product images, a description, product details, a regular price, a sale price, a 20% tax rate, related products, and at least one existing review with an average rating.'
  dependencies:
  - REQ-3
  children:
  - id: REQ-4.1
    name: Enter Product Detail Page
    type: ATOMIC
    description: 'Use visible button "Clothes" and link "Men" to enter the category. Follow link "Hummingbird detail t-shirt"; its detail page exposes heading "Hummingbird detail t-shirt" and button "ADD TO CART".'
    dependencies:
    - REQ-3.5.1
    scenarios:
    - name: Enter Product Detail Page
      steps:
      - keyword: GIVEN
        content: User can see product cards in a category page product grid.
      - keyword: WHEN
        content: Click any product in product list
      - keyword: THEN
        content: Navigate to that product's detail page
  - id: REQ-4.2
    name: Product Image Area
    type: ATOMIC
    description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt". Its image area exposes buttons "Main", "Detail", and "Back".'
    dependencies: []
    scenarios:
    - name: Product Image Area
      steps:
      - keyword: GIVEN
        content: User is on a product detail page.
      - keyword: WHEN
        content: View main image area
      - keyword: THEN
        content: Display product main image
  - id: REQ-4.3
    name: Product Basic Info
    type: ATOMIC
    description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt" and heading "Hummingbird detail t-shirt". It displays "€19.99", "€24.99", "-20%", "Tax included · 20% VAT", and description text beginning "A soft, responsibly made cotton t-shirt".'
    dependencies: []
    scenarios:
    - name: Product Basic Info
      steps:
      - keyword: GIVEN
        content: User is on a product detail page for a seeded discounted product.
      - keyword: WHEN
        content: Review product info area
      - keyword: THEN
        content: Display product name, current price, regular price (if discounted), discount percentage, tax info, product description
  - id: REQ-4.4
    name: Variant Selection
    type: ATOMIC
    description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt". Its combobox "Size" contains "M" and its visible button "White" is selectable; it has sufficient stock for 3 and stock lower than 999.'
    dependencies: []
    scenarios:
    - name: Variant Selection
      steps:
      - keyword: GIVEN
        content: User is on a product detail page and can see the variant selectors.
      - keyword: WHEN
        content: Click Size dropdown menu to select size
      - keyword: THEN
        content: Selected size displays in dropdown
      - keyword: WHEN
        content: Click color swatch to select color
      - keyword: THEN
        content: Selected color highlights, product image may switch to corresponding color
  - id: REQ-4.5
    name: Quantity Selection
    type: FOLDER
    description: 'Product quantity selector, supports plus/minus buttons, direct input, and stock warning. The product "Hummingbird detail t-shirt" has a selectable size "M" and color "White", sufficient stock for normal quantities including 3, and stock lower than 999.'
    dependencies: []
    children:
    - id: REQ-4.5.1
      name: Increase Quantity
      type: ATOMIC
      description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt", then increase its spinbutton "Quantity" using button "Increase quantity".'
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Increase Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Click the "Increase quantity" button
        - keyword: THEN
          content: Quantity increases by 1
    - id: REQ-4.5.2
      name: Decrease Quantity
      type: ATOMIC
      description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt", then decrease its spinbutton "Quantity" using button "Decrease quantity".'
      dependencies:
      - REQ-4.5.1
      scenarios:
      - name: Decrease Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Click the "Decrease quantity" button
        - keyword: THEN
          content: Quantity decreases by 1, minimum is 1
    - id: REQ-4.5.3
      name: Direct Input Quantity
      type: ATOMIC
      description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt", then enter 3 in its spinbutton "Quantity".'
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Direct Input Quantity
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Directly enter number in quantity input box
        - keyword: THEN
          content: Quantity updates to entered value
    - id: REQ-4.5.4
      name: Stock Insufficient Warning
      type: ATOMIC
      description: 'Use textbox with accessible name "Search" to open link "Hummingbird detail t-shirt", enter 999 in spinbutton "Quantity", and activate button "ADD TO CART"; display alert text "Not enough stock available".'
      dependencies:
      - REQ-4.1
      scenarios:
      - name: Stock Insufficient Warning
        steps:
        - keyword: GIVEN
          content: User is on a product detail page and can see the quantity selector.
        - keyword: WHEN
          content: Enter quantity exceeding stock
        - keyword: THEN
          content: Display stock insufficient warning message
  - id: REQ-4.6
    name: Add to Cart
    type: FOLDER
    description: 'Add product to cart functionality, includes success modal, continue shopping, and proceed to checkout options. ![image](./reference/add_to_cart.png) Each cart scenario uses its own published, purchasable isolated product with a default available combination and sufficient stock.'
    dependencies:
    - REQ-4.4
    - REQ-4.5
    children:
    - id: REQ-4.6.1
      name: Add Product to Cart
      type: ATOMIC
      description: 'Use textbox with accessible name "Search" to open isolated link "Hummingbird cart 4.6.1 t-shirt" and activate button "ADD TO CART"; display heading "Product successfully added to your shopping cart".'
      dependencies:
      - REQ-4.4
      scenarios:
      - name: Add Product to Cart
        steps:
        - keyword: GIVEN
          content: User is on a product detail page with a selected variant and quantity.
        - keyword: WHEN
          content: Click "ADD TO CART" button
        - keyword: THEN
