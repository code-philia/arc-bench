id: ROOT
name: ARC Smoke Demo
type: FOLDER
description: A minimal web application used to verify the ARC reproduction pipeline.
dependencies: []
children:
  - id: REQ-1
    name: Smoke Home Page
    type: ATOMIC
    description: Display a single-page smoke test application with a heading, a readiness message, and a clickable counter.
    dependencies: []
    scenarios:
      - name: Show and update the smoke counter
        steps:
          - keyword: GIVEN
            content: 'The application is running.'
          - keyword: WHEN
            content: 'Open the application entry URL.'
          - keyword: THEN
            content: 'The page shows the heading "ARC Smoke Demo", the text "Ready for smoke testing", a counter reading "Count: 0", and a button labeled "Increment".'
          - keyword: WHEN
            content: 'Click the "Increment" button once.'
          - keyword: THEN
            content: 'The counter updates to "Count: 1".'
