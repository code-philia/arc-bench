          An anonymous visitor has UI-created isolated Shelf 5.6.1 and is viewing it; isolated Book Created 5.6.1 does not exist.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click the shelf's Create New Book, fill Name with the isolated book name, Description with Book created
          by corresponding prerequisite behavior. and Tags with created, shelf-book, then Save Book. Follow the
          named containing shelf entry.
        Then: The new book detail shows its name; its parent entry opens the correct shelf, whose Book list exposes
          the created book exactly once.
        references:
