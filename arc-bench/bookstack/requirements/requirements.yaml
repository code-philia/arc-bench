- id: REQ-8
  name: Personal favorites
  description:
    text: |-
      Authenticated users can favorite and unfavorite shelves, books, chapters and pages. My Most Viewed Favorites displays up to four favorites ranked by that user's views; equally viewed items have no fixed order. Its "View All" entry opens a dedicated favorites page containing the user's complete collection.

  scenarios: []
  children:
  - id: REQ-8.1
    name: Favorite and unfavorite content
    description:
      text: |-
        On an authenticated shelf, book, chapter, or page details view, "Favorite" adds the selected item to the user's favorites and changes to "Unfavorite". Choosing "Unfavorite" removes it from favorites and restores "Favorite". The visible favorite state persists after reload and follows the same behavior for all four content types.

        Favorites and unfavorites are scoped to the authenticated user; another account does not acquire the same personal preference. Saved preferences remain consistent across navigation as well as reload.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-8.1-01
      name: Favorite a book
      steps:
      - id: STEP-REQ-8.1-01-01
        Given: |-
          Admin is signed in and has created "Book 8.1" through the book creation form and Save Book. The book's details are open, and it has not yet been favorited.
        When: Click Favorite on that book's details.
        Then: The action changes to Unfavorite, indicating that the book is now a favorite.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-8.1-02
      name: Persist removal of a favorite
      steps:
      - id: STEP-REQ-8.1-02-01
        Given: |-
          Admin is signed in and has created "Book Unfavorite" through the book creation form and Save Book; it has not yet been favorited.
        When: Click Favorite, reload, click Unfavorite, reload again, and open / to return home.
        Then: After the first reload Unfavorite is still available; after removal Favorite is available
          before and after reload. My Most Viewed Favorites has no entry for the removed book.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-8.2
    name: Open a homepage favorite
    description:
      text: |-
        The authenticated homepage's "My Most Viewed Favorites" displays a shortlist of up to four favorites. Selecting a displayed entry opens the corresponding item. Favorites outside that shortlist remain accessible from the complete favorites page through "View All"; adding a favorite does not guarantee that it appears in the homepage shortlist.
      image:
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-8.2-01
      name: Open favorited book
      steps:
      - id: STEP-REQ-8.2-01-01
        Given: |-
          The verified account is authenticated and has created and favorited five books through the application, including Book 8.2, observing Unfavorite for each.
        When: |-
          Open /, inspect My Most Viewed Favorites, choose a favorite currently displayed in the shortlist, and activate its exact entry. The selected favorite may predate the five new books.
        Then: The favorite entry appears once in a list of no more than four items and opens that selected item's heading.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-BOOK)
    children: []
- id: REQ-9
  name: Recently updated pages
  description:
    text: The homepage shows at most five recently created or edited pages and opens a selected page.

  scenarios: []
  children:
  - id: REQ-9.1
    name: Open a recently updated page
    description:
      text: |-
        Creating or editing a page updates "Recently Updated Pages" on the homepage. Selecting a page by title opens that page with its saved title and body.

      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
    scenarios:
    - id: SCN-REQ-9.1-01
      name: Open recently published page
      steps:
      - id: STEP-REQ-9.1-01-01
        Given: |-
          An anonymous visitor has created "Book 9.1" through the book creation form and Save Book, then published "Page Updated 9.1" through that book's New Page and Save Page actions, with body "Read this guide before updating shared documentation."
        When: Open / and select that page's exact entry in Recently Updated Pages.
        Then: The list has no more than five entries and includes the new page once; selection opens its saved heading
          and body.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-PAGE)
    children: []
