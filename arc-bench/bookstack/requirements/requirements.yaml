id: ROOT
name: BookStack knowledge base
description:
  text: |-
    A knowledge base for organizing and reading shelves, books, chapters, and pages.

    Session and personal dashboard state reflect login, viewed content, favorites, and saved pages or drafts.

    The application provides an Admin account with email admin@example.com and password password. Account creation is outside scope.
    For example, a shelf named Benchmark Bootstrap Shelf has the description "Entry shelf for the New Shelf creation action.", no tags, and no books.
scenarios: []
children:
- id: REQ-1
  name: Application entry and navigation
  description:
    text: |-
      The logged-out homepage provides search input and links to Login, Shelves and Books. These entry points are available throughout the content flows. Visual layout follows the supplied references.

      Content metadata and personal preferences persist across navigation and reload.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open the application
    description:
      text: |-
        Opening the application homepage at / while logged out displays "Login", "Shelves", and "Books" as its public entry points.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show logged-out navigation
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: A visitor opens the knowledge base homepage without being logged in.
        When: Open / and inspect the homepage entry links.
        Then: The homepage displays visible Login, Shelves and Books links with those labels.
        references:
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.2
    name: Return home
    description:
      text: Opening / from the shelves list returns to the homepage, which exposes "Login", "Shelves",
        and "Books".
      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Return from shelves
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: |-
          The anonymous homepage is open.
        When: Click Shelves, verify Shelf list opens, then open / to return to the homepage.
        Then: The homepage returns with its Books link visible.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-INDEX)
    children: []
- id: REQ-2
  name: Account access
  description:
    text: |-
      A preverified account can log in; account verification is outside scope. Content browsing and the content operations described below remain available while logged out; drafts and personal lists require login.

  scenarios: []
  children:
  - id: REQ-2.1
    name: Open login
    description:
      text: |-
        Clicking "Login" in navigation opens a login form containing "Email", "Password", an initially unchecked "Remember Me", and a Login submit action.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Show login form
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: A fresh browser is on the anonymous application entry with Login available on the page.
        When: Click the Login navigation link and inspect the displayed form.
        Then: Email and Password fields and the Login submit button are visible; Remember Me is present and unchecked.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-2.2
    name: Authenticate verified account
    description:
      text: Users enter a verified account's credentials in "Email" and "Password",
        select "Remember Me", and submit the form reached through "Login". Successful
        authentication returns to the homepage, shows Admin in the top-right user area, and enables the
        personal dashboard lists.
      image:
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Log in with remember me
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: |-
          The Admin account is available with email admin@example.com and password password; the browser is anonymous on the application entry.
        When: Click Login on the page, fill Email and Password with those credentials, check Remember Me, and click
          the Login submit button.
        Then: The homepage visibly displays Admin and My Recent Drafts, confirming authentication and access
          to the personal dashboard.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-LOGIN)
    children: []
- id: REQ-3
  name: Authenticated dashboard
  description:
    text: The authenticated homepage shows recent drafts, recently viewed items, most viewed favorites, recently
      updated pages, recent activity and dashboard controls as visually referenced.
  scenarios: []
  children:
  - id: REQ-3.1
    name: View authenticated dashboard
    description:
      text: |-
        Successful login displays an authenticated dashboard with "My Recent Drafts", "My Recently Viewed", "My Most Viewed Favorites", and "Recently Updated Pages", each containing its corresponding personal or content list. Recent activity and dashboard controls also follow the visual reference.

      image:
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Show personal dashboard regions
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          The verified account exists and a fresh anonymous browser is at the application entry.
        When: Open Login, fill Email with admin@example.com and Password with password, check Remember
          Me, and submit Login.
        Then: The authenticated homepage displays My Recent Drafts, My Recently Viewed, My Most Viewed Favorites
          and Recently Updated Pages in clearly identified sections.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
- id: REQ-4
  name: Organize shelves
  description:
    text: |-
      Shelves contain a name, description, related books and tags. Support browsing, creation, editing, cancellation and confirmed deletion. Related-book editing is supported.

      Users can open Shelves and choose New Shelf to create a shelf, including when Shelf list is empty.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Browse shelves
    description:
      text: Activating "Shelves" on the page displays the shelf list. Each shelf appears exactly
        once as a keyboard-accessible opening entry identifiable by its business name. No total list size is prescribed.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Show a uniquely identified item
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          As an anonymous visitor, open Shelves and create a Shelf 4.1 through New Shelf, using Reference shelf description. and knowledge-base, docs as metadata.
        When: Click Shelves on the page and inspect Shelf list for the full name.
        Then: The created shelf's opening entry appears exactly once and is visible and keyboard-accessible within
          Shelf list.
        references:
        - \ref[requirement](REQ-4.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SHELVES)
    children: []
  - id: REQ-4.2
    name: Open shelf details
    description:
      text: Choosing a shelf by name in the shelf list opens
        that shelf's details with a heading bearing its name and information belonging to the selected shelf. Its
        included books and related actions are available from these details.
      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
    scenarios:
    - id: SCN-REQ-4.2-01
      name: Open from global list
      steps:
      - id: STEP-REQ-4.2-01-01
        Given: |-
          An anonymous visitor has UI-created Shelf 4.2.1 with Reference shelf description. and knowledge-base, docs.
        When: Click Shelves, then activate that exact shelf's entry within Shelf list.
        Then: The selected shelf's detail heading matches its full name and its saved description is visible;
          a different shelf is not opened.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
    children: []
  - id: REQ-4.3
    name: Create or abandon shelf
    description:
      text: |-
        While logged out, users open Shelves and click "New Shelf" on Shelf list to enter "Name", "Description", and "Tags". "Save Shelf" creates exactly one shelf with that metadata and returns to Shelf list; the metadata persists across navigation and reload. "Cancel" instead returns to Shelves without creating the entered object.

      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-CREATE-SHELF
        reference: reference/create_shelf.png
        page: shelf_form
    scenarios:
    - id: SCN-REQ-4.3-01
      name: Save a new shelf
      steps:
      - id: STEP-REQ-4.3-01-01
        Given: |-
          The visitor is logged out and no shelf has the Shelf Created 4.3.1 name.
        When: Open Shelves, click New Shelf, enter the name in Name,
          Shelf created by corresponding prerequisite behavior. in Description and created, shelf in Tags, then
          click Save Shelf. Open the saved shelf, reload and reopen Edit.
        Then: Saving returns to Shelf list with exactly one visible entry. The saved name, description and tags
          remain in the reopened metadata form after reload, demonstrating persistence of the entered metadata.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-CREATE-SHELF)
    - id: SCN-REQ-4.3-02
      name: Cancel new shelf
      steps:
      - id: STEP-REQ-4.3-02-01
        Given: |-
          The anonymous visitor has opened Shelves and Shelf list; the Shelf Cancelled 4.3.2 does not exist.
        When: Click New Shelf, fill Name with the title, Description with Unsaved shelf description 4.3.2.
          and Tags with cancelled, shelf, then click Cancel.
        Then: Shelves list returns, with no entry for the unsaved name; none of the entered metadata creates a shelf.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-CREATE-SHELF)
    children: []
  - id: REQ-4.5
    name: Edit or abandon shelf metadata
    description:
      text: On the selected shelf's details, "Edit" opens "Name", "Description",
        and "Tags" prefilled with saved values. "Save Shelf" updates that same shelf
        and returns to its details with the updated heading and description; changes survive reload. "Cancel"
        discards all pending changes and returns to the unchanged details.
      image:
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-EDIT-SHELVE
        reference: reference/edit_shelve.png
        page: shelf_form
    scenarios:
    - id: SCN-REQ-4.5-01
      name: Save metadata changes
      steps:
      - id: STEP-REQ-4.5-01-01
        Given: |-
          UI-created Shelf 4.5.1 has Reference shelf description. and knowledge-base, docs; its details are open anonymously.
        When: Click Edit and verify Name, Description and Tags are prefilled. Replace Name with Shelf Updated
          4.5.1 and Description with Shelf updated by corresponding prerequisite behavior., retain the tags, and
          click Save Shelf. Reload the returned details and reopen Edit.
        Then: The updated heading and description are visible before and after reload. The reopened fields retain
          the updated name, description and tags on that same shelf.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-EDIT-SHELVE)
    - id: SCN-REQ-4.5-02
      name: Cancel metadata changes
      steps:
      - id: STEP-REQ-4.5-02-01
        Given: |-
          UI-created Shelf 4.5.2 has Reference shelf description. and knowledge-base, docs; its details are open anonymously.
        When: Click Edit, replace Name with Shelf Updated 4.5.2 and Description with Shelf updated by corresponding
          prerequisite behavior., then click Cancel.
        Then: Details return with the original heading and description and no heading for the replacement name;
          pending metadata was not committed.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-EDIT-SHELVE)
    children: []
  - id: REQ-4.4
    name: Delete or retain shelf
    description:
      text: Clicking "Delete" on a selected shelf opens confirmation. "Confirm Delete"
        removes that shelf and returns to Shelves, where its entry is absent from the shelf list; the
        deletion remains effective across navigation. "Cancel" keeps the shelf and preserves its original
        heading and description.
      image:
      - id: IMG-DELETE-SHELVES
        reference: reference/delete_shelves.png
        page: shelf
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
    scenarios:
    - id: SCN-REQ-4.4-01
      name: Confirm deletion
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: |-
          An anonymous visitor has UI-created Shelf 4.4.1 with Reference shelf description. and is viewing that shelf's details.
        When: Click Delete, inspect confirmation with Confirm Delete and Cancel, then click Confirm Delete; reopen
          Shelves after reload.
        Then: Shelves list returns and contains no entry for the deleted shelf before or after reload.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-DELETE-SHELVES)
        - \ref[image](IMG-SHELVES)
    - id: SCN-REQ-4.4-02
      name: Cancel deletion
      steps:
      - id: STEP-REQ-4.4-02-01
        Given: |-
          An anonymous visitor has UI-created Shelf 4.4.2 with Reference shelf description. and is viewing its details.
        When: Click Delete and then Cancel in the confirmation.
        Then: The same shelf details remain, with the original heading and Reference shelf description.; the shelf
          is not deleted.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-DELETE-SHELVES)
        - \ref[image](IMG-SHELVES)
    children: []
- id: REQ-5
  name: Manage books
  description:
    text: Books contain a name, rich-text description, optional cover image, tags, default page template, chapters
      and pages. Support creation from the global list and from a shelf, metadata editing and confirmed deletion.


  scenarios: []
  children:
  - id: REQ-5.1
    name: Browse books
    description:
      text: Clicking "Books" on the page displays the book list. Each book appears exactly
        once as a keyboard-accessible opening entry identifiable by its business name. No total list size is prescribed.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Show a uniquely identified item
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: An anonymous visitor has UI-created Book 5.1 with Reference book description. and manual,
          handbook through Books, its book creation form, metadata fields and Save Book.
        When: Click Books on the page and inspect Book list.
        Then: Exactly one visible keyboard-accessible opening entry identifies that full book name.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-BOOKS)
    children: []
  - id: REQ-5.2
    name: Open book details
    description:
      text: Selecting a book by name in the book list opens
        the corresponding book's details with its name as the heading and information belonging to that book. The
        same selection behavior is available from the Book list on its containing shelf.
      image:
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Open from global list
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: An anonymous visitor has UI-created Book 5.2.1 with Reference book description. and manual,
          handbook.
        When: Click Books, then activate the exact book entry in Book list.
        Then: The opened detail heading is that book's name and its saved description is visible.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOK)
    - id: SCN-REQ-5.2-02
      name: Open from containing shelf
      steps:
      - id: STEP-REQ-5.2-02-01
        Given: |-
          Through UI, create Shelf 5.2.2 and then Book 5.2.2 from that shelf's book creation form, associating the two objects.
        When: Follow the containing shelf's named parent entry, then choose the book from that shelf's
          Book list.
        Then: The selected book detail heading matches its name and the shelf-created description is visible, preserving
          the parent association.
        references:
        - \ref[requirement](REQ-5.6)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOK)
    children: []
  - id: REQ-5.3
    name: Create or abandon book
    description:
      text: |-
        While logged out, users open Books and choose the book creation action ("Create New Book" or "New Book"), then enter "Name", "Description", and "Tags". "Save Book" creates one book with that metadata and opens its details with the saved name and description. "Cancel" returns to Books without creating the entered book. Saved metadata survives navigation and reload.
      image:
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-CREATE-BOOK
        reference: reference/create_book.png
        page: book_form
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-5.3-01
      name: Save a new book
      steps:
      - id: STEP-REQ-5.3-01-01
        Given: The browser is anonymous and no book has the Book Created 5.3.1 name.
        When: Click Books and choose its book creation action, fill Name with the title, Description with Book created
          by corresponding prerequisite behavior. and Tags with created, book, then Save Book. Reload details and
          reopen Edit.
        Then: Saving opens the new book's heading and description. Reopened Name, Description and Tags retain all
          submitted metadata after reload.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-CREATE-BOOK)
        - \ref[image](IMG-BOOK)
    - id: SCN-REQ-5.3-02
      name: Cancel new book
      steps:
      - id: STEP-REQ-5.3-02-01
        Given: The anonymous Books list is open and Book Cancelled 5.3.2 does not exist.
        When: Choose the book creation action, enter the name, Unsaved book description 5.3.2. and cancelled, book
          in the metadata fields, then click Cancel.
        Then: Books list returns with no entry for that name; the unsaved book is not created.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-CREATE-BOOK)
        - \ref[image](IMG-BOOK)
    children: []
  - id: REQ-5.4
    name: Edit or abandon book metadata
    description:
      text: |-
        On the selected book's details, "Edit" opens "Name", "Description", and "Tags" prefilled with their saved values. "Save Book" changes that same book and returns to its details with the updated heading and description, persisting after reload. "Cancel" returns to the unchanged details and discards all pending edits.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-EDIT-BOOK
        reference: reference/edit_book.png
        page: book_form
    scenarios:
    - id: SCN-REQ-5.4-01
      name: Save metadata changes
      steps:
      - id: STEP-REQ-5.4-01-01
        Given: UI-created Book 5.4.1 has Reference book description. and manual, handbook, and its details
          are open anonymously.
        When: Click Edit and check the prefilled metadata, replace Name with Book Updated 5.4.1 and Description
          with Book updated by corresponding prerequisite behavior., retain tags and Save Book; reload and reopen
          Edit.
        Then: The new heading and description appear before and after reload; the reopened metadata fields contain
          the saved replacement values and retained tags.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-EDIT-BOOK)
    - id: SCN-REQ-5.4-02
      name: Cancel metadata changes
      steps:
      - id: STEP-REQ-5.4-02-01
        Given: UI-created Book 5.4.2 has Reference book description. and manual, handbook, and its detail
          is open anonymously.
        When: Click Edit, enter Book Updated 5.4.2 and Book updated by corresponding prerequisite behavior.
          as replacement name and description, then Cancel.
        Then: The original heading and description return, and no heading has the proposed replacement name.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-EDIT-BOOK)
    children: []
  - id: REQ-5.5
    name: Delete or retain book
    description:
      text: Clicking "Delete" on the selected book opens confirmation. "Confirm Delete"
        removes that book and returns to Books, with its entry absent from the book list across subsequent
        navigation. "Cancel" keeps the book's original heading and description unchanged.
      image:
      - id: IMG-DELETE-BOOK
        reference: reference/delete_book.png
        page: book
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
    scenarios:
    - id: SCN-REQ-5.5-01
      name: Confirm deletion
      steps:
      - id: STEP-REQ-5.5-01-01
        Given: UI-created Book 5.5.1 with Reference book description. is open anonymously.
        When: Click Delete, inspect Confirm Delete and Cancel, click Confirm Delete, then reload and reopen Books.
        Then: Books list contains no entry for the selected book both immediately and after reload.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-DELETE-BOOK)
        - \ref[image](IMG-BOOKS)
    - id: SCN-REQ-5.5-02
      name: Cancel deletion
      steps:
      - id: STEP-REQ-5.5-02-01
        Given: UI-created Book 5.5.2 with Reference book description. is open anonymously.
        When: Click Delete and Cancel in confirmation.
        Then: The original book heading and Reference book description. remain visible; no deletion is committed.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-DELETE-BOOK)
        - \ref[image](IMG-BOOKS)
    children: []
  - id: REQ-5.6
    name: Create a book in a shelf
    description:
      text: Choosing "New Book" or "Create New Book" on a shelf's details opens a creation form with "Name",
        "Description", and "Tags". "Save Book" creates the book under that
        specific shelf and opens its details with its name and a navigation entry identifying the containing shelf by name.
        Selecting that entry opens the containing shelf,
        whose the book list includes the created book.
      image:
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-CREATE-BOOK
        reference: reference/create_book.png
        page: book_form
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-5.6-01
      name: Save a book with shelf association
      steps:
      - id: STEP-REQ-5.6-01-01
        Given: |-
          An anonymous visitor has UI-created Shelf 5.6.1 and is viewing it; Book Created 5.6.1 does not exist.
        When: Choose the shelf's book creation action, fill Name with the book name, Description with Book created
          by corresponding prerequisite behavior. and Tags with created, shelf-book, then Save Book. Follow the
          named containing shelf entry.
        Then: The new book detail shows its name; its parent entry opens the correct shelf, whose Book list exposes
          the created book exactly once.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-CREATE-BOOK)
        - \ref[image](IMG-BOOK)
    children: []
- id: REQ-6
  name: Author and read content
  description:
    text: Pages are reading units, chapters organize pages. Support published pages, user-owned drafts, draft deletion,
      chapter creation and entry, and reading pages from book or chapter page lists.
  scenarios: []
  children:
  - id: REQ-6.1
    name: Publish or save a draft page
    description:
      text: |-
        Clicking "New Page" on a book opens an editor for the page title and body. "Save Page" publishes the entered title and body, returns to the book, and adds exactly one entry to the page list, including while logged out. When authenticated, users can instead click "Save Draft" to save an owned draft, which appears exactly once in the homepage's "My Recent Drafts". Saved drafts can be reopened from the parent book's Page list to resume editing or delete them.

        Published pages can be organized under a chapter belonging to their parent book. Saving keeps the book/chapter association so that the page is readable from the appropriate chapter Page list as well as its book context. Drafts belong to the authenticated author and their parent book.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-PAGE-DRAFT
        reference: reference/page_draft.png
        page: page_editor
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Publish a page
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: An anonymous visitor has UI-created Book 6.1.1 and is viewing it; Page Created
          6.1.1 does not exist.
        When: Click New Page, fill the page title with the name and the body with Page
          content created by corresponding prerequisite behavior., then Save Page.
        Then: The parent book returns with exactly one visible Page list entry for the saved page, without requiring
          login.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-6.1-02
      name: Save an owned recent draft
      steps:
      - id: STEP-REQ-6.1-02-01
        Given: |-
          Log in through Email and Password as verified account, create Book 6.1.2 through UI, and open that book.
        When: Click New Page, enter Page Draft 6.1.2 and Draft content created by corresponding prerequisite
          behavior., then Save Draft. Open the parent book if the editor remains and open / to return home.
        Then: The parent Page list contains exactly one draft entry; the authenticated My Recent Drafts region also
          contains that draft exactly once.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
  - id: REQ-6.2
    name: Delete an owned draft
    description:
      text: Opening an owned draft while logged in offers "Delete Draft". Clicking it opens confirmation
        with "Confirm Delete"; confirming returns to the parent book and removes that draft from "Page
        list".
      image:
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-DELETE-DRAFT
        reference: reference/delete_draft.png
        page: page_editor
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Confirm draft deletion
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: |-
          verified account is authenticated and owns a UI-created Draft 6.1.3 with Disposable draft. under Book 6.1.3, established through New Page and Save Draft.
        When: Open Books, select the parent, select the draft in Page list, click Delete Draft and Confirm Delete.
        Then: The parent book's heading returns and Page list contains no entry for that draft.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-DELETE-DRAFT)
    children: []
  - id: REQ-6.3
    name: Create and enter a chapter
    description:
      text: |-
        Clicking "New Chapter" on a book opens "Name" and "Description". "Save Chapter" saves the entered chapter and adds exactly one entry to the chapter list. Opening that chapter by name displays that chapter's heading and saved description.

        A chapter belongs to its selected book, organizes pages and exposes its own Page list containing pages associated with that chapter. It must not display pages belonging only to another chapter or book.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CREATE-CHAPTER
        reference: reference/create_chapter.png
        page: create_chapter
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
    scenarios:
    - id: SCN-REQ-6.3-01
      name: Save and open a chapter
      steps:
      - id: STEP-REQ-6.3-01-01
        Given: An anonymous visitor has UI-created Book 6.2.1 and is viewing it; Chapter Created
          6.2.1 does not exist.
        When: Click New Chapter, enter the name and Chapter created by corresponding prerequisite behavior.
          in Name and Description, then Save Chapter. Click that chapter's entry in Chapter list.
        Then: Saving adds exactly one Chapter list entry. Selecting it opens the same chapter's heading and saved
          description.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CREATE-CHAPTER)
        - \ref[image](IMG-CHAPTER)
    children: []
  - id: REQ-6.4
    name: Read a page or reopen its editor
    description:
      text: Selecting a page by title from a book or chapter's page list displays the
        published page's title heading and saved body. "Edit" on the reading page opens an editor prefilled
        with the saved title and body available for editing,
        with "Save Page" available to save the page.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
      - id: IMG-PAGE-DRAFT
        reference: reference/page_draft.png
        page: page_editor
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Read selected page
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: An anonymous visitor has UI-published Page 6.3.1 with Reading content for Page 6.3.1. under
           Book 6.3.1; the parent Page list is open.
        When: Activate the exact page entry in Page list.
        Then: The page heading matches the title and its saved body is visible.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-PAGE-DRAFT)
    - id: SCN-REQ-6.4-02
      name: Reopen page editor
      steps:
      - id: STEP-REQ-6.4-02-01
        Given: An anonymous visitor has UI-published Page 6.3.2 with Reading content for Page 6.3.2. under
           Book 6.3.2.
        When: Open that page from Page list and click Edit.
        Then: The editor's title and body fields contain the saved title and body,
          and Save Page is visible.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-PAGE-DRAFT)
    children: []
- id: REQ-7
  name: Recently viewed content
  description:
    text: Authenticated visits to shelves, books, chapters and pages are recorded for that user. My Recently Viewed
      contains at most ten records, with one entry per visited item, and opens the selected item.

  scenarios: []
  children:
  - id: REQ-7.1
    name: Record and reopen viewed content
    description:
      text: |-
        Opening / returns home, where "My Recently Viewed" shows the user's visited items. Selecting a visited item by name opens the corresponding item.

      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Record shelf visit
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          verified account is authenticated and Shelf 7.1 has been created through the public shelf form.
        When: Open the exact shelf from Shelves and Shelf list, then open / to return home.
        Then: My Recently Viewed contains exactly one entry for that visited shelf, with the region containing no
          more than ten records.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-7.1-02
      name: Reopen visited shelf
      steps:
      - id: STEP-REQ-7.1-02-01
        Given: |-
          verified account is authenticated and Shelf 7.2 has been UI-created and visited through Shelf list.
        When: Open / to return home and click that shelf's exact entry in My Recently Viewed.
        Then: The recent list exposes the identity exactly once and selecting it opens that same shelf's heading.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
- id: REQ-8
  name: Personal favorites
  description:
    text: Authenticated users can favorite and unfavorite shelves, books, chapters and pages. My Most Viewed Favorites
      contains at most four items, and a dedicated favorites page exposes the complete collection.

  scenarios: []
  children:
  - id: REQ-8.1
    name: Favorite and unfavorite content
    description:
      text: |-
        On an authenticated shelf, book, chapter, or page details view, "Favorite" adds the selected item to the user's favorites and changes to "Unfavorite". Choosing "Unfavorite" removes it from favorites and restores "Favorite". The visible favorite state persists after reload and follows the same behavior for all four content types.

        Favorites and unfavorites are scoped to the authenticated user; another account does not acquire the same personal preference. Saved preferences remain consistent across navigation as well as reload.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-8.1-01
      name: Favorite a book
      steps:
      - id: STEP-REQ-8.1-01-01
        Given: |-
          verified account is authenticated and is viewing UI-created Book 8.1; the book has not yet been favorited.
        When: Click Favorite on that book's details.
        Then: The action changes to Unfavorite, indicating that the book is now a favorite.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-8.1-02
      name: Persist removal of a favorite
      steps:
      - id: STEP-REQ-8.1-02-01
        Given: |-
          verified account is authenticated and has UI-created Book Unfavorite; it has not yet been favorited.
        When: Click Favorite, reload, click Unfavorite, reload again, and open / to return home.
        Then: After the first reload Unfavorite is still available; after removal Favorite is available
          before and after reload. My Most Viewed Favorites has no entry for the removed book.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-8.2
    name: Open a homepage favorite
    description:
      text: |-
        After an item is favorited, the authenticated homepage's "My Most Viewed Favorites" shows an identifiable entry for that item. Selecting an entry opens the corresponding item.
      image:
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-8.2-01
      name: Open favorited book
      steps:
      - id: STEP-REQ-8.2-01-01
        Given: |-
          verified account is authenticated and has UI-created Book 8.2, then clicked Favorite and observed Unfavorite.
        When: Open /, inspect My Most Viewed Favorites and activate the exact book entry there.
        Then: The favorite entry appears once in a list of no more than four items and opens the same book's heading.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-BOOK)
    children: []
- id: REQ-9
  name: Recently updated pages
  description:
    text: The homepage shows at most five recently created or edited pages and opens a selected page.

  scenarios: []
  children:
  - id: REQ-9.1
    name: Open a recently updated page
    description:
      text: |-
        Creating or editing a page updates "Recently Updated Pages" on the homepage. Selecting a page by title opens that page with its saved title and body.

      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
    scenarios:
    - id: SCN-REQ-9.1-01
      name: Open recently published page
      steps:
      - id: STEP-REQ-9.1-01-01
        Given: An anonymous visitor has UI-created Book 9.1 and published Page Updated 9.1 with
          Page content created by corresponding prerequisite behavior.
        When: Open / and select that page's exact entry in Recently Updated Pages.
        Then: The list has no more than five entries and includes the new page once; selection opens its saved heading
          and body.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-PAGE)
    children: []
