- id: REQ-6
  name: Author and read content
  description:
    text: Pages are reading units, chapters organize pages. Support published pages, user-owned drafts, draft deletion,
      chapter creation and entry, and reading pages from book or chapter page lists.
  scenarios: []
  children:
  - id: REQ-6.1
    name: Publish or save a draft page
    description:
      text: |-
        Clicking "New Page"(role=button) on a book opens "Page title"(role=textbox) and "Write your page content here..."(role=textbox). "Save Page"(role=button) publishes the entered title and body, returns to the book, and adds exactly one entry to "Page list"(role=region), including while logged out. When authenticated, users can instead click "Save Draft"(role=button) to save an owned draft, which appears exactly once in the homepage's "My Recent Drafts"(role=region). Saved drafts can be reopened from the parent book's Page list to resume editing or delete them. REQ-2.2 is required only for the Save Draft branch.

        Dates and time-dependent content use UTC and the shared clock 2026-10-06T12:00:00Z.

        Published pages can be organized under a chapter belonging to their parent book. Saving keeps the book/chapter association so that the page is readable from the appropriate chapter Page list as well as its book context. Drafts belong to the authenticated author and their parent book.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-PAGE-DRAFT
        reference: reference/page_draft.png
        page: page_editor
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Publish a page
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: An anonymous visitor has UI-created isolated Book 6.1.1 and is viewing it; isolated Page Created
          6.1.1 does not exist.
        When: Click New Page, fill Page title with the isolated name and Write your page content here... with Page
          content created by corresponding prerequisite behavior., then Save Page.
        Then: The parent book returns with exactly one visible Page list entry for the saved page, without requiring
          login.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-6.1-02
      name: Save an owned recent draft
      steps:
      - id: STEP-REQ-6.1-02-01
        Given: |-
          Log in through Email and Password as verified account, create isolated Book 6.1.2 through UI, and open that book.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Click New Page, enter isolated Page Draft 6.1.2 and Draft content created by corresponding prerequisite
          behavior., then Save Draft. Open the parent book if the editor remains and open / to return home.
        Then: The parent Page list contains exactly one draft entry; the authenticated My Recent Drafts region also
          contains that draft exactly once.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
  - id: REQ-6.2
    name: Delete an owned draft
    description:
      text: Opening an owned draft while logged in offers "Delete Draft"(role=button). Clicking it opens confirmation
        with "Confirm Delete"(role=button); confirming returns to the parent book and removes that draft from "Page
        list"(role=region).
      image:
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-DELETE-DRAFT
        reference: reference/delete_draft.png
        page: page_editor
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Confirm draft deletion
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: |-
          verified account is authenticated and owns a UI-created isolated Draft 6.1.3 with Disposable draft. under isolated Book 6.1.3, established through New Page and Save Draft.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Open Books, select the parent, select the draft in Page list, click Delete Draft and Confirm Delete.
        Then: The parent book's heading returns and Page list contains no entry for that draft.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-DELETE-DRAFT)
    children: []
  - id: REQ-6.3
    name: Create and enter a chapter
    description:
      text: |-
        Clicking "New Chapter"(role=button) on a book opens "Name"(role=textbox) and "Description"(role=textbox). "Save Chapter"(role=button) saves the entered chapter and adds exactly one entry to "Chapter list"(role=region). Opening its "{chapter name}"(role=button) entry displays that chapter's heading and saved description.

        A chapter belongs to its selected book, organizes pages and exposes its own Page list containing pages associated with that chapter. It must not display pages belonging only to another chapter or book.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CREATE-CHAPTER
        reference: reference/create_chapter.png
        page: create_chapter
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
    scenarios:
    - id: SCN-REQ-6.3-01
      name: Save and open a chapter
      steps:
      - id: STEP-REQ-6.3-01-01
        Given: An anonymous visitor has UI-created isolated Book 6.2.1 and is viewing it; isolated Chapter Created
          6.2.1 does not exist.
        When: Click New Chapter, enter the isolated name and Chapter created by corresponding prerequisite behavior.
          in Name and Description, then Save Chapter. Click that chapter's entry in Chapter list.
        Then: Saving adds exactly one Chapter list entry. Selecting it opens the same chapter's heading and saved
          description.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CREATE-CHAPTER)
        - \ref[image](IMG-CHAPTER)
    children: []
  - id: REQ-6.4
    name: Read a page or reopen its editor
    description:
      text: Selecting "{page title}"(role=button) from a book or chapter's "Page list"(role=region) displays the
        published page's title heading and saved body. "Edit"(role=button) on the reading page opens an editor prefilled
        with the current title in "Page title"(role=textbox) and body in "Write your page content here..."(role=textbox),
        with "Save Page"(role=button) available to save the page.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
      - id: IMG-PAGE-DRAFT
        reference: reference/page_draft.png
        page: page_editor
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Read selected page
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: An anonymous visitor has UI-published isolated Page 6.3.1 with Reading content for Page 6.3.1. under
          isolated Book 6.3.1; the parent Page list is open.
        When: Activate the exact page entry in Page list.
        Then: The page heading matches the isolated title and its saved body is visible.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-PAGE-DRAFT)
    - id: SCN-REQ-6.4-02
      name: Reopen page editor
      steps:
      - id: STEP-REQ-6.4-02-01
        Given: An anonymous visitor has UI-published isolated Page 6.3.2 with Reading content for Page 6.3.2. under
          isolated Book 6.3.2.
        When: Open that page from Page list and click Edit.
        Then: The editor's Page title and Write your page content here... fields contain the saved title and body,
          and Save Page is visible.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-PAGE-DRAFT)
    children: []
