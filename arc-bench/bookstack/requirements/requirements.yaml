  - id: REQ-5.6
    name: Create a book in a shelf
    description:
      text: Clicking "Create New Book"(role=button) on a shelf's details opens a creation form with "Name"(role=textbox),
        "Description"(role=textbox), and "Tags"(role=textbox). "Save Book"(role=button) creates the book under that
        specific shelf and opens its details with its name and a "{containing shelf name}"(role=button) parent action,
        for which an equivalent link is also permitted. Following the parent action opens the containing shelf,
        whose "Book list"(role=region) includes the created book.
      image:
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-CREATE-BOOK
        reference: reference/create_book.png
        page: book_form
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
