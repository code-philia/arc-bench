      text: Clicking "Delete"(role=button) on the selected book opens confirmation. "Confirm Delete"(role=button)
        removes that book and returns to Books, with its entry absent from "Book list"(role=region) across subsequent
        navigation. "Cancel"(role=button) keeps the book's original heading and description unchanged.
      image:
      - id: IMG-DELETE-BOOK
        reference: reference/delete_book.png
        page: book
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
    scenarios:
