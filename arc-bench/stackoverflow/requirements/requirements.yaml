      steps:
      - id: STEP-REQ-2.2-01-01
        Given: A fresh anonymous browser uses an unused new_stack_user email containing the evaluator's deterministic
          case suffix; Password123! satisfies the declared password rule.
        When: Open Sign up from the banner, inspect Join Stack Overflow and terms/privacy text, fill Email with
          the isolated email and Password with Password123!, then submit Sign up.
        Then: The banner exposes that exact registered email as the profile action and Question feed appears, confirming
          account creation and automatic authentication.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-02
      name: Reject duplicate email
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          The anonymous Sign up form is open and verified accounts already contains stack_user@example.com.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Enter stack_user@example.com and Password123! and submit Sign up.
        Then: Email is already in use appears within the retained form; Stack User is absent from the banner and
          no authenticated session is created.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-03
      name: Reject weak password
      steps:
      - id: STEP-REQ-2.2-03-01
        Given: The anonymous Sign up form is open with an unused weak_password_candidate email using the deterministic
          case suffix.
        When: Enter the unused email and short as Password, then submit Sign up.
        Then: The form visibly explains the minimum eight-character requirement and stays open; the proposed email
          profile action is absent and registration does not authenticate.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    children: []
