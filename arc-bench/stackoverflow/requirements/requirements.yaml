- id: REQ-3
  name: Publish and maintain questions capability
  description:
    text: Organize the page-entry and independent user behaviors for Publish and maintain questions. REQ-3.1 establishes
      the concrete reference pages first; the remaining siblings apply their explicitly preserved source contracts.
      This abstract capability has no page or executable UI of its own.
  scenarios: []
  children:
  - id: REQ-3.1
    name: Open public Questions listing
    description:
      text: |-
        Follow Questions in Main navigation. Question feed exposes Ask Question and published question summaries.

        This requirement establishes the page entry and visible reference state before sibling behaviors. It does not implement their validation or state transitions. Every case establishes its own preconditions through the existing UI; tests do not depend on previous cases.

