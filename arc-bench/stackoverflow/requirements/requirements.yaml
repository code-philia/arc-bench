- id: DATA-RUNTIME
  lifecycle: CREATED
  entity: accounts, questions, answers, comments and filters
  properties:
    question_body: I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I
      have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression,
      timeout handling, and observability across intermittent failures in production. What patterns should I use
      and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery
      attempts?
    answer_body: Use exponential backoff together with an idempotency key so duplicate requests can be safely retried
      without creating duplicate side effects in downstream services.
    comment_body: Can you share what you tried so far?
    tags:
    - node.js
    - http
    - retry
  description: All ordinary mutable source examples are created through UI within each case. Question titles append
    SO_RUN_ID, parallelIndex and case slug; registration email is new_stack_user+<suffix>@example.com. Helpers create
    a question as the named owner, then answers/comments as the named author in separate authenticated browser contexts.
    Each case owns its objects.
- id: DATA-STATE
  lifecycle: DERIVED
  entity: session, edit draft, search, voting and preferences
  properties: {}
  description: Produced only by public interactions. No storage injection or hidden API. Vote effects are relative
    to the author current public reputation, which may include other independent case contributions.
children:
- id: REQ-1
  name: Discover the community
  type: FOLDER
  dependencies: []
  description: |-
    Anonymous and authenticated visitors discover populated public questions. Header, left navigation, main feed and right widgets follow the homepage reference. Right widgets expose The Overflow Blog, meta items, Hot Network Questions and custom filter/tag watchlists.
    ![image](./reference/homepage.jpeg)

    Global header is a banner and main navigation is named Main navigation. Question feed contains summary regions named Question <title>. Navigational actions may be links or buttons; status metrics expose plain numeric text.
  children:
  - id: REQ-1.1
    name: Open the populated community
    type: ATOMIC
    dependencies: []
    description: |-
      Opening the application displays a banner with Stack Overflow identity, "Search"(role=searchbox), "Products"(role=button), Log in, and Sign up. "Main navigation"(role=navigation) provides Home, Questions, Tags, and Users. "Question feed"(role=region) displays Ask Question, Newest and Active ordering controls, and summaries containing titles, tags, votes, answers, and views. Linked editorial and network content appears in "The Overflow Blog"(role=region) and "Hot Network Questions"(role=region). Desktop appearance follows the reference.

      ![image](./reference/homepage.jpeg)
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Show the anonymous homepage
      steps:
      - keyword: GIVEN
        content: A fresh anonymous browser opens the initialized public world, including DATA-HISTORY's retry question,
          DATA-TAGS and linked editorial/network content; no account session exists.
      - keyword: WHEN
        content: Open the application entry and inspect banner, Search, Products, Log in, Sign up, Main navigation,
          Question feed and its retry-question summary, then the two linked widgets.
      - keyword: THEN
        content: Banner shows Stack Overflow and its account/search actions. Navigation exposes Home, Questions, Tags
          and Users; feed exposes Ask Question, Newest and Active. The retry summary has its exact title, node.js/http/retry
          tags and votes/answers/views metadata. The Overflow Blog and Hot Network Questions are visible with public
          links.
  - id: REQ-1.2
    name: Navigate community modules
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      In main navigation, "Questions"(role=button), "Tags"(role=button), and "Users"(role=button) open their respective modules and mark the selected section current=page. Questions displays Question feed, while the other modules display "Tags"(role=region) and "Users"(role=region); "Home"(role=button) returns to the feed. The user catalog includes Helpful User and Stack User without introducing user-management behavior. The question feed offers "Next page"(role=button), disabled when no next page exists, and summaries expose named Score, Answer count, and View count outputs.
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-TAGS
      - DATA-HISTORY
    scenarios:
    - name: Open major community sections
      steps:
      - keyword: GIVEN
        content: The anonymous homepage has the published question, tag and user catalogs, including Helpful User and
          Stack User.
      - keyword: WHEN
        content: In Main navigation click Questions, Tags, Users and Home in turn, inspecting each selected action and
          corresponding region; inspect Next page in the returned feed, then reopen Users.
      - keyword: THEN
        content: Each selected action reports current=page and opens Question feed, Tags or Users as appropriate. Feed
          offers Next page, and Users visibly includes Helpful User and Stack User.
  - id: REQ-1.3
    name: Read a public question anonymously
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      An anonymous visitor can open a published question through the public feed or search and read its title, rendered body, tags, and existing answers in "Question post"(role=region). Reading public knowledge requires no session; the header continues to offer "Log in"(role=button) and "Sign up"(role=button). This public access is independent of the authenticated comment controls in REQ-3.1.

      ![image](./reference/question-page.jpeg)
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Read without an account
      steps:
      - keyword: GIVEN
        content: The browser has no session and DATA-HISTORY includes How can I safely retry an idempotent HTTP request
          in Node.js? with its body, tags and answers.
      - keyword: WHEN
        content: Open Questions, enter the exact title in banner Search, press Enter and choose that title from Search
          results.
      - keyword: THEN
        content: The public heading, Question post body and node.js/http/retry tags are readable without a login form;
          existing Answers remains readable and the banner still offers Log in and Sign up.
- id: REQ-2
  name: Account and public identity
  type: FOLDER
  dependencies: []
  description: |-
    Email/password account creation and login; social/SSO excluded. Verified source accounts are initialized by evaluator. Owners can edit their profile and access protected activity. No moderator threshold is invented.
    ![image](./reference/login.jpeg)

    Login and Sign up each expose a named form region and submit button. Form errors are visible within their form. Public profile is a named region; user catalog profile actions combine display name and email to distinguish identical display names. Unavailable unauthorized actions may be absent or disabled.
  children:
  - id: REQ-2.1
    name: Sign in with email and password
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Clicking "Log in"(role=button) opens "Log in"(role=region) containing "Email"(role=textbox), "Password"(role=textbox), a "Show password"(role=button) toggle, Forgot password? and Sign up entry points. "Show password" reveals the current password without changing its value and becomes "Hide password"(role=button), which restores masking. "Forgot password?"(role=button) remains available as the recovery entry. Submitting valid credentials returns home with "Stack User"(role=button) as the profile action and a session that survives reload. Empty credentials show Email cannot be empty and Password cannot be empty; malformed email shows The email is not a valid email address; an absent account shows No account found with this email; an incorrect password shows The email or password does not match any account. Rejections retain the form and anonymous state.

      ![image](./reference/login.jpeg)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-STATE
    scenarios:
    - name: Sign in and retain session
      steps:
      - keyword: GIVEN
        content: DATA-ACCOUNTS contains stack_user@example.com with Password123! and display name Stack User; the browser
          is anonymous.
      - keyword: WHEN
        content: Open Log in from the banner, enter the account Email and Password, submit Log in, and reload the returned
          homepage.
      - keyword: THEN
        content: Question feed appears; after reload the banner still exposes Stack User and no Log in action, demonstrating
          a retained session.
    - name: Reject empty credentials
      steps:
      - keyword: GIVEN
        content: The anonymous Log in region is open with Email and Password both empty.
      - keyword: WHEN
        content: Click Log in inside that form without entering credentials.
      - keyword: THEN
        content: Email cannot be empty and Password cannot be empty are visible within the retained form; the banner
          remains anonymous and no account profile action appears.
    - name: Reject malformed email
      steps:
      - keyword: GIVEN
        content: The anonymous Log in region is open.
      - keyword: WHEN
        content: Enter invalid-email-format in Email and Password123! in Password, then submit Log in.
      - keyword: THEN
        content: The email is not a valid email address appears in the retained form and no Stack User profile action
          appears.
    - name: Reject unknown account
      steps:
      - keyword: GIVEN
        content: The anonymous Log in form is open; unknown_user@example.com does not exist in the initial account world.
      - keyword: WHEN
        content: Fill Email with unknown_user@example.com and Password with Password123!, then submit Log in.
      - keyword: THEN
        content: No account found with this email appears in the retained form; no Stack User profile action appears
          and the browser remains anonymous.
    - name: Reject wrong password
      steps:
      - keyword: GIVEN
        content: The anonymous Log in form is open and stack_user@example.com exists with Password123!.
      - keyword: WHEN
        content: Enter that email and WrongPassword123!, then submit Log in.
      - keyword: THEN
        content: The email or password does not match any account appears in the retained form; the account profile
          action is absent.
    - name: Toggle password visibility
      steps:
      - keyword: GIVEN
        content: The anonymous Log in form is open with its Forgot password? and Sign up entries available; Password
          starts masked.
      - keyword: WHEN
        content: Enter Password123!, click Show password, inspect the field, then click Hide password and inspect again.
      - keyword: THEN
        content: Password becomes readable and then masked again without changing Password123!; recovery and signup
          entries remain available throughout the form.
  - id: REQ-2.2
    name: Create an account
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Clicking "Sign up"(role=button) opens "Sign up"(role=region) with Join Stack Overflow heading, "Email"(role=textbox), "Password"(role=textbox), password help, consent text, and a Log in entry. Submitting a unique valid email and password creates the account and signs it in automatically, exposing "<registered email>"(role=button) as the profile action when no display name was entered. An existing email shows Email is already in use; a short password shows visible requirements including a minimum of eight characters. Rejections retain the form without an authenticated session. Registration emails use deterministic run, worker, and case suffixes; verification is not added.

      ![image](./reference/sign-up.jpeg)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-RUNTIME
      - DATA-STATE
    scenarios:
    - name: Register and automatically sign in
      steps:
      - keyword: GIVEN
        content: A fresh anonymous browser uses an unused new_stack_user email containing the evaluator's deterministic
          case suffix; Password123! satisfies the declared password rule.
      - keyword: WHEN
        content: Open Sign up from the banner, inspect Join Stack Overflow and terms/privacy text, fill Email with the
          isolated email and Password with Password123!, then submit Sign up.
      - keyword: THEN
        content: The banner exposes that exact registered email as the profile action and Question feed appears, confirming
          account creation and automatic authentication.
    - name: Reject duplicate email
      steps:
      - keyword: GIVEN
        content: The anonymous Sign up form is open and DATA-ACCOUNTS already contains stack_user@example.com.
      - keyword: WHEN
        content: Enter stack_user@example.com and Password123! and submit Sign up.
      - keyword: THEN
        content: Email is already in use appears within the retained form; Stack User is absent from the banner and
          no authenticated session is created.
    - name: Reject weak password
      steps:
      - keyword: GIVEN
        content: The anonymous Sign up form is open with an unused weak_password_candidate email using the deterministic
          case suffix.
      - keyword: WHEN
        content: Enter the unused email and short as Password, then submit Sign up.
      - keyword: THEN
        content: The form visibly explains the minimum eight-character requirement and stays open; the proposed email
          profile action is absent and registration does not authenticate.
  - id: REQ-2.3
    name: Open profile summary
    type: ATOMIC
    dependencies:
    - REQ-2.1
    description: |-
      A signed-in user clicks the unique "Stack User"(role=button) header profile action to open Activity Summary. The profile displays numeric "Reputation"(role=status), "Badges"(role=region), and "Recent activity"(role=region); "Profile navigation"(role=navigation) offers Activity and Reputation views.

      ![image](./reference/profile-page.jpeg)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-ACTIVITY
    scenarios:
    - name: View personal summary
      steps:
      - keyword: GIVEN
        content: Authenticate stack_user@example.com through Log in with Password123!; the banner exposes Stack User.
      - keyword: WHEN
        content: Click Stack User to open the personal profile and inspect its summary and navigation.
      - keyword: THEN
        content: Profile navigation offers Activity, Activity navigation marks Summary current=page, numeric Reputation
          is visible, and Badges and Recent activity are visible regions.
  - id: REQ-2.4
    name: Update public identity
    type: ATOMIC
    dependencies:
    - REQ-2.3
    description: |-
      The profile_editor account clicks "Edit profile"(role=button) to open Edit your profile with "Display name"(role=textbox), "Full name"(role=textbox), "Location"(role=textbox), "Title"(role=textbox), "About me"(role=textbox), "Website"(role=textbox), "X"(role=textbox), and "GitHub"(role=textbox) prefilled from DATA-ACCOUNTS. "Save and copy changes to all public communities"(role=button) saves the supplied values, updates the display name, location, title, and about text in "Public profile"(role=region), and shows a success status. Source examples www.example.dev and github.com/example are accepted; an added https:// prefix is allowed. Reopening confirms every submitted field, including full name and URLs. Preview is required only if supplied, and unspecified length or URL thresholds are not invented.

      ![image](./reference/edit-profile.jpeg)
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Save and reopen public identity
      steps:
      - keyword: GIVEN
        content: Authenticate profile_editor and open its own profile. The seeded fields are Stack User, Existing User,
          Beijing, Developer, Existing biography, https://example.org, https://x.com/example and https://github.com/existing.
      - keyword: WHEN
        content: Click Edit profile and verify all eight prefilled fields. Set Display name to Stack User Updated, Full
          name to Stack Overflow User, Location to Shanghai, Title to Backend Engineer, About me to I enjoy building
          APIs and developer tooling for teams., Website to www.example.dev and GitHub to github.com/example; leave
          X unchanged. Save and copy changes to all public communities, then reopen Edit profile.
      - keyword: THEN
        content: A successful update status appears and Public profile displays the new display name, location, title
          and biography. Reopened fields retain every submitted value, allowing https:// normalization on Website and
          GitHub, while X remains unchanged.
  - id: REQ-2.5
    name: Switch between account entry forms
    type: ATOMIC
    dependencies:
    - REQ-2.1
    - REQ-2.2
    description: |-
      The anonymous user can move from "Log in"(role=region) to "Sign up"(role=region) through its Sign up entry and return through Log in. Each visible form provides correctly labeled "Email"(role=textbox) and "Password"(role=textbox), with "Sign up"(role=button) or "Log in"(role=button) as its matching submit action. Switching forms preserves anonymous status and adds no social login behavior.

      ![image](./reference/login.jpeg)
      ![image](./reference/sign-up.jpeg)
    data:
      requires: []
    scenarios:
    - name: Move between login and registration
      steps:
      - keyword: GIVEN
        content: The browser is anonymous on the application entry.
      - keyword: WHEN
        content: Open Log in from the banner, choose Sign up within the login form, inspect that form, then choose Log
          in within Sign up.
      - keyword: THEN
        content: Each transition displays only the chosen account-entry region with Email, Password and its matching
          submit action. The other form is absent, and no account profile action appears.
  - id: REQ-2.6
    name: Authenticate a newly registered account
    type: ATOMIC
    dependencies:
    - REQ-2.2
    - REQ-2.1
    description: |-
      An account created by entering "Email"(role=textbox) and "Password"(role=textbox) and submitting "Sign up"(role=button) can authenticate with those credentials in a fresh browser context through "Log in"(role=button). Successful login displays the homepage feed and "<registered email>"(role=button) as the profile action, demonstrating that registration and credential login compose without a verification workflow.

      ![image](./reference/sign-up.jpeg)
    data:
      requires:
      - DATA-RUNTIME
      - DATA-STATE
    scenarios:
    - name: Log in with UI-created credentials
      steps:
      - keyword: GIVEN
        content: Use Sign up UI to create an isolated new_stack_user email with Password123! and observe its automatically
          signed-in profile action; then open a fresh independent anonymous browser context at the same business world.
      - keyword: WHEN
        content: In the fresh context open Log in, enter the created Email and Password123!, and submit Log in.
      - keyword: THEN
        content: The fresh context initially has no email profile action; credential submission displays that exact
          email action and Question feed, proving the created credentials work independently of the registration session.
- id: REQ-3
  name: Publish and maintain questions
  type: FOLDER
  dependencies: []
  description: |-
    Questions carry title, rendered body, tags, engagement metadata and author attribution. Owner deletion hides the post from public lists; database preservation is outside the observable oracle.
    ![image](./reference/questions-page.jpeg)

    Question details use Question post and Answers regions. Author information is scoped to Author. Score, Answer count, View count and Title character count are named numeric status outputs; active votes expose pressed state.
  children:
  - id: REQ-3.1
    name: Read question detail
    type: ATOMIC
    dependencies:
    - REQ-1.1
    - REQ-2.1
    description: |-
      Selecting "How can I safely retry an idempotent HTTP request in Node.js?"(role=button) from the feed opens that question's heading and "Question post"(role=region), with its rendered source body, node.js/http/retry tags, Ask Question entry, numeric "Score"(role=status), and "Up vote"(role=button), "Down vote"(role=button), "Save"(role=button), "Timeline"(role=button), "Share"(role=button), "Edit"(role=button), and "Follow"(role=button) controls. "Asked"(role=status) and "Modified"(role=status) display registry timestamps or an unambiguous UTC equivalent; "View count"(role=status) is at least the initial 42 because opening may increase views. "Author"(role=region) shows Helpful User's identity, avatar, initial reputation, current badges, and time. Authenticated users also see Comments with "Add a comment"(role=button). Feed tags, score, and answer count agree with the detail. Unrequested Share, Follow, and Timeline behavior is not invented.

      ![image](./reference/question-page.jpeg)
    data:
      requires:
      - DATA-HISTORY
      - DATA-ACCOUNTS
    scenarios:
    - name: Read a published question
      steps:
      - keyword: GIVEN
        content: Authenticate stack_user and use public Search to open the seeded retry question, whose score is 7,
          initial views 42, Asked July 1 and Modified July 10, with Helpful User as author.
      - keyword: WHEN
        content: Inspect the heading, Question post, named Asked/Modified/View count outputs, tags, vote/save/timeline/share/edit/follow
          controls, Author information and Comments entry.
      - keyword: THEN
        content: The exact heading and seeded rendered body appear with node.js/http/retry tags, Score 7, correct UTC
          Asked and Modified dates and View count at least 42. Author shows Helpful User, avatar, numeric reputation,
          badges and time; authenticated Comments offers Add a comment. All declared post actions are visible.
  - id: REQ-3.2
    name: Publish a question
    type: ATOMIC
    dependencies:
    - REQ-2.1
    description: |-
      A signed-in user clicks "Ask Question"(role=button), enters "Title"(role=textbox) with at least 15 characters and "Body"(role=textbox) with at least 220 characters, and selects at least one tag through "Tags"(role=textbox). Markdown renders live in "Preview"(role=region), while "Title character count"(role=status) shows the title length. Entering node.js displays "Suggestions"(role=region) including node.js, http, and retry; the tag input accepts comma-separated selected names. "Post Your Question"(role=button) publishes the entered title, body, and tags, opens their detail, and adds the title to the owner's Questions activity. Missing or insufficient inputs show Title is required (minimum 15 characters), Question body is required (minimum 220 characters), or Please add at least one tag as applicable, retaining the editor without publishing. No upper tag-count limit is invented.

      ![image](./reference/ask-question-page.jpeg)
    data:
      requires:
      - DATA-TAGS
      - DATA-RUNTIME
    scenarios:
    - name: Publish with preview and tags
      steps:
      - keyword: GIVEN
        content: Authenticate question_creator with no question having the isolated How can I safely retry an idempotent
          HTTP request in Node.js without duplicating side effects? title; DATA-RUNTIME supplies a valid body longer
          than 220 characters.
      - keyword: WHEN
        content: Click Ask Question in Question feed, fill Title with that isolated title and Body with Markdown Retry
          safety followed by the registry body; inspect Title character count and Preview. Enter node.js in Tags to
          inspect suggestions, then enter node.js,http,retry and Post Your Question. Open the owner's Questions activity.
      - keyword: THEN
        content: Character count equals the title length, Preview renders Retry safety and body, and Suggestions offers
          node.js/http/retry. Publication opens the exact title with rendered body and all three tags; the owner's Questions
          activity exposes that exact title.
    - name: Reject missing required fields
      steps:
      - keyword: GIVEN
        content: Authenticate question_creator and open an empty Ask Question editor with no current draft published.
      - keyword: WHEN
        content: Click Post Your Question with all fields empty; enter a valid isolated title and submit again with
          Body empty; enter the valid registry body and submit again with Tags empty.
      - keyword: THEN
        content: Each stage shows the corresponding exact Title is required (minimum 15 characters), Question body is
          required (minimum 220 characters), or Please add at least one tag message. The editor remains available and
          no Question post is published.
    - name: Reject too-short title and body
      steps:
      - keyword: GIVEN
        content: Authenticate question_creator and open Ask Question with a valid registry body and http tag available.
      - keyword: WHEN
        content: Enter the 14-character title 12345678901234 with valid Body and Tags and submit; replace it with a
          valid isolated title, set Body to 219 a characters and submit again.
      - keyword: THEN
        content: The first submission shows the minimum-15 title error and the second the minimum-220 body error; Body
          remains editable and no Question post is published.
  - id: REQ-3.3
    name: Revise a question
    type: ATOMIC
    dependencies:
    - REQ-3.2
    - REQ-3.1
    description: |-
      The owner clicks "Edit"(role=button) within Question post to open "Title"(role=textbox), "Body"(role=textbox), and "Tags"(role=textbox) prefilled from that question. The editor provides "Bold"(role=button), "Italic"(role=button), and "Code"(role=button), live "Preview"(role=region), "How to Edit"(role=region) guidance, and "Rev"(role=combobox) for selecting prior revisions. Users record their reason in "Edit Summary"(role=textbox); "Save edits"(role=button) updates the question, shows edited metadata, and adds a revision with the reason available through "Timeline"(role=button) in "Revision history"(role=region). "Cancel"(role=button) returns to the original view without applying a draft. The preview and save scenarios independently UI-create their case-suffixed SO Question Edit Preview and SO Question Edit Save examples.

      ![image](./reference/edit-question.jpeg)
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Preview and cancel a question revision
      steps:
      - keyword: GIVEN
        content: Through public UI, question_editor owns isolated SO Question Edit Preview with the registry body and
          node.js,http,retry tags; authenticate that owner and open the question through Search.
      - keyword: WHEN
        content: Click Edit and verify prefilled Title, Body and Tags. Append clarified to Title, change Tags to http,retry,
          select all Body and click Bold; inspect Preview, How to Edit, Italic, Code and Rev, then Cancel.
      - keyword: THEN
        content: The editor begins with saved metadata; Bold changes the editor body while Preview retains its rendered
          text and guidance/revision controls are available. Cancel restores the original title, body and all three
          tags rather than committing the draft.
    - name: Save revision and summary
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Question Edit Save under question_editor with registry body and node.js,http,retry,
          then authenticate its owner and open Edit.
      - keyword: WHEN
        content: Append clarified to Title and Include bounded retry budgets. to Body, set Tags to http,retry and Edit
          Summary to Fixed a typo in the second paragraph; Save edits and open Timeline.
      - keyword: THEN
        content: The detail shows the replacement heading and body, edited metadata and only http/retry tags. Revision
          history contains the summary and both original and replacement body values.
  - id: REQ-3.4
    name: Delete an eligible own question
    type: ATOMIC
    dependencies:
    - REQ-3.2
    description: |-
      The author of an unanswered, minimally engaged UI-created SO Deletable Question can click "Delete"(role=button). Confirmation presents its consequences in "Confirm deletion"(role=dialog), and "Confirm deletion"(role=button) removes the selected question from public Question feed and returns to the populated homepage. Internal soft deletion or database retention is not asserted.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Confirm own question deletion
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Deletable Question under question_deleter, unanswered and minimally engaged;
          authenticate that author and open its detail.
      - keyword: WHEN
        content: Click Delete, inspect the Confirm deletion dialog's consequences, confirm, reopen Questions and search
          the exact deleted title publicly.
      - keyword: THEN
        content: Populated Question feed returns and still includes the seeded retry question. The deleted title is
          absent from both public feed and exact-title Search results; no internal database-retention claim is made.
  - id: REQ-3.5
    name: Toggle question upvote
    type: ATOMIC
    dependencies:
    - REQ-2.1
    - REQ-3.1
    description: |-
      The question_upvoter account clicks "Up vote"(role=button) on SO Upvote Question, changing "Score"(role=status) from 7 to 8, setting pressed=true, and increasing the author's public "Reputation"(role=status) by 10. Reload retains both changes. Clicking again restores score 7, pressed=false, and the prior reputation. Reputation is measured relative to baseline because Helpful User may receive independent contributions.
    data:
      requires:
      - DATA-HISTORY
      - DATA-ACCOUNTS
      - DATA-STATE
    scenarios:
    - name: Apply and remove question upvote
      steps:
      - keyword: GIVEN
        content: Authenticate question_upvoter and open SO Upvote Question with Score 7; record the author's current
          numeric Reputation from Author.
      - keyword: WHEN
        content: Click Up vote, reload the detail, then click Up vote again.
      - keyword: THEN
        content: First activation and reload retain Score 8, pressed=true and author reputation baseline+10. Second
          activation restores Score 7, pressed=false and the recorded reputation baseline.
  - id: REQ-3.6
    name: Downvote a question
    type: ATOMIC
    dependencies:
    - REQ-2.1
    - REQ-3.1
    description: |-
      The question_downvoter account clicks "Down vote"(role=button) on SO Downvote Question, reducing "Score"(role=status) from 3 to 2, exposing pressed=true, and reducing the author's "Reputation"(role=status) by 2.
    data:
      requires:
      - DATA-HISTORY
      - DATA-ACCOUNTS
    scenarios:
    - name: Apply question downvote
      steps:
      - keyword: GIVEN
        content: Authenticate question_downvoter and open SO Downvote Question with Score 3; record the author reputation
          baseline.
      - keyword: WHEN
        content: Click Down vote within Question post.
      - keyword: THEN
        content: Score becomes 2, Down vote exposes pressed=true, and the Author reputation becomes baseline−2.
  - id: REQ-3.7
    name: Open an owned question from activity
    type: ATOMIC
    dependencies:
    - REQ-3.2
    - REQ-2.3
    description: |-
      After publishing a question, the author opens "Questions"(role=button) in activity. "Activity content"(role=region) contains "<created question title>"(role=button); selecting it opens that exact question with its saved body and tags rather than another feed item.

      ![image](./reference/user-feed.jpeg)
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Follow an owned question to its detail
      steps:
      - keyword: GIVEN
        content: Authenticate question_creator and publish isolated SO Activity Question Navigation through Ask Question
          with registry body and node.js,http,retry.
      - keyword: WHEN
        content: Open the owner's profile Activity then Questions and click the exact newly created title in Activity
          content.
      - keyword: THEN
        content: The same title heading, registry body and all three tags appear in Question post, preserving the selected
          question's identity.
  - id: REQ-3.8
    name: Retain a saved question revision
    type: ATOMIC
    dependencies:
    - REQ-3.3
    description: |-
      The owner saves a revision through "Title"(role=textbox), "Body"(role=textbox), "Tags"(role=textbox), and "Edit Summary"(role=textbox), then "Save edits"(role=button). The public question reflects the saved title, body, and tags, and "Timeline"(role=button) exposes the retained summary in "Revision history"(role=region). Reopening through public discovery under another account shows saved values rather than an editor-only draft.

      ![image](./reference/edit-question.jpeg)
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Read saved revision as another user
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Persisted Question Revision under question_editor with registry body and node.js,http,retry,
          then open Edit as its owner.
      - keyword: WHEN
        content: Append clarified to Title and Use a bounded retry budget. to Body, set Tags to http,retry and Edit
          Summary to Documented bounded retry budget.; Save edits. Authenticate stack_user in an independent context,
          search the replacement title, reload the detail and open Timeline.
      - keyword: THEN
        content: The owner sees the new heading. The independent visitor reads replacement body and only http/retry
          tags; Revision history retains the submitted summary rather than an editor-local draft.
  - id: REQ-3.9
    name: Protect question deletion by ownership
    type: ATOMIC
    dependencies:
    - REQ-3.4
    - REQ-2.1
    description: |-
      An ordinary authenticated non-owner has no usable "Delete"(role=button) on another author's eligible question; the action is absent or disabled. The question remains publicly readable in "Question post"(role=region). The author's deletion privilege does not transfer to other users, and moderator behavior is outside these scenarios.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Prevent non-owner question deletion
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Ownership Protected Question under question_deleter, then authenticate ordinary
          stack_user and open it through public Search.
      - keyword: WHEN
        content: Inspect the Question post's Delete availability without invoking any private operation.
      - keyword: THEN
        content: Delete is absent or disabled, no Confirm deletion dialog opens, and the exact heading and original
          registry body remain readable.
- id: REQ-4
  name: Answer and evaluate solutions
  type: FOLDER
  dependencies: []
  description: |-
    Authenticated answers, votes, acceptance, ordering and owner maintenance. An answer belongs to exactly its question. Only question owner accepts a single answer; accepted answer is marked green and Accepted answer.
    ![image](./reference/post-answer.jpeg)

    Answers contains answer regions named Answer by <display name>, unique per parent in the supplied data. Author information is scoped to Author. Score is a named numeric status and active votes expose pressed state.
  children:
  - id: REQ-4.1
    name: Publish an answer
    type: ATOMIC
    dependencies:
    - REQ-3.2
    - REQ-2.1
    description: |-
      The authenticated answer_submitter opens the UI-created SO Answer Submission Question, enters the DATA-RUNTIME answer in "Your Answer"(role=textbox), and clicks "Post Your Answer"(role=button). The detail adds "Answer by Stack User"(role=region) under that question's "Answers"(role=region), showing its author and updating "Answer count"(role=status). The owner's Answers activity links the correct parent and shows the excerpt; reload retains the answer.

      ![image](./reference/post-answer.jpeg)
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Publish and discover own answer
      steps:
      - keyword: GIVEN
        content: question_creator has UI-published isolated SO Answer Submission Question with no answers. Authenticate
          answer_submitter and open that exact question.
      - keyword: WHEN
        content: Fill Your Answer with the DATA-RUNTIME answer body and click Post Your Answer; reload and open the
          author's Answers activity.
      - keyword: THEN
        content: Answer by Stack User appears under the correct Answers region with the submitted body, and Answer count
          becomes 1. Reload retains it; the owner's activity exposes the correct parent title and answer excerpt.
  - id: REQ-4.2
    name: Toggle answer upvote
    type: ATOMIC
    dependencies:
    - REQ-4.1
    - REQ-2.1
    description: |-
      The answer_voter clicks "Up vote"(role=button) within "Answer by Helpful User"(role=region) on the UI-created SO Answer Voting Question. The new answer's "Score"(role=status) changes from 0 to 1, the vote becomes active, and author "Reputation"(role=status) increases by 10. Clicking the same vote again restores score 0, inactive state, and the prior reputation.
    data:
      requires:
      - DATA-RUNTIME
      - DATA-ACCOUNTS
    scenarios:
    - name: Apply and remove answer upvote
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Answer Voting Question and a Helpful User answer through Post Your Answer. Authenticate
          answer_voter, open it, record question Score and answer Author reputation; answer Score starts 0.
      - keyword: WHEN
        content: Click Up vote inside Answer by Helpful User, then click the same action again.
      - keyword: THEN
        content: First activation makes answer Score 1, pressed=true and author reputation baseline+10; second restores
          Score 0, pressed=false and baseline. The parent question's recorded Score is unchanged at both stages.
  - id: REQ-4.3
    name: Accept a single answer
    type: ATOMIC
    dependencies:
    - REQ-4.1
    - REQ-2.1
    description: |-
      The question owner answer_accept_owner clicks "Accept answer"(role=button) in Helpful User's answer to mark it with a green check and "Accepted answer"(role=button), persisting after reload. With two answers, accepting the other transfers the marker and leaves exactly one accepted answer. Non-owners have no usable Accept answer action; exclusivity is observed through public markers rather than storage.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Accept and replace definitive solution
      steps:
      - keyword: GIVEN
        content: answer_accept_owner UI-creates isolated SO Accepted Answer Question; Helpful User and answer_submitter
          each publish an answer, the latter saying Use a bounded retry budget with diagnostics. Authenticate the question
          owner.
      - keyword: WHEN
        content: Click Accept answer in Helpful User's answer, reload, then click Accept answer in Answer by Stack User.
      - keyword: THEN
        content: 'Helpful User''s Accepted answer remains after reload. Accepting Stack User transfers the marker: Answers
          contains exactly one Accepted answer, on Stack User, with none remaining on Helpful User.'
    - name: Prevent non-owner acceptance
      steps:
      - keyword: GIVEN
        content: answer_accept_owner UI-creates the isolated question and Helpful User posts an answer; authenticate
          ordinary answer_voter, who does not own the question.
      - keyword: WHEN
        content: Open the question and inspect Accept answer in Helpful User's visible answer.
      - keyword: THEN
        content: Accept answer is absent or disabled and Answers has no Accepted answer marker.
  - id: REQ-4.4
    name: Order answers by score
    type: ATOMIC
    dependencies:
    - REQ-3.1
    description: |-
      SO Answer Sorting Question shows numeric "Answer count"(role=status) and "Sorted by"(role=combobox) with exactly Highest score, Trending, and Date modified. Initially Date modified shows the newer two-point answer before the older nine-point answer in "Answers"(role=region). Selecting Highest score immediately reverses their visible sequence. Sequential answer text makes ordering observable; no unspecified Trending ranking is inferred.
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Select highest-score ordering
      steps:
      - keyword: GIVEN
        content: The anonymous browser opens seeded SO Answer Sorting Question with two answers, initially Date modified
          ordering the recent two-point answer before the older nine-point answer.
      - keyword: WHEN
        content: Inspect Sorted by options, then select Highest score.
      - keyword: THEN
        content: Options are exactly Highest score, Trending and Date modified. Answer count is 2 and the Answers text
          places Highest score answer before Recent answer after selection.
  - id: REQ-4.5
    name: Revise an own answer
    type: ATOMIC
    dependencies:
    - REQ-4.1
    description: |-
      An answer owner clicks "Edit"(role=button) to open prefilled "Body"(role=textbox) and "Edit Summary"(role=textbox). "Save edits"(role=button) updates visible content, adds a revision available through "Timeline"(role=button) in "Revision history"(role=region), and shows edited metadata even if the submitted body is unchanged. An empty body shows Body cannot be empty and retains the editor and original answer. "Cancel"(role=button) discards pending changes. Successful-edit and validation scenarios independently UI-create their respective questions.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Record same-body answer revision
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Successful Answer Edit Question and its answer under answer_edit_user; authenticate
          that author and open the answer's Edit action.
      - keyword: WHEN
        content: Verify Body is prefilled with the registry answer, keep that same Body, enter Clarified retry safety.
          in Edit Summary, click Save edits and open the answer's Timeline.
      - keyword: THEN
        content: The unchanged body remains visible with edited metadata, and Revision history includes Clarified retry
          safety., demonstrating a saved same-body revision.
    - name: Reject empty answer edit
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Answer Validation Question with answer_validation_user's registry answer; authenticate
          that owner and open Edit.
      - keyword: WHEN
        content: Clear Body, click Save edits, then Cancel after inspecting the rejection.
      - keyword: THEN
        content: Body cannot be empty appears and the editor remains available. Cancel restores the original visible
          answer body, showing the invalid draft did not replace it.
    - name: Cancel answer edit
      steps:
      - keyword: GIVEN
        content: UI-create an independent isolated SO Answer Validation Question and answer under answer_validation_user,
          then open Edit as that owner.
      - keyword: WHEN
        content: Replace Body with Unsaved answer edit draft. and click Cancel.
      - keyword: THEN
        content: The editor is absent, the original answer body remains, and the answer does not contain the unsaved
          replacement.
  - id: REQ-4.6
    name: Delete an unaccepted own answer
    type: ATOMIC
    dependencies:
    - REQ-4.1
    - REQ-4.2
    description: |-
      The answer_delete_user clicks "Delete"(role=button) on its UI-created unaccepted answer This answer is reserved for the answer deletion scenario. "Confirm deletion"(role=dialog) explains the consequences, and "Confirm deletion"(role=button) hides the answer publicly, updates "Answer count"(role=status), and reverses reputation gained from its vote. Setup creates one answer and applies one upvote from answer_voter before owner deletion, using the established +10 rule.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Delete answer and reverse vote reputation
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Answer Delete Question and answer_delete_user's unaccepted answer This answer
          is reserved for the answer deletion scenario. Record the answer author reputation; as answer_voter upvote
          it and verify the +10 increase.
      - keyword: WHEN
        content: Authenticate answer_delete_user, open the answer, click Delete and confirm in Confirm deletion; inspect
          answer count and the author's profile. Reopen the question as independent stack_user.
      - keyword: THEN
        content: The answer body is absent publicly, Answer count is 0 and the author's Reputation returns to its recorded
          baseline. The independent visitor also sees no answer and count 0.
  - id: REQ-4.7
    name: Order answers by modification date
    type: ATOMIC
    dependencies:
    - REQ-4.4
    description: |-
      Selecting Date modified in "Sorted by"(role=combobox) orders "Answers"(role=region) by newest modification first. The historical question's distinct timestamps place Recent answer before Highest score answer. Switching from Highest score visibly reverses their sequence without changing "Answer count"(role=status) or their parent question.

      ![image](./reference/question-page.jpeg)
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Switch to latest-modified answers
      steps:
      - keyword: GIVEN
        content: An anonymous visitor opens seeded SO Answer Sorting Question, whose two answers have distinct scores
          and modification dates.
      - keyword: WHEN
        content: Select Highest score in Sorted by and verify its sequence; then choose Date modified.
      - keyword: THEN
        content: Ordering changes from highest-score-first to Recent answer before Highest score answer. Answer count
          remains 2 and the parent question heading is unchanged.
  - id: REQ-4.8
    name: Save changed answer content
    type: ATOMIC
    dependencies:
    - REQ-4.5
    description: |-
      The answer author clicks "Edit"(role=button), replaces the nonempty "Body"(role=textbox), records "Edit Summary"(role=textbox), and clicks "Save edits"(role=button). The public answer displays the replacement and edited metadata; "Timeline"(role=button) reveals its saved summary in "Revision history"(role=region). A separate visitor sees the replacement after reload. The unchanged-body revision case remains in REQ-4.5.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Publish an actual answer correction
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Changed Answer Revision and answer_edit_user's registry answer; authenticate
          that author and open the answer's Edit action.
      - keyword: WHEN
        content: Replace Body with Use bounded exponential backoff, an idempotency key, and a deadline so retries remain
          safe and observable.; enter Added deadline guidance. in Edit Summary and Save edits. Open and reload the question
          as independent stack_user, then open that answer's Timeline.
      - keyword: THEN
        content: The public answer contains the replacement rather than the original body, shows edited metadata, and
          Revision history retains Added deadline guidance., including in the independent visitor context.
  - id: REQ-4.9
    name: Protect another author answer from deletion
    type: ATOMIC
    dependencies:
    - REQ-4.6
    description: |-
      An ordinary authenticated user other than the answer author cannot activate "Delete"(role=button) on the target unaccepted answer. "Answer by Helpful User"(role=region) remains visible and "Answer count"(role=status) stays unchanged; moderator actions are unspecified.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Prevent non-owner answer deletion
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Protected Answer Ownership with a Helpful User answer; authenticate answer_voter,
          a different ordinary user.
      - keyword: WHEN
        content: Open the question and inspect Delete within the visible Answer by Helpful User region.
      - keyword: THEN
        content: Delete is absent or disabled, the registry answer body remains readable, and Answer count remains 1.
  - id: REQ-4.10
    name: Prevent deletion of an accepted own answer
    type: ATOMIC
    dependencies:
    - REQ-4.3
    - REQ-4.6
    description: |-
      Once the question owner clicks "Accept answer"(role=button), the answer displays "Accepted answer"(role=button) and its author has no usable "Delete"(role=button). The accepted solution remains public because ordinary own-answer deletion applies only to unaccepted answers. This single-answer scenario makes no assertions about internal deleted or accepted records.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Keep the accepted solution protected
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Protected Accepted Answer under answer_accept_owner; answer_delete_user posts
          its registry answer, and the question owner accepts that answer through Accept answer.
      - keyword: WHEN
        content: Authenticate answer_delete_user, open the question and inspect Accepted answer and Delete within its
          own answer.
      - keyword: THEN
        content: Accepted answer and the original body remain visible, but Delete is absent or disabled even for the
          answer author.
- id: REQ-5
  name: Discuss posts
  type: FOLDER
  dependencies: []
  description: |-
    Question and answer comments display author and timestamp in chronological order. Own comments may be edited within five minutes; deletion is immediate. Replies belong to their parent. Comments support upvotes only.
    ![image](./reference/add-comment.jpeg)

    Comments is scoped to its post; each comment is a region named Comment <body>, and Replies is scoped to its parent comment. Comment votes is a named numeric status; active votes expose pressed state.
  children:
  - id: REQ-5.1
    name: Comment on a question
    type: ATOMIC
    dependencies:
    - REQ-3.2
    - REQ-2.1
    description: |-
      The authenticated question_comment_user clicks "Add a comment"(role=button) within Question post, enters the source comment in "Comment"(role=textbox), and presses Enter. The question's "Comments"(role=region) displays the text, Stack User attribution, and timestamp, retaining the comment after refresh.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Publish a question comment
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Question Comment Question under question_creator; authenticate question_comment_user
          and open that question.
      - keyword: WHEN
        content: Click Add a comment within Question post, enter Can you share what you tried so far? in Comment and
          press Enter; reload.
      - keyword: THEN
        content: The question's Comments contains the submitted text with Stack User attribution and a timestamp, and
          the same comment remains visible after reload.
  - id: REQ-5.2
    name: Expand hidden comments
    type: ATOMIC
    dependencies:
    - REQ-3.1
    description: |-
      On SO Expanded Comment Question, "Comments"(role=region) initially displays the first five comments chronologically. Clicking "Show 2 more comments"(role=button) reveals all seven source comments in chronological order.
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Reveal the complete comment thread
      steps:
      - keyword: GIVEN
        content: An anonymous visitor opens SO Expanded Comment Question with seven historical comments Retry discussion
          comment 1 through 7 in chronological order; only the first five initially show.
      - keyword: WHEN
        content: Verify first-five visibility and sixth/seventh hidden state, then click Show 2 more comments in that
          post's Comments.
      - keyword: THEN
        content: All seven comments become visible, and their text sequence remains 1 through 7 chronologically.
  - id: REQ-5.3
    name: Edit a comment within its window
    type: ATOMIC
    dependencies:
    - REQ-2.1
    - REQ-3.1
    description: |-
      The comment_edit_user owns a historical question comment posted at 12:00. At fixed benchmark time 12:02, clicking "Edit"(role=button) opens "Comment"(role=textbox) prefilled with that comment. Replacing it with Can you share a minimal retry example? and pressing Enter saves the replacement, displays an edited indicator, and preserves its parent. The application clock enforces the five-minute window: at 12:06 the owner has no enabled Edit action and the original comment remains. The expired scenario uses an independent initial world at environment.expired_comment_now.
    data:
      requires:
      - DATA-HISTORY
      - DATA-ACCOUNTS
    scenarios:
    - name: Save comment within five minutes
      steps:
      - keyword: GIVEN
        content: At fixed UTC clock 2026-07-21T12:02:00Z, authenticated comment_edit_user owns the seeded comment Can
          you share what you tried so far? posted at 12:00 on SO Comment Edit Question.
      - keyword: WHEN
        content: Click Edit within that comment, verify Comment is prefilled, replace it with Can you share a minimal
          retry example? and press Enter.
      - keyword: THEN
        content: The original comment region is absent and the replacement appears under the same Question post with
          an edited indicator.
    - name: Refuse an expired comment edit
      steps:
      - keyword: GIVEN
        content: An independent initial world uses fixed UTC clock 2026-07-21T12:06:00Z and the same comment_edit_user
          comment posted at 12:00, without mutations from the within-window case.
      - keyword: WHEN
        content: Authenticate the owner, open SO Comment Edit Question and inspect Edit on the original comment.
      - keyword: THEN
        content: The original comment remains visible with unchanged text; Edit is absent or disabled because its five-minute
          window has expired.
  - id: REQ-5.4
    name: Delete an own comment immediately
    type: ATOMIC
    dependencies:
    - REQ-5.1
    description: |-
      The comment_delete_user UI-creates its own source comment on SO Comment Delete Question. Clicking "Delete"(role=button) within that comment removes it immediately without confirmation while preserving the remaining post content.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Remove comment without confirmation
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Comment Delete Question and comment_delete_user's Can you share what you tried
          so far? comment through Add a comment and Enter; authenticate its author.
      - keyword: WHEN
        content: Open the question and click Delete within that exact comment.
      - keyword: THEN
        content: The comment disappears immediately, no confirmation dialog appears, and the parent heading and body
          remain readable.
  - id: REQ-5.5
    name: Toggle comment upvote
    type: ATOMIC
    dependencies:
    - REQ-2.1
    - REQ-3.1
    description: |-
      The comment_vote_user clicks "Up vote"(role=button) on the historical comment, changing "Comment votes"(role=status) from 1 to 2 and pressed state from false to true. Clicking again restores 1 and pressed=false. Comments offer no Down vote action.
    data:
      requires:
      - DATA-HISTORY
      - DATA-ACCOUNTS
    scenarios:
    - name: Apply and remove a helpful-comment vote
      steps:
      - keyword: GIVEN
        content: Authenticate comment_vote_user and open SO Comment Vote Question with a historical comment whose Comment
          votes is 1; no Down vote is offered.
      - keyword: WHEN
        content: Click Up vote within that comment, then click it again.
      - keyword: THEN
        content: Comment votes changes 1→2→1, and Up vote pressed state changes false→true→false, without introducing
          a downvote control.
  - id: REQ-5.6
    name: Comment on an answer
    type: ATOMIC
    dependencies:
    - REQ-4.1
    - REQ-5.1
    description: |-
      The answer_comment_user clicks "Add a comment"(role=button) within the target answer, enters the source text in "Comment"(role=textbox), and presses Enter. The answer's "Comments"(role=region) displays that comment with its author and timestamp; it does not appear in the question's comment thread.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Publish in the answer thread
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Answer Comment Question and Helpful User's answer, then authenticate answer_comment_user
          and open the question.
      - keyword: WHEN
        content: Click Add a comment inside the answer, enter Can you share what you tried so far? in its Comment field
          and press Enter; reload.
      - keyword: THEN
        content: The answer's Comments shows the text with Stack User attribution and timestamp before and after reload;
          Question post's Comments does not contain that answer comment.
  - id: REQ-5.7
    name: Reply to an existing comment
    type: ATOMIC
    dependencies:
    - REQ-5.1
    description: |-
      The comment_reply_user clicks "Reply"(role=button) on a UI-created Helpful User comment on SO Comment Reply Question, opening "Reply"(role=textbox) scoped to that parent. Entering Thanks, I will add the retry case. and clicking "Add Reply"(role=button) places the reply within the parent's "Replies"(role=region), with @Helpful User attribution or mention and visually nested indentation.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Attach a nested reply to its parent
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Comment Reply Question and Helpful User's Can you share what you tried so far?
          comment; authenticate comment_reply_user and open that question.
      - keyword: WHEN
        content: Click Reply within the identified parent comment, enter Thanks, I will add the retry case. in its Reply
          field, click Add Reply and reload.
      - keyword: THEN
        content: The parent's Replies contains the submitted text and @Helpful User mention, and the reply remains attached
          to that same parent after reload.
  - id: REQ-5.8
    name: Protect comment maintenance by ownership
    type: ATOMIC
    dependencies:
    - REQ-5.1
    - REQ-5.3
    - REQ-5.4
    description: |-
      Within "Comment <body>"(role=region), authors can use "Edit"(role=button) during their permitted window and "Delete"(role=button) for their own comments. An ordinary non-owner cannot use either maintenance action on Helpful User's comment. Reply and helpful voting are separate privileges; moderator rules are not invented.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Refuse another user comment maintenance
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Protected Comment Ownership and a Helpful User comment through UI at the within-window
          clock; authenticate stack_user, who is not its author.
      - keyword: WHEN
        content: Open the question and inspect Edit and Delete within the visible comment.
      - keyword: THEN
        content: Both maintenance actions are absent or disabled; original text and Helpful User attribution remain
          unchanged. No moderator privileges are inferred.
  - id: REQ-5.9
    name: Keep separate post comment threads
    type: ATOMIC
    dependencies:
    - REQ-5.1
    - REQ-5.6
    description: |-
      Users add comments through "Add a comment"(role=button), "Comment"(role=textbox), and Enter within the intended post. "Question post"(role=region) and "Answer by Helpful User"(role=region) each contain their own "Comments"(role=region), showing only that parent's comment text and author. When both threads contain comments, they remain distinct and retain their parent-specific contents after reload.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Preserve question and answer thread boundaries
      steps:
      - keyword: GIVEN
        content: UI-create isolated SO Separate Comment Threads, Helpful User's answer and question_comment_user's question
          comment Can you share what you tried so far?. Authenticate answer_comment_user.
      - keyword: WHEN
        content: Open the question, click Add a comment within the answer, enter Please explain the retry deadline.
          and press Enter, then reload.
      - keyword: THEN
        content: The question thread retains only its original comment with attribution, while the answer thread contains
          the distinct reply text with attribution. Neither thread contains the other parent's comment after reload.
- id: REQ-6
  name: Discover by tags and search
  type: FOLDER
  dependencies: []
  description: |-
    Public tags and search; watching and saved custom filters are personal authenticated preferences. General keyword/tag/user/date criteria remain capability context; executable examples cover react state and python unanswered newest.
    ![image](./reference/search-and-filter.jpeg)

    Tag entry regions are named Tag <name>. Selected combobox options expose their visible label. Search accepts a full published question title and returns that exact matching record, including UI-created posts.
  children:
  - id: REQ-6.1
    name: Browse tags and tagged questions
    type: ATOMIC
    dependencies:
    - REQ-1.2
    description: |-
      Tag navigation displays "Tags"(role=region) with "Tag <name>"(role=region) entries ordered by current popularity, each showing description and numeric "Question count"(role=status). Clicking "python"(role=button) opens "Python tag"(role=region), its description, "Related tags"(role=region), and a Question feed containing only python-tagged questions with tag identity visible in each summary. "Next page"(role=button) provides pagination and may be disabled because the fixture fits one page. Counts include UI-created posts and never fall below the immutable catalog baseline; ranking uses current counts rather than totals hard-coded after earlier cases.

      ![image](./reference/tags-page.jpeg)
    data:
      requires:
      - DATA-TAGS
      - DATA-HISTORY
    scenarios:
    - name: Browse popular tags and python questions
      steps:
      - keyword: GIVEN
        content: The anonymous world includes DATA-TAGS with initial counts python 20, javascript 15, node.js 10, http
          8 and retry 5, plus seeded python questions; current counts may include UI-created posts.
      - keyword: WHEN
        content: Click Tags in Main navigation, inspect each Tag <name> region, description, count and Next page; click
          python in its tag entry.
      - keyword: THEN
        content: Every baseline tag and description is visible with count at least its seed value; catalog counts are
          descending. Python tag and Related tags appear, and Question feed includes the two seeded python titles, excludes
          the retry question and shows python on every result summary.
  - id: REQ-6.2
    name: Watch and unwatch a tag
    type: ATOMIC
    dependencies:
    - REQ-6.1
    - REQ-2.1
    description: |-
      The tag_watcher initially does not watch python. Clicking "Watch tag"(role=button) changes it to "Unwatch tag"(role=button) and adds python to "Watched tags"(role=region) in question lists. Unwatch tag removes that entry and restores Watch tag. The personal preference persists across navigation and reload.
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-STATE
    scenarios:
    - name: Toggle python watch preference
      steps:
      - keyword: GIVEN
        content: Authenticate tag_watcher with no python watch, open Tags and choose python.
      - keyword: WHEN
        content: Click Watch tag, navigate to Questions and reload, reopen python through Watched tags, then click Unwatch
          tag and return to Questions.
      - keyword: THEN
        content: Watch tag changes to Unwatch tag and the personal Watched tags list retains python after reload. Unwatch
          restores Watch tag and removes python from that list.
  - id: REQ-6.3
    name: Search public questions
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Entering react state in the banner's "Search"(role=searchbox) displays real-time "Search suggestions"(role=region). Pressing Enter opens "Search results"(role=region) with relevant public question links ranked by relevance. The initial index includes one known React-state match and nonmatching retry and python posts, which are excluded. Keyword, tag, user, and date criteria remain general capability context; unspecified syntax and ranking examples are not invented.

      ![image](./reference/search-and-filter.jpeg)
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Suggest and search react state
      steps:
      - keyword: GIVEN
        content: The anonymous public index contains How does React state update? as the unique seeded react-state match
          and nonmatching retry and python questions.
      - keyword: WHEN
        content: Enter react state in the banner Search, inspect Search suggestions, then press Enter.
      - keyword: THEN
        content: Suggestions and Search results expose the React-state title; results exclude the retry title, SO Python
          Unanswered Recent and SO Python Answered Active.
  - id: REQ-6.4
    name: Change question feed order
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Clicking "Newest"(role=button) in Question feed orders questions by asked time, while "Active"(role=button) orders them by modified time. Each control exposes pressed state when selected. The historical recent python question is newer, while the answered active question has the later modification; compare these identities rather than assuming the whole feed excludes runtime posts.
    data:
      requires:
      - DATA-HISTORY
    scenarios:
    - name: Switch newest and active ordering
      steps:
      - keyword: GIVEN
        content: Anonymous Questions contains SO Python Unanswered Recent with the newer asked date and SO Python Answered
          Active with the later modification date.
      - keyword: WHEN
        content: Click Newest in Question feed, inspect ordering and selection, then click Active.
      - keyword: THEN
        content: Newest reports pressed=true and places the recent unanswered identity before the active answered identity.
          Active reports pressed=true and reverses their sequence; comparisons use business identities even when runtime
          posts also exist.
  - id: REQ-6.5
    name: Save and reuse a custom filter
    type: ATOMIC
    dependencies:
    - REQ-6.4
    - REQ-2.1
    description: |-
      The filter_user clicks "Filter"(role=button) to open "Filter panel"(role=region), activates "Unanswered"(role=checkbox), chooses Newest in "Sort"(role=combobox), and enters python in "Tags"(role=textbox), keeping those criteria visible. "Save custom filter"(role=button) opens "Save custom filter"(role=dialog) with "Filter title"(role=textbox); "Save filter"(role=button) creates the case-suffixed Python unanswered filter and shows only unanswered python questions newest first, excluding answered python and nonpython samples. The named entry in "Saved filters"(role=region) restores these criteria after revisiting or reload.
    data:
      requires:
      - DATA-HISTORY
      - DATA-RUNTIME
    scenarios:
    - name: Save and reapply python unanswered criteria
      steps:
      - keyword: GIVEN
        content: Authenticate filter_user, open Questions and use a fresh isolated Python unanswered filter name; the
          catalog includes answered python and nonpython control questions.
      - keyword: WHEN
        content: Open Filter, check Unanswered in Filter panel, select Newest in Sort and enter python in Tags. Verify
          selections, click Save custom filter, enter the isolated Filter title in the dialog and Save filter. Return
          Home, reload, select that entry from Saved filters and reopen Filter.
      - keyword: THEN
        content: The resulting feed includes SO Python Unanswered Recent but excludes answered python, retry and React-state
          controls; every result has python and Answer count 0. Reopening the saved entry restores those results and
          visible Unanswered, python and Newest criteria.
  - id: REQ-6.6
    name: Open a question through its tag
    type: ATOMIC
    dependencies:
    - REQ-6.1
    - REQ-1.3
    description: |-
      Clicking "python"(role=button) opens "Python tag"(role=region) with navigable public question titles. Selecting "SO Python Unanswered Recent"(role=button) opens that same public question with its python tag, preserving the business identity selected during discovery.

      ![image](./reference/tags-page.jpeg)
    data:
      requires:
      - DATA-HISTORY
      - DATA-TAGS
    scenarios:
    - name: Follow a python question from tag discovery
      steps:
      - keyword: GIVEN
        content: The anonymous world contains public SO Python Unanswered Recent with its body and python tag.
      - keyword: WHEN
        content: Click Tags, choose python in Tag python, then select SO Python Unanswered Recent from the tagged Question
          feed.
      - keyword: THEN
        content: The exact selected heading and registry body open with python in Question post; the banner remains
          anonymous with Log in available.
  - id: REQ-6.7
    name: Keep saved custom filters personal
    type: ATOMIC
    dependencies:
    - REQ-6.5
    description: |-
      An authenticated creator clicks "Filter"(role=button), configures criteria in "Filter panel"(role=region), chooses "Save custom filter"(role=button), enters "Filter title"(role=textbox), and clicks "Save filter"(role=button). Only that creator's "Saved filters"(role=region) exposes the resulting configuration and allows reopening it; another account's region does not expose it. Ownership is observed through public account UI rather than internal preference storage.
    data:
      requires:
      - DATA-RUNTIME
    scenarios:
    - name: Isolate custom filters between accounts
      steps:
      - keyword: GIVEN
        content: Authenticate filter_user and open Questions; stack_user is a separate account with no ownership of
          the proposed isolated Python unanswered filter.
      - keyword: WHEN
        content: Open Filter, check Unanswered, choose Newest, enter python and save the isolated title through Save
          custom filter and Save filter. Inspect Saved filters as independent stack_user, then reload the creator's
          view and reopen its saved entry.
      - keyword: THEN
        content: The creator sees its saved action and can reopen it after reload; the independent account's Saved filters
          does not expose that title or configuration.
  - id: REQ-6.8
    name: Keep tag watches personal
    type: ATOMIC
    dependencies:
    - REQ-6.2
    description: |-
      Clicking "Watch tag"(role=button) for python changes only the signed-in watcher's preference in "Watched tags"(role=region) and exposes "Unwatch tag"(role=button). Another account without a python watch still sees Watch tag and no python entry in its own list. The creator can unwatch to restore the original state so repeated cases do not rely on a previous watch.
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-STATE
    scenarios:
    - name: Isolate tag watch preferences
      steps:
      - keyword: GIVEN
        content: Authenticate tag_watcher with no python watch; stack_user independently starts without that watch.
      - keyword: WHEN
        content: Open python and Watch tag as the creator. In an independent stack_user context inspect Questions/Watched
          tags and reopen python, then return to the creator and click Unwatch tag.
      - keyword: THEN
        content: Only the creator exposes Unwatch tag. Stack_user sees no python in Watched tags and sees Watch tag
          rather than Unwatch tag; creator removal restores Watch tag.
- id: REQ-7
  name: Inspect contributions and achievements
  type: FOLDER
  dependencies: []
  description: |-
    Owner activity views, reputation and private votes, badge categories and seeded earned notification. Privilege thresholds and new badge qualification triggers are unspecified and not invented.
    ![image](./reference/user-feed.jpeg)

    Profile navigation and Activity navigation are distinct named navigation scopes. Reputation, Question count and Earn count <badge> are numeric status outputs. Badge notification is a named status containing its message.
  children:
  - id: REQ-7.1
    name: Read reputation history
    type: ATOMIC
    dependencies:
    - REQ-2.3
    description: |-
      The activity_user selects "Reputation"(role=button) in Profile navigation to display "Reputation history"(role=region). Entries appear newest first, show answer upvoted and question upvoted reasons with signed +10 and +5 changes, and link to their public parent posts.
    data:
      requires:
      - DATA-ACTIVITY
    scenarios:
    - name: Inspect reputation contributions
      steps:
      - keyword: GIVEN
        content: Authenticate activity_user, whose seeded history contains newer answer upvoted +10 for How does React
          state update? and older question upvoted +5 for SO Activity Owned Question.
      - keyword: WHEN
        content: Open the own profile and click Reputation in Profile navigation.
      - keyword: THEN
        content: Reputation history shows both reasons, signed changes and actual parent links, with answer upvoted
          before question upvoted in newest-first sequence.
  - id: REQ-7.2
    name: Observe an earned badge notification
    type: ATOMIC
    dependencies:
    - REQ-2.3
    description: |-
      The badge_user already has an earned Teacher badge and an unacknowledged event. Opening the profile displays Teacher in "Badges"(role=region) and its earned message in "badge notification"(role=status). Observing this seeded notification does not establish a new qualification rule or backend event uniqueness.
    data:
      requires:
      - DATA-BADGES
    scenarios:
    - name: Display seeded Teacher achievement
      steps:
      - keyword: GIVEN
        content: Authenticate badge_user, whose initial world already includes earned Teacher and its unacknowledged
          notification event.
      - keyword: WHEN
        content: Open the account's own profile and inspect Badges and badge notification.
      - keyword: THEN
        content: Teacher appears in Badges and the named status mentions Teacher as earned or awarded. This observes
          the seeded achievement rather than inferring a new qualification trigger.
  - id: REQ-7.3
    name: Explore badge catalog
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Clicking "Badges"(role=button) displays "Badge catalog"(role=region), grouped into "Gold"(role=region), "Silver"(role=region), and "Bronze"(role=region). Entries include Great Answer and Teacher with registry descriptions and numeric "Earn count <badge>"(role=status).
    data:
      requires:
      - DATA-BADGES
    scenarios:
    - name: Read categorized badges
      steps:
      - keyword: GIVEN
        content: The anonymous world contains DATA-BADGES with Great Answer, Good Answer and Teacher catalog entries
          and seeded earn counts 2, 3 and 5.
      - keyword: WHEN
        content: Click Badges and inspect Badge catalog and its Gold, Silver and Bronze groups.
      - keyword: THEN
        content: Groups display Great Answer/Recognizes a great answer/2, Good Answer/Recognizes a good answer/3 and
          Teacher/Recognizes a helpful first answer/5 respectively, with each numeric count exposed as Earn count <badge>.
  - id: REQ-7.4
    name: Navigate owned activity
    type: ATOMIC
    dependencies:
    - REQ-2.3
    description: |-
      The activity_user opens its unique "Stack User activity_user@example.com"(role=button) profile action and selects "Activity"(role=button). "Activity navigation"(role=navigation) offers Summary, "Answers"(role=button), "Questions"(role=button), Tags, Articles, Badges, Following, Bounties, "Reputation"(role=button), All actions, "Responses"(role=button), and "Votes"(role=button), marking the selected item current=page. "Activity content"(role=region) updates to the chosen view. Answers offers "Score"(role=button), Activity, "Newest"(role=button), and "Next page"(role=button), plus correct parent titles and accepted status. Questions shows the owner's title with numeric "Score"(role=status), "Answer count"(role=status), and "View count"(role=status) representing Votes 3, Answers 1, and Views 11. Responses links actual parents; Reputation history and the private Votes log show source contributions and actions. No particular route, DOM, or full-reload implementation is required.

      ![image](./reference/user-feed.jpeg)
    data:
      requires:
      - DATA-ACTIVITY
    scenarios:
    - name: Navigate answers and questions activity
      steps:
      - keyword: GIVEN
        content: Authenticate activity_user with its historical React answer Batch state updates safely., accepted state
          and SO Activity Owned Question metadata Score 3, Answer count 1, View count 11.
      - keyword: WHEN
        content: Open the own profile and Activity, inspect all sidebar categories, choose Answers and inspect sorting/pagination
          and answer content, then choose Questions.
      - keyword: THEN
        content: Each chosen sidebar action reports current=page. Answers shows Score, Activity, Newest and Next page
          plus the actual React parent, excerpt and Accepted answer. Questions shows the owned question with numeric
          3, 1 and 11 metadata.
    - name: Read responses and private votes
      steps:
      - keyword: GIVEN
        content: Authenticate activity_user with the seeded response Check the state updater callback., private upvote
          on the retry question and reputation contribution history.
      - keyword: WHEN
        content: Open own Activity and Responses, then choose Votes and Reputation from Activity navigation.
      - keyword: THEN
        content: Responses shows its text and actual React parent link; Votes shows upvote and the retry parent only
          for the owner; Reputation shows answer/question upvote reasons and +10/+5 changes.
    - name: Protect private voting history
      steps:
      - keyword: GIVEN
        content: The browser is anonymous and the public Users catalog includes the unique Stack User activity_user@example.com
          action.
      - keyword: WHEN
        content: Open Users, choose that exact profile, then open Activity and inspect Votes availability and Activity
          content.
      - keyword: THEN
        content: Votes is absent or disabled, the private retry vote entry is not disclosed, and public Profile navigation
          remains available.
  - id: REQ-7.5
    name: Open an answered post from owned activity
    type: ATOMIC
    dependencies:
    - REQ-7.4
    - REQ-3.1
    description: |-
      The owner selects "Answers"(role=button) in activity and opens "How does React state update?"(role=button), the actual parent of the historical answer. That public question displays "Answer by Stack User"(role=region), containing Batch state updates safely. with "Accepted answer"(role=button). Activity entries therefore navigate to real posts rather than disconnected summaries.

      ![image](./reference/user-feed.jpeg)
    data:
      requires:
      - DATA-ACTIVITY
      - DATA-HISTORY
    scenarios:
    - name: Follow an activity answer to its parent
      steps:
      - keyword: GIVEN
        content: Authenticate activity_user with the seeded accepted React answer Batch state updates safely.
      - keyword: WHEN
        content: Open own Activity then Answers and click How does React state update? in Activity content.
      - keyword: THEN
        content: The public heading matches that parent, Answer by Stack User contains the seeded excerpt, and its Accepted
          answer marker is visible.
