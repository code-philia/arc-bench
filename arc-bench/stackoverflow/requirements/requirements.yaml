        A signed-in user clicks the unique "Stack User"(role=button) header profile action to open Activity Summary. The profile displays numeric "Reputation"(role=status), "Badges"(role=region), and "Recent activity"(role=region); "Profile navigation"(role=navigation) offers Activity and Reputation views.

        Public profile is a named region. User catalog profile actions combine display name and email to distinguish identical display names.

        Login and Sign up each expose a named form region and submit button, with errors visible inside the corresponding form. Public profile is a named region. Profile actions in the user catalog combine display name and email to distinguish identical display names; unavailable unauthorized actions may be absent or disabled.
