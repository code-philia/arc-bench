id: ROOT
name: Stack Overflow developer knowledge sharing
description:
  text: |-
    A developer question-and-answer platform for discovering, publishing, answering, commenting on, voting on, and managing questions and profiles. Questions, answers, comments and replies retain their authorship and parent relationships. Public reading does not require an account. Dates are presented in UTC.

    Members register accounts, update profiles, and create questions, answers, comments, replies, votes, accepted answers, tag watches and saved filters through the corresponding application features. Counts, reputation contributions, revisions and activity entries reflect those operations. The community provides its tag catalog, editorial and network links, default avatars, and historical badge records as described below; no editing or award-granting workflow is provided for those records.
scenarios: []
children:
- id: REQ-1
  name: Discover the community
  description:
    text: |-
      Anonymous and authenticated visitors discover populated public questions. Header, left navigation, main feed and right widgets follow the homepage reference. Right widgets expose The Overflow Blog, meta items, Hot Network Questions and personal custom filters and tag watchlists. Question summaries show titles, tags, votes, answers and views.
    image:
    - id: IMG-HOMEPAGE
      reference: reference/homepage.jpeg
      page: home
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open the populated community
    description:
      text: |-
        Opening the application displays a banner with Stack Overflow identity, "Search", "Products", Log in, and Sign up. "Main navigation" provides Home, Questions, Tags, and Users. The question feed displays Ask Question, Newest and Active ordering controls, and summaries containing titles, tags, votes, answers, and views. Linked editorial and network content appears in "The Overflow Blog", "Featured on Meta" and "Hot Network Questions". Desktop appearance follows the reference.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show the anonymous homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          Alice registers and publishes a question about safely retrying an idempotent HTTP request in Node.js with the node.js, http and retry tags. A fresh anonymous browser opens the populated community, including its tag catalog and linked editorial/network content.
        When: |-
          Open the application entry and inspect banner, Search, Products, Log in, Sign up, Main navigation, the question feed and its retry-question summary, then the three linked widgets.
        Then: |-
          Banner shows Stack Overflow and its account/search actions. Navigation exposes Home, Questions, Tags and Users; feed exposes Ask Question, Newest and Active. The retry summary has its exact title, node.js/http/retry tags and votes/answers/views metadata. The Overflow Blog, Featured on Meta and Hot Network Questions are visible with public links. The banner is above the question summaries, navigation is on their left and the linked widgets are on their right at desktop width.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.2
    name: Navigate community modules
    description:
      text: In main navigation, "Questions", "Tags", and "Users" open their respective modules and visibly mark the
        selected section as current. Questions displays the question feed, while the other modules display
        "Tags" and "Users"; "Home" returns to the feed. The user catalog includes registered members and
        distinguishes their public identities without introducing user-management behavior. The question feed
        offers "Next page", disabled when no next page exists, and summaries show numeric scores, answer
        counts and view counts.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-USERS-PAGE
        reference: reference/users-page.jpeg
        page: users
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Open major community sections
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: |-
          Alice and Bob register separate accounts and set their public display names. Another registered member publishes a question. The tag catalog is available and a separate browser is anonymous.
        When: In Main navigation click Questions, Tags, Users and Home in turn, inspecting each selected action and
          corresponding region; inspect Next page in the returned feed, then reopen Users.
        Then: Each selected action reports the current section and opens the question feed, Tags or Users as
          appropriate. Feed offers Next page, and Users visibly includes the registered public identities of
          Alice and Bob.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-USERS-PAGE)
    children: []
  - id: REQ-1.3
    name: Read a public question anonymously
    description:
      text: An anonymous visitor can open a published question through the public feed or search and read its title,
        rendered body, tags, and existing answers in the question. Reading public knowledge requires no
        session; the header continues to offer "Log in" and "Sign up". This public access is independent of
        the authenticated comment controls in REQ-3.2.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Read without an account
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          Alice registers and publishes a question about safely retrying an idempotent HTTP request in Node.js with its body and node.js/http/retry tags. Bob registers and posts an answer under that question. A separate visitor has no account session.
        When: Open Questions, enter the published question’s exact title in banner Search, press Enter and choose that
          same title from Search results.
        Then: The public heading, question content body and node.js/http/retry tags are readable without a login form;
          existing Answers remains readable and the banner still offers Log in and Sign up.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
- id: REQ-2
  name: Account and public identity
  description:
    text: |-
      Users register and log in with email and password, manage their public profile, and access their own activity. Log in and Sign up open the corresponding account forms; Sign in submits login credentials and Create account submits registration. Errors appear in the relevant form. Profiles and contributions retain the identity of the account that created them, including after a display-name change. Profile entries distinguish people with the same display name through their public profile identity or contributions; displaying their email addresses is not required. Unauthorized actions are unavailable. Social login and SSO are outside this account workflow.

      For example, Alice registers with alice@example.com and Password123!, then sets her public display name through Edit profile. Bob registers a separate account. Alice and Bob can publish, answer, comment, vote and manage their own content as described below; ownership follows their distinct accounts. Registration alone does not grant historical activity, earned badges or additional privileges. The initial badge award and its associated member are described below.

      An existing member, badge_user@example.com with Password123! and display name Stack User, has an earned Teacher badge and its unread award notification as described in REQ-7.2. This account and its earned badge and unread notification are available when the community opens because there is no award-granting workflow. Other authors, voters and activity owners register their own accounts; registration does not copy that award history. Questions read in REQ-3.2 are published through Ask Question rather than supplied as historical questions.
    image:
    - id: IMG-LOGIN
      reference: reference/login.jpeg
      page: login
  scenarios: []
  children:
  - id: REQ-2.1
    name: Sign in with email and password
    description:
      text: |-
        Clicking "Log in" opens "Log in" containing "Email", "Password", a "Show password" toggle, Forgot password? and Sign up entry points. "Show password" reveals the current password without changing its value and becomes "Hide password", which restores masking. "Forgot password?" remains available as the recovery entry. Choosing "Sign in" submits the credentials. Submitting valid credentials returns home with the signed-in account’s current public identity as the profile action and a session that survives reload. Empty credentials show Email cannot be empty and Password cannot be empty; malformed email shows The email is not a valid email address; an absent account shows No account found with this email; an incorrect password shows The email or password does not match any account. Rejections retain the form and anonymous state.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-LOGIN
        reference: reference/login.jpeg
        page: login
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Sign in and retain session
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          Alice registers with alice@example.com and Password123!, sets her display name to Alice through Edit profile, and then opens a fresh anonymous browser.
        When: Open Log in from the banner, enter the account Email and Password, submit Sign in, and reload the
          returned homepage.
        Then: The question feed appears; after reload the banner still exposes Alice and no Log in action,
          demonstrating a retained session.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-02
      name: Reject empty credentials
      steps:
      - id: STEP-REQ-2.1-02-01
        Given: The anonymous login form is open with Email and Password both empty.
        When: Click Sign in inside that form without entering credentials.
        Then: Email cannot be empty and Password cannot be empty are visible within the retained form; the banner
          remains anonymous and no account profile action appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-03
      name: Reject malformed email
      steps:
      - id: STEP-REQ-2.1-03-01
        Given: The anonymous login form is open.
        When: Enter invalid-email-format in Email and Password123! in Password, then submit Sign in.
        Then: |-
          The email is not a valid email address appears in the retained form; the browser remains anonymous and no signed-in profile action appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-04
      name: Reject unknown account
      steps:
      - id: STEP-REQ-2.1-04-01
        Given: |-
          An anonymous visitor opens Log in with an unused email address that has never been registered.
        When: |-
          Enter that unused email and Password123!, then submit Sign in.
        Then: |-
          No account found with this email appears in the retained form; the browser remains anonymous and no signed-in profile action appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-05
      name: Reject wrong password
      steps:
      - id: STEP-REQ-2.1-05-01
        Given: |-
          Alice registers an account with a valid password and then opens Log in in an anonymous browser.
        When: Enter Alice’s registered email and a different, incorrect password, then submit Sign in.
        Then: The email or password does not match any account appears in the retained form; the account profile
          action is absent.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-06
      name: Toggle password visibility
      steps:
      - id: STEP-REQ-2.1-06-01
        Given: The anonymous Log in form is open with its Forgot password? and Sign up entries available; Password
          starts masked.
        When: Enter Password123!, click Show password, inspect the field, then click Hide password and inspect again.
        Then: Password becomes readable and then masked again without changing Password123!; recovery and signup
          entries remain available throughout the form.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-2.2
    name: Create an account
    description:
      text: |-
        Clicking "Sign up" opens "Sign up" with Join Stack Overflow heading, "Email", "Password", password help, consent text, a "Create account" submit action, and a Log in entry. Submitting a unique valid email and password creates the account and signs it in automatically, exposing "<registered email>" as the profile action when no display name was entered. An existing email shows Email is already in use; a short password shows visible requirements including a minimum of eight characters. Rejections retain the form without an authenticated session.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-SIGN-UP
        reference: reference/sign-up.jpeg
        page: signup
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Register and automatically sign in
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: An anonymous visitor chooses an unused valid email address and Password123!, which meets the password
          rule.
        When: |-
          Open Sign up from the banner, inspect Join Stack Overflow and terms/privacy text, fill Email with the email and Password with Password123!, then submit Create account. Open the new account’s profile and Questions activity.
        Then: |-
          The banner exposes that exact registered email as the profile action and the question feed appears, confirming account creation and automatic authentication. The profile has no earned catalog badges and its Questions activity contains no posts from other accounts.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-02
      name: Reject duplicate email
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: |-
          Alice registers an account. A separate anonymous browser opens Sign up using the email Alice has registered.
        When: Enter that same registered email and a valid password, then submit Create account.
        Then: |-
          Email is already in use appears within the retained form; the browser remains anonymous and no signed-in profile action appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    - id: SCN-REQ-2.2-03
      name: Reject weak password
      steps:
      - id: STEP-REQ-2.2-03-01
        Given: An anonymous visitor chooses an unused valid email address.
        When: Enter the unused email and short as Password, then submit Create account.
        Then: The form visibly explains the minimum eight-character requirement and stays open; the proposed email
          profile action is absent and registration does not authenticate.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SIGN-UP)
    children: []
  - id: REQ-2.3
    name: Open profile summary
    description:
      text: |-
        A signed-in user opens their own profile through the header action showing their current public identity. Activity Summary displays numeric Reputation and the Badges and Recent activity sections; Profile navigation offers Activity and Reputation views. For example, Bob registers, sets his display name and opens his profile.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-PROFILE-PAGE
        reference: reference/profile-page.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-2.3-01
      name: View personal summary
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          Bob registers an account, sets his display name through Edit profile, and signs in through Log in.
        When: Click Bob to open the personal profile and inspect its summary and navigation.
        Then: Profile navigation offers Activity, Activity navigation marks Summary the current section, numeric
          Reputation is visible, and Badges and Recent activity are visible sections.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-PROFILE-PAGE)
    children: []
  - id: REQ-2.4
    name: Update public identity
    description:
      text: |-
        A registered profile owner clicks "Edit profile" to open Edit your profile with "Display name", "Full name", "Location", "Title", "About me", "Website", "X", and "GitHub" prefilled from the current profile. "Save and copy changes to all public communities" saves the supplied values, updates the display name, location, title, and about text in "Public profile", and shows a success status. Examples www.example.dev and github.com/example are accepted; an added https:// prefix is allowed. Reopening confirms every submitted field, including full name and URLs. An available preview reflects pending changes.
      image:
      - id: IMG-EDIT-PROFILE
        reference: reference/edit-profile.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Save and reopen public identity
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: |-
          Alice registers an account and uses Edit profile to save her current details: display name Alice, full name Existing User, location Beijing, title Developer, about Existing biography, website https://example.org, X https://x.com/example and GitHub https://github.com/existing. She returns to her profile.
        When: Click Edit profile and verify all eight prefilled fields. Set Display name to Alice Updated, Full name
          to Stack Overflow User, Location to Shanghai, Title to Backend Engineer, About me to I enjoy
          building APIs and developer tooling for teams., Website to www.example.dev and GitHub to
          github.com/example; leave X unchanged. Save and copy changes to all public communities, then reopen
          Edit profile.
        Then: A successful update status appears and Public profile displays the new display name, location, title and
          biography. Reopened fields retain every submitted value, allowing https:// normalization on Website
          and GitHub, while X remains unchanged.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-EDIT-PROFILE)
    children: []
  - id: REQ-2.5
    name: Switch between account entry forms
    description:
      text: |-
        The anonymous user can move from "Log in" to "Sign up" through its Sign up entry and return through Log in. Each visible form provides correctly labeled "Email" and "Password", with "Create account" or "Sign in" as its matching submit action. Switching forms preserves anonymous status and adds no social login behavior.
      image:
      - id: IMG-LOGIN
        reference: reference/login.jpeg
        page: login
      - id: IMG-SIGN-UP
        reference: reference/sign-up.jpeg
        page: signup
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Move between login and registration
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: The browser is anonymous on the application entry.
        When: Open Log in from the banner, choose Sign up within the login form, inspect that form, then choose Log in
          within Sign up.
        Then: Each transition displays only the chosen account-entry region with Email, Password and its matching
          submit action. The other form is absent, and no account profile action appears.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-SIGN-UP)
    children: []
  - id: REQ-2.6
    name: Authenticate a newly registered account
    description:
      text: |-
        A member who creates an account using Email, Password and Create account can sign in with the same credentials through Log in in a separate anonymous browser. Sign in opens the question feed and displays the registered email as the profile action when no display name has been set. Email verification is not required.
      image:
      - id: IMG-SIGN-UP
        reference: reference/sign-up.jpeg
        page: signup
      - id: IMG-LOGIN
        reference: reference/login.jpeg
        page: login
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Log in with UI-created credentials
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: |-
          A new member registers through Sign up using an unused email address and Password123!. Registration signs the member in. The member then opens the same application in a separate anonymous browser, where no account profile action is present.
        When: In the separate anonymous browser session open Log in, enter the created Email and Password123!, and submit Sign in.
        Then: |-
          Credential submission displays that exact registered email as the profile action and opens the question feed; the account is usable independently of the original registration session.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-SIGN-UP)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-HOMEPAGE)
    children: []
- id: REQ-3
  name: Publish and maintain questions
  description:
    text: >-
      Visitors browse and read questions with titles, rendered bodies, tags, engagement metadata and author
      attribution. Signed-in users publish questions and maintain their own eligible posts through Edit
      question and Delete question. Editing preserves the same question and its relationships; saving retains
      all submitted values, while cancelling preserves the original. Deleting a question removes it from
      public discovery. Active votes are visibly distinguishable from inactive votes.


      An example question is "How can I safely retry an idempotent HTTP request in Node.js?", with node.js,
      http and retry tags and the body: I am building a Node.js service and need a safe retry pattern for
      idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on
      exponential backoff, duplicate suppression, timeout handling, and observability across intermittent
      failures in production. What patterns should I use and how should I structure retries so the client
      remains correct, debuggable, and safe for repeated delivery attempts?
  scenarios: []
  children:
  - id: REQ-3.1
    name: Open public Questions listing
    description:
      text: |-
        Following Questions in main navigation opens the question feed with Ask Question and published question summaries.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Open public Questions listing
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          A registered member has published a public question through Ask Question. A separate visitor opens the populated homepage.
        When: Follow Questions in Main navigation.
        Then: The question feed exposes Ask Question and published question summaries.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.2
    name: Read question detail
    description:
      text: |-
        Selecting a published question from the feed or Search results opens its title, rendered body, tags and author information. The detail offers Ask Question, Score, Up vote, Down vote, Save, Timeline, Share and Follow. Asked and Modified identify its creation and latest saved modification times in UTC; View count reflects actual visits and does not decrease on reload. The feed and detail agree on tags, score and answer count. Author information shows the actual author’s public identity, default avatar, reputation, earned badges and post time. An authenticated reader sees Comments and Add a comment. Edit question and Delete question are available only to the author when the question is eligible; a different ordinary member cannot use them.

        For example, Stack User publishes the retry question from REQ-3 and later saves a revision. Seven different members upvote it, and readers visit it at least 42 times. Its score is 7, its UTC dates reflect those two operations rather than unrelated historical dates, and its author retains the Teacher badge already in that member’s history.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Read a published question
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: |-
          Stack User signs in to the existing badge account, publishes a retry question through Ask Question and later saves a revision using the example body in REQ-3 and node.js, http and retry tags. Seven separately registered members upvote it. Readers visit it at least 42 times. A different newly registered member signs in.
        When: |-
          Find the published title through public Search and open its detail. Inspect the title, rendered body, tags, Score, Asked, Modified, View count, author information and Comments. Compare its summary in Questions with the detail, then reload the detail.
        Then: |-
          The title, saved body and tags match the published question. Score is 7; Asked and Modified match the actual UTC publication and revision dates. View count is at least 42 and does not decrease after reload. The author is Stack User with an avatar, the reputation resulting from the seven upvotes, the existing Teacher badge and publication time. The reader can see Add a comment and the public post actions but cannot use Edit question or Delete question. Feed tags, score and answer count match the same detail.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-3.4)
        - \ref[requirement](REQ-3.6)
        - \ref[requirement](REQ-7.2)
    children: []
  - id: REQ-3.3
    name: Publish a question
    description:
      text: |-
        A signed-in user clicks "Ask Question", enters "Title" with at least 15 characters and "Body" with at least 220 characters, and selects at least one tag through "Tags". Markdown renders live in "Preview", while "Title character count" shows the title length. Entering node.js displays "Suggestions" including node.js, http, and retry; the tag input accepts comma-separated selected names. "Post Your Question" publishes the entered title, body, and tags, opens their detail, and adds the title to the owner's Questions activity. Missing or insufficient inputs show Title is required (minimum 15 characters), Question body is required (minimum 220 characters), or Please add at least one tag as applicable, retaining the editor without publishing.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-ASK-QUESTION-PAGE
        reference: reference/ask-question-page.jpeg
        page: question_editor
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-3.3-01
      name: Publish with preview and tags
      steps:
      - id: STEP-REQ-3.3-01-01
        Given: |-
          A registered author is signed in and has not published the proposed question. The title is "How can I safely retry an idempotent HTTP request in Node.js without duplicating side effects?" and the body uses the retry-question example in REQ-3.
        When: |-
          Click Ask Question in the question feed, fill Title with that title and Body with Markdown Retry safety followed by the example body in REQ-3; inspect Title character count and Preview. Enter node.js in Tags to inspect suggestions, then enter node.js,http,retry and Post Your Question. Open the owner's Questions activity.
        Then: Character count equals the title length, Preview renders Retry safety and body, and Suggestions offers
          node.js/http/retry. Publication opens the exact title with rendered body and all three tags; the
          owner's Questions activity exposes that exact title.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-3.3-02
      name: Reject missing required fields
      steps:
      - id: STEP-REQ-3.3-02-01
        Given: |-
          A registered author is signed in with an empty Ask Question editor and has not published the draft. A different, valid question has already been published and is available as a public-search comparison.
        When: |-
          Click Post Your Question with all fields empty; enter a valid title and submit again with Body empty; enter the valid example body in REQ-3 and submit again with Tags empty.
        Then: |-
          Each stage shows the corresponding exact Title is required (minimum 15 characters), Question body is required (minimum 220 characters), or Please add at least one tag message. The editor remains available and no draft content is published. The existing valid question remains discoverable, while searching the attempted nonempty title finds no published question. A search with no matches makes that outcome apparent.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-3.3-03
      name: Validate title and body minimum lengths
      steps:
      - id: STEP-REQ-3.3-03-01
        Given: |-
          A registered author opens Ask Question. The retry-question example body in REQ-3 and the http tag are available.
        When: |-
          Enter a 14-character title with valid Body and Tags and submit; replace it with a valid title, set Body to 219 characters and submit again. Then enter a new 15-character title, exactly 220 body characters and the http tag, and submit.
        Then: |-
          The first two submissions show the corresponding minimum-length error, retain the editor and publish neither invalid question. The boundary-length submission succeeds and displays its exact title and 220-character body. Searching the two rejected titles finds no separately published invalid question.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-ASK-QUESTION-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-3.4
    name: Revise a question
    description:
      text: |-
        The owner clicks "Edit question" within question content to open "Title", "Body", and "Tags" prefilled from that question. The editor provides "Bold", "Italic", and "Code", live "Preview", "How to Edit" guidance, and "Rev" for selecting prior revisions. Users record their reason in "Edit Summary"; "Save edits" updates the question, shows edited metadata, and adds a revision with the reason available through "Timeline" in "Revision history". "Cancel" returns to the original view without applying a draft. Selecting a revision in Rev loads that revision into the editor for inspection; Cancel still leaves the latest saved question unchanged. Bold, Italic and Code apply Markdown to the selected body text and Preview renders that formatting.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-EDIT-QUESTION
        reference: reference/edit-question.jpeg
        page: question_editor
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.4-01
      name: Save revision and summary
      steps:
      - id: STEP-REQ-3.4-01-01
        Given: |-
          A registered author has published a retry question with the example body in REQ-3 and node.js, http and retry tags, and opens its Edit question action.
        When: |-
          Verify the prefilled title, body and tags, exercise Bold, Italic and Code and inspect Preview. Change the draft title, body and tags, then Cancel and reload to read the unchanged question. Reopen Edit question, append clarified to Title and Include bounded retry budgets. to Body, set Tags to http,retry and Edit Summary to Fixed a typo in the second paragraph, then Save edits and open Timeline. Reopen the editor, select the original revision in Rev, then Cancel. The cancelled draft also contains an unsaved Edit Summary.
        Then: |-
          The detail shows the replacement heading and body, edited metadata and only http/retry tags. Revision history contains the summary and both original and replacement body values. Searching the former title does not return a separate original copy. Cancelling either an unsaved edit or a revision inspection preserves the latest saved question after reload. The editor retains the saved fields on reopening; Rev can load the original body while reopening the editor shows the latest saved body, and the formatting controls produce rendered bold, italic and code text. Revision history does not record the discarded draft summary.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-EDIT-QUESTION)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.5
    name: Delete an eligible own question
    description:
      text: |-
        An author can delete their own unanswered question with score 0 through Delete question. Confirm deletion explains the consequences and removes that selected question from public discovery, returning to the populated question feed. Other published questions remain readable.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.5-01
      name: Confirm own question deletion
      steps:
      - id: STEP-REQ-3.5-01-01
        Given: |-
          A registered author has published a question with no answers and score 0. The same author has also published a separate retry question, which remains available to other readers. The author opens the question to delete.
        When: |-
          Choose Delete question on the target question and confirm. Search for its exact title, open the separately published retry question through discovery, and revisit Questions.
        Then: |-
          The question feed returns. The deleted question is absent from the public feed and exact-title search results, while the separately published retry question remains readable.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.6
    name: Toggle question upvote
    description:
      text: |-
        A signed-in user upvotes another author’s question. Its score increases by one, the vote becomes active, and its author gains 10 reputation. Reload retains the changes. Activating the same vote again restores the prior score and reputation and makes the vote inactive. For example, score 7 becomes 8 and returns to 7 when the upvote is removed.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.6-01
      name: Apply and remove question upvote
      steps:
      - id: STEP-REQ-3.6-01-01
        Given: |-
          Alice publishes a question. A different signed-in user opens it with no active vote and records its score and author reputation.
        When: Click Up vote, reload the detail, then click Up vote again.
        Then: Upvoting and reloading retain a score one higher than before, an active vote and author reputation 10 points higher than before.
          Activating again restores the recorded score, inactive vote and reputation.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.7
    name: Downvote a question
    description:
      text: |-
        A signed-in user downvotes another author’s question. Its score decreases by one, the vote becomes active, and its author loses 2 reputation. For example, score 3 becomes 2.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.7-01
      name: Apply question downvote
      steps:
      - id: STEP-REQ-3.7-01-01
        Given: |-
          Alice publishes a question. A different signed-in user opens it and records its score and author reputation.
        When: |-
          Click Down vote within question content. Reload the question.
        Then: |-
          Downvoting decreases the score by one, activates the vote and reduces author reputation by 2. Reload retains the changed score, active vote and author reputation.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-2.1)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.8
    name: Open an owned question from activity
    description:
      text: |-
        After publishing a question, the author opens "Questions" in activity. "Activity content" contains "<created question title>"; selecting it opens that exact question with its saved body and tags rather than another feed item.
      image:
      - id: IMG-USER-FEED
        reference: reference/user-feed.jpeg
        page: profile
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.8-01
      name: Follow an owned question to its detail
      steps:
      - id: STEP-REQ-3.8-01-01
        Given: |-
          A registered author signs in and publishes a retry question through Ask Question using the example body in REQ-3 and node.js, http and retry tags.
        When: Open the owner's profile Activity then Questions and click the exact newly created title in Activity
          content.
        Then: |-
          The same title heading, example body in REQ-3 and all three tags appear in question content, preserving the selected question's identity.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-USER-FEED)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.9
    name: Retain a saved question revision
    description:
      text: |-
        The owner saves a revision through "Title", "Body", "Tags", and "Edit Summary", then "Save edits". The public question reflects the saved title, body, and tags, and "Timeline" exposes the retained summary in "Revision history". Reopening through public discovery under another account shows saved values rather than an editor-only draft.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-EDIT-QUESTION
        reference: reference/edit-question.jpeg
        page: question_editor
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.9-01
      name: Read saved revision as another user
      steps:
      - id: STEP-REQ-3.9-01-01
        Given: |-
          A registered author has published a retry question using the example body in REQ-3 and node.js, http and retry tags, then opens Edit question. A different registered member can read the public question.
        When: Append clarified to Title and Use a bounded retry budget. to Body, set Tags to http,retry and Edit
          Summary to Documented bounded retry budget.; Save edits. Authenticate another member in an
          independent browser session, search the replacement title, reload the detail and open Timeline.
        Then: The owner sees the new heading. The independent visitor reads replacement body and only http/retry tags;
          Revision history retains the submitted summary rather than an editor-local draft. Searching the
          former title does not return a separate original copy.
        references:
        - \ref[requirement](REQ-3.1)
        - \ref[requirement](REQ-3.4)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-EDIT-QUESTION)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-3.10
    name: Protect question deletion by ownership
    description:
      text: |-
        An ordinary authenticated non-owner has no usable "Delete question" on another author's eligible question; the action is absent or disabled. The question remains publicly readable. The author's deletion privilege does not transfer to other users.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-3.10-01
      name: Prevent non-owner question deletion
      steps:
      - id: STEP-REQ-3.10-01-01
        Given: |-
          One registered member has published an unanswered question with score 0. A different ordinary member signs in and opens that question through public Search.
        When: Inspect the question content's Delete question availability without invoking any private operation.
        Then: |-
          Delete question is absent or disabled, no Confirm deletion dialog opens, and the exact heading and original example body in REQ-3 remain readable.
        references:
        - \ref[requirement](REQ-3.5)
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-QUESTION-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
- id: REQ-4
  name: Answer and evaluate solutions
  description:
    text: |-
      Authenticated users publish answers, vote, and maintain their own eligible answers through Edit answer and Delete answer. Each answer belongs to its question and retains author attribution. Only the question owner can accept an answer; at most one answer per question is accepted, shown with a green check and Accepted answer. Saving an edit retains its body and summary; cancelling preserves the original answer. Active votes are visibly distinguishable from inactive votes.

      For example, an answer can say: Use exponential backoff together with an idempotency key so duplicate requests can be safely retried without creating duplicate side effects in downstream services.
    image:
    - id: IMG-POST-ANSWER
      reference: reference/post-answer.jpeg
      page: question
  scenarios: []
  children:
  - id: REQ-4.1
    name: Publish an answer
    description:
      text: |-
        A signed-in member opens a question, enters an answer in Your Answer and selects Post Your Answer. The answer appears under that question’s Answers with the submitting member as author, and Answer count increases by one. The author’s Answers activity links to the same parent and shows the saved excerpt. Reload retains the answer and count.
      image:
      - id: IMG-POST-ANSWER
        reference: reference/post-answer.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Publish and discover own answer
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          One registered member has published a question with no answers. A different registered member signs in and opens that question to answer it.
        When: Fill Your Answer with example answer body and click Post Your Answer; reload and open the author's
          Answers activity.
        Then: |-
          The submitted answer appears under the correct question with its actual author and body, and Answer count becomes 1. Reload retains the same answer and count. The answer author’s activity exposes the correct parent title and excerpt.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-7.4)
        - \ref[image](IMG-POST-ANSWER)
    children: []
  - id: REQ-4.2
    name: Toggle answer upvote
    description:
      text: |-
        A signed-in member can upvote another member’s answer through Up vote. The score increases by one, the vote becomes active and the answer author gains 10 reputation. Activating the same vote again restores the prior score, inactive state and prior reputation without changing the parent question’s score.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.2-01
      name: Apply and remove answer upvote
      steps:
      - id: STEP-REQ-4.2-01-01
        Given: |-
          A registered question author publishes a question, and a second member posts an answer through Post Your Answer. A third member signs in without an active vote, opens the question and records the question score and answer author reputation. The answer starts at score 0.
        When: Click Up vote inside Alice’s answer, then click the same action again.
        Then: First activation makes answer Score 1, an active vote and author reputation 10 points higher than before; second restores
          Score 0, an inactive vote and the recorded author reputation. The parent question's recorded Score is unchanged at both
          stages.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.3
    name: Accept a single answer
    description:
      text: |-
        The question owner clicks "Accept answer" in a selected answer to mark it with a green check and "Accepted answer", persisting after reload. With two answers, accepting the other transfers the marker and leaves exactly one accepted answer. Non-owners have no usable Accept answer action.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.3-01
      name: Accept and replace definitive solution
      steps:
      - id: STEP-REQ-4.3-01-01
        Given: |-
          A registered question owner publishes a question. Alice and Bob register separate accounts and each post an answer; Bob writes "Use a bounded retry budget with diagnostics." The question owner signs in.
        When: |-
          Click Accept answer in Alice's answer, reload, then click Accept answer in Bob’s answer. Reload again after transferring acceptance.
        Then: 'Alice''s Accepted answer remains after reload. Accepting Bob transfers the marker: Answers contains
          exactly one Accepted answer, on Bob, with none remaining on Alice.'
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-4.3-02
      name: Prevent non-owner acceptance
      steps:
      - id: STEP-REQ-4.3-02-01
        Given: |-
          A registered question owner publishes a question and Alice posts an answer. A different ordinary member who does not own the question signs in.
        When: Open the question and inspect Accept answer in Alice's visible answer.
        Then: Accept answer is absent or disabled and Answers has no Accepted answer marker.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.4
    name: Order answers by score
    description:
      text: |-
        Answers can be sorted by Highest score, Trending or Date modified, alongside their numeric answer count. Date modified initially places the more recently modified answer first; choosing Highest score places the higher-scored answer first. For example, a newer answer with score 2 appears before an older answer with score 9 under Date modified, and their order reverses under Highest score.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.4-01
      name: Select highest-score ordering
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: |-
          A question has two newly published answers: "Highest score answer: use bounded retries." by Alice receives an upvote, then Bob publishes "Recent answer: log each retry attempt." The older answer has score 1 and the newer score 0. An anonymous visitor opens their question.
        When: Inspect Sorted by options, then select Highest score.
        Then: Options are exactly Highest score, Trending and Date modified. Answer count is 2 and the Answers text
          places Highest score answer before Recent answer after selection.
        references:
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.5
    name: Revise an own answer
    description:
      text: |-
        An answer owner clicks "Edit answer" to open prefilled "Body" and "Edit Summary". "Save edits" updates visible content, adds a revision available through "Timeline" in "Revision history", and shows edited metadata even if the submitted body is unchanged. An empty body shows Body cannot be empty and retains the editor and original answer. "Cancel" discards pending changes.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.5-01
      name: Record same-body answer revision
      steps:
      - id: STEP-REQ-4.5-01-01
        Given: |-
          A registered member has posted the example answer in REQ-4 under another member’s question, and opens Edit answer on their own answer.
        When: Verify Body is prefilled with the standard example answer, keep that same Body, enter Clarified retry
          safety. in Edit Summary, click Save edits and open the answer's Timeline.
        Then: The unchanged body remains visible with edited metadata, and Revision history includes Clarified retry
          safety., demonstrating a saved same-body revision. Reload preserves this result.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-4.5-02
      name: Reject empty answer edit
      steps:
      - id: STEP-REQ-4.5-02-01
        Given: |-
          A registered member has posted the example answer in REQ-4 under another member’s question, and opens Edit answer on their own answer.
        When: Clear Body, click Save edits, then Cancel after inspecting the rejection.
        Then: Body cannot be empty appears and the editor remains available. Cancel restores the original visible
          answer body, showing the invalid draft did not replace it. Reload preserves this result.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-QUESTION-PAGE)
    - id: SCN-REQ-4.5-03
      name: Cancel answer edit
      steps:
      - id: STEP-REQ-4.5-03-01
        Given: |-
          A registered member has posted the example answer in REQ-4 under another member’s question, and opens Edit answer on their own answer.
        When: |-
          Replace Body with Unsaved answer edit draft., enter Unsaved answer summary. in Edit Summary and choose Cancel. Reload and open the answer’s Timeline.
        Then: |-
          The editor is absent, the original answer body remains, and the answer does not contain the unsaved replacement. Reload preserves this result. Revision history contains no unsaved summary.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.6
    name: Delete an unaccepted own answer
    description:
      text: |-
        An author can delete their own unaccepted answer through Delete answer. Confirm deletion explains the consequences before removing the selected answer from public reading. Answer count decreases by one and reputation earned from votes on that answer is reversed. For example, an upvote gives the author 10 reputation; deleting that unaccepted answer reverses those 10 points.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.6-01
      name: Delete answer and reverse vote reputation
      steps:
      - id: STEP-REQ-4.6-01-01
        Given: |-
          A registered member posts the unaccepted answer "Use an idempotency key to prevent duplicate side effects when retrying a request." under another member’s question. A different member records the author reputation, upvotes the answer and observes the 10-point increase.
        When: |-
          Authenticate the answer author, open the answer, click Delete answer and confirm in Confirm deletion; inspect answer count and the author's profile. Reopen the question as a different member in a separate browser.
        Then: The answer body is absent publicly, Answer count is 0 and the author's Reputation returns to its
          recorded baseline. The independent visitor also sees no answer and count 0.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.7
    name: Order answers by modification date
    description:
      text: |-
        Selecting Date modified in "Sorted by" orders "Answers" by newest modification first. Each answer is ordered by its own modification time. For example, a more recently modified answer appears before an older, higher-scored answer. Switching from Highest score visibly reverses their sequence without changing "Answer count" or their parent question.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.7-01
      name: Switch to latest-modified answers
      steps:
      - id: STEP-REQ-4.7-01-01
        Given: |-
          A question has two newly published answers: "Highest score answer: use bounded retries." by Alice receives an upvote, then Bob publishes "Recent answer: log each retry attempt." The older answer has score 1 and the newer score 0. An anonymous visitor opens their question.
        When: Select Highest score in Sorted by and verify its sequence; then choose Date modified.
        Then: Ordering changes from highest-score-first to Recent answer before Highest score answer. Answer count
          remains 2 and the parent question heading is unchanged.
        references:
        - \ref[requirement](REQ-4.4)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.8
    name: Save changed answer content
    description:
      text: |-
        The answer author clicks "Edit answer", replaces the nonempty "Body", records "Edit Summary", and clicks "Save edits". The public answer displays the replacement and edited metadata; "Timeline" reveals its saved summary in "Revision history". A separate visitor sees the replacement after reload. Saving an unchanged body still records the edit summary as specified in REQ-4.5.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.8-01
      name: Publish an actual answer correction
      steps:
      - id: STEP-REQ-4.8-01-01
        Given: |-
          A registered member has posted the example answer in REQ-4 under another member’s question, and opens Edit answer on their own answer. Another registered member can read the question.
        When: |-
          Replace Body with Use bounded exponential backoff, an idempotency key, and a deadline so retries remain safe and observable.; enter Added deadline guidance. in Edit Summary and Save edits. Open and reload the question as a different member in a separate browser, then open that answer's Timeline.
        Then: The public answer contains the replacement rather than the original body, shows edited metadata, and
          Revision history retains Added deadline guidance., including in the independent visitor context.
        references:
        - \ref[requirement](REQ-4.5)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.9
    name: Protect another author answer from deletion
    description:
      text: |-
        An ordinary member who does not own an answer cannot use Delete answer on it. The selected unaccepted answer remains readable under its original author and Answer count is unchanged.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.9-01
      name: Prevent non-owner answer deletion
      steps:
      - id: STEP-REQ-4.9-01-01
        Given: |-
          One registered member has posted the example answer in REQ-4 as an unaccepted answer under another member’s question. A third ordinary member signs in and opens that question.
        When: |-
          Open the question and inspect Delete answer within the selected answer.
        Then: Delete answer is absent or disabled, the standard example answer body remains readable, and Answer count
          remains 1.
        references:
        - \ref[requirement](REQ-4.6)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-4.10
    name: Prevent deletion of an accepted own answer
    description:
      text: |-
        Once the question owner clicks "Accept answer", the answer displays "Accepted answer" and its author has no usable "Delete answer". The accepted solution remains public because ordinary own-answer deletion applies only to unaccepted answers.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-4.10-01
      name: Keep the accepted solution protected
      steps:
      - id: STEP-REQ-4.10-01-01
        Given: |-
          A registered question owner publishes a question. A different registered member posts the example answer in REQ-4, and the question owner accepts it through Accept answer.
        When: Authenticate the answer author, open the question and inspect Accepted answer and Delete answer within
          its own answer.
        Then: Accepted answer and the original body remain visible, but Delete answer is absent or disabled even for
          the answer author.
        references:
        - \ref[requirement](REQ-4.3)
        - \ref[requirement](REQ-4.6)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
- id: REQ-5
  name: Discuss posts
  description:
    text: >-
      Question and answer comments show text, author and timestamp in chronological order in their own post
      threads. Authors can use Edit comment within five minutes and Delete comment to remove their comments
      immediately. After five minutes editing is unavailable. Replies belong to their parent comment. Comments
      support upvotes only, with a visible active state.


      An example comment is: Can you share what you tried so far?
  scenarios: []
  children:
  - id: REQ-5.1
    name: Open a question comment thread
    description:
      text: |-
        Visitors can open a public question and read its comment thread, including the Add a comment entry.
      image:
      - id: IMG-ADD-COMMENT
        reference: reference/add-comment.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Open a question comment thread
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: |-
          Alice registers and publishes a question with its comment thread. A separate visitor opens the public community without a session.
        When: Open the question through public navigation and search.
        Then: question content exposes its Comments region and Add a comment.
        references:
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-ADD-COMMENT)
    children: []
  - id: REQ-5.2
    name: Comment on a question
    description:
      text: |-
        A signed-in member selects Add a comment within a question, enters text in Comment and presses Enter. That question’s comment thread displays the submitted text, actual author and timestamp. Reload retains the comment.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Publish a question comment
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: |-
          A registered author publishes a question. A different registered member signs in and opens it to add a comment.
        When: Click Add a comment within question content, enter Can you share what you tried so far? in Comment and
          press Enter; reload.
        Then: |-
          The question’s Comments contains the submitted text with the commenting member’s identity and timestamp, before and after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-3.3)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.3
    name: Expand hidden comments
    description:
      text: |-
        A post initially shows its first five comments in chronological order. When more comments exist, Show <remaining count> more comments reveals the rest in the same order. For example, a post with seven comments first shows five and Show 2 more comments reveals all seven.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.3-01
      name: Reveal the complete comment thread
      steps:
      - id: STEP-REQ-5.3-01-01
        Given: |-
          Alice publishes seven comments, Retry discussion comment 1 through 7, in sequence on a new question. An anonymous visitor opens that question; only the first five comments initially show.
        When: Verify first-five visibility and sixth/seventh hidden state, then click Show 2 more comments in that
          post's Comments.
        Then: Exactly those seven comments become visible, with no extra comments, and their visible sequence remains
          1 through 7 chronologically.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.4
    name: Edit a comment within its window
    description:
      text: |-
        A comment author can choose Edit comment before five minutes have elapsed since publication, edit its prefilled Comment and press Enter to save. The saved text remains under the same author and parent, shows an edited indicator and survives reload. At five minutes and afterwards editing is unavailable; expiry does not undo a previously saved edit. For example, a comment posted at 12:00 can be edited at 12:02; at 12:06 the saved 12:02 text remains readable but cannot be edited again.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.4-01
      name: Save comment within five minutes
      steps:
      - id: STEP-REQ-5.4-01-01
        Given: |-
          A signed-in author has just published a comment on a newly published question.
        When: |-
          Before five minutes have elapsed since publication, choose Edit comment, verify its prefilled text, replace it with Can you share a minimal retry example? and press Enter. Reload and verify the saved edit while the editing window remains open. After the five-minute window has elapsed, reload and inspect the same comment again.
        Then: |-
          The new text and edited indicator remain in the same thread after reload. Editing is available before the five-minute window expires; afterwards Edit comment is absent or disabled. The saved replacement remains readable after expiry and reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-2.1)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.5
    name: Delete an own comment immediately
    description:
      text: |-
        A comment author can choose Delete comment on their own comment to remove it immediately without confirmation. The remaining post and other comments are preserved, and reload retains the deletion.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.5-01
      name: Remove comment without confirmation
      steps:
      - id: STEP-REQ-5.5-01-01
        Given: |-
          A registered member has posted "Can you share what you tried so far?" through Add a comment and Enter on a published question, and is signed in as that comment’s author. A different registered member has also posted Please explain the retry deadline. on that same question.
        When: Open the question and click Delete comment within that exact comment.
        Then: |-
          The comment disappears immediately, no confirmation dialog appears, and the parent heading and body remain readable. Reload retains the comment’s absence and the original question body. The other member’s comment and attribution remain visible after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.6
    name: Toggle comment upvote
    description:
      text: |-
        A signed-in user can upvote another author’s comment. Its helpful-vote count increases by one and the vote becomes active. Activating it again restores the prior count and inactive state. Comments offer no Down vote action. For example, a helpful count of 1 becomes 2 and returns to 1 when the vote is removed.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.6-01
      name: Apply and remove a helpful-comment vote
      steps:
      - id: STEP-REQ-5.6-01-01
        Given: |-
          Alice publishes a comment on a newly published question. A different signed-in user opens it with no active helpful vote.
        When: |-
          Choose Up vote within that comment, reload and inspect the active vote, then choose Up vote again and reload.
        Then: |-
          The first vote increases the helpful count by one and activates the vote; the second restores its prior count and inactive state. Both the added vote and its removal survive reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-2.1)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.7
    name: Comment on an answer
    description:
      text: |-
        A signed-in member chooses Add a comment within the intended answer, enters Comment and presses Enter. Only that answer’s comment thread shows the submitted text, actual author and timestamp; the question’s comment thread does not receive it. Reload retains the answer comment.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.7-01
      name: Publish in the answer thread
      steps:
      - id: STEP-REQ-5.7-01-01
        Given: |-
          A registered member publishes a question and Alice posts an answer. A different registered member signs in and opens the question to comment on Alice’s answer.
        When: Click Add a comment inside the answer, enter Can you share what you tried so far? in its Comment field
          and press Enter; reload.
        Then: |-
          The answer’s Comments shows the submitted text with the commenting member’s identity and timestamp before and after reload. The question’s separate thread does not contain that answer comment.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.8
    name: Reply to an existing comment
    description:
      text: |-
        A signed-in member chooses Reply on a comment, enters text in its Reply field and chooses Add Reply. The new reply shows its actual author and time within that parent’s Replies, with a mention of the parent author and visible nesting. For example, replying to Alice with Thanks, I will add the retry case. displays that text and @Alice within Alice’s comment. Reload preserves the same parent, text and attribution.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.8-01
      name: Attach a nested reply to its parent
      steps:
      - id: STEP-REQ-5.8-01-01
        Given: |-
          A registered member publishes a question and Alice posts "Can you share what you tried so far?" as a comment. A different registered member signs in and opens the question to reply to Alice.
        When: Click Reply within the identified parent comment, enter Thanks, I will add the retry case. in its Reply
          field, click Add Reply and reload.
        Then: |-
          The parent’s Replies shows the submitted text, the replying member’s identity and timestamp, and @Alice. The reply is visibly indented beneath its parent and retains its text, author, time and parent after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-5.2)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.9
    name: Protect comment maintenance by ownership
    description:
      text: |-
        Within the comment, authors can use "Edit comment" during their permitted window and "Delete comment" for their own comments. An ordinary non-owner cannot use either maintenance action on Alice's comment. Reply and helpful voting are separate actions.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.9-01
      name: Refuse another user comment maintenance
      steps:
      - id: STEP-REQ-5.9-01-01
        Given: |-
          Alice registers and posts a comment on a published question less than five minutes ago. A different ordinary registered member signs in and opens the question.
        When: Open the question and inspect Edit comment and Delete comment within the visible comment.
        Then: |-
          Both maintenance actions are absent or disabled. The original text and Alice attribution remain unchanged.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[requirement](REQ-5.4)
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-5.10
    name: Keep separate post comment threads
    description:
      text: |-
        Users add comments through "Add a comment", "Comment", and Enter within the intended post. The question content and Alice’s answer each contain their own comment thread, showing only that parent's comment text and author. When both threads contain comments, they remain distinct and retain their parent-specific contents after reload.
      image:
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-5.10-01
      name: Preserve question and answer thread boundaries
      steps:
      - id: STEP-REQ-5.10-01-01
        Given: |-
          A registered member publishes a question and Alice posts an answer. A second member comments "Can you share what you tried so far?" on the question. A different registered member signs in to comment on Alice’s answer.
        When: Open the question, click Add a comment within the answer, enter Please explain the retry deadline. and
          press Enter, then reload.
        Then: |-
          The question thread retains only its original comment with attribution, while the answer thread contains the distinct answer-comment text with attribution. Neither thread contains the other parent's comment after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[requirement](REQ-5.2)
        - \ref[requirement](REQ-5.7)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
- id: REQ-6
  name: Discover by tags and search
  description:
    text: |-
      Visitors discover public questions through tags and search. Tag entries show descriptions and numeric question counts, ordered by current popularity. Publishing, deleting and retagging questions updates these counts. Watching tags and saving custom filters are personal preferences of the authenticated account. Search accepts complete published question titles, including newly published questions, and returns their matching records. Keyword, tag, author and UTC publication-date criteria can be combined as described in REQ-6.3.
    image:
    - id: IMG-SEARCH-AND-FILTER
      reference: reference/search-and-filter.jpeg
      page: questions
  scenarios: []
  children:
  - id: REQ-6.1
    name: Browse tags and tagged questions
    description:
      text: |-
        Tags displays entries ordered by current popularity, each with its description and numeric Question count. Published questions update the corresponding counts, and descriptions stay attached to the same tag. Selecting python opens Python tag with its description, Related tags and a feed containing only python-tagged questions, with tag identity visible in each summary. Next page provides pagination and is disabled when no further page exists. For example, Alice publishes two Python questions and one node.js question; the corresponding counts increase by two and one, and Bob answers one Python question.
      image:
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Browse popular tags and python questions
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: |-
          The public tag catalog includes python, javascript, node.js, http and retry with their descriptions and current counts. Alice registers and publishes two python-tagged questions and a node.js question. Bob registers and answers one Python question.
        When: |-
          Compare the tag catalog with its values before publication, inspect popularity order and Next page, then select python. Then the author changes the answered question’s tag from python to javascript, saves it, and deletes the unanswered Python question; revisit Tags after each operation. Refresh Tags when reading changes made in another browser.
        Then: |-
          Python count increases by two and node.js by one; other observed tag counts and descriptions remain unchanged. Counts are descending by popularity. Python tag retains its description and Related tags; its feed includes both newly published Python titles, excludes the node.js question, and shows python in every summary. Retagging subtracts one from python and adds one to javascript without changing other tag counts. Deleting the remaining Python question subtracts one more from python; the unchanged tag descriptions remain attached to their tags.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-6.2
    name: Watch and unwatch a tag
    description:
      text: |-
        A signed-in member can watch a tag through Watch tag. It becomes Unwatch tag and the tag appears in that member’s Watched tags. Unwatch tag removes it and restores Watch tag. The preference survives navigation and reload; for example, a member can watch and later unwatch python.
      image:
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Toggle python watch preference
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: |-
          A registered member who does not watch python signs in, opens Tags and chooses python.
        When: Click Watch tag, navigate to Questions and reload, open Questions and reopen python through Watched tags, then click
          Unwatch tag and return to Questions.
        Then: Watch tag changes to Unwatch tag and the personal Watched tags list retains python after reload. Unwatch
          restores Watch tag and removes python from that list.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-6.3
    name: Search public questions
    description:
      text: |-
        Entering words from a published question title in banner Search displays real-time Search suggestions. Pressing Enter opens Search results containing relevant public question links; unrelated questions are excluded. A search with no matches makes the empty outcome apparent and exposes no matching question entries. Selecting a result opens that same saved question. Search also accepts [tag] to restrict tags, user:"public display name" to restrict authors, and created:YYYY-MM-DD to restrict the UTC publication date. These criteria combine with the title words: a result must satisfy every supplied criterion. For example, React-state title words together with [node.js], user:"Alice" and created:2026-07-12 return Alice’s matching Node.js question published on that UTC day, excluding questions with a different tag, author or publication date.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-SEARCH-AND-FILTER
        reference: reference/search-and-filter.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.3-01
      name: Suggest and search react state
      steps:
      - id: STEP-REQ-6.3-01-01
        Given: |-
          Alice registers and publishes a React-state question with node.js, http and retry tags, plus unrelated retry and Python questions. She also publishes a React-state question tagged python. Bob registers and publishes a node.js React-state question. Their publication dates are the UTC dates of those operations. A separate visitor is anonymous.
        When: |-
          Enter distinctive React-state title words in banner Search, inspect suggestions, press Enter and open the target result. Then combine those words with [node.js], user:"Alice" and created:<the target’s UTC publication date> and search again. Finally replace that date with the following day.
        Then: |-
          Suggestions and keyword results expose the exact target title and exclude the unrelated retry and Python questions. Opening the target shows its own heading. The combined search returns the target and excludes questions with the wrong tag or author. Searching the following UTC day excludes all of these questions.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-AND-FILTER)
    children: []
  - id: REQ-6.4
    name: Change question feed order
    description:
      text: |-
        Newest orders questions by asked time; Active orders by modified time. Each control visibly indicates when selected, and all other published questions remain part of the feed. For example, Alice publishes a Python question that Bob answers, then publishes a newer unanswered Python question, and finally edits the older question. Newest puts the newer question first; Active puts the newly modified older question first.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Switch newest and active ordering
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: |-
          Alice and Bob register separate accounts. Alice publishes an older Python question, Bob answers it, and Alice publishes a newer unanswered Python question. Alice then edits and saves the older question. Alice also publishes an unrelated Node.js question.
        When: Choose Newest and inspect the two questions’ relative order and selection state, then choose Active.
        Then: |-
          Newest is selected and the newer unanswered question precedes the older question. Active is selected and the modified older question precedes the newer question. Other published posts may also appear. The unrelated Node.js question remains in the feed under both orderings.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-6.5
    name: Save and reuse a custom filter
    description:
      text: |-
        A signed-in member opens Filter and chooses Unanswered, Sort and Tags in Filter panel. Save custom filter opens a dialog with Filter title; Save filter stores the named criteria and displays matching public questions in the selected order. Selecting its Saved filters entry after navigation or reload restores both results and visible criteria. For example, an Unanswered python filter sorted by Newest includes unanswered python questions, excludes answered and non-Python questions, and puts newer matching questions first.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.5-01
      name: Save and reapply python unanswered criteria
      steps:
      - id: STEP-REQ-6.5-01-01
        Given: |-
          Alice registers and publishes two unanswered Python questions in sequence, another Python question that Bob answers, and a non-Python question. A different registered member opens Questions with a new filter name.
        When: Open Filter, check Unanswered in Filter panel, select Newest in Sort and enter python in Tags. Verify
          selections, click Save custom filter, enter the Filter title in the dialog and Save filter. Return
          Home, reload, select that entry from Saved filters and reopen Filter.
        Then: |-
          The saved filter includes the newly published unanswered Python question and excludes the answered Python and non-Python questions. Every result shows python and Answer count 0. Returning Home, reloading and reopening the saved filter restores the results and the visible Unanswered, python and Newest criteria. Both unanswered Python questions appear, with the newer one before the older one, including after restoring the saved filter.
        references:
        - \ref[requirement](REQ-6.4)
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-6.6
    name: Open a question through its tag
    description:
      text: |-
        Selecting python in Tags opens Python tag with navigable public question titles. For example, Alice registers and publishes a Python question. An anonymous visitor selects that exact title from the python feed and reads the same body and python tag, preserving the identity selected during discovery.
      image:
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-6.6-01
      name: Follow a python question from tag discovery
      steps:
      - id: STEP-REQ-6.6-01-01
        Given: |-
          Alice registers and publishes a question about Python with the example body and python tag. A separate visitor is anonymous.
        When: Open Tags, choose python in its tag entry, then select Alice’s exact question title from the tagged
          question feed.
        Then: |-
          The exact selected heading and example body in REQ-3 open with python in question content; the banner remains anonymous with Log in available.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
  - id: REQ-6.7
    name: Keep saved custom filters personal
    description:
      text: |-
        An authenticated creator clicks "Filter", configures criteria in "Filter panel", chooses "Save custom filter", enters "Filter title", and clicks "Save filter". Only that creator's "Saved filters" exposes the resulting configuration and allows reopening it; another account’s saved-filter list does not expose it.
      image:
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.7-01
      name: Isolate custom filters between accounts
      steps:
      - id: STEP-REQ-6.7-01-01
        Given: |-
          Two members register separate accounts. The first opens Questions and proposes a filter name that neither account has saved.
        When: |-
          Open Filter, check Unanswered, choose Newest, enter python and save the title through Save custom filter and Save filter. Inspect Saved filters as a different member in a separate browser, then reload the creator's view and reopen its saved entry.
        Then: The creator sees its saved action and can reopen it after reload; the independent account's Saved
          filters does not expose that title or configuration.
        references:
        - \ref[requirement](REQ-6.5)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
  - id: REQ-6.8
    name: Keep tag watches personal
    description:
      text: |-
        Clicking "Watch tag" for python changes only the signed-in watcher's preference in "Watched tags" and exposes "Unwatch tag". Another account without a python watch still sees Watch tag and no python entry in its own list. The creator can unwatch to remove the preference.
      image:
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
    scenarios:
    - id: SCN-REQ-6.8-01
      name: Isolate tag watch preferences
      steps:
      - id: STEP-REQ-6.8-01-01
        Given: |-
          Two members register separate accounts and neither watches python. The first opens the Python tag.
        When: |-
          Open python and Watch tag as the creator. As another member in a separate browser session, inspect Questions/Watched tags and reopen python. Reload the creator's application, reopen python and click Unwatch tag.
        Then: |-
          Only the first member sees Unwatch tag and python in Watched tags. The other member still sees Watch tag and no python entry. Unwatching restores Watch tag for the first member.
        references:
        - \ref[requirement](REQ-6.2)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
    children: []
- id: REQ-7
  name: Inspect contributions and achievements
  description:
    text: |-
      Users explore public contributions, reputation history and badges. Activity entries link to the actual public posts, including the same question shown in the public index. Only the owner can view private voting history. Profile and activity navigation provide their respective views. The badge catalog is grouped into Gold, Silver and Bronze and shows descriptions and earned counts; previously earned badges can have an unacknowledged notification. When another member comments on a user’s question or answer, that content’s author receives a Responses entry containing the comment and a link to its parent question. Comments on another person’s post do not become the current user’s responses merely because the two posts share a question.
    image:
    - id: IMG-USER-FEED
      reference: reference/user-feed.jpeg
      page: profile
  scenarios: []
  children:
  - id: REQ-7.1
    name: Read reputation history
    description:
      text: |-
        A member selects Reputation in their own profile to read contributions newest first, with reasons, signed changes and actual public parent links. For example, Alice publishes a question that another member upvotes, then answers Bob’s question and receives an upvote on that answer. Each upvote adds 10 to her reputation. Her history places the newer answer upvoted +10 before question upvoted +10, each linked to its own public parent question.
      image:
      - id: IMG-PROFILE-PAGE
        reference: reference/profile-page.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Inspect reputation contributions
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          Alice, Bob and another member register accounts. Alice publishes a question and answers Bob’s question. Another member first upvotes Alice’s question and then her answer, producing +10 for each contribution reputation contributions.
        When: Open the own profile and click Reputation in Profile navigation.
        Then: |-
          Reputation history shows answer upvoted +10 and question upvoted +10 with links to the two actual parent questions. The later answer contribution precedes the question contribution.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-PROFILE-PAGE)
    children: []
  - id: REQ-7.2
    name: Observe an earned badge notification
    description:
      text: |-
        The badge_user already has an earned Teacher badge and an unacknowledged event. Opening the profile displays Teacher in "Badges" and its earned message in "badge notification". This existing member is badge_user@example.com with Password123! and display name Stack User; ordinary registration does not create this award history.
      image:
      - id: IMG-PROFILE-PAGE
        reference: reference/profile-page.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-7.2-01
      name: Display earned Teacher achievement
      steps:
      - id: STEP-REQ-7.2-01-01
        Given: |-
          Authenticate badge_user, whose account history already includes earned Teacher and its unacknowledged notification event.
        When: Open the account's own profile and inspect Badges and badge notification.
        Then: Teacher appears among the earned badges, and its notification mentions Teacher as earned or awarded.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-PROFILE-PAGE)
    children: []
  - id: REQ-7.3
    name: Explore badge catalog
    description:
      text: |-
        Clicking "Badges" displays "Badge catalog", grouped into "Gold", "Silver", and "Bronze". Entries include Great Answer and Teacher with the stated descriptions and a numeric earned count for each badge. Great Answer (Gold) says "Recognizes a great answer" with earn count 2, Good Answer (Silver) says "Recognizes a good answer" with earn count 3, and Teacher (Bronze) says "Recognizes a helpful first answer" with earn count 5.
      image:
      - id: IMG-PROFILE-PAGE
        reference: reference/profile-page.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-7.3-01
      name: Read categorized badges
      steps:
      - id: STEP-REQ-7.3-01-01
        Given: |-
          The public community contains badge catalog and earned event with Great Answer, Good Answer and Teacher catalog entries and existing earn counts 2, 3 and 5.
        When: Click Badges and inspect Badge catalog and its Gold, Silver and Bronze groups.
        Then: |-
          Gold shows Great Answer with Recognizes a great answer and earned count 2; Silver shows Good Answer with Recognizes a good answer and count 3; Bronze shows Teacher with Recognizes a helpful first answer and count 5. Each name, description and count belong to that same badge entry.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-PROFILE-PAGE)
    children: []
  - id: REQ-7.4
    name: Navigate owned activity
    description:
      text: |-
        Members open their own profile and select Activity. Activity navigation offers Summary, Answers, Questions, Tags, Articles, Badges, Following, Bounties, Reputation, All actions, Responses and Votes, visibly marking the chosen view as current. Answers offers Score, Activity, Newest and Next page, with actual parent titles, excerpts and accepted status. Questions shows the owner’s published titles with numeric Score, Answer count and View count. Votes and answer counts reflect actual operations; view counts are nonnegative and do not decrease on reload. Responses shows comments by other members on the owner’s questions or answers, containing the comment text and actual parent question link; comments on another owner’s content remain separate. Reputation shows recorded contributions. Only the owner can view the private Votes log. Public user entries distinguish account identities, including when display names coincide.
      image:
      - id: IMG-USER-FEED
        reference: reference/user-feed.jpeg
        page: profile
    scenarios:
    - id: SCN-REQ-7.4-01
      name: Navigate answers and questions activity
      steps:
      - id: STEP-REQ-7.4-01-01
        Given: |-
          Alice and other members register accounts. Alice publishes a question that receives an answer and one upvote. She answers Bob’s React-state question with an explanation beginning Batch state updates safely.; Bob accepts her answer.
        When: Open the own profile and Activity, inspect all sidebar categories, choose Answers and inspect
          sorting/pagination and answer content, then choose Questions.
        Then: The selected category reports its current state. Answers shows its sorting/pagination controls, Alice’s
          actual React parent, excerpt and accepted status. Questions shows Alice’s published question with
          Score 1 and Answer count 1. View count is a nonnegative integer and does not decrease after reload.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-USER-FEED)
    - id: SCN-REQ-7.4-02
      name: Read responses and private votes
      steps:
      - id: STEP-REQ-7.4-02-01
        Given: |-
          Alice and other members register accounts and publish her question and her answer under Bob’s question. Other members comment separately on Alice’s question and answer; another comment is posted on Bob’s question itself. A member upvotes Alice’s question and answer, and Alice upvotes Bob’s question.
        When: Open own Activity and Responses, then choose Votes and Reputation from Activity navigation.
        Then: |-
          Responses shows both comments on Alice’s own content with their correct parent links and excludes the comment on Bob’s question. Votes shows Alice’s upvote with its actual parent only to her. Reputation shows answer/question upvote reasons with +10 for each upvote.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-USER-FEED)
    - id: SCN-REQ-7.4-03
      name: Protect private voting history
      steps:
      - id: STEP-REQ-7.4-03-01
        Given: |-
          Alice registers, publishes a question and an answer, and upvotes another member’s question. Another registered member sets the same public display name as Alice and publishes a different question. Their public profile entries and contributions distinguish the accounts; their email addresses need not be public. A separate visitor is anonymous.
        When: |-
          As both the other registered member and the anonymous visitor, open Users and select Alice’s own entry, using the public profile identity or published questions to distinguish it from the namesake, then open Activity and inspect Votes. As the anonymous visitor, open Alice’s Questions activity.
        Then: |-
          Votes is absent or disabled for both visitors and Alice’s private vote entry is not disclosed. Public profile navigation remains available. Alice’s Questions activity contains her own question and excludes the namesake member’s question.
        references:
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-USER-FEED)
    children: []
  - id: REQ-7.5
    name: Open an answered post from owned activity
    description:
      text: |-
        The owner selects Answers in activity and opens the actual public parent of an answer they posted. The detail retains that answer’s author, body excerpt and accepted state. For example, Alice registers and answers Bob’s React-state question with an explanation beginning Batch state updates safely.; Bob accepts it. Alice can then follow the activity entry to that same answer under Bob’s question.
      image:
      - id: IMG-USER-FEED
        reference: reference/user-feed.jpeg
        page: profile
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-7.5-01
      name: Follow an activity answer to its parent
      steps:
      - id: STEP-REQ-7.5-01-01
        Given: |-
          Alice and Bob register accounts. Bob publishes a React-state question; Alice posts an answer beginning Batch state updates safely. and Bob accepts it.
        When: Alice opens her own Activity and Answers, then selects that answer’s actual parent question title.
        Then: The public heading matches the selected parent, Alice’s answer contains her submitted excerpt, and its
          accepted marker is visible.
        references:
        - \ref[requirement](REQ-7.4)
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-USER-FEED)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
