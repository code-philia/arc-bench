id: ROOT
name: Stack Overflow developer knowledge sharing
description:
  text: |-
    A developer question-and-answer platform for discovering, publishing, answering, commenting on, voting on, and managing questions and profiles.

    The application, server and evaluator use the fixed UTC time 2026-07-21T12:02:00Z. The expired-comment scenario independently uses fixed UTC time 2026-07-21T12:06:00Z.

    For public historical question index: Historical metrics, comment clock, collapsed thread and sort samples cannot be reproduced by a single new UI post. Missing timestamps use 2026-07-15T12:00:00Z. Answered sample questions contain an answer by Helpful User. Only dedicated voting/editing records are mutable; other samples remain public after deletion of any UI-created question.

    For accounts, questions, answers, comments and filters: All ordinary mutable source examples are created through UI within each case. Question titles append SO_RUN_ID, parallelIndex and case slug; registration email is new_stack_user+<suffix>@example.com. Helpers create a question as the named owner, then answers/comments as the named author in separate authenticated browser contexts. Each case owns its objects.

    For session, edit draft, search, voting and preferences: Produced only by public interactions. No storage injection or hidden API. Vote effects are relative to the author current public reputation, which may include other independent case contributions.
scenarios: []
children:
- id: REQ-1
  name: Discover the community
  description:
    text: |-
      Anonymous and authenticated visitors discover populated public questions. Header, left navigation, main feed and right widgets follow the homepage reference. Right widgets expose The Overflow Blog, meta items, Hot Network Questions and custom filter/tag watchlists.

      Global header is a banner and main navigation is named Main navigation. Question feed contains summary regions named Question <title>. Navigational actions may be links or buttons; status metrics expose plain numeric text.
    image:
    - id: IMG-HOMEPAGE
      reference: reference/homepage.jpeg
      page: home
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open the populated community
    description:
      text: |-
        Opening the application displays a banner with Stack Overflow identity, "Search"(role=searchbox), "Products"(role=button), Log in, and Sign up. "Main navigation"(role=navigation) provides Home, Questions, Tags, and Users. "Question feed"(role=region) displays Ask Question, Newest and Active ordering controls, and summaries containing titles, tags, votes, answers, and views. Linked editorial and network content appears in "The Overflow Blog"(role=region) and "Hot Network Questions"(role=region). Desktop appearance follows the reference.

        Global header is a banner, and main navigation is named "Main navigation". Question feed contains summary regions named "Question <title>". Navigational actions may be links or buttons; status metrics expose plain numeric text. Right widgets include The Overflow Blog, meta items, Hot Network Questions, custom filters, and tag watchlists.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show the anonymous homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          A fresh anonymous browser opens the initialized public world, including public historical question index's retry question, tag catalog and linked editorial/network content; no account session exists.
          Seed prerequisites (prepared before this scenario):
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
          - public historical question index: {"questions": [{"title": "How can I safely retry an idempotent HTTP request in Node.js?", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["node.js", "http", "retry"], "author": "helpful_user", "score": 7, "answers": 0, "views": 42, "asked": "2026-07-01T12:00:00Z", "modified": "2026-07-10T12:00:00Z"}]}
        When: Open the application entry and inspect banner, Search, Products, Log in, Sign up, Main navigation,
          Question feed and its retry-question summary, then the two linked widgets.
        Then: Banner shows Stack Overflow and its account/search actions. Navigation exposes Home, Questions, Tags
          and Users; feed exposes Ask Question, Newest and Active. The retry summary has its exact title, node.js/http/retry
          tags and votes/answers/views metadata. The Overflow Blog and Hot Network Questions are visible with public
          links.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
  - id: REQ-1.2
    name: Navigate community modules
    description:
      text: In main navigation, "Questions"(role=button), "Tags"(role=button), and "Users"(role=button) open their
        respective modules and mark the selected section current=page. Questions displays Question feed, while the
        other modules display "Tags"(role=region) and "Users"(role=region); "Home"(role=button) returns to the feed.
        The user catalog includes Helpful User and Stack User without introducing user-management behavior. The
        question feed offers "Next page"(role=button), disabled when no next page exists, and summaries expose named
        Score, Answer count, and View count outputs.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-TAGS-PAGE
        reference: reference/tags-page.jpeg
        page: tags
      - id: IMG-USERS-PAGE
        reference: reference/users-page.jpeg
        page: users
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Open major community sections
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: The anonymous homepage has the published question, tag and user catalogs, including Helpful User
          and Stack User.
        When: In Main navigation click Questions, Tags, Users and Home in turn, inspecting each selected action
          and corresponding region; inspect Next page in the returned feed, then reopen Users.
        Then: Each selected action reports current=page and opens Question feed, Tags or Users as appropriate. Feed
          offers Next page, and Users visibly includes Helpful User and Stack User.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-TAGS-PAGE)
        - \ref[image](IMG-USERS-PAGE)
    children: []
  - id: REQ-1.3
    name: Read a public question anonymously
    description:
      text: An anonymous visitor can open a published question through the public feed or search and read its title,
        rendered body, tags, and existing answers in "Question post"(role=region). Reading public knowledge requires
        no session; the header continues to offer "Log in"(role=button) and "Sign up"(role=button). This public
        access is independent of the authenticated comment controls in REQ-3.2.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-QUESTIONS-PAGE
        reference: reference/questions-page.jpeg
        page: questions
      - id: IMG-QUESTION-PAGE
        reference: reference/question-page.jpeg
        page: question
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Read without an account
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          The browser has no session and public historical question index includes How can I safely retry an idempotent HTTP request in Node.js? with its body, tags and answers.
          Seed prerequisites (prepared before this scenario):
          - tag catalog: {"tags": [{"name": "node.js", "description": "node.js programming questions", "question_count": 10}, {"name": "http", "description": "http programming questions", "question_count": 8}, {"name": "retry", "description": "retry programming questions", "question_count": 5}]}
          - public historical question index: {"questions": [{"title": "How can I safely retry an idempotent HTTP request in Node.js?", "body": "I am building a Node.js service and need a safe retry pattern for idempotent HTTP requests. I have already tried a simple timeout wrapper, but I need guidance on exponential backoff, duplicate suppression, timeout handling, and observability across intermittent failures in production. What patterns should I use and how should I structure retries so the client remains correct, debuggable, and safe for repeated delivery attempts?", "tags": ["node.js", "http", "retry"], "author": "helpful_user", "score": 7, "answers": 0, "views": 42, "asked": "2026-07-01T12:00:00Z", "modified": "2026-07-10T12:00:00Z"}]}
        When: Open Questions, enter the exact title in banner Search, press Enter and choose that title from Search
          results.
        Then: The public heading, Question post body and node.js/http/retry tags are readable without a login form;
          existing Answers remains readable and the banner still offers Log in and Sign up.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-QUESTIONS-PAGE)
        - \ref[image](IMG-QUESTION-PAGE)
    children: []
- id: REQ-2
  name: Account and public identity
  description:
    text: |-
      Email/password account creation and login; social/SSO excluded. The verified accounts and their credentials are specified in the corresponding scenarios. Owners can edit their profile and access protected activity. No moderator threshold is invented.

      Login and Sign up each expose a named form region and submit button. Form errors are visible within their form. Public profile is a named region; user catalog profile actions combine display name and email to distinguish identical display names. Unavailable unauthorized actions may be absent or disabled.

      For verified accounts: Source-required verified identities; registration creates an account but supplies neither verification nor historical privileges. Each account can perform its named source actions. unknown_user@example.com is absent. Public profile values for profile_editor are Display name Stack User, Full name Existing User, Location Beijing, Title Developer, About me Existing biography, Website https://example.org, X https://x.com/example, GitHub https://github.com/existing. No initial votes/watch/filter for the actors except historical fixtures below.
    image:
    - id: IMG-LOGIN
      reference: reference/login.jpeg
      page: login
  scenarios: []
  children:
  - id: REQ-2.1
    name: Sign in with email and password
    description:
      text: |-
        Clicking "Log in"(role=button) opens "Log in"(role=region) containing "Email"(role=textbox), "Password"(role=textbox), a "Show password"(role=button) toggle, Forgot password? and Sign up entry points. "Show password" reveals the current password without changing its value and becomes "Hide password"(role=button), which restores masking. "Forgot password?"(role=button) remains available as the recovery entry. Submitting valid credentials returns home with "Stack User"(role=button) as the profile action and a session that survives reload. Empty credentials show Email cannot be empty and Password cannot be empty; malformed email shows The email is not a valid email address; an absent account shows No account found with this email; an incorrect password shows The email or password does not match any account. Rejections retain the form and anonymous state.

        Login and Sign up each expose a named form region and submit button. Form errors are visible within their form. Social login and SSO are excluded.

        Login and Sign up each expose a named form region and submit button, with errors visible inside the corresponding form. Public profile is a named region. Profile actions in the user catalog combine display name and email to distinguish identical display names; unavailable unauthorized actions may be absent or disabled.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.jpeg
        page: home
      - id: IMG-LOGIN
        reference: reference/login.jpeg
        page: login
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Sign in and retain session
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: |-
          verified accounts contains stack_user@example.com with Password123! and display name Stack User; the browser is anonymous.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Open Log in from the banner, enter the account Email and Password, submit Log in, and reload the returned
          homepage.
        Then: Question feed appears; after reload the banner still exposes Stack User and no Log in action, demonstrating
          a retained session.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-02
      name: Reject empty credentials
      steps:
      - id: STEP-REQ-2.1-02-01
        Given: The anonymous Log in region is open with Email and Password both empty.
        When: Click Log in inside that form without entering credentials.
        Then: Email cannot be empty and Password cannot be empty are visible within the retained form; the banner
          remains anonymous and no account profile action appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-03
      name: Reject malformed email
      steps:
      - id: STEP-REQ-2.1-03-01
        Given: The anonymous Log in region is open.
        When: Enter invalid-email-format in Email and Password123! in Password, then submit Log in.
        Then: The email is not a valid email address appears in the retained form and no Stack User profile action
          appears.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-04
      name: Reject unknown account
      steps:
      - id: STEP-REQ-2.1-04-01
        Given: The anonymous Log in form is open; unknown_user@example.com does not exist in the initial account
          world.
        When: Fill Email with unknown_user@example.com and Password with Password123!, then submit Log in.
        Then: No account found with this email appears in the retained form; no Stack User profile action appears
          and the browser remains anonymous.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-05
      name: Reject wrong password
      steps:
      - id: STEP-REQ-2.1-05-01
        Given: |-
          The anonymous Log in form is open and stack_user@example.com exists with Password123!.
          Seed prerequisites (prepared before this scenario):
          - verified accounts: {"stack_user": {"email": "stack_user@example.com", "password": "Password123!", "display_name": "Stack User", "reputation": 100, "verified": true}}
        When: Enter that email and WrongPassword123!, then submit Log in.
        Then: The email or password does not match any account appears in the retained form; the account profile
          action is absent.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    - id: SCN-REQ-2.1-06
      name: Toggle password visibility
      steps:
      - id: STEP-REQ-2.1-06-01
        Given: The anonymous Log in form is open with its Forgot password? and Sign up entries available; Password
          starts masked.
        When: Enter Password123!, click Show password, inspect the field, then click Hide password and inspect again.
        Then: Password becomes readable and then masked again without changing Password123!; recovery and signup
          entries remain available throughout the form.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-2.2
    name: Create an account
    description:
      text: |-
        Clicking "Sign up"(role=button) opens "Sign up"(role=region) with Join Stack Overflow heading, "Email"(role=textbox), "Password"(role=textbox), password help, consent text, and a Log in entry. Submitting a unique valid email and password creates the account and signs it in automatically, exposing "<registered email>"(role=button) as the profile action when no display name was entered. An existing email shows Email is already in use; a short password shows visible requirements including a minimum of eight characters. Rejections retain the form without an authenticated session. Registration emails use deterministic run, worker, and case suffixes; verification is not added.

        Login and Sign up each expose a named form region and submit button. Form errors are visible within their form. Social login and SSO are excluded.

        Login and Sign up each expose a named form region and submit button, with errors visible inside the corresponding form. Public profile is a named region. Profile actions in the user catalog combine display name and email to distinguish identical display names; unavailable unauthorized actions may be absent or disabled.
      image:
      - id: IMG-HOMEPAGE
