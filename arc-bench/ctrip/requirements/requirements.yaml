    - id: SCN-REQ-5.16-01
      name: Find a traveler created in the current session
      steps:
      - id: STEP-REQ-5.16-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Search
          New Traveler with ID 110101199001011237 through Add traveler and Save traveler.
        When: >-
          Enter the exact saved name in Traveler name and click Search travelers.
        Then: >-
          Exactly that record remains in Traveler list with masked identity 110101********1237.
        references:
        - \ref[requirement](REQ-5.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-PASSENGER)
    children: []
  - id: REQ-5.17
    name: Exclude nonmatching notification contacts
    description:
      text: |-
        A contact search with a name that matches none of the saved contacts shows no records.
      image:
      - id: IMG-CONTACT
        reference: reference/contact.png
        page: contacts
    scenarios:
    - id: SCN-REQ-5.17-01
      name: Exclude nonmatching notification contacts
      steps:
