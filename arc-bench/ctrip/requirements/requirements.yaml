        "Popular airports" links Beijing Capital, Shanghai Pudong, and Guangzhou Baiyun airports. Choosing C within "Domestic airports" exposes Chengdu, Chongqing, and Changchun links. "Today weather" shows Beijing, -5°C to 3°C, and Boarding process.
