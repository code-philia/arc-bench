  - id: REQ-9.4
    name: Enter the selected regional airport directory
    description:
      text: |-
        Under "Flights" and "More services", "Domestic airport directory" opens Airport guide with "Domestic airports" selected and "Domestic airports" visible. "International airport directory" selects "International and Hong Kong, Macau, Taiwan airports" and displays the matching "International and Hong Kong, Macau, Taiwan airports".
      image:
      - id: IMG-MORESERVICE
        reference: reference/moreservice.png
        page: home
      - id: IMG-AIRPORT1
        reference: reference/airport1.png
        page: airport_guide
    scenarios:
    - id: SCN-REQ-9.4-01
      name: Open domestic airport directory
      steps:
      - id: STEP-REQ-9.4-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Flights, More services and Domestic airport directory.
        Then: >-
          Airport guide opens with Domestic airports selected and its Chengdu link visible.
        references:
        - \ref[requirement](REQ-9.1)
        - \ref[image](IMG-MORESERVICE)
        - \ref[image](IMG-AIRPORT1)
    - id: SCN-REQ-9.4-02
      name: Open international airport directory
      steps:
      - id: STEP-REQ-9.4-02-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Flights, More services and International airport directory.
        Then: >-
          Airport guide opens with International and Hong Kong, Macau, Taiwan airports selected and Hong Kong International
          Airport visible in its matching region.
        references:
        - \ref[requirement](REQ-9.1)
        - \ref[image](IMG-MORESERVICE)
        - \ref[image](IMG-AIRPORT1)
    children: []
