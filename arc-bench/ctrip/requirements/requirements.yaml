        "Delete traveler" offers "Keep traveler" to dismiss without deleting. The same record and masked ID remain in "Traveler list", including after reload. Only Confirm deletion is destructive.
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
    scenarios:
    - id: SCN-REQ-5.19-01
      name: Keep a traveler when deletion is declined
      steps:
      - id: STEP-REQ-5.19-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Keep Declined
          Traveler with ID 110101199001011237 through UI and recorded its list count.
        When: >-
          Click Delete within that traveler, then Keep traveler in Delete traveler dialog; reload.
        Then: >-
          The dialog closes; the same traveler and masked identity 110101********1237 remain and the list count is unchanged
          before and after reload.
