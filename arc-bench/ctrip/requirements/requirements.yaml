        Given: >-
          The customer has opened Contacts with at least one saved contact, for example Zhang San.
        When: >-
          Enter an Absent Contact keyword in Contact name and click Search contacts.
        Then: >-
          Contact list contains no records and Zhang San is excluded.
        references:
        - \ref[requirement](REQ-5.6)
        - \ref[image](IMG-CONTACT)
    children: []
  - id: REQ-5.18
