        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Contact Delete A
          and Contact Keep A. Use Common information → Contacts; create each stated contact with Add contact, Contact name
          set to its name, Mobile number 13800000017, Email wang.wu@example.com, checked Default contact and Save contact.
        When: >-
          Click Delete within Contact Delete A, verify that record remains while Delete contact dialog is open, click
          Confirm deletion and reload.
        Then: >-
          Only Contact Delete A disappears; Contact Keep A remains before and after reload.
        references:
        - \ref[requirement](REQ-5.7)
        - \ref[image](IMG-CONTACT)
    - id: SCN-REQ-5.12-02
      name: Delete only selected contact records
      steps:
