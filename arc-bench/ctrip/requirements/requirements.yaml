        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Contact Batch
          One A, Contact Batch One B and Contact Keep One. Use Common information → Contacts; create each stated contact
          with Add contact, Contact name set to its name, Mobile number 13800000017, Email wang.wu@example.com, checked
          Default contact and Save contact.
        When: >-
          Check Contact Batch One A and Contact Batch One B in Contact list, leave Contact Keep One unselected, click Delete
          selected and Confirm deletion in Delete contacts; reload.
        Then: >-
          Both selected contacts disappear, while Contact Keep One remains before and after reload.
        references:
        - \ref[requirement](REQ-5.7)
        - \ref[image](IMG-CONTACT)
    children: []
  - id: REQ-5.13
    name: Remove saved invoice title records
    description:
      text: |-
        In "Invoice title list", "Delete" opens "Delete invoice title" for the identified title; confirmation removes only that record. "{business identity}" selections and "Delete selected" expose "Delete invoice titles" and "Delete invoice titles"; confirmation removes only selected titles. Removal persists, and scenario targets are UI-created.

      image:
      - id: IMG-REIMBURSEMENT
        reference: reference/reimbursement.png
        page: invoice_titles
    scenarios:
    - id: SCN-REQ-5.13-01
      name: Delete one invoice title after confirmation
      steps:
      - id: STEP-REQ-5.13-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Invoice Delete
          One/91310000123456780B and Invoice Keep One/91310000123456781B. Use Common information → Invoice titles; create
          each stated title with Add invoice title, Type Company, Invoice title set to its name, its stated Taxpayer ID and
          Save.
        When: >-
          Click Delete within Invoice Delete One, verify it remains while Delete invoice title dialog is open, click Confirm
          deletion and reload.
        Then: >-
          Only Invoice Delete One disappears; Invoice Keep One remains before and after reload.
        references:
        - \ref[requirement](REQ-5.9)
        - \ref[image](IMG-REIMBURSEMENT)
    - id: SCN-REQ-5.13-02
      name: Delete only selected invoice title records
      steps:
      - id: STEP-REQ-5.13-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Invoice Batch
          One/91310000123456780B, Invoice Batch Two/91310000123456781B and Invoice Keep Two/91310000123456782B. Use Common
          information → Invoice titles; create each stated title with Add invoice title, Type Company, Invoice title set to
          its name, its stated Taxpayer ID and Save.
        When: >-
          Check Invoice Batch One and Invoice Batch Two in Invoice title list, leave Invoice Keep Two unselected, click
          Delete selected and Confirm deletion in Delete invoice titles; reload.
        Then: >-
          Both selected titles disappear, while Invoice Keep Two remains before and after reload.
        references:
        - \ref[requirement](REQ-5.9)
        - \ref[image](IMG-REIMBURSEMENT)
    children: []
  - id: REQ-5.14
    name: Edit a saved traveler name
    description:
      text: |-
        Clicking "Edit" within an identified "Traveler list" record opens "Edit traveler", prefilled with Full name and ID number and offering Save traveler. Changing only the name updates that same record while retaining its ID rather than creating another. The new name and masked ID persist after reload.
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
      - id: IMG-ADDPASSENGER
        reference: reference/addpassenger.png
        page: traveler_form
    scenarios:
    - id: SCN-REQ-5.14-01
      name: Edit a saved traveler name
      steps:
      - id: STEP-REQ-5.14-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Original Traveler
          with ID 110101199001011237 through Add traveler and Save traveler; its list count is recorded.
        When: >-
          Click Edit within Original Traveler, inspect the prefilled name and ID, replace Full name with Updated Traveler,
          click Save traveler and reload.
        Then: >-
          The form retains the original identity; Original Traveler disappears, Updated Traveler displays 110101********1237
          and the record count stays unchanged before and after reload.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-PASSENGER)
        - \ref[image](IMG-ADDPASSENGER)
    children: []
  - id: REQ-5.15
    name: Inspect a saved mailing address detail
    description:
      text: |-
        Each record in "Address list" offers keyboard-accessible "View address". Opening it displays Address details heading and "Address details" with that address's recipient, city, district, street, and mobile. The action's position inside the record is unrestricted.
      image:
      - id: IMG-ADDRESS
        reference: reference/address.png
        page: addresses
      - id: IMG-ADDRESSSHOW
        reference: reference/addressShow.png
        page: address_details
    scenarios:
    - id: SCN-REQ-5.15-01
      name: Inspect a saved mailing address detail
      steps:
      - id: STEP-REQ-5.15-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Address Detail
          Reader. Use Common information → Addresses; create each stated address with Add address, Recipient set to its
          name, City Shanghai, District Pudong New Area, Street address No. 100 Century Avenue, Mobile number 13800000027
          and Save address.
        When: >-
          Activate View address within that saved record.
        Then: >-
          Address details heading and region display the selected recipient, Shanghai, Pudong New Area, No. 100 Century
          Avenue and 13800000027.
        references:
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-ADDRESS)
        - \ref[image](IMG-ADDRESSSHOW)
