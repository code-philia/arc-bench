        page: invoice_titles
    scenarios:
    - id: SCN-REQ-5.18-01
      name: Exclude nonmatching invoice titles
      steps:
      - id: STEP-REQ-5.18-01-01
        Given: >-
          The customer has opened Invoice titles with a saved company title, for example Shanghai Example Technology Co.,
          Ltd.
