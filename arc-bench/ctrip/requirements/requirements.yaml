id: ROOT
name: Ctrip travel services
description:
  text: |-
    A travel services application for account access, flight search and booking, order management, reusable traveler information, flight status, vouchers, and airport guidance. Calendar dates and voucher eligibility use the current date in Asia/Shanghai. Payment countdowns decrease with elapsed time. Navigation, fields and controls have clear names and are usable with the keyboard.
scenarios: []
children:
- id: REQ-1
  name: Account access
  description:
    text: |-
      Visitors can log in with a password or verification code, and register a new mobile account by accepting the agreement, verifying the phone and setting a password. The system provides accounts with a verified email or username and any associated mobile number. Customers can register a mobile account and sign in with that number. Verification delivery is simulated: for example, the code 123456 is accepted only after a code has been sent in the current attempt. Logout ends the session. A password strength indicator is shown when setting a password.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Enter the travel application
    description:
      text: |-
        The signed-out homepage shows one Ctrip Travel title, one Log in entry and one Register entry in the main navigation. A search box and a quick-flight form with Origin and Destination are available.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show signed-out entry
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Inspect the initial homepage.
        Then: >-
          The page shows one Ctrip Travel heading and one entry each for Log in and Register in the main navigation,
          alongside the site search and the Origin and Destination fields.
        references:
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.2
    name: Open and switch login methods
    description:
      text: |-
        Log in navigation opens the password form with Log in heading and "Account" and "Password". "Verification code login" switches to "Mobile number" and "Verification code"; "Password login" switches back freely.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Open password login
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Log in within the main navigation.
        Then: >-
          Log in heading, Account and Password fields are visible.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-LOGIN2)
    - id: SCN-REQ-1.2-02
      name: Switch login modes
      steps:
      - id: STEP-REQ-1.2-02-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Activate Verification code login, inspect the form, then activate Password login.
        Then: >-
          SMS mode shows Mobile number and Verification code; switching back shows Account and Password.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-LOGIN2)
    children: []
  - id: REQ-1.3
    name: Authenticate with password
    description:
      text: |-
        Users enter a verified mobile, username, or email in "Account", enter "Password", select the initially unchecked "Agree to terms", and click "Log in". Agreement is required. Missing credentials or incorrect credentials show the specified alert without signing in; success returns home and replaces the login entry with "My account".
      image:
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Authenticate by email
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. ctrip_user@example.com is the verified user account.
        When: >-
          Enter Account ctrip_user@example.com and Password Travel1234, check Agree to terms and click Log in.
        Then: >-
          Ctrip Travel homepage opens, My account is visible and the signed-out Log in entry disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-02
      name: Authenticate by username
      steps:
      - id: STEP-REQ-1.3-02-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. ctrip_user identifies the verified user account.
        When: >-
          Enter Account ctrip_user and Password Travel1234, check Agree to terms and click Log in.
        Then: >-
          Ctrip Travel homepage opens, My account is visible and the signed-out Log in entry disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-03
      name: Authenticate by mobile
      steps:
      - id: STEP-REQ-1.3-03-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. The customer has registered a mobile account, for example with 13800000010.
        When: >-
          Enter the registered mobile number and its password, check Agree to terms and select Log in.
        Then: >-
          Ctrip Travel homepage opens, My account is visible and the signed-out Log in entry disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-04
      name: Reject missing account
      steps:
      - id: STEP-REQ-1.3-04-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Leave Account empty, enter Password Travel1234, check Agree to terms and click Log in.
        Then: >-
          Enter your account alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-05
      name: Reject missing password
      steps:
      - id: STEP-REQ-1.3-05-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Enter Account ctrip_user@example.com, leave Password empty, check Agree to terms and click Log in.
        Then: >-
          Enter your password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-06
      name: Reject incorrect password
      steps:
      - id: STEP-REQ-1.3-06-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Enter Account ctrip_user@example.com and Password WrongPass123, check Agree to terms and click Log in.
        Then: >-
          Incorrect account or password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-07
      name: Require legal acceptance
      steps:
      - id: STEP-REQ-1.3-07-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Enter Account ctrip_user@example.com and Password Travel1234, leave Agree to terms unchecked and click Log in.
        Then: >-
          Agree to terms first alert appears, the login form remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.4
    name: Authenticate with SMS verification
    description:
      text: |-
        SMS login defaults to +86 and provides "Mobile number", "Verification code", and "Send code", which becomes "Resend code". With a sent code 123456 and "Agree to terms" selected, "Log in" authenticates and displays "My account". Missing mobile or code, an incorrect code, or absent agreement shows the declared alert and retains the signed-out form; required fields cannot substitute for each other.
      image:
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.4-01
      name: Authenticate with sent code
      steps:
      - id: STEP-REQ-1.4-01-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code. The customer has registered a mobile account, for example with 13800000011.
        When: >-
          Enter the registered mobile number, click Send code, enter Verification code 123456, check Agree to terms and click
          Log in.
        Then: >-
          +86 is displayed, Send code changes to Resend code, and successful login opens Ctrip Travel with My account.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-02
      name: Reject sending without mobile
      steps:
      - id: STEP-REQ-1.4-02-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code.
        When: >-
          Leave Mobile number empty and click Send code.
        Then: >-
          Enter your mobile number alert appears and My account remains absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-03
      name: Reject empty verification code
      steps:
      - id: STEP-REQ-1.4-03-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code. The customer has registered a mobile account.
        When: >-
          Enter the registered mobile number, click Send code, leave Verification code empty, check Agree to terms and click
          Log in.
        Then: >-
          Enter your verification code alert appears; Mobile number remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-04
      name: Reject incorrect verification code
      steps:
      - id: STEP-REQ-1.4-04-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code. The customer has registered a mobile account.
        When: >-
          Enter the registered mobile number, click Send code, enter Verification code 000000, check Agree to terms and click
          Log in.
        Then: >-
          Incorrect verification code alert appears; the SMS form remains and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-05
      name: Require SMS legal acceptance
      steps:
      - id: STEP-REQ-1.4-05-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code. The customer has registered a mobile account.
        When: >-
          Enter the registered mobile number, click Send code, enter Verification code 123456, leave Agree to terms unchecked
          and click Log in.
        Then: >-
          Agree to terms first alert appears; the SMS form remains and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.5
    name: Accept or decline registration agreements
    description:
      text: |-
        Register navigation displays Register heading and "Registration agreement and privacy policy"; "Free registration" from password login opens the same agreement. The agreement remains accessible through "Registration agreement and privacy policy". Agree and continue opens Verify mobile number with "Mobile number" and "Verification code", while Decline returns to the signed-out homepage without creating an account or displaying "My account".
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-REGISTER1
        reference: reference/register1.png
        page: register
    scenarios:
    - id: SCN-REQ-1.5-01
      name: Open registration agreement
      steps:
      - id: STEP-REQ-1.5-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Register in the main navigation.
        Then: >-
          Register heading and Registration agreement and privacy policy dialog appear with Agree and continue and Decline
          buttons.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    - id: SCN-REQ-1.5-02
      name: Accept from login registration entry
      steps:
      - id: STEP-REQ-1.5-02-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked.
        When: >-
          Activate Free registration, then click Agree and continue within the agreement dialog.
        Then: >-
          Verify mobile number heading and Mobile number and Verification code fields appear.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    - id: SCN-REQ-1.5-03
      name: Decline registration
      steps:
      - id: STEP-REQ-1.5-03-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Register, then click Decline within Registration agreement and privacy policy.
        Then: >-
          Ctrip Travel homepage returns with Log in; the agreement dialog closes and My account is absent.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    children: []
  - id: REQ-1.6
    name: Verify a new mobile for registration
    description:
      text: |-
        After "Register" opens "Registration agreement and privacy policy", "Agree and continue" advances to Verify mobile number. Users enter an unused unused mobile number in "Mobile number" and click "Send code", enabling accepted code 123456 and changing the action to "Resend code". Entering that code in "Verification code" and clicking "Next, set password" opens Set password with "Password" and "Confirm password".
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.6-01
      name: Advance after mobile verification
      steps:
      - id: STEP-REQ-1.6-01-01
        Given: >-
          The visitor is signed out on the homepage. The visitor has an unused mobile number.
        When: >-
          Activate Register, Agree and continue, enter the Mobile number, click Send code, enter 123456 in Verification code
          and click Next, set password.
        Then: >-
          Resend code appears after sending, then Set password opens with Password and Confirm password fields.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.7
    name: Create account with a valid password
    description:
      text: |-
        Users enter matching "Password" and "Confirm password" values containing both letters and numbers and at least eight characters, then click "Complete registration". Success shows Registration successful and opens password login; invalid submissions display the validation message for the problem and stay on Set password. The created mobile account must authenticate through "Account", Password, "Agree to terms", and "Log in", resulting in "My account".
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.7-01
      name: Complete registration and authenticate created account
      steps:
      - id: STEP-REQ-1.7-01-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter Travel1234 in both Password and Confirm password and click Complete registration; on the resulting login
          form enter the same phone in Account and Travel1234 in Password, check Agree to terms and click Log in.
        Then: >-
          Registration successful status appears and password login opens; the newly created credentials authenticate and
          expose My account.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.7-02
      name: Reject mismatched passwords
      steps:
      - id: STEP-REQ-1.7-02-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter Password Travel1234 and Confirm password Travel5678 and click Complete registration.
        Then: >-
          Passwords do not match alert appears, Set password remains open and My account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.7-03
      name: Reject weak password
      steps:
      - id: STEP-REQ-1.7-03-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter 1234567 in both Password and Confirm password and click Complete registration.
        Then: >-
          Password must contain letters and numbers and be at least 8 characters alert appears; Set password remains and My
          account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.8
    name: End authenticated session
    description:
      text: |-
        Hovering "My account" reveals the Log out menu entry. Activating it clears the session and replaces My account with Log in on the signed-out homepage, including after reload.
      image:
      - id: IMG-ENTER-SELF
        reference: reference/enter_self.png
        page: home
    scenarios:
    - id: SCN-REQ-1.8-01
      name: Log out and retain signed-out state
      steps:
      - id: STEP-REQ-1.8-01-01
        Given: >-
          A customer has registered a mobile account and signed in.
        When: >-
          Hover My account, select Log out, then reload.
        Then: >-
          Log in returns to the main navigation and My account disappears, both before and after reload.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-ENTER-SELF)
    children: []
  - id: REQ-1.9
    name: Reject registration with an incorrect sent code
    description:
      text: |-
        Following acceptance in "Registration agreement and privacy policy", users enter an unused mobile number, click "Send code", and enter an incorrect "Verification code". "Next, set password" shows Incorrect verification code, retains mobile verification and the entered phone, and does not expose password setup.
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.9-01
      name: Reject registration with an incorrect sent code
      steps:
      - id: STEP-REQ-1.9-01-01
        Given: >-
          The visitor is signed out on the homepage. The visitor has an unused mobile number.
        When: >-
          Activate Register and Agree and continue, enter the phone, click Send code, enter 000000 in Verification code and
          click Next, set password.
        Then: >-
          Incorrect verification code appears; Verify mobile number remains, the entered phone is retained and Set password
          is absent.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.10
    name: Reject a letters-only registration password
    description:
      text: |-
        After mobile verification, entering abcdefgh in "Password" and "Confirm password", then clicking "Complete registration", shows Password must contain letters and numbers and be at least 8 characters. Eight letters alone are insufficient; Set password remains visible without authentication or "My account".
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.10-01
      name: Reject a letters-only registration password
      steps:
      - id: STEP-REQ-1.10-01-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter abcdefgh in both Password and Confirm password and click Complete registration.
        Then: >-
          Password must contain letters and numbers and be at least 8 characters appears; Set password remains and My
          account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.11
    name: Reject a numbers-only registration password
    description:
      text: |-
        After mobile verification, entering 12345678 in "Password" and "Confirm password", then clicking "Complete registration", shows Password must contain letters and numbers and be at least 8 characters. Eight digits alone are insufficient; Set password remains visible without authentication or "My account".
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.11-01
      name: Reject a numbers-only registration password
      steps:
      - id: STEP-REQ-1.11-01-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter 12345678 in both Password and Confirm password and click Complete registration.
        Then: >-
          Password must contain letters and numbers and be at least 8 characters appears; Set password remains and My
          account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.12
    name: Accept an eight-character mixed registration password
    description:
      text: |-
        Entering Abcd1234 identically in "Password" and "Confirm password" satisfies the inclusive eight-character mixed-password boundary. "Complete registration" creates the account, whose mobile and password subsequently authenticate through "Account", Password, "Agree to terms", and "Log in", showing "My account".
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.12-01
      name: Accept an eight-character mixed registration password
      steps:
      - id: STEP-REQ-1.12-01-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter Abcd1234 in both password fields and click Complete registration; on Log in enter the same mobile in Account
          and Abcd1234 in Password, check Agree to terms and click Log in.
        Then: >-
          Registration successful appears and the created eight-character mixed password authenticates, exposing My account.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.13
    name: Require a sent code before SMS authentication
    description:
      text: |-
        Entering "Mobile number" and the otherwise accepted 123456 in "Verification code", selecting "Agree to terms", and clicking "Log in" without sending a code in the current attempt must reject authentication. The SMS form remains and "My account" does not appear.
      image:
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
    scenarios:
    - id: SCN-REQ-1.13-01
      name: Require a sent code before SMS authentication
      steps:
      - id: STEP-REQ-1.13-01-01
        Given: >-
          The visitor is signed out on the homepage. Log in has been opened from the main navigation; Agree to terms
          initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only
          after Send code. The customer has registered a mobile account and has not sent a code in this login attempt.
        When: >-
          Enter the registered mobile number and Verification code 123456, check Agree to terms and click Log in without
          sending a code.
        Then: >-
          A visible alert rejects the attempt; Mobile number remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
    children: []
  - id: REQ-1.14
    name: Reject a short mixed registration password
    description:
      text: |-
        Entering matching Abcd123 in "Password" and "Confirm password" fails the independent eight-character minimum despite containing both letters and numbers. "Complete registration" shows Password must contain letters and numbers and be at least 8 characters, retains Set password, and does not sign in.
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.14-01
      name: Reject a short mixed registration password
      steps:
      - id: STEP-REQ-1.14-01-01
        Given: >-
          The visitor has an unused mobile number. From Register, accept Registration agreement and privacy policy using
          Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set
          password; Set password is now open.
        When: >-
          Enter Abcd123 in both password fields and click Complete registration.
        Then: >-
          Password must contain letters and numbers and be at least 8 characters appears; Set password remains and My
          account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.15
    name: Reject registration without a verification code
    description:
      text: |-
        "Register" opens "Registration agreement and privacy policy", and "Agree and continue" opens mobile verification. After entering "Mobile number" and clicking "Send code", leaving "Verification code" empty and clicking "Next, set password" shows Enter your verification code, retains Verify mobile number and the entered phone, and does not expose Set password.
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.15-01
      name: Reject registration without a verification code
      steps:
      - id: STEP-REQ-1.15-01-01
        Given: >-
          The visitor is signed out on the homepage. The visitor has an unused mobile number.
        When: >-
          Open Register, accept Agree and continue, enter the Mobile number and click Send code; leave Verification code
          empty and click Next, set password.
        Then: >-
          Enter your verification code appears; Verify mobile number and the entered phone remain, while Set password is
          absent.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-REGISTER2)
    children: []
- id: REQ-2
  name: Find flights and select a fare
  description:
    text: |-
      Quick search supports domestic and international trips, cities, dates, children and cabin preferences. Results support updating criteria, browsing nearby fares, filtering and sorting. The city directory includes Chengdu (CTU) in Popular and Guangzhou (CAN) under GHIJ, along with Shanghai and Beijing. All airlines clears only the airline restriction.

      The system publishes booking inventory by route and date. For example, booking results for Chengdu–Guangzhou two days from today are CZ3401 (China Southern, nonstop, ¥320, 11:00, 95% on time), JD5162 (another airline, stopover, ¥460, 09:00, 88%) and MU5234 (another airline, nonstop, ¥580, 07:30, 91%). The next day has only CZ3401 at ¥320 plus ¥70 in taxes. The departure picker shows ¥460 for the first example date; the nearby and monthly fare views show ¥320 for the following day. No Beihai–Mars City flight is available in the example. Flight numbers can recur on different routes, dates or services; booking MU5234 and status MU5234 are separate flights.
    image:
    - id: IMG-SEARCH
      reference: reference/search.png
      page: home
    - id: IMG-SEARCH-PANEL
      reference: reference/search_panel.png
      page: flight_results
    - id: IMG-SEARCH-RESULTS
      reference: reference/search_results.png
      page: flight_results
  scenarios: []
  children:
  - id: REQ-2.1
    name: Configure trip type
    description:
      text: |-
        "One way" is initially selected, with "Add return" available and "Return date" absent. Selecting "Round trip" reveals Return date, while returning to One way hides it. "Multi-city" is also available.
      image:
      - id: IMG-SEARCH
        reference: reference/search.png
        page: home
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Switch one-way and round-trip modes
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: >-
          The visitor is signed out on the homepage. One way is initially selected.
        When: >-
          Inspect Add return and the absent Return date, select Round trip, then select One way again.
        Then: >-
          Round trip reveals Return date; One way removes that field and restores Add return; Multi-city remains available.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SEARCH)
    children: []
  - id: REQ-2.2
    name: Select and exchange route cities
    description:
      text: |-
        "Origin" and "Destination" accept cities; "Swap cities" exchanges their values without searching. "City selection" opens "City selection", with its "City selection" choices: origin defaults to Popular with Chengdu, while the destination's GHIJ tab includes Guangzhou. Choosing a city closes the dialog and fills the city and airport code.
      image:
      - id: IMG-CITY-SELECTION
        reference: reference/city_selection.png
        page: home
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Exchange route cities
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Enter Origin Chengdu and Destination Guangzhou, then click Swap cities.
        Then: >-
          Origin becomes Guangzhou and Destination becomes Chengdu.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    - id: SCN-REQ-2.2-02
      name: Choose a popular origin
      steps:
      - id: STEP-REQ-2.2-02-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Click Origin, inspect the selected Popular tab in City selection, then click Chengdu.
        Then: >-
          Origin becomes Chengdu (CTU) and City selection closes.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    - id: SCN-REQ-2.2-03
      name: Choose destination by pinyin group
      steps:
      - id: STEP-REQ-2.2-03-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Click Destination, select GHIJ within City selection and click Guangzhou.
        Then: >-
          Destination becomes Guangzhou (CAN) and City selection closes.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-CITY-SELECTION)
    children: []
  - id: REQ-2.3
    name: Choose valid journey dates
    description:
      text: |-
        Opening Departure date shows a calendar with daily fares. Selecting an available departure sets the date and closes the calendar. Dates before today are disabled. Add return selects Round trip and opens the Return date calendar. A return four days after departure displays a four-day trip, and dates before departure cannot be selected.
      image:
      - id: IMG-DATE-SELECTION
        reference: reference/date_selection.png
        page: home
      - id: IMG-DATE-SELECTION-2
        reference: reference/date_selection_2.png
        page: home
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Select a future departure with fare
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: >-
          The visitor is signed out on the homepage. Calendar fares include ¥460 for two days from today.
        When: >-
          Open Departure date, inspect the fare, then click two days from today.
        Then: >-
          ¥460 is displayed; Departure date becomes two days from today and the date picker closes.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-02
      name: Disable past departure dates
      steps:
      - id: STEP-REQ-2.3-02-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Open Departure date and inspect yesterday.
        Then: >-
          The past date is shown and cannot be selected.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-03
      name: Add a four-day return trip
      steps:
      - id: STEP-REQ-2.3-03-01
        Given: >-
          The visitor is signed out on the homepage. Departure date has been selected as two days from today.
        When: >-
          Click Add return and select six days from today.
        Then: >-
          Round trip is selected, Return date becomes six days from today and 4 days is displayed.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    - id: SCN-REQ-2.3-04
      name: Disable return before departure
      steps:
      - id: STEP-REQ-2.3-04-01
        Given: >-
          The visitor is signed out on the homepage. Departure date has been selected as two days from today.
        When: >-
          Click Add return and inspect return choice tomorrow.
        Then: >-
          The earlier return date is shown and cannot be selected.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-DATE-SELECTION)
        - \ref[image](IMG-DATE-SELECTION-2)
    children: []
  - id: REQ-2.4
    name: Execute matching or empty flight search
    description:
      text: |-
        Users enter the origin, destination and departure date and select Search flights. The results retain those choices and show the matching flights with fare, airline, stops, departure time and on-time rate. For example, a Chengdu–Guangzhou search for two days from today returns CZ3401, JD5162 and MU5234. Equal cities show Origin and destination cannot be the same. Beihai–Mars City four days from today shows No flights found and offers Modify search.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Show matching published flights
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: >-
          The visitor is signed out on the homepage. The system has published three flights from Chengdu to Guangzhou
          for departure two days from today.
        When: >-
          Enter Origin Chengdu and Destination Guangzhou, choose Departure date two days from today and click Search
          flights.
        Then: >-
          Flight results opens with exactly CZ3401, JD5162 and MU5234; Origin, Destination and Departure date retain
          Chengdu, Guangzhou and two days from today.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.4-02
      name: Reject identical cities
      steps:
      - id: STEP-REQ-2.4-02-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Enter Chengdu in both Origin and Destination and click Search flights.
        Then: >-
          Origin and destination cannot be the same alert appears; editable search remains and Flight results does not open.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.4-03
      name: Show empty route result
      steps:
      - id: STEP-REQ-2.4-03-01
        Given: >-
          The visitor is signed out on the homepage. No Beihai–Mars City flight is published for four days from today.
        When: >-
          Enter Origin Beihai and Destination Mars City, select Departure date four days from today and click Search
          flights.
        Then: >-
          Flight list has no flight listitems and displays No flights found with Modify search.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-2.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.5
    name: Carry traveler and cabin preferences into search
    description:
      text: |-
        Selecting "Traveling with children" carries that preference into Flight results as Children included. "Cabin class" includes Economy and retains the chosen option during search.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.5-01
      name: Search with children included
      steps:
      - id: STEP-REQ-2.5-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Check Traveling with children, then Enter Origin Chengdu and Destination Guangzhou, choose Departure date two days
          from today and click Search flights.
        Then: >-
          Flight results displays Children included.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.5-02
      name: Choose Economy preference
      steps:
      - id: STEP-REQ-2.5-02-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Select Economy in Cabin class, then Enter Origin Chengdu and Destination Guangzhou, choose Departure date two days
          from today and click Search flights.
        Then: >-
          Economy is selected and retained in Cabin class on Flight results.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.6
    name: Reuse saved booking search
    description:
      text: |-
        A signed-out visitor can reuse a prior booking search. Choosing Chengdu - Guangzhou from Search history restores the two cities and the saved departure date and opens the corresponding results directly.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.6-01
      name: Reuse anonymous route history
      steps:
      - id: STEP-REQ-2.6-01-01
        Given: >-
          The signed-out visitor previously searched for Chengdu to Guangzhou with departure two days from today and
          returned to the homepage.
        When: >-
          Activate Chengdu - Guangzhou within Search history.
        Then: >-
          Flight results opens directly; Origin, Destination and Departure date restore Chengdu, Guangzhou and two days from
          today.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.7
    name: Update results search criteria
    description:
      text: |-
        Flight results permits changing route criteria, "Departure date", and "Cabin class". "Update results" after choosing a departure three days from today and selecting Economy retains the results view and updated criteria while refreshing "Flight list" for that day.
      image:
      - id: IMG-SEARCH-PANEL
        reference: reference/search_panel.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.7-01
      name: Refresh date and cabin on results
      steps:
      - id: STEP-REQ-2.7-01-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop). Departures three days from today include only CZ3401 at ¥320.
        When: >-
          Choose Departure date three days from today, select Economy in Cabin class and click Update results.
        Then: >-
          Flight results remains open with three days from today and Economy retained, and Flight list contains only CZ3401
          priced ¥320.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[requirement](REQ-2.5)
        - \ref[image](IMG-SEARCH-PANEL)
    children: []
  - id: REQ-2.8
    name: Explore nearby and monthly fares
    description:
      text: |-
        "Date bar" shows nearby minimum fares and next-week navigation. Selecting the fare of ¥320 for the departure three days from today updates "Departure date" and "Flight list". "More dates" opens "Monthly fares" and shows ¥320 for the departure three days from today; Next week exposes the date one week after the original departure.
      image:
      - id: IMG-MORE-DATE
        reference: reference/more_date.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.8-01
      name: Switch to nearby low-fare date
      steps:
      - id: STEP-REQ-2.8-01-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Inspect three days from today in Date bar and click it.
        Then: >-
          The action shows ¥320; Departure date becomes three days from today and Flight list contains only CZ3401 priced
          ¥320.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-MORE-DATE)
    - id: SCN-REQ-2.8-02
      name: Open monthly fares
      steps:
      - id: STEP-REQ-2.8-02-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click More dates within Date bar.
        Then: >-
          Monthly fares dialog opens with a date option for three days from today displaying ¥320.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-MORE-DATE)
    - id: SCN-REQ-2.8-03
      name: View next week dates
      steps:
      - id: STEP-REQ-2.8-03-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click Next week within Date bar.
        Then: >-
          Date bar offers the date one week after the selected departure.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-MORE-DATE)
    children: []
  - id: REQ-2.9
    name: Filter flights by stops and airline
    description:
      text: |-
        Selecting "Nonstop only" removes JD5162 from "Flight list". Selecting China Southern in "Airline" additionally leaves only CZ3401; the filters compose without resetting each other.
      image:
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.9-01
      name: Compose nonstop and airline filters
      steps:
      - id: STEP-REQ-2.9-01-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Check Nonstop only, inspect the results, then select China Southern in Airline.
        Then: >-
          Nonstop first leaves CZ3401 and MU5234 and excludes JD5162; adding the airline filter leaves only CZ3401.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.10
    name: Sort matching flights
    description:
      text: |-
        "Price: low to high", "On-time: high to low", and "Departure: earliest first" order "Flight list" by numeric fare, numeric on-time rate, or chronological departure respectively. Sorting changes the display order while preserving the matching flights.
      image:
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.10-01
      name: Order by lowest price
      steps:
      - id: STEP-REQ-2.10-01-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click Price: low to high.
        Then: >-
          The three flights remain and their visible order is CZ3401, JD5162, MU5234.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.10-02
      name: Order by highest punctuality
      steps:
      - id: STEP-REQ-2.10-02-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click On-time: high to low.
        Then: >-
          The three flights remain and their visible order is CZ3401, MU5234, JD5162.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-SEARCH-RESULTS)
    - id: SCN-REQ-2.10-03
      name: Order by earliest departure
      steps:
      - id: STEP-REQ-2.10-03-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click Departure: earliest first.
        Then: >-
          The three flights remain and their visible order is MU5234, JD5162, CZ3401.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.11
    name: Inspect and collapse fare options
    description:
      text: |-
        Within "Flight JD5162", Show fares reveals Fare options with its Economy fare group and Refund and change rules. Hide fares closes those options and restores Show fares.
      image:
      - id: IMG-SEARCH-RESULTS
        reference: reference/search_results.png
        page: flight_results
    scenarios:
    - id: SCN-REQ-2.11-01
      name: Expand and collapse the selected flight fare
      steps:
      - id: STEP-REQ-2.11-01-01
        Given: >-
          The visitor has used Origin Chengdu, Destination Guangzhou, Departure date two days from today and Search flights;
          Flight list contains CZ3401 (¥320, 11:00, 95%, nonstop), JD5162 (¥460, 09:00, 88%, stopover) and MU5234 (¥580,
          07:30, 91%, nonstop).
        When: >-
          Click Show fares within Flight JD5162, inspect its Fare options, then click Hide fares within the same flight.
        Then: >-
          Fare options displays Economy fare and Refund and change rules; Hide fares closes that region and restores Show
          fares.
        references:
        - \ref[requirement](REQ-2.4)
        - \ref[image](IMG-SEARCH-RESULTS)
    children: []
  - id: REQ-2.12
    name: Select the identified flight and fare
    description:
      text: |-
