      steps:
      - id: STEP-REQ-9.2-01-01
        Given: >-
          The visitor has opened Flights → More services → Airport guide; the supplied airport directory and weather
          snapshot are available.
        When: >-
          Inspect Popular airports.
        Then: >-
          Beijing Capital Airport, Shanghai Pudong Airport and Guangzhou Baiyun Airport links are visible.
        references:
        - \ref[requirement](REQ-9.1)
        - \ref[image](IMG-AIRPORT1)
    - id: SCN-REQ-9.2-02
      name: Browse domestic cities by initial
      steps:
