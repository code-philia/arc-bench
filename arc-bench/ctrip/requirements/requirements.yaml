        Signed-in users choose Zhang San and Li Si using the "Zhang San" and "Li Si" choices within "Frequent passengers". Their identities appear in "Selected passengers", and "Fee breakdown" updates from Passengers: 1 and Order total: ¥530 to Passengers: 2 and Order total: ¥1060, using ¥460 fare plus ¥70 tax per passenger.
