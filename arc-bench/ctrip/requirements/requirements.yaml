- id: REQ-6
  name: Manage profile and account security
  type: FOLDER
  dependencies: []
  description: |-
    Personal center exposes My information and Account security. Profile fields are masked where stated. Password change verifies existing credentials; phone and email binding include staged identity verification. Avatar settings and final phone/email completion are mentioned without executable outcomes and are retained as untested context.
    ![image](./reference/myinfo.png)
    ![image](./reference/modifyinfo.png)
    ![image](./reference/safecenter.png)


    Profile Gender uses combobox semantics. Security verification attempts are context-scoped: an accepted code must have been sent in the current attempt.
  children:
  - id: REQ-6.1
    name: Read masked personal profile
    type: ATOMIC
    dependencies:
    - REQ-5.1
    description: |-
      Opening "My information"(role=button) for profile_read displays mobile 138****0013, email c***@example.com, Profile Reader, Li Ming, Male, and 1990-01-01.

      ![image](./reference/myinfo.png)
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Read personal information with masking
      steps:
      - keyword: GIVEN
        content: The named owner signs in through Log in with its DATA-ACCOUNTS email and Travel1234, checks Agree to
          terms and opens My account → Personal center. profile_read has seeded mobile 13800000013, email ctrip_profile_read@example.com,
          nickname Profile Reader, real name Li Ming, Male and birth 1990-01-01.
      - keyword: WHEN
        content: Activate My information.
      - keyword: THEN
        content: The visible profile shows masked mobile 138****0013 and email c***@example.com with Profile Reader,
          Li Ming, Male and 1990-01-01.
  - id: REQ-6.2
    name: Save personal profile changes
    type: ATOMIC
    dependencies:
    - REQ-6.1
    description: |-
      Under "My information"(role=button), profile_edit clicks "Edit"(role=button) to open "Nickname"(role=textbox), "Real name"(role=textbox), "Gender"(role=combobox) with Female, and "Date of birth"(role=textbox). "Save"(role=button) persists submitted edits and displays the updated values.

      ![image](./reference/modifyinfo.png)
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Persist edited profile fields
      steps:
      - keyword: GIVEN
        content: The named owner signs in through Log in with its DATA-ACCOUNTS email and Travel1234, checks Agree to
          terms and opens My account → Personal center. The owner is profile_edit.
      - keyword: WHEN
        content: Open My information and Edit; enter Nickname Profile Editor, Real name Wang Lin, Gender Female and
          Date of birth 1992-05-16, click Save and reload.
      - keyword: THEN
        content: All four submitted values are visible before and after reload.
  - id: REQ-6.3
    name: Inspect account security settings
    type: ATOMIC
    dependencies:
    - REQ-5.1
    description: |-
      Account security displays named Login password, Bound phone, and Bound email regions with Change your password regularly. Each setting has a Change action scoped to its own region.

      ![image](./reference/safecenter.png)
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Inspect security settings and reminder
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is profile_read.
      - keyword: WHEN
        content: Inspect Login password, Bound phone and Bound email.
      - keyword: THEN
        content: Each named region has its own Change button and Change your password regularly is visible.
  - id: REQ-6.4
    name: Change login password using current password
    type: ATOMIC
    dependencies:
    - REQ-6.3
    - REQ-1.3
    description: |-
      Change within "Login password"(role=region) opens "Current password"(role=textbox), "New password"(role=textbox), "Confirm new password"(role=textbox), and "Complete"(role=button). Entering Travel1234 and matching NewTravel1234! shows Strong in "Password strength"(role=region); completion changes the password and requires Sign in again. Using "Account"(role=textbox), "Password"(role=textbox), "Agree to terms"(role=checkbox), and "Log in"(role=button), the new password reaches "My account"(role=button), while the old password no longer authenticates.
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Replace password and require reauthentication
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is password_change with email ctrip_password_change@example.com.
      - keyword: WHEN
        content: Click Change within Login password; enter Current password Travel1234, New password NewTravel1234!
          and the same Confirm new password; inspect strength and click Complete. Return to Log in, try the old password
          with accepted terms, then submit the new password.
      - keyword: THEN
        content: Password strength displays Strong and completion says Sign in again; the old password shows Incorrect
          account or password, while NewTravel1234! authenticates and exposes My account.
  - id: REQ-6.5
    name: Verify identity before changing bound phone
    type: ATOMIC
    dependencies:
    - REQ-6.3
    description: |-
      Change within "Bound phone"(role=region) opens Verify identity with "Login password"(role=textbox) and "New phone"(role=textbox). Travel1234 and 13900000018 followed by "Next, verify new phone"(role=button) opens Verify new phone with "Verification code"(role=textbox) and Code sent to 13900000018. Final binding completion is unspecified.

      ![image](./reference/modifyphone.png)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-SMS
    scenarios:
    - name: Advance to new-phone verification
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is phone_binding.
      - keyword: WHEN
        content: Click Change within Bound phone; enter Login password Travel1234 and New phone 13900000018 and click
          Next, verify new phone.
      - keyword: THEN
        content: Verify identity initially opens; successful verification opens Verify new phone with Verification code
          and Code sent to 13900000018.
  - id: REQ-6.6
    name: Verify current email before new-email step
    type: ATOMIC
    dependencies:
    - REQ-6.3
    description: |-
      Change in "Bound email"(role=region) shows c***@example.com. "Send verification code"(role=button) enables accepted 123456; entering it in "Verification code"(role=textbox) and clicking "Next, verify new email"(role=button) exposes "New email"(role=textbox). Final new-email verification and binding are unspecified.

      ![image](./reference/modifyemail.png)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-SMS
    scenarios:
    - name: Advance after current-email verification
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is email_binding.
      - keyword: WHEN
        content: Click Change within Bound email, inspect masked c***@example.com, click Send verification code, enter
          123456 and click Next, verify new email.
      - keyword: THEN
        content: Current-email verification succeeds and New email becomes visible; final binding is outside this scenario.
  - id: REQ-6.7
    name: Reject a password change with an incorrect current password
    type: ATOMIC
    dependencies:
    - REQ-6.3
    - REQ-1.8
    description: |-
      In "Login password"(role=region), an incorrect "Current password"(role=textbox) with otherwise valid matching "New password"(role=textbox) and "Confirm new password"(role=textbox) is rejected by "Complete"(role=button). A visible alert retains the change form without Sign in again, and original credentials remain usable to reach "My account"(role=button). Alert wording is unrestricted.

      ![image](./reference/modifypassword.png)
    data:
      requires:
      - DATA-ACCOUNTS
    scenarios:
    - name: Reject a password change with an incorrect current password
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is profile_read.
      - keyword: WHEN
        content: Click Change within Login password; enter Current password WrongPass123 and matching NewTravel1234!
          replacement fields, then Complete. Return Home, use My account → Log out and sign in again with the original
          credentials.
      - keyword: THEN
        content: A visible alert retains Current password without Sign in again; original Travel1234 still authenticates
          profile_read.
  - id: REQ-6.8
    name: Reject phone-change identity verification with wrong password
    type: ATOMIC
    dependencies:
    - REQ-6.3
    description: |-
      In "Bound phone"(role=region), entering WrongPass123 in "Login password"(role=textbox) and 13900000018 in "New phone"(role=textbox), then clicking "Next, verify new phone"(role=button), shows a visible alert and retains Verify identity. Verify new phone and Code sent to 13900000018 do not appear, because failed identity verification cannot send the new-phone code.

      ![image](./reference/modifyphone.png)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-SMS
    scenarios:
    - name: Reject phone-change identity verification with wrong password
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is phone_binding.
      - keyword: WHEN
        content: Click Change in Bound phone, enter Login password WrongPass123 and New phone 13900000018 and click
          Next, verify new phone.
      - keyword: THEN
        content: A visible alert retains Verify identity; Verify new phone and Code sent to 13900000018 are absent.
  - id: REQ-6.9
    name: Reject an incorrect current-email verification code
    type: ATOMIC
    dependencies:
    - REQ-6.3
    description: |-
      Within "Bound email"(role=region), "Send verification code"(role=button) enables only accepted 123456. Entering 000000 in "Verification code"(role=textbox) and clicking "Next, verify new email"(role=button) shows a visible alert and retains current verification; "New email"(role=textbox) remains unavailable. Alert wording is unrestricted.

      ![image](./reference/modifyemail.png)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-SMS
    scenarios:
    - name: Reject an incorrect current-email verification code
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, opens My account
          → Personal center → Account security. The owner is email_binding.
      - keyword: WHEN
        content: Click Change in Bound email, click Send verification code, enter Verification code 000000 and click
          Next, verify new email.
      - keyword: THEN
        content: A visible alert retains Verification code and New email remains unavailable.
- id: REQ-7
  name: Query flight status and reuse history
  type: FOLDER
  dependencies: []
  description: |-
    Flights Flight status supports Flight number and Route search options (radios), flight detail or route list, automatic account-owned history, reuse and clearing. Flight status is a deterministic supplied observation, not live external data.
    ![image](./reference/status1.png)
    ![image](./reference/status2.png)
    ![image](./reference/status3.png)
    ![image](./reference/status4.png)


    Flight status records are uniquely named Record <flight-status identity>. Flight details and Baggage carousel are named regions for status observations.
  children:
  - id: REQ-7.1
    name: Open flight status search
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      "Flights"(role=button) followed by "Flight status"(role=link) opens Flight status heading and query choices "Flight number"(role=radio) and "Route"(role=radio).

      ![image](./reference/status1.png)
    data:
      requires: *id001
    scenarios:
    - name: Open flight status service
      steps:
      - keyword: GIVEN
        content: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
      - keyword: WHEN
        content: Activate Flights and then Flight status (link).
      - keyword: THEN
        content: Flight status heading and Flight number and Route radios are visible.
  - id: REQ-7.2
    name: Query exact flight dynamic details
    type: ATOMIC
    dependencies:
    - REQ-7.1
    description: |-
      In number mode, users enter JD5162 in "Flight number"(role=textbox), July 21 in "Departure date"(role=textbox), and click "Search"(role=button). "Flight details"(role=region) shows the identified flight with Chengdu, Guangzhou, Scheduled, H14-H25, B12, and baggage carousel 6; a named Baggage carousel region disambiguates that numeric observation.

      ![image](./reference/status1.png)
      ![image](./reference/status4.png)
    data:
      requires:
      - DATA-STATUS
    scenarios:
    - name: Show identified flight ground service details
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → Flight status; DATA-STATUS provides July 21 JD5162 Chengdu–Guangzhou
          and MU5234 Shanghai–Beijing observations.
      - keyword: WHEN
        content: Select Flight number, enter JD5162, fill Departure date 2026-07-21 and click Search.
      - keyword: THEN
        content: Flight details identifies JD5162, Chengdu, Guangzhou, Scheduled, H14-H25 and B12; its Baggage carousel
          region displays 6.
  - id: REQ-7.3
    name: Query route flight status
    type: ATOMIC
    dependencies:
    - REQ-7.1
    description: |-
      Choosing "Route"(role=radio) exposes "Origin"(role=textbox), "Destination"(role=textbox), and "Departure date"(role=textbox). Shanghai–Beijing on July 21 followed by "Search"(role=button) displays exactly MU5234 in "Flight status results"(role=region), with China Eastern, 09:00, 11:30, and Scheduled. "Swap cities"(role=button) exchanges city values without running a query.

      ![image](./reference/status2.png)
      ![image](./reference/status3.png)
    data:
      requires:
      - DATA-STATUS
    scenarios:
    - name: Show matching route flight statuses
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → Flight status; DATA-STATUS provides July 21 JD5162 Chengdu–Guangzhou
          and MU5234 Shanghai–Beijing observations.
      - keyword: WHEN
        content: Select Route, enter Origin Shanghai, Destination Beijing and Departure date 2026-07-21, then click
          Search.
      - keyword: THEN
        content: Flight status results contains exactly MU5234 displaying Shanghai, Beijing, China Eastern, 09:00, 11:30
          and Scheduled.
    - name: Exchange status route without running query
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → Flight status; DATA-STATUS provides July 21 JD5162 Chengdu–Guangzhou
          and MU5234 Shanghai–Beijing observations. No status query has been submitted.
      - keyword: WHEN
        content: Select Route, fill Origin Shanghai and Destination Beijing, then click Swap cities.
      - keyword: THEN
        content: Origin becomes Beijing and Destination Shanghai; Flight status results is not displayed.
  - id: REQ-7.4
    name: Record and reuse status searches
    type: ATOMIC
    dependencies:
    - REQ-7.2
    - REQ-1.3
    description: |-
      A completed query showing "Flight details"(role=region) records its account-owned criteria in "Search history"(role=region). Each flight-number-named history action reopens that flight and date. Returning through Flights and Flight status reveals saved history, which tests establish through query UI rather than legacy preloaded examples.
    data:
      requires:
      - DATA-STATUS-HISTORY
      - DATA-ACCOUNTS
      - DATA-STATUS
    scenarios:
    - name: Record and reuse a flight query
      steps:
      - keyword: GIVEN
        content: status_history_use has signed in with its registry credentials and starts with no status history; Flight
          status is open.
      - keyword: WHEN
        content: Select Flight number, query JD5162 for July 21 through Search, reopen Flights → Flight status, then
          activate JD5162 in Search history.
      - keyword: THEN
        content: Flight details reopens for JD5162, Chengdu and Guangzhou with the original July 21 date restored.
  - id: REQ-7.5
    name: Clear recorded status history
    type: ATOMIC
    dependencies:
    - REQ-7.4
    description: |-
      Clear history removes only the current account's records from "Search history"(role=region), showing No search history. Removed entries stay absent after reopening or reload.
    data:
      requires:
      - DATA-STATUS-HISTORY
      - DATA-ACCOUNTS
      - DATA-STATUS
    scenarios:
    - name: Clear account search history
      steps:
      - keyword: GIVEN
        content: status_history_clear has signed in with registry credentials and queried MU5234 for July 21 through
          Flight number and Search, then reopened Flight status; Search history shows MU5234.
      - keyword: WHEN
        content: Click Clear history within Search history and reload.
      - keyword: THEN
        content: MU5234 history action disappears and No search history is displayed, both before and after reload.
  - id: REQ-7.6
    name: Switch flight-status query dimensions
    type: ATOMIC
    dependencies:
    - REQ-7.1
    description: |-
      "Route"(role=radio) exposes "Origin"(role=textbox), "Destination"(role=textbox), and "Departure date"(role=textbox), while hiding the flight-number textbox. "Flight number"(role=radio) instead exposes number and date inputs without city fields. Switching dimensions alone performs no query and does not itself create "Flight status results"(role=region) or "Flight details"(role=region).

      ![image](./reference/status1.png)
      ![image](./reference/status2.png)
    data:
      requires: []
    scenarios:
    - name: Switch flight-status query dimensions
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → Flight status; DATA-STATUS provides July 21 JD5162 Chengdu–Guangzhou
          and MU5234 Shanghai–Beijing observations. No query has been submitted.
      - keyword: WHEN
        content: Select Route, inspect its fields, then select Flight number.
      - keyword: THEN
        content: Route selects and shows Origin, Destination and Departure date while hiding the number textbox; Flight
          number selects and shows number/date while hiding both city fields; neither Flight status results nor Flight
          details is created by switching modes.
  - id: REQ-7.7
    name: Record and reuse a flight-status route query
    type: ATOMIC
    dependencies:
    - REQ-7.3
    - REQ-7.4
    description: |-
      Selecting "Route"(role=radio), entering Shanghai and Beijing in "Origin"(role=textbox) and "Destination"(role=textbox), setting July 21 in "Departure date"(role=textbox), and clicking "Search"(role=button) displays "Flight status results"(role=region) and records "Shanghai - Beijing"(role=button) in "Search history"(role=region). Activating that history action restores the route and date and reruns the route query rather than treating it as a flight number. Route history names follow Origin - Destination.

      ![image](./reference/status2.png)
      ![image](./reference/status3.png)
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-STATUS
      - DATA-STATUS-HISTORY
    scenarios:
    - name: Record and reuse a flight-status route query
      steps:
      - keyword: GIVEN
        content: status_route_history has signed in with registry credentials and starts with no history; Flight status
          is open.
      - keyword: WHEN
        content: Select Route, enter Shanghai, Beijing and July 21 and click Search; verify MU5234, reopen Flight status
          and activate Shanghai - Beijing within Search history.
      - keyword: THEN
        content: The route query reruns with exactly MU5234 displaying Shanghai and Beijing; route fields and Departure
          date restore the same criteria.
  - id: REQ-7.8
    name: Keep status search history private to its account
    type: ATOMIC
    dependencies:
    - REQ-7.4
    - REQ-1.8
    description: |-
      After querying under a dedicated history-isolation account, switching accounts through "My account"(role=button) must not expose its query in profile_read's "Search history"(role=region). Profile_read starts with no history and no other scenario queries under it; history remains private to the account.
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-STATUS
      - DATA-STATUS-HISTORY
    scenarios:
    - name: Keep status search history private to its account
      steps:
      - keyword: GIVEN
        content: history_isolation and profile_read are separate verified accounts with initially empty status history.
      - keyword: WHEN
        content: Sign in as history_isolation, open Flight status and query JD5162 for July 21; return Home, hover My
          account and activate Log out, sign in as profile_read and reopen Flight status.
      - keyword: THEN
        content: profile_read Search history contains no JD5162 action and displays No search history.
- id: REQ-8
  name: Inspect reimbursement vouchers
  type: FOLDER
  dependencies: []
  description: |-
    More services Reimbursement vouchers is a service hub with Pending, In progress, Completed lifecycle tabs and issuance rules notice. Pending lists eligible paid orders, including older orders through View more orders from the past year. Source explicitly reserves invoice/itinerary application and logistics flow; in-progress/download/delivery records remain context without a defined executable transition.
    ![image](./reference/moreservice.png)
    ![image](./reference/reimbursement2.png)


    Issuance rules is a named region.
  children:
  - id: REQ-8.1
    name: View issued vouchers by lifecycle
    type: ATOMIC
    dependencies:
    - REQ-1.3
    description: |-
      More services and Reimbursement vouchers expose Pending, In progress, and "Completed"(role=tab). The voucher_read account's "Completed vouchers"(role=region) contains exactly paid completed CTRIP20260718004 with its issued voucher. "Issuance rules"(role=region) communicates availability within 365 days of payment.

      ![image](./reference/reimbursement2.png)
    data:
      requires:
      - DATA-VOUCHERS
    scenarios:
    - name: Read completed voucher and issuance rules
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, then opens More
          services → Reimbursement vouchers; the business clock is July 19, 2026. voucher_read owns paid, traveled and
          issued CTRIP20260718004.
      - keyword: WHEN
        content: Inspect Pending, In progress and Completed tabs and Issuance rules, then select Completed.
      - keyword: THEN
        content: All three tabs are visible, Issuance rules mentions the 365-day window, and Completed vouchers contains
          exactly CTRIP20260718004.
  - id: REQ-8.2
    name: Find voucher-eligible paid orders
    type: ATOMIC
    dependencies:
    - REQ-8.1
    description: |-
      At benchmark July 19, choosing "Pending"(role=tab) displays "Pending vouchers"(role=region) for paid eligible orders without applications. Voucher_pending includes CTRIP20260721005 paid July 19; "View more orders from the past year"(role=button) allows voucher_history to load CTRIP20260514001 paid May 14. Accounts without eligible entries show No vouchers available.
    data:
      requires:
      - DATA-VOUCHERS
    scenarios:
    - name: Show currently eligible pending order
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, then opens More
          services → Reimbursement vouchers; the business clock is July 19, 2026. voucher_pending owns paid CTRIP20260721005
          with payment date July 19 and no voucher application.
      - keyword: WHEN
        content: Select Pending.
      - keyword: THEN
        content: Pending vouchers contains exactly the eligible CTRIP20260721005 record.
    - name: Load older eligible order from past year
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, then opens More
          services → Reimbursement vouchers; the business clock is July 19, 2026. voucher_history owns paid CTRIP20260514001,
          payment date 2026-05-14, without a voucher.
      - keyword: WHEN
        content: Select Pending and activate View more orders from the past year.
      - keyword: THEN
        content: Pending vouchers contains exactly CTRIP20260514001 and displays its 2026-05-14 date.
    - name: Show empty pending voucher state
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, then opens More
          services → Reimbursement vouchers; the business clock is July 19, 2026. voucher_read owns only its already
          completed voucher and has no eligible pending application.
      - keyword: WHEN
        content: Select Pending.
      - keyword: THEN
        content: Pending vouchers contains no records and displays No vouchers available.
  - id: REQ-8.3
    name: Keep eligible reimbursement orders scoped to account
    type: ATOMIC
    dependencies:
    - REQ-8.2
    description: |-
      "Pending"(role=tab) displays only the current account's eligible paid orders in "Pending vouchers"(role=region). Profile_read owns no orders and therefore sees no eligible vouchers; another owner's eligible order must not be offered.
    data:
      requires:
      - DATA-ACCOUNTS
      - DATA-VOUCHERS
    scenarios:
    - name: Keep eligible reimbursement orders scoped to account
      steps:
      - keyword: GIVEN
        content: The named owner signs in with its DATA-ACCOUNTS email / Travel1234 and accepted terms, then opens More
          services → Reimbursement vouchers; the business clock is July 19, 2026. profile_read owns no orders or vouchers;
          other accounts own eligible CTRIP20260721005 and CTRIP20260514001.
      - keyword: WHEN
        content: Select Pending.
      - keyword: THEN
        content: Pending vouchers contains no records, displays No vouchers available and exposes neither other account's
          order.
- id: REQ-9
  name: Browse airport travel information
  type: FOLDER
  dependencies: []
  description: |-
    Flights More services Airport guide provides Popular airports, domestic and international/Hong Kong/Macau/Taiwan indexes, deterministic weather snapshot and Boarding process link. Airport detail defaults to Overview and has four core subsections in source, of which Overview/Transportation/Phone numbers are named; no fourth section name is invented. Transport context includes buses, rail, shuttles and taxis; concrete fixture is Fangzhuang line.
    ![image](./reference/airport1.png)
    ![image](./reference/airport2.png)
    ![image](./reference/airport3.png)
    ![image](./reference/airport4.png)
    ![image](./reference/airport5.png)


    Airport-service records are uniquely named Record <airport-service name> within their list region.
  children:
  - id: REQ-9.1
    name: Open airport information service
    type: ATOMIC
    dependencies:
    - REQ-1.1
    description: |-
      Clicking "Flights"(role=button), then "More services"(role=button), then "Airport guide"(role=button) opens Airport guide heading.

      ![image](./reference/airport1.png)
    data:
      requires:
      - DATA-AIRPORTS
    scenarios:
    - name: Open airport guide
      steps:
      - keyword: GIVEN
        content: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
      - keyword: WHEN
        content: Activate Flights, More services and Airport guide in sequence.
      - keyword: THEN
        content: Airport guide heading is visible.
  - id: REQ-9.2
    name: Browse airport indexes and weather
    type: ATOMIC
    dependencies:
    - REQ-9.1
    description: |-
      "Popular airports"(role=region) links Beijing Capital, Shanghai Pudong, and Guangzhou Baiyun airports. Choosing C within "Domestic airports"(role=region) exposes Chengdu, Chongqing, and Changchun links. "Today weather"(role=region) shows Beijing, -5°C to 3°C, and Boarding process.

      ![image](./reference/airport1.png)
    data:
      requires:
      - DATA-AIRPORTS
    scenarios:
    - name: Read popular airport links
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available.
      - keyword: WHEN
        content: Inspect Popular airports.
      - keyword: THEN
        content: Beijing Capital Airport, Shanghai Pudong Airport and Guangzhou Baiyun Airport links are visible.
    - name: Browse domestic cities by initial
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available.
      - keyword: WHEN
        content: Click C within Domestic airports.
      - keyword: THEN
        content: Domestic airports displays Chengdu, Chongqing and Changchun links.
    - name: Read city weather snapshot
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available.
      - keyword: WHEN
        content: Inspect Today weather.
      - keyword: THEN
        content: The supplied Beijing snapshot displays -5°C to 3°C and a Boarding process link.
  - id: REQ-9.3
    name: Read an identified airport overview and services
    type: ATOMIC
    dependencies:
    - REQ-9.2
    description: |-
      Opening Beijing Capital Airport defaults to selected "Overview"(role=tab), with "Airport overview"(role=region) showing Beijing, three runways, and China's first national gateway. "Transportation"(role=tab) displays "City buses"(role=region) with Fangzhuang line, Fangzhuang, 06:00, 21:00, and 30 minutes. "Phone numbers"(role=tab) shows the business record named "Record Medical first aid center"(role=listitem, row or group) with 010-64541100.

      ![image](./reference/airport2.png)
      ![image](./reference/airport3.png)
      ![image](./reference/airport4.png)
      ![image](./reference/airport5.png)
    data:
      requires:
      - DATA-AIRPORTS
    scenarios:
    - name: Read default airport overview
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available. Beijing Capital Airport has been opened from Popular airports.
      - keyword: WHEN
        content: Inspect the default Overview selection and activate Overview.
      - keyword: THEN
        content: Overview is initially selected; Airport overview displays Beijing, 3 runways and China's first national
          gateway.
    - name: Read airport bus timetable
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available. Beijing Capital Airport has been opened from Popular airports.
      - keyword: WHEN
        content: Select Transportation.
      - keyword: THEN
        content: City buses contains Fangzhuang line with Fangzhuang, first service 06:00, last service 21:00 and headway
          30 minutes.
    - name: Read airport medical hotline
      steps:
      - keyword: GIVEN
        content: The visitor has opened Flights → More services → Airport guide; the supplied airport directory and
          deterministic weather snapshot are available. Beijing Capital Airport has been opened from Popular airports.
      - keyword: WHEN
        content: Select Phone numbers.
      - keyword: THEN
        content: The Medical first aid center business record displays 010-64541100.
  - id: REQ-9.4
    name: Enter the selected regional airport directory
    type: ATOMIC
    dependencies:
    - REQ-9.1
    description: |-
      Under "Flights"(role=button) and "More services"(role=button), "Domestic airport directory"(role=button) opens Airport guide with "Domestic airports"(role=tab) selected and "Domestic airports"(role=region) visible. "International airport directory"(role=button) selects "International and Hong Kong, Macau, Taiwan airports"(role=tab) and displays the matching "International and Hong Kong, Macau, Taiwan airports"(role=region).

      ![image](./reference/moreservice.png)
      ![image](./reference/airport1.png)
    data:
      requires:
      - DATA-AIRPORTS
    scenarios:
    - name: Open domestic airport directory
      steps:
      - keyword: GIVEN
        content: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
      - keyword: WHEN
        content: Activate Flights, More services and Domestic airport directory.
      - keyword: THEN
        content: Airport guide opens with Domestic airports selected and its Chengdu link visible.
    - name: Open international airport directory
      steps:
      - keyword: GIVEN
        content: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
      - keyword: WHEN
        content: Activate Flights, More services and International airport directory.
      - keyword: THEN
        content: Airport guide opens with International and Hong Kong, Macau, Taiwan airports selected and Hong Kong
          International Airport visible in its matching region.
