          A visible validation alert appears; Book flight remains open and Payment is absent.
        references:
        - \ref[requirement](REQ-3.3)
        - \ref[image](IMG-BOOK2)
    children: []
  - id: REQ-3.13
    name: Remove purchased extra baggage
    description:
      text: |-
        Deselecting Extra 10 kg in "Baggage allowance" removes its ¥60 fee and restores the free 20 kg baseline and one-passenger JD5162 total ¥530. Clicking "Fee details" displays "Fee details" without the removed baggage line.
      image:
      - id: IMG-BOOK3
        reference: reference/book3.png
        page: booking
    scenarios:
    - id: SCN-REQ-3.13-01
      name: Remove purchased extra baggage
      steps:
      - id: STEP-REQ-3.13-01-01
        Given: >-
          The visitor has searched Chengdu–Guangzhou for two days from today, clicked Show fares in Flight JD5162 and Book
          in Economy fare; Book flight is open with one-passenger fare ¥460 plus tax ¥70, total ¥530. Extra 10 kg has been
          checked, producing 30 kg baggage and total ¥590.
        When: >-
          Uncheck Extra 10 kg and click Fee details.
        Then: >-
          The checkbox is cleared, total returns to ¥530, Fee details omits Extra 10 kg: ¥60, Free checked baggage: 20 kg
          returns and Checked baggage: 30 kg disappears.
        references:
        - \ref[requirement](REQ-3.7)
        - \ref[image](IMG-BOOK3)
    children: []
  - id: REQ-3.14
    name: Remove airport drop-off reservation
    description:
      text: |-
        Deselecting Airport drop-off within "Airport transfer" removes its ¥42 fee and restores the one-passenger JD5162 total ¥530. "Fee details" opens "Fee details", where that fee is absent.
      image:
      - id: IMG-BOOK3
        reference: reference/book3.png
        page: booking
    scenarios:
    - id: SCN-REQ-3.14-01
      name: Remove airport drop-off reservation
      steps:
      - id: STEP-REQ-3.14-01-01
        Given: >-
          The visitor has searched Chengdu–Guangzhou for two days from today, clicked Show fares in Flight JD5162 and Book
          in Economy fare; Book flight is open with one-passenger fare ¥460 plus tax ¥70, total ¥530. Pickup address No. 1
          Tianfu Avenue, Chengdu has been entered and Airport drop-off selected, producing total ¥572.
        When: >-
          Uncheck Airport drop-off and click Fee details.
        Then: >-
          The checkbox is cleared, total returns to ¥530 and Fee details omits Airport drop-off: ¥42.
        references:
        - \ref[requirement](REQ-3.7)
        - \ref[image](IMG-BOOK3)
    children: []
  - id: REQ-3.15
    name: Remove airport lounge service
    description:
      text: |-
        Deselecting Tianfu T2 lounge within "Airport services" removes its ¥80 fee and restores the one-passenger JD5162 total ¥530. Opening "Fee details" shows "Fee details" without the lounge line.
      image:
      - id: IMG-BOOK3
        reference: reference/book3.png
        page: booking
    scenarios:
    - id: SCN-REQ-3.15-01
      name: Remove airport lounge service
      steps:
      - id: STEP-REQ-3.15-01-01
        Given: >-
          The visitor has searched Chengdu–Guangzhou for two days from today, clicked Show fares in Flight JD5162 and Book
          in Economy fare; Book flight is open with one-passenger fare ¥460 plus tax ¥70, total ¥530. Tianfu T2 lounge has
          been checked, producing total ¥610.
        When: >-
          Uncheck Tianfu T2 lounge and click Fee details.
        Then: >-
          The checkbox is cleared, total returns to ¥530 and Fee details omits Tianfu T2 lounge: ¥80.
        references:
        - \ref[requirement](REQ-3.7)
        - \ref[image](IMG-BOOK3)
    children: []
- id: REQ-4
  name: Inspect and cancel orders
  description:
    text: |-
      Orders shows only the signed-in account's orders. Each order shows its number, booking date, itinerary, flight, total and display status. Not traveled and Pending review are distinct from payment state. Actions apply to the selected order. Unpaid orders show the payment deadline countdown and expiry reminder.

      The system supplies existing orders for customers with prior bookings. One example customer has one unpaid JD5162 Chengdu–Guangzhou order for ¥530, one paid CZ3401 order for ¥390 whose trip is upcoming, and one paid MU5234 order for ¥650 whose trip is past and pending review. Existing bookings retain their recorded dates. A customer without orders sees an empty list.
    image:
    - id: IMG-ENTER-ORDER
      reference: reference/enter_order.png
      page: home
    - id: IMG-ORDER1
      reference: reference/order1.png
      page: orders
    - id: IMG-ORDER2
      reference: reference/order2.png
      page: order_details
  scenarios: []
  children:
  - id: REQ-4.1
    name: Open account order list
    description:
      text: |-
        "My account" opens an account menu with Orders. Selecting Orders displays the heading and "Order list", containing only orders owned by the signed-in account.

        The list shows the selected customer’s orders, with one entry for each order number.
      image:
      - id: IMG-ENTER-ORDER
        reference: reference/enter_order.png
        page: home
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Open orders from account menu
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: >-
          A customer has registered a mobile account and signed in.
        When: >-
          Click My account, inspect the menu, then activate Orders.
        Then: >-
          The menu contains Orders; Orders heading and Order list open for this account.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-ENTER-ORDER)
        - \ref[image](IMG-ORDER1)
    children: []
  - id: REQ-4.2
    name: Filter orders by lifecycle state
    description:
      text: |-
        "All orders", "Not traveled", "Pending payment", and "Pending review" filter "Order list" by the lifecycle states stated in these requirements. All orders shows every order with its flight, total, and status; the pending entry offers Pay now.
      image:
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.2-01
      name: Filter pending payment
      steps:
      - id: STEP-REQ-4.2-01-01
        Given: >-
          A customer signs in and opens Orders with the three bookings described in Inspect and cancel orders.
        When: >-
          Select Pending payment.
        Then: >-
          Exactly CTRIP20260721001 remains with Pending payment and Pay now; the other two orders are excluded.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
    - id: SCN-REQ-4.2-02
      name: Filter not traveled
      steps:
      - id: STEP-REQ-4.2-02-01
        Given: >-
          A customer signs in and opens Orders with the three bookings described in Inspect and cancel orders.
        When: >-
          Select Not traveled.
        Then: >-
          Exactly CTRIP20260722002 remains with Not traveled; the pending-payment and pending-review orders are excluded.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
    - id: SCN-REQ-4.2-03
      name: Filter pending review
      steps:
      - id: STEP-REQ-4.2-03-01
        Given: >-
          A customer signs in and opens Orders with the three bookings described in Inspect and cancel orders.
        When: >-
          Select Pending review.
        Then: >-
          Exactly CTRIP20260718003 remains with Pending review; the other two orders are excluded.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
    - id: SCN-REQ-4.2-04
      name: Show all account orders
      steps:
      - id: STEP-REQ-4.2-04-01
        Given: >-
          A customer signs in and opens Orders with the three bookings described in Inspect and cancel orders.
        When: >-
          Select All orders.
        Then: >-
          Exactly the three owned orders appear with their corresponding JD5162/¥530, CZ3401/¥390 and MU5234/¥650
          flight/total values and the stated lifecycle statuses.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
    children: []
  - id: REQ-4.3
    name: Search order by business number
    description:
      text: |-
        Entering CTRIP20260721001 in "Order number" and clicking "Search orders" filters "Order list" to that account-owned JD5162 order only.
      image:
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.3-01
      name: Find exact order number
      steps:
      - id: STEP-REQ-4.3-01-01
        Given: >-
          A customer signs in and opens Orders with the three bookings described in Inspect and cancel orders.
        When: >-
          Enter CTRIP20260721001 in Order number and click Search orders.
        Then: >-
          Exactly that JD5162 record remains; CTRIP20260722002 and CTRIP20260718003 are excluded.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
    children: []
  - id: REQ-4.4
    name: Inspect identified order details
    description:
      text: |-
        View details opens the unpaid booking and shows its order number, "Flight itinerary" showing JD5162 and Chengdu–Guangzhou, and Refund and change rules. "Payment status" displays Pending payment, a decreasing Time remaining timer, expiry reminder, Pay now, and Cancel order.
      image:
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
      - id: IMG-ORDER2
        reference: reference/order2.png
        page: order_details
    scenarios:
    - id: SCN-REQ-4.4-01
      name: Inspect unpaid itinerary and payment countdown
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: >-
          A signed-in customer has just submitted an unpaid JD5162 booking from Chengdu to Guangzhou and opened its
          Order details.
        When: >-
          Inspect Order details, Flight itinerary and Payment status; record Time remaining and check it again after time
          has elapsed.
        Then: >-
          The order number, JD5162 and Chengdu to Guangzhou are visible; itinerary offers Refund and change rules; Payment
          status displays Pending payment, expiry reminder, Pay now and Cancel order, and its positive Time remaining
          decreases.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
        - \ref[image](IMG-ORDER2)
    - id: SCN-REQ-4.4-02
      name: Read refund and change conditions
      steps:
      - id: STEP-REQ-4.4-02-01
        Given: >-
          A signed-in customer has just submitted an unpaid JD5162 booking from Chengdu to Guangzhou and opened its
          Order details.
        When: >-
          Click Refund and change rules within Flight itinerary.
        Then: >-
          Flight itinerary displays Refund fee: ¥100 and Changes allowed before departure.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-ORDER1)
        - \ref[image](IMG-ORDER2)
    children: []
  - id: REQ-4.5
    name: Cancel an unpaid order after confirmation
    description:
      text: |-
        A customer can cancel an unpaid order after submitting it. Cancel order in Payment status opens a confirmation dialog. Confirm cancellation closes the selected order, and its Closed status persists after reload.
      image:
      - id: IMG-ORDER2
        reference: reference/order2.png
        page: order_details
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.5-01
      name: Confirm unpaid order cancellation
      steps:
      - id: STEP-REQ-4.5-01-01
        Given: >-
          A signed-in customer has submitted an unpaid booking for JD5162 and opened that order from Orders. Its payment
          status is Pending payment.
        When: >-
          Click Cancel order within Payment status, then Confirm cancellation within Cancel order dialog; reload.
        Then: >-
          The same order number shows Closed in Payment status before and after reload.
        references:
        - \ref[requirement](REQ-4.4)
        - \ref[image](IMG-ORDER2)
        - \ref[image](IMG-ORDER1)
    children: []
  - id: REQ-4.6
    name: Keep an unpaid order when cancellation is declined
    description:
      text: |-
        In "Cancel order", "Keep order" dismisses the confirmation and leaves the same order pending, with Pay now still available. Cancel order closes the order only after confirmation.
      image:
      - id: IMG-ORDER2
        reference: reference/order2.png
        page: order_details
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.6-01
      name: Keep an unpaid order when cancellation is declined
      steps:
      - id: STEP-REQ-4.6-01-01
        Given: >-
          The user has opened a recently submitted order awaiting payment.
        When: >-
          Click Cancel order in Payment status, then Keep order within the dialog.
        Then: >-
          The dialog closes. The same order is still Pending payment and Pay now remains available.
        references:
        - \ref[requirement](REQ-4.4)
        - \ref[image](IMG-ORDER2)
        - \ref[image](IMG-ORDER1)
    children: []
  - id: REQ-4.7
    name: Keep order lists scoped to the current account
    description:
      text: |-
        Selecting "All orders" shows only the signed-in account's orders in "Order list". A customer with no orders sees an empty list.
      image:
      - id: IMG-ORDER1
        reference: reference/order1.png
        page: orders
    scenarios:
    - id: SCN-REQ-4.7-01
      name: Keep order lists scoped to the current account
      steps:
      - id: STEP-REQ-4.7-01-01
        Given: >-
          A signed-in customer with no orders has opened Orders. Another customer just submitted a booking, and other
          customers have existing orders.
        When: >-
          Select All orders.
        Then: >-
          The order list is empty and does not expose orders from other accounts.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-ORDER1)
    children: []
- id: REQ-5
  name: Manage reusable booking information
  description:
    text: |-
      In Personal center, the Common information sidebar expands and collapses to show Travelers, Contacts, Invoice titles and Addresses. Customers can add and manage their saved information. Each saved item appears once in its category and belongs to the signed-in account. Actions and selection apply to the corresponding item. Users can edit travelers, view address details and keep a traveler when declining deletion.
    image:
    - id: IMG-ENTER-SELF
      reference: reference/enter_self.png
      page: home
    - id: IMG-PASSENGER
      reference: reference/passenger.png
      page: travelers
    - id: IMG-ADDRESS
      reference: reference/address.png
      page: addresses
    - id: IMG-ADDRESSSHOW
      reference: reference/addressShow.png
      page: address_details
    - id: IMG-CONTACT
      reference: reference/contact.png
      page: contacts
    - id: IMG-REIMBURSEMENT
      reference: reference/reimbursement.png
      page: invoice_titles
  scenarios: []
  children:
  - id: REQ-5.1
    name: Open personal center and reusable information
    description:
      text: |-
        "My account" exposes Personal center. Opening it displays Personal center heading and "Common information", which toggles exactly four reusable-information links from an initially collapsed state.

        Common information expands and collapses the Travelers, Contacts, Invoice titles, and Addresses links. Saved records belong to the signed-in account.
      image:
      - id: IMG-ENTER-SELF
        reference: reference/enter_self.png
        page: home
      - id: IMG-MYINFO
        reference: reference/myinfo.png
        page: profile
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Open personal center
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: >-
          A customer has signed in and accepted the terms.
        When: >-
          Click My account, inspect the menu, then activate Personal center.
        Then: >-
          The menu offers Personal center; its heading opens with Common information available.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-ENTER-SELF)
        - \ref[image](IMG-MYINFO)
    - id: SCN-REQ-5.1-02
      name: Expand and collapse reusable information navigation
      steps:
      - id: STEP-REQ-5.1-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. Common
          information starts collapsed.
        When: >-
          Click Common information, inspect its links, then click it again.
        Then: >-
          Travelers, Contacts, Invoice titles and Addresses become visible; collapsing hides all four links.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-ENTER-SELF)
        - \ref[image](IMG-MYINFO)
    children: []
  - id: REQ-5.2
    name: Search saved travelers
    description:
      text: |-
        Entering a name in "Traveler name" and clicking "Search travelers" filters "Traveler list". For example, entering Li Si returns that saved traveler. A nonmatching query shows No travelers found and no records.
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Find matching traveler
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: >-
          The signed-in customer has saved a traveler such as Li Si and opened Travelers under Common information.
        When: >-
          Enter Li Si in Traveler name and click Search travelers.
        Then: >-
          Traveler list contains exactly the Li Si record.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-PASSENGER)
    - id: SCN-REQ-5.2-02
      name: Show traveler search empty state
      steps:
      - id: STEP-REQ-5.2-02-01
        Given: >-
          The signed-in customer has saved a traveler such as Li Si and opened Travelers under Common information.
        When: >-
          Enter Nobody Example in Traveler name and click Search travelers.
        Then: >-
          Traveler list contains no records and displays No travelers found.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-PASSENGER)
    children: []
  - id: REQ-5.3
    name: Save a reusable traveler
    description:
      text: |-
        Add traveler opens "Add traveler" with "Full name", "ID number", and "Save traveler". Saving a traveler, for example Wang Wu, with a valid ID adds that owner-specific traveler to "Traveler list", displaying masked 110101********1237 and persisting after reload. Empty name shows Enter a full name within the form, keeps it open, and creates no record.
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
      - id: IMG-ADDPASSENGER
        reference: reference/addpassenger.png
        page: traveler_form
    scenarios:
    - id: SCN-REQ-5.3-01
      name: Save traveler and retain masked identity
      steps:
      - id: STEP-REQ-5.3-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer starts with an empty
          Traveler list; the Wang Wu name and ID 110101199001011237 are available.
        When: >-
          Open Common information → Travelers, click Add traveler, enter the Wang Wu name and ID 110101199001011237, click
          Save traveler, then reload.
        Then: >-
          Exactly one traveler is added with the submitted name and masked ID 110101********1237; the same name and masked
          identity remain after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-PASSENGER)
        - \ref[image](IMG-ADDPASSENGER)
    - id: SCN-REQ-5.3-02
      name: Reject traveler without full name
      steps:
      - id: STEP-REQ-5.3-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has opened Travelers; the
          current record count is recorded.
        When: >-
          Click Add traveler, leave Full name empty and click Save traveler.
        Then: >-
          Enter a full name appears within Add traveler; the form remains open and Traveler list count is unchanged.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-PASSENGER)
        - \ref[image](IMG-ADDPASSENGER)
    children: []
  - id: REQ-5.4
    name: Read saved mailing address
    description:
      text: |-
        The address list shows the recipient and saved delivery location. For example, Zhang San’s entry shows Shanghai, Pudong New Area, and No. 100 Century Avenue.
      image:
      - id: IMG-ADDRESS
        reference: reference/address.png
        page: addresses
    scenarios:
    - id: SCN-REQ-5.4-01
      name: Read recipient and delivery location
      steps:
      - id: STEP-REQ-5.4-01-01
        Given: >-
          The customer has saved one address. For example, Zhang San lives at No. 100 Century Avenue, Pudong New Area,
          Shanghai. The customer opens Addresses.
        When: >-
          Inspect Address list.
        Then: >-
          Exactly one Zhang San record displays the saved city, district and street.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-ADDRESS)
    children: []
  - id: REQ-5.5
    name: Save a mailing address
    description:
      text: |-
        "Add address" collects "Recipient", "City", "District", "Street address", and "Mobile number". "Save address" stores the current account's submitted address in "Address list", accepting Shanghai, Pudong New Area, No. 100 Century Avenue, and 13800000027. The saved address persists after reload.
      image:
      - id: IMG-ADDRESS
        reference: reference/address.png
        page: addresses
      - id: IMG-ADDADDRESS
        reference: reference/addaddress.png
        page: address_form
    scenarios:
    - id: SCN-REQ-5.5-01
      name: Save recipient delivery address
      steps:
      - id: STEP-REQ-5.5-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer starts with an empty Address
          list; use an Wang Wu recipient name.
        When: >-
          Open Addresses; click Add address, enter the Recipient, City Shanghai, District Pudong New Area, Street address
          No. 100 Century Avenue and Mobile number 13800000027, click Save address and reload.
        Then: >-
          Exactly one record displays the submitted recipient and location; the saved record and address values remain after
          reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-ADDRESS)
        - \ref[image](IMG-ADDADDRESS)
    children: []
  - id: REQ-5.6
    name: Search notification contacts
    description:
      text: |-
        Search contacts filters the contact list by name. For example, a customer who has saved Zhang San can search for Zhang San to find that contact.
      image:
      - id: IMG-CONTACT
        reference: reference/contact.png
        page: contacts
    scenarios:
    - id: SCN-REQ-5.6-01
      name: Search a saved contact by name
      steps:
      - id: STEP-REQ-5.6-01-01
        Given: >-
          The signed-in customer has saved a contact named Zhang San and opened Contacts.
        When: >-
          Enter Zhang San in Contact name and click Search contacts.
        Then: >-
          Contact list contains exactly the Zhang San record.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-CONTACT)
    children: []
  - id: REQ-5.7
    name: Save a default notification contact
    description:
      text: |-
        "Add contact" collects "Contact name", "Mobile number", and "Email", with "Default contact". "Save contact" creates an account-owned entry in "Contact list" showing the submitted values and Default state, persisting after reload.
      image:
      - id: IMG-CONTACT
        reference: reference/contact.png
        page: contacts
      - id: IMG-ADD-CONTACT
        reference: reference/add_contact.png
        page: contact_form
    scenarios:
    - id: SCN-REQ-5.7-01
      name: Save contact with default designation
      steps:
      - id: STEP-REQ-5.7-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer starts with an empty Contact
          list; use an Wang Wu name.
        When: >-
          Open Contacts, click Add contact, enter Contact name as the Wang Wu, Mobile number 13800000017 and Email
          wang.wu@example.com, check Default contact and click Save contact; reload.
        Then: >-
          Exactly one saved record shows the name, mobile, email and Default; the same values and default designation remain
          after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-CONTACT)
        - \ref[image](IMG-ADD-CONTACT)
    children: []
  - id: REQ-5.8
    name: Search invoice titles
    description:
      text: |-
        Entering Shanghai Example in "Search invoice titles" and clicking "Search" filters "Invoice title list" to the matching company title with taxpayer ID 91310000123456789A.

      image:
      - id: IMG-REIMBURSEMENT
        reference: reference/reimbursement.png
        page: invoice_titles
    scenarios:
    - id: SCN-REQ-5.8-01
      name: Find company title by keyword
      steps:
      - id: STEP-REQ-5.8-01-01
        Given: >-
          The customer has saved a company invoice title, such as Shanghai Example Technology Co., Ltd. with taxpayer ID
          91310000123456789A, and opened Invoice titles.
        When: >-
          Enter Shanghai Example in Search invoice titles and click Search.
        Then: >-
          Exactly that company record remains with taxpayer ID 91310000123456789A.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-REIMBURSEMENT)
    children: []
  - id: REQ-5.9
    name: Save company invoice title
    description:
      text: |-
        Opening "Add invoice title" provides "Type" with Company, "Invoice title", required company "Taxpayer ID", and "Save". Saving a company name such as Shanghai Create Technology Co., Ltd. with a taxpayer ID such as 91310000123456789B adds a persistent current-account record to "Invoice title list". "Special VAT invoice" exposes the fields Registered address, Registered phone, Bank name, and Bank account.

      image:
      - id: IMG-REIMBURSEMENT
        reference: reference/reimbursement.png
        page: invoice_titles
      - id: IMG-ADD-REIMBURSEMENT
        reference: reference/add_reimbursement.png
        page: invoice_title_form
    scenarios:
    - id: SCN-REQ-5.9-01
      name: Save company title and taxpayer identity
      steps:
      - id: STEP-REQ-5.9-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer starts with an empty Invoice
          title list; use an Shanghai Create Technology Co., Ltd. title.
        When: >-
          Open Invoice titles, click Add invoice title, select Type Company, enter the Invoice title and Taxpayer ID
          91310000123456789B, click Save and reload.
        Then: >-
          Exactly one record displays the submitted title and taxpayer ID; both remain after reload.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-REIMBURSEMENT)
        - \ref[image](IMG-ADD-REIMBURSEMENT)
    - id: SCN-REQ-5.9-02
      name: Reveal special VAT fields
      steps:
      - id: STEP-REQ-5.9-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has opened Invoice titles.
        When: >-
          Click Add invoice title and check Special VAT invoice within its region.
        Then: >-
          Registered address, Registered phone, Bank name and Bank account fields become visible.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-REIMBURSEMENT)
        - \ref[image](IMG-ADD-REIMBURSEMENT)
    - id: SCN-REQ-5.9-03
      name: Require company taxpayer ID
      steps:
      - id: STEP-REQ-5.9-03-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has opened Invoice titles
          and its current list count is recorded.
        When: >-
          Click Add invoice title, select Type Company, enter an Missing tax ID title, leave Taxpayer ID empty and click
          Save.
        Then: >-
          The form remains visible, the list count is unchanged and no record with the submitted title is created.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-REIMBURSEMENT)
        - \ref[image](IMG-ADD-REIMBURSEMENT)
    children: []
  - id: REQ-5.10
    name: Remove saved traveler records
    description:
      text: |-
        In "Traveler list", "Delete" for an identified record opens "Delete traveler", where Confirm deletion removes only that traveler. Selecting records through "{business identity}" choices and clicking "Delete selected" opens "Delete travelers"; Confirm deletion removes only selected travelers. Removal persists,.
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
    scenarios:
    - id: SCN-REQ-5.10-01
      name: Delete one traveler after confirmation
      steps:
      - id: STEP-REQ-5.10-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Traveler Delete
          A/110101199001011237 and Traveler Keep A/110101199001021232. Use Common information → Travelers; create each
          stated traveler with Add traveler, Full name, its stated ID number and Save traveler.
        When: >-
          Click Delete within Traveler Delete A, verify that record remains while Delete traveler dialog is open, click
          Confirm deletion and reload.
        Then: >-
          Only Traveler Delete A disappears; Traveler Keep A remains before and after reload.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-PASSENGER)
    - id: SCN-REQ-5.10-02
      name: Delete only selected traveler records
      steps:
      - id: STEP-REQ-5.10-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Traveler Batch
          A/110101199001011237, Traveler Batch B/110101199001021232 and Traveler Keep/110101199001031238. Use Common
          information → Travelers; create each stated traveler with Add traveler, Full name, its stated ID number and Save
          traveler.
        When: >-
          Check the named Traveler Batch A and Traveler Batch B checkboxes in Traveler list, leave Traveler Keep unselected,
          click Delete selected and Confirm deletion within Delete travelers; reload.
        Then: >-
          Both selected records disappear, while Traveler Keep remains before and after reload.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-PASSENGER)
    children: []
  - id: REQ-5.11
    name: Remove saved address records
    description:
      text: |-
        In "Address list", "Delete" for an identified record opens "Delete address"; Confirm deletion removes only that address. "{business identity}" selections with "Delete selected" expose "Delete addresses" and "Delete addresses"; confirmation removes only selected entries. Removal persists, and targets are created through UI add/save.
      image:
      - id: IMG-ADDRESS
        reference: reference/address.png
        page: addresses
    scenarios:
    - id: SCN-REQ-5.11-01
      name: Delete one address after confirmation
      steps:
      - id: STEP-REQ-5.11-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Address Delete A
          and Address Keep A. Use Common information → Addresses; create each stated address with Add address, Recipient set
          to its name, City Shanghai, District Pudong New Area, Street address No. 100 Century Avenue, Mobile number
          13800000027 and Save address.
        When: >-
          Click Delete within Address Delete A, verify the record remains while Delete address dialog is open, click Confirm
          deletion and reload.
        Then: >-
          Only Address Delete A disappears; Address Keep A remains before and after reload.
        references:
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-ADDRESS)
    - id: SCN-REQ-5.11-02
      name: Delete only selected address records
      steps:
      - id: STEP-REQ-5.11-02-01
        Given: >-
          The customer is signed in and has opened My account → Personal center. The customer has saved Address Batch A,
          Address Batch B and Address Keep. Use Common information → Addresses; create each stated address with Add address,
          Recipient set to its name, City Shanghai, District Pudong New Area, Street address No. 100 Century Avenue, Mobile
          number 13800000027 and Save address.
        When: >-
          Check Address Batch A and Address Batch B in Address list, leave Address Keep unselected, click Delete selected
