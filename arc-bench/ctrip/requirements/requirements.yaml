id: ROOT
name: Ctrip travel services
description:
  text: |-
    A travel services application for account access, flight search and booking, order management, reusable traveler information, flight status, vouchers, and airport guidance.

    Dates, voucher eligibility and public countdowns use Asia/Shanghai and the shared application/evaluator clock 2026-07-19T08:00:00+08:00.

    Sessions, current search criteria, booking selections and status-search history are established by public UI behavior within each scenario, never injected into storage.
scenarios: []
children:
- id: REQ-1
  name: Account access
  description:
    text: |-
      Visitors can enter password or verification-code login and register through agreement, phone verification and password setup. Legal acceptance is required. Logout removes the session.

      Global navigation is a single navigation landmark named Global navigation. Fields have associated labels. Actions described only as controls may be buttons or links; explicit tabs, radios, checkboxes, dialogs and fields retain their declared semantics. Verification delivery is simulated and codes are valid only after being sent in the current attempt. Password strength is a named region.

      For simulated verification delivery: Code becomes valid after Send code. Source 13800000044..47 are example new phones, replaced by deterministic isolated phones; never pre-create their accounts.

      For phone accounts: Created by registration UI, isolated deterministic phone per test.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Enter the travel application
    description:
      text: |-
        Signed-out entry displays exactly one Ctrip Travel heading and one Log in and Register link in Global navigation, alongside a search box and quick-flight form containing "Origin"(role=textbox) and "Destination"(role=textbox).

        Global navigation is a single navigation landmark named "Global navigation". Fields have associated labels. Actions described only as controls may be buttons or links; explicitly declared tabs, radios, checkboxes, dialogs and fields retain their semantics.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show signed-out entry
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Inspect the initial homepage.
        Then: Exactly one Ctrip Travel heading and one Log in and Register link in Global navigation are visible,
          together with the searchbox and Origin and Destination fields.
        references:
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.2
    name: Open and switch login methods
    description:
      text: |-
        Log in navigation opens the password form with Log in heading and "Account"(role=textbox) and "Password"(role=textbox). "Verification code login"(role=link) switches to "Mobile number"(role=textbox) and "Verification code"(role=textbox); "Password login"(role=link) switches back freely.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Open password login
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Activate Log in within Global navigation.
        Then: Log in heading, Account and Password fields are visible.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-LOGIN2)
    - id: SCN-REQ-1.2-02
      name: Switch login modes
      steps:
      - id: STEP-REQ-1.2-02-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Log in has been opened from Global navigation; Agree to terms initially is unchecked.
        When: Activate Verification code login, inspect the form, then activate Password login.
        Then: SMS mode shows Mobile number and Verification code; switching back shows Account and Password.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-LOGIN2)
    children: []
  - id: REQ-1.3
    name: Authenticate with password
    description:
      text: |-
        Users enter a verified mobile, username, or email in "Account"(role=textbox), enter "Password"(role=textbox), select the initially unchecked "Agree to terms"(role=checkbox), and click "Log in"(role=button). Agreement is required. Missing credentials or incorrect credentials show the specified alert without signing in; success returns home and replaces the login entry with "My account"(role=button).

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.3-01
      name: Authenticate by email
      steps:
      - id: STEP-REQ-1.3-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. ctrip_user@example.com is the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-02
      name: Authenticate by username
      steps:
      - id: STEP-REQ-1.3-02-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. ctrip_user identifies the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-03
      name: Authenticate by mobile
      steps:
      - id: STEP-REQ-1.3-03-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. 13800000010 belongs to the verified user account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account 13800000010 and Password Travel1234, check Agree to terms and click Log in.
        Then: Ctrip Travel homepage opens, My account is visible and the signed-out Log in navigation link disappears.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-04
      name: Reject missing account
      steps:
      - id: STEP-REQ-1.3-04-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Log in has been opened from Global navigation; Agree to terms initially is unchecked.
        When: Leave Account empty, enter Password Travel1234, check Agree to terms and click Log in.
        Then: Enter your account alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-05
      name: Reject missing password
      steps:
      - id: STEP-REQ-1.3-05-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com, leave Password empty, check Agree to terms and click Log in.
        Then: Enter your password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-06
      name: Reject incorrect password
      steps:
      - id: STEP-REQ-1.3-06-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password WrongPass123, check Agree to terms and click Log
          in.
        Then: Incorrect account or password alert appears, Account remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.3-07
      name: Require legal acceptance
      steps:
      - id: STEP-REQ-1.3-07-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"user": {"email": "ctrip_user@example.com", "password": "Travel1234", "username": "ctrip_user", "mobile": "13800000010"}}
        When: Enter Account ctrip_user@example.com and Password Travel1234, leave Agree to terms unchecked and click
          Log in.
        Then: Agree to terms first alert appears, the login form remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.4
    name: Authenticate with SMS verification
    description:
      text: |-
        SMS login defaults to +86 and provides "Mobile number"(role=textbox), "Verification code"(role=textbox), and "Send code"(role=button), which becomes "Resend code"(role=button). With a sent code 123456 and "Agree to terms"(role=checkbox) selected, "Log in"(role=button) authenticates and displays "My account"(role=button). Missing mobile or code, an incorrect code, or absent agreement shows the declared alert and retains the signed-out form; required fields cannot substitute for each other.

        Verification delivery is simulated. A verification code is valid only after being sent in the current attempt.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Verification delivery is simulated. A code is valid only after Send code in the current verification attempt; knowing the fixed example code alone does not establish verification.
      image:
      - id: IMG-LOGIN2
        reference: reference/login2.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.4-01
      name: Authenticate with sent code
      steps:
      - id: STEP-REQ-1.4-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only after Send code. Mobile 13800000011 is an existing SMS account.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"13800000011": {"mobile": "13800000011", "verification_code": "123456"}}
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Mobile number 13800000011, click Send code, enter Verification code 123456, check Agree to terms
          and click Log in.
        Then: +86 is displayed, Send code changes to Resend code, and successful login opens Ctrip Travel with My
          account.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-02
      name: Reject sending without mobile
      steps:
      - id: STEP-REQ-1.4-02-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only after Send code.
          Seed prerequisites (prepared before this scenario):
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Leave Mobile number empty and click Send code.
        Then: Enter your mobile number alert appears and My account remains absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-03
      name: Reject empty verification code
      steps:
      - id: STEP-REQ-1.4-03-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only after Send code.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"13800000041": {"mobile": "13800000041", "verification_code": "123456"}}
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Mobile number 13800000041, click Send code, leave Verification code empty, check Agree to terms
          and click Log in.
        Then: Enter your verification code alert appears; Mobile number remains visible and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-04
      name: Reject incorrect verification code
      steps:
      - id: STEP-REQ-1.4-04-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only after Send code.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"13800000042": {"mobile": "13800000042", "verification_code": "123456"}}
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Mobile number 13800000042, click Send code, enter Verification code 000000, check Agree to terms
          and click Log in.
        Then: Incorrect verification code alert appears; the SMS form remains and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.4-05
      name: Require SMS legal acceptance
      steps:
      - id: STEP-REQ-1.4-05-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. Log in has been opened from Global navigation; Agree to terms initially is unchecked. Verification code login is selected and the simulated delivered code becomes valid only after Send code.
          Seed prerequisites (prepared before this scenario):
          - existing verified accounts: {"13800000043": {"mobile": "13800000043", "verification_code": "123456"}}
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Mobile number 13800000043, click Send code, enter Verification code 123456, leave Agree to terms
          unchecked and click Log in.
        Then: Agree to terms first alert appears; the SMS form remains and My account is absent.
        references:
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-LOGIN2)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.5
    name: Accept or decline registration agreements
    description:
      text: |-
        Register navigation displays Register heading and "Registration agreement and privacy policy"(role=dialog); "Free registration"(role=button) from password login opens the same agreement. The agreement remains accessible through "Registration agreement and privacy policy"(role=button). Agree and continue opens Verify mobile number with "Mobile number"(role=textbox) and "Verification code"(role=textbox), while Decline returns to the signed-out homepage without creating an account or displaying "My account"(role=button).

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-REGISTER1
        reference: reference/register1.png
        page: register
    scenarios:
    - id: SCN-REQ-1.5-01
      name: Open registration agreement
      steps:
      - id: STEP-REQ-1.5-01-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Activate Register in Global navigation.
        Then: Register heading and Registration agreement and privacy policy dialog appear with Agree and continue
          and Decline buttons.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    - id: SCN-REQ-1.5-02
      name: Accept from login registration entry
      steps:
      - id: STEP-REQ-1.5-02-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
          Log in has been opened from Global navigation; Agree to terms initially is unchecked.
        When: Activate Free registration, then click Agree and continue within the agreement dialog.
        Then: Verify mobile number heading and Mobile number and Verification code fields appear.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    - id: SCN-REQ-1.5-03
      name: Decline registration
      steps:
      - id: STEP-REQ-1.5-03-01
        Given: The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai.
        When: Activate Register, then click Decline within Registration agreement and privacy policy.
        Then: Ctrip Travel homepage returns with Log in; the agreement dialog closes and My account is absent.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[requirement](REQ-1.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-REGISTER1)
    children: []
  - id: REQ-1.6
    name: Verify a new mobile for registration
    description:
      text: |-
        After "Register"(role=link) opens "Registration agreement and privacy policy"(role=dialog), "Agree and continue"(role=button) advances to Verify mobile number. Users enter an unused isolated phone in "Mobile number"(role=textbox) and click "Send code"(role=button), enabling accepted code 123456 and changing the action to "Resend code"(role=button). Entering that code in "Verification code"(role=textbox) and clicking "Next, set password"(role=button) opens Set password with "Password"(role=textbox) and "Confirm password"(role=textbox).

        Verification delivery is simulated. A verification code is valid only after being sent in the current attempt.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.

        Verification delivery is simulated. A code is valid only after Send code in the current verification attempt; knowing the fixed example code alone does not establish verification.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
    scenarios:
    - id: SCN-REQ-1.6-01
      name: Advance after mobile verification
      steps:
      - id: STEP-REQ-1.6-01-01
        Given: |-
          The visitor is signed out on the homepage; the benchmark clock is 2026-07-19 08:00 Asia/Shanghai. An unused isolated phone is derived by the simulated verification delivery rule.
          Seed prerequisites (prepared before this scenario):
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Activate Register, Agree and continue, enter the isolated Mobile number, click Send code, enter 123456
          in Verification code and click Next, set password.
        Then: Resend code appears after sending, then Set password opens with Password and Confirm password fields.
        references:
        - \ref[requirement](REQ-1.5)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REGISTER2)
    children: []
  - id: REQ-1.7
    name: Create account with a valid password
    description:
      text: |-
        Users enter matching "Password"(role=textbox) and "Confirm password"(role=textbox) values containing both letters and numbers and at least eight characters, then click "Complete registration"(role=button). Success shows Registration successful and opens password login; invalid submissions display the exact scenario validation message and stay on Set password. The created mobile account must authenticate through "Account"(role=textbox), Password, "Agree to terms"(role=checkbox), and "Log in"(role=button), resulting in "My account"(role=button).

        Password strength is a named region.

        Global navigation is a navigation landmark named Global navigation. Fields have associated labels; explicitly named tabs, radios, checkboxes, dialogs and fields retain their stated roles.
      image:
      - id: IMG-REGISTER2
        reference: reference/register2.png
        page: register
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.7-01
      name: Complete registration and authenticate created account
      steps:
      - id: STEP-REQ-1.7-01-01
        Given: |-
          An unused mobile number is derived deterministically from the evaluator run, worker and scenario identity according to simulated verification delivery. From Register, accept Registration agreement and privacy policy using Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set password; Set password is now open.
          Seed prerequisites (prepared before this scenario):
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Travel1234 in both Password and Confirm password and click Complete registration; on the resulting
          login form enter the same isolated phone in Account and Travel1234 in Password, check Agree to terms and
          click Log in.
        Then: Registration successful status appears and password login opens; the newly created credentials authenticate
          and expose My account.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.7-02
      name: Reject mismatched passwords
      steps:
      - id: STEP-REQ-1.7-02-01
        Given: |-
          An unused mobile number is derived deterministically from the evaluator run, worker and scenario identity according to simulated verification delivery. From Register, accept Registration agreement and privacy policy using Agree and continue, enter that phone, click Send code, enter Verification code 123456 and click Next, set password; Set password is now open.
          Seed prerequisites (prepared before this scenario):
          - simulated verification delivery: {"country_code": "+86", "code": "123456", "registration_phone_rule": "139 + SHA-256(the automatically generated worker-run identifier + worker index + test title) interpreted as integer modulo 100000000, padded to 8 digits; evaluator must ensure scenario phone values are unique within the run."}
        When: Enter Password Travel1234 and Confirm password Travel5678 and click Complete registration.
        Then: Passwords do not match alert appears, Set password remains open and My account is absent.
        references:
        - \ref[requirement](REQ-1.6)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-REGISTER2)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-1.7-03
      name: Reject weak password
      steps:
