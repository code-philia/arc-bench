- id: REQ-6
  name: Manage profile and account security
  description:
    text: |-
      Personal center exposes My information and Account security. The profile masks sensitive fields. Password changes verify the current credentials and require sign-in again on success. Phone and email binding begin with staged identity verification. A verification code is accepted only after it has been sent in the current attempt. Existing verified accounts can have saved profile details, an email address or a bound phone.
    image:
    - id: IMG-MYINFO
      reference: reference/myinfo.png
      page: profile
    - id: IMG-MODIFYINFO
      reference: reference/modifyinfo.png
      page: profile
    - id: IMG-SAFECENTER
      reference: reference/safecenter.png
      page: account_security
  scenarios: []
  children:
  - id: REQ-6.1
    name: Read masked personal profile
    description:
      text: |-
        My information shows saved profile values and masks the mobile number and email address. For example, Li Ming’s profile shows 138****0013, c***@example.com, Profile Reader, Male, and 1990-01-01.

        The current email and mobile number are masked when shown.
      image:
      - id: IMG-MYINFO
        reference: reference/myinfo.png
        page: profile
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Read personal information with masking
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: >-
          The customer signs in to an account with a verified email address and bound mobile, then saves a nickname, real
          name, gender and date of birth in My information.
        When: >-
          Activate My information.
        Then: >-
          The profile displays the saved personal details and masks the contact values. For example, a profile can show
          138****0013, c***@example.com, Profile Reader, Li Ming, Male and 1990-01-01.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-MYINFO)
    children: []
  - id: REQ-6.2
    name: Save personal profile changes
    description:
      text: |-
        Under "My information", the customer clicks "Edit" to open "Nickname", "Real name", "Gender" with Female, and "Date of birth". "Save" persists submitted edits and displays the updated values.
      image:
      - id: IMG-MODIFYINFO
        reference: reference/modifyinfo.png
        page: profile
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Persist edited profile fields
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: >-
          The customer is signed in and has opened My account → Personal center.
        When: >-
          Open My information and Edit; enter Nickname Profile Editor, Real name Wang Lin, Gender Female and Date of birth
          1992-05-16, click Save and reload.
        Then: >-
          All four submitted values are visible before and after reload.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-MODIFYINFO)
    children: []
  - id: REQ-6.3
    name: Inspect account security settings
    description:
      text: |-
        Account security displays sections for Login password, Bound phone, and Bound email with Change your password regularly. Each setting has a Change action for that setting.
      image:
      - id: IMG-MYINFO
        reference: reference/myinfo.png
        page: profile
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
    scenarios:
    - id: SCN-REQ-6.3-01
      name: Inspect security settings and reminder
      steps:
      - id: STEP-REQ-6.3-01-01
        Given: >-
          A customer with a registered mobile account has signed in and opened My account → Personal center → Account security.
        When: >-
          Inspect Login password, Bound phone and Bound email.
        Then: >-
          Each setting offers its own Change action, and Change your password regularly is visible.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-MYINFO)
        - \ref[image](IMG-SAFECENTER)
    children: []
  - id: REQ-6.4
    name: Change login password using current password
    description:
      text: |-
        Change within "Login password" opens "Current password", "New password", "Confirm new password", and "Complete". Entering Travel1234 and matching NewTravel1234! shows Strong in "Password strength"; completion changes the password and requires Sign in again. Using "Account", "Password", "Agree to terms", and "Log in", the new password reaches "My account", while the old password no longer authenticates.
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYPASSWORD
        reference: reference/modifypassword.png
        page: change_password
      - id: IMG-LOGIN1
        reference: reference/login1.png
        page: login
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-6.4-01
      name: Replace password and require reauthentication
      steps:
      - id: STEP-REQ-6.4-01-01
        Given: >-
          A customer has registered with a mobile number and password, signed in and opened My account → Personal center →
          Account security.
        When: >-
          Click Change within Login password; enter Current password Travel1234, New password NewTravel1234! and the same
          Confirm new password; inspect strength and click Complete. Return to Log in, try the old password with accepted
          terms, then submit the new password.
        Then: >-
          Password strength displays Strong and completion says Sign in again; the old password shows Incorrect account or
          password, while NewTravel1234! authenticates and exposes My account.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYPASSWORD)
        - \ref[image](IMG-LOGIN1)
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-6.5
    name: Verify identity before changing bound phone
    description:
      text: |-
        Change within "Bound phone" opens Verify identity with "Login password" and "New phone". Travel1234 and 13900000018 followed by "Next, verify new phone" opens Verify new phone with "Verification code" and Code sent to 13900000018.
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYPHONE
        reference: reference/modifyphone.png
        page: change_phone
    scenarios:
    - id: SCN-REQ-6.5-01
      name: Advance to new-phone verification
      steps:
      - id: STEP-REQ-6.5-01-01
        Given: >-
          A customer has registered and signed in with a mobile number, then opened My account → Personal center → Account security.
        When: >-
          Click Change within Bound phone, enter the current password and a new number such as 13900000018, then select
          Next, verify new phone.
        Then: >-
          Verify identity initially opens; successful verification opens Verify new phone with Verification code and Code
          sent to 13900000018.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYPHONE)
    children: []
  - id: REQ-6.6
    name: Verify current email before new-email step
    description:
      text: |-
        Change in "Bound email" shows c***@example.com. "Send verification code" enables accepted 123456; entering it in "Verification code" and clicking "Next, verify new email" exposes "New email".
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYEMAIL
        reference: reference/modifyemail.png
        page: change_email
    scenarios:
    - id: SCN-REQ-6.6-01
      name: Advance after current-email verification
      steps:
      - id: STEP-REQ-6.6-01-01
        Given: >-
          A customer with an existing verified email signs in and opens My account → Personal center → Account security.
        When: >-
          Click Change within Bound email, inspect masked c***@example.com, click Send verification code, enter 123456 and
          click Next, verify new email.
        Then: >-
          Current-email verification succeeds and New email becomes visible.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYEMAIL)
    children: []
  - id: REQ-6.7
    name: Reject a password change with an incorrect current password
    description:
      text: |-
        In "Login password", an incorrect "Current password" with otherwise valid matching "New password" and "Confirm new password" is rejected by "Complete". A visible alert retains the change form without Sign in again, and original credentials remain usable to reach "My account". Alert wording is unrestricted.
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYPASSWORD
        reference: reference/modifypassword.png
        page: change_password
    scenarios:
    - id: SCN-REQ-6.7-01
      name: Reject a password change with an incorrect current password
      steps:
      - id: STEP-REQ-6.7-01-01
        Given: >-
          A customer with a registered mobile account has signed in and opened My account → Personal center → Account security.
        When: >-
          Click Change within Login password; enter Current password WrongPass123 and matching NewTravel1234! replacement
          fields, then Complete. Return Home, use My account → Log out and sign in again with the original credentials.
        Then: >-
          The form shows an alert and retains Current password without Sign in again. The original password still authenticates
          the same account.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[requirement](REQ-1.8)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYPASSWORD)
    children: []
  - id: REQ-6.8
    name: Reject phone-change identity verification with wrong password
    description:
      text: |-
        In "Bound phone", entering WrongPass123 in "Login password" and 13900000018 in "New phone", then clicking "Next, verify new phone", shows a visible alert and retains Verify identity. Verify new phone and Code sent to 13900000018 do not appear, because failed identity verification cannot send the new-phone code.
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYPHONE
        reference: reference/modifyphone.png
        page: change_phone
    scenarios:
    - id: SCN-REQ-6.8-01
      name: Reject phone-change identity verification with wrong password
      steps:
      - id: STEP-REQ-6.8-01-01
        Given: >-
          A customer has registered and signed in with a mobile number, then opened My account → Personal center → Account security.
        When: >-
          Click Change in Bound phone, enter Login password WrongPass123 and New phone 13900000018 and click Next, verify
          new phone.
        Then: >-
          A visible alert retains Verify identity; Verify new phone and Code sent to 13900000018 are absent.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYPHONE)
    children: []
  - id: REQ-6.9
    name: Reject an incorrect current-email verification code
    description:
      text: |-
        Within "Bound email", "Send verification code" enables only accepted 123456. Entering 000000 in "Verification code" and clicking "Next, verify new email" shows a visible alert and retains current verification; "New email" remains unavailable. Alert wording is unrestricted.
      image:
      - id: IMG-SAFECENTER
        reference: reference/safecenter.png
        page: account_security
      - id: IMG-MODIFYEMAIL
        reference: reference/modifyemail.png
        page: change_email
    scenarios:
    - id: SCN-REQ-6.9-01
      name: Reject an incorrect current-email verification code
      steps:
      - id: STEP-REQ-6.9-01-01
        Given: >-
          A customer with an existing verified email signs in and opens My account → Personal center → Account security.
        When: >-
          Click Change in Bound email, click Send verification code, enter Verification code 000000 and click Next, verify
          new email.
        Then: >-
          A visible alert retains Verification code and New email remains unavailable.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-SAFECENTER)
        - \ref[image](IMG-MODIFYEMAIL)
    children: []
- id: REQ-7
  name: Query flight status and reuse history
  description:
    text: |-
      Under Flights, users can search Flight status by flight number or by route and date. The system supplies flight status observations. For example, two days from today JD5162 is scheduled from Chengdu to Guangzhou with check-in at H14-H25, gate B12 and carousel 6. On that date MU5234 is scheduled from Shanghai to Beijing, operated by China Eastern, departing 09:00 and arriving 11:30. Signed-in users can reuse or clear their own saved queries.
    image:
    - id: IMG-STATUS1
      reference: reference/status1.png
      page: flight_status
    - id: IMG-STATUS2
      reference: reference/status2.png
      page: flight_status
    - id: IMG-STATUS3
      reference: reference/status3.png
      page: flight_status
    - id: IMG-STATUS4
      reference: reference/status4.png
      page: flight_status
  scenarios: []
  children:
  - id: REQ-7.1
    name: Open flight status search
    description:
      text: |-
        "Flights" followed by "Flight status" opens Flight status heading and query choices "Flight number" and "Route".
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-STATUS1
        reference: reference/status1.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Open flight status service
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Flights and then Flight status.
        Then: >-
          Flight status opens with two choices, Flight number and Route.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-STATUS1)
    children: []
  - id: REQ-7.2
    name: Query exact flight dynamic details
    description:
      text: |-
        In number mode, users enter JD5162 in "Flight number", two days from today in "Departure date", and click "Search". "Flight details" shows the identified flight with Chengdu, Guangzhou, Scheduled, H14-H25, B12, and baggage carousel 6; a Baggage carousel label identifies what the number refers to.
      image:
      - id: IMG-STATUS1
        reference: reference/status1.png
        page: flight_status
      - id: IMG-STATUS4
        reference: reference/status4.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.2-01
      name: Show identified flight ground service details
      steps:
      - id: STEP-REQ-7.2-01-01
        Given: >-
          The visitor has opened Flights → Flight status; the system supplies observations for departure two days from today, including JD5162
          Chengdu–Guangzhou and MU5234 Shanghai–Beijing observations.
        When: >-
          Select Flight number, enter JD5162, fill Departure date two days from today and click Search.
        Then: >-
          Flight details identifies JD5162, Chengdu, Guangzhou, Scheduled, H14-H25 and B12; its Baggage carousel region
          displays 6.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-STATUS1)
        - \ref[image](IMG-STATUS4)
    children: []
  - id: REQ-7.3
    name: Query route flight status
    description:
      text: |-
        Choosing "Route" exposes "Origin", "Destination", and "Departure date". Shanghai–Beijing two days from today followed by "Search" displays exactly MU5234 in "Flight status results", with China Eastern, 09:00, 11:30, and Scheduled. "Swap cities" exchanges city values without running a query.
      image:
      - id: IMG-STATUS2
        reference: reference/status2.png
        page: flight_status
      - id: IMG-STATUS3
        reference: reference/status3.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.3-01
      name: Show matching route flight statuses
      steps:
      - id: STEP-REQ-7.3-01-01
        Given: >-
          The visitor has opened Flights → Flight status; the system supplies observations for departure two days from today, including JD5162
          Chengdu–Guangzhou and MU5234 Shanghai–Beijing observations.
        When: >-
          Select Route, enter Origin Shanghai, Destination Beijing and Departure date two days from today, then click
          Search.
        Then: >-
          Flight status results contains exactly MU5234 displaying Shanghai, Beijing, China Eastern, 09:00, 11:30 and
          Scheduled.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-STATUS2)
        - \ref[image](IMG-STATUS3)
    - id: SCN-REQ-7.3-02
      name: Exchange status route without running query
      steps:
      - id: STEP-REQ-7.3-02-01
        Given: >-
          The visitor has opened Flights → Flight status; the system supplies observations for departure two days from today, including JD5162
          Chengdu–Guangzhou and MU5234 Shanghai–Beijing observations. No status query has been submitted.
        When: >-
          Select Route, fill Origin Shanghai and Destination Beijing, then click Swap cities.
        Then: >-
          Origin becomes Beijing and Destination Shanghai; Flight status results is not displayed.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-STATUS2)
        - \ref[image](IMG-STATUS3)
    children: []
  - id: REQ-7.4
    name: Record and reuse status searches
    description:
      text: |-
        A completed query showing "Flight details" records its account-owned criteria in "Search history". Each flight-number-named history action reopens that flight and date. Returning through Flights and Flight status reveals saved history.
      image:
      - id: IMG-STATUS4
        reference: reference/status4.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.4-01
      name: Record and reuse a flight query
      steps:
      - id: STEP-REQ-7.4-01-01
        Given: >-
          A signed-in customer with no earlier status queries opens Flight status.
        When: >-
          Select Flight number, query JD5162 for two days from today through Search, reopen Flights → Flight status, then
          activate JD5162 in Search history.
        Then: >-
          Flight details reopens for JD5162, Chengdu and Guangzhou with the original departure date restored.
        references:
        - \ref[requirement](REQ-7.2)
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-STATUS4)
    children: []
  - id: REQ-7.5
    name: Clear recorded status history
    description:
      text: |-
        Clear history removes only the current account's records from "Search history", showing No search history. Removed entries stay absent after reopening or reload.
      image:
      - id: IMG-STATUS4
        reference: reference/status4.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.5-01
      name: Clear account search history
      steps:
      - id: STEP-REQ-7.5-01-01
        Given: >-
          A signed-in customer has queried MU5234 for departure two days from today and reopened Flight status. Search
          history shows MU5234.
        When: >-
          Click Clear history within Search history and reload.
        Then: >-
          MU5234 history action disappears and No search history is displayed, both before and after reload.
        references:
        - \ref[requirement](REQ-7.4)
        - \ref[image](IMG-STATUS4)
    children: []
  - id: REQ-7.6
    name: Switch flight-status query dimensions
    description:
      text: |-
        "Route" exposes "Origin", "Destination", and "Departure date", while hiding the flight number field. "Flight number" instead exposes number and date inputs without city fields. Switching dimensions alone performs no query and does not itself create "Flight status results" or "Flight details".
      image:
      - id: IMG-STATUS1
        reference: reference/status1.png
        page: flight_status
      - id: IMG-STATUS2
        reference: reference/status2.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.6-01
      name: Switch flight-status query dimensions
      steps:
      - id: STEP-REQ-7.6-01-01
        Given: >-
          The visitor has opened Flights → Flight status; the system supplies observations for departure two days from today, including JD5162
          Chengdu–Guangzhou and MU5234 Shanghai–Beijing observations. No query has been submitted.
        When: >-
          Select Route, inspect its fields, then select Flight number.
        Then: >-
          Route selects and shows Origin, Destination and Departure date while hiding the flight number field; Flight number
          selects and shows number/date while hiding both city fields; neither Flight status results nor Flight details is
          created by switching modes.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-STATUS1)
        - \ref[image](IMG-STATUS2)
    children: []
  - id: REQ-7.7
    name: Record and reuse a flight-status route query
    description:
      text: |-
        Selecting "Route", entering Shanghai and Beijing in "Origin" and "Destination", setting two days from today in "Departure date", and clicking "Search" displays "Flight status results" and records "Shanghai - Beijing" in "Search history". Activating that history action restores the route and date and reruns the route query rather than treating it as a flight number. Route history names follow Origin - Destination.
      image:
      - id: IMG-STATUS2
        reference: reference/status2.png
        page: flight_status
      - id: IMG-STATUS3
        reference: reference/status3.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.7-01
      name: Record and reuse a flight-status route query
      steps:
      - id: STEP-REQ-7.7-01-01
        Given: >-
          A signed-in customer with no previous flight-status queries has opened Flight status.
        When: >-
          Select Route, enter Shanghai, Beijing and two days from today and click Search; verify MU5234, reopen Flight
          status and activate Shanghai - Beijing within Search history.
        Then: >-
          The route query reruns with exactly MU5234 displaying Shanghai and Beijing; route fields and Departure date
          restore the same criteria.
        references:
        - \ref[requirement](REQ-7.3)
        - \ref[requirement](REQ-7.4)
        - \ref[image](IMG-STATUS2)
        - \ref[image](IMG-STATUS3)
    children: []
  - id: REQ-7.8
    name: Keep status search history private to its account
    description:
      text: |-
        Status search history is private to the signed-in account. Switching to an account with no search history shows an empty history without another account’s queries.
      image:
      - id: IMG-STATUS4
        reference: reference/status4.png
        page: flight_status
    scenarios:
    - id: SCN-REQ-7.8-01
      name: Keep status search history private to its account
      steps:
      - id: STEP-REQ-7.8-01-01
        Given: >-
          Two customers have separate accounts and initially empty status history.
        When: >-
          Sign into the first account, query JD5162 for departure two days from today and log out. Sign into the second
          account and open Flight status.
        Then: >-
          Search history has no JD5162 entry and displays No search history.
        references:
        - \ref[requirement](REQ-7.4)
        - \ref[requirement](REQ-1.8)
        - \ref[image](IMG-STATUS4)
    children: []
- id: REQ-8
  name: Inspect reimbursement vouchers capability
  description:
    text: |-
      Under More services, Reimbursement vouchers shows Pending, In progress, Completed, and the issuance rules. Pending lists eligible paid orders that do not have a voucher application. View more orders from the past year can reveal older eligible orders. The issuance window is 365 days from payment. The system supplies existing paid orders and previously issued vouchers for customers with past bookings. For example, one customer has a completed voucher for order CTRIP20260718004, another has order CTRIP20260721005 paid today and awaiting a voucher application, and another has order CTRIP20260514001 paid 66 days ago and eligible for a voucher. Each customer sees their own records.
  scenarios: []
  children:
  - id: REQ-8.1
    name: Open reimbursement service entry
    description:
      text: |-
        Open More services and follow Reimbursement vouchers. Pending, In progress, Completed, and Issuance rules are visible.
      image:
      - id: IMG-MORESERVICE
        reference: reference/moreservice.png
        page: home
      - id: IMG-REIMBURSEMENT2
        reference: reference/reimbursement2.png
        page: reimbursement_vouchers
    scenarios:
    - id: SCN-REQ-8.1-01
      name: Open reimbursement service entry
      steps:
      - id: STEP-REQ-8.1-01-01
        Given: >-
          The customer has registered a mobile account and signed in.
        When: >-
          Open More services and follow Reimbursement vouchers.
        Then: >-
          Pending, In progress, Completed, and Issuance rules are visible.
        references:
        - \ref[requirement](REQ-1.3)
        - \ref[image](IMG-MORESERVICE)
        - \ref[image](IMG-REIMBURSEMENT2)
    children: []
  - id: REQ-8.2
    name: View issued vouchers by lifecycle
    description:
      text: |-
        More services and Reimbursement vouchers expose Pending, In progress, and "Completed". Completed vouchers shows issued vouchers, for example the issued voucher for completed paid order CTRIP20260718004. "Issuance rules" communicates availability within 365 days of payment.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-REIMBURSEMENT2
        reference: reference/reimbursement2.png
        page: reimbursement_vouchers
    scenarios:
    - id: SCN-REQ-8.2-01
      name: Read completed voucher and issuance rules
      steps:
      - id: STEP-REQ-8.2-01-01
        Given: >-
          The customer is signed in and has opened More services → Reimbursement vouchers. The customer has a paid, traveled
          and issued CTRIP20260718004.
        When: >-
          Inspect Pending, In progress and Completed tabs and Issuance rules, then select Completed.
        Then: >-
          All three tabs are visible, Issuance rules mentions the 365-day window, and Completed vouchers contains exactly
          CTRIP20260718004.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REIMBURSEMENT2)
    children: []
  - id: REQ-8.3
    name: Find voucher-eligible paid orders
    description:
      text: |-
        Pending lists paid eligible orders without voucher applications. For example, an order paid today is eligible, and View more orders from the past year can reveal an eligible order paid 66 days ago. Customers without eligible entries see No vouchers available.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-REIMBURSEMENT2
        reference: reference/reimbursement2.png
        page: reimbursement_vouchers
    scenarios:
    - id: SCN-REQ-8.3-01
      name: Show currently eligible pending order
      steps:
      - id: STEP-REQ-8.3-01-01
        Given: >-
          The customer is signed in and has opened More services → Reimbursement vouchers. The customer has paid order
          CTRIP20260721005 with payment date today and no voucher application.
        When: >-
          Select Pending.
        Then: >-
          Pending vouchers contains exactly the eligible CTRIP20260721005 record.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[requirement](REQ-8.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REIMBURSEMENT2)
    - id: SCN-REQ-8.3-02
      name: Load older eligible order from past year
      steps:
      - id: STEP-REQ-8.3-02-01
        Given: >-
          The customer is signed in and has opened More services → Reimbursement vouchers. The customer has paid order
          CTRIP20260514001, paid 66 days ago and still without a voucher.
        When: >-
          Select Pending and activate View more orders from the past year.
        Then: >-
          Pending vouchers contains exactly CTRIP20260514001 and displays the payment date from 66 days ago.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[requirement](REQ-8.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REIMBURSEMENT2)
    - id: SCN-REQ-8.3-03
      name: Show empty pending voucher state
      steps:
      - id: STEP-REQ-8.3-03-01
        Given: >-
          The customer is signed in and has opened More services → Reimbursement vouchers. The customer has only an
          already completed voucher and has no eligible pending application.
        When: >-
          Select Pending.
        Then: >-
          Pending vouchers contains no records and displays No vouchers available.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[requirement](REQ-8.2)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REIMBURSEMENT2)
    children: []
  - id: REQ-8.4
    name: Keep eligible reimbursement orders scoped to account
    description:
      text: |-
        "Pending" displays only the current account's eligible paid orders in "Pending vouchers". A customer without orders sees no eligible vouchers; another owner's eligible order must not be offered.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-REIMBURSEMENT2
        reference: reference/reimbursement2.png
        page: reimbursement_vouchers
    scenarios:
    - id: SCN-REQ-8.4-01
      name: Keep eligible reimbursement orders scoped to account
      steps:
      - id: STEP-REQ-8.4-01-01
        Given: >-
          The customer is signed in and has opened More services → Reimbursement vouchers. The customer has no orders or
          vouchers; other accounts own eligible CTRIP20260721005 and CTRIP20260514001.
        When: >-
          Select Pending.
        Then: >-
          Pending vouchers contains no records, displays No vouchers available and exposes neither other account's order.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[requirement](REQ-8.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-REIMBURSEMENT2)
    children: []
- id: REQ-9
  name: Browse airport travel information
  description:
    text: |-
      Under Flights, More services opens the Airport guide. It shows popular airports, domestic and international/Hong Kong/Macau/Taiwan directories, a supplied weather snapshot and Boarding process. The system provides the airport directory, weather snapshot and service details. Airport details open to Overview and include Transportation and Phone numbers.
    image:
    - id: IMG-AIRPORT1
      reference: reference/airport1.png
      page: airport_guide
    - id: IMG-AIRPORT2
      reference: reference/airport2.png
      page: airport_details
    - id: IMG-AIRPORT3
      reference: reference/airport3.png
      page: airport_details
    - id: IMG-AIRPORT4
      reference: reference/airport4.png
      page: airport_details
    - id: IMG-AIRPORT5
      reference: reference/airport5.png
      page: airport_details
  scenarios: []
  children:
  - id: REQ-9.1
    name: Open airport information service
    description:
      text: |-
        Clicking "Flights", then "More services", then "Airport guide" opens Airport guide heading.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-AIRPORT1
        reference: reference/airport1.png
        page: airport_guide
    scenarios:
    - id: SCN-REQ-9.1-01
      name: Open airport guide
      steps:
      - id: STEP-REQ-9.1-01-01
        Given: >-
          The visitor is signed out on the homepage.
        When: >-
          Activate Flights, More services and Airport guide in sequence.
        Then: >-
          Airport guide heading is visible.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-AIRPORT1)
    children: []
  - id: REQ-9.2
    name: Browse airport indexes and weather
    description:
