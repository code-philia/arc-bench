        - \ref[image](IMG-ADDRESS)
    children: []
  - id: REQ-5.12
    name: Remove saved contact records
    description:
      text: |-
        Within "Contact list", "Delete" opens "Delete contact" for the identified contact; confirmation removes only it. Selecting the desired records and clicking "Delete selected" opens "Delete contacts", whose confirmation removes only selected contacts. Deletions persist after reload.
      image:
      - id: IMG-CONTACT
        reference: reference/contact.png
        page: contacts
    scenarios:
    - id: SCN-REQ-5.12-01
      name: Delete one contact after confirmation
      steps:
