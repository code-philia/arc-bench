  - id: REQ-5.16
    name: Find a traveler created in the current session
    description:
      text: |-
        After saving a traveler through UI, entering its exact chosen name in "Traveler name" and clicking "Search travelers" finds that same record and masked identity in "Traveler list".
      image:
      - id: IMG-PASSENGER
        reference: reference/passenger.png
        page: travelers
