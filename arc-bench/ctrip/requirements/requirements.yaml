        - \ref[image](IMG-AIRPORT1)
    - id: SCN-REQ-9.2-03
      name: Read city weather snapshot
      steps:
      - id: STEP-REQ-9.2-03-01
        Given: >-
          The visitor has opened Flights → More services → Airport guide; the supplied airport directory and weather
          snapshot are available.
        When: >-
          Inspect Today weather.
        Then: >-
          The supplied Beijing snapshot displays -5°C to 3°C and a Boarding process link.
        references:
        - \ref[requirement](REQ-9.1)
        - \ref[image](IMG-AIRPORT1)
    children: []
  - id: REQ-9.3
    name: Read an identified airport overview and services
    description:
      text: |-
        Opening Beijing Capital Airport defaults to selected "Overview", with "Airport overview" showing Beijing, three runways, and China's first national gateway. "Transportation" displays "City buses" with Fangzhuang line, Fangzhuang, 06:00, 21:00, and 30 minutes. "Phone numbers" shows the entry for Medical first aid center with 010-64541100.
      image:
