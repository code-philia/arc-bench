          mobile number; Region code defaults to (+86) and the old number masks its middle four digits. profile_user
          starts with 13800000030.
      - keyword: WHEN
        content: 'Leave new mobile number: and Confirm your password: empty and click Determine.'
      - keyword: THEN
        content: Please fill in the new mobile number and password. appears and the old (+86) 138****0030 remains displayed.
    - name: Reject wrong mobile password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Verify
          mobile number; Region code defaults to (+86) and the old number masks its middle four digits. profile_user
          starts with 13800000030.
      - keyword: WHEN
        content: 'Enter new mobile number: 13800000031 and Confirm your password: WrongPassword123!, then click Determine.'
      - keyword: THEN
        content: Incorrect password. appears and the old (+86) 138****0030 remains displayed.
    - name: Reject invalid mobile
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Verify
          mobile number; Region code defaults to (+86) and the old number masks its middle four digits. profile_user
          starts with 13800000030.
      - keyword: WHEN
        content: 'Enter new mobile number: 123 and Confirm your password: Password123!, then click Determine.'
