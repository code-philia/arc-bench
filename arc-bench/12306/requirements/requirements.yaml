  - id: REQ-8.2
    name: Select train and passengers on booking form capability
    description:
      text: Organize the page-entry and independent user behaviors for Select train and passengers on booking form.
        REQ-8.2.1 establishes the concrete reference pages first; the remaining siblings apply their explicitly
        preserved source contracts. This abstract capability has no page or executable UI of its own.
    scenarios: []
    children:
    - id: REQ-8.2.1
      name: Open selected-journey booking form
      description:
        text: |-
          Log in, search G1001 and activate its Book action. Train Information identifies G1001 and the booking form provides Place order.

          This requirement establishes the page entry and visible reference state before sibling behaviors. It does not implement their validation or state transitions. Every case establishes its own preconditions through the existing UI; tests do not depend on previous cases.

          Preserved presentation and source context:
          Provide a booking form after the user clicks "Book" in the G1001 result row.  The seeded account bookable_user has password "Password123!" and passenger "Passenger Example" with passport "P20269997"; the separately seeded account booking_submit_user has password "Password123!" and passenger "Passenger Example" with passport "P20269998". For 2026-07-21, the Shanghai-to-Beijing train G1001 offers one business-class seat at ￥1870.0, no first-class or second-class seats, and enough standing tickets at ￥576.0.

          After the user clicks one "Book" button for a valid train result, open the booking form page with a visible "Train Information" section heading.

          Display the booking information section with the title "Train Information:" and the selected train details, including departure place, destination, departure date, train number, seat type, price, current remaining ticket information such as "business-class seat ( ￥1870.0 ) 32% off 1 left", "first-class seat ( ￥967.0 ) 24% off None left", "second-class seat ( ￥576.0 ) 27% off None left", and "standing ticket ( ￥576.0 ) 27% off Enough left", and a visible "Place order" button on the booking form page.

          The "Passenger Information:" section exposes a checkbox named "Passenger Example" in its frequent passenger list. Selected passengers appear in the "Booking passengers" table with columns "Ticket class", "Ticket type", "Name", "ID type", "ID number", "Nationality", and "Operation". Each passenger row has a "Ticket class" combobox offering "Business-class seat", "First-class seat", "Second-class seat", and "Standing ticket", a "Ticket type" combobox offering "Adult" and "Child", and a "Delete" button. "Place order" remains available.

          Provide a link with the text "I have read and agree to the Terms of Service" on the booking form page and navigate to the terms page that contains the title "Terms of Service" after it is clicked.

          Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

          The selected-train information is a named region Train Information, containing the Train Information: heading and selected journey details. It is scoped by user-visible semantics, not DOM structure.

          Delete removes a selected passenger from the booking selection while retaining the frequent-passenger record. Ticket class and Ticket type reflect the selected options.
