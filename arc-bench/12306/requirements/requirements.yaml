      - REQ-5.1.1
      description: |-
        "Cancel"(role=button) on the identified unpaid order opens "Are you sure you want to cancel this order?"(role=dialog). "Confirm"(role=button) changes it to canceled without Pay and releases the seat for rebooking, under the parent capability's full cancellation rules.
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Confirm order-center cancellation
        steps:
        - keyword: GIVEN
          content: orders_cancel_center_user has created Passenger Example/P20269801 and confirmed an unpaid G1001 business-class
            order through UI; Uncompleted orders is open. Through UI, sign in with Password123!, create Passenger Example
            using Add new passengers with China, a distinct passport, expiration 2027-12-31, birth 2000-01-15, Female,
            Adult, passenger@example.com and 13800000040; search Shanghai–Beijing for the stated date, click Book on the
            stated train, check Passenger Example, select Business-class seat in that passenger row, click Place order
            and Confirm.
        - keyword: WHEN
          content: Click Cancel within G1001, click Confirm in Are you sure you want to cancel this order?, then repeat
            the same booking up to Place order.
        - keyword: THEN
          content: The dialog closes with Order cancelled successfully.; G1001 becomes Cancelled without Pay and rebooking
            reaches confirmation using the released seat.
    - id: REQ-8.8.2
      name: Dismiss cancellation from order center
      type: ATOMIC
      dependencies:
      - REQ-8.3.2.1
      - REQ-5.1.1
      description: |-
        The order row's "Cancel"(role=button) opens "Are you sure you want to cancel this order?"(role=dialog) with "Confirm"(role=button). Choosing the dialog's Cancel instead closes it without changing the order, which remains Unpaid with Pay available under the shared contract.
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Dismiss order-center cancellation
        steps:
        - keyword: GIVEN
          content: orders_unpaid_dismiss_user has created Passenger Example/P20269801 and confirmed an unpaid G1001 business-class
            order through UI; Uncompleted orders is open. Through UI, sign in with Password123!, create Passenger Example
            using Add new passengers with China, a distinct passport, expiration 2027-12-31, birth 2000-01-15, Female,
            Adult, passenger@example.com and 13800000040; search Shanghai–Beijing for the stated date, click Book on the
            stated train, check Passenger Example, select Business-class seat in that passenger row, click Place order
            and Confirm.
        - keyword: WHEN
          content: Click Cancel within G1001 and then Cancel within Are you sure you want to cancel this order?.
        - keyword: THEN
          content: The dialog closes; G1001 remains Unpaid with Pay available.
- id: REQ-9
  name: Travel guidance
  type: FOLDER
  dependencies: []
  description: |-
    Travel guidance capability. Guide tabs expose selected state and corresponding tabpanels named by category; the target question heading is inside the selected panel.
  children:
  - id: REQ-9.1
    name: Read travel guide categories
    type: ATOMIC
    dependencies: []
    description: |-
      "Travel guide"(role=link) opens one unified guide with "Ticketing"(role=tab), "Endorsement and refund"(role=tab), and "Miscellaneous"(role=tab). Each selected tab shows its matching guidance. Navigation dropdown and homepage Quick Guide provide additional entry routes to these same categories.

      ![image](./reference/travel-guide.png)
      ![image](./reference/travel-guide.png)
    data:
      requires:
      - DATA-GUIDE
    scenarios:
    - name: Browse guide category content
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: Activate Travel guide in navigation; select Ticketing, Endorsement and refund and Miscellaneous in
          turn.
      - keyword: THEN
        content: How to book tickets online? initially appears; each chosen tab is selected and its corresponding named
          tabpanel contains nonempty guidance.
  - id: REQ-9.2
    name: Navigate dropdown category and question anchors
    type: FOLDER
    dependencies:
    - REQ-9.1
    description: |-
      Allow the user to hover over the "Travel guide" navigation item, open a dropdown that contains the three guide categories and direct links to category tabs and question anchors. ![image](./reference/travel-guide-dropdown.png)

      When the user hovers over "Travel guide" in the navigation bar, show a dropdown containing the categories "Ticketing", "Endorsement and refund", and "Miscellaneous". Under each category, provide one "More" link that navigates to the travel guide page and positions the page on the corresponding category tab. ![image](./reference/travel-guide-dropdown.png)

      When the user hovers over "Travel guide" in the navigation bar, show a dropdown containing four question links under each of the categories "Ticketing", "Endorsement and refund", and "Miscellaneous". Clicking one question link navigates to the travel guide page, positions the page on the corresponding category tab, and positions the page on the corresponding question. The travel guide contains the question "How to book tickets online?" under the "Ticketing" category with an accessible question anchor and detail content.

      Travel guide dropdown is a region named Travel guide categories, with child regions named by category. Each category contains exactly four uniquely named question links and one More link; each question destination has its own heading and detail. Guide tabpanels are named by selected category. Question entry scrolls its heading into the viewport.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-9.2.1
      name: Open guide categories from the dropdown
      type: ATOMIC
      dependencies:
      - REQ-9.1
      description: |-
        Hovering "Travel guide"(role=link) displays "Travel guide categories"(role=region), containing "Ticketing"(role=region), "Endorsement and refund"(role=region), and "Miscellaneous"(role=region). Each category has four question links and its own "More"(role=link), which opens the guide with that category selected and its corresponding panel displayed.
      data:
        requires:
        - DATA-GUIDE
      scenarios:
      - name: Open all dropdown guide categories
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: For each of Ticketing, Endorsement and refund and Miscellaneous, return Home, hover Travel guide, inspect
            the three category regions and activate More within the chosen category.
        - keyword: THEN
          content: Each dropdown category contains four question links and one unique More link; its More opens the matching
            selected guide tab and nonempty named tabpanel.
    - id: REQ-9.2.2
      name: Open a dropdown guide question anchor
      type: ATOMIC
      dependencies:
      - REQ-9.1
      description: |-
        Hovering "Travel guide"(role=link) opens "Travel guide categories"(role=region). Following "How to book tickets online?"(role=link) within "Ticketing"(role=region) opens the guide, selects Ticketing, and scrolls its corresponding question heading into view.
      data:
        requires:
        - DATA-GUIDE
      scenarios:
      - name: Open dropdown question anchor
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Hover Travel guide, then activate How to book tickets online? within Travel guide categories → Ticketing.
        - keyword: THEN
          content: Ticketing is selected, its panel contains guidance and the matching question heading is in the viewport.
  - id: REQ-9.3
    name: Use homepage quick-guide destinations
    type: FOLDER
    dependencies:
    - REQ-9.1
    description: |-
      Use the home page "Quick Guide" section to navigate directly to common questions or to the travel guide page.

      Display four common-question links in the home page "Quick Guide" section: "How to book tickets online?", "How to change or refund tickets?", "How to check train status?", and "How to use 12306 mobile app?". Clicking one link navigates to the travel guide page, shows the related topic heading such as "Ticketing", and positions the page on the corresponding question.

      Display a link with the text "More" in the home page "Quick Guide" section and navigate to the travel guide page positioned on the "Ticketing" tab after it is clicked.

      Online-booking question is in Ticketing. The other quick questions select their corresponding category; their exact category mapping is not prescribed. Each target question heading is in viewport and its category tab is selected.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-9.3.1
      name: Open common questions from Quick Guide
      type: ATOMIC
      dependencies:
      - REQ-9.1
      description: |-
        In "Quick Guide"(role=region), "How to book tickets online?"(role=link), "How to change or refund tickets?"(role=link), "How to check train status?"(role=link), and "How to use 12306 mobile app?"(role=link) open their related guide category and scroll the matching heading into the selected panel's viewport. Online booking maps to Ticketing; the remaining mappings are implementation-defined.
      data:
        requires:
        - DATA-GUIDE
      scenarios:
      - name: Open quick question How to book tickets online?
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. Quick
            Guide offers all four declared question links.
        - keyword: WHEN
          content: Activate How to book tickets online? within Quick Guide.
        - keyword: THEN
          content: Ticketing is selected and its matching question heading is in the guide panel viewport.
      - name: Open quick question How to change or refund tickets?
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. Quick
            Guide offers all four declared question links.
        - keyword: WHEN
          content: Activate How to change or refund tickets? within Quick Guide.
        - keyword: THEN
          content: Exactly one related category tab is selected and the matching question heading is in the guide panel
            viewport.
      - name: Open quick question How to check train status?
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. Quick
            Guide offers all four declared question links.
        - keyword: WHEN
          content: Activate How to check train status? within Quick Guide.
        - keyword: THEN
          content: Exactly one related category tab is selected and the matching question heading is in the guide panel
            viewport.
      - name: Open quick question How to use 12306 mobile app?
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. Quick
            Guide offers all four declared question links.
        - keyword: WHEN
          content: Activate How to use 12306 mobile app? within Quick Guide.
        - keyword: THEN
          content: Exactly one related category tab is selected and the matching question heading is in the guide panel
            viewport.
    - id: REQ-9.3.2
      name: Open the guide from Quick Guide More
      type: ATOMIC
      dependencies:
      - REQ-9.1
      description: |-
        "More"(role=link) within the homepage's "Quick Guide"(role=region) opens the guide at Ticketing with How to book tickets online? visible.
      data:
        requires:
        - DATA-GUIDE
      scenarios:
      - name: Open guide with Quick Guide More
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Activate More within Quick Guide.
        - keyword: THEN
          content: Ticketing is selected and How to book tickets online? is visible in the guide panel.
