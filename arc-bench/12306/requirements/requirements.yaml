      description: |-
        An authenticated traveler hovers "My 12306"(role=link), then follows "User information"(role=link) in "My 12306 quick entries"(role=region). All four quick destinations remain identifiable and the selected personal-information content opens.
      data:
        requires: []
      scenarios:
