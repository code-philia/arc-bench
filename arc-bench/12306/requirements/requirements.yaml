        Order center leads to Ticket orders, with three distinct categories: Uncompleted orders, Upcoming trips and History orders. The current category is indicated, and the displayed orders belong to that category.

        An empty Uncompleted orders view shows an illustration, “You don't have uncompleted orders.” and the booking link “You can book your tickets and plan your trips.”.

        An empty Upcoming trips or History orders view shows an illustration, “You don't have any bookings or we can't access your bookings at this time.” and “You can make travel plans through the ticket reservation function.”. History orders also offers Search tickets above the empty state. The booking links open the default ticket results.
