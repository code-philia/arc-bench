- id: REQ-9
  name: Travel guidance
  description:
    text: >-
      Travelers can read ticketing, endorsement and refund, and miscellaneous guidance. The system provides
      questions and answers for each category, including the homepage Quick Guide topics. The guide shows the
      selected category’s content. Opening a question brings its heading into view within that category.
