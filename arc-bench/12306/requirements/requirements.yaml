- id: REQ-7
  name: Passenger management
  type: FOLDER
  dependencies: []
  description: |-
    Passenger management capability.

    Passenger names and passport identities in records are independently identifiable visible text.
  children:
  - id: REQ-7.1
    name: View passenger list with protected account holder
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      "Information management"(role=link) exposes "My Passengers"(role=link), showing columns Name, ID type, ID number, Mobile number, and Operation, with "All"(role=checkbox) and scoped "Delete"(role=button) maintenance. The account-holder passenger_manager_user with Password123! is always present and nondeletable. UI-established Passenger Example has P20269999, expiration 2027-12-31, birth 2000-01-15, China, Female, passenger@example.com, 13800000040, and Adult; other independently deletable examples are Delete Passenger/P20269981, Cancel Passenger/P20269982, Batch Passenger One/P20269983, Batch Passenger Two/P20269984, Batch Cancel Passenger One/P20269985, and Batch Cancel Passenger Two/P20269986. Extra passengers are established through creation flows; only verified accounts and completed historical orders are initially seeded.

      ![image](./reference/my-passengers.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Inspect passenger table and protected holder
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected.
      - keyword: WHEN
        content: Inspect passenger headers and the account-holder row.
      - keyword: THEN
        content: All, Name, ID type, ID number, Mobile number and Operation headers are visible; the passenger_manager_user
          row offers no Delete action.
  - id: REQ-7.2
    name: Add and validate frequent passenger
    type: ATOMIC
    dependencies:
    - REQ-7.1
    description: |-
      Clicking "Add new passengers"(role=button) below My Passengers opens "Add new passengers"(role=dialog). Users complete "Nationality"(role=combobox), "Name"(role=textbox), "Passport number"(role=textbox), "Passport expiration date"(role=textbox), "Date of birth"(role=textbox), "Gender"(role=group), "Email address"(role=textbox), "Mobile number"(role=textbox), and "Passenger type"(role=combobox) with Adult and Child choices. "Cancel"(role=button) abandons entry; "Determine"(role=button) with valid values adds a persistent passenger and shows Passenger added successfully. Passport P20269996 is initially unused. Missing required values show Please fill in all required fields.; a duplicate passport shows Passport number already exists.; malformed email shows Invalid email address format.; malformed mobile shows Invalid mobile number format. Rejections retain the form and add no passenger. Additional scenario passengers and current orders are UI-created rather than preseeded.

      ![image](./reference/add-passenger.png)
    data:
      requires:
      - DATA-PASSENGERS
    scenarios:
    - name: Add passenger with durable identity
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Passport P20269996 is unused.
      - keyword: WHEN
        content: Click Add new passengers; enter Added Passenger, P20269996, China, expiration 2028-12-31, birth 1999-02-20,
          Male, Adult, added.passenger@example.com and 13800000043, then click Determine; reload.
      - keyword: THEN
        content: Passenger added successfully. appears; exactly one P20269996 row identifies Added Passenger before
          and after reload.
    - name: Reject empty passenger form
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected.
      - keyword: WHEN
        content: Click Add new passengers, inspect its form controls and Cancel, then click Determine without entering
          required values.
      - keyword: THEN
        content: Nationality, Name, Passport number, expiration, birth, Gender, Email address, Mobile number and Passenger
          type are visible; Please fill in all required fields. appears and the dialog remains open.
    - name: Reject duplicate passenger passport
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
          new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
          and 13800000040, then Determine.
      - keyword: WHEN
        content: Open Add new passengers and fill Duplicate Passenger with existing passport P20269999 and otherwise
          valid China, expiration 2028-12-31, birth 1999-02-20, Male, Adult, added.passenger@example.com and 13800000043,
          then Determine.
      - keyword: THEN
        content: Passport number already exists. appears; the dialog stays open and no Duplicate Passenger row is added.
    - name: Reject passenger invalid email
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
          new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
          and 13800000040, then Determine.
      - keyword: WHEN
        content: Open Add new passengers and fill Invalid Email Passenger, passport P20260013, China, expiration 2028-12-31,
          birth 1999-02-20, Male, Adult, Email address invalid-email and Mobile number 13800000043, then Determine.
      - keyword: THEN
        content: Invalid email address format. appears; the dialog remains and no Invalid Email Passenger row is added.
    - name: Reject passenger invalid mobile
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
          new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
          and 13800000040, then Determine.
      - keyword: WHEN
        content: Open Add new passengers and fill Invalid Mobile Passenger, passport P20260014, China, expiration 2028-12-31,
          birth 1999-02-20, Male, Adult, added.passenger@example.com and Mobile number 123, then Determine.
      - keyword: THEN
        content: Invalid mobile number format. appears; the dialog remains and no Invalid Mobile Passenger row is added.
  - id: REQ-7.3
    name: Delete passenger or dismiss confirmation
    type: FOLDER
    dependencies:
    - REQ-7.2
    description: |-
      Allow the user to click the "Delete" button in the "Operation" column for one passenger row other than the current account, open a confirmation dialog with the text "Are you sure you want to delete this passenger?" and the buttons "Cancel" and "Confirm", delete the passenger and show a successful delete message after clicking "Confirm", or cancel the operation after clicking "Cancel".



      Confirmed deletions persist across reload; dismissed operations leave the passenger unchanged.
    children:
    - id: REQ-7.3.1
      name: Confirm deletion of one passenger
      type: ATOMIC
      dependencies:
      - REQ-7.2
      description: |-
        Clicking "Delete"(role=button) on the identified non-holder passenger opens "Are you sure you want to delete this passenger?"(role=dialog) with "Cancel"(role=button) and "Confirm"(role=button). Confirm removes that passenger with success feedback, and its absence persists after reload under the parent capability's rules.
      data:
        requires:
        - DATA-PASSENGERS
      scenarios:
      - name: Confirm passenger deletion
        steps:
        - keyword: GIVEN
          content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
            → My Passengers; the account-holder passenger is protected. Delete Passenger/P20269981 was created through
            UI. For other passenger setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31,
            birth 1999-02-20, Male, Adult, added.passenger@example.com and 13800000043, then Determine.
        - keyword: WHEN
          content: Click Delete in the P20269981 row, then Confirm in Are you sure you want to delete this passenger?;
            reload after success.
        - keyword: THEN
          content: The dialog closes, Passenger deleted successfully. appears, and P20269981 is absent before and after
            reload.
    - id: REQ-7.3.2
      name: Dismiss deletion of one passenger
      type: ATOMIC
      dependencies:
      - REQ-7.2
      description: |-
        "Delete"(role=button) on an identified non-holder passenger opens "Are you sure you want to delete this passenger?"(role=dialog), offering "Confirm"(role=button) and "Cancel"(role=button). Cancel closes the dialog and retains that passenger, including after reload, under the shared maintenance rules.
      data:
        requires:
        - DATA-PASSENGERS
      scenarios:
      - name: Dismiss passenger deletion
        steps:
        - keyword: GIVEN
          content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
            → My Passengers; the account-holder passenger is protected. Cancel Passenger/P20269982 was created through
            UI. For other passenger setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31,
            birth 1999-02-20, Male, Adult, added.passenger@example.com and 13800000043, then Determine.
        - keyword: WHEN
          content: Click Delete in the P20269982 row, then Cancel in Are you sure you want to delete this passenger?;
            reload.
        - keyword: THEN
          content: The dialog closes and P20269982 remains visible before and after reload.
  - id: REQ-7.4
    name: Delete selected passengers as a batch
    type: ATOMIC
    dependencies:
    - REQ-7.2
    description: |-
      Users select deletable passenger rows by "Select {passport number}"(role=checkbox), or select all deletable rows through "All"(role=checkbox). "Batch deletion"(role=button) opens "Are you sure you want to delete the selected passengers?"(role=dialog). "Confirm"(role=button) deletes only selected passengers with success feedback and persists their absence, preserving the holder and unselected records. "Cancel"(role=button) dismisses without deleting. Business identity determines selection.
    data:
      requires:
      - DATA-PASSENGERS
    scenarios:
    - name: Confirm selected batch deletion
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Batch Passenger One/P20269983, Batch Passenger
          Two/P20269984 and Unselected Passenger/P20269987 have been created through UI. For other passenger setup,
          use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20, Male,
          Adult, added.passenger@example.com and 13800000043, then Determine.
      - keyword: WHEN
        content: Check Select P20269983 and Select P20269984, leave P20269987 unchecked, click Batch deletion and Confirm
          in its named confirmation dialog.
      - keyword: THEN
        content: The dialog closes with Passengers deleted successfully.; P20269983 and P20269984 disappear while P20269987
          and passenger_manager_user remain.
    - name: Dismiss selected batch deletion
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Batch Cancel Passenger One/P20269985, Batch Cancel
          Passenger Two/P20269986 and Unselected Passenger/P20269987 have been created through UI. For other passenger
          setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20,
          Male, Adult, added.passenger@example.com and 13800000043, then Determine.
      - keyword: WHEN
        content: Check Select P20269985 and Select P20269986, click Batch deletion and Cancel in its named confirmation
          dialog.
      - keyword: THEN
        content: The dialog closes and both selected passengers, P20269987 and the account holder remain visible.
    - name: Select all protects holder
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Batch Passenger One/P20269983 and Batch Passenger
          Two/P20269984 were created through UI. For other passenger setup, use Add new passengers with the stated name/passport,
          China, expiration 2028-12-31, birth 1999-02-20, Male, Adult, added.passenger@example.com and 13800000043,
          then Determine.
      - keyword: WHEN
        content: Check All, click Batch deletion and Confirm in Are you sure you want to delete the selected passengers?.
      - keyword: THEN
        content: Passengers deleted successfully. appears, both deletable passengers disappear and passenger_manager_user
          remains visible.
    - name: Persist confirmed batch deletion
      steps:
      - keyword: GIVEN
        content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
          → My Passengers; the account-holder passenger is protected. Batch Passenger One/P20269983, Batch Passenger
          Two/P20269984 and Unselected Passenger/P20269987 have been created through UI. For other passenger setup,
          use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20, Male,
          Adult, added.passenger@example.com and 13800000043, then Determine.
      - keyword: WHEN
        content: Check Select P20269983 and Select P20269984, click Batch deletion, confirm and reload after success.
      - keyword: THEN
        content: After reload both selected passport rows remain absent while P20269987 and passenger_manager_user remain
          visible.
  - id: REQ-7.5
    name: Search and clear passenger filters
    type: FOLDER
    dependencies:
    - REQ-7.2
    description: |-
      Provide a search input above the passenger table with the placeholder "Please enter passenger name" and a "Search" button, allow the user to search by passenger name or ID number, and show the matching passenger information.

      Provide a "×" button in the search input area above the passenger table, clear the search input after clicking it, and show the full passenger list again.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-7.5.1
      name: Search frequent passengers by name or identity
      type: ATOMIC
      dependencies:
      - REQ-7.2
      description: |-
        On My Passengers, users enter a name or passport in "Please enter passenger name"(role=textbox) and click "Search"(role=button). The list shows matching passenger identities and excludes nonmatching rows.
      data:
        requires:
        - DATA-PASSENGERS
      scenarios:
      - name: Search passenger name
        steps:
        - keyword: GIVEN
          content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
            → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
            new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
            and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created through UI. For other passenger
            setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20,
            Male, Adult, added.passenger@example.com and 13800000043, then Determine.
        - keyword: WHEN
          content: Enter Passenger Example in Please enter passenger name and click Search.
        - keyword: THEN
          content: P20269999 displays Passenger Example and the nonmatching P20269982 row is hidden.
      - name: Search passenger ID
        steps:
        - keyword: GIVEN
          content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
            → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
            new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
            and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created through UI. For other passenger
            setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20,
            Male, Adult, added.passenger@example.com and 13800000043, then Determine.
        - keyword: WHEN
          content: Enter P20269999 in Please enter passenger name and click Search.
        - keyword: THEN
          content: P20269999 displays Passenger Example and the nonmatching P20269982 row is hidden.
    - id: REQ-7.5.2
      name: Clear the passenger search
      type: ATOMIC
      dependencies:
      - REQ-7.5.1
      description: |-
        After filtering, clicking "×"(role=button) clears "Please enter passenger name"(role=textbox) and restores the complete passenger list, including previously hidden records.
      data:
        requires:
        - DATA-PASSENGERS
      scenarios:
      - name: Clear passenger search
        steps:
        - keyword: GIVEN
          content: passenger_manager_user has signed in with Password123! and opened My 12306 → Information management
            → My Passengers; the account-holder passenger is protected. Passenger Example has been created through Add
            new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
            and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created through UI. For other passenger
            setup, use Add new passengers with the stated name/passport, China, expiration 2028-12-31, birth 1999-02-20,
            Male, Adult, added.passenger@example.com and 13800000043, then Determine.
        - keyword: WHEN
          content: Search for Passenger Example, verify Cancel Passenger is hidden, then click ×.
        - keyword: THEN
          content: The query becomes empty and both P20269999 and previously excluded P20269982 return.
- id: REQ-8
  name: Booking and payment
  type: FOLDER
  dependencies: []
  description: |-
    Booking and payment capability.
  children:
  - id: REQ-8.1
    name: Intercept booking and expose quick-login routes
    type: FOLDER
    dependencies:
    - REQ-3.2
    description: |-
      Provide the booking flow from the search results page, including unauthenticated interception, quick login, passenger selection, booking submission, order confirmation, payment, and payment entry from the order center.

      Require login before booking. When the user clicks one "Book" button without being logged in, show a quick login form instead of continuing directly.

      When the user clicks one "Book" button on the ticket search results page without being logged in, show a quick login form with the title area containing the icon "assets/logo-icon.png" and the text "Login", an input with the placeholder "Email/Username/Mobile number", a password input with the placeholder "Password", and a "LOGIN" button. ![image](./reference/login-form.png)

      Provide a link with the text "Forgot your password" in the quick login form and navigate to the forgot password page after it is clicked.

      Provide a link with the text "No account yet? Register now." in the quick login form and navigate to the registration page after it is clicked.



