  - id: REQ-8.3
    name: Validate submission and confirm or edit order capability
    description:
      text: Organize the page-entry and independent user behaviors for Validate submission and confirm or edit order.
        REQ-8.3.1 establishes the concrete reference pages first; the remaining siblings apply their explicitly
        preserved source contracts. This abstract capability has no page or executable UI of its own.
