id: ROOT
name: 12306 railway travel
description:
  text: |-
    A railway ticketing system for searching trains, managing traveler information, booking journeys, and paying for tickets.

    Dates and times use Asia/Shanghai. Travelers can search the published timetable, buy tickets for available services, and view orders on their own account.
scenarios: []
children:
- id: REQ-1
  name: Public entry
  description:
    text: |-
      Public entry capability.

      The homepage gives visitors access to account actions, train search and travel guidance. Forms identify their fields, and only current results are shown.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Explore homepage and banner carousel
    description:
      text: |-
        The homepage shows the 12306 logo on the left and Login, Register and My 12306 on the right. Its main navigation offers Home, Booking and Travel guide. The banner carousel starts with the first of three images and advances through them in order. Ticket search offers From, To and Date fields and an enabled Search action. Quick Guide includes How to book tickets online? and More.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Browse public homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          The visitor is logged out on the homepage.
        When: Inspect the homepage and click Next banner twice within Home banners.
        Then: The 12306 logo, Login, Register, My 12306 and Home/Booking/Travel guide navigation are visible; Banner
          1 changes to Banner 2 then Banner 3; Ticket search exposes From, To, Date and enabled Search, and Quick
          Guide exposes How to book tickets online? and More.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
- id: REQ-2
  name: Account access
  description:
    text: Travelers can register, sign in and out, recover their password, and read the registration agreements.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Register and validate a traveler account capability
    description:
      text: |-
        Travelers open registration from the public header. They choose a nationality and provide a name, passport number and expiration date, date of birth, gender, username, password, password confirmation and email address. Nationality initially shows “Please select”. Gender offers Male and Female. Travelers must agree to the Terms of Service and Privacy Policy before submitting.

        Successful registration displays “Registration successful.” and saves the account for later sign-in. Passport numbers and usernames must be unique. An unsuccessful submission keeps the registration form open and creates no account.

        Missing required information, including an empty password confirmation, shows “Please fill in all required fields.”. An existing passport number shows “Passport number already exists.” and an existing username shows “Username already exists.”. Different passwords show “Passwords do not match.”. An invalid email shows “Invalid email address format.”. Missing agreement shows “Please agree to the Terms of Service and Privacy Policy.”
    scenarios: []
    children:
    - id: REQ-2.1.1
      name: Open traveler registration
      description:
        text: |-
          Follow Register from the public header. Registration displays Nationality, Name, Passport number, Password, Confirm Password, and the Register submit action.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
      scenarios:
      - id: SCN-REQ-2.1.1-01
        name: Open traveler registration
        steps:
        - id: STEP-REQ-2.1.1-01-01
          Given: A signed-out visitor is on the public homepage.
          When: Follow Register from the public header.
          Then: Registration displays Nationality, Name, Passport number, Password, Confirm Password, and the Register
            submit action.
          references:
          - \ref[requirement](REQ-1.1)
          - \ref[image](IMG-HOMEPAGE)
          - \ref[image](IMG-REGISTER)
      children: []
    - id: REQ-2.1.2
      name: Create a traveler account
      description:
        text: |-
          Clicking "Register" opens traveler registration with "Nationality", "Name", "Passport number", "Passport expiration date", "Date of birth", "Gender", "Username", "Password", "Confirm Password", and "Email address". Users provide valid identity and credential values, accept "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and click "Register". Registration creates and persists that identity, whose saved credentials authenticate the same account.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-2.1.2-01
        name: Create durable account
        steps:
        - id: STEP-REQ-2.1.2-01-01
          Given: The visitor is logged out on the homepage. Username traveler_new, email traveler_new@example.com and passport P20260001 are unused.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and agree to
            the Terms of Service and Privacy Policy. Enter Passport number P20260001, Username traveler_new
            and Email address traveler_new@example.com, then click Register. Return Home, sign out if signed in,
            reload, use Login to submit traveler_new / Password123!, then reload again.
          Then: Registration successful. is displayed; the saved credentials sign in after reload, and Sign Out
            remains visible after the second reload.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      children: []
    - id: REQ-2.1.3
      name: Reject invalid traveler registration
      description:
        text: |-
          After "Register" opens registration, users complete "Nationality", "Name", "Passport number", "Passport expiration date", "Date of birth", "Gender", "Username", "Password", "Confirm Password", "Email address", and "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.". "Register" rejects missing, duplicate, mismatched, invalid, or unaccepted information with the applicable error message, retains the form, and creates no account.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
      scenarios:
      - id: SCN-REQ-2.1.3-01
        name: Reject missing fields
        steps:
        - id: STEP-REQ-2.1.3-01-01
          Given: The visitor is logged out on the homepage.
          When: Open Register and submit the empty form.
          Then: Please fill in all required fields. appears; Username remains visible and Registration successful.
            is absent.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-02
        name: Reject duplicate passport
        steps:
        - id: STEP-REQ-2.1.3-02-01
          Given: The visitor is logged out on the homepage.
          When: Through Register create existing_passport with passport P20260002 and email existing_passport@example.com
            using valid identity details and Password123!. Return Home and sign out if needed. Open Register
            again and submit another valid registration with the same passport P20260002, a different username
            duplicate_passport_user and a different email duplicate_passport_user@example.com.
          Then: Passport number already exists. appears; the registration form remains and no success feedback is
            shown for the duplicate attempt.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-03
        name: Reject duplicate username
        steps:
        - id: STEP-REQ-2.1.3-03-01
          Given: The visitor is logged out on the homepage.
          When: Create username_taken through Register with passport P20260104 and email username_taken@example.com
            using valid identity details and Password123!. Return Home and sign out if needed. Open Register
            again and submit another valid registration with the same username username_taken, a different
            passport P20260004 and a different email another_traveler@example.com.
          Then: Username already exists. appears; Username remains on the form and the duplicate attempt shows no
            registration success.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-04
        name: Reject password mismatch
        steps:
        - id: STEP-REQ-2.1.3-04-01
          Given: The visitor is logged out on the homepage.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and agree to
            the Terms of Service and Privacy Policy. Enter passport P20260007, Username traveler_mismatch
            and Email address traveler_mismatch@example.com; replace Confirm Password with Password123!Mismatch
            and submit Register.
          Then: Passwords do not match. appears; Username remains visible and no registration success is shown.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-05
        name: Reject invalid email
        steps:
        - id: STEP-REQ-2.1.3-05-01
          Given: The visitor is logged out on the homepage.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and agree to
            the Terms of Service and Privacy Policy. Enter passport P20260008, Username traveler_invalid_email
            and Email address invalid-email, then submit Register.
          Then: Invalid email address format. appears; the form remains and no registration success is shown.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-06
        name: Require agreement acceptance
        steps:
        - id: STEP-REQ-2.1.3-06-01
          Given: The visitor is logged out on the homepage.
          When: Open Register and fill China, Test Traveler, passport P20260009, expiration 2026-12-31, birth 1996-06-18,
            Male, Username traveler_agreement, matching Password123! values and email traveler_agreement@example.com;
            leave the agreement unchecked and click Register.
          Then: Please agree to the Terms of Service and Privacy Policy. appears; the form remains without registration
            success.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-07
        name: Reject missing confirmation password
        steps:
        - id: STEP-REQ-2.1.3-07-01
          Given: The visitor is logged out on the homepage.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and agree to
            the Terms of Service and Privacy Policy. Enter passport P20260015, Username traveler_missing_confirm
            and email traveler_missing_confirm@example.com; clear Confirm Password and click Register.
          Then: Please fill in all required fields. appears; Confirm Password remains visible and registration success
            is absent.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      children: []
  - id: REQ-2.2
    name: Log in with username email or mobile capability
    description:
      text: |-
        The public Login entry opens a form that accepts a username, email address or mobile number and a password. Correct credentials show “Login successful”, reveal Sign Out and keep the traveler signed in after reload. The registration entry on this form opens the registration page.

        If either field is missing, show “Please enter your username/email/phone number and password.”. An unrecognized identity shows “User not found.”. An incorrect password shows “Incorrect password.”.

        The system provides a verified account with all three sign-in identifiers. For example, registered_user has email registered_user@example.com, mobile 13800000010 and password Password123!.
    scenarios: []
    children:
    - id: REQ-2.2.1
      name: Open credential login
      description:
        text: |-
          Follow Login from the public header. The login page displays Email/Username/Mobile number, Password, and LOGIN without authenticating merely by navigation.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
      scenarios:
      - id: SCN-REQ-2.2.1-01
        name: Open credential login
        steps:
        - id: STEP-REQ-2.2.1-01-01
          Given: A signed-out visitor is on the public homepage.
          When: Follow Login from the public header.
          Then: The login page displays Email/Username/Mobile number, Password, and LOGIN without authenticating
            merely by navigation.
          references:
          - \ref[requirement](REQ-1.1)
          - \ref[image](IMG-HOMEPAGE)
          - \ref[image](IMG-LOGIN)
      children: []
    - id: REQ-2.2.2
      name: Authenticate traveler credentials
      description:
        text: |-
          "Login" opens credential login. A logged-out traveler enters a username, email, or mobile in "Email/Username/Mobile number", enters "Password", and clicks "LOGIN". Correct credentials establish the same account's persisted session; incorrect credentials leave the user logged out under the capability's declared errors. Either missing account or missing password independently triggers the required-credentials error, even if the other field is supplied.
        image:
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-2.2.2-01
        name: Authenticate by username email and mobile
        steps:
        - id: STEP-REQ-2.2.2-01-01
          Given: |-
            The visitor is logged out on the homepage. The verified registered_user identity has email registered_user@example.com, mobile 13800000010 and password Password123!.
          When: For each of registered_user, registered_user@example.com and 13800000010, open Login, enter the
            identity and Password123! and click LOGIN; reload after each successful login and then click Sign Out
            before trying the next identity.
          Then: Each identity displays Login successful and Sign Out persists after reload; each sign-out restores
            Login and removes Sign Out.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-02
        name: Reject empty credentials
        steps:
        - id: STEP-REQ-2.2.2-02-01
          Given: The visitor is logged out on the homepage.
          When: Open Login, leave Email/Username/Mobile number and Password empty and click LOGIN.
          Then: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-03
        name: Reject unknown account
        steps:
        - id: STEP-REQ-2.2.2-03-01
          Given: The visitor is logged out on the homepage. unknown_account does not exist.
          When: Open Login, enter unknown_account and Password123!, and click LOGIN.
          Then: User not found. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-04
        name: Reject wrong password
        steps:
        - id: STEP-REQ-2.2.2-04-01
          Given: |-
            The visitor is logged out on the homepage. registered_user exists with Password123!.
          When: Open Login, enter registered_user and WrongPassword123!, and click LOGIN.
          Then: Incorrect password. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-05
        name: Reject missing password
        steps:
        - id: STEP-REQ-2.2.2-05-01
          Given: |-
            The visitor is logged out on the homepage. registered_user exists.
          When: Open Login, enter registered_user, leave Password empty and click LOGIN.
          Then: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-06
        name: Reject missing account
        steps:
        - id: STEP-REQ-2.2.2-06-01
          Given: The visitor is logged out on the homepage.
          When: Open Login, leave Email/Username/Mobile number empty, enter Password123! in Password and click LOGIN.
          Then: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      children: []
    - id: REQ-2.2.3
      name: Open registration from login
      description:
        text: |-
          From login, "No account yet? Register now." opens registration with Nationality, Passport number, and Register available. Navigation alone creates no account.
        image:
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
      scenarios:
      - id: SCN-REQ-2.2.3-01
        name: Open registration from login
        steps:
        - id: STEP-REQ-2.2.3-01-01
          Given: The visitor is logged out on the homepage.
          When: Open Login, then activate No account yet? Register now.
          Then: Registration opens with Nationality, Passport number and Register visible.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-REGISTER)
      children: []
  - id: REQ-2.3
    name: Sign out and clear session
    description:
      text: Successful login replaces the top Register entry with "Sign Out". Clicking it clears persisted authentication, displays successful logout feedback, and restores "Register" and "Login" in place of Sign Out and the username.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-2.3-01
      name: Clear persisted login
      steps:
      - id: STEP-REQ-2.3-01-01
        Given: |-
          registered_user has signed in through Login with Password123! and Sign Out is visible.
        When: Click Sign Out, inspect logout feedback, then reload.
        Then: Logout successful. appears; after reload Login and Register are visible and Sign Out is unavailable.
        references:
        - \ref[requirement](REQ-2.2.2)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-2.4
    name: Recover password through identity verification
    description:
      text: |-
        Forgot password opens recovery. Both the email address and passport number are required. A missing value shows “Please enter your email and ID number.”. A mismatch shows “Email address and ID number do not match.”. A matching identity opens fields for a new password and its confirmation. Matching values save the new password and show success. Unequal values show “Passwords do not match.” and leave the original credentials valid.

        A traveler can use the email and passport saved during registration to verify their identity.
      image:
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-FORGOT-PASSWORD
        reference: reference/forgot-password.png
        page: password_recovery
    scenarios:
    - id: SCN-REQ-2.4-01
      name: Reject missing identity
      steps:
      - id: STEP-REQ-2.4-01-01
        Given: The visitor is logged out on the homepage.
        When: 'Open Login then Forgot password?, leave Email: and ID number: empty and click submit.'
        Then: 'Please enter your email and ID number. appears and New password: is not exposed.'
        references:
        - \ref[requirement](REQ-2.2.1)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    - id: SCN-REQ-2.4-02
      name: Reject mismatched identity
      steps:
      - id: STEP-REQ-2.4-02-01
        Given: |-
          A traveler has registered with email reset_user@example.com and passport P20260011 and is signed out.
        When: 'Open Forgot password? from Login, enter Email: wrong@example.com and ID number: P20260011 and click
          submit.'
        Then: 'Email address and ID number do not match. appears and New password: is not exposed.'
        references:
        - \ref[requirement](REQ-2.2.1)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    - id: SCN-REQ-2.4-03
      name: Reject new password mismatch
      steps:
      - id: STEP-REQ-2.4-03-01
        Given: |-
          A traveler has registered as reset_mismatch_user with email reset_mismatch_user@example.com, passport P20260012 and password Password123!, and is signed out.
        When: 'Verify that email/passport through Forgot password?; enter New password: Password123!X and Confirm
          new password: Password123!Y and submit. Return Home and log in as reset_mismatch_user with the original
          Password123!.'
        Then: 'Passwords do not match. appears and New password: remains visible; the original password still authenticates
          the account.'
        references:
        - \ref[requirement](REQ-2.2.2)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    - id: SCN-REQ-2.4-04
      name: Reject missing recovery email
      steps:
      - id: STEP-REQ-2.4-04-01
        Given: A traveler has registered with email reset_user@example.com and passport P20260011 and is signed out.
        When: 'Open Forgot password? from Login, leave Email: empty, enter ID number: P20260011 and click submit.'
        Then: 'Please enter your email and ID number. appears; Email: remains visible and New password: is not exposed.'
        references:
        - \ref[requirement](REQ-2.2.1)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    - id: SCN-REQ-2.4-05
      name: Reject missing recovery ID
      steps:
      - id: STEP-REQ-2.4-05-01
        Given: A traveler has registered with email reset_user@example.com and passport P20260011 and is signed out.
        When: 'Open Forgot password? from Login, enter Email: reset_user@example.com, leave ID number: empty and
          click submit.'
        Then: 'Please enter your email and ID number. appears; Email: remains visible and New password: is not exposed.'
        references:
        - \ref[requirement](REQ-2.2.1)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-FORGOT-PASSWORD)
    children: []
  - id: REQ-2.5
    name: Read registration agreements capability
    description:
      text: Travelers can follow Terms of Service and Privacy Policy from registration. Each opens the agreement with its matching title without submitting the registration.
    scenarios: []
    children:
    - id: REQ-2.5.1
      name: Open registration agreement pages
      description:
        text: |-
          Follow Terms of Service and Privacy Policy separately from registration. Each agreement displays its matching heading; opening agreements does not submit registration.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
        - id: IMG-RULE
          reference: reference/rule.png
          page: service_agreement
        - id: IMG-POLICY
          reference: reference/policy.png
          page: privacy_policy
      scenarios:
      - id: SCN-REQ-2.5.1-01
        name: Open registration agreement pages
        steps:
        - id: STEP-REQ-2.5.1-01-01
          Given: A visitor opens the registration form from the homepage.
          When: Follow Terms of Service and Privacy Policy separately from registration.
          Then: Each agreement displays its matching heading; opening agreements does not submit registration.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
          - \ref[image](IMG-RULE)
          - \ref[image](IMG-POLICY)
      children: []
    - id: REQ-2.5.2
      name: Read Terms of Service
      description:
        text: |-
          Users open registration through "Register", then follow its "Terms of Service" link to display the agreement heading. Reading the agreement does not submit registration.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
        - id: IMG-RULE
          reference: reference/rule.png
          page: service_agreement
        - id: IMG-POLICY
          reference: reference/policy.png
          page: privacy_policy
      scenarios:
      - id: SCN-REQ-2.5.2-01
        name: Read Terms of Service
        steps:
        - id: STEP-REQ-2.5.2-01-01
          Given: The visitor is logged out on the homepage.
          When: Open Register, then open Terms of Service.
          Then: The Terms of Service heading is visible.
          references:
          - \ref[requirement](REQ-2.5.1)
          - \ref[image](IMG-REGISTER)
          - \ref[image](IMG-RULE)
          - \ref[image](IMG-POLICY)
      children: []
    - id: REQ-2.5.3
      name: Read Privacy Policy
      description:
        text: |-
          Users open registration through "Register", then follow its "Privacy Policy" link to display that agreement heading without submitting registration.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
        - id: IMG-POLICY
          reference: reference/policy.png
          page: privacy_policy
        - id: IMG-RULE
          reference: reference/rule.png
          page: service_agreement
      scenarios:
      - id: SCN-REQ-2.5.3-01
        name: Read Privacy Policy
        steps:
        - id: STEP-REQ-2.5.3-01-01
          Given: The visitor is logged out on the homepage.
          When: Open Register, then open Privacy Policy.
          Then: The Privacy Policy heading is visible.
          references:
          - \ref[requirement](REQ-2.5.1)
          - \ref[image](IMG-REGISTER)
          - \ref[image](IMG-POLICY)
          - \ref[image](IMG-RULE)
      children: []
- id: REQ-3
  name: Train search
  description:
    text: |-
      The system publishes the station directory, including Shanghai (上海), Beijing (北京), Yancheng (盐城) and Lhasa (拉萨). Train numbers identify individual results. Filtering and sorting change the visible results for the current route and date while leaving the timetable intact.

      For example, today’s Shanghai–Beijing timetable includes G1001 from Shanghai Hongqiao at 08:00 to Beijing South at 13:00 (300 minutes, second-class fare CNY 576), G1002 from Shanghai at 13:00 to Beijing at 19:00 (360 minutes, CNY 600), and K1003 from Shanghai at 00:30 to Beijing South at 15:30 (900 minutes, CNY 200). Those three trains run daily. For tomorrow’s search the system also publishes G2002, from Shanghai at 10:00 to Beijing at 15:00 (300 minutes, CNY 576).

      The default Beijing–Shanghai search uses today’s date. The system provides G3001 on that route, departing at 08:00 and arriving at 13:00 (300 minutes).
  scenarios: []
  children:
  - id: REQ-3.1
    name: Choose locations and departure date capability
    description:
      text: |-
        The ticket search has From, To and Date fields and an enabled Search action. Both location fields support suggestions in pinyin and Chinese, and browsing by Popular, ABCDE, FGHIJ, KLMNO, PQRST and UVWXYZ. For example, “shang” or “上海” brings up Shanghai (上海) under Top destinations. Beijing (北京) is available under ABCDE. Selecting either entry fills its corresponding city in the field.

        The departure date can be any day from today through the 14th day after today, inclusive. If the date is outside that range, show “Please choose a departure date from {first available date} through {last available date}.” using the current sale dates. Show the date error before any missing-location error.
    scenarios: []
    children:
    - id: REQ-3.1.1
      name: Open public station and date selectors
      description:
        text: |-
          Focus From and then reopen the homepage and focus Date. From exposes Popular and ABCDE tabs; Date exposes the option to select today; Search remains available.
        image:
        - id: IMG-LOCATION-SELECTOR-LIST
          reference: reference/location-selector-list.png
          page: home
        - id: IMG-LOCATION-SELECTOR-FORM
          reference: reference/location-selector-form.png
          page: home
        - id: IMG-DATE-SELECTOR
          reference: reference/date-selector.png
          page: home
      scenarios:
      - id: SCN-REQ-3.1.1-01
        name: Open public station and date selectors
        steps:
        - id: STEP-REQ-3.1.1-01-01
          Given: A visitor is on the public homepage.
          When: Focus From and then reopen the homepage and focus Date.
          Then: From exposes Popular and ABCDE tabs; Date exposes the option to select today; Search remains available.
          references:
          - \ref[requirement](REQ-1.1)
          - \ref[image](IMG-LOCATION-SELECTOR-LIST)
          - \ref[image](IMG-LOCATION-SELECTOR-FORM)
          - \ref[image](IMG-DATE-SELECTOR)
      children: []
    - id: REQ-3.1.2
      name: Choose a departure location
      description:
        text: >-
          On public search, "From" supports station selection through pinyin, Chinese, or alphabetical browsing.
          "Popular", "ABCDE", "FGHIJ", "KLMNO", "PQRST", and "UVWXYZ" provide the corresponding groups; matching
          suggestions such as "Shanghai (上海)" and "Beijing (北京)" are unique. Choosing a station fills its
          canonical English city name.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-3.1.2-01
        name: Choose Shanghai using pinyin and Chinese
        steps:
        - id: STEP-REQ-3.1.2-01-01
          Given: |-
            The visitor is logged out on the homepage.
          When: Enter shang in From, choose Shanghai (上海), then repeat with 上海 and choose the same suggestion.
          Then: Each query shows Top destinations and one selectable Shanghai (上海) result; choosing it sets From to
            canonical Shanghai.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-3.1.2-02
        name: Choose Beijing from alphabetical selector
        steps:
        - id: STEP-REQ-3.1.2-02-01
          Given: |-
            The visitor is logged out on the homepage.
          When: Click From, inspect Popular/ABCDE/FGHIJ/KLMNO/PQRST/UVWXYZ tabs, select ABCDE and click Beijing
            (北京).
          Then: The tabs are visible; Beijing (北京) is unique in the selected group and From becomes Beijing.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-HOMEPAGE)
      children: []
    - id: REQ-3.1.3
      name: Choose and validate departure date
      description:
        text: |-
          Travelers can choose a departure date from today through 14 days from today, inclusive. Search rejects a date outside this window and keeps the form visible.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-3.1.3-01
        name: Select departure date
        steps:
        - id: STEP-REQ-3.1.3-01-01
          Given: The visitor is logged out on the homepage.
          When: Open Date and choose today.
          Then: Date contains today.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-3.1.3-02
        name: Reject past date
        steps:
        - id: STEP-REQ-3.1.3-02-01
          Given: The visitor is logged out on the homepage.
          When: Enter yesterday in Date and click Search.
          Then: Please choose a departure date from {first available date} through {last available date}. appears and Ticket search remains visible.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-3.1.3-03
        name: Reject date beyond sale window
        steps:
        - id: STEP-REQ-3.1.3-03-01
          Given: The visitor is logged out on the homepage.
          When: Enter 15 days from today in Date and click Search.
          Then: Please choose a departure date from {first available date} through {last available date}. appears and Ticket search remains visible.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-HOMEPAGE)
      children: []
  - id: REQ-3.2
    name: Search direct trains and reject incomplete route
    description:
      text: |-
        Users choose locations in "From" and "To", set "Date", and click "Search". Shanghai–Beijing today opens results preserving those inputs, the route summary Shanghai (上海) - Beijing (北京), and a visible count, including G1001. Empty From shows Please enter a valid departure place. even when the other criteria are valid; empty To likewise shows Please enter a valid arrival place. Results remain below homepage navigation and provide "Travel dates" with selectable dates, "Filter", booking actions, and columns Train No., Departure Time, Travel time, Arrival Time, and Price. Published matches on the current and following day include distinct types, times, durations, prices, stations, and inventory, covering G/C/D and Other, Shanghai Hongqiao departure, Beijing South arrival, and 06:00-12:00 departures. Business-class, First-class, Second-class, and Standing ticket prices and both available and unavailable inventories remain observable. The default Beijing–Shanghai route is also populated for the current date.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-SEARCH-RESULT
        reference: reference/search-result.png
        page: train_results
    scenarios:
    - id: SCN-REQ-3.2-01
      name: Show matching trains and preserve criteria
      steps:
      - id: STEP-REQ-3.2-01-01
        Given: |-
          The visitor is logged out on the homepage. The published timetable contains G1001, G1002 and K1003 for Shanghai–Beijing today.
        When: Enter shang in From and choose Shanghai (上海), enter bei in To and choose Beijing (北京), open Date and choose today, then click Search.
        Then: From/To/Date preserve Shanghai/Beijing/today; Shanghai (上海) - Beijing (北京) and 3 results appear with exactly G1001, G1002 and K1003; Travel dates, Filter and Train No./Departure Time/Travel time/Arrival Time/Price columns are visible.
        references:
        - \ref[requirement](REQ-3.1.2)
        - \ref[requirement](REQ-3.1.3)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-RESULT)
    - id: SCN-REQ-3.2-02
      name: Reject empty From
      steps:
      - id: STEP-REQ-3.2-02-01
        Given: |-
          The visitor is logged out on the homepage.
        When: Leave From empty, choose Beijing (北京) for To, choose Date today and click Search.
        Then: Please enter a valid departure place. appears and Ticket search remains visible.
        references:
        - \ref[requirement](REQ-3.1.2)
        - \ref[requirement](REQ-3.1.3)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-RESULT)
    - id: SCN-REQ-3.2-03
      name: Reject empty To
      steps:
      - id: STEP-REQ-3.2-03-01
        Given: |-
          The visitor is logged out on the homepage.
        When: Choose Shanghai (上海) for From, leave To empty, choose Date today and click Search.
        Then: Please enter a valid arrival place. appears and Ticket search remains visible.
        references:
        - \ref[requirement](REQ-3.1.2)
        - \ref[requirement](REQ-3.1.3)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-RESULT)
    children: []
  - id: REQ-3.3
    name: Inspect fares and empty direct route
    description:
      text: |-
        Each train row has a "Price" cell with seat type, price and a corresponding "Book" action. The published train "G1001" on the Shanghai-to-Beijing route shows the Second-class seat price as CNY 576 (the same fare displayed as ￥576.0 on its booking form, even though no second-class seats remain) and has an enabled "Book" action for that train because other seat classes are available.

        The valid Shanghai-to-Lhasa route has no direct trains today. Its results page preserves the search fields, shows an empty-results illustration, the count "0 results", and the message "sorry, according to your inquiry condition, there is no train at present.".
    scenarios: []
    children:
    - id: REQ-3.3.1
      name: Inspect a fare and booking availability
      description:
        text: |-
          After a direct search, users inspect G1001's second-class fare CNY 576 despite its unavailable second-class inventory. "Book" remains enabled because another class has seats.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.3.1-01
        name: Show fare with bookable other class
        steps:
        - id: STEP-REQ-3.3.1-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. G1001 has no second-class seats but another class has inventory.
          When: Inspect G1001 and its Book action.
          Then: G1001 displays Second-class seat and CNY 576; Book remains enabled because another class is available.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.3.2
      name: Observe a route without direct trains
      description:
        text: |-
          Searching valid Shanghai–Lhasa today retains the selected criteria and displays No trains, 0 results, and the corresponding empty-result message without direct-train rows.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.3.2-01
        name: Show no direct trains
        steps:
        - id: STEP-REQ-3.3.2-01-01
          Given: |-
            The visitor is logged out on the homepage. No direct Shanghai–Lhasa services are published for today.
          When: Choose Shanghai (上海) in From and Lhasa (拉萨) in To, select Date today and click Search.
          Then: The criteria remain Shanghai/Lhasa/today; No trains image, 0 results and sorry, according to your inquiry condition, there is no train at present. appear, and no train result rows remain.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-HOMEPAGE)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
  - id: REQ-3.4
    name: Change travel date from results
    description:
      text: |-
        The results page exposes a date input labelled "Date" and a "Search" action. Searching Shanghai to Beijing for tomorrow replaces the displayed departure date with tomorrow and shows the published train "G1001" for that date.

        The "Travel dates" section on the results page contains selectable calendar dates. Selecting tomorrow updates "Date" and displays the published Shanghai–Beijing results for tomorrow, including train "G1001".
    scenarios: []
    children:
    - id: REQ-3.4.1
      name: Resubmit a changed results-page departure date
      description:
        text: |-
          From populated results, users open "Date", choose "tomorrow", and click "Search". The list is replaced with the matching services for tomorrow while preserving the route.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.4.1-01
        name: Change date using date picker
        steps:
        - id: STEP-REQ-3.4.1-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Tomorrow also includes G2002.
          When: Open Date, click tomorrow and click Search.
          Then: Date becomes tomorrow and results are replaced by G1001, G1002, K1003 and G2002.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.4.2
      name: Switch date through the travel-date bar
      description:
        text: |-
          Clicking "tomorrow" within "Travel dates" updates Date and shows that day's services without a second Search action.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.4.2-01
        name: Change date using Travel dates
        steps:
        - id: STEP-REQ-3.4.2-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Tomorrow also includes G2002.
          When: Click tomorrow within Travel dates without another Search click.
          Then: Date becomes tomorrow and results update to G1001, G1002, K1003 and G2002.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
  - id: REQ-3.5
    name: Sort direct train results
    description:
      text: |-
        Use Departure Time in the results header to sort trains by departure time in ascending order. Use it again to reverse the order.

        Use Travel time in the results header to sort trains by travel duration in ascending order. Use it again to reverse the order.

        Use Arrival Time in the results header to sort trains by arrival time in ascending order. Use it again to reverse the order.
    scenarios: []
    children:
    - id: REQ-3.5.1
      name: Sort direct trains by departure time
      description:
        text: |-
          Clicking "Departure Time" on existing direct-train results orders them by published departure time ascending; clicking again reverses the order. Both operations preserve the complete current result set.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.5.1-01
        name: Toggle Departure Time sorting
        steps:
        - id: STEP-REQ-3.5.1-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Departure times are K1003 00:30, G1001 08:00 and G1002 13:00.
          When: Click Departure Time in its columnheader, inspect order, then click it again.
          Then: The first order is K1003, G1001, G1002; the second is G1002, G1001, K1003, retaining all three services.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.5.2
      name: Sort direct trains by travel duration
      description:
        text: |-
          Clicking "Travel time" orders existing direct results by published duration ascending, and a second click orders them descending, preserving the complete current result set.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.5.2-01
        name: Toggle Travel time sorting
        steps:
        - id: STEP-REQ-3.5.2-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Durations are G1001 300, G1002 360 and K1003 900 minutes.
          When: Click Travel time in its columnheader, inspect order, then click it again.
          Then: The first order is G1001, G1002, K1003; the second is K1003, G1002, G1001, retaining all three services.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.5.3
      name: Sort direct trains by arrival time
      description:
        text: |-
          Clicking "Arrival Time" orders existing direct results by published arrival time ascending; clicking again orders them descending without changing result membership.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.5.3-01
        name: Toggle Arrival Time sorting
        steps:
        - id: STEP-REQ-3.5.3-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Arrival times are G1001 13:00, K1003 15:30 and G1002 19:00.
          When: Click Arrival Time in its columnheader, inspect order, then click it again.
          Then: The first order is G1001, K1003, G1002; the second is G1002, K1003, G1001, retaining all three services.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
  - id: REQ-3.6
    name: Filter train type stations and departure interval
    description:
      text: |-
        The Train type filter offers All, G/C/D and Other. Selecting "G/C/D" shows at least one train and restricts visible train numbers to G, C, or D prefixes.

        The From Station filter offers "All" and "Shanghai Hongqiao". Selecting "Shanghai Hongqiao" retains at least one train and only rows departing at that station.

        The To Station filter offers "All" and "Beijing South". Selecting "Beijing South" retains at least one train and only rows arriving at that station.

        The Departure time filter offers "00:00-24:00", "00:00-06:00", "06:00-12:00", "12:00-18:00", and "18:00-24:00". Selecting "06:00-12:00" retains at least one train and only departures from 06:00 through 11:59.
    scenarios: []
    children:
    - id: REQ-3.6.1
      name: Filter direct trains by type
      description:
        text: |-
          Within "Filter" and "Train type", selecting "G/C/D" retains matching train prefixes and excludes Other. Selecting "Other" restricts the list to published non-G/C/D types. "All" removes the type restriction and restores both groups for the current route and date. Published matches and nonmatches make each effect observable.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.6.1-01
        name: Restrict train type
        steps:
        - id: STEP-REQ-3.6.1-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003.
          When: Check G/C/D under Train type in the filters.
          Then: The result set is exactly G1001 and G1002; K1003 is excluded.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      - id: SCN-REQ-3.6.1-02
        name: Filter Other train types
        steps:
        - id: STEP-REQ-3.6.1-02-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003.
          When: Check Other under Train type in the filters.
          Then: The result set is exactly K1003; both G trains are excluded.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      - id: SCN-REQ-3.6.1-03
        name: Restore all train types
        steps:
        - id: STEP-REQ-3.6.1-03-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003.
          When: Check G/C/D in Train type, verify the restricted result set, then check All.
          Then: G/C/D first leaves G1001 and G1002; All restores G1001, G1002 and K1003.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.6.2
      name: Filter direct trains by departure station
      description:
        text: |-
          Selecting Shanghai Hongqiao in "From Station" within "Filter" retains only services departing from that station, with at least one match remaining.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.6.2-01
        name: Filter departure station
        steps:
        - id: STEP-REQ-3.6.2-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. Only G1001 departs Shanghai Hongqiao.
          When: Select Shanghai Hongqiao in From Station within Filter.
          Then: The result set contains exactly G1001.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.6.3
      name: Filter direct trains by arrival station
      description:
        text: |-
          Selecting Beijing South in "To Station" within "Filter" retains only services arriving there, preserving at least one matching journey.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.6.3-01
        name: Filter arrival station
        steps:
        - id: STEP-REQ-3.6.3-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. G1001 and K1003 arrive Beijing South while G1002 arrives Beijing.
          When: Select Beijing South in To Station within Filter.
          Then: The result set contains exactly G1001 and K1003.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-3.6.4
      name: Filter direct trains by departure interval
      description:
        text: |-
          Selecting 06:00-12:00 in "Departure time" within "Filter" retains departures from 06:00 through 11:59, including at least one match.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-3.6.4-01
        name: Filter morning departures
        steps:
        - id: STEP-REQ-3.6.4-01-01
          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003.
          When: Select 06:00-12:00 in Departure time within Filter.
          Then: The result set contains exactly G1001, departing at 08:00.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
  - id: REQ-3.7
    name: Open default ticket search from navigation
    description:
      text: |-
        Hovering "Booking" in homepage navigation reveals "Tickets". Activating Tickets opens populated default Beijing–Shanghai results for today, with From, To, and Date reflecting that route and day.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-SEARCH-RESULT
        reference: reference/search-result.png
        page: train_results
    scenarios:
    - id: SCN-REQ-3.7-01
      name: Open Tickets quick entry
      steps:
      - id: STEP-REQ-3.7-01-01
        Given: |-
          The visitor is logged out on the homepage. The default Beijing–Shanghai timetable contains G3001 today.
        When: Hover Booking in navigation and activate Tickets.
        Then: Populated default results include G3001; From is Beijing, To is Shanghai and Date is today.
        references:
        - \ref[requirement](REQ-3.2)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-RESULT)
    children: []
- id: REQ-4
  name: Transfer discovery
  description:
    text: >-
      The system publishes services for connections as well as direct journeys. Each connection is identified by
      its first train number, and the traveler can see the details of both legs.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Discover feasible transfer plans
    description:
      text: |-
        When the selected route has no direct service, travelers can see up to ten eligible connections, initially sorted by total journey time from shortest to longest. Each plan shows both train numbers, stations, departure and arrival times, durations and fares, plus the waiting time, total journey time in minutes and a Book action. A connection needs at least 30 minutes between trains.

        For a search from Yancheng to Lhasa departing today, the published timetable offers two eligible connections. Via Beijing, D2001 runs from 08:00 to 12:00 (240 minutes, CNY 200), followed by a 60-minute wait and Z21 from 13:00 to 19:00 the next day (1,800 minutes, CNY 400). The total is 2,100 minutes. Via Xian, D2002 runs from 06:00 to 10:00 (240 minutes, CNY 180), followed by a 120-minute wait and Z22 from 12:00 to 16:00 the next day (1,680 minutes, CNY 420). The total is 2,040 minutes.

        The timetable also includes D2003 from Yancheng at 07:00 to Xining at 11:00 (CNY 190), and Z23 from Xining at 11:20 to Lhasa at 18:00 the next day (CNY 410). These are the only legs through Xining for this search. The 20-minute connection is too short and is excluded.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
      - id: IMG-SEARCH-RESULT
        reference: reference/search-result.png
        page: train_results
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Show feasible plans and segment details
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          The visitor is logged out on the homepage. The published timetable offers three candidate connections.
        When: Choose Yancheng (盐城) in From and Lhasa (拉萨) in To, choose today in Date and click Search.
        Then: 'No direct result rows remain; Transfer plans shows exactly D2002 then D2001 by total duration, excluding
          D2003. The plan beginning with D2001 shows Yancheng–Beijing 08:00–12:00 CNY 200, Z21 Beijing–Lhasa 13:00–19:00 CNY
          400, Transfer waiting 1h 0m, Total travel time: 2100 minutes and enabled Book; D2002 displays its two-hour
          wait.'
        references:
        - \ref[requirement](REQ-3.1.2)
        - \ref[requirement](REQ-3.1.3)
        - \ref[image](IMG-HOMEPAGE)
        - \ref[image](IMG-SEARCH-RESULT)
    children: []
  - id: REQ-4.2
    name: Sort transfer plans
    description:
      text: |-
        In Transfer plans, choose Departure Time to sort by the first train’s departure time in ascending order. Choose it again to reverse the order.

        In Transfer plans, choose Travel time to sort by the total journey time in minutes in ascending order. Choose it again to reverse the order.

        In Transfer plans, choose Arrival Time to sort by the second train’s arrival time in ascending order. Choose it again to reverse the order.
    scenarios: []
    children:
    - id: REQ-4.2.1
      name: Sort transfer plans by departure time
      description:
        text: |-
          In "Transfer plans", "Departure Time" sorts plans ascending by their first segment's published departure, and a second activation sorts descending. The complete current plan set is retained; arrival comparisons use the second segment's arrival clock and duration comparisons use total minutes.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-4.2.1-01
        name: Toggle transfer Departure Time
        steps:
        - id: STEP-REQ-4.2.1-01-01
          Given: |-
            The visitor has searched Yancheng to Lhasa for today; no direct trains exist, and eligible plans are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. D2002 departs at 06:00 and D2001 at 08:00.
          When: Click Departure Time within Transfer plans, inspect the order, then click again.
          Then: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
          references:
          - \ref[requirement](REQ-4.1)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-4.2.2
      name: Sort transfer plans by travel duration
      description:
        text: |-
          "Travel time" sorts plans in "Transfer plans" by total minutes ascending, then descending on a second click, without changing membership. First-segment departure and second-segment arrival clocks remain the corresponding values for the other sorts.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-4.2.2-01
        name: Toggle transfer Travel time
        steps:
        - id: STEP-REQ-4.2.2-01-01
          Given: |-
            The visitor has searched Yancheng to Lhasa for today; no direct trains exist, and eligible plans are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. D2002 totals 2040 minutes and D2001 2100.
          When: Click Travel time within Transfer plans, inspect the order, then click again.
          Then: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
          references:
          - \ref[requirement](REQ-4.1)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
    - id: REQ-4.2.3
      name: Sort transfer plans by arrival time
      description:
        text: |-
          "Arrival Time" sorts "Transfer plans" by the second segment's published arrival clock ascending, then descending, preserving all current plans. Departure refers to the first segment and duration to total minutes.
        image:
        - id: IMG-SEARCH-RESULT
          reference: reference/search-result.png
          page: train_results
      scenarios:
      - id: SCN-REQ-4.2.3-01
        name: Toggle transfer Arrival Time
        steps:
        - id: STEP-REQ-4.2.3-01-01
          Given: |-
            The visitor has searched Yancheng to Lhasa for today; no direct trains exist, and eligible plans are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. The second segments arrive at 16:00 for D2002 and 19:00 for D2001.
          When: Click Arrival Time within Transfer plans, inspect the order, then click again.
          Then: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
          references:
          - \ref[requirement](REQ-4.1)
          - \ref[image](IMG-SEARCH-RESULT)
      children: []
- id: REQ-5
