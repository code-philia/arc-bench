- id: REQ-6
  name: Personal information and security
  type: FOLDER
  dependencies: []
  description: |-
    Personal information and security capability.
  children:
  - id: REQ-6.1
    name: View personal information
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      In Personal center menu, "Personal"(role=link) exposes "User information"(role=link), Account security, and Verify mobile number. The profile_user account has profile_user@example.com, mobile 13800000030, and Password123!. Its "Essential information"(role=region) displays Account number, Name, Gender, Nationality, ID type Foreign passport, and ID number. "Contact information"(role=region) displays Email, and "Additional information"(role=region) displays Passenger type Adult.

      ![image](./reference/user-information.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Inspect personal information
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in through Login with Password123! and opened My 12306 → Personal
          → User information. The account is profile_user, with email profile_user@example.com and passenger type Adult.
      - keyword: WHEN
        content: Inspect Essential information, Contact information and Additional information.
      - keyword: THEN
        content: Essential information displays Account number, Name, Gender, Nationality, ID type, ID number and Foreign
          passport; Contact information displays Email; Additional information displays Passenger type Adult.
  - id: REQ-6.2
    name: Edit essential personal information
    type: ATOMIC
    dependencies:
    - REQ-6.1
    description: |-
      "Edit"(role=button) within "Essential information"(role=region) exposes "Gender"(role=group) with Male and Female, "Password"(role=textbox), and "Save"(role=button), leaving other essential fields read-only. The profile_essential_user account starts Male with Password123! and may save Female with Password123!X. The independent profile_invalid_password_user instead rejects bad with Please enter a valid password. and retains existing values.
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Save gender and password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in through Login with Password123! and opened My 12306 → Personal
          → User information. profile_essential_user starts with Male gender.
      - keyword: WHEN
        content: Click Edit within Essential information, select Female and enter Password123!X in Password, then click
          Save. Reload, return Home, sign out and sign in as profile_essential_user with Password123!X.
      - keyword: THEN
        content: The region returns to display mode with Edit, shows Female after save and reload, exposes no plaintext
          replacement password, and the replacement credential successfully signs in.
    - name: Reject invalid essential password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in through Login with Password123! and opened My 12306 → Personal
          → User information. profile_invalid_password_user starts Male with Password123!.
      - keyword: WHEN
        content: Click Edit within Essential information, enter bad in Password and click Save; reload, return Home,
          sign out and sign in using the original Password123!.
      - keyword: THEN
        content: Please enter a valid password. appears with Save still available; reload shows Male and the original
          password still authenticates.
  - id: REQ-6.3
    name: Edit contact and passenger type
    type: FOLDER
    dependencies:
    - REQ-6.1
    description: |-
      The "Contact information" region has an "Edit" button that reveals a labelled "Email" input and "Save" button. The verified account "profile_contact_user" with email "profile_contact_user@example.com" and password "Password123!" can save "profile_contact_next@example.com" and see it in display mode.

      The "Additional information" region has an "Edit" button that reveals a "Passenger type" combobox with "Adult" and "Child" and a "Save" button. The verified account "profile_additional_user" with password "Password123!" starts with "Adult" and can save "Child".



      Saved contact email and passenger type persist after reload.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-6.3.1
      name: Save contact email
      type: ATOMIC
      dependencies:
      - REQ-6.1
      description: |-
        In User information's "Contact information"(role=region), clicking "Edit"(role=button) exposes "Email"(role=textbox). "Save"(role=button) commits the submitted email and restores display mode with Edit available; the value persists after reload.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
      scenarios:
      - name: Save contact email
        steps:
        - keyword: GIVEN
          content: The stated verified account has signed in through Login with Password123! and opened My 12306 → Personal
            → User information. The account is profile_contact_user.
        - keyword: WHEN
          content: Click Edit in Contact information, enter profile_contact_next@example.com in Email and click Save;
            reload.
        - keyword: THEN
          content: Contact information returns to display mode with Edit and shows profile_contact_next@example.com both
            before and after reload.
    - id: REQ-6.3.2
      name: Save personal passenger type
      type: ATOMIC
      dependencies:
      - REQ-6.1
      description: |-
        In "Additional information"(role=region), "Edit"(role=button) exposes "Passenger type"(role=combobox). Choosing Child and clicking "Save"(role=button) restores display mode showing Child and Edit, with the selection retained after reload.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
      scenarios:
      - name: Save passenger type
        steps:
        - keyword: GIVEN
          content: The stated verified account has signed in through Login with Password123! and opened My 12306 → Personal
            → User information. profile_additional_user starts with Adult passenger type.
        - keyword: WHEN
          content: Click Edit in Additional information, select Child in Passenger type and click Save; reload.
        - keyword: THEN
          content: The region returns to display mode with Edit and shows Child before and after reload.
  - id: REQ-6.4
    name: Change login password securely
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      Personal exposes Account security with "Login password"(role=link), "Security mailbox"(role=region), and "Mobile number"(role=region). Opening Login password shows "Current password:"(role=textbox), "New password:"(role=textbox), "Confirm your password:"(role=textbox), "Cancel"(role=button), and "Determine"(role=button). Missing fields show Please fill in all password fields.; an incorrect current value shows Incorrect current password.; unequal new values show New passwords do not match. Valid submission persists the replacement and shows Password changed successfully.; failures retain the old password. Independent security_password_change_user and security_password_user start with Password123!, and changing the former to Password123!X does not affect the latter.

      ![image](./reference/account-security.png)
      ![image](./reference/edit-password.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Persist changed login password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. The account is security_password_change_user.
      - keyword: WHEN
        content: 'Activate Login password, enter Current password: Password123!, New password: Password123!X and Confirm
          your password: Password123!X, then click Determine. Return Home, Sign Out and log in with the replacement
          password.'
      - keyword: THEN
        content: Password changed successfully. appears and security_password_change_user authenticates with Password123!X.
    - name: Reject empty password change
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. The account is security_password_user.
      - keyword: WHEN
        content: Open Login password, leave all three password fields empty and click Determine; return Home, sign out
          and log in with Password123!.
      - keyword: THEN
        content: Please fill in all password fields. appears and the original password remains valid.
    - name: Reject incorrect current password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. The account is security_password_user.
      - keyword: WHEN
        content: 'Open Login password, enter Current password: WrongPassword123! and matching replacement Password123!X
          values, then click Determine; sign out and log in with the original password.'
      - keyword: THEN
        content: Incorrect current password. appears and Password123! still authenticates.
    - name: Reject mismatched new passwords
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. The account is security_password_user.
      - keyword: WHEN
        content: 'Open Login password, enter Current password: Password123!, New password: Password123!X and Confirm
          your password: Password123!Mismatch, then click Determine; sign out and log in with the original password.'
      - keyword: THEN
        content: New passwords do not match. appears and Password123! still authenticates.
  - id: REQ-6.5
    name: Update security mailbox
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      "Edit"(role=button) within "Security mailbox"(role=region) opens the current address and "New e-mail:"(role=textbox) with Please enter a new email address., plus "Confirm your password:"(role=textbox) with Correct password input to modify personal information. "Cancel"(role=button) abandons the form, while "Determine"(role=button) rejects missing values with Please fill in the new email and password., incorrect password with Incorrect password., and malformed email with Invalid email address format. Valid submission shows Security mailbox updated successfully. Independent profile_mailbox_update_user starts at profile_mailbox_update_user@example.com with Password123! and may save profile_user_next@example.com without changing profile_user.

      ![image](./reference/edit-email.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Persist security email
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. profile_mailbox_update_user currently
          uses profile_mailbox_update_user@example.com.
      - keyword: WHEN
        content: 'Click Edit in Security mailbox, enter New e-mail: profile_user_next@example.com and Confirm your password:
          Password123!, click Determine and reload.'
      - keyword: THEN
        content: Security mailbox updated successfully. appears; the replacement email is displayed before and after
          reload.
    - name: Reject empty mailbox change
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. profile_user currently uses profile_user@example.com.
      - keyword: WHEN
        content: 'Click Edit in Security mailbox, leave New e-mail: and Confirm your password: empty, click Determine
          and reload.'
      - keyword: THEN
        content: Please fill in the new email and password. appears; reload still displays profile_user@example.com.
    - name: Reject wrong mailbox password
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. profile_user currently uses profile_user@example.com.
      - keyword: WHEN
        content: 'Click Edit in Security mailbox, enter New e-mail: profile_user_next@example.com and Confirm your password:
          WrongPassword123!, click Determine and reload.'
      - keyword: THEN
        content: Incorrect password. appears; reload still displays the original profile_user@example.com.
    - name: Reject invalid mailbox email
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Account
          security; Login password, Security mailbox and Mobile number are visible. profile_user currently uses profile_user@example.com.
      - keyword: WHEN
        content: 'Click Edit in Security mailbox, enter New e-mail: invalid-email and Confirm your password: Password123!,
          click Determine and reload.'
      - keyword: THEN
        content: Invalid email address format. appears; reload still displays profile_user@example.com.
  - id: REQ-6.6
    name: Verify and update mobile number
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      Verify mobile number displays the old number with country code and middle four digits masked. "Region code"(role=combobox) defaults to (+86); "new mobile number:"(role=textbox) retains placeholder new mobile number., and "Confirm your password:"(role=textbox) retains Please enter the login password. "Cancel"(role=button) abandons changes; "Determine"(role=button) rejects missing values with Please fill in the new mobile number and password., wrong password with Incorrect password., and malformed mobile with Invalid mobile number format. Success shows Mobile number updated successfully. Profile_user has 13800000030 and Password123!; independent profile_mobile_update_user starts 13800000032 and may save 13800000031 without altering profile_user. No SMS flow is implied.

      ![image](./reference/verify-mobile.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Persist updated mobile
      steps:
      - keyword: GIVEN
        content: The stated verified account has signed in with Password123! and opened My 12306 → Personal → Verify
          mobile number; Region code defaults to (+86) and the old number masks its middle four digits. profile_mobile_update_user
          starts with 13800000032, displayed as (+86) 138****0032.
      - keyword: WHEN
        content: 'Enter 13800000031 in new mobile number: and Password123! in Confirm your password:, click Determine
          and reload.'
      - keyword: THEN
        content: Mobile number updated successfully. appears; the replacement 13800000031 is displayed before and after
