id: ROOT
name: 12306 railway travel
description:
  text: |-
    A railway ticketing system for searching trains, managing traveler information, booking journeys, and paying for tickets.

    Dates and times use Asia/Shanghai. The application, client, server and evaluator start at 2026-07-21T00:00:00+08:00; client and server clocks advance together with elapsed time.
scenarios: []
children:
- id: REQ-1
  name: Public entry
  description:
    text: |-
      Public entry capability.

      Action controls are buttons, navigation destinations are links, and choice controls expose combobox, radio, or checkbox semantics as declared. Selected tabs expose selected state. Forms have associated labels and retain source placeholders; visible collections contain only current results.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Explore homepage and banner carousel
    description:
      text: |-
        The default landing page shows a 12306 logo on the left and "Login"(role=link), "Register"(role=link), and "My 12306"(role=link) on the right. Navigation offers "Home"(role=link), "Booking"(role=link), and "Travel guide"(role=link), with dropdown entries where specified. "Home banners"(role=region) initially shows Banner 1; "Next banner"(role=button) displays Banner 2 and then Banner 3. Images expose those names; source assets/logo.png and assets/banner1.jpg through banner3.jpg describe visual roles without mandating network URLs. "Ticket search"(role=region) contains "From"(role=textbox) and "To"(role=textbox) with their source placeholders, "Date"(role=textbox), and "Search"(role=button). "Quick Guide"(role=region) supplies quick links including How to book tickets online? and More.

        Action controls are buttons, navigation destinations are links, and choice controls expose combobox, radio, or checkbox semantics as declared. Selected tabs expose selected state. Forms have associated labels and retain source placeholders; visible collections contain only current results.

        Client and server use Asia/Shanghai, start at 2026-07-21T00:00:00+08:00 and advance together with elapsed time.
      image:
      - id: IMG-HOMEPAGE
        reference: reference/homepage.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Browse public homepage
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: |-
          The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          Seed prerequisites (prepared before this scenario):
          - travel guidance content: {"quick_questions": ["How to book tickets online?"]}
        When: Inspect the homepage and click Next banner twice within Home banners.
        Then: The 12306 logo, Login, Register, My 12306 and Home/Booking/Travel guide navigation are visible; Banner
          1 changes to Banner 2 then Banner 3; Ticket search exposes From, To, Date and enabled Search, and Quick
          Guide exposes How to book tickets online? and More.
        references:
        - \ref[image](IMG-HOMEPAGE)
    children: []
- id: REQ-2
  name: Account access
  description:
    text: Account access capability.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Register and validate a traveler account capability
    description:
      text: |-
        Organize the page-entry and independent user behaviors for Register and validate a traveler account. REQ-2.1.1 establishes the concrete reference pages first; the remaining siblings apply their explicitly preserved source contracts. This abstract capability has no page or executable UI of its own.

        For new account: Registration UI; duplicate passport/username records are first created using registration within the same scenario. Source identities are retained in separate case worlds.
    scenarios: []
    children:
    - id: REQ-2.1.1
      name: Open traveler registration
      description:
        text: |-
          Follow Register from the public header. Registration displays Nationality, Name, Passport number, Password, Confirm Password, and the Register submit action.

          This requirement establishes the page entry and visible reference state before sibling behaviors. It does not implement their validation or state transitions. Every case establishes its own preconditions through the existing UI; tests do not depend on previous cases.

          Preserved presentation and source context:
          Allow a user to create an account by filling in identity and contact information, agreeing to the service terms, and submitting the registration form.

          Open the registration page from the "Register" link in the top-right area of the home page.

          Display the registration form with a dropdown labeled "Nationality" showing the default value "Please select" and country options, input fields labeled "Name", "Passport number", "Username", and "Email address", date pickers labeled "Passport expiration date" and "Date of birth", a radio group labeled "Gender" with "Male" and "Female", password fields labeled "Password" and "Confirm Password", a checkbox followed by "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and a "Register" button.

          The registration form allows a new user to select Nationality "China", enter Name, Passport number, Passport expiration date, Date of birth, Username, Password, Confirm Password, and Email address in labeled controls, select a Gender radio and the agreement checkbox, then activate the "Register" button. A successful submission persists the account and displays "Registration successful.". The passport number and username must be unique.

          Reject registration when any required field is missing and show the message "Please fill in all required fields.".

          Reject registration when the passport number already exists and show the message "Passport number already exists.". The duplicate-passport scenario first creates the account with passport P20260002 through registration; this is not an additional preloaded duplicate account.

          Reject registration when the username already exists and show the message "Username already exists.". The duplicate-username scenario first creates username_taken through registration; this name must not already be occupied in the fresh scenario world.

          Reject registration when the values in "Password" and "Confirm Password" do not match and show the message "Passwords do not match.".

          Reject registration when the email address format is invalid and show the message "Invalid email address format.".

          Reject registration when the agreement checkbox is not selected and show the message "Please agree to the Terms of Service and Privacy Policy.".

          Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

          Confirm Password is a required registration field independently of Password; an empty confirmation uses the missing-required-fields error.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
      scenarios:
      - id: SCN-REQ-2.1.1-01
        name: Open traveler registration
        steps:
        - id: STEP-REQ-2.1.1-01-01
          Given: A signed-out visitor is on the public homepage.
          When: Follow Register from the public header.
          Then: Registration displays Nationality, Name, Passport number, Password, Confirm Password, and the Register
            submit action.
          references:
          - \ref[requirement](REQ-1.1)
          - \ref[image](IMG-HOMEPAGE)
          - \ref[image](IMG-REGISTER)
      children: []
    - id: REQ-2.1.2
      name: Create a traveler account
      description:
        text: |-
          Clicking "Register"(role=link) opens traveler registration with "Nationality"(role=combobox), "Name"(role=textbox), "Passport number"(role=textbox), "Passport expiration date"(role=textbox), "Date of birth"(role=textbox), "Gender"(role=group), "Username"(role=textbox), "Password"(role=textbox), "Confirm Password"(role=textbox), and "Email address"(role=textbox). Users provide valid identity and credential values, accept "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn."(role=checkbox), and click "Register"(role=button). Registration creates and persists that identity, whose saved credentials authenticate the same account. The parent capability's full registration rules apply.

          Shared source contract (preserved from REQ-2.1):
          Allow a user to create an account by filling in identity and contact information, agreeing to the service terms, and submitting the registration form.

          Open the registration page from the "Register" link in the top-right area of the home page.

          Display the registration form with a dropdown labeled "Nationality" showing the default value "Please select" and country options, input fields labeled "Name", "Passport number", "Username", and "Email address", date pickers labeled "Passport expiration date" and "Date of birth", a radio group labeled "Gender" with "Male" and "Female", password fields labeled "Password" and "Confirm Password", a checkbox followed by "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and a "Register" button.

          The registration form allows a new user to select Nationality "China", enter Name, Passport number, Passport expiration date, Date of birth, Username, Password, Confirm Password, and Email address in labeled controls, select a Gender radio and the agreement checkbox, then activate the "Register" button. A successful submission persists the account and displays "Registration successful.". The passport number and username must be unique.

          Reject registration when any required field is missing and show the message "Please fill in all required fields.".

          Reject registration when the passport number already exists and show the message "Passport number already exists.". The duplicate-passport scenario first creates the account with passport P20260002 through registration; this is not an additional preloaded duplicate account.

          Reject registration when the username already exists and show the message "Username already exists.". The duplicate-username scenario first creates username_taken through registration; this name must not already be occupied in the fresh scenario world.

          Reject registration when the values in "Password" and "Confirm Password" do not match and show the message "Passwords do not match.".

          Reject registration when the email address format is invalid and show the message "Invalid email address format.".

          Reject registration when the agreement checkbox is not selected and show the message "Please agree to the Terms of Service and Privacy Policy.".

          Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

          Confirm Password is a required registration field independently of Password; an empty confirmation uses the missing-required-fields error.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-2.1.2-01
        name: Create durable account
        steps:
        - id: STEP-REQ-2.1.2-01-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
            Username traveler_new, email traveler_new@example.com and passport P20260001 are unused.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept
            the Terms of Service and Privacy Policy checkbox. Enter Passport number P20260001, Username traveler_new
            and Email address traveler_new@example.com, then click Register. Return Home, sign out if signed in,
            reload, use Login to submit traveler_new / Password123!, then reload again.
          Then: Registration successful. is displayed; the saved credentials sign in after reload, and Sign Out
            remains visible after the second reload.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      children: []
    - id: REQ-2.1.3
      name: Reject invalid traveler registration
      description:
        text: |-
          After "Register"(role=link) opens registration, users complete "Nationality"(role=combobox), "Name"(role=textbox), "Passport number"(role=textbox), "Passport expiration date"(role=textbox), "Date of birth"(role=textbox), "Gender"(role=group), "Username"(role=textbox), "Password"(role=textbox), "Confirm Password"(role=textbox), "Email address"(role=textbox), and "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn."(role=checkbox). "Register"(role=button) rejects missing, duplicate, mismatched, invalid, or unaccepted information with the parent capability's declared errors, retains the form, and creates no account.

          Shared source contract (preserved from REQ-2.1):
          Allow a user to create an account by filling in identity and contact information, agreeing to the service terms, and submitting the registration form.

          Open the registration page from the "Register" link in the top-right area of the home page.

          Display the registration form with a dropdown labeled "Nationality" showing the default value "Please select" and country options, input fields labeled "Name", "Passport number", "Username", and "Email address", date pickers labeled "Passport expiration date" and "Date of birth", a radio group labeled "Gender" with "Male" and "Female", password fields labeled "Password" and "Confirm Password", a checkbox followed by "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and a "Register" button.

          The registration form allows a new user to select Nationality "China", enter Name, Passport number, Passport expiration date, Date of birth, Username, Password, Confirm Password, and Email address in labeled controls, select a Gender radio and the agreement checkbox, then activate the "Register" button. A successful submission persists the account and displays "Registration successful.". The passport number and username must be unique.

          Reject registration when any required field is missing and show the message "Please fill in all required fields.".

          Reject registration when the passport number already exists and show the message "Passport number already exists.". The duplicate-passport scenario first creates the account with passport P20260002 through registration; this is not an additional preloaded duplicate account.

          Reject registration when the username already exists and show the message "Username already exists.". The duplicate-username scenario first creates username_taken through registration; this name must not already be occupied in the fresh scenario world.

          Reject registration when the values in "Password" and "Confirm Password" do not match and show the message "Passwords do not match.".

          Reject registration when the email address format is invalid and show the message "Invalid email address format.".

          Reject registration when the agreement checkbox is not selected and show the message "Please agree to the Terms of Service and Privacy Policy.".

          Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

          Confirm Password is a required registration field independently of Password; an empty confirmation uses the missing-required-fields error.
        image:
        - id: IMG-REGISTER
          reference: reference/register.png
          page: register
      scenarios:
      - id: SCN-REQ-2.1.3-01
        name: Reject missing fields
        steps:
        - id: STEP-REQ-2.1.3-01-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Register and click its Register button without filling the form.
          Then: Please fill in all required fields. appears; Username remains visible and Registration successful.
            is absent.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-02
        name: Reject duplicate passport
        steps:
        - id: STEP-REQ-2.1.3-02-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Through Register create existing_passport with passport P20260002 and email existing_passport@example.com
            using the valid identity fields and Password123!; return Home and sign out if needed. Reopen Register,
            Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31, Date of
            birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept the Terms
            of Service and Privacy Policy checkbox. enter the same passport P20260002, Username duplicate_passport_user
            and Email address duplicate_passport_user@example.com, and submit Register.
          Then: Passport number already exists. appears; the registration form remains and no success feedback is
            shown for the duplicate attempt.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-03
        name: Reject duplicate username
        steps:
        - id: STEP-REQ-2.1.3-03-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Create username_taken through Register with passport P20260104 and email username_taken@example.com
            using valid identity data and Password123!; return Home and sign out if needed. Reopen Register, Select
            China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31, Date of birth 1996-06-18,
            select Male, enter Password and Confirm Password Password123!, and accept the Terms of Service and Privacy
            Policy checkbox. enter passport P20260004, the existing Username username_taken and Email address username_taken@example.com,
            and click Register.
          Then: Username already exists. appears; Username remains on the form and the duplicate attempt shows no
            registration success.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-04
        name: Reject password mismatch
        steps:
        - id: STEP-REQ-2.1.3-04-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept
            the Terms of Service and Privacy Policy checkbox. Enter passport P20260007, Username traveler_mismatch
            and Email address traveler_mismatch@example.com; replace Confirm Password with Password123!Mismatch
            and submit Register.
          Then: Passwords do not match. appears; Username remains visible and no registration success is shown.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-05
        name: Reject invalid email
        steps:
        - id: STEP-REQ-2.1.3-05-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept
            the Terms of Service and Privacy Policy checkbox. Enter passport P20260008, Username traveler_invalid_email
            and Email address invalid-email, then submit Register.
          Then: Invalid email address format. appears; the form remains and no registration success is shown.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-06
        name: Require agreement acceptance
        steps:
        - id: STEP-REQ-2.1.3-06-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Register and fill China, Test Traveler, passport P20260009, expiration 2026-12-31, birth 1996-06-18,
            Male, Username traveler_agreement, matching Password123! values and email traveler_agreement@example.com;
            leave the agreement unchecked and click Register.
          Then: Please agree to the Terms of Service and Privacy Policy. appears; the form remains without registration
            success.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      - id: SCN-REQ-2.1.3-07
        name: Reject missing confirmation password
        steps:
        - id: STEP-REQ-2.1.3-07-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept
            the Terms of Service and Privacy Policy checkbox. Enter passport P20260015, Username traveler_missing_confirm
            and email traveler_missing_confirm@example.com; clear Confirm Password and click Register.
          Then: Please fill in all required fields. appears; Confirm Password remains visible and registration success
            is absent.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-REGISTER)
      children: []
  - id: REQ-2.2
    name: Log in with username email or mobile capability
    description:
      text: |-
        Organize the page-entry and independent user behaviors for Log in with username email or mobile. REQ-2.2.1 establishes the concrete reference pages first; the remaining siblings apply their explicitly preserved source contracts. This abstract capability has no page or executable UI of its own.

        For authenticated session: Login UI; fresh browser starts logged out.
    scenarios: []
    children:
    - id: REQ-2.2.1
      name: Open credential login
      description:
        text: |-
          Follow Login from the public header. The login page displays Email/Username/Mobile number, Password, and LOGIN without authenticating merely by navigation.

          This requirement establishes the page entry and visible reference state before sibling behaviors. It does not implement their validation or state transitions. Every case establishes its own preconditions through the existing UI; tests do not depend on previous cases.

          Preserved presentation and source context:
          Allow a user to log in with a username, email address, or mobile number and a password. The system contains the verified account registered_user with username "registered_user", email "registered_user@example.com", mobile number "13800000010", ID number "P20260010", and password "Password123!".

          Open the login page from the "Login" link in the top-right area of the home page.

          Display the login form with an input field whose placeholder is "Email/Username/Mobile number", a password input whose placeholder is "Password", and a "LOGIN" button.

          The login form accepts a verified username, email address, or mobile number in its "Email/Username/Mobile number" field and a password in its "Password" field. Activating the "LOGIN" button with valid credentials persists the session, displays a status message containing "Login successful", and exposes a "Sign Out" link. The seeded account "registered_user" has password "Password123!".

          Reject login when the account field or password field is empty and show the message "Please enter your username/email/phone number and password.".

          Reject login when the entered username, email address, or mobile number does not exist and show the message "User not found.".

          Reject login when the password is incorrect and show the message "Incorrect password.".

          Provide a link with the text "No account yet? Register now." on the login page and navigate to the registration page after it is clicked.
        image:
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
      scenarios:
      - id: SCN-REQ-2.2.1-01
        name: Open credential login
        steps:
        - id: STEP-REQ-2.2.1-01-01
          Given: A signed-out visitor is on the public homepage.
          When: Follow Login from the public header.
          Then: The login page displays Email/Username/Mobile number, Password, and LOGIN without authenticating
            merely by navigation.
          references:
          - \ref[requirement](REQ-1.1)
          - \ref[image](IMG-HOMEPAGE)
          - \ref[image](IMG-LOGIN)
      children: []
    - id: REQ-2.2.2
      name: Authenticate traveler credentials
      description:
        text: |-
          "Login"(role=link) opens credential login. A logged-out traveler enters a username, email, or mobile in "Email/Username/Mobile number"(role=textbox), enters "Password"(role=textbox), and clicks "LOGIN"(role=button). Correct credentials establish the same account's persisted session; incorrect credentials leave the user logged out under the capability's declared errors. Either missing account or missing password independently triggers the required-credentials error, even if the other field is supplied.

          Shared source contract (preserved from REQ-2.2):
          Allow a user to log in with a username, email address, or mobile number and a password. The system contains the verified account registered_user with username "registered_user", email "registered_user@example.com", mobile number "13800000010", ID number "P20260010", and password "Password123!".

          Open the login page from the "Login" link in the top-right area of the home page.

          Display the login form with an input field whose placeholder is "Email/Username/Mobile number", a password input whose placeholder is "Password", and a "LOGIN" button.

          The login form accepts a verified username, email address, or mobile number in its "Email/Username/Mobile number" field and a password in its "Password" field. Activating the "LOGIN" button with valid credentials persists the session, displays a status message containing "Login successful", and exposes a "Sign Out" link. The seeded account "registered_user" has password "Password123!".

          Reject login when the account field or password field is empty and show the message "Please enter your username/email/phone number and password.".

          Reject login when the entered username, email address, or mobile number does not exist and show the message "User not found.".

          Reject login when the password is incorrect and show the message "Incorrect password.".

          Provide a link with the text "No account yet? Register now." on the login page and navigate to the registration page after it is clicked.
        image:
        - id: IMG-LOGIN
          reference: reference/login.png
          page: login
        - id: IMG-HOMEPAGE
          reference: reference/homepage.png
          page: home
      scenarios:
      - id: SCN-REQ-2.2.2-01
        name: Authenticate by username email and mobile
        steps:
        - id: STEP-REQ-2.2.2-01-01
          Given: |-
            The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. The verified registered_user identity has email registered_user@example.com, mobile 13800000010 and password Password123!.
            Seed prerequisites (prepared before this scenario):
            - verified account directory: {"accounts": [{"username": "registered_user", "email": "registered_user@example.com", "password": "Password123!", "verified": true, "gender": "Male", "passenger_type": "Adult"}], "specific_identity": {"registered_user": {"passport": "P20260010", "mobile": "13800000010"}}, "other_identity": "Each other account has a distinct unused passport assigned by evaluator; use source username as holder name, nationality China, ID type Foreign passport. Holder automatically appears as nondeletable frequent passenger. No other frequent passengers/current orders initially."}
          When: For each of registered_user, registered_user@example.com and 13800000010, open Login, enter the
            identity and Password123! and click LOGIN; reload after each successful login and then click Sign Out
            before trying the next identity.
          Then: Each identity displays Login successful and Sign Out persists after reload; each sign-out restores
            Login and removes Sign Out.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-02
        name: Reject empty credentials
        steps:
        - id: STEP-REQ-2.2.2-02-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
          When: Open Login, leave Email/Username/Mobile number and Password empty and click LOGIN.
          Then: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-03
        name: Reject unknown account
        steps:
        - id: STEP-REQ-2.2.2-03-01
          Given: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
            unknown_account does not exist.
          When: Open Login, enter unknown_account and Password123!, and click LOGIN.
          Then: User not found. appears and Sign Out remains unavailable.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[image](IMG-LOGIN)
          - \ref[image](IMG-HOMEPAGE)
      - id: SCN-REQ-2.2.2-04
        name: Reject wrong password
        steps:
        - id: STEP-REQ-2.2.2-04-01
          Given: |-
