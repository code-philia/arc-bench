            K1003. The visitor is anonymous.
          When: Click Book within G1001.
          Then: "The Login dialog displays the 12306 icon and Login heading, Email/Username/Mobile number, Password and LOGIN; Train Information: booking heading is not shown."
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[requirement](REQ-8.1.1)
