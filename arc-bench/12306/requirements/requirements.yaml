          Given: >-
            The visitor has searched Shanghai to Beijing for today; published results are G1001, G1002 and
            K1003. The anonymous visitor has clicked Book for G1001 and the Login dialog is open.
          When: Activate Forgot your password within Login.
          Then: 'Public recovery exposes Email:, ID number: and submit.'
