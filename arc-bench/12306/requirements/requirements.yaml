          Activate Book for the G1001 result. The Login dialog displays Email/Username/Mobile number, Password, and LOGIN instead of entering booking.
        image:
        - id: IMG-LOGIN-FORM
          reference: reference/login-form.png
          page: train_results
      scenarios:
