  children:
  - id: REQ-9.1
    name: Read travel guide categories
    description:
      text: |-
        "Travel guide" opens one unified guide with "Ticketing", "Endorsement and refund", and "Miscellaneous". Each selected tab shows its matching guidance. Navigation dropdown and homepage Quick Guide provide additional entry routes to these same categories.
