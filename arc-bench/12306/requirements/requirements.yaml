        Upcoming trips shows the traveler’s paid future bookings with Train No., Departure date, Departure station, Arrival station and Operation. The view may also show passenger, seat, price, status and total price. Transfer tickets are grouped by journey. A refundable booking offers Refund before its deadline.

        Travelers can search by booking date or departure date over an inclusive range, with an optional partial order number, train number or passenger name. Search returns orders matching both conditions. Show the empty-state illustration when there are no matches and “Please enter a valid search condition.” for an invalid keyword such as ***.
