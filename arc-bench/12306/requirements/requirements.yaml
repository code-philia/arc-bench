          When: Activate Book for the G1001 result.
          Then: The Login dialog displays Email/Username/Mobile number, Password, and LOGIN instead of entering
            booking.
          references:
          - \ref[requirement](REQ-3.2)
          - \ref[image](IMG-LOGIN-FORM)
      children: []
