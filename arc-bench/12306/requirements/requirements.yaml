- id: REQ-7
  name: Passenger management
  description:
    text: >-
      Travelers can manage frequent passengers on their account. The account holder’s passenger record is
      provided automatically and is protected from deletion. Names and passport identities are visible in
      passenger records.
  scenarios: []
  children:
  - id: REQ-7.1
    name: View passenger list with protected account holder
    description:
      text: |-
        "Information management" exposes "My Passengers", showing columns Name, ID type, ID number, Mobile number, and Operation, with "All" and scoped "Delete" maintenance. The account holder’s passenger record is always present and is protected from deletion. For example, a traveler can add Passenger Example with passport P20269999, expiration 2027-12-31, birth 2000-01-15, China, Female, passenger@example.com, 13800000040, and Adult; the traveler can add and later delete this passenger through My Passengers.
      image:
      - id: IMG-USER-CENTER
        reference: reference/user-center.png
        page: personal_center
      - id: IMG-MY-PASSENGERS
        reference: reference/my-passengers.png
        page: passengers
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Inspect passenger table and protected holder
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected.
        When: Inspect passenger headers and the account-holder row.
        Then: All, Name, ID type, ID number, Mobile number and Operation headers are visible; the passenger_manager_user
          row offers no Delete action.
        references:
        - \ref[requirement](REQ-5.1.2)
        - \ref[image](IMG-USER-CENTER)
        - \ref[image](IMG-MY-PASSENGERS)
    children: []
  - id: REQ-7.2
    name: Add and validate frequent passenger
    description:
      text: |-
        Add new passengers opens a form for nationality, name, passport number and expiration date, date of birth, gender, email address, mobile number and passenger type (Adult or Child). Cancel abandons the entry. Confirming valid details adds a passenger, persists the record and shows “Passenger added successfully.”.

        The form remains open and adds no passenger on validation errors. Missing required information shows “Please fill in all required fields.”, a duplicate passport shows “Passport number already exists.”, malformed email shows “Invalid email address format.”, and malformed mobile shows “Invalid mobile number format.”
      image:
      - id: IMG-ADD-PASSENGER
        reference: reference/add-passenger.png
        page: passengers
    scenarios:
    - id: SCN-REQ-7.2-01
      name: Add passenger with durable identity
      steps:
      - id: STEP-REQ-7.2-01-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passport P20269996 is unused.
        When: Click Add new passengers; enter Added Passenger, P20269996, China, expiration 2028-12-31, birth 1999-02-20,
          Male, Adult, added.passenger@example.com and 13800000043, then click Determine; reload.
        Then: Passenger added successfully. appears; exactly one P20269996 row identifies Added Passenger before
          and after reload.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-ADD-PASSENGER)
    - id: SCN-REQ-7.2-02
      name: Reject empty passenger form
      steps:
      - id: STEP-REQ-7.2-02-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected.
        When: Click Add new passengers, inspect its form controls and Cancel, then click Determine without entering
          required values.
        Then: Nationality, Name, Passport number, expiration, birth, Gender, Email address, Mobile number and Passenger
          type are visible; Please fill in all required fields. appears and the dialog remains open.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-ADD-PASSENGER)
    - id: SCN-REQ-7.2-03
      name: Reject duplicate passenger passport
      steps:
      - id: STEP-REQ-7.2-03-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passenger Example has been created through Add new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040, then Determine.
        When: Open Add new passengers and fill Duplicate Passenger with existing passport P20269999 and otherwise
          valid China, expiration 2028-12-31, birth 1999-02-20, Male, Adult, added.passenger@example.com and 13800000043,
          then Determine.
        Then: Passport number already exists. appears; the dialog stays open and no Duplicate Passenger row is added.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-ADD-PASSENGER)
    - id: SCN-REQ-7.2-04
      name: Reject passenger invalid email
      steps:
      - id: STEP-REQ-7.2-04-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passenger Example has been created through Add new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040, then Determine.
        When: Open Add new passengers and fill Invalid Email Passenger, passport P20260013, China, expiration 2028-12-31,
          birth 1999-02-20, Male, Adult, Email address invalid-email and Mobile number 13800000043, then Determine.
        Then: Invalid email address format. appears; the dialog remains and no Invalid Email Passenger row is added.
        references:
        - \ref[requirement](REQ-7.1)
        - \ref[image](IMG-ADD-PASSENGER)
    children: []
  - id: REQ-7.3
    name: Delete passenger or dismiss confirmation
    description:
      text: |-
        Allow the user to choose "Delete" in the "Operation" column for one passenger row other than the current account, open a confirmation dialog with the text "Are you sure you want to delete this passenger?" and the choices "Cancel" and "Confirm", delete the passenger and show a successful delete message after clicking "Confirm", or cancel the operation after clicking "Cancel".

        Confirmed deletions persist across reload; dismissed operations leave the passenger unchanged.
    scenarios: []
    children:
    - id: REQ-7.3.1
      name: Confirm deletion of one passenger
      description:
        text: |-
          Clicking "Delete" on the identified non-holder passenger opens "Are you sure you want to delete this passenger?" with "Cancel" and "Confirm". Confirm removes that passenger with success feedback, and its absence persists after reload.
        image:
        - id: IMG-MY-PASSENGERS
          reference: reference/my-passengers.png
          page: passengers
      scenarios:
      - id: SCN-REQ-7.3.1-01
        name: Confirm passenger deletion
        steps:
        - id: STEP-REQ-7.3.1-01-01
          Given: |-
            A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Delete Passenger/P20269981 was created on the site.
          When: Click Delete in the P20269981 row, then Confirm in Are you sure you want to delete this passenger?;
            reload after success.
          Then: The dialog closes, Passenger deleted successfully. appears, and P20269981 is absent before and after
            reload.
          references:
          - \ref[requirement](REQ-7.2)
          - \ref[image](IMG-MY-PASSENGERS)
      children: []
    - id: REQ-7.3.2
      name: Dismiss deletion of one passenger
      description:
        text: |-
          "Delete" on an identified non-holder passenger opens "Are you sure you want to delete this passenger?", offering "Confirm" and "Cancel". Cancel closes the dialog and retains that passenger, including after reload.
        image:
        - id: IMG-MY-PASSENGERS
          reference: reference/my-passengers.png
          page: passengers
      scenarios:
      - id: SCN-REQ-7.3.2-01
        name: Dismiss passenger deletion
        steps:
        - id: STEP-REQ-7.3.2-01-01
          Given: |-
            A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Cancel Passenger/P20269982 was created on the site.
          When: Click Delete in the P20269982 row, then Cancel in Are you sure you want to delete this passenger?;
            reload.
          Then: The dialog closes and P20269982 remains visible before and after reload.
          references:
          - \ref[requirement](REQ-7.2)
          - \ref[image](IMG-MY-PASSENGERS)
      children: []
  - id: REQ-7.4
    name: Delete selected passengers as a batch
    description:
      text: |-
        Users select deletable passenger rows by "Select {passport number}", or select all deletable rows through "All". "Batch deletion" opens "Are you sure you want to delete the selected passengers?". "Confirm" deletes only selected passengers with success feedback and persists their absence, preserving the holder and unselected records. "Cancel" dismisses without deleting. Business identity determines selection.
      image:
      - id: IMG-MY-PASSENGERS
        reference: reference/my-passengers.png
        page: passengers
    scenarios:
    - id: SCN-REQ-7.4-01
      name: Select all protects holder
      steps:
      - id: STEP-REQ-7.4-01-01
        Given: |-
          A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Batch Passenger One/P20269983 and Batch Passenger Two/P20269984 were created on the site.
        When: Check All, click Batch deletion and Confirm in Are you sure you want to delete the selected passengers?.
        Then: Passengers deleted successfully. appears, both deletable passengers disappear and passenger_manager_user
          remains visible.
        references:
        - \ref[requirement](REQ-7.2)
        - \ref[image](IMG-MY-PASSENGERS)
    children: []
  - id: REQ-7.5
    name: Search and clear passenger filters
    description:
      text: |-
        Provide a search input above the passenger table for a passenger name or ID number and a "Search" action, allow the user to search by passenger name or ID number, and show the matching passenger information.

        Clearing the passenger search empties the search field and restores the full passenger list.
    scenarios: []
    children:
    - id: REQ-7.5.1
      name: Search frequent passengers by name or identity
      description:
        text: |-
          On My Passengers, users enter a name or passport in the passenger search field and click "Search". The list shows matching passenger identities and excludes nonmatching rows.
        image:
        - id: IMG-MY-PASSENGERS
          reference: reference/my-passengers.png
          page: passengers
      scenarios:
      - id: SCN-REQ-7.5.1-01
        name: Search passenger name
        steps:
        - id: STEP-REQ-7.5.1-01-01
          Given: |-
            A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passenger Example has been created through Add new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created on the site.
          When: Enter Passenger Example in the passenger search field and click Search.
          Then: P20269999 displays Passenger Example and the nonmatching P20269982 row is hidden.
          references:
          - \ref[requirement](REQ-7.2)
          - \ref[image](IMG-MY-PASSENGERS)
      - id: SCN-REQ-7.5.1-02
        name: Search passenger ID
        steps:
        - id: STEP-REQ-7.5.1-02-01
          Given: |-
            A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passenger Example has been created through Add new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created on the site.
          When: Enter P20269999 in the passenger search field and click Search.
          Then: P20269999 displays Passenger Example and the nonmatching P20269982 row is hidden.
          references:
          - \ref[requirement](REQ-7.2)
          - \ref[image](IMG-MY-PASSENGERS)
      children: []
    - id: REQ-7.5.2
      name: Clear the passenger search
      description:
        text: |-
          Clearing the passenger search empties the query and restores the full passenger list, including previously hidden records.
        image:
        - id: IMG-MY-PASSENGERS
          reference: reference/my-passengers.png
          page: passengers
      scenarios:
      - id: SCN-REQ-7.5.2-01
        name: Clear passenger search
        steps:
        - id: STEP-REQ-7.5.2-01-01
          Given: |-
            A traveler has registered as passenger_manager_user, signed in and opened My 12306 → Information management → My Passengers. The account holder’s passenger record is protected. Passenger Example has been created through Add new passengers using China, passport P20269999, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040, then Determine. Cancel Passenger/P20269982 has also been created on the site.
          When: Search for Passenger Example, verify Cancel Passenger is hidden, then clear the passenger search.
          Then: The query becomes empty and both P20269999 and previously excluded P20269982 return.
          references:
          - \ref[requirement](REQ-7.2)
          - \ref[requirement](REQ-7.5.1)
          - \ref[image](IMG-MY-PASSENGERS)
      children: []
- id: REQ-8
  name: Booking and payment
  description:
    text: |-
      Travelers search for a train, choose a passenger and ticket class, and confirm to place an order. Payment, refund and cancellation apply to that order.

      For the G1001 booking example, the system provides verified accounts such as bookable_user and booking_submit_user, each with one business-class seat allocation. The example accounts sign in with Password123!. The allocation is separate for each account. An account’s displayed availability reflects its orders and seat holds. The system also provides a bookable business-class seat on tomorrow’s G2002 and eligible refund deadlines for tomorrow’s G1001 and G2002.
