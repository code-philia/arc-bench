  - id: REQ-8.2
    name: Select train and passengers on booking form
    type: FOLDER
    dependencies:
    - REQ-2.2.1
    - REQ-3.2
    - REQ-7.2
    description: |-
      Provide a booking form after the user clicks "Book" in the G1001 result row. ![image](./reference/booking-1.png) The seeded account bookable_user has password "Password123!" and passenger "Passenger Example" with passport "P20269997"; the separately seeded account booking_submit_user has password "Password123!" and passenger "Passenger Example" with passport "P20269998". For 2026-07-21, the Shanghai-to-Beijing train G1001 offers one business-class seat at ￥1870.0, no first-class or second-class seats, and enough standing tickets at ￥576.0.

      After the user clicks one "Book" button for a valid train result, open the booking form page with a visible "Train Information" section heading. ![image](./reference/booking-1.png)

      Display the booking information section with the title "Train Information:" and the selected train details, including departure place, destination, departure date, train number, seat type, price, current remaining ticket information such as "business-class seat ( ￥1870.0 ) 32% off 1 left", "first-class seat ( ￥967.0 ) 24% off None left", "second-class seat ( ￥576.0 ) 27% off None left", and "standing ticket ( ￥576.0 ) 27% off Enough left", and a visible "Place order" button on the booking form page.

      The "Passenger Information:" section exposes a checkbox named "Passenger Example" in its frequent passenger list. Selected passengers appear in the "Booking passengers" table with columns "Ticket class", "Ticket type", "Name", "ID type", "ID number", "Nationality", and "Operation". Each passenger row has a "Ticket class" combobox offering "Business-class seat", "First-class seat", "Second-class seat", and "Standing ticket", a "Ticket type" combobox offering "Adult" and "Child", and a "Delete" button. "Place order" remains available.

      Provide a link with the text "I have read and agree to the Terms of Service" on the booking form page and navigate to the terms page that contains the title "Terms of Service" after it is clicked.



      Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

      The selected-train information is a named region Train Information, containing the Train Information: heading and selected journey details. It is scoped by user-visible semantics, not DOM structure.

      Delete removes a selected passenger from the booking selection while retaining the frequent-passenger record. Ticket class and Ticket type reflect the selected options.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-8.2.1
      name: Inspect the selected journey on its booking form
      type: ATOMIC
      dependencies:
      - REQ-2.2.1
      - REQ-3.2
      description: |-
        An authenticated traveler clicks "Book"(role=button) for G1001. "Train Information"(role=region) preserves that train's route and date, shows the declared fares, discounts, and remaining inventory, and offers "Place order"(role=button).
      data:
        requires:
        - DATA-TIMETABLE
        - DATA-PASSENGERS
        - DATA-SELECTION
      scenarios:
      - name: Inspect selected train and availability
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
            Example has passport P20269997.
        - keyword: WHEN
          content: Inspect Train Information and Place order.
        - keyword: THEN
          content: 'Train Information: heading is visible; the region preserves G1001, Shanghai, Beijing and July 21,
            and displays business-class ￥1870.0/32% off/1 left, first-class ￥967.0/24% off/None left, second-class ￥576.0/27%
            off/None left and standing ￥576.0/27% off/Enough left; Place order is available.'
    - id: REQ-8.2.2
      name: Choose and remove booking passengers
      type: FOLDER
      dependencies:
      - REQ-8.2.1
      - REQ-7.2
      description: |-
        On a selected journey, check a frequent passenger to add exactly one booking row with the declared identity and headers. Choose Ticket class and Ticket type in that row. Delete removes the booking selection while retaining the frequent-passenger record; submitting an empty selection yields the no-passenger error.

        Child is selectable as Ticket type in the booking passenger row and changes that selection without changing passenger identity. This scenario does not prescribe a child-fare formula.
      children:
      - id: REQ-8.2.2.1
        name: Select and configure booking passengers
        type: ATOMIC
        dependencies:
        - REQ-8.2.1
        - REQ-7.2
        description: |-
          Selecting "Passenger Example"(role=checkbox) creates exactly one identity-preserving row in "Booking passengers"(role=table). Users configure "Ticket class"(role=combobox) and "Ticket type"(role=combobox) with Adult or Child, with scoped "Delete"(role=button) available before "Place order"(role=button). The parent capability's selection and fare rules apply.
        data:
          requires:
          - DATA-TIMETABLE
          - DATA-PASSENGERS
          - DATA-SELECTION
        scenarios:
        - name: Select and configure booking passenger
          steps:
          - keyword: GIVEN
            content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
              using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
              searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
              Example has passport P20269997.
          - keyword: WHEN
            content: Check Passenger Example, then select Business-class seat in Ticket class and Adult in Ticket type within
              the P20269997 row.
          - keyword: THEN
            content: Booking passengers exposes Ticket class, Ticket type, Name, ID type, ID number, Nationality and Operation
              headers; exactly one P20269997 row identifies Passenger Example with both selections, scoped Delete and Place
              order available.
        - name: Configure a child booking ticket
          steps:
          - keyword: GIVEN
            content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
              using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
              searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
              Example has passport P20269997.
          - keyword: WHEN
            content: Check Passenger Example and select Child in Ticket type within P20269997.
          - keyword: THEN
            content: Child is the selected ticket type and exactly one row still identifies Passenger Example/P20269997.
      - id: REQ-8.2.2.2
        name: Remove a passenger from booking selection
        type: ATOMIC
        dependencies:
        - REQ-8.2.2.1
        description: |-
          After selecting "Passenger Example"(role=checkbox) and configuring "Ticket class"(role=combobox) and "Ticket type"(role=combobox), users click "Delete"(role=button) in its "Booking passengers"(role=table) row. This removes only booking selection, preserving the frequent passenger. "Place order"(role=button) with the now-empty selection shows the declared no-passenger error under the shared contract.
        data:
          requires:
          - DATA-TIMETABLE
          - DATA-PASSENGERS
          - DATA-SELECTION
        scenarios:
        - name: Remove selected booking passenger
          steps:
          - keyword: GIVEN
            content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
              using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
              searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
              Example has passport P20269997. Passenger Example is checked and appears in Booking passengers.
          - keyword: WHEN
            content: Click Delete within P20269997, then click Place order with no selected passenger.
          - keyword: THEN
            content: The booking row disappears; Please select at least one passenger. appears and no confirmation opens;
              the frequent passenger remains available for selection.
    - id: REQ-8.2.3
      name: Read the booking agreement
      type: ATOMIC
      dependencies:
      - REQ-8.2.1
      - REQ-2.5.1
      description: |-
        Following "I have read and agree to the Terms of Service"(role=link) from booking displays Terms of Service heading without placing an order.
      data:
        requires:
        - DATA-TIMETABLE
        - DATA-PASSENGERS
        - DATA-SELECTION
      scenarios:
      - name: Read booking terms
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
            Example has passport P20269997.
        - keyword: WHEN
          content: Activate I have read and agree to the Terms of Service.
        - keyword: THEN
          content: The Terms of Service heading is displayed.
  - id: REQ-8.3
    name: Validate submission and confirm or edit order
    type: FOLDER
    dependencies:
    - REQ-8.2.2.1
    description: |-
      Provide the buttons "Previous step" and "Place order" on the booking form page. When the user clicks "Place order" with at least one selected passenger and all selected ticket classes still having available tickets, open the "Please confirm the following information." dialog showing the selected train and passenger. The order is submitted only after the user activates "Confirm" in that dialog. A verified account named "booking_submit_user" with password "Password123!" has a selectable passenger and can reach the confirmation dialog for an available booking.

      Reject booking submission when no passenger is selected and show the message "Please select at least one passenger.".

      Reject booking submission when one selected passenger has a ticket class with no remaining tickets and show the message "Sorry, there are no tickets available for the selected ticket class.".

      Provide order confirmation, payment, and order status transitions. The seeded accounts each have password "Password123!" and separate passengers named "Passenger Example": booking_confirm_user/P20269991, booking_edit_user/P20269992, booking_payment_user/P20269993, booking_cancel_user/P20269994, booking_paid_user/P20269995, booking_unpaid_user/P20269990, booking_upcoming_user/P20269989, and booking_cancelled_user/P20269988. G1001 from Shanghai to Beijing on 2026-07-21 is one shared train service; each booking account has a separate allocation of one business-class seat, rather than a duplicate train record. Orders in these booking flows are created by the scenario actions, not preseeded.

      After the user submits booking information, open a confirmation dialog with the title "Please confirm the following information.", show the train information and passenger information, and provide the buttons "Confirm" and "Edit". Clicking "Confirm" confirms the order information and shows a successful submission message. Clicking "Edit" returns to the booking information page. ![image](./reference/booking-confirm.png) Separate verified accounts named "booking_confirm_user" and "booking_edit_user", each with password "Password123!", have a selectable frequent passenger and can book an available Shanghai-to-Beijing train.



      Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-8.3.1
      name: Validate booking and open confirmation
      type: ATOMIC
      dependencies:
      - REQ-8.2.2.1
      description: |-
        "Place order"(role=button) validates selected passengers and class inventory. Missing passengers and sold-out classes are rejected without confirmation; valid selection opens "Please confirm the following information."(role=dialog) with the selected train, passenger, "Confirm"(role=button), and "Edit"(role=button). Merely opening it creates no order. Available Standing ticket is valid and its selected class remains visible; only Confirm submits.
      data:
        requires:
        - DATA-ORDERS
        - DATA-SELECTION
      scenarios:
      - name: Open confirmation for available seat
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is booking_submit_user with
            passport P20269998.
        - keyword: WHEN
          content: Check Passenger Example, select Business-class seat in its row and click Place order.
        - keyword: THEN
          content: Please confirm the following information. (dialog) identifies G1001 and Passenger Example and exposes
            Confirm and Edit.
      - name: Reject no passenger
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
            Example has passport P20269997. No passenger is selected.
        - keyword: WHEN
          content: Click Place order.
        - keyword: THEN
          content: Please select at least one passenger. appears and confirmation does not open.
      - name: Reject unavailable ticket class
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
            Example has passport P20269997. G1001 has no second-class seats.
        - keyword: WHEN
          content: Check Passenger Example, select Second-class seat in its row and click Place order.
        - keyword: THEN
          content: Sorry, there are no tickets available for the selected ticket class. appears and confirmation does
            not open.
      - name: Accept available standing ticket
        steps:
        - keyword: GIVEN
          content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
            using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
            searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. The account is bookable_user and Passenger
            Example has passport P20269997. G1001 has available standing inventory.
        - keyword: WHEN
          content: Check Passenger Example, select Standing ticket in its row and click Place order.
        - keyword: THEN
          content: Confirmation identifies G1001, Passenger Example and Standing ticket; the no-tickets error is absent.
    - id: REQ-8.3.2
      name: Confirm an order or return to edit
      type: FOLDER
      dependencies:
      - REQ-8.3.1
      description: In the valid confirmation dialog, Confirm submits the selected journey/passenger and opens matching
        payment details with Order submitted successfully. Edit closes the dialog and returns to the booking form
        without creating an order.
      children:
      - id: REQ-8.3.2.1
        name: Confirm a selected booking order
        type: ATOMIC
        dependencies:
        - REQ-8.3.1
        description: |-
          In "Please confirm the following information."(role=dialog), "Confirm"(role=button) submits the selected train and passenger and opens payment with matching details and successful-submission feedback. "Edit"(role=button) remains the alternative editing action; the parent capability's full submission contract applies.
        data:
          requires:
          - DATA-ORDERS
          - DATA-SELECTION
        scenarios:
        - name: Confirm order and reach payment
          steps:
          - keyword: GIVEN
            content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
              using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
              searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. booking_confirm_user has selected Passenger
              Example/P20269991 and Business-class seat and opened confirmation through Place order.
          - keyword: WHEN
            content: Click Confirm within Please confirm the following information..
          - keyword: THEN
            content: Order submitted successfully. appears and Order details identifies the same G1001 and Passenger Example.
      - id: REQ-8.3.2.2
        name: Return from confirmation to edit
        type: ATOMIC
        dependencies:
        - REQ-8.3.1
        description: |-
          In "Please confirm the following information."(role=dialog), "Edit"(role=button) closes confirmation and returns to booking rather than invoking "Confirm"(role=button). No order is submitted or added to Uncompleted orders; shared editing rules apply.
        data:
          requires:
          - DATA-ORDERS
          - DATA-SELECTION
        scenarios:
        - name: Edit without submitting
          steps:
          - keyword: GIVEN
            content: The stated user has signed in with Password123!, created Passenger Example through the passenger UI
              using China, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040,
              searched Shanghai–Beijing for 2026-07-21 and clicked Book in G1001. booking_edit_user has selected Passenger
              Example/P20269992 and Business-class seat and opened confirmation through Place order.
          - keyword: WHEN
            content: Click Edit in confirmation, inspect the restored booking page, then open Uncompleted orders through
              My 12306.
          - keyword: THEN
            content: 'Confirmation closes; Train Information: and Place order return; Uncompleted orders contains no G1001
              order.'
  - id: REQ-8.4
