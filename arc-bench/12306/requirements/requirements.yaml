children:
- id: REQ-1
  name: Public entry
  type: FOLDER
  dependencies: []
  description: |-
    Public entry capability.

    Action controls are buttons, navigation destinations are links, and choice controls expose combobox, radio, or checkbox semantics as declared. Selected tabs expose selected state. Forms have associated labels and retain source placeholders; visible collections contain only current results.
  children:
  - id: REQ-1.1
    name: Explore homepage and banner carousel
    type: ATOMIC
    dependencies: []
    description: |-
      The default landing page shows a 12306 logo on the left and "Login"(role=link), "Register"(role=link), and "My 12306"(role=link) on the right. Navigation offers "Home"(role=link), "Booking"(role=link), and "Travel guide"(role=link), with dropdown entries where specified. "Home banners"(role=region) initially shows Banner 1; "Next banner"(role=button) displays Banner 2 and then Banner 3. Images expose those names; source assets/logo.png and assets/banner1.jpg through banner3.jpg describe visual roles without mandating network URLs. "Ticket search"(role=region) contains "From"(role=textbox) and "To"(role=textbox) with their source placeholders, "Date"(role=textbox), and "Search"(role=button). "Quick Guide"(role=region) supplies quick links including How to book tickets online? and More.

      ![image](./reference/homepage.png)
    data:
      requires: []
    scenarios:
    - name: Browse public homepage
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: Inspect the homepage and click Next banner twice within Home banners.
      - keyword: THEN
        content: The 12306 logo, Login, Register, My 12306 and Home/Booking/Travel guide navigation are visible; Banner
          1 changes to Banner 2 then Banner 3; Ticket search exposes From, To, Date and enabled Search, and Quick Guide
          exposes How to book tickets online? and More.
- id: REQ-2
  name: Account access
  type: FOLDER
  dependencies: []
  description: |-
    Account access capability.
  children:
  - id: REQ-2.1
    name: Register and validate a traveler account
    type: FOLDER
    dependencies: []
    description: |-
      Allow a user to create an account by filling in identity and contact information, agreeing to the service terms, and submitting the registration form.

      Open the registration page from the "Register" link in the top-right area of the home page.

      Display the registration form with a dropdown labeled "Nationality" showing the default value "Please select" and country options, input fields labeled "Name", "Passport number", "Username", and "Email address", date pickers labeled "Passport expiration date" and "Date of birth", a radio group labeled "Gender" with "Male" and "Female", password fields labeled "Password" and "Confirm Password", a checkbox followed by "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn.", and a "Register" button. ![image](./reference/register.png)

      The registration form allows a new user to select Nationality "China", enter Name, Passport number, Passport expiration date, Date of birth, Username, Password, Confirm Password, and Email address in labeled controls, select a Gender radio and the agreement checkbox, then activate the "Register" button. A successful submission persists the account and displays "Registration successful.". The passport number and username must be unique.

      Reject registration when any required field is missing and show the message "Please fill in all required fields.".

      Reject registration when the passport number already exists and show the message "Passport number already exists.". The system contains an existing account record with ID number "P20260002".

      Reject registration when the username already exists and show the message "Username already exists.". The system contains an existing account record with username "username_taken".

      Reject registration when the values in "Password" and "Confirm Password" do not match and show the message "Passwords do not match.".

      Reject registration when the email address format is invalid and show the message "Invalid email address format.".

      Reject registration when the agreement checkbox is not selected and show the message "Please agree to the Terms of Service and Privacy Policy.".



      Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

      Confirm Password is a required registration field independently of Password; an empty confirmation uses the missing-required-fields error.
    children:
    - id: REQ-2.1.1
      name: Create a traveler account
      type: ATOMIC
      dependencies: []
      description: |-
        Clicking "Register"(role=link) opens traveler registration with "Nationality"(role=combobox), "Name"(role=textbox), "Passport number"(role=textbox), "Passport expiration date"(role=textbox), "Date of birth"(role=textbox), "Gender"(role=group), "Username"(role=textbox), "Password"(role=textbox), "Confirm Password"(role=textbox), and "Email address"(role=textbox). Users provide valid identity and credential values, accept "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn."(role=checkbox), and click "Register"(role=button). Registration creates and persists that identity, whose saved credentials authenticate the same account. The parent capability's full registration rules apply.
      data:
        requires:
        - DATA-ACCOUNTS-CREATED
      scenarios:
      - name: Create durable account
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. Username
            traveler_new, email traveler_new@example.com and passport P20260001 are unused.
        - keyword: WHEN
          content: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept the Terms
            of Service and Privacy Policy checkbox. Enter Passport number P20260001, Username traveler_new and Email address
            traveler_new@example.com, then click Register. Return Home, sign out if signed in, reload, use Login to submit
            traveler_new / Password123!, then reload again.
        - keyword: THEN
          content: Registration successful. is displayed; the saved credentials sign in after reload, and Sign Out remains
            visible after the second reload.
    - id: REQ-2.1.2
      name: Reject invalid traveler registration
      type: ATOMIC
      dependencies: []
      description: |-
        After "Register"(role=link) opens registration, users complete "Nationality"(role=combobox), "Name"(role=textbox), "Passport number"(role=textbox), "Passport expiration date"(role=textbox), "Date of birth"(role=textbox), "Gender"(role=group), "Username"(role=textbox), "Password"(role=textbox), "Confirm Password"(role=textbox), "Email address"(role=textbox), and "I have read and agree to abide by Terms of Service and Privacy Policy of 12306.cn."(role=checkbox). "Register"(role=button) rejects missing, duplicate, mismatched, invalid, or unaccepted information with the parent capability's declared errors, retains the form, and creates no account.
      data:
        requires:
        - DATA-ACCOUNTS-CREATED
      scenarios:
      - name: Reject missing fields
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register and click its Register button without filling the form.
        - keyword: THEN
          content: Please fill in all required fields. appears; Username remains visible and Registration successful.
            is absent.
      - name: Reject duplicate passport
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Through Register create existing_passport with passport P20260002 and email existing_passport@example.com
            using the valid identity fields and Password123!; return Home and sign out if needed. Reopen Register, Select
            China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31, Date of birth 1996-06-18,
            select Male, enter Password and Confirm Password Password123!, and accept the Terms of Service and Privacy
            Policy checkbox. enter the same passport P20260002, Username duplicate_passport_user and Email address duplicate_passport_user@example.com,
            and submit Register.
        - keyword: THEN
          content: Passport number already exists. appears; the registration form remains and no success feedback is shown
            for the duplicate attempt.
      - name: Reject duplicate username
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Create username_taken through Register with passport P20260104 and email username_taken@example.com
            using valid identity data and Password123!; return Home and sign out if needed. Reopen Register, Select China
            in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31, Date of birth 1996-06-18, select
            Male, enter Password and Confirm Password Password123!, and accept the Terms of Service and Privacy Policy
            checkbox. enter passport P20260004, the existing Username username_taken and Email address username_taken@example.com,
            and click Register.
        - keyword: THEN
          content: Username already exists. appears; Username remains on the form and the duplicate attempt shows no registration
            success.
      - name: Reject password mismatch
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept the Terms
            of Service and Privacy Policy checkbox. Enter passport P20260007, Username traveler_mismatch and Email address
            traveler_mismatch@example.com; replace Confirm Password with Password123!Mismatch and submit Register.
        - keyword: THEN
          content: Passwords do not match. appears; Username remains visible and no registration success is shown.
      - name: Reject invalid email
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept the Terms
            of Service and Privacy Policy checkbox. Enter passport P20260008, Username traveler_invalid_email and Email
            address invalid-email, then submit Register.
        - keyword: THEN
          content: Invalid email address format. appears; the form remains and no registration success is shown.
      - name: Require agreement acceptance
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register and fill China, Test Traveler, passport P20260009, expiration 2026-12-31, birth 1996-06-18,
            Male, Username traveler_agreement, matching Password123! values and email traveler_agreement@example.com;
            leave the agreement unchecked and click Register.
        - keyword: THEN
          content: Please agree to the Terms of Service and Privacy Policy. appears; the form remains without registration
            success.
      - name: Reject missing confirmation password
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register. Select China in Nationality, enter Name Test Traveler, Passport expiration date 2026-12-31,
            Date of birth 1996-06-18, select Male, enter Password and Confirm Password Password123!, and accept the Terms
            of Service and Privacy Policy checkbox. Enter passport P20260015, Username traveler_missing_confirm and email
            traveler_missing_confirm@example.com; clear Confirm Password and click Register.
        - keyword: THEN
          content: Please fill in all required fields. appears; Confirm Password remains visible and registration success
            is absent.
  - id: REQ-2.2
    name: Log in with username email or mobile
    type: FOLDER
    dependencies: []
    description: |-
      Allow a user to log in with a username, email address, or mobile number and a password. The system contains the verified account registered_user with username "registered_user", email "registered_user@example.com", mobile number "13800000010", ID number "P20260010", and password "Password123!".

      Open the login page from the "Login" link in the top-right area of the home page.

      Display the login form with an input field whose placeholder is "Email/Username/Mobile number", a password input whose placeholder is "Password", and a "LOGIN" button. ![image](./reference/login.png)

      The login form accepts a verified username, email address, or mobile number in its "Email/Username/Mobile number" field and a password in its "Password" field. Activating the "LOGIN" button with valid credentials persists the session, displays a status message containing "Login successful", and exposes a "Sign Out" link. The seeded account "registered_user" has password "Password123!".

      Reject login when the account field or password field is empty and show the message "Please enter your username/email/phone number and password.".

      Reject login when the entered username, email address, or mobile number does not exist and show the message "User not found.".

      Reject login when the password is incorrect and show the message "Incorrect password.".

      Provide a link with the text "No account yet? Register now." on the login page and navigate to the registration page after it is clicked.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-2.2.1
      name: Authenticate traveler credentials
      type: ATOMIC
      dependencies: []
      description: |-
        "Login"(role=link) opens credential login. A logged-out traveler enters a username, email, or mobile in "Email/Username/Mobile number"(role=textbox), enters "Password"(role=textbox), and clicks "LOGIN"(role=button). Correct credentials establish the same account's persisted session; incorrect credentials leave the user logged out under the capability's declared errors. Either missing account or missing password independently triggers the required-credentials error, even if the other field is supplied.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
        - DATA-SESSION
      scenarios:
      - name: Authenticate by username email and mobile
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. The
            verified registered_user identity has email registered_user@example.com, mobile 13800000010 and password Password123!.
        - keyword: WHEN
          content: For each of registered_user, registered_user@example.com and 13800000010, open Login, enter the identity
            and Password123! and click LOGIN; reload after each successful login and then click Sign Out before trying
            the next identity.
        - keyword: THEN
          content: Each identity displays Login successful and Sign Out persists after reload; each sign-out restores
            Login and removes Sign Out.
      - name: Reject empty credentials
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Login, leave Email/Username/Mobile number and Password empty and click LOGIN.
        - keyword: THEN
          content: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
      - name: Reject unknown account
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. unknown_account
            does not exist.
        - keyword: WHEN
          content: Open Login, enter unknown_account and Password123!, and click LOGIN.
        - keyword: THEN
          content: User not found. appears and Sign Out remains unavailable.
      - name: Reject wrong password
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. registered_user
            exists with Password123!.
        - keyword: WHEN
          content: Open Login, enter registered_user and WrongPassword123!, and click LOGIN.
        - keyword: THEN
          content: Incorrect password. appears and Sign Out remains unavailable.
      - name: Reject missing password
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. registered_user
            exists.
        - keyword: WHEN
          content: Open Login, enter registered_user, leave Password empty and click LOGIN.
        - keyword: THEN
          content: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
      - name: Reject missing account
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Login, leave Email/Username/Mobile number empty, enter Password123! in Password and click LOGIN.
        - keyword: THEN
          content: Please enter your username/email/phone number and password. appears and Sign Out remains unavailable.
    - id: REQ-2.2.2
      name: Open registration from login
      type: ATOMIC
      dependencies: []
      description: |-
        From login, "No account yet? Register now."(role=link) opens registration with Nationality, Passport number, and Register available. Navigation alone creates no account.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
        - DATA-SESSION
      scenarios:
      - name: Open registration from login
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Login, then activate No account yet? Register now.
        - keyword: THEN
          content: Registration opens with Nationality, Passport number and Register visible.
  - id: REQ-2.3
    name: Sign out and clear session
    type: ATOMIC
    dependencies:
    - REQ-2.2.1
    description: |-
      Successful login replaces the top Register entry with "Sign Out"(role=link). Clicking it clears persisted authentication, displays successful logout feedback, and restores "Register"(role=link) and "Login"(role=link) in place of Sign Out and the username.
    data:
      requires:
      - DATA-SESSION
    scenarios:
    - name: Clear persisted login
      steps:
      - keyword: GIVEN
        content: registered_user has signed in through Login with Password123! and Sign Out is visible.
      - keyword: WHEN
        content: Click Sign Out, inspect logout feedback, then reload.
      - keyword: THEN
        content: Logout successful. appears; after reload Login and Register are visible and Sign Out is unavailable.
  - id: REQ-2.4
    name: Recover password through identity verification
    type: ATOMIC
    dependencies: []
    description: |-
      "Forgot password?"(role=link) opens two-step recovery. Users enter "Email:"(role=textbox) and "ID number:"(role=textbox), then click "submit"(role=button) to verify a registered identity. Each value is individually required: a missing value shows Please enter your email and ID number.; a mismatch shows Email address and ID number do not match. Successful verification opens "New password:"(role=textbox) and "Confirm new password:"(role=textbox), submitted through the same named submit action. Matching replacement values persist and show successful reset feedback; unequal values show Passwords do not match. without changing credentials. The reset_user identity is reset_user@example.com/P20260011 with Password123!; independent reset_mismatch_user is reset_mismatch_user@example.com/P20260012 with Password123!.

      ![image](./reference/forgot-password.png)
    data:
      requires:
      - DATA-VERIFIED-ACCOUNTS
    scenarios:
    - name: Reset password and authenticate
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. reset_user
          has email reset_user@example.com and passport P20260011.
      - keyword: WHEN
        content: 'Open Login then Forgot password?; enter Email: reset_user@example.com and ID number: P20260011 and
          click submit. Enter Password123!X in both New password: and Confirm new password: and submit; return Home
          and log in as reset_user with Password123!X.'
      - keyword: THEN
        content: Verification opens the replacement-password fields; Password reset successful. appears and the replacement
          password signs in, exposing Sign Out.
    - name: Reject missing identity
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: 'Open Login then Forgot password?, leave Email: and ID number: empty and click submit.'
      - keyword: THEN
        content: 'Please enter your email and ID number. appears and New password: is not exposed.'
    - name: Reject mismatched identity
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. P20260011
          belongs to reset_user@example.com.
      - keyword: WHEN
        content: 'Open Forgot password? from Login, enter Email: wrong@example.com and ID number: P20260011 and click
          submit.'
      - keyword: THEN
        content: 'Email address and ID number do not match. appears and New password: is not exposed.'
    - name: Reject new password mismatch
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. reset_mismatch_user
          has email reset_mismatch_user@example.com, passport P20260012 and password Password123!.
      - keyword: WHEN
        content: 'Verify that email/passport through Forgot password?; enter New password: Password123!X and Confirm
          new password: Password123!Y and submit. Return Home and log in as reset_mismatch_user with the original Password123!.'
      - keyword: THEN
        content: 'Passwords do not match. appears and New password: remains visible; the original password still authenticates
          the account.'
    - name: Reject missing recovery email
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: 'Open Forgot password? from Login, leave Email: empty, enter ID number: P20260011 and click submit.'
      - keyword: THEN
        content: 'Please enter your email and ID number. appears; Email: remains visible and New password: is not exposed.'
    - name: Reject missing recovery ID
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: 'Open Forgot password? from Login, enter Email: reset_user@example.com, leave ID number: empty and
          click submit.'
      - keyword: THEN
        content: 'Please enter your email and ID number. appears; Email: remains visible and New password: is not exposed.'
  - id: REQ-2.5
    name: Read registration agreements
    type: FOLDER
    dependencies: []
    description: |-
      Provide access to the agreement content from the registration page and require acceptance before registration can be completed.

      The registration page exposes exactly one agreement link named "Terms of Service". Activating it displays a page with a visible heading named "Terms of Service". ![image](./reference/rule.png)

      The registration page exposes exactly one agreement link named "Privacy Policy". Activating it displays a page with a visible heading named "Privacy Policy". ![image](./reference/policy.png)



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-2.5.1
      name: Read Terms of Service
      type: ATOMIC
      dependencies: []
      description: |-
        Users open registration through "Register"(role=link), then follow its unique "Terms of Service"(role=link) to display the agreement heading. Reading the agreement does not submit registration.
      data:
        requires: []
      scenarios:
      - name: Read Terms of Service
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register, then activate the unique Terms of Service link.
        - keyword: THEN
          content: The Terms of Service heading is visible.
    - id: REQ-2.5.2
      name: Read Privacy Policy
      type: ATOMIC
      dependencies: []
      description: |-
        Users open registration through "Register"(role=link), then follow its unique "Privacy Policy"(role=link) to display that agreement heading without submitting registration.
      data:
        requires: []
      scenarios:
      - name: Read Privacy Policy
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Register, then activate the unique Privacy Policy link.
        - keyword: THEN
          content: The Privacy Policy heading is visible.
- id: REQ-3
  name: Train search
  type: FOLDER
  dependencies: []
  description: |-
    Train search capability.

    Train numbers in results are independently identifiable visible text.
  children:
  - id: REQ-3.1
    name: Choose locations and departure date
    type: FOLDER
    dependencies: []
    description: |-
      Provide a ticket search module on the home page with input placeholders "From", "To", and "Date", and a "Search" button. The station directory contains the valid locations "Shanghai", "Beijing", "Yancheng", and "Lhasa", including the related stations "Shanghai Hongqiao" and "Beijing South".

      The public homepage contains exactly one textbox with placeholder "From", one textbox with placeholder "To", one date input with accessible name "Date", and one enabled button named "Search".

      The "From" textbox supports pinyin and Chinese queries. Typing "shang" or "上海" exposes a list headed "Top destinations" containing exactly one selectable button named "Shanghai (上海)"; selecting it fills "Shanghai" in the textbox. ![image](./reference/location-selector-list.png)

      Focusing the "From" textbox opens a location selector with tabs "Popular", "ABCDE", "FGHIJ", "KLMNO", "PQRST", and "UVWXYZ". The "ABCDE" tab contains exactly one selectable button named "Beijing (北京)"; selecting it fills "Beijing" in "From". ![image](./reference/location-selector-form.png)

      The homepage exposes a date input labelled "Date". Focusing it opens a date picker with date buttons named by their full YYYY-MM-DD dates. The picker accepts dates from 2026-07-21 through 2026-08-04. Submitting 2026-07-20 in "Date" displays "Please choose a departure date from 2026-07-21 through 2026-08-04." ![image](./reference/date-selector.png)

      The same location selector semantics apply to To. Date range is inclusive; validation of an out-of-range date precedes empty-location errors in the source date scenario. Exact date-picker buttons are public semantics.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-3.1.1
      name: Choose a departure location
      type: ATOMIC
      dependencies: []
      description: |-
        On public search, "From"(role=textbox) supports station selection through pinyin, Chinese, or alphabetical browsing. "Popular"(role=tab), "ABCDE"(role=tab), "FGHIJ"(role=tab), "KLMNO"(role=tab), "PQRST"(role=tab), and "UVWXYZ"(role=tab) provide the declared groups; matching suggestions such as "Shanghai (上海)"(role=button) and "Beijing (北京)"(role=button) are unique. Choosing a station fills its canonical English city name.
      data:
        requires:
        - DATA-STATIONS
      scenarios:
      - name: Choose Shanghai using pinyin and Chinese
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Enter shang in From, choose Shanghai (上海), then repeat with 上海 and choose the same suggestion.
        - keyword: THEN
          content: Each query shows Top destinations and exactly one Shanghai (上海) button; choosing it sets From to canonical
            Shanghai.
      - name: Choose Beijing from alphabetical selector
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Click From, inspect Popular/ABCDE/FGHIJ/KLMNO/PQRST/UVWXYZ tabs, select ABCDE and click Beijing (北京).
        - keyword: THEN
          content: The tabs are visible; Beijing (北京) is unique in the selected group and From becomes Beijing.
    - id: REQ-3.1.2
      name: Choose and validate departure date
      type: ATOMIC
      dependencies: []
      description: |-
        Opening "Date"(role=textbox) exposes full-date choices, including "2026-07-21"(role=button), which fills the selected date. The sale window July 21 through August 4 is inclusive. "Search"(role=button) rejects dates outside that window with the declared message and retains the homepage form.
      data:
        requires:
        - DATA-STATIONS
      scenarios:
      - name: Select departure date
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Open Date and click the full-date button 2026-07-21.
        - keyword: THEN
          content: Date contains 2026-07-21.
      - name: Reject past date
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Enter 2026-07-20 in Date and click Search.
        - keyword: THEN
          content: Please choose a departure date from 2026-07-21 through 2026-08-04. appears and Ticket search remains
            visible.
      - name: Reject date beyond sale window
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Enter 2026-08-05 in Date and click Search.
        - keyword: THEN
          content: Please choose a departure date from 2026-07-21 through 2026-08-04. appears and Ticket search remains
            visible.
  - id: REQ-3.2
    name: Search direct trains and reject incomplete route
    type: ATOMIC
    dependencies:
    - REQ-3.1.1
    - REQ-3.1.2
    description: |-
      Users choose locations in "From"(role=textbox) and "To"(role=textbox), set "Date"(role=textbox), and click "Search"(role=button). Shanghai–Beijing on 2026-07-21 opens results preserving those inputs, the route summary Shanghai (上海) - Beijing (北京), and a visible count, including G1001. Empty From shows Please enter a valid departure place. even when the other criteria are valid; empty To likewise shows Please enter a valid arrival place. Results remain below homepage navigation and provide "Travel dates"(role=region) with full YYYY-MM-DD actions, "Filter"(role=region), booking actions, and columns Train No., Departure Time, Travel time, Arrival Time, and Price. Published matches on the current and following day include distinct types, times, durations, prices, stations, and inventory, covering G/C/D and Other, Shanghai Hongqiao departure, Beijing South arrival, and 06:00-12:00 departures. Business-class, First-class, Second-class, and Standing ticket prices and both available and unavailable inventories remain observable. The default Beijing–Shanghai route is also populated for the current date.

      ![image](./reference/search-result.png)
      ![image](./reference/search-result.png)
    data:
      requires:
      - DATA-STATIONS
      - DATA-TIMETABLE
    scenarios:
    - name: Show matching trains and preserve criteria
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. The
          published timetable contains G1001, G1002 and K1003 for Shanghai–Beijing on July 21.
      - keyword: WHEN
        content: Enter shang in From and choose Shanghai (上海), enter bei in To and choose Beijing (北京), open Date and
          choose 2026-07-21, then click Search.
      - keyword: THEN
        content: From/To/Date preserve Shanghai/Beijing/2026-07-21; Shanghai (上海) - Beijing (北京) and 3 results appear
          with exactly G1001, G1002 and K1003; Travel dates, Filter and Train No./Departure Time/Travel time/Arrival
          Time/Price columns are visible.
    - name: Reject empty From
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: Leave From empty, choose Beijing (北京) for To, choose Date 2026-07-21 and click Search.
      - keyword: THEN
        content: Please enter a valid departure place. appears and Ticket search remains visible.
    - name: Reject empty To
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
      - keyword: WHEN
        content: Choose Shanghai (上海) for From, leave To empty, choose Date 2026-07-21 and click Search.
      - keyword: THEN
        content: Please enter a valid arrival place. appears and Ticket search remains visible.
  - id: REQ-3.3
    name: Inspect fares and empty direct route
    type: FOLDER
    dependencies:
    - REQ-3.2
    description: |-
      Each train row has a "Price" cell with seat type, price and a corresponding "Book" button. The seeded train "G1001" on the Shanghai-to-Beijing route shows the Second-class seat price as CNY 576 (the same fare displayed as ￥576.0 on its booking form, even though no second-class seats remain) and has an enabled "Book" button in its row because other seat classes are available.

      The valid Shanghai-to-Lhasa route has no direct trains on 2026-07-21. Its results page preserves the search fields, shows a visible image named "No trains", the exact count "0 results", and the message "sorry, according to your inquiry condition, there is no train at present.".



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-3.3.1
      name: Inspect a fare and booking availability
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        After a direct search, users inspect G1001's second-class fare CNY 576 despite its unavailable second-class inventory. "Book"(role=button) remains enabled because another class has seats.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Show fare with bookable other class
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. G1001 has no second-class seats but another class has inventory.
        - keyword: WHEN
          content: Inspect G1001 and its Book action.
        - keyword: THEN
          content: G1001 displays Second-class seat and CNY 576; Book remains enabled because another class is available.
    - id: REQ-3.3.2
      name: Observe a route without direct trains
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Searching valid Shanghai–Lhasa on July 21 retains the selected criteria and displays No trains, 0 results, and the declared empty-result message without direct-train rows.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Show no direct trains
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. No
            direct Shanghai–Lhasa services are published for July 21.
        - keyword: WHEN
          content: Choose Shanghai (上海) in From and Lhasa (拉萨) in To, select Date 2026-07-21 and click Search.
        - keyword: THEN
          content: The criteria remain Shanghai/Lhasa/2026-07-21; No trains image, 0 results and sorry, according to your
            inquiry condition, there is no train at present. appear, and no train result rows remain.
  - id: REQ-3.4
    name: Change travel date from results
    type: FOLDER
    dependencies:
    - REQ-3.2
    description: |-
      The results page exposes a date input labelled "Date" and a "Search" button. Searching Shanghai to Beijing for 2026-07-22 replaces the displayed departure date with 2026-07-22 and shows the seeded train "G1001" for that date.

      The "Travel dates" region on the results page contains buttons named by full YYYY-MM-DD dates. Selecting 2026-07-22 updates "Date" and displays the seeded Shanghai-to-Beijing results for 2026-07-22, including train "G1001".



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-3.4.1
      name: Resubmit a changed results-page departure date
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        From populated results, users open "Date"(role=textbox), choose "2026-07-22"(role=button), and click "Search"(role=button). The list is replaced with the matching July 22 services while preserving the route.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Change date using date picker
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. July 22 additionally contains G2002.
        - keyword: WHEN
          content: Open Date, click 2026-07-22 and click Search.
        - keyword: THEN
          content: Date becomes 2026-07-22 and results are replaced by G1001, G1002, K1003 and G2002.
    - id: REQ-3.4.2
      name: Switch date through the travel-date bar
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Clicking "2026-07-22"(role=button) within "Travel dates"(role=region) updates Date and shows that day's services without a second Search action.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Change date using Travel dates
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. July 22 additionally contains G2002.
        - keyword: WHEN
          content: Click 2026-07-22 within Travel dates without another Search click.
        - keyword: THEN
          content: Date becomes 2026-07-22 and results update to G1001, G1002, K1003 and G2002.
  - id: REQ-3.5
    name: Sort direct train results
    type: FOLDER
    dependencies:
    - REQ-3.2
    description: |-
      The "Departure Time" table header contains a button named "Departure Time". Activating it once sorts visible train rows by departure time ascending, and activating it again sorts them descending.

      The "Travel time" table header contains a button named "Travel time". Activating it once sorts visible train rows by travel duration ascending, and activating it again sorts them descending.

      The "Arrival Time" table header contains a button named "Arrival Time". Activating it once sorts visible train rows by arrival time ascending, and activating it again sorts them descending.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-3.5.1
      name: Sort direct trains by departure time
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Clicking "Departure Time"(role=button) on existing direct-train results orders them by published departure time ascending; clicking again reverses the order. Both operations preserve the complete current result set.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Toggle Departure Time sorting
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. Departure times are K1003 00:30, G1001 08:00 and G1002 13:00.
        - keyword: WHEN
          content: Click Departure Time in its columnheader, inspect order, then click it again.
        - keyword: THEN
          content: The first order is K1003, G1001, G1002; the second is G1002, G1001, K1003, retaining all three services.
    - id: REQ-3.5.2
      name: Sort direct trains by travel duration
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Clicking "Travel time"(role=button) orders existing direct results by published duration ascending, and a second click orders them descending, preserving the complete current result set.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Toggle Travel time sorting
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. Durations are G1001 300, G1002 360 and K1003 900 minutes.
        - keyword: WHEN
          content: Click Travel time in its columnheader, inspect order, then click it again.
        - keyword: THEN
          content: The first order is G1001, G1002, K1003; the second is K1003, G1002, G1001, retaining all three services.
    - id: REQ-3.5.3
      name: Sort direct trains by arrival time
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Clicking "Arrival Time"(role=button) orders existing direct results by published arrival time ascending; clicking again orders them descending without changing result membership.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Toggle Arrival Time sorting
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. Arrival times are G1001 13:00, K1003 15:30 and G1002 19:00.
        - keyword: WHEN
          content: Click Arrival Time in its columnheader, inspect order, then click it again.
        - keyword: THEN
          content: The first order is G1001, K1003, G1002; the second is G1002, K1003, G1001, retaining all three services.
  - id: REQ-3.6
    name: Filter train type stations and departure interval
    type: FOLDER
    dependencies:
    - REQ-3.2
    description: |-
      The "Filter" region contains a group named "Train type" with checkboxes "All", "G/C/D", and "Other". Selecting "G/C/D" shows at least one train and restricts visible train numbers to G, C, or D prefixes.

      The "Filter" region contains a combobox labelled "From Station" with options "All" and "Shanghai Hongqiao". Selecting "Shanghai Hongqiao" retains at least one train and only rows departing at that station.

      The "Filter" region contains a combobox labelled "To Station" with options "All" and "Beijing South". Selecting "Beijing South" retains at least one train and only rows arriving at that station.

      The "Filter" region contains a combobox labelled "Departure time" with options "00:00-24:00", "00:00-06:00", "06:00-12:00", "12:00-18:00", and "18:00-24:00". Selecting "06:00-12:00" retains at least one train and only departures from 06:00 through 11:59.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-3.6.1
      name: Filter direct trains by type
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Within "Filter"(role=region) and "Train type"(role=group), selecting "G/C/D"(role=checkbox) retains matching train prefixes and excludes Other. Selecting "Other"(role=checkbox) restricts the list to published non-G/C/D types. "All"(role=checkbox) removes the type restriction and restores both groups for the current route and date. Published matches and nonmatches make each effect observable.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Restrict train type
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003.
        - keyword: WHEN
          content: Check G/C/D within Filter → Train type (group).
        - keyword: THEN
          content: The result set is exactly G1001 and G1002; K1003 is excluded.
      - name: Filter Other train types
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003.
        - keyword: WHEN
          content: Check Other within Filter → Train type (group).
        - keyword: THEN
          content: The result set is exactly K1003; both G trains are excluded.
      - name: Restore all train types
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003.
        - keyword: WHEN
          content: Check G/C/D in Train type, verify the restricted result set, then check All.
        - keyword: THEN
          content: G/C/D first leaves G1001 and G1002; All restores G1001, G1002 and K1003.
    - id: REQ-3.6.2
      name: Filter direct trains by departure station
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Selecting Shanghai Hongqiao in "From Station"(role=combobox) within "Filter"(role=region) retains only services departing from that station, with at least one match remaining.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Filter departure station
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. Only G1001 departs Shanghai Hongqiao.
        - keyword: WHEN
          content: Select Shanghai Hongqiao in From Station within Filter.
        - keyword: THEN
          content: The result set contains exactly G1001.
    - id: REQ-3.6.3
      name: Filter direct trains by arrival station
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Selecting Beijing South in "To Station"(role=combobox) within "Filter"(role=region) retains only services arriving there, preserving at least one matching journey.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Filter arrival station
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003. G1001 and K1003 arrive Beijing South while G1002 arrives Beijing.
        - keyword: WHEN
          content: Select Beijing South in To Station within Filter.
        - keyword: THEN
          content: The result set contains exactly G1001 and K1003.
    - id: REQ-3.6.4
      name: Filter direct trains by departure interval
      type: ATOMIC
      dependencies:
      - REQ-3.2
      description: |-
        Selecting 06:00-12:00 in "Departure time"(role=combobox) within "Filter"(role=region) retains departures from 06:00 through 11:59, including at least one match.
      data:
        requires:
        - DATA-TIMETABLE
      scenarios:
      - name: Filter morning departures
        steps:
        - keyword: GIVEN
          content: The visitor has searched Shanghai to Beijing for 2026-07-21 through From, To, Date and Search; published
            results are G1001, G1002 and K1003.
        - keyword: WHEN
          content: Select 06:00-12:00 in Departure time within Filter.
        - keyword: THEN
          content: The result set contains exactly G1001, departing at 08:00.
  - id: REQ-3.7
    name: Open default ticket search from navigation
    type: ATOMIC
    dependencies:
    - REQ-3.2
    description: |-
      Hovering "Booking"(role=link) in homepage navigation reveals "Tickets"(role=link). Activating Tickets opens populated default Beijing–Shanghai results for 2026-07-21, with From, To, and Date reflecting that route and day.
    data:
      requires:
      - DATA-TIMETABLE
    scenarios:
    - name: Open Tickets quick entry
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. The
          default Beijing–Shanghai timetable contains G3001 on July 21.
      - keyword: WHEN
        content: Hover Booking in navigation and activate Tickets.
      - keyword: THEN
        content: Populated default results include G3001; From is Beijing, To is Shanghai and Date is 2026-07-21.
- id: REQ-4
  name: Transfer discovery
  type: FOLDER
  dependencies: []
  description: |-
    Transfer discovery capability.

    Each transfer article exposes its first-segment train number as independently identifiable visible text.
  children:
  - id: REQ-4.1
    name: Discover feasible transfer plans
    type: ATOMIC
    dependencies:
    - REQ-3.1.1
    - REQ-3.1.2
    description: |-
      When Yancheng–Lhasa on 2026-07-21 has no direct service, "Transfer plans"(role=region) displays exactly the two eligible DATA-TRANSFERS plans, up to a general maximum of ten, initially ordered by total travel time ascending. Each business-identified article shows both segment numbers, stations, departure and arrival times, durations, fares, Transfer waiting, Total travel time: with numeric minutes, and enabled "Book"(role=button). Only transfers waiting at least 30 minutes qualify, excluding D2003/Z23. The Beijing plan uses D2001 Yancheng–Beijing 08:00–12:00 for CNY 200, then a 60-minute wait and Z21 Beijing–Lhasa 13:00–19:00 the following day for CNY 400, totaling 2100 minutes. Plans have differing first departures, second arrivals, and total durations, enabling sorting. No downstream transfer-order submission is specified.
    data:
      requires:
      - DATA-TRANSFERS
    scenarios:
    - name: Show feasible plans and segment details
      steps:
      - keyword: GIVEN
        content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai. DATA-TRANSFERS
          contains the three candidate transfers.
      - keyword: WHEN
        content: Choose Yancheng (盐城) in From and Lhasa (拉萨) in To, choose July 21 in Date and click Search.
      - keyword: THEN
        content: 'No direct result rows remain; Transfer plans shows exactly D2002 then D2001 by total duration, excluding
          D2003. The D2001 article shows Yancheng–Beijing 08:00–12:00 CNY 200, Z21 Beijing–Lhasa 13:00–19:00 CNY 400,
          Transfer waiting 1h 0m, Total travel time: 2100 minutes and enabled Book; D2002 displays its two-hour wait.'
  - id: REQ-4.2
    name: Sort transfer plans
    type: FOLDER
    dependencies:
    - REQ-4.1
    description: |-
      The "Transfer plans" region contains a button named "Departure Time" which sorts plan articles by the first segment departure clock time ascending on the first activation and descending on the second.

      The "Transfer plans" region contains a button named "Travel time" which sorts plan articles by total travel time in minutes ascending on the first activation and descending on the second.

      The "Transfer plans" region contains a button named "Arrival Time" which sorts plan articles by the second segment arrival clock time ascending on the first activation and descending on the second.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-4.2.1
      name: Sort transfer plans by departure time
      type: ATOMIC
      dependencies:
      - REQ-4.1
      description: |-
        In "Transfer plans"(role=region), "Departure Time"(role=button) sorts articles ascending by their first segment's published departure, and a second activation sorts descending. The complete current plan set is retained; arrival comparisons use the second segment's arrival clock and duration comparisons use total minutes.
      data:
        requires:
        - DATA-TRANSFERS
      scenarios:
      - name: Toggle transfer Departure Time
        steps:
        - keyword: GIVEN
          content: The visitor has searched Yancheng to Lhasa for 2026-07-21; no direct trains exist, and eligible plans
            are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. D2002 departs at 06:00
            and D2001 at 08:00.
        - keyword: WHEN
          content: Click Departure Time within Transfer plans, inspect the order, then click again.
        - keyword: THEN
          content: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
    - id: REQ-4.2.2
      name: Sort transfer plans by travel duration
      type: ATOMIC
      dependencies:
      - REQ-4.1
      description: |-
        "Travel time"(role=button) sorts articles in "Transfer plans"(role=region) by total minutes ascending, then descending on a second click, without changing membership. First-segment departure and second-segment arrival clocks remain the corresponding values for the other sorts.
      data:
        requires:
        - DATA-TRANSFERS
      scenarios:
      - name: Toggle transfer Travel time
        steps:
        - keyword: GIVEN
          content: The visitor has searched Yancheng to Lhasa for 2026-07-21; no direct trains exist, and eligible plans
            are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. D2002 totals 2040
            minutes and D2001 2100.
        - keyword: WHEN
          content: Click Travel time within Transfer plans, inspect the order, then click again.
        - keyword: THEN
          content: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
    - id: REQ-4.2.3
      name: Sort transfer plans by arrival time
      type: ATOMIC
      dependencies:
      - REQ-4.1
      description: |-
        "Arrival Time"(role=button) sorts "Transfer plans"(role=region) by the second segment's published arrival clock ascending, then descending, preserving all current plans. Departure refers to the first segment and duration to total minutes.
      data:
        requires:
        - DATA-TRANSFERS
      scenarios:
      - name: Toggle transfer Arrival Time
        steps:
        - keyword: GIVEN
          content: The visitor has searched Yancheng to Lhasa for 2026-07-21; no direct trains exist, and eligible plans
            are D2001/Z21 via Beijing and D2002/Z22 via Xian; D2003/Z23 waits less than 30 minutes. The second segments
            arrive at 16:00 for D2002 and 19:00 for D2001.
        - keyword: WHEN
          content: Click Arrival Time within Transfer plans, inspect the order, then click again.
        - keyword: THEN
          content: The first order is D2002 then D2001; the second is D2001 then D2002, retaining both plans.
- id: REQ-5
  name: Personal center and orders
  type: FOLDER
  dependencies: []
  description: |-
    Personal center and orders capability.
  children:
  - id: REQ-5.1
    name: Enter personal center with access control
    type: FOLDER
    dependencies:
    - REQ-2.2.1
    description: |-
      Provide the personal center home page, order center, personal information pages, account security pages, mobile verification page, passenger management, and quick-entry dropdown navigation.

      Control access to the personal center from the top "My 12306" entry and route the user either to the login page or to the personal center home page. The system contains the verified account personal_center_user with username "personal_center_user", email "personal_center_user@example.com", mobile number "13800000020", and password "Password123!".

      The public homepage exposes a link named "My 12306". Activating it while logged out opens a login page with inputs whose placeholders are "Email/Username/Mobile number" and "Password", and a button named "LOGIN".

      After login, the top link "My 12306" opens the personal center home page. A navigation landmark named "Personal center menu" contains links "Personal Center", "Order center", "Personal", and "Information management". A region named "Notice" displays the account name "personal_center_user" and a visible image named "Notice". ![image](./reference/user-center.png)

      The personal center "Notice" region contains a link named "ticket booking". Activating it opens ticket search results with default conditions Beijing to Shanghai for 2026-07-21 and at least one train row.



      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-5.1.1
      name: Enter personal center according to authentication
      type: ATOMIC
      dependencies:
      - REQ-2.2.1
      description: |-
        Activating "My 12306"(role=link) routes an anonymous visitor to Login and an authenticated traveler to "Personal Center"(role=link) and "Personal center menu"(role=navigation), offering "Order center"(role=link), "Personal"(role=link), and "Information management"(role=link). "Notice"(role=region) displays the correct account identity and Notice image.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
        - DATA-SESSION
      scenarios:
      - name: Intercept logged-out personal center
        steps:
        - keyword: GIVEN
          content: The visitor is logged out on the homepage; the benchmark clock is 2026-07-21 00:00 Asia/Shanghai.
        - keyword: WHEN
          content: Activate My 12306.
        - keyword: THEN
          content: Login opens with Email/Username/Mobile number, Password and LOGIN instead of authenticated personal-center
            content.
      - name: Enter authenticated personal center
        steps:
        - keyword: GIVEN
          content: personal_center_user has signed in through Login with Password123!.
        - keyword: WHEN
          content: Return Home and activate My 12306.
        - keyword: THEN
          content: Personal center menu contains Personal Center, Order center, Personal and Information management; Notice
            displays personal_center_user and its Notice image.
    - id: REQ-5.1.2
      name: Open ticket search from the personal notice
      type: ATOMIC
      dependencies:
      - REQ-5.1.1
      - REQ-3.2
      description: |-
        The authenticated traveler follows "ticket booking"(role=link) within "Notice"(role=region), opening populated default Beijing–Shanghai results for July 21.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
        - DATA-SESSION
      scenarios:
      - name: Book from personal notice
        steps:
        - keyword: GIVEN
          content: personal_center_user has signed in through Login and opened My 12306; Notice is visible.
        - keyword: WHEN
          content: Activate ticket booking within Notice.
        - keyword: THEN
          content: Default results contain G3001 and preserve From Beijing, To Shanghai and Date 2026-07-21.
  - id: REQ-5.2
    name: Browse order categories and empty-state booking routes
    type: FOLDER
    dependencies:
    - REQ-5.1.1
    description: |-
      Provide a "Ticket orders" page under "Order center" with the tabs "Uncompleted orders", "Upcoming trips", and "History orders". ![image](./reference/ticket-orders.png) The orders_empty_user account has no uncompleted orders, upcoming trips, or history orders.

      In the "Personal center menu" navigation, the link "Order center" reveals a link "Ticket orders". Activating it opens a ticket orders view exposing exactly one tab each named "Uncompleted orders", "Upcoming trips", and "History orders". ![image](./reference/ticket-orders.png)

      When the "Uncompleted orders" tab has no order, show the image from "assets/empty.png" with accessible name "No orders" and the text "You don't have uncompleted orders.". ![image](./reference/ticket-orders.png) The system contains the verified account orders_empty_user with username "orders_empty_user", email "orders_empty_user@example.com", and password "Password123!".

      When the "Uncompleted orders" tab is empty, provide the link "You can book your tickets and plan your trips." and navigate to the default ticket search results page after it is clicked.

      When the "Upcoming trips" tab has no order, show the image from "assets/empty.png" with accessible name "No orders" and the text "You don't have any bookings or we can't access your bookings at this time.".

      When the "Upcoming trips" tab is empty, provide the link "You can make travel plans through the ticket reservation function." and navigate to the default ticket search results page after it is clicked.

      When the "History orders" tab has no order, keep a link named "Search tickets" available above the empty state and show the image from "assets/empty.png" with accessible name "No orders" and the text "You don't have any bookings or we can't access your bookings at this time.".

      When the "History orders" tab is empty, provide the link "You can make travel plans through the ticket reservation function." and navigate to the default ticket search results page after it is clicked.

      Also apply Upcoming trips and History orders empty-state rules below. Named tabs expose selected state; only selected order results are visible.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-5.2.1
      name: Explore empty Uncompleted orders
      type: ATOMIC
      dependencies:
      - REQ-5.1.1
      description: |-
        Following "Order center"(role=link) and "Ticket orders"(role=link), users select "Uncompleted orders"(role=tab) under an account with no matching orders. Its declared empty-state image and message include "You can book your tickets and plan your trips."(role=link), which opens default ticket results. Preserve all three distinct order tabs and the selected-category state.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
      scenarios:
      - name: Show empty Uncompleted orders
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open.
        - keyword: WHEN
          content: Select Uncompleted orders (tab).
        - keyword: THEN
          content: All three order tabs remain unique; Uncompleted orders is selected and No orders image and You don't
            have uncompleted orders. message are visible.
      - name: Search from empty Uncompleted orders
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open. Uncompleted orders is selected.
        - keyword: WHEN
          content: Activate You can book your tickets and plan your trips.
        - keyword: THEN
          content: Default Beijing–Shanghai results open with July 21 criteria and G3001.
    - id: REQ-5.2.2
      name: Explore empty Upcoming trips
      type: ATOMIC
      dependencies:
      - REQ-5.1.1
      description: |-
        From "Order center"(role=link) and "Ticket orders"(role=link), selecting "Upcoming trips"(role=tab) with no matching orders displays its declared empty-state image and message. "You can make travel plans through the ticket reservation function."(role=link) opens default ticket results. All three category tabs remain distinct and expose selection.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
      scenarios:
      - name: Show empty Upcoming trips
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open.
        - keyword: WHEN
          content: Select Upcoming trips (tab).
        - keyword: THEN
          content: All three order tabs remain unique; Upcoming trips is selected and No orders image and You don't have
            any bookings or we can't access your bookings at this time. are visible.
      - name: Search from empty Upcoming trips
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open. Upcoming trips is selected.
        - keyword: WHEN
          content: Activate You can make travel plans through the ticket reservation function.
        - keyword: THEN
          content: Default Beijing–Shanghai results open with July 21 criteria and G3001.
    - id: REQ-5.2.3
      name: Explore empty History orders
      type: ATOMIC
      dependencies:
      - REQ-5.1.1
      description: |-
        Following "Order center"(role=link) and "Ticket orders"(role=link) to "History orders"(role=tab) with no matching orders displays the declared empty-state image, message, and booking entry. "Search tickets"(role=link) remains available above that state and opens default ticket results. Preserve the three distinct tabs and selected-category state.
      data:
        requires:
        - DATA-VERIFIED-ACCOUNTS
      scenarios:
      - name: Show empty History orders
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open.
        - keyword: WHEN
          content: Select History orders (tab).
        - keyword: THEN
          content: All three order tabs remain unique; History orders is selected, No orders image and the no-bookings
            message are visible, and Search tickets remains available.
      - name: Search from empty History orders
        steps:
        - keyword: GIVEN
          content: orders_empty_user has signed in with Password123! and owns no unpaid, upcoming or historical orders;
            My 12306 → Order center → Ticket orders is open. History orders is selected.
        - keyword: WHEN
          content: Activate You can make travel plans through the ticket reservation function.
        - keyword: THEN
          content: Default Beijing–Shanghai results open with July 21 criteria and G3001.
  - id: REQ-5.3
    name: Inspect and resume unpaid orders
    type: FOLDER
    dependencies:
    - REQ-8.3.2.1
    - REQ-5.1.1
    description: |-
      Display a table in "Uncompleted orders" where each row represents one passenger order, and transfer tickets are grouped together. The table has column headers "Train No.", "Departure date", "Departure station", "Arrival station", and "Operation"; it may also show passenger, seat, price, status, and total-price details. Each order group has a "Pay" button. ![image](./reference/uncompleted-orders.png) The verified account orders_unpaid_user with password "Password123!" has an unpaid order for train G1001 from Shanghai to Beijing, with passenger, seat, price, total price, and status information. The order is displayed as a row in the table.

      The G1001 unpaid order for orders_unpaid_user exposes a "Pay" button in its row. Activating it opens a payment page with the G1001 order, a visible region named "Order details", and a visible region named "Payment information".

      Allow the user to click the "Pay" button for one unpaid order in the "Uncompleted orders" tab and open the order payment page with a visible "Order details" area.

      Source unpaid example is created through booking UI in each case, not seeded. Group transfer tickets by journey; each passenger-order row is scoped by train and passenger business identity.

      Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.
    children:
    - id: REQ-5.3.1
      name: Inspect unpaid ticket orders
      type: ATOMIC
      dependencies:
      - REQ-8.3.2.1
      - REQ-5.1.1
      description: |-
        Opening Uncompleted orders shows the UI-created unpaid G1001 row with route and the parent capability's required headers. Its "Pay"(role=button) provides payment access; matching "Order details"(role=region) and "Payment information"(role=region) identify the same unpaid order under the shared contract.
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Inspect unpaid order table
        steps:
        - keyword: GIVEN
          content: orders_unpaid_user has created an unpaid G1001 order for 2026-07-21 through the passenger, search,
            booking and confirmation UI. Through UI, sign in with Password123!, create Passenger Example using Add new
            passengers with China, a distinct passport, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
            and 13800000040; search Shanghai–Beijing for the stated date, click Book on the stated train, check Passenger
            Example, select Business-class seat in that passenger row, click Place order and Confirm.
        - keyword: WHEN
          content: Open My 12306 → Order center → Ticket orders and select Uncompleted orders.
        - keyword: THEN
          content: Train No., Departure date, Departure station, Arrival station and Operation headers appear; G1001 displays
            Shanghai and Beijing with a Pay button.
    - id: REQ-5.3.2
      name: Resume an unpaid order payment
      type: ATOMIC
      dependencies:
      - REQ-5.3.1
      description: |-
        Clicking "Pay"(role=button) on the identified unpaid G1001 order opens matching "Order details"(role=region) and "Payment information"(role=region), applying the parent capability's payment and identity rules.
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Resume payment by order identity
        steps:
        - keyword: GIVEN
          content: orders_unpaid_user has created an unpaid G1001 order for 2026-07-21 through the passenger, search,
            booking and confirmation UI. Through UI, sign in with Password123!, create Passenger Example using Add new
            passengers with China, a distinct passport, expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com
            and 13800000040; search Shanghai–Beijing for the stated date, click Book on the stated train, check Passenger
            Example, select Business-class seat in that passenger row, click Place order and Confirm. Uncompleted orders
            is selected.
        - keyword: WHEN
          content: Click Pay within the G1001 row.
        - keyword: THEN
          content: Order details identifies G1001 and Payment information is visible for the resumed unpaid order.
  - id: REQ-5.4
    name: Filter and inspect upcoming trips
    type: FOLDER
    dependencies:
    - REQ-8.5
    - REQ-5.1.1
    description: |-
      The "Upcoming trips" tab has an "Order date type" combobox with "Search by booking date" and "Search by departure date", "Start date" and "End date" inputs accepting YYYY-MM-DD, and a "Search" button. The orders_upcoming_user account has one paid G1001 upcoming order departing on 2026-07-22, within the 2026-07-21 to 2026-08-21 filter range.

      The "Upcoming trips" tab has an input with exact placeholder "Order number/train number/name" and a "Search" button. The search uses both the date filter and fuzzy keyword. The orders_upcoming_user account has the same paid G1001 order departing on 2026-07-22; entering "***" is invalid and displays "Please enter a valid search condition.".

      Display the "Upcoming trips" orders in a table with column headers "Train No.", "Departure date", "Departure station", "Arrival station", and "Operation"; passenger, seat, price, status, and total-price details may also be shown. Transfer tickets are grouped together. ![image](./reference/uncompleted-orders.png) The verified account orders_upcoming_user with password "Password123!" has a paid upcoming order for train G1001 with a future departure date and an unexpired refund deadline. The G1001 table row contains a "Refund" button.

      Create and pay July 22 G1001 via UI for each case. Date and keyword filters intersect; a nonmatching date or keyword must exclude this order.

      Initial-world clarification: existing duplicate accounts, extra frequent passengers, and current unpaid/paid/cancelled orders mentioned above are scenario preconditions established through the declared UI creation flows. Only verified accounts and historical completed orders are initially seeded. Source identities, fields and messages remain unchanged.

      When filters leave no displayed orders, show the No orders empty-state image for the selected category.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-5.4.1
      name: Inspect upcoming trips
      type: ATOMIC
      dependencies:
      - REQ-8.5
      - REQ-5.1.1
      description: |-
        Opening Upcoming trips displays the declared order-table headers and account-owned details. An eligible paid upcoming G1001 offers "Refund"(role=button).
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Inspect upcoming table
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Inspect the G1001 order table.
        - keyword: THEN
          content: Train No., Departure date, Departure station, Arrival station and Operation headers are visible and
            G1001 offers Refund.
    - id: REQ-5.4.2
      name: Search upcoming trips by date and keyword
      type: ATOMIC
      dependencies:
      - REQ-5.4.1
      description: |-
        On Upcoming trips, users choose "Order date type"(role=combobox), enter an inclusive interval in "Start date"(role=textbox) and "End date"(role=textbox), optionally enter a fuzzy business keyword in "Order number/train number/name"(role=textbox), and click "Search"(role=button). Date and keyword constraints intersect, excluding nonmatches and displaying the category's empty-state image when none remain. Booking-date mode compares order creation dates rather than departure dates. Keyword *** shows the declared invalid-search error.
      data:
        requires:
        - DATA-ORDERS
      scenarios:
      - name: Search by departure range
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Select Search by departure date in Order date type, enter Start date 2026-07-21 and End date 2026-08-21,
            leave the keyword empty and click Search.
        - keyword: THEN
          content: G1001 remains visible because July 22 lies within the inclusive range.
      - name: Intersect departure range and keyword
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-21 through 2026-08-21 and keyword G1001 in Order
            number/train number/name, then click Search.
        - keyword: THEN
          content: G1001 remains visible because both date and keyword match.
      - name: Exclude nonmatching date range
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-23 through 2026-08-21 and keyword G1001, then
            click Search.
        - keyword: THEN
          content: No orders image appears and G1001 is absent despite its matching keyword.
      - name: Exclude nonmatching keyword
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-21 through 2026-08-21 and keyword Z9999, then
            click Search.
        - keyword: THEN
          content: No orders image appears and G1001 is absent despite its matching date.
      - name: Reject invalid upcoming keyword
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips.
        - keyword: WHEN
          content: Enter *** in Order number/train number/name and click Search.
        - keyword: THEN
          content: Please enter a valid search condition. appears.
      - name: Search by booking date
        steps:
        - keyword: GIVEN
          content: orders_upcoming_user has created G1001 for departure 2026-07-22 through UI and completed Pay. Through
            UI, sign in with Password123!, create Passenger Example using Add new passengers with China, a distinct passport,
            expiration 2027-12-31, birth 2000-01-15, Female, Adult, passenger@example.com and 13800000040; search Shanghai–Beijing
            for the stated date, click Book on the stated train, check Passenger Example, select Business-class seat in
            that passenger row, click Place order and Confirm. Open My 12306 → Order center → Ticket orders and select
            Upcoming trips. The order was created on the benchmark date July 21.
        - keyword: WHEN
          content: Select Search by booking date in Order date type, set both Start date and End date to 2026-07-21, enter
            keyword G1001 and click Search.
        - keyword: THEN
          content: G1001 remains visible based on its July 21 creation date although it departs July 22.
  - id: REQ-5.5
    name: Refund eligible upcoming order
    type: ATOMIC
    dependencies:
    - REQ-8.5
    - REQ-5.1.1
    description: |-
      The verified orders_refund_user with Password123! creates and pays for G2002 departing 2026-07-22 through UI; its service and refund deadline 2026-07-22T00:00:00+08:00 are published seed facts. "Refund"(role=button) on the upcoming order opens "Refund information"(role=region) identifying G2002 and Refund amount. "Confirm refund"(role=button) displays Refund successful, changes that order to refunded, and provides "View History orders"(role=link) to history containing G2002. Refunded status persists after reload. Current orders and extra passengers are UI-established preconditions; only verified accounts and completed historical orders are seeded, with source identities, fields, and messages preserved.
    data:
      requires:
      - DATA-ORDERS
      - DATA-TIMETABLE
    scenarios:
    - name: Refund and inspect history
      steps:
      - keyword: GIVEN
        content: orders_refund_user has created and paid for G2002 departing 2026-07-22 through UI before its refund
          deadline; Upcoming trips is selected. Through UI, sign in with Password123!, create Passenger Example using
          Add new passengers with China, a distinct passport, expiration 2027-12-31, birth 2000-01-15, Female, Adult,
          passenger@example.com and 13800000040; search Shanghai–Beijing for the stated date, click Book on the stated
          train, check Passenger Example, select Business-class seat in that passenger row, click Place order and Confirm.
      - keyword: WHEN
        content: Click Refund within G2002, inspect Refund information, click Confirm refund, activate View History
          orders, then reload.
      - keyword: THEN
        content: Refund information identifies G2002 and Refund amount; Refund successful appears; G2002 is refunded
          in History orders and remains refunded after reload.
  - id: REQ-5.6
    name: Open refund category from Booking navigation
    type: ATOMIC
    dependencies:
    - REQ-5.1.1
    description: |-
      Hovering "Booking"(role=link) on the homepage reveals "Refund"(role=link). For an authenticated user, following it opens the personal-center order view with Upcoming trips selected.
    data:
      requires: []
    scenarios:
    - name: Open Upcoming trips through Refund quick entry
