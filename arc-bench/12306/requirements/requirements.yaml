  - id: REQ-5.7
    name: Filter and inspect historical orders
    type: FOLDER
    dependencies:
    - REQ-5.1.1
    description: |-
      The "History orders" tab has an "Order date type" combobox with "Search by booking date" and "Search by departure date", labelled "Start date" and "End date" inputs accepting YYYY-MM-DD, and a "Search" button. The orders_history_user account has one completed G1001 order departing on 2026-07-19, within the 2026-07-19 to 2026-07-21 filter range.

      The "History orders" tab has a search input with exact placeholder "Order number/train number/name" and a "Search" button. Search combines the selected departure date range with a fuzzy keyword. The orders_history_user account has the same completed G1001 order departing on 2026-07-19. The keyword "***" is invalid and displays "Please enter a valid search condition.".

      The "History orders" table has column headers "Train Information", "Passenger Information", "Seat Information", "Price", "Status", and "Total Price". Transfer tickets are grouped together. ![image](./reference/uncompleted-orders.png) The verified account orders_history_user with password "Password123!" has a completed historical order for train G1001, with passenger, seat, price, total price, status, and departure date 2026-07-19. The order is shown as a row in this table.



      When filters leave no displayed orders, show the No orders empty-state image for the selected category.

      This capability preserves the original requirement ID and shared source contract. Its children each describe a complete, independently observable user behavior; scenario setup does not depend on other tests having run.
    children:
    - id: REQ-5.7.1
      name: Inspect historical orders
      type: ATOMIC
      dependencies:
      - REQ-5.1.1
      description: |-
        Opening historical orders displays the declared headers and matching order details. Historical G1001 is completed and belongs to the authenticated account.
      data:
        requires:
        - DATA-HISTORY
      scenarios:
      - name: Inspect completed historical order
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Inspect the historical order table and G1001 row.
        - keyword: THEN
          content: Train Information, Passenger Information, Seat Information, Price, Status and Total Price headers appear,
            and G1001 has completed status.
    - id: REQ-5.7.2
      name: Search historical orders by date and keyword
      type: ATOMIC
      dependencies:
      - REQ-5.7.1
      description: |-
        On History orders, users choose "Order date type"(role=combobox), supply "Start date"(role=textbox) and "End date"(role=textbox), optionally enter "Order number/train number/name"(role=textbox), and click "Search"(role=button). The inclusive date and fuzzy keyword constraints intersect; nonmatches are excluded and an empty result displays the category's declared image. Booking-date mode compares creation dates rather than departures, and *** shows the declared invalid-search error.
      data:
        requires:
        - DATA-HISTORY
      scenarios:
      - name: Search history departure range
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Select Search by departure date, enter Start date 2026-07-19 and End date 2026-07-21, clear the keyword
            and click Search.
        - keyword: THEN
          content: G1001 remains visible, including the lower-bound July 19 departure.
      - name: Intersect history date and keyword
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-19 through 2026-07-21 and keyword G1001, then
            click Search.
        - keyword: THEN
          content: G1001 remains visible because both criteria match.
      - name: Exclude history outside date range
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-20 through 2026-07-21 and keyword G1001, then
            click Search.
        - keyword: THEN
          content: No orders image appears and G1001 is excluded despite its matching keyword.
      - name: Exclude history nonmatching keyword
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Select Search by departure date, enter range 2026-07-19 through 2026-07-21 and keyword Z9999, then
            click Search.
        - keyword: THEN
          content: No orders image appears and G1001 is excluded despite its matching date.
      - name: Reject invalid history keyword
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Enter *** in Order number/train number/name and click Search.
        - keyword: THEN
          content: Please enter a valid search condition. appears.
      - name: Search by booking date
        steps:
        - keyword: GIVEN
          content: orders_history_user has signed in with Password123! and opened My 12306 → Order center → Ticket orders
            → History orders; its seeded G1001 was booked July 18, departed July 19 and is completed.
        - keyword: WHEN
          content: Select Search by booking date, set both date boundaries to 2026-07-18, enter keyword G1001 and click
            Search.
        - keyword: THEN
          content: G1001 remains visible based on its July 18 creation date rather than its July 19 departure.
  - id: REQ-5.8
