  children:
  - id: REQ-8.1
    name: Intercept booking and expose quick-login routes capability
    description:
      text: >-
        A signed-out traveler who chooses Book sees a quick-login dialog before booking. The dialog shows the
        12306 icon and a Login heading, an account field accepting username, email or mobile number, a password
        field and a login action. It offers password recovery and registration from the same dialog.
