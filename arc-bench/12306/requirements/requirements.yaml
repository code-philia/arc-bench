        name: Dismiss order-center cancellation
        steps:
        - id: STEP-REQ-8.8.2-01-01
          Given: >-
            orders_unpaid_dismiss_user has created Passenger Example/P20269801 and confirmed an unpaid G1001
            business-class order through booking; Uncompleted orders is open.
          When: Click Cancel within G1001 and then Cancel within Are you sure you want to cancel this order?.
